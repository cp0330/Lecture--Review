<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSIT881 · 第二轮闭卷自测</title>
  <meta name="description" content="CSIT881 考点自测、课程案例、变式和闭卷作业。">
  <link rel="stylesheet" href="style.css?v=2">
  <script src="app.js?v=2" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="back-link" href="../">Lecture Review</a>
      <span>CSIT881 / Programming and Data Structures</span>
    </div>
  </header>
  <main class="shell">
    <section class="intro" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">第二轮闭卷自测</h1>
        <p>按考点选题。独立提交后再看答案，作答记录保存在当前浏览器。</p>
      </div>
      <div id="totals" class="totals" aria-label="练习进度"></div>
    </section>
    <div class="workspace">
      <aside class="bank" aria-labelledby="bank-title">
        <h2 id="bank-title">考点与练习</h2>
        <div class="filters">
          <label for="search">搜索</label>
          <input id="search" type="search" placeholder="考点、题名或编号">
          <label>考点<select id="topic"><option value="">所有考点</option></select></label>
          <div class="filter-row">
            <label>题型<select id="kind">
              <option value="">全部</option>
              <option value="Program">完整程序</option>
              <option value="Function">函数或类</option>
              <option value="Trace">过程推演</option>
              <option value="Reorder">代码拖放</option>
            </select></label>
            <label>练习<select id="practice">
              <option value="">全部</option>
              <option value="source">课程案例与原题</option>
              <option value="variant">变式与短练习</option>
            </select></label>
          </div>
          <label>状态<select id="status">
            <option value="">全部</option>
            <option value="unseen">待测</option>
            <option value="independent">独立通过</option>
            <option value="assisted">提示后通过</option>
            <option value="review">待复测</option>
          </select></label>
        </div>
        <p class="result-count" id="count" role="status"></p>
        <nav id="question-list" class="question-list" aria-label="筛选后的题目"></nav>
      </aside>
      <div class="work-area">
        <article class="question" id="question" aria-label="当前题目">
          <p id="load-message" role="status">正在加载题库…</p>
        </article>
        <nav id="question-navigation" class="question-navigation" aria-label="上一题与下一题">
          <button type="button" id="previous" disabled>← 上一题</button>
          <button type="button" id="next" disabled>下一题 →</button>
        </nav>
      </div>
    </div>
  </main>
  <noscript>此题库需要启用 JavaScript。</noscript>
  <footer class="shell footer"><a href="https://github.com/cp0330/Lecture--Review/tree/main/CSIT881">题库来源与验证记录</a></footer>
</body>
</html>
