ependently written from the reviewed course topics; not an original examination question Public edition: example names, contact details and password literals anonymized.","origin":"Supplementary practice","priority":"core","question":"User user u at localhost has SELECT on csit882.* directly. The user also has an active role r that grants SELECT on csit882.Workshop. There are no other privilege sources. The database contains exactly the seven workshop tables shown in the shared definition.\n\n(1) Someone attempts REVOKE SELECT ON csit882.Workshop FROM 'u'@'localhost'. Can this make Workshop unreadable? Explain the relevant privilege sources.\n(2) Write statements as root to make Workshop unreadable to u while preserving read access to the other six tables. Preserve role r and its privileges for other users.\n(3) In a separate scenario, a newly created user v has only SELECT WITH GRANT OPTION on csit882.Workshop. Revoke only v's right to propagate SELECT while preserving v's own SELECT privilege.","answer":"(1) 不能。u的直接读取权限来自整个数据库csit882.*，不是某一张表的直接授权；角色r还提供另一条读取来源。表级REVOKE可能因不存在对应直接授权而失败。即使有表级授权可撤，数据库级权限和角色权限仍不会因此消失。普通REVOKE不是优先覆盖所有授权的“禁止”规则。\n\n(2) 撤销u的数据库级SELECT，并只撤销u与r的成员关系，再分别授回其他六张表的SELECT。这样保留r和它对其他用户的作用。\n\n(3) 对独立场景中的v，只撤销GRANT OPTION，保留SELECT。\n\n以上按题目给定的普通权限模型处理，不额外假设启用了partial_revokes等功能，也不将表级REVOKE当作通用的拒绝规则。\n\n\n```sql\n-- (2) remove the two SELECT sources for u\nREVOKE SELECT ON csit882.* FROM 'u'@'localhost';\nREVOKE 'r' FROM 'u'@'localhost';\n\n-- grant back only the other six tables\nGRANT SELECT ON csit882.Participant TO 'u'@'localhost';\nGRANT SELECT ON csit882.Qualification TO 'u'@'localhost';\nGRANT SELECT ON csit882.Requirement TO 'u'@'localhost';\nGRANT SELECT ON csit882.Trainer TO 'u'@'localhost';\nGRANT SELECT ON csit882.Enrolment TO 'u'@'localhost';\nGRANT SELECT ON csit882.WorkshopTrainer TO 'u'@'localhost';\n\n-- (3) keep SELECT, remove GRANT OPTION\nREVOKE GRANT OPTION ON csit882.Workshop FROM 'v'@'localhost';\n```","context":"","canonical":null,"parts":[{"number":"1","goal":"追踪有效权限的所有来源","steps":["u直接拥有数据库级SELECT。","活跃role r还给Workshop SELECT。","表级REVOKE既不撤上层数据库权限，也不撤role，甚至会因不存在表级直接grant而失败。"],"check":"不能把普通REVOKE当覆盖其他来源的DENY。","pitfall":"“这张表没直接grant”不等于“用户无权限”。","code":""},{"number":"2","goal":"只对u禁读Workshop且保留其他六表","steps":["撤销u的csit882.* SELECT。","撤销u的role r成员资格，不修改r本身。","对其他六张表逐一授回SELECT，不对Workshop授回。"],"check":"其他role成员不受影响，u仍能读六表。","pitfall":"去改role r的SELECT会影响其他用户。","code":"```sql\nREVOKE SELECT ON csit882.* FROM 'u'@'localhost';\nREVOKE 'r' FROM 'u'@'localhost';\n\n-- grant back only the other six tables\nGRANT SELECT ON csit882.Participant TO 'u'@'localhost';\nGRANT SELECT ON csit882.Qualification TO 'u'@'localhost';\nGRANT SELECT ON csit882.Requirement TO 'u'@'localhost';\nGRANT SELECT ON csit882.Trainer TO 'u'@'localhost';\nGRANT SELECT ON csit882.Enrolment TO 'u'@'localhost';\nGRANT SELECT ON csit882.WorkshopTrainer TO 'u'@'localhost';\n```"},{"number":"3","goal":"只撤传播权，保留自身读取权","steps":["本小题是独立新用户v场景。","使用REVOKE GRANT OPTION ON csit882.Workshop FROM v。","不要连SELECT一起REVOKE，后者会剥夺自身读取。"],"check":"v可以SELECT，但不能再授予同项privilege。","pitfall":"对象GRANT OPTION不等同role的ADMIN OPTION。","code":"```sql\nREVOKE GRANT OPTION ON csit882.Workshop FROM 'v'@'localhost';\n```"}],"tags":["REVOKE and multiple effective privilege sources"],"questionHTML":"\u003cp>User user u at localhost has SELECT on csit882.* directly. The user also has an active role r that grants SELECT on csit882.Workshop. There are no other privilege sources. The database contains exactly the seven workshop tables shown in the shared definition.\u003c/p>\n\u003cp>(1) Someone attempts REVOKE SELECT ON csit882.Workshop FROM &#39;u&#39;@&#39;localhost&#39;. Can this make Workshop unreadable? Explain the relevant privilege sources.\n(2) Write statements as root to make Workshop unreadable to u while preserving read access to the other six tables. Preserve role r and its privileges for other users.\n(3) In a separate scenario, a newly created user v has only SELECT WITH GRANT OPTION on csit882.Workshop. Revoke only v&#39;s right to propagate SELECT while preserving v&#39;s own SELECT privilege.\u003c/p>\n","answerHTML":"\u003cp>(1) 不能。u的直接读取权限来自整个数据库csit882.*，不是某一张表的直接授权；角色r还提供另一条读取来源。表级REVOKE可能因不存在对应直接授权而失败。即使有表级授权可撤，数据库级权限和角色权限仍不会因此消失。普通REVOKE不是优先覆盖所有授权的“禁止”规则。\u003c/p>\n\u003cp>(2) 撤销u的数据库级SELECT，并只撤销u与r的成员关系，再分别授回其他六张表的SELECT。这样保留r和它对其他用户的作用。\u003c/p>\n\u003cp>(3) 对独立场景中的v，只撤销GRANT OPTION，保留SELECT。\u003c/p>\n\u003cp>以上按题目给定的普通权限模型处理，不额外假设启用了partial_revokes等功能，也不将表级REVOKE当作通用的拒绝规则。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- (2) remove the two SELECT sources for u\nREVOKE SELECT ON csit882.* FROM &#39;u&#39;@&#39;localhost&#39;;\nREVOKE &#39;r&#39; FROM &#39;u&#39;@&#39;localhost&#39;;\n\n-- grant back only the other six tables\nGRANT SELECT ON csit882.Participant TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.Qualification TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.Requirement TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.Trainer TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.Enrolment TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.WorkshopTrainer TO &#39;u&#39;@&#39;localhost&#39;;\n\n-- (3) keep SELECT, remove GRANT OPTION\nREVOKE GRANT OPTION ON csit882.Workshop FROM &#39;v&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"},{"id":"L01","title":"Row functions and group functions","topic":"Row functions and group functions","areas":["SELECT"],"source":"lecture-select","sourceLabel":"SELECT lectures","sourceNote":"SELECT statement (1).pdf pp19,21,24. English tasks reproduced with line breaks normalized.","origin":"Lecture questions","priority":"core","question":"Using the lecture DEPARTMENT and COURSE tables, write SELECT statements for these lecture questions.\n\n(1) List the names of departments in uppercase format.\n\n(2) Find the first three characters from all course codes and full titles of all courses.\n\n(3) Display the name of departments and budgets increased by 10%.\n\n(4) Find the total number of all staff members in all departments.\n\n(5) Find the total number of staff members in the largest department.\n\n(6) How many days have passed since 1 January 2001?","answer":"这些题分别练习row functions、算术表达式、group functions和日期函数。这里的DEPARTMENT.budget允许NULL，和其他讲义里不可空的版本不同。\n\n```sql\n-- (1)\nSELECT UPPER(name) AS departmentName FROM DEPARTMENT;\n-- (2)\nSELECT SUBSTR(cnum, 1, 3) AS prefix, title FROM COURSE;\n-- (3) Follow the lecture's explicit IFNULL convention for missing budget.\nSELECT name, 1.10 * IFNULL(budget, 0) AS increasedBudget FROM DEPARTMENT;\n-- (4)\nSELECT SUM(total_staff_number) AS totalStaff FROM DEPARTMENT;\n-- (5)\nSELECT MAX(total_staff_number) AS largestDepartment FROM DEPARTMENT;\n-- (6)\nSELECT DATEDIFF(CURRENT_DATE(), '2001-01-01') AS daysPassed;\n```\n\n(3)是SELECT，显示增加后的数值，不会把budget改写回表。课件用IFNULL把缺失预算按0显示；这是课件示例的处理约定，不能推广成“未知金额总等于0”。(4)是人数总和，不是部门数；(5)是最大人数，不是最大部门名。(6)的结果随运行日期变化，不在答案中写死天数。","context":"lecture","canonical":null,"parts":[{"number":"1","goal":"对每行部门名使用UPPER","steps":["row function按每行调用，不需要GROUP BY。","SELECT UPPER(name)改变结果显示大小写。","没有UPDATE，底表名字不改变。"],"check":"返回所有部门的变换后名称。","pitfall":"不要把每个部门名改写回数据库。","code":"```sql\nSELECT UPPER(name) AS departmentName FROM DEPARTMENT;\n```"},{"number":"2","goal":"取课程号前三字符并保留全标题","steps":["SUBSTR从位置1开始。","长度参数为3，得到课程号前缀。","title原样另列，不对title截断。"],"check":"PHYS101前缀为PHY。","pitfall":"不要误取3个之后的字符。","code":"```sql\nSELECT SUBSTR(cnum, 1, 3) AS prefix, title FROM COURSE;\n```"},{"number":"3","goal":"显示预算提高10%的计算结果","steps":["预算列在这个lecture schema中允许NULL。","课件例子明确用IFNULL(budget,0)再乘1.10。","这只是SELECT表达式，没有UPDATE。"],"check":"1000显示1100；NULL按课件示例约定显示0。","pitfall":"不要把这种显示约定推广成所有未知金额都等于0。","code":"```sql\nSELECT name, 1.10 * IFNULL(budget, 0) AS increasedBudget FROM DEPARTMENT;\n```"},{"number":"4","goal":"求全体部门职员总数","steps":["total_staff_number才是人数。","SUM逐行加总，不按部门分组。","COUNT(*)得到的是部门数，不是员工总数。"],"check":"fixture得到35。","pitfall":"不要COUNT(total_staff_number)只数非空部门行。","code":"```sql\nSELECT SUM(total_staff_number) AS totalStaff FROM DEPARTMENT;\n```"},{"number":"5","goal":"求最大部门的职员人数","steps":["MAX作用于人数列。","返回一个聚合数值。","题目未要求部门名，不随意SELECT一个未分组name。"],"check":"fixture得到20。","pitfall":"MAX(name)按字符比较，与人数无关。","code":"```sql\nSELECT MAX(total_staff_number) AS largestDepartment FROM DEPARTMENT;\n```"},{"number":"6","goal":"求日期差","steps":["结束日期是运行当天CURRENT_DATE()。","开始日期为2001-01-01。","DATEDIFF返回天数；结果随运行日期变化。"],"check":"不把某一天的测试输出写成永远固定答案。","pitfall":"日期不能当普通整数相减。","code":"```sql\nSELECT DATEDIFF(CURRENT_DATE(), '2001-01-01') AS daysPassed;\n```"}],"tags":["Row functions, strings, arithmetic and dates","COUNT, SUM, AVG and MAX"],"questionHTML":"\u003cp>Using the lecture DEPARTMENT and COURSE tables, write SELECT statements for these lecture questions.\u003c/p>\n\u003cp>(1) List the names of departments in uppercase format.\u003c/p>\n\u003cp>(2) Find the first three characters from all course codes and full titles of all courses.\u003c/p>\n\u003cp>(3) Display the name of departments and budgets increased by 10%.\u003c/p>\n\u003cp>(4) Find the total number of all staff members in all departments.\u003c/p>\n\u003cp>(5) Find the total number of staff members in the largest department.\u003c/p>\n\u003cp>(6) How many days have passed since 1 January 2001?\u003c/p>\n","answerHTML":"\u003cp>这些题分别练习row functions、算术表达式、group functions和日期函数。这里的DEPARTMENT.budget允许NULL，和其他讲义里不可空的版本不同。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nSELECT UPPER(name) AS departmentName FROM DEPARTMENT;\n-- (2)\nSELECT SUBSTR(cnum, 1, 3) AS prefix, title FROM COURSE;\n-- (3) Follow the lecture&#39;s explicit IFNULL convention for missing budget.\nSELECT name, 1.10 * IFNULL(budget, 0) AS increasedBudget FROM DEPARTMENT;\n-- (4)\nSELECT SUM(total_staff_number) AS totalStaff FROM DEPARTMENT;\n-- (5)\nSELECT MAX(total_staff_number) AS largestDepartment FROM DEPARTMENT;\n-- (6)\nSELECT DATEDIFF(CURRENT_DATE(), &#39;2001-01-01&#39;) AS daysPassed;\n\u003c/code>\u003c/pre>\n\u003cp>(3)是SELECT，显示增加后的数值，不会把budget改写回表。课件用IFNULL把缺失预算按0显示；这是课件示例的处理约定，不能推广成“未知金额总等于0”。(4)是人数总和，不是部门数；(5)是最大人数，不是最大部门名。(6)的结果随运行日期变化，不在答案中写死天数。\u003c/p>\n"},{"id":"L02","title":"Intersection and difference queries","topic":"Intersection and difference queries","areas":["SELECT"],"source":"lecture-select","sourceLabel":"SELECT lectures","sourceNote":"SELECT Statement (2).pdf pp13–14; English questions reproduced, including their course terminology.","origin":"Lecture questions","priority":"core","question":"Use the lecture DEPARTMENT and COURSE tables.\n\n(1) Find the credit points that can be earned both for a course offered by Physics and for a course offered by Mathematics.\n\n(2) Find the credit points that can be earned for a course offered by Physics and cannot be earned for a course offered by Mathematics.","answer":"每行结果是一种学分值，不是科目编号。分别求两边的学分集合，再求交集或差集。\n\n```sql\n-- (1)\nSELECT DISTINCT P.credits\nFROM COURSE AS P\nWHERE P.offered_by = 'Physics'\n  AND P.credits IN (\n      SELECT M.credits FROM COURSE AS M WHERE M.offered_by = 'Mathematics'\n  );\n-- (2)\nSELECT DISTINCT P.credits\nFROM COURSE AS P\nWHERE P.offered_by = 'Physics'\n  AND NOT EXISTS (\n      SELECT 1 FROM COURSE AS M\n      WHERE M.offered_by = 'Mathematics' AND M.credits = P.credits\n  );\n```\n\nDISTINCT防止同一学分值因多门课重复出现。测试样例中(1)为6，(2)为12。credits在此schema中NOT NULL，因此课件的NOT IN版本也能使用；对可能含NULL的列，要另外处理三值逻辑。\n\n课件称MySQL不支持INTERSECT/MINUS，不能当作所有版本的现状。当前MySQL文档提供INTERSECT和EXCEPT；本解沿用课件的IN/NOT EXISTS方法，不依赖较新语法。[MySQL set operations](https://dev.mysql.com/doc/refman/8.4/en/set-operations.html)。","context":"lecture","canonical":null,"parts":[{"number":"1","goal":"求Physics与Mathematics学分集合交集","steps":["先筛Physics课程的credits。","IN检查该credits也出现在Mathematics。","DISTINCT消除同一credits的多次课程出现。"],"check":"fixture只有6。","pitfall":"不是找被两部门共同开设的同一课程号。","code":"```sql\nSELECT DISTINCT P.credits\nFROM COURSE AS P\nWHERE P.offered_by = 'Physics'\n  AND P.credits IN (\n      SELECT M.credits FROM COURSE AS M WHERE M.offered_by = 'Mathematics'\n  );\n```"},{"number":"2","goal":"求Physics有而Mathematics没有的学分","steps":["从Physics的credits出发。","相关NOT EXISTS检查Mathematics中没有相同credits。","SELECT DISTINCT输出集合；不依赖MySQL较新EXCEPT语法。"],"check":"fixture只有12。","pitfall":"用JOIN所有不同credits不是集合差集。","code":"```sql\nSELECT DISTINCT P.credits\nFROM COURSE AS P\nWHERE P.offered_by = 'Physics'\n  AND NOT EXISTS (\n      SELECT 1 FROM COURSE AS M\n      WHERE M.offered_by = 'Mathematics' AND M.credits = P.credits\n  );\n```"}],"tags":["UNION, duplicates, intersection and difference"],"questionHTML":"\u003cp>Use the lecture DEPARTMENT and COURSE tables.\u003c/p>\n\u003cp>(1) Find the credit points that can be earned both for a course offered by Physics and for a course offered by Mathematics.\u003c/p>\n\u003cp>(2) Find the credit points that can be earned for a course offered by Physics and cannot be earned for a course offered by Mathematics.\u003c/p>\n","answerHTML":"\u003cp>每行结果是一种学分值，不是科目编号。分别求两边的学分集合，再求交集或差集。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nSELECT DISTINCT P.credits\nFROM COURSE AS P\nWHERE P.offered_by = &#39;Physics&#39;\n  AND P.credits IN (\n      SELECT M.credits FROM COURSE AS M WHERE M.offered_by = &#39;Mathematics&#39;\n  );\n-- (2)\nSELECT DISTINCT P.credits\nFROM COURSE AS P\nWHERE P.offered_by = &#39;Physics&#39;\n  AND NOT EXISTS (\n      SELECT 1 FROM COURSE AS M\n      WHERE M.offered_by = &#39;Mathematics&#39; AND M.credits = P.credits\n  );\n\u003c/code>\u003c/pre>\n\u003cp>DISTINCT防止同一学分值因多门课重复出现。测试样例中(1)为6，(2)为12。credits在此schema中NOT NULL，因此课件的NOT IN版本也能使用；对可能含NULL的列，要另外处理三值逻辑。\u003c/p>\n\u003cp>课件称MySQL不支持INTERSECT/MINUS，不能当作所有版本的现状。当前MySQL文档提供INTERSECT和EXCEPT；本解沿用课件的IN/NOT EXISTS方法，不依赖较新语法。\u003ca href=\"https://dev.mysql.com/doc/refman/8.4/en/set-operations.html\">MySQL set operations\u003c/a>。\u003c/p>\n"},{"id":"L03","title":"Anti-join with a nullable foreign key","topic":"Anti-join with a nullable foreign key","areas":["SELECT"],"source":"lecture-select","sourceLabel":"SELECT lectures","sourceNote":"SELECT Statement (5).pdf p10. The English question is from the lecture; the required NULL case is an explicit verification condition.","origin":"Lecture question + explicit NULL test","priority":"core","question":"Find the chairs of all departments that offer no courses.\n\nUse the lecture DEPARTMENT and COURSE tables. The offered_by column is nullable. Your answer must also work when at least one course has no assigned department.","answer":"“没有开课”要从DEPARTMENT出发，检查不存在引用这个部门的COURSE记录。未分配部门的课程不属于任何具体部门，不应使所有部门都消失。\n\n```sql\nSELECT D.chair\nFROM DEPARTMENT AS D\nWHERE NOT EXISTS (\n    SELECT 1 FROM COURSE AS C WHERE C.offered_by = D.name\n);\n```\n\n测试fixture中Biology没有课程，所以保留它的一行；其chair恰好为NULL，不能因此把部门删掉。课件直接使用name NOT IN (SELECT offered_by FROM COURSE)，当子查询包含NULL时会产生UNKNOWN，导致预期的未开课部门也被过滤。也可先在子查询排除NULL再用NOT IN。","context":"lecture","canonical":null,"parts":[{"number":"1","goal":"在可空foreign key下做正确anti-join","steps":["从DEPARTMENT开始检查每个部门。","子查询用C.offered_by=D.name关联，NOT EXISTS表示完全没有其课程。","NULL offered_by不匹配任何具体部门，也不会毒化整个NOT EXISTS。","对照NOT IN：若其集合含NULL，很多比较成为UNKNOWN，不能直接照抄课件未滤NULL的写法。"],"check":"fixture保留Biology，chair为NULL仍应有一行。","pitfall":"不要因为输出字段chair本身NULL就认为部门不该存在。","code":"```sql\nSELECT D.chair\nFROM DEPARTMENT AS D\nWHERE NOT EXISTS (\n    SELECT 1 FROM COURSE AS C WHERE C.offered_by = D.name\n);\n```"}],"tags":["NULL, empty strings and three-valued logic","Nested queries, EXISTS and anti-joins"],"questionHTML":"\u003cp>Find the chairs of all departments that offer no courses.\u003c/p>\n\u003cp>Use the lecture DEPARTMENT and COURSE tables. The offered_by column is nullable. Your answer must also work when at least one course has no assigned department.\u003c/p>\n","answerHTML":"\u003cp>“没有开课”要从DEPARTMENT出发，检查不存在引用这个部门的COURSE记录。未分配部门的课程不属于任何具体部门，不应使所有部门都消失。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">SELECT D.chair\nFROM DEPARTMENT AS D\nWHERE NOT EXISTS (\n    SELECT 1 FROM COURSE AS C WHERE C.offered_by = D.name\n);\n\u003c/code>\u003c/pre>\n\u003cp>测试fixture中Biology没有课程，所以保留它的一行；其chair恰好为NULL，不能因此把部门删掉。课件直接使用name NOT IN (SELECT offered_by FROM COURSE)，当子查询包含NULL时会产生UNKNOWN，导致预期的未开课部门也被过滤。也可先在子查询排除NULL再用NOT IN。\u003c/p>\n"},{"id":"L04","title":"ALTER, referential actions and TRUNCATE","topic":"ALTER, referential actions and TRUNCATE","areas":["DDL/DML"],"source":"lecture-ddl","sourceLabel":"DDL and advanced DDL/DML","sourceNote":"SQL - Data Definition Language (DDL).pdf pp13,20–26; Advanced DDL and DML statements.pdf pp3–4. Supplementary instructions based on lecture methods.","origin":"Lecture-based supplementary practice","priority":"core","question":"In a separate practice schema, perform the following operations in order. Assume InnoDB tables and enforced CHECK constraints.\n\n(1) Create PracticeParent(id), with id as its primary key, and PracticeChild(id, parentId, qty). PracticeChild.id is its primary key. qty must be positive. parentId references PracticeParent(id), with ON UPDATE CASCADE and ON DELETE CASCADE. Use integer columns; all columns are mandatory.\n\n(2) Insert parent 1 and child 101, belonging to parent 1, with qty = 2.\n\n(3) Change parent 1 to parent 2. Show the child row after the update.\n\n(4) Delete parent 2. Show the child rows after the deletion.\n\n(5) Insert parent 3 and child 102 with qty = 2, then COMMIT. Start a transaction, change the child's qty to 3, TRUNCATE PracticeChild, and ROLLBACK. Show the remaining child rows. Explain the transaction effect.\n\n(6) Add an optional note column of type VARCHAR(100) to PracticeChild, change it to VARCHAR(200), rename the table to PracticeItems, then drop the note column. Finally, drop its foreign key and its CHECK constraint using their actual constraint names. Do not disable foreign-key checks.","answer":"```sql\n-- (1)\nCREATE TABLE PracticeParent (\n    id INT NOT NULL, CONSTRAINT pp_pkey PRIMARY KEY (id)\n) ENGINE=InnoDB;\nCREATE TABLE PracticeChild (\n    id INT NOT NULL, parentId INT NOT NULL, qty INT NOT NULL,\n    CONSTRAINT pc_pkey PRIMARY KEY (id),\n    CONSTRAINT pc_qty_check CHECK (qty > 0),\n    CONSTRAINT pc_parent_fkey FOREIGN KEY (parentId) REFERENCES PracticeParent(id)\n        ON UPDATE CASCADE ON DELETE CASCADE\n) ENGINE=InnoDB;\n-- (2)\nINSERT INTO PracticeParent VALUES (1);\nINSERT INTO PracticeChild VALUES (101, 1, 2);\n-- (3)\nUPDATE PracticeParent SET id = 2 WHERE id = 1;\nSELECT id, parentId, qty FROM PracticeChild;\n-- (4)\nDELETE FROM PracticeParent WHERE id = 2;\nSELECT id, parentId, qty FROM PracticeChild;\n-- (5)\nINSERT INTO PracticeParent VALUES (3);\nINSERT INTO PracticeChild VALUES (102, 3, 2);\nCOMMIT;\nSTART TRANSACTION;\nUPDATE PracticeChild SET qty = 3 WHERE id = 102;\nTRUNCATE TABLE PracticeChild;\nROLLBACK;\nSELECT id, parentId, qty FROM PracticeChild;\n-- (6)\nALTER TABLE PracticeChild ADD COLUMN note VARCHAR(100) NULL;\nALTER TABLE PracticeChild MODIFY COLUMN note VARCHAR(200) NULL;\nALTER TABLE PracticeChild RENAME TO PracticeItems;\nALTER TABLE PracticeItems DROP COLUMN note;\nALTER TABLE PracticeItems DROP FOREIGN KEY pc_parent_fkey;\nALTER TABLE PracticeItems DROP CHECK pc_qty_check;\n```\n\n(3)子记录变为(101,2,2)，因为ON UPDATE CASCADE跟随被引用键变化。(4)子记录也被删除，因为ON DELETE CASCADE已写在这个练习的定义中；不能把该行为套给没有CASCADE的原作业表。\n\n(5)TRUNCATE是DDL，有隐式提交，后面的ROLLBACK不能恢复被清空的子记录，也不能撤回它之前已经隐式提交的更新。TRUNCATE保留表定义，不能带WHERE；它与DELETE和DROP TABLE不同。不要对仍被其他表引用的父表直接照搬TRUNCATE。\n\n(6)使用实际定义的constraint names。原Assignment3对DML不得修改约束的限制仍只在原题对应小题适用，不能拿本题的最后操作去规避原题限制。","context":"","canonical":null,"parts":[{"number":"1","goal":"创建带reference actions的两表","steps":["先建父表PracticeParent。","子表mandatory列、PK、正数CHECK各自定义。","foreign key明确写ON UPDATE CASCADE和ON DELETE CASCADE；这不是所有表默认行为。"],"check":"数据修改会依定义跟随父键变化。","pitfall":"CASCADE不等于关闭约束。","code":"```sql\nCREATE TABLE PracticeParent (\n    id INT NOT NULL, CONSTRAINT pp_pkey PRIMARY KEY (id)\n) ENGINE=InnoDB;\nCREATE TABLE PracticeChild (\n    id INT NOT NULL, parentId INT NOT NULL, qty INT NOT NULL,\n    CONSTRAINT pc_pkey PRIMARY KEY (id),\n    CONSTRAINT pc_qty_check CHECK (qty > 0),\n    CONSTRAINT pc_parent_fkey FOREIGN KEY (parentId) REFERENCES PracticeParent(id)\n        ON UPDATE CASCADE ON DELETE CASCADE\n) ENGINE=InnoDB;\n```"},{"number":"2","goal":"按父子顺序插入","steps":["父记录1先存在。","再插子记录101引用1且qty=2。","检查主键唯一和qty范围。"],"check":"子记录为101,1,2。","pitfall":"先插子行会失败。","code":"```sql\nINSERT INTO PracticeParent VALUES (1);\nINSERT INTO PracticeChild VALUES (101, 1, 2);\n```"},{"number":"3","goal":"更新被引用primary key并观察CASCADE","steps":["定位父id=1。","把父键更新为2。","子表foreign key定义了ON UPDATE CASCADE，因此parentId随之变2。"],"check":"子行101,2,2。","pitfall":"只因为普通FK存在就假设会自动级联。","code":"```sql\nUPDATE PracticeParent SET id = 2 WHERE id = 1;\nSELECT id, parentId, qty FROM PracticeChild;\n```"},{"number":"4","goal":"删除父行并观察CASCADE","steps":["定位父id=2。","ON DELETE CASCADE使对应子记录删除。","检查子表为空，不对另一个无CASCADE场景照搬。"],"check":"没有101这条子行。","pitfall":"题面未给CASCADE时不能自行假设。","code":"```sql\nDELETE FROM PracticeParent WHERE id = 2;\nSELECT id, parentId, qty FROM PracticeChild;\n```"},{"number":"5","goal":"检验TRUNCATE的implicit commit","steps":["重新装载父3和子102并先COMMIT作为初始状态。","显式事务把qty改3，然后TRUNCATE子表。","TRUNCATE隐式提交且清空表，后续ROLLBACK无法恢复这些行。"],"check":"子表仍为空，父表3仍在。","pitfall":"TRUNCATE不能带WHERE；不能把它当可回滚DELETE。","code":"```sql\nINSERT INTO PracticeParent VALUES (3);\nINSERT INTO PracticeChild VALUES (102, 3, 2);\nCOMMIT;\nSTART TRANSACTION;\nUPDATE PracticeChild SET qty = 3 WHERE id = 102;\nTRUNCATE TABLE PracticeChild;\nROLLBACK;\nSELECT id, parentId, qty FROM PracticeChild;\n```"},{"number":"6","goal":"按实际名称ALTER和撤约束","steps":["ADD COLUMN note，再MODIFY其类型，保留NULL条件。","RENAME之后后续语句使用PracticeItems。","DROP COLUMN、DROP FOREIGN KEY、DROP CHECK各用对应语法与真实constraint name。"],"check":"表仍存在，PK仍在，目标列/FK/CHECK按要求移除。","pitfall":"原作业禁止改约束的小题不能借这组方法规避要求。","code":"```sql\nALTER TABLE PracticeChild ADD COLUMN note VARCHAR(100) NULL;\nALTER TABLE PracticeChild MODIFY COLUMN note VARCHAR(200) NULL;\nALTER TABLE PracticeChild RENAME TO PracticeItems;\nALTER TABLE PracticeItems DROP COLUMN note;\nALTER TABLE PracticeItems DROP FOREIGN KEY pc_parent_fkey;\nALTER TABLE PracticeItems DROP CHECK pc_qty_check;\n```"}],"tags":["ALTER add/drop/modify/rename and constraints","Referential actions CASCADE","TRUNCATE, COMMIT, ROLLBACK and implicit commit"],"questionHTML":"\u003cp>In a separate practice schema, perform the following operations in order. Assume InnoDB tables and enforced CHECK constraints.\u003c/p>\n\u003cp>(1) Create PracticeParent(id), with id as its primary key, and PracticeChild(id, parentId, qty). PracticeChild.id is its primary key. qty must be positive. parentId references PracticeParent(id), with ON UPDATE CASCADE and ON DELETE CASCADE. Use integer columns; all columns are mandatory.\u003c/p>\n\u003cp>(2) Insert parent 1 and child 101, belonging to parent 1, with qty = 2.\u003c/p>\n\u003cp>(3) Change parent 1 to parent 2. Show the child row after the update.\u003c/p>\n\u003cp>(4) Delete parent 2. Show the child rows after the deletion.\u003c/p>\n\u003cp>(5) Insert parent 3 and child 102 with qty = 2, then COMMIT. Start a transaction, change the child&#39;s qty to 3, TRUNCATE PracticeChild, and ROLLBACK. Show the remaining child rows. Explain the transaction effect.\u003c/p>\n\u003cp>(6) Add an optional note column of type VARCHAR(100) to PracticeChild, change it to VARCHAR(200), rename the table to PracticeItems, then drop the note column. Finally, drop its foreign key and its CHECK constraint using their actual constraint names. Do not disable foreign-key checks.\u003c/p>\n","answerHTML":"\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nCREATE TABLE PracticeParent (\n    id INT NOT NULL, CONSTRAINT pp_pkey PRIMARY KEY (id)\n) ENGINE=InnoDB;\nCREATE TABLE PracticeChild (\n    id INT NOT NULL, parentId INT NOT NULL, qty INT NOT NULL,\n    CONSTRAINT pc_pkey PRIMARY KEY (id),\n    CONSTRAINT pc_qty_check CHECK (qty &gt; 0),\n    CONSTRAINT pc_parent_fkey FOREIGN KEY (parentId) REFERENCES PracticeParent(id)\n        ON UPDATE CASCADE ON DELETE CASCADE\n) ENGINE=InnoDB;\n-- (2)\nINSERT INTO PracticeParent VALUES (1);\nINSERT INTO PracticeChild VALUES (101, 1, 2);\n-- (3)\nUPDATE PracticeParent SET id = 2 WHERE id = 1;\nSELECT id, parentId, qty FROM PracticeChild;\n-- (4)\nDELETE FROM PracticeParent WHERE id = 2;\nSELECT id, parentId, qty FROM PracticeChild;\n-- (5)\nINSERT INTO PracticeParent VALUES (3);\nINSERT INTO PracticeChild VALUES (102, 3, 2);\nCOMMIT;\nSTART TRANSACTION;\nUPDATE PracticeChild SET qty = 3 WHERE id = 102;\nTRUNCATE TABLE PracticeChild;\nROLLBACK;\nSELECT id, parentId, qty FROM PracticeChild;\n-- (6)\nALTER TABLE PracticeChild ADD COLUMN note VARCHAR(100) NULL;\nALTER TABLE PracticeChild MODIFY COLUMN note VARCHAR(200) NULL;\nALTER TABLE PracticeChild RENAME TO PracticeItems;\nALTER TABLE PracticeItems DROP COLUMN note;\nALTER TABLE PracticeItems DROP FOREIGN KEY pc_parent_fkey;\nALTER TABLE PracticeItems DROP CHECK pc_qty_check;\n\u003c/code>\u003c/pre>\n\u003cp>(3)子记录变为(101,2,2)，因为ON UPDATE CASCADE跟随被引用键变化。(4)子记录也被删除，因为ON DELETE CASCADE已写在这个练习的定义中；不能把该行为套给没有CASCADE的原作业表。\u003c/p>\n\u003cp>(5)TRUNCATE是DDL，有隐式提交，后面的ROLLBACK不能恢复被清空的子记录，也不能撤回它之前已经隐式提交的更新。TRUNCATE保留表定义，不能带WHERE；它与DELETE和DROP TABLE不同。不要对仍被其他表引用的父表直接照搬TRUNCATE。\u003c/p>\n\u003cp>(6)使用实际定义的constraint names。原Assignment3对DML不得修改约束的限制仍只在原题对应小题适用，不能拿本题的最后操作去规避原题限制。\u003c/p>\n"},{"id":"L05","title":"Compare the three generalization methods","topic":"Compare the three generalization methods","areas":["Logical"],"source":"lecture-logical","sourceLabel":"Logical Design","sourceNote":"Logical Design.pdf pp22–27. Class information follows the lecture; comparison instructions added.","origin":"Lecture method comparison","priority":"method","question":"Consider the lecture's generalization:\n\n```text\nSTUDENT: s# [ID], first-name, last-name, dob\nUNDERGRADUATE-STUDENT: project\nPOSTGRADUATE-STUDENT: thesis\n```\n\nAssume each student is exactly one of the two subtypes. Produce relational schemas with primary keys and foreign keys using:\n\n(1) The superset method.\n\n(2) The subset method.\n\n(3) The association method.\n\nExplain where the common attributes and subtype attributes are stored in each method. If an examination question explicitly requires the superset method, which answer must you submit?","answer":"### (1) Superset method\n\n```text\nSTUDENT(s#, first-name, last-name, dob, student-type, project, thesis)\nPRIMARY KEY = (s#)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n```\n\n所有类型放一张表，student-type区分子类；不适用的专有属性为空。原题如果指定superset，必须用此方法。\n\n### (2) Subset method\n\n```text\nUNDERGRADUATE_STUDENT(s#, first-name, last-name, dob, project)\nPRIMARY KEY = (s#)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n\nPOSTGRADUATE_STUDENT(s#, first-name, last-name, dob, thesis)\nPRIMARY KEY = (s#)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n```\n\n只保留子类表，共有属性下移。若s#原本全局唯一，分别在两表定义primary key并不会单独防止跨表重复，仍需维护原类型互斥和全局标识规则。\n\n### (3) Association method\n\n```text\nSTUDENT(s#, first-name, last-name, dob)\nPRIMARY KEY = (s#)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n\nUNDERGRADUATE_STUDENT(s#, project)\nPRIMARY KEY = (s#)\nFOREIGN KEY1 = (s#) REFERENCES STUDENT(s#)\n\nPOSTGRADUATE_STUDENT(s#, thesis)\nPRIMARY KEY = (s#)\nFOREIGN KEY1 = (s#) REFERENCES STUDENT(s#)\n```\n\n共有属性只在父类表，专有属性只在各自子类表。子类的s#同时是primary key和foreign key。普通foreign key本身不能保证每名学生恰好出现在一个子类表中，类型规则需另行维护。","context":"","canonical":null,"parts":[{"number":"1","goal":"用superset处理层次","steps":["把共有属性与project/thesis放入STUDENT一张表。","增加student-type，专有属性在整表可空。","按具体类别保证应有字段填写；原题指定superset时提交此版。"],"check":"只有一张学生表。","pitfall":"不能再保留两子类表当作superset。","code":"```text\nSTUDENT(s#, first-name, last-name, dob, student-type, project, thesis)\nPRIMARY KEY = (s#)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n```"},{"number":"2","goal":"用subset处理层次","steps":["把共有属性复制到两个子类表。","每子类保留自己的project或thesis。","父类表移除；另考虑全局s#与子类互斥，不能由两个独立PK自动保证。"],"check":"只有两个子类表，共有属性在各自表出现。","pitfall":"把这种下移属性的方法和association method混淆。","code":"```text\nUNDERGRADUATE_STUDENT(s#, first-name, last-name, dob, project)\nPRIMARY KEY = (s#)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n\nPOSTGRADUATE_STUDENT(s#, first-name, last-name, dob, thesis)\nPRIMARY KEY = (s#)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n```"},{"number":"3","goal":"用association method处理层次","steps":["STUDENT保留所有共有属性。","每子类只保留s#与专有属性。","子类s#既是PK又是引用STUDENT的FK；父表先定义。"],"check":"三张表，公共属性只存父表一次。","pitfall":"子表FK存在不代表自动保证每人恰落一个子类。","code":"```text\nSTUDENT(s#, first-name, last-name, dob)\nPRIMARY KEY = (s#)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n\nUNDERGRADUATE_STUDENT(s#, project)\nPRIMARY KEY = (s#)\nFOREIGN KEY1 = (s#) REFERENCES STUDENT(s#)\n\nPOSTGRADUATE_STUDENT(s#, thesis)\nPRIMARY KEY = (s#)\nFOREIGN KEY1 = (s#) REFERENCES STUDENT(s#)\n```"}],"tags":["Superset method","Subset and association methods"],"questionHTML":"\u003cp>Consider the lecture&#39;s generalization:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">STUDENT: s# [ID], first-name, last-name, dob\nUNDERGRADUATE-STUDENT: project\nPOSTGRADUATE-STUDENT: thesis\n\u003c/code>\u003c/pre>\n\u003cp>Assume each student is exactly one of the two subtypes. Produce relational schemas with primary keys and foreign keys using:\u003c/p>\n\u003cp>(1) The superset method.\u003c/p>\n\u003cp>(2) The subset method.\u003c/p>\n\u003cp>(3) The association method.\u003c/p>\n\u003cp>Explain where the common attributes and subtype attributes are stored in each method. If an examination question explicitly requires the superset method, which answer must you submit?\u003c/p>\n","answerHTML":"\u003ch3>(1) Superset method\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">STUDENT(s#, first-name, last-name, dob, student-type, project, thesis)\nPRIMARY KEY = (s#)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n\u003c/code>\u003c/pre>\n\u003cp>所有类型放一张表，student-type区分子类；不适用的专有属性为空。原题如果指定superset，必须用此方法。\u003c/p>\n\u003ch3>(2) Subset method\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">UNDERGRADUATE_STUDENT(s#, first-name, last-name, dob, project)\nPRIMARY KEY = (s#)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n\nPOSTGRADUATE_STUDENT(s#, first-name, last-name, dob, thesis)\nPRIMARY KEY = (s#)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n\u003c/code>\u003c/pre>\n\u003cp>只保留子类表，共有属性下移。若s#原本全局唯一，分别在两表定义primary key并不会单独防止跨表重复，仍需维护原类型互斥和全局标识规则。\u003c/p>\n\u003ch3>(3) Association method\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">STUDENT(s#, first-name, last-name, dob)\nPRIMARY KEY = (s#)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n\nUNDERGRADUATE_STUDENT(s#, project)\nPRIMARY KEY = (s#)\nFOREIGN KEY1 = (s#) REFERENCES STUDENT(s#)\n\nPOSTGRADUATE_STUDENT(s#, thesis)\nPRIMARY KEY = (s#)\nFOREIGN KEY1 = (s#) REFERENCES STUDENT(s#)\n\u003c/code>\u003c/pre>\n\u003cp>共有属性只在父类表，专有属性只在各自子类表。子类的s#同时是primary key和foreign key。普通foreign key本身不能保证每名学生恰好出现在一个子类表中，类型规则需另行维护。\u003c/p>\n"},{"id":"L06","title":"Role inheritance and account management","topic":"Role inheritance and account management","areas":["Access"],"source":"lecture-access","sourceLabel":"Discretionary Access Control","sourceNote":"Discretionary Access Control.pdf pp3,23–25. Role hierarchy follows the lecture; account and ADMIN OPTION tasks added explicitly. Public edition: example names, contact details and password literals anonymized.","origin":"Lecture-based supplementary practice","priority":"core","question":"Assume ROLE_USER and the tables ITEM, ORDERS and DISCOUNT already exist in database university. Use the localhost account for ROLE_USER.\n\n(1) Create role CUSTOMER. Grant it SELECT on ITEM, and INSERT, UPDATE and DELETE on ORDERS.\n\n(2) Create role FREQUENT_CUSTOMER. It must inherit CUSTOMER and additionally have INSERT, UPDATE and DELETE on DISCOUNT.\n\n(3) Grant FREQUENT_CUSTOMER to ROLE_USER WITH ADMIN OPTION. Make it ROLE_USER's default role, and show ROLE_USER's grants using this role. Explain whether ADMIN OPTION is the same as GRANT OPTION.\n\n(4) Change ROLE_USER's password to a value of your choice. Then remove this role assignment, drop ROLE_USER, and drop the two roles without dropping any tables.","answer":"```sql\n-- (1)\nCREATE ROLE 'CUSTOMER';\nGRANT SELECT ON university.ITEM TO 'CUSTOMER';\nGRANT INSERT, UPDATE, DELETE ON university.ORDERS TO 'CUSTOMER';\n-- (2)\nCREATE ROLE 'FREQUENT_CUSTOMER';\nGRANT INSERT, UPDATE, DELETE ON university.DISCOUNT TO 'FREQUENT_CUSTOMER';\nGRANT 'CUSTOMER' TO 'FREQUENT_CUSTOMER';\n-- (3)\nGRANT 'FREQUENT_CUSTOMER' TO 'ROLE_USER'@'localhost' WITH ADMIN OPTION;\nSET DEFAULT ROLE 'FREQUENT_CUSTOMER' TO 'ROLE_USER'@'localhost';\nSHOW GRANTS FOR 'ROLE_USER'@'localhost' USING 'FREQUENT_CUSTOMER';\n-- (4)\nALTER USER 'ROLE_USER'@'localhost' IDENTIFIED BY '[CHOOSE_PASSWORD]';\nREVOKE 'FREQUENT_CUSTOMER' FROM 'ROLE_USER'@'localhost';\nDROP USER 'ROLE_USER'@'localhost';\nDROP ROLE 'FREQUENT_CUSTOMER', 'CUSTOMER';\n```\n\nGRANT CUSTOMER TO FREQUENT_CUSTOMER的方向是“高级角色继承普通角色”。反过来写会让普通角色取得不该有的权限。WITH ADMIN OPTION允许再授予role；WITH GRANT OPTION用于再授予对象权限，二者不是同一个授权动作。DROP USER/ROLE不删除业务表。SHOW GRANTS比只看mysql.user的全局Y/N列更适合检查实际授权层次。","context":"","canonical":null,"parts":[{"number":"1","goal":"建立CUSTOMER权限集合","steps":["CREATE ROLE。","SELECT授在ITEM，写权限三项授在ORDERS。","对象范围限定university中对应表。"],"check":"角色有两组精确权限。","pitfall":"只授UPDATE不等于包含INSERT、DELETE。","code":"```sql\nCREATE ROLE 'CUSTOMER';\nGRANT SELECT ON university.ITEM TO 'CUSTOMER';\nGRANT INSERT, UPDATE, DELETE ON university.ORDERS TO 'CUSTOMER';\n```"},{"number":"2","goal":"建立并配置继承角色","steps":["CREATE FREQUENT_CUSTOMER。","给它DISCOUNT的三项写权限。","GRANT CUSTOMER TO FREQUENT_CUSTOMER使高级角色继承普通角色。"],"check":"权限方向正确。","pitfall":"反过来授会让普通客户继承更高级能力。","code":"```sql\nCREATE ROLE 'FREQUENT_CUSTOMER';\nGRANT INSERT, UPDATE, DELETE ON university.DISCOUNT TO 'FREQUENT_CUSTOMER';\nGRANT 'CUSTOMER' TO 'FREQUENT_CUSTOMER';\n```"},{"number":"3","goal":"授role、启用并检查权限","steps":["授FREQUENT_CUSTOMER给PARTICIPANT_10，WITH ADMIN OPTION允许转授该role。","SET DEFAULT ROLE设为以后登录默认启用。","SHOW GRANTS FOR ... USING role查看含角色的授权，说明ADMIN OPTION不是对象GRANT OPTION。"],"check":"角色可传播与对象可传播分别理解。","pitfall":"仅查看mysql.user的全局Y/N列会漏库级/表级/角色权限。","code":"```sql\nGRANT 'FREQUENT_CUSTOMER' TO 'ROLE_USER'@'localhost' WITH ADMIN OPTION;\nSET DEFAULT ROLE 'FREQUENT_CUSTOMER' TO 'ROLE_USER'@'localhost';\nSHOW GRANTS FOR 'ROLE_USER'@'localhost' USING 'FREQUENT_CUSTOMER';\n```"},{"number":"4","goal":"修改密码并清理账号/角色","steps":["ALTER USER修改指定账号。","REVOKE成员关系，再DROP USER。","DROP两个ROLE但不DROP业务表。"],"check":"用户与role清理，ITEM/ORDERS/DISCOUNT保留。","pitfall":"DROP ROLE不等于清空业务数据。","code":"```sql\nALTER USER 'ROLE_USER'@'localhost' IDENTIFIED BY '[CHOOSE_PASSWORD]';\nREVOKE 'FREQUENT_CUSTOMER' FROM 'ROLE_USER'@'localhost';\nDROP USER 'ROLE_USER'@'localhost';\nDROP ROLE 'FREQUENT_CUSTOMER', 'CUSTOMER';\n```"}],"tags":["CREATE/ALTER/DROP USER and database management","Roles, activation, inheritance and ADMIN OPTION","REVOKE and multiple effective privilege sources"],"questionHTML":"\u003cp>Assume ROLE_USER and the tables ITEM, ORDERS and DISCOUNT already exist in database university. Use the localhost account for ROLE_USER.\u003c/p>\n\u003cp>(1) Create role CUSTOMER. Grant it SELECT on ITEM, and INSERT, UPDATE and DELETE on ORDERS.\u003c/p>\n\u003cp>(2) Create role FREQUENT_CUSTOMER. It must inherit CUSTOMER and additionally have INSERT, UPDATE and DELETE on DISCOUNT.\u003c/p>\n\u003cp>(3) Grant FREQUENT_CUSTOMER to ROLE_USER WITH ADMIN OPTION. Make it ROLE_USER&#39;s default role, and show ROLE_USER&#39;s grants using this role. Explain whether ADMIN OPTION is the same as GRANT OPTION.\u003c/p>\n\u003cp>(4) Change ROLE_USER&#39;s password to a value of your choice. Then remove this role assignment, drop ROLE_USER, and drop the two roles without dropping any tables.\u003c/p>\n","answerHTML":"\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nCREATE ROLE &#39;CUSTOMER&#39;;\nGRANT SELECT ON university.ITEM TO &#39;CUSTOMER&#39;;\nGRANT INSERT, UPDATE, DELETE ON university.ORDERS TO &#39;CUSTOMER&#39;;\n-- (2)\nCREATE ROLE &#39;FREQUENT_CUSTOMER&#39;;\nGRANT INSERT, UPDATE, DELETE ON university.DISCOUNT TO &#39;FREQUENT_CUSTOMER&#39;;\nGRANT &#39;CUSTOMER&#39; TO &#39;FREQUENT_CUSTOMER&#39;;\n-- (3)\nGRANT &#39;FREQUENT_CUSTOMER&#39; TO &#39;ROLE_USER&#39;@&#39;localhost&#39; WITH ADMIN OPTION;\nSET DEFAULT ROLE &#39;FREQUENT_CUSTOMER&#39; TO &#39;ROLE_USER&#39;@&#39;localhost&#39;;\nSHOW GRANTS FOR &#39;ROLE_USER&#39;@&#39;localhost&#39; USING &#39;FREQUENT_CUSTOMER&#39;;\n-- (4)\nALTER USER &#39;ROLE_USER&#39;@&#39;localhost&#39; IDENTIFIED BY &#39;[CHOOSE_PASSWORD]&#39;;\nREVOKE &#39;FREQUENT_CUSTOMER&#39; FROM &#39;ROLE_USER&#39;@&#39;localhost&#39;;\nDROP USER &#39;ROLE_USER&#39;@&#39;localhost&#39;;\nDROP ROLE &#39;FREQUENT_CUSTOMER&#39;, &#39;CUSTOMER&#39;;\n\u003c/code>\u003c/pre>\n\u003cp>GRANT CUSTOMER TO FREQUENT_CUSTOMER的方向是“高级角色继承普通角色”。反过来写会让普通角色取得不该有的权限。WITH ADMIN OPTION允许再授予role；WITH GRANT OPTION用于再授予对象权限，二者不是同一个授权动作。DROP USER/ROLE不删除业务表。SHOW GRANTS比只看mysql.user的全局Y/N列更适合检查实际授权层次。\u003c/p>\n"},{"id":"L07","title":"Additional normalization examples from the lecture","topic":"Additional normalization examples from the lecture","areas":["Normalization"],"source":"lecture-normalization","sourceLabel":"Functional dependencies and normalization","sourceNote":"09DatabaseNormalization_3.pdf Examples 3,8,10 (pp10,15,17). The R/F data are reproduced; full examination-style instructions are added.","origin":"Lecture examples with added examination instructions","priority":"core","question":"Assume each schema is in 1NF. For each lecture example, derive all minimal keys and determine the highest normal form, explicitly testing 2NF, 3NF and BCNF with justification.\n\n(1) $R=(A,B,C)$, $F={AB\\to C,C\\to B,C\\to A\\}$.\n\n(2) $R=(A,B,C,D)$, $F={A\\to B,B\\to D,C\\to B\\}$.\n\n(3) $R=(A,B,C,D)$, $F={AB\\to C,C\\to D,D\\to A,D\\to B\\}$.\n\nFor (2), optionally give a lossless BCNF decomposition. Do not assume that an arbitrary collection of two-attribute relations is lossless.","answer":"### (1) BCNF\n\n$(AB)^+=\\{A,B,C\\}$，$C^+=\\{A,B,C\\}$。候选键是$\\{A,B\\}$、$\\{C\\}$；A、B单独都不能得到全部属性，所以二者组合最小。所有属性都是prime attributes，不存在对non-prime attribute的partial dependency，满足2NF。每条非平凡functional dependency的左侧都是superkey，所以满足3NF和BCNF。\n\n### (2) 1NF\n\nA、C不出现在右侧，每个key必须同时包含A和C。$(AC)^+=\\{A,B,C,D\\}$，$A^+=\\{A,B,D\\}$、$C^+=\\{B,C,D\\}$，所以唯一candidate key是$\\{A,C\\}$。B、D是non-prime attributes。$A\\to B$和$C\\to B$构成partial dependency，因此不满足2NF；它们和$B\\to D$也违反3NF、BCNF。最高1NF。\n\n一种lossless BCNF decomposition为$R_1=(A,B)$、$R_2=(A,C)$、$R_3=(B,D)$：先按$B\\to D$分出BD，再在ABC中按$A\\to B$分出AB和AC，每一步都满足交集决定一侧的lossless条件。此三表分解不单独保持$C\\to B$，需跨表检查；若还要求dependency preservation，可额外保留投影$R_4=(C,B)$。\n\n课件p15给出AB、BC、BD，但缺少保存A与C配对的关系。仅凭表都是二元关系不能保证lossless，不能直接照抄该分解。\n\n### (3) BCNF\n\n$C^+=\\{A,B,C,D\\}$、$D^+=\\{A,B,C,D\\}$、$(AB)^+=\\{A,B,C,D\\}$。全部candidate keys是$\\{C\\}$、$\\{D\\}$、$\\{A,B\\}$。所有属性都是prime attributes，因此满足2NF。给定的每个非平凡functional dependency左侧都是superkey；派生出新属性的决定因素也必定包含C、D或AB，所以满足3NF和BCNF。","context":"","canonical":null,"parts":[{"number":"1","goal":"keys为{A,B}与{C}，最高BCNF","steps":["AB→C说明AB可决定全部；C→A和C→B说明C也可决定全部。","A、B单独都不够，其他包含AB或C的集合不minimal；所有attributes都是prime。","每条给定非平凡FD的左侧都是superkey，2NF、3NF、BCNF都满足。"],"check":"组合key与单属性key可以同时存在。","pitfall":"不能因存在单属性key就不再寻找组合key。","code":""},{"number":"2","goal":"唯一key是{A,C}，最高1NF","steps":["A、C不在右侧，每个key必须同时包含A和C。","A⁺=ABD、C⁺=CBD，单独都少另一必需属性；AC⁺=ABCD。","A→B和C→B是non-prime属性对key真子集的partial dependency，故2NF失败；指出3NF/BCNF也被这些FD违反。","若分解，保留A与C的配对关系；AB、BC、BD缺它，可能产生spurious tuples。"],"check":"可用AC、AB、BD给lossless BCNF分解，但C→B不单独被局部依赖保持。","pitfall":"“所有分表都有两列”不等于整个分解lossless。","code":""},{"number":"3","goal":"keys为{A,B}、{C}、{D}，最高BCNF","steps":["C→D→AB得到全部；D→AB→C得到全部；AB→C→D也得到全部。","A/B单独不够，因此AB最小；含C或D的更大集合都不再minimal。","每条非平凡FD左侧为superkey；所有attributes亦为prime，满足2NF、3NF、BCNF。"],"check":"共三个keys，不能漏掉AB。","pitfall":"把“存在单属性key”误当作只可能有单属性keys。","code":""}],"tags":["Functional dependencies and attribute closure","All minimal keys and prime attributes","Full and partial dependency; 2NF","3NF versus BCNF with justification","Lossless decomposition and dependency preservation"],"questionHTML":"\u003cp>Assume each schema is in 1NF. For each lecture example, derive all minimal keys and determine the highest normal form, explicitly testing 2NF, 3NF and BCNF with justification.\u003c/p>\n\u003cp>(1) \u003cspan class=\"math\">R=(A,B,C)\u003c/span>, \u003cspan class=\"math\">F={AB→ C,C→ B,C→ A}\u003c/span>.\u003c/p>\n\u003cp>(2) \u003cspan class=\"math\">R=(A,B,C,D)\u003c/span>, \u003cspan class=\"math\">F={A→ B,B→ D,C→ B}\u003c/span>.\u003c/p>\n\u003cp>(3) \u003cspan class=\"math\">R=(A,B,C,D)\u003c/span>, \u003cspan class=\"math\">F={AB→ C,C→ D,D→ A,D→ B}\u003c/span>.\u003c/p>\n\u003cp>For (2), optionally give a lossless BCNF decomposition. Do not assume that an arbitrary collection of two-attribute relations is lossless.\u003c/p>\n","answerHTML":"\u003ch3>(1) BCNF\u003c/h3>\n\u003cp>\u003cspan class=\"math\">(AB)\u003csup>+\u003c/sup>={A,B,C}\u003c/span>，\u003cspan class=\"math\">C\u003csup>+\u003c/sup>={A,B,C}\u003c/span>。候选键是\u003cspan class=\"math\">{A,B}\u003c/span>、\u003cspan class=\"math\">{C}\u003c/span>；A、B单独都不能得到全部属性，所以二者组合最小。所有属性都是prime attributes，不存在对non-prime attribute的partial dependency，满足2NF。每条非平凡functional dependency的左侧都是superkey，所以满足3NF和BCNF。\u003c/p>\n\u003ch3>(2) 1NF\u003c/h3>\n\u003cp>A、C不出现在右侧，每个key必须同时包含A和C。\u003cspan class=\"math\">(AC)\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>，\u003cspan class=\"math\">A\u003csup>+\u003c/sup>={A,B,D}\u003c/span>、\u003cspan class=\"math\">C\u003csup>+\u003c/sup>={B,C,D}\u003c/span>，所以唯一candidate key是\u003cspan class=\"math\">{A,C}\u003c/span>。B、D是non-prime attributes。\u003cspan class=\"math\">A→ B\u003c/span>和\u003cspan class=\"math\">C→ B\u003c/span>构成partial dependency，因此不满足2NF；它们和\u003cspan class=\"math\">B→ D\u003c/span>也违反3NF、BCNF。最高1NF。\u003c/p>\n\u003cp>一种lossless BCNF decomposition为\u003cspan class=\"math\">R\u003csub>1\u003c/sub>=(A,B)\u003c/span>、\u003cspan class=\"math\">R\u003csub>2\u003c/sub>=(A,C)\u003c/span>、\u003cspan class=\"math\">R\u003csub>3\u003c/sub>=(B,D)\u003c/span>：先按\u003cspan class=\"math\">B→ D\u003c/span>分出BD，再在ABC中按\u003cspan class=\"math\">A→ B\u003c/span>分出AB和AC，每一步都满足交集决定一侧的lossless条件。此三表分解不单独保持\u003cspan class=\"math\">C→ B\u003c/span>，需跨表检查；若还要求dependency preservation，可额外保留投影\u003cspan class=\"math\">R\u003csub>4\u003c/sub>=(C,B)\u003c/span>。\u003c/p>\n\u003cp>课件p15给出AB、BC、BD，但缺少保存A与C配对的关系。仅凭表都是二元关系不能保证lossless，不能直接照抄该分解。\u003c/p>\n\u003ch3>(3) BCNF\u003c/h3>\n\u003cp>\u003cspan class=\"math\">C\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>、\u003cspan class=\"math\">D\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>、\u003cspan class=\"math\">(AB)\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>。全部candidate keys是\u003cspan class=\"math\">{C}\u003c/span>、\u003cspan class=\"math\">{D}\u003c/span>、\u003cspan class=\"math\">{A,B}\u003c/span>。所有属性都是prime attributes，因此满足2NF。给定的每个非平凡functional dependency左侧都是superkey；派生出新属性的决定因素也必定包含C、D或AB，所以满足3NF和BCNF。\u003c/p>\n"},{"id":"L08","title":"LEFT, RIGHT and FULL OUTER JOIN","topic":"LEFT, RIGHT and FULL OUTER JOIN","areas":["SELECT"],"source":"lecture-select","sourceLabel":"SELECT lectures","sourceNote":"SELECT Statement (4).pdf pp10,14,18. Lecture questions; grammar and line breaks normalized without changing the required preserved rows.","origin":"Lecture questions","priority":"core","question":"Use the lecture DEPARTMENT and COURSE tables.\n\n(1) Find the names of departments together with the titles of all courses offered by each department and include the names of departments that offer no courses at all.\n\n(2) Find the names of departments together with the titles of all courses offered by each department and include the titles of all courses not assigned to any department.\n\n(3) Find the names of departments together with the titles of all courses offered by each department, include the names of departments that offer no courses, and include the titles of courses not offered by any department.","answer":"```sql\n-- (1)\nSELECT D.name, C.title\nFROM DEPARTMENT AS D\nLEFT OUTER JOIN COURSE AS C ON D.name = C.offered_by;\n-- (2)\nSELECT D.name, C.title\nFROM DEPARTMENT AS D\nRIGHT OUTER JOIN COURSE AS C ON D.name = C.offered_by;\n-- (3) MySQL: preserve both sides without unsupported FULL OUTER JOIN syntax.\nSELECT D.name, C.title\nFROM DEPARTMENT AS D\nLEFT JOIN COURSE AS C ON D.name = C.offered_by\nUNION ALL\nSELECT D.name, C.title\nFROM DEPARTMENT AS D\nRIGHT JOIN COURSE AS C ON D.name = C.offered_by\nWHERE D.name IS NULL;\n```\n\n(1)保留DEPARTMENT一侧，即使Biology没有课程，也有(Biology,NULL)一行。(2)保留COURSE一侧，即使Unassigned没有所属部门，也有(NULL,Unassigned)一行。LEFT/RIGHT由FROM中的左右顺序决定；把两个表调换顺序后用LEFT JOIN，也能表达同样的保留方向。\n\n若把右表必须存在的条件放进WHERE，可能重新过滤掉外连接补出的NULL行。应先确定要保留哪一边，再决定筛选条件放在ON还是WHERE。\n\n(3)要同时保留两侧。MySQL没有原生FULL OUTER JOIN语法：先取完整LEFT JOIN，再只追加右边未匹配的课程。D.name是非空primary key，所以第二部分的IS NULL可靠地识别未匹配行。UNION ALL保留本来可能相同的结果行；第二部分排除已匹配行，因此不会把每个匹配关系重复添加一次。此fixture共6行，包括(Biology,NULL)与(NULL,Unassigned)。","context":"lecture","canonical":null,"parts":[{"number":"1","goal":"保留全部部门","steps":["DEPARTMENT在LEFT JOIN左边。","ON关联部门名与offered_by。","未匹配部门也输出一行，课程title为NULL。"],"check":"Biology,NULL出现；未分配课程不因本题被保留。","pitfall":"把WHERE C.title IS NOT NULL加上，会过滤本来要保留的部门。","code":"```sql\nSELECT D.name, C.title\nFROM DEPARTMENT AS D\nLEFT OUTER JOIN COURSE AS C ON D.name = C.offered_by;\n```"},{"number":"2","goal":"保留全部课程","steps":["COURSE位于RIGHT JOIN右边。","同样按name=offered_by连接。","没分配部门的课程输出NULL部门名，仍保留title。"],"check":"NULL,Unassigned出现。","pitfall":"LEFT/RIGHT由FROM中的位置决定，不由业务上哪个表更重要决定。","code":"```sql\nSELECT D.name, C.title\nFROM DEPARTMENT AS D\nRIGHT OUTER JOIN COURSE AS C ON D.name = C.offered_by;\n```"},{"number":"3","goal":"同时保留两侧的未匹配行","steps":["先取LEFT JOIN，得到全部部门及匹配课程。","第二部分RIGHT JOIN后用D.name IS NULL只保留未分配部门的课程。","UNION ALL追加这部分；MySQL不直接支持FULL OUTER JOIN。","用非空primary key检测未匹配，避免拿可能原本就是NULL的普通属性误判。"],"check":"fixture共6行；Biology,NULL与NULL,Unassigned都出现。","pitfall":"不能直接把完整LEFT与RIGHT结果UNION ALL，否则匹配行会重复。","code":"```sql\nSELECT D.name, C.title\nFROM DEPARTMENT AS D\nLEFT JOIN COURSE AS C ON D.name = C.offered_by\nUNION ALL\nSELECT D.name, C.title\nFROM DEPARTMENT AS D\nRIGHT JOIN COURSE AS C ON D.name = C.offered_by\nWHERE D.name IS NULL;\n```"}],"tags":["JOIN and LEFT/RIGHT/FULL OUTER JOIN"],"questionHTML":"\u003cp>Use the lecture DEPARTMENT and COURSE tables.\u003c/p>\n\u003cp>(1) Find the names of departments together with the titles of all courses offered by each department and include the names of departments that offer no courses at all.\u003c/p>\n\u003cp>(2) Find the names of departments together with the titles of all courses offered by each department and include the titles of all courses not assigned to any department.\u003c/p>\n\u003cp>(3) Find the names of departments together with the titles of all courses offered by each department, include the names of departments that offer no courses, and include the titles of courses not offered by any department.\u003c/p>\n","answerHTML":"\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nSELECT D.name, C.title\nFROM DEPARTMENT AS D\nLEFT OUTER JOIN COURSE AS C ON D.name = C.offered_by;\n-- (2)\nSELECT D.name, C.title\nFROM DEPARTMENT AS D\nRIGHT OUTER JOIN COURSE AS C ON D.name = C.offered_by;\n-- (3) MySQL: preserve both sides without unsupported FULL OUTER JOIN syntax.\nSELECT D.name, C.title\nFROM DEPARTMENT AS D\nLEFT JOIN COURSE AS C ON D.name = C.offered_by\nUNION ALL\nSELECT D.name, C.title\nFROM DEPARTMENT AS D\nRIGHT JOIN COURSE AS C ON D.name = C.offered_by\nWHERE D.name IS NULL;\n\u003c/code>\u003c/pre>\n\u003cp>(1)保留DEPARTMENT一侧，即使Biology没有课程，也有(Biology,NULL)一行。(2)保留COURSE一侧，即使Unassigned没有所属部门，也有(NULL,Unassigned)一行。LEFT/RIGHT由FROM中的左右顺序决定；把两个表调换顺序后用LEFT JOIN，也能表达同样的保留方向。\u003c/p>\n\u003cp>若把右表必须存在的条件放进WHERE，可能重新过滤掉外连接补出的NULL行。应先确定要保留哪一边，再决定筛选条件放在ON还是WHERE。\u003c/p>\n\u003cp>(3)要同时保留两侧。MySQL没有原生FULL OUTER JOIN语法：先取完整LEFT JOIN，再只追加右边未匹配的课程。D.name是非空primary key，所以第二部分的IS NULL可靠地识别未匹配行。UNION ALL保留本来可能相同的结果行；第二部分排除已匹配行，因此不会把每个匹配关系重复添加一次。此fixture共6行，包括(Biology,NULL)与(NULL,Unassigned)。\u003c/p>\n"},{"id":"L09","title":"Self-join roles and a self-association","topic":"Self-join roles and a self-association","areas":["SELECT","Conceptual"],"source":"lecture-select","sourceLabel":"SELECT lectures","sourceNote":"SELECT Statement (3).pdf pp24,27,29–31. The two queries and sample rows come from the lecture; the modelling instruction is supplementary. Public edition: example names, contact details and password literals anonymized.","origin":"Lecture queries + supplementary modelling instruction","priority":"core","question":"Use the EMPLOYEE(enum, name, manager) example. manager is the employee number of the direct manager and may be NULL.\n\n(1) Find a name of manager of employee number 40.\n\n(2) Find the names of all employees directly managed by STAFF_50.\n\n(3) Draw a simplified UML self-association for this relationship. Show the role names and multiplicities. Assume that an employee may have at most one direct manager, and a manager may directly manage zero or more employees. Do not introduce a separate manager identifier.","answer":"```sql\n-- (1)\nSELECT M.name\nFROM EMPLOYEE AS E\nJOIN EMPLOYEE AS M ON E.manager = M.enum\nWHERE E.enum = 40;\n-- (2)\nSELECT E.name\nFROM EMPLOYEE AS E\nJOIN EMPLOYEE AS M ON E.manager = M.enum\nWHERE M.name = 'STAFF_50';\n```\n\nE和M是同一张表的不同角色，分别表示下属和经理。不能把E.enum=M.enum作为连接条件，否则会连接成同一位员工。原数据中(1)为STAFF_20，(2)为STAFF_60、STAFF_70；这里只查直接下属，不递归查整个组织树。\n\n```mermaid\nclassDiagram\n    EMPLOYEE \"0..1 manager\" -- \"0..* subordinate\" EMPLOYEE : manages\n```\n\nEMPLOYEE的attributes是enum [ID]和name；manager这个关系在概念图中用self-association表达，不另建一套经理编号。经理端0..1表示一名下属最多一个直接经理，下属端0..*表示一名经理可以管理多人。","context":"employee","canonical":null,"parts":[{"number":"1","goal":"查员工40的经理名字","steps":["E代表员工本人，M代表经理。","E.manager连接M.enum，不把两个人enum直接相等。","筛E.enum=40，从M取name。"],"check":"STAFF_20。","pitfall":"E.name是STAFF_40，不是经理名。","code":"```sql\nSELECT M.name\nFROM EMPLOYEE AS E\nJOIN EMPLOYEE AS M ON E.manager = M.enum\nWHERE E.enum = 40;\n```"},{"number":"2","goal":"查STAFF_50的直接下属","steps":["同样用员工E和经理M两个角色。","筛M.name=STAFF_50。","从E取name，得到直接下属，不递归组织树。"],"check":"STAFF_60与STAFF_70。","pitfall":"筛E.name=STAFF_50会得到STAFF_50本人或查错方向。","code":"```sql\nSELECT E.name\nFROM EMPLOYEE AS E\nJOIN EMPLOYEE AS M ON E.manager = M.enum\nWHERE M.name = 'STAFF_50';\n```"},{"number":"3","goal":"画self-association及角色范围","steps":["只用一个EMPLOYEE类，enum标ID、name为attribute。","两个端点分别命名manager与subordinate，明确各自角色。","经理端0..1，下属端0..*；不另外发明manager identifier。"],"check":"同一类对象可在不同link里担当两种角色。","pitfall":"数量端点描述的是对方一个对象可关联这一端多少个。","code":""}],"tags":["Multiplicities and role directions","Self-association and role names","Self-join and alias roles"],"questionHTML":"\u003cp>Use the EMPLOYEE(enum, name, manager) example. manager is the employee number of the direct manager and may be NULL.\u003c/p>\n\u003cp>(1) Find a name of manager of employee number 40.\u003c/p>\n\u003cp>(2) Find the names of all employees directly managed by STAFF_50.\u003c/p>\n\u003cp>(3) Draw a simplified UML self-association for this relationship. Show the role names and multiplicities. Assume that an employee may have at most one direct manager, and a manager may directly manage zero or more employees. Do not introduce a separate manager identifier.\u003c/p>\n","answerHTML":"\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nSELECT M.name\nFROM EMPLOYEE AS E\nJOIN EMPLOYEE AS M ON E.manager = M.enum\nWHERE E.enum = 40;\n-- (2)\nSELECT E.name\nFROM EMPLOYEE AS E\nJOIN EMPLOYEE AS M ON E.manager = M.enum\nWHERE M.name = &#39;STAFF_50&#39;;\n\u003c/code>\u003c/pre>\n\u003cp>E和M是同一张表的不同角色，分别表示下属和经理。不能把E.enum=M.enum作为连接条件，否则会连接成同一位员工。原数据中(1)为STAFF_20，(2)为STAFF_60、STAFF_70；这里只查直接下属，不递归查整个组织树。\u003c/p>\n\u003cfigure class=\"diagram\">\u003cdiv class=\"diagram-scroll\">\n\n\u003c!-- Generated by graphviz version 14.1.3 (20260303.0454)\n -->\n\u003c!-- Title: G Pages: 1 -->\n\u003cp>\u003csvg width=\"164pt\" height=\"185pt\"\n viewBox=\"0.00 0.00 164.00 185.00\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n\u003cg id=\"g7-graph0\" class=\"graph\" transform=\"scale(1 1) rotate(0) translate(28.8 156)\">\u003c/p>\n\u003ctitle>G\u003c/title>\n\u003c!-- EMPLOYEE -->\n\u003cg id=\"g7-node1\" class=\"node\">\n\u003ctitle>EMPLOYEE\u003c/title>\n\u003cpolygon fill=\"#e6f1ed\" stroke=\"none\" points=\"0,-46.8 0,-79.2 84.68,-79.2 84.68,-46.8 0,-46.8\"/>\n\u003cpolygon fill=\"none\" stroke=\"black\" points=\"0,-46.8 0,-79.2 84.68,-79.2 84.68,-46.8 0,-46.8\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"9\" y=\"-60.4\" font-family=\"Arial\" font-weight=\"bold\" font-size=\"12.00\">EMPLOYEE\u003c/text>\n\u003cpolygon fill=\"none\" stroke=\"black\" points=\"0,0 0,-46.8 84.68,-46.8 84.68,0 0,0\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"9\" y=\"-25.8\" font-family=\"Arial\" font-size=\"12.00\">enum &#160;ID\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"9\" y=\"-11.4\" font-family=\"Arial\" font-size=\"12.00\">name\u003c/text>\n\u003c/g>\n\u003c!-- EMPLOYEE&#45;&gt;EMPLOYEE -->\n\u003cg id=\"g7-edge1\" class=\"edge\">\n\u003ctitle>EMPLOYEE&#45;&gt;EMPLOYEE\u003c/title>\n\u003cpath fill=\"none\" stroke=\"#52695d\" d=\"M26.89,-78.89C24.87,-98.13 30.02,-115.2 42.34,-115.2 54.66,-115.2 59.81,-98.13 57.79,-78.89\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"42.34\" y=\"-118.2\" font-family=\"Arial\" font-size=\"10.00\">manages\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"71.34\" y=\"-100.39\" font-family=\"Arial\" font-size=\"10.00\">0..* subordinate\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"36.95\" y=\"-102.01\" font-family=\"Arial\" font-size=\"10.00\">0..1 manager\u003c/text>\n\u003c/g>\n\u003c/g>\n\u003c/svg>\n\u003c/div>\u003cfigcaption>同一个ID标签表示组合identifier；不同ID标签表示独立identifier。空心箭头指向父类。 [0..1]可选，[*]多值，/表示derived attribute。\u003c/figcaption>\u003cbutton class=\"zoom\" type=\"button\">放大图\u003c/button>\u003c/figure>\n\n\u003cp>EMPLOYEE的attributes是enum [ID]和name；manager这个关系在概念图中用self-association表达，不另建一套经理编号。经理端0..1表示一名下属最多一个直接经理，下属端0..*表示一名经理可以管理多人。\u003c/p>\n"}],"contexts":{"transport":{"title":"Transport","sql":"CREATE TABLE EMPLOYEE (\n    ENUM DECIMAL(12) NOT NULL,\n    FNAME VARCHAR(50) NOT NULL,\n    LNAME VARCHAR(50) NOT NULL,\n    DOB DATE NULL,\n    CONSTRAINT EMPLOYEE_PKEY PRIMARY KEY (ENUM)\n);\n\nCREATE TABLE DRIVER (\n    ENUM DECIMAL(12) NOT NULL,\n    LNUM DECIMAL(8) NOT NULL,\n    STATUS VARCHAR(10) NOT NULL,\n    CONSTRAINT DRIVER_PKEY PRIMARY KEY (ENUM),\n    CONSTRAINT DRIVER_UNIQUE UNIQUE (LNUM),\n    CONSTRAINT DRIVER_FKEY FOREIGN KEY (ENUM)\n        REFERENCES EMPLOYEE (ENUM),\n    CONSTRAINT DRIVER_STATUS CHECK (\n        STATUS IN ('AVAILABLE', 'BUSY', 'ON LEAVE')\n    )\n);\n\nCREATE TABLE TRUCK (\n    REGNUM VARCHAR(10) NOT NULL,\n    CAPACITY DECIMAL(7) NOT NULL,\n    WEIGHT DECIMAL(7) NOT NULL,\n    STATUS VARCHAR(10) NOT NULL,\n    CONSTRAINT TRUCK_PKEY PRIMARY KEY (REGNUM),\n    CONSTRAINT TRUCK_STATUS CHECK (\n        STATUS IN ('AVAILABLE', 'USED', 'MAINTAINED')\n    ),\n    CONSTRAINT TRUCK_WEIGHT CHECK (WEIGHT > 0.0 AND WEIGHT \u003c 500),\n    CONSTRAINT TRUCK_CAPACITY CHECK (CAPACITY > 0.0 AND CAPACITY \u003c 100)\n);\n\nCREATE TABLE TRIP (\n    TNUM DECIMAL(10) NOT NULL,\n    LNUM DECIMAL(8) NOT NULL,\n    REGNUM VARCHAR(10) NOT NULL,\n    TDATE DATE NOT NULL,\n    CONSTRAINT TRIP_PKEY PRIMARY KEY (TNUM),\n    CONSTRAINT TRIP_CKEY UNIQUE (LNUM, REGNUM, TDATE),\n    CONSTRAINT TRIP_FKEY1 FOREIGN KEY (LNUM)\n        REFERENCES DRIVER (LNUM),\n    CONSTRAINT TRIP_FKEY2 FOREIGN KEY (REGNUM)\n        REFERENCES TRUCK (REGNUM)\n);\n\nCREATE TABLE TRIPLEG (\n    TNUM DECIMAL(10) NOT NULL,\n    LEGNUM DECIMAL(2) NOT NULL,\n    DEPARTURE VARCHAR(30) NOT NULL,\n    DESTINATION VARCHAR(30) NOT NULL,\n    CONSTRAINT TRIPLEG_PKEY PRIMARY KEY (TNUM, LEGNUM),\n    CONSTRAINT TRIPLEG_UNIQUE UNIQUE (TNUM, DEPARTURE, DESTINATION),\n    CONSTRAINT TRIPLEG_FKEY1 FOREIGN KEY (TNUM)\n        REFERENCES TRIP (TNUM)\n);\n"},"bank":{"title":"Bank","sql":"CREATE TABLE BANK(\n bank_name     VARCHAR(50)  NOT NULL,  /* Bank name                                    */\n hq_country    VARCHAR(30)  NOT NULL,  /* Country part of headquarters address         */\n hq_city       VARCHAR(30)  NOT NULL,  /* City part of headquarters address            */\n hq_street     VARCHAR(30)  NOT NULL,  /* Street part of headquarters address          */\n hq_bldg_num   DECIMAL(4)   NOT NULL,  /* Building number part of headquarters address */\n web_site      VARCHAR(200) NOT NULL,  /* Link to Web site                             */\n email         VARCHAR(100) NOT NULL,  /* Email address                                */\n bank_type     VARCHAR(30)      NULL,  /* Bank type                                    */\n  CONSTRAINT BANK_PK PRIMARY KEY (bank_name),\n  CONSTRAINT BANK_CK1 UNIQUE (hq_country, hq_city, hq_street, hq_bldg_num),\n  CONSTRAINT BANK_CK2 UNIQUE (web_site),\n  CONSTRAINT BANK_CK3 UNIQUE (email),\n  CONSTRAINT BANK_CHECK CHECK (bank_type IN ('investment', 'commercial', 'central', 'agriculture', 'construction', 'industrial') ) );\nCREATE TABLE BRANCH(\n  bank_name     VARCHAR(50)  NOT NULL, /* Bank name                                   */\n  br_name       VARCHAR(50)  NOT NULL, /* Branch name                                 */\n  br_country    VARCHAR(30)  NOT NULL, /* Country part of branch address              */\n  br_city       VARCHAR(30)  NOT NULL, /* City part of branch address                 */\n  br_street     VARCHAR(30)  NOT NULL, /* Street part of branch address               */\n  br_bldg_num   DECIMAL(4)   NOT NULL, /* Building number part of branch address      */\n  total_emps    DECIMAL(3)        NULL, /* Total number of employees at a branch      */\n   CONSTRAINT BRANCH_PK PRIMARY KEY (bank_name, br_name, br_country, br_city),\n   CONSTRAINT BRANCH_CK1 UNIQUE (br_country, br_city, br_street, br_bldg_num),\n   CONSTRAINT BRANCH_FK1 FOREIGN KEY (bank_name) REFERENCES BANK(bank_name) );\nCREATE TABLE EMPLOYEE(\n  emp_num       DECIMAL(7)   NOT NULL,  /* Employee number                            */\n  first_name    VARCHAR(20)      NULL, /* Employee first name                         */\n  last_name     VARCHAR(20)  NOT NULL, /* Employee last name                          */\n  date_of_birth DATE         NOT NULL, /* Date of birth                               */\n  position      VARCHAR(100) NOT NULL, /* Position occupied                           */\n  bank_name     VARCHAR(50)  NOT NULL, /* Bank name                                   */\n  br_name       VARCHAR(50)      NULL, /* Branch name                                 */\n  br_country    VARCHAR(30)      NULL, /* Country location of a branch                */\n  br_city       VARCHAR(30)      NULL, /* City location of a branch                   */\n   CONSTRAINT EMPLOYEE_PK PRIMARY KEY (bank_name, emp_num),\n   CONSTRAINT EMPLOYEE_FK1 FOREIGN KEY (bank_name, br_name, br_country, br_city)\n                           REFERENCES BRANCH(bank_name, br_name, br_country, br_city) );\nCREATE TABLE ACCOUNT(\n account_num   DECIMAL(10)  NOT NULL,   /* Account number                             */\n bank_name     VARCHAR(50)  NOT NULL,   /* Bank name                                  */\n balance       DECIMAL(9,2) NOT NULL,   /* Account balance                            */\n account_type  VARCHAR(8)   NOT NULL,   /* Account type: savings, checking, loan      */\n  CONSTRAINT ACCOUNT_PK PRIMARY KEY (account_num, bank_name),\n  CONSTRAINT ACCOUNT_FK1 FOREIGN KEY (bank_name) REFERENCES BANK(bank_name),\n  CONSTRAINT ACCOUNT_CHK1 CHECK( balance >= 0 ),\n  CONSTRAINT ACCOUNT_CHK2 CHECK( account_type IN ('savings','checking','loan') ) );\nCREATE TABLE TRANSACTION(\n acc_num       DECIMAL(10)  NOT NULL,  /* Account number                             */\n bank_name     VARCHAR(50)  NOT NULL,  /* Bank name                                  */\n tr_date_time  DATETIME     NOT NULL,  /* Transaction date                           */\n amount        DECIMAL(7,2) NOT NULL,  /* Amount involved                            */\n type          VARCHAR(10)  NOT NULL,  /* Transaction type                           */\n  CONSTRAINT TRANSACTION_PK PRIMARY KEY(acc_num, bank_name, tr_date_time),\n  CONSTRAINT TRANSACTION_FK2 FOREIGN KEY(acc_num, bank_name) \n                             REFERENCES ACCOUNT(account_num, bank_name),\n  CONSTRAINT TRANSACTION_CHK1 CHECK( amount >= 0 ),\n  CONSTRAINT TRANSACTION_CHK2 CHECK( type IN ('deposit', 'withdrawal' ) ) );\n"},"workshop":{"title":"Professional training workshops","sql":"/* ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ */\n/* Professional Training Workshops - Create database                  */\n/* ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ */\n\nCREATE TABLE Participant (\n    participantNo DECIMAL(6)   NOT NULL,\n    fname         VARCHAR(20)  NOT NULL,\n    lname         VARCHAR(30)  NOT NULL,\n    city          VARCHAR(30)  NOT NULL,\n    state         VARCHAR(20)  NOT NULL,\n    phone         VARCHAR(15)  NOT NULL,\n    email         VARCHAR(80),\n    CONSTRAINT Participant_pkey PRIMARY KEY (participantNo)\n);\n\nCREATE TABLE Qualification (\n    participantNo DECIMAL(6)   NOT NULL,\n    qname         VARCHAR(50)  NOT NULL,\n    qlevel        DECIMAL(1)   NOT NULL,\n    awardYear     DECIMAL(4),\n    CONSTRAINT Qualification_pkey PRIMARY KEY (participantNo, qname),\n    CONSTRAINT Qualification_fkey1 FOREIGN KEY (participantNo)\n        REFERENCES Participant (participantNo)\n);\n\nCREATE TABLE Workshop (\n    workshopNo DECIMAL(6)    NOT NULL,\n    title      VARCHAR(100)  NOT NULL,\n    category   VARCHAR(30)   NOT NULL,\n    `date`     DATE          NOT NULL,\n    fee        DECIMAL(5,2)  NOT NULL,\n    capacity   DECIMAL(4)    NOT NULL,\n    CONSTRAINT Workshop_pkey PRIMARY KEY (workshopNo)\n);\n\nCREATE TABLE Requirement (\n    workshopNo   DECIMAL(6)   NOT NULL,\n    qname        VARCHAR(50)  NOT NULL,\n    requiredLevel DECIMAL(1)  NOT NULL,\n    mandatory    CHAR(1)      NOT NULL,\n    CONSTRAINT Requirement_pkey PRIMARY KEY (workshopNo, qname),\n    CONSTRAINT Requirement_fkey1 FOREIGN KEY (workshopNo)\n        REFERENCES Workshop (workshopNo)\n);\n\nCREATE TABLE Trainer (\n    trainerNo    DECIMAL(6)   NOT NULL,\n    fname        VARCHAR(20)  NOT NULL,\n    lname        VARCHAR(30)  NOT NULL,\n    organisation VARCHAR(80),\n    expertise    VARCHAR(60)  NOT NULL,\n    CONSTRAINT Trainer_pkey PRIMARY KEY (trainerNo)\n);\n\nCREATE TABLE Enrolment (\n    participantNo DECIMAL(6)   NOT NULL,\n    workshopNo    DECIMAL(6)   NOT NULL,\n    enroldate     DATE         NOT NULL,\n    status        VARCHAR(15)  NOT NULL,\n    CONSTRAINT Enrolment_pkey PRIMARY KEY (participantNo, workshopNo),\n    CONSTRAINT Enrolment_fkey1 FOREIGN KEY (participantNo)\n        REFERENCES Participant (participantNo),\n    CONSTRAINT Enrolment_fkey2 FOREIGN KEY (workshopNo)\n        REFERENCES Workshop (workshopNo)\n);\n\nCREATE TABLE WorkshopTrainer (\n    workshopNo DECIMAL(6)    NOT NULL,\n    trainerNo  DECIMAL(6)    NOT NULL,\n    topic      VARCHAR(100)  NOT NULL,\n    CONSTRAINT WorkshopTrainer_pkey PRIMARY KEY (workshopNo, trainerNo),\n    CONSTRAINT WorkshopTrainer_fkey1 FOREIGN KEY (workshopNo)\n        REFERENCES Workshop (workshopNo),\n    CONSTRAINT WorkshopTrainer_fkey2 FOREIGN KEY (trainerNo)\n        REFERENCES Trainer (trainerNo)\n);\n\nCOMMIT;\n/* ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ */\n/* End of script  for(const [id,r] of Object.entries(records)){
  if(!byId[id]||!r||typeof r!=='object')continue;
  result[id]={answer:typeof r.answer==='string'?r.answer:'',done:r.done===true,updatedAt:typeof r.updatedAt==='string'?r.updatedAt:''};
 }return result;
}
function matches(q,filters,state){
 const query=filters.search.trim().toLowerCase();
 const text=[q.id,q.title,q.topic,q.question,q.tags.join(' ')].join(' ').toLowerCase();
 if(query&&!query.split(/\s+/).every(x=>text.includes(x)))return false;
 if(filters.area!=='all'&&!q.areas.includes(filters.area)&&!(filters.area==='Extension'&&q.priority==='extension'))return false;
 if(filters.source==='lecture'&&!q.source.startsWith('lecture-'))return false;
 if(!['all','lecture'].includes(filters.source)&&q.source!==filters.source)return false;
 if(filters.mode==='unique'&&q.canonical)return false;
 if(filters.mode==='core'&&q.priority!=='core')return false;
 if(filters.mode==='unfinished'&&(q.canonical||state[q.id]?.done))return false;
 if(filters.mode==='extension'&&!['extension','method'].includes(q.priority))return false;
 return true;
}
let state={},canSave=true,storageMessage='',activeId='',activeTab='question',activePart=0,filtered=[];
try{state=cleanRecords(JSON.parse(localStorage.getItem(key)||'{}'));localStorage.setItem(key,JSON.stringify(state));}catch(e){canSave=false;storageMessage='本地保存暂不可用，请导出记录备份。';}
const ids=['search','area','source','mode'];
function filters(){return Object.fromEntries(ids.map(id=>[id,$(id).value]));}
function toast(msg){$('toast').textContent=msg;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3500);}
function save(){
 if(canSave)try{localStorage.setItem(key,JSON.stringify(state));storageMessage='已保存在此浏览器 · '+new Date().toLocaleTimeString();}catch(e){canSave=false;storageMessage='本地保存空间不足，请导出记录备份。';}
 $('save-state').textContent=storageMessage||(canSave?'会自动保存在此浏览器。':'请导出记录备份。');
}
function updateRecord(values){state[activeId]={...state[activeId],...values,updatedAt:new Date().toISOString()};save();}
function decorate(container){
 container.querySelectorAll('pre').forEach(pre=>{
  if(pre.querySelector('.copy'))return;const b=document.createElement('button');b.className='copy';b.type='button';b.textContent='复制';b.setAttribute('aria-label','复制这段代码');
  b.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(pre.querySelector('code')?.textContent||'');b.textContent='已复制';setTimeout(()=>b.textContent='复制',1800);}catch(e){toast('无法自动复制，请选中代码复制。');}});pre.append(b);
 });
 container.querySelectorAll('.zoom').forEach(b=>b.addEventListener('click',()=>openDialog('Conceptual schema',`<div class="zoomed">${b.closest('figure').querySelector('.diagram-scroll').innerHTML}</div>`)));
 container.querySelectorAll('img').forEach(img=>{img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','放大原题图：'+img.alt);const zoom=()=>openDialog('Original question diagram',`<div class="zoomed"><img src="${esc(img.getAttribute('src'))}" alt="${esc(img.alt)}"></div>`);img.addEventListener('click',zoom);img.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();zoom();}});});
}
function codeHTML(markdown){
 return markdown.replace(/```(\w*)\n([\s\S]*?)```/g,(_,lang,code)=>`<pre><code class="language-${esc(lang)}">${esc(code.trim())}</code></pre>`);
}
function showPart(index){
 const q=byId[activeId];activePart=index;const p=q.parts[index];if(!p)return;
 $('part-list').innerHTML=q.parts.map((part,i)=>`<button type="button" data-part="${i}" aria-pressed="${i===index}" aria-label="小题 ${esc(part.number)}">(${esc(part.number)})</button>`).join('');
 $('part-list').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>showPart(+b.dataset.part)));
 $('walkthrough').innerHTML=`<div class="goal">${esc(p.goal)}</div><ol class="steps">${p.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${p.code?`<h3>对应写法</h3>${codeHTML(p.code)}`:'<p class="small">完整图或schemas在“参考答案”中。</p>'}<div class="note"><strong>完成后核对</strong>${esc(p.check)}</div><div class="note trap"><strong>易错点</strong>${esc(p.pitfall)}</div>`;
 decorate($('walkthrough'));
}
function tab(name,focus=false){
 activeTab=name;for(const b of $('tabs').querySelectorAll('[data-tab]')){const selected=b.dataset.tab===name;b.setAttribute('aria-selected',String(selected));b.tabIndex=selected?0:-1;$('panel-'+b.dataset.tab).hidden=!selected;}
 if(focus)$('tab-'+name).focus();
}
function renderNav(){
 $('question-nav').innerHTML=filtered.map(q=>`<button class="nav-item" data-id="${q.id}"${activeId===q.id?' aria-current="page"':''}><strong>${esc(q.id)} ${state[q.id]?.done?'<i aria-label="已独立作答">✓</i>':''}</strong><span>${esc(q.title)}</span></button>`).join('');
 $('question-nav').querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.id,true)));
 const done=BANK.questions.filter(q=>!q.canonical&&state[q.id]?.done).length;
 $('count').textContent=`${filtered.length} 题目组 · 已做 ${done}/48`;$('mobile-count').textContent=`${filtered.length} 题目组`;
 const i=filtered.findIndex(q=>q.id===activeId);$('position').textContent=filtered.length?`${i+1} / ${filtered.length}`:'0 / 0';$('prev').disabled=i<=0;$('next').disabled=i<0||i>=filtered.length-1;
}
function renderQuestion(){
 const q=byId[activeId];if(!q)return;
 $('question-heading').textContent=q.id+' · '+q.title;
 const priority={extension:'扩展保留',method:'方法补强',duplicate:'重复来源'}[q.priority];
 $('badges').innerHTML=`<span class="badge">${esc(q.sourceLabel)}</span>${q.areas.map(a=>`<span class="badge">${esc(names[a]||a)}</span>`).join('')}${priority?`<span class="badge extra">${priority}</span>`:''}${!q.source.startsWith('mock')&&!q.source.startsWith('assignment')?'<span class="badge extra">补充练习</span>':''}`;
 $('source-note').textContent=q.sourceNote;
 const alias=q.canonical?`<p class="note">本题与${esc(q.canonical)}内容相同，保留原来源，不重复计算练习量。</p><button class="canonical-link" data-canonical="${q.canonical}">打开${q.canonical}及解析 →</button>`:'';
 $('panel-question').innerHTML=q.questionHTML+alias;
 $('panel-answer').innerHTML=q.canonical?alias:q.answerHTML;
 $('part-list').innerHTML='';$('walkthrough').innerHTML=q.canonical?alias:'';
 if(q.parts.length)showPart(0);
 for(const c of [$('panel-question'),$('panel-answer'),$('walkthrough')]){decorate(c);c.querySelectorAll('[data-canonical]').forEach(b=>b.addEventListener('click',()=>reveal(b.dataset.canonical)));}
 $('draft').value=state[activeId]?.answer||'';$('done').checked=!!state[activeId]?.done;
 $('context').disabled=!q.context;$('context').textContent=q.context?'查看表结构 / 数据':'本题所需信息在题面';
 $('save-state').textContent=storageMessage||(canSave?'会自动保存在此浏览器。':'请导出记录备份。');
 tab('question');renderNav();
}
function go(id,focus=false){
 if(!byId[id])return;activeId=id;history.replaceState(null,'','#'+id.toLowerCase());renderQuestion();
 document.querySelector('.workspace').classList.remove('show-list');$('list-toggle').setAttribute('aria-expanded','false');if(focus)$('question-heading').focus();
}
function filter(){
 filtered=BANK.questions.filter(q=>matches(q,filters(),state));$('reader').hidden=!filtered.length;$('empty').hidden=!!filtered.length;
 if(filtered.length&&!filtered.some(q=>q.id===activeId)){go(filtered[0].id);}else renderNav();
}
function reset(){for(const id of ids)$(id).value=id==='search'?'':id==='mode'?'unique':'all';filter();}
function reveal(id){
 id=id.toUpperCase();if(!byId[id])return;
 if(!matches(byId[id],filters(),state)){for(const k of ids)$(k).value=k==='search'?'':'all';filtered=BANK.questions.slice();$('reader').hidden=false;$('empty').hidden=true;}
 go(id);
}
let lastFocus;
function openDialog(title,html){lastFocus=document.activeElement;$('dialog-title').textContent=title;$('dialog-content').innerHTML=html;decorate($('dialog-content'));$('dialog').showModal();}
function contextHTML(q){const ctx=BANK.contexts[q.context];if(!ctx)return '';return `<h3>${esc(ctx.title)}</h3><p class="small">同一Task的顺序依题面执行；不同Task通常从原始状态独立开始。lecture验证数据与原始作业数据已分别标明。</p><pre><code class="language-sql">${esc(ctx.sql)}</code></pre>${ctx.data?`<h3>Data</h3><pre><code class="language-sql">${esc(ctx.data)}</code></pre>`:''}`;}
$('context').addEventListener('click',()=>openDialog('题目使用的schema与数据',contextHTML(byId[activeId])));
$('coverage').addEventListener('click',()=>openDialog('考点核查 · 六个考试范围',`<p>依据21Review.pdf p10与Week13说明核对。范围不代表最后试卷固定题号、顺序或分值。Mock 1与收到的Mock 3相同；Normalization由Assignment 4及补充练习覆盖。</p><p>48个去重题目组，158个小题；另保留6个重复来源。Auditing与Concurrency按扩展保留。</p><div class="table-scroll"><table><thead><tr><th>范围</th><th>考点</th><th>题目</th></tr></thead><tbody>${BANK.coverage.map(c=>`<tr><td>${esc(names[c.area]||c.area)}${c.priority==='method'?' · 方法补强':''}</td><td>${esc(c.topic)}<br><small>${esc(c.source)}</small></td><td>${c.questions.map(id=>`<button class="text-button" data-jump="${id}">${id}</button>`).join(' ')}</td></tr>`).join('')}</tbody></table></div><p><a href="coverage.md">下载范围对照</a> · <a href="validation.md">查看验证与限制</a></p>`));
$('audit').addEventListener('click',()=>openDialog('勘误与题面歧义',`<p>原题的数值、条件和含糊表达保留；参考答案说明采用的解释。以下记录区分题库修正、资料问题及验证边界。</p>${BANK.errata.map(e=>`<article class="audit-card"><div class="small">${esc(e.id+' · '+e.kind)}</div><h3>${esc(e.title)}</h3><p>${esc(e.finding)}</p><p>${esc(e.resolution)}</p>${e.questions.map(id=>`<button class="text-button" data-jump="${id}">${id}</button>`).join(' ')}${e.link?`<p><a href="${esc(e.link)}" target="_blank" rel="noopener">官方参考</a></p>`:''}</article>`).join('')}<p><a href="audit.md">完整核查报告</a> · <a href="validation.md">验证与限制</a></p>`));
$('dialog-content').addEventListener('click',e=>{const b=e.target.closest('[data-jump]');if(b){$('dialog').close();reveal(b.dataset.jump);}});
$('close-dialog').addEventListener('click',()=>$('dialog').close());$('dialog').addEventListener('close',()=>lastFocus?.focus());
for(const id of ids)$(id).addEventListener(id==='search'?'input':'change',()=>{if(id==='source'&&$('source').value==='mock-3')$('mode').value='all';filter();});
$('reset').addEventListener('click',reset);$('empty-reset').addEventListener('click',reset);
$('tabs').querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>tab(b.dataset.tab)));
$('tabs').addEventListener('keydown',e=>{const tabs=[...$('tabs').querySelectorAll('[data-tab]')];const i=tabs.findIndex(b=>b.dataset.tab===activeTab);let n;if(e.key==='ArrowRight')n=(i+1)%tabs.length;if(e.key==='ArrowLeft')n=(i-1+tabs.length)%tabs.length;if(e.key==='Home')n=0;if(e.key==='End')n=tabs.length-1;if(n!==undefined){e.preventDefault();tab(tabs[n].dataset.tab,true);}});
$('draft').addEventListener('input',()=>updateRecord({answer:$('draft').value}));$('done').addEventListener('change',()=>{updateRecord({done:$('done').checked});filter();});
$('prev').addEventListener('click',()=>{const i=filtered.findIndex(q=>q.id===activeId);if(i>0)go(filtered[i-1].id,true);});$('next').addEventListener('click',()=>{const i=filtered.findIndex(q=>q.id===activeId);if(i>=0&&i+1<filtered.length)go(filtered[i+1].id,true);});
$('list-toggle').addEventListener('click',()=>{const on=document.querySelector('.workspace').classList.toggle('show-list');$('list-toggle').setAttribute('aria-expanded',String(on));});
$('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({course:'CSIT882',bankVersion:BANK.version,exportedAt:new Date().toISOString(),records:state},null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='CSIT882-records-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);});
$('import').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.course&&obj.course!=='CSIT882')throw Error('这不是CSIT882记录');const incoming=cleanRecords(obj);for(const [id,r] of Object.entries(incoming)){if(!state[id]||!state[id].updatedAt||r.updatedAt>state[id].updatedAt)state[id]=r;}save();renderQuestion();toast(`已合并${Object.keys(incoming).length}条记录；同题保留较新记录。`);}catch(err){toast('导入失败：'+err.message);}finally{e.target.value='';}});
$('print').addEventListener('click',()=>{$('print-context').innerHTML=contextHTML(byId[activeId]);window.print();});
window.addEventListener('afterprint',()=>$('print-context').innerHTML='');
window.addEventListener('hashchange',()=>reveal(hashId()));
filtered=BANK.questions.filter(q=>matches(q,filters(),state));
const hash=hashId();if(byId[hash])reveal(hash);else go(filtered[0].id);
window.CSIT882={matches,cleanRecords,get current(){return activeId;},get records(){return structuredClone(state);},reveal};
</script></body></html>
