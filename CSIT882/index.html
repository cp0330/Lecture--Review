IFNULL(budget, 0) AS increasedBudget FROM DEPARTMENT;\n\u003c/code>\u003c/pre>\n"},{"number":"4","goal":"求全体部门职员总数","steps":["total_staff_number才是人数。","SUM逐行加总，不按部门分组。","COUNT(*)得到的是部门数，不是员工总数。"],"check":"fixture得到35。","pitfall":"不要COUNT(total_staff_number)只数非空部门行。","mainType":"fundamentals","knowledge":["projection","aggregatefn"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Lecture example: DEPARTMENT and COURSE schema与题面条件","output":"求全体部门职员总数","examTips":["fixture得到35。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不要COUNT(total_staff_number)只数非空部门行。"],"tables":["DEPARTMENT"],"knowledgeUses":{"projection":"本小题输出：求全体部门职员总数","aggregatefn":"fixture得到35。"},"sqlPlan":[{"label":"选表／对象","text":"DEPARTMENT"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"fixture得到35。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT SUM(total_staff_number) AS totalStaff FROM DEPARTMENT;\n\u003c/code>\u003c/pre>\n"},{"number":"5","goal":"求最大部门的职员人数","steps":["MAX作用于人数列。","返回一个聚合数值。","题目未要求部门名，不随意SELECT一个未分组name。"],"check":"fixture得到20。","pitfall":"MAX(name)按字符比较，与人数无关。","mainType":"fundamentals","knowledge":["projection","aggregatefn"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Lecture example: DEPARTMENT and COURSE schema与题面条件","output":"求最大部门的职员人数","examTips":["fixture得到20。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["MAX(name)按字符比较，与人数无关。"],"tables":["DEPARTMENT"],"knowledgeUses":{"projection":"本小题输出：求最大部门的职员人数","aggregatefn":"fixture得到20。"},"sqlPlan":[{"label":"选表／对象","text":"DEPARTMENT"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"fixture得到20。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT MAX(total_staff_number) AS largestDepartment FROM DEPARTMENT;\n\u003c/code>\u003c/pre>\n"},{"number":"6","goal":"求日期差","steps":["结束日期是运行当天CURRENT_DATE()。","开始日期为2001-01-01。","DATEDIFF返回天数；结果随运行日期变化。"],"check":"不把某一天的测试输出写成永远固定答案。","pitfall":"日期不能当普通整数相减。","mainType":"fundamentals","knowledge":["projection","filter"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Lecture example: DEPARTMENT and COURSE schema与题面条件","output":"求日期差","examTips":["不把某一天的测试输出写成永远固定答案。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["日期不能当普通整数相减。"],"tables":[],"knowledgeUses":{"projection":"本小题输出：求日期差","filter":"不把某一天的测试输出写成永远固定答案。"},"sqlPlan":[{"label":"选表／对象","text":"按题面确定数据库、账号或表。"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"不把某一天的测试输出写成永远固定答案。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT DATEDIFF(CURRENT_DATE(), &#39;2001-01-01&#39;) AS daysPassed;\n\u003c/code>\u003c/pre>\n"}],"tags":["Row functions, strings, arithmetic and dates","COUNT, SUM, AVG and MAX"],"legacyPriority":"core","level":"C","archived":false,"originType":"Supplementary Practice","mainType":"fundamentals","related":[],"examRelevance":"按需参考；不进入主要练习","coverageStatus":"reference","questionZh":"辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["projection","aggregatefn","filter"],"types":["fundamentals"],"requiredSkills":["SELECT / projection / 选择输出列","AVG / MAX / SUM / 对选定行计算统计值","WHERE / predicate / 逐行筛选条件"],"questionHTML":"\u003cp>Using the lecture DEPARTMENT and COURSE tables, write SELECT statements for these lecture questions.\u003c/p>\n\u003cp>(1) List the names of departments in uppercase format.\u003c/p>\n\u003cp>(2) Find the first three characters from all course codes and full titles of all courses.\u003c/p>\n\u003cp>(3) Display the name of departments and budgets increased by 10%.\u003c/p>\n\u003cp>(4) Find the total number of all staff members in all departments.\u003c/p>\n\u003cp>(5) Find the total number of staff members in the largest department.\u003c/p>\n\u003cp>(6) How many days have passed since 1 January 2001?\u003c/p>\n","translationHTML":"\u003cp>辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。\u003c/p>\n","answerHTML":"\u003cp>这些题分别练习row functions、算术表达式、group functions和日期函数。这里的DEPARTMENT.budget允许NULL，和其他讲义里不可空的版本不同。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nSELECT UPPER(name) AS departmentName FROM DEPARTMENT;\n-- (2)\nSELECT SUBSTR(cnum, 1, 3) AS prefix, title FROM COURSE;\n-- (3) Follow the lecture&#39;s explicit IFNULL convention for missing budget.\nSELECT name, 1.10 * IFNULL(budget, 0) AS increasedBudget FROM DEPARTMENT;\n-- (4)\nSELECT SUM(total_staff_number) AS totalStaff FROM DEPARTMENT;\n-- (5)\nSELECT MAX(total_staff_number) AS largestDepartment FROM DEPARTMENT;\n-- (6)\nSELECT DATEDIFF(CURRENT_DATE(), &#39;2001-01-01&#39;) AS daysPassed;\n\u003c/code>\u003c/pre>\n\u003cp>(3)是SELECT，显示增加后的数值，不会把budget改写回表。课件用IFNULL把缺失预算按0显示；这是课件示例的处理约定，不能推广成“未知金额总等于0”。(4)是人数总和，不是部门数；(5)是最大人数，不是最大部门名。(6)的结果随运行日期变化，不在答案中写死天数。\u003c/p>\n"},{"id":"L02","title":"Intersection and difference queries","topic":"Intersection and difference queries","areas":["SELECT"],"source":"lecture-select","sourceLabel":"SELECT lectures","sourceNote":"SELECT Statement (2).pdf pp13–14; English questions reproduced, including their course terminology.","origin":"Lecture questions","priority":"C","question":"Use the lecture DEPARTMENT and COURSE tables.\n\n(1) Find the credit points that can be earned both for a course offered by Physics and for a course offered by Mathematics.\n\n(2) Find the credit points that can be earned for a course offered by Physics and cannot be earned for a course offered by Mathematics.","context":"lecture","canonical":null,"parts":[{"number":"1","goal":"求Physics与Mathematics学分集合交集","steps":["先筛Physics课程的credits。","IN检查该credits也出现在Mathematics。","DISTINCT消除同一credits的多次课程出现。"],"check":"fixture只有6。","pitfall":"不是找被两部门共同开设的同一课程号。","mainType":"fundamentals","knowledge":["projection","filter","distinct"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Lecture example: DEPARTMENT and COURSE schema与题面条件","output":"求Physics与Mathematics学分集合交集","examTips":["fixture只有6。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不是找被两部门共同开设的同一课程号。"],"tables":["COURSE"],"knowledgeUses":{"projection":"本小题输出：求Physics与Mathematics学分集合交集","filter":"fixture只有6。","distinct":"fixture只有6。"},"sqlPlan":[{"label":"选表／对象","text":"COURSE"},{"label":"连接与层次","text":"按题目指定形式区分内外层查询。"},{"label":"筛选、分组与输出","text":"fixture只有6。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT DISTINCT P.credits\nFROM COURSE AS P\nWHERE P.offered_by = &#39;Physics&#39;\n  AND P.credits IN (\n      SELECT M.credits FROM COURSE AS M WHERE M.offered_by = &#39;Mathematics&#39;\n  );\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"求Physics有而Mathematics没有的学分","steps":["从Physics的credits出发。","相关NOT EXISTS检查Mathematics中没有相同credits。","SELECT DISTINCT输出集合；不依赖MySQL较新EXCEPT语法。"],"check":"fixture只有12。","pitfall":"用JOIN所有不同credits不是集合差集。","mainType":"fundamentals","knowledge":["projection","filter","exists","distinct"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Lecture example: DEPARTMENT and COURSE schema与题面条件","output":"求Physics有而Mathematics没有的学分","examTips":["fixture只有12。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["用JOIN所有不同credits不是集合差集。"],"tables":["COURSE"],"knowledgeUses":{"projection":"本小题输出：求Physics有而Mathematics没有的学分","filter":"fixture只有12。","exists":"fixture只有12。","distinct":"fixture只有12。"},"sqlPlan":[{"label":"选表／对象","text":"COURSE"},{"label":"连接与层次","text":"按题目指定形式区分内外层查询。"},{"label":"筛选、分组与输出","text":"fixture只有12。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT DISTINCT P.credits\nFROM COURSE AS P\nWHERE P.offered_by = &#39;Physics&#39;\n  AND NOT EXISTS (\n      SELECT 1 FROM COURSE AS M\n      WHERE M.offered_by = &#39;Mathematics&#39; AND M.credits = P.credits\n  );\n\u003c/code>\u003c/pre>\n"}],"tags":["UNION, duplicates, intersection and difference"],"legacyPriority":"core","level":"C","archived":true,"originType":"Supplementary Practice","mainType":"fundamentals","related":[],"examRelevance":"按需参考；不进入主要练习","archiveReason":"已有核心原题覆盖方法，或超出本轮确认的操作深度；保留溯源，不参与默认练习。","coverageStatus":"reference","questionZh":"辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["projection","filter","distinct","exists"],"types":["fundamentals"],"requiredSkills":["SELECT / projection / 选择输出列","WHERE / predicate / 逐行筛选条件","DISTINCT / 删除重复结果行","EXISTS / NOT EXISTS / 存在与不存在"],"questionHTML":"\u003cp>Use the lecture DEPARTMENT and COURSE tables.\u003c/p>\n\u003cp>(1) Find the credit points that can be earned both for a course offered by Physics and for a course offered by Mathematics.\u003c/p>\n\u003cp>(2) Find the credit points that can be earned for a course offered by Physics and cannot be earned for a course offered by Mathematics.\u003c/p>\n","translationHTML":"\u003cp>辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。\u003c/p>\n","answerHTML":"\u003cp>每行结果是一种学分值，不是科目编号。分别求两边的学分集合，再求交集或差集。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nSELECT DISTINCT P.credits\nFROM COURSE AS P\nWHERE P.offered_by = &#39;Physics&#39;\n  AND P.credits IN (\n      SELECT M.credits FROM COURSE AS M WHERE M.offered_by = &#39;Mathematics&#39;\n  );\n-- (2)\nSELECT DISTINCT P.credits\nFROM COURSE AS P\nWHERE P.offered_by = &#39;Physics&#39;\n  AND NOT EXISTS (\n      SELECT 1 FROM COURSE AS M\n      WHERE M.offered_by = &#39;Mathematics&#39; AND M.credits = P.credits\n  );\n\u003c/code>\u003c/pre>\n\u003cp>DISTINCT防止同一学分值因多门课重复出现。测试样例中(1)为6，(2)为12。credits在此schema中NOT NULL，因此课件的NOT IN版本也能使用；对可能含NULL的列，要另外处理三值逻辑。\u003c/p>\n\u003cp>课件称MySQL不支持INTERSECT/MINUS，不能当作所有版本的现状。当前MySQL文档提供INTERSECT和EXCEPT；本解沿用课件的IN/NOT EXISTS方法，不依赖较新语法。\u003ca href=\"https://dev.mysql.com/doc/refman/8.4/en/set-operations.html\">MySQL set operations\u003c/a>。\u003c/p>\n"},{"id":"L03","title":"Anti-join with a nullable foreign key","topic":"Anti-join with a nullable foreign key","areas":["SELECT"],"source":"lecture-select","sourceLabel":"SELECT lectures","sourceNote":"SELECT Statement (5).pdf p10. The English question is from the lecture; the required NULL case is an explicit verification condition.","origin":"Lecture question + explicit NULL test","priority":"C","question":"Find the chairs of all departments that offer no courses.\n\nUse the lecture DEPARTMENT and COURSE tables. The offered_by column is nullable. Your answer must also work when at least one course has no assigned department.","context":"lecture","canonical":null,"parts":[{"number":"1","goal":"在可空foreign key下做正确anti-join","steps":["从DEPARTMENT开始检查每个部门。","子查询用C.offered_by=D.name关联，NOT EXISTS表示完全没有其课程。","NULL offered_by不匹配任何具体部门，也不会毒化整个NOT EXISTS。","对照NOT IN：若其集合含NULL，很多比较成为UNKNOWN，不能直接照抄课件未滤NULL的写法。"],"check":"fixture保留Biology，chair为NULL仍应有一行。","pitfall":"不要因为输出字段chair本身NULL就认为部门不该存在。","mainType":"fundamentals","knowledge":["projection","filter","exists"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Lecture example: DEPARTMENT and COURSE schema与题面条件","output":"在可空foreign key下做正确anti-join","examTips":["fixture保留Biology，chair为NULL仍应有一行。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不要因为输出字段chair本身NULL就认为部门不该存在。"],"tables":["DEPARTMENT","COURSE"],"knowledgeUses":{"projection":"本小题输出：在可空foreign key下做正确anti-join","filter":"fixture保留Biology，chair为NULL仍应有一行。","exists":"fixture保留Biology，chair为NULL仍应有一行。"},"sqlPlan":[{"label":"选表／对象","text":"DEPARTMENT, COURSE"},{"label":"连接与层次","text":"按题目指定形式区分内外层查询。"},{"label":"筛选、分组与输出","text":"fixture保留Biology，chair为NULL仍应有一行。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT D.chair\nFROM DEPARTMENT AS D\nWHERE NOT EXISTS (\n    SELECT 1 FROM COURSE AS C WHERE C.offered_by = D.name\n);\n\u003c/code>\u003c/pre>\n"}],"tags":["NULL, empty strings and three-valued logic","Nested queries, EXISTS and anti-joins"],"legacyPriority":"core","level":"C","archived":false,"originType":"Supplementary Practice","mainType":"fundamentals","related":[],"examRelevance":"按需参考；不进入主要练习","coverageStatus":"reference","questionZh":"辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["projection","filter","exists"],"types":["fundamentals"],"requiredSkills":["SELECT / projection / 选择输出列","WHERE / predicate / 逐行筛选条件","EXISTS / NOT EXISTS / 存在与不存在"],"questionHTML":"\u003cp>Find the chairs of all departments that offer no courses.\u003c/p>\n\u003cp>Use the lecture DEPARTMENT and COURSE tables. The offered_by column is nullable. Your answer must also work when at least one course has no assigned department.\u003c/p>\n","translationHTML":"\u003cp>辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。\u003c/p>\n","answerHTML":"\u003cp>“没有开课”要从DEPARTMENT出发，检查不存在引用这个部门的COURSE记录。未分配部门的课程不属于任何具体部门，不应使所有部门都消失。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">SELECT D.chair\nFROM DEPARTMENT AS D\nWHERE NOT EXISTS (\n    SELECT 1 FROM COURSE AS C WHERE C.offered_by = D.name\n);\n\u003c/code>\u003c/pre>\n\u003cp>测试fixture中Biology没有课程，所以保留它的一行；其chair恰好为NULL，不能因此把部门删掉。课件直接使用name NOT IN (SELECT offered_by FROM COURSE)，当子查询包含NULL时会产生UNKNOWN，导致预期的未开课部门也被过滤。也可先在子查询排除NULL再用NOT IN。\u003c/p>\n"},{"id":"L04","title":"ALTER, referential actions and TRUNCATE","topic":"ALTER, referential actions and TRUNCATE","areas":["DDL/DML"],"source":"lecture-ddl","sourceLabel":"DDL and advanced DDL/DML","sourceNote":"SQL - Data Definition Language (DDL).pdf pp13,20–26; Advanced DDL and DML statements.pdf pp3–4. Supplementary instructions based on lecture methods.","origin":"Lecture-based supplementary practice","priority":"C","question":"In a separate practice schema, perform the following operations in order. Assume InnoDB tables and enforced CHECK constraints.\n\n(1) Create PracticeParent(id), with id as its primary key, and PracticeChild(id, parentId, qty). PracticeChild.id is its primary key. qty must be positive. parentId references PracticeParent(id), with ON UPDATE CASCADE and ON DELETE CASCADE. Use integer columns; all columns are mandatory.\n\n(2) Insert parent 1 and child 101, belonging to parent 1, with qty = 2.\n\n(3) Change parent 1 to parent 2. Show the child row after the update.\n\n(4) Delete parent 2. Show the child rows after the deletion.\n\n(5) Insert parent 3 and child 102 with qty = 2, then COMMIT. Start a transaction, change the child's qty to 3, TRUNCATE PracticeChild, and ROLLBACK. Show the remaining child rows. Explain the transaction effect.\n\n(6) Add an optional note column of type VARCHAR(100) to PracticeChild, change it to VARCHAR(200), rename the table to PracticeItems, then drop the note column. Finally, drop its foreign key and its CHECK constraint using their actual constraint names. Do not disable foreign-key checks.","context":"","canonical":null,"parts":[{"number":"1","goal":"创建带reference actions的两表","steps":["先建父表PracticeParent。","子表mandatory列、PK、正数CHECK各自定义。","foreign key明确写ON UPDATE CASCADE和ON DELETE CASCADE；这不是所有表默认行为。"],"check":"数据修改会依定义跟随父键变化。","pitfall":"CASCADE不等于关闭约束。","mainType":"ddl-dml","knowledge":["dml","keys","constraints"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"英文题面和给定图／FD","output":"创建带reference actions的两表","examTips":["数据修改会依定义跟随父键变化。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["CASCADE不等于关闭约束。"],"tables":["PracticeParent","PracticeChild","CASCADE"],"knowledgeUses":{"dml":"涉及对象／命名中间结果：PracticeParent, PracticeChild, CASCADE","keys":"涉及对象／命名中间结果：PracticeParent, PracticeChild, CASCADE","constraints":"数据修改会依定义跟随父键变化。"},"sqlPlan":[{"label":"选表／对象","text":"PracticeParent, PracticeChild, CASCADE"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"数据修改会依定义跟随父键变化。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">CREATE TABLE PracticeParent (\n    id INT NOT NULL, CONSTRAINT pp_pkey PRIMARY KEY (id)\n) ENGINE=InnoDB;\nCREATE TABLE PracticeChild (\n    id INT NOT NULL, parentId INT NOT NULL, qty INT NOT NULL,\n    CONSTRAINT pc_pkey PRIMARY KEY (id),\n    CONSTRAINT pc_qty_check CHECK (qty &gt; 0),\n    CONSTRAINT pc_parent_fkey FOREIGN KEY (parentId) REFERENCES PracticeParent(id)\n        ON UPDATE CASCADE ON DELETE CASCADE\n) ENGINE=InnoDB;\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"按父子顺序插入","steps":["父记录1先存在。","再插子记录101引用1且qty=2。","检查主键唯一和qty范围。"],"check":"子记录为101,1,2。","pitfall":"先插子行会失败。","mainType":"ddl-dml","knowledge":["dml"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"英文题面和给定图／FD","output":"按父子顺序插入","examTips":["子记录为101,1,2。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["先插子行会失败。"],"tables":["PracticeParent","PracticeChild"],"knowledgeUses":{"dml":"涉及对象／命名中间结果：PracticeParent, PracticeChild"},"sqlPlan":[{"label":"选表／对象","text":"PracticeParent, PracticeChild"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"子记录为101,1,2。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">INSERT INTO PracticeParent VALUES (1);\nINSERT INTO PracticeChild VALUES (101, 1, 2);\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"更新被引用primary key并观察CASCADE","steps":["定位父id=1。","把父键更新为2。","子表foreign key定义了ON UPDATE CASCADE，因此parentId随之变2。"],"check":"子行101,2,2。","pitfall":"只因为普通FK存在就假设会自动级联。","mainType":"ddl-dml","knowledge":["projection","filter","dml"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"英文题面和给定图／FD","output":"更新被引用primary key并观察CASCADE","examTips":["子行101,2,2。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["只因为普通FK存在就假设会自动级联。"],"tables":["PracticeParent","PracticeChild"],"knowledgeUses":{"projection":"本小题输出：更新被引用primary key并观察CASCADE","filter":"子行101,2,2。","dml":"涉及对象／命名中间结果：PracticeParent, PracticeChild"},"sqlPlan":[{"label":"选表／对象","text":"PracticeParent, PracticeChild"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"子行101,2,2。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">UPDATE PracticeParent SET id = 2 WHERE id = 1;\nSELECT id, parentId, qty FROM PracticeChild;\n\u003c/code>\u003c/pre>\n"},{"number":"4","goal":"删除父行并观察CASCADE","steps":["定位父id=2。","ON DELETE CASCADE使对应子记录删除。","检查子表为空，不对另一个无CASCADE场景照搬。"],"check":"没有101这条子行。","pitfall":"题面未给CASCADE时不能自行假设。","mainType":"ddl-dml","knowledge":["projection","filter","dml","keys"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"英文题面和给定图／FD","output":"删除父行并观察CASCADE","examTips":["没有101这条子行。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["题面未给CASCADE时不能自行假设。"],"tables":["PracticeParent","PracticeChild"],"knowledgeUses":{"projection":"本小题输出：删除父行并观察CASCADE","filter":"没有101这条子行。","dml":"涉及对象／命名中间结果：PracticeParent, PracticeChild","keys":"涉及对象／命名中间结果：PracticeParent, PracticeChild"},"sqlPlan":[{"label":"选表／对象","text":"PracticeParent, PracticeChild"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"没有101这条子行。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">DELETE FROM PracticeParent WHERE id = 2;\nSELECT id, parentId, qty FROM PracticeChild;\n\u003c/code>\u003c/pre>\n"},{"number":"5","goal":"检验TRUNCATE的implicit commit","steps":["重新装载父3和子102并先COMMIT作为初始状态。","显式事务把qty改3，然后TRUNCATE子表。","TRUNCATE隐式提交且清空表，后续ROLLBACK无法恢复这些行。"],"check":"子表仍为空，父表3仍在。","pitfall":"TRUNCATE不能带WHERE；不能把它当可回滚DELETE。","mainType":"ddl-dml","knowledge":["projection","filter","dml","transaction"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"英文题面和给定图／FD","output":"检验TRUNCATE的implicit commit","examTips":["子表仍为空，父表3仍在。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["TRUNCATE不能带WHERE；不能把它当可回滚DELETE。"],"tables":["PracticeParent","PracticeChild"],"knowledgeUses":{"projection":"本小题输出：检验TRUNCATE的implicit commit","filter":"子表仍为空，父表3仍在。","dml":"涉及对象／命名中间结果：PracticeParent, PracticeChild","transaction":"子表仍为空，父表3仍在。"},"sqlPlan":[{"label":"选表／对象","text":"PracticeParent, PracticeChild"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"子表仍为空，父表3仍在。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">INSERT INTO PracticeParent VALUES (3);\nINSERT INTO PracticeChild VALUES (102, 3, 2);\nCOMMIT;\nSTART TRANSACTION;\nUPDATE PracticeChild SET qty = 3 WHERE id = 102;\nTRUNCATE TABLE PracticeChild;\nROLLBACK;\nSELECT id, parentId, qty FROM PracticeChild;\n\u003c/code>\u003c/pre>\n"},{"number":"6","goal":"按实际名称ALTER和撤约束","steps":["ADD COLUMN note，再MODIFY其类型，保留NULL条件。","RENAME之后后续语句使用PracticeItems。","DROP COLUMN、DROP FOREIGN KEY、DROP CHECK各用对应语法与真实constraint name。"],"check":"表仍存在，PK仍在，目标列/FK/CHECK按要求移除。","pitfall":"原作业禁止改约束的小题不能借这组方法规避要求。","mainType":"ddl-dml","knowledge":["ddl","types","constraints"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"英文题面和给定图／FD","output":"按实际名称ALTER和撤约束","examTips":["表仍存在，PK仍在，目标列/FK/CHECK按要求移除。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["原作业禁止改约束的小题不能借这组方法规避要求。"],"tables":["PracticeChild","PracticeItems"],"knowledgeUses":{"ddl":"涉及对象／命名中间结果：PracticeChild, PracticeItems","types":"表仍存在，PK仍在，目标列/FK/CHECK按要求移除。","constraints":"表仍存在，PK仍在，目标列/FK/CHECK按要求移除。"},"sqlPlan":[{"label":"选表／对象","text":"PracticeChild, PracticeItems"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"表仍存在，PK仍在，目标列/FK/CHECK按要求移除。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">ALTER TABLE PracticeChild ADD COLUMN note VARCHAR(100) NULL;\nALTER TABLE PracticeChild MODIFY COLUMN note VARCHAR(200) NULL;\nALTER TABLE PracticeChild RENAME TO PracticeItems;\nALTER TABLE PracticeItems DROP COLUMN note;\nALTER TABLE PracticeItems DROP FOREIGN KEY pc_parent_fkey;\nALTER TABLE PracticeItems DROP CHECK pc_qty_check;\n\u003c/code>\u003c/pre>\n"}],"tags":["ALTER add/drop/modify/rename and constraints","Referential actions CASCADE","TRUNCATE, COMMIT, ROLLBACK and implicit commit"],"legacyPriority":"core","level":"C","archived":true,"originType":"Supplementary Practice","mainType":"ddl-dml","related":[],"examRelevance":"按需参考；不进入主要练习","archiveReason":"已有核心原题覆盖方法，或超出本轮确认的操作深度；保留溯源，不参与默认练习。","coverageStatus":"reference","questionZh":"辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["dml","keys","constraints","projection","filter","transaction","ddl","types"],"types":["ddl-dml"],"requiredSkills":["INSERT / UPDATE / DELETE / 增加、修改和删除行","Primary / candidate / foreign key / 主键、候选键与外键","CHECK / UNIQUE / NOT NULL / 值限制、唯一与必填","SELECT / projection / 选择输出列","WHERE / predicate / 逐行筛选条件","COMMIT / ROLLBACK / 提交与回滚","ALTER TABLE / 修改表结构","DECIMAL(p,s) / 精确数值的位数"],"questionHTML":"\u003cp>In a separate practice schema, perform the following operations in order. Assume InnoDB tables and enforced CHECK constraints.\u003c/p>\n\u003cp>(1) Create PracticeParent(id), with id as its primary key, and PracticeChild(id, parentId, qty). PracticeChild.id is its primary key. qty must be positive. parentId references PracticeParent(id), with ON UPDATE CASCADE and ON DELETE CASCADE. Use integer columns; all columns are mandatory.\u003c/p>\n\u003cp>(2) Insert parent 1 and child 101, belonging to parent 1, with qty = 2.\u003c/p>\n\u003cp>(3) Change parent 1 to parent 2. Show the child row after the update.\u003c/p>\n\u003cp>(4) Delete parent 2. Show the child rows after the deletion.\u003c/p>\n\u003cp>(5) Insert parent 3 and child 102 with qty = 2, then COMMIT. Start a transaction, change the child&#39;s qty to 3, TRUNCATE PracticeChild, and ROLLBACK. Show the remaining child rows. Explain the transaction effect.\u003c/p>\n\u003cp>(6) Add an optional note column of type VARCHAR(100) to PracticeChild, change it to VARCHAR(200), rename the table to PracticeItems, then drop the note column. Finally, drop its foreign key and its CHECK constraint using their actual constraint names. Do not disable foreign-key checks.\u003c/p>\n","translationHTML":"\u003cp>辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。\u003c/p>\n","answerHTML":"\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nCREATE TABLE PracticeParent (\n    id INT NOT NULL, CONSTRAINT pp_pkey PRIMARY KEY (id)\n) ENGINE=InnoDB;\nCREATE TABLE PracticeChild (\n    id INT NOT NULL, parentId INT NOT NULL, qty INT NOT NULL,\n    CONSTRAINT pc_pkey PRIMARY KEY (id),\n    CONSTRAINT pc_qty_check CHECK (qty &gt; 0),\n    CONSTRAINT pc_parent_fkey FOREIGN KEY (parentId) REFERENCES PracticeParent(id)\n        ON UPDATE CASCADE ON DELETE CASCADE\n) ENGINE=InnoDB;\n-- (2)\nINSERT INTO PracticeParent VALUES (1);\nINSERT INTO PracticeChild VALUES (101, 1, 2);\n-- (3)\nUPDATE PracticeParent SET id = 2 WHERE id = 1;\nSELECT id, parentId, qty FROM PracticeChild;\n-- (4)\nDELETE FROM PracticeParent WHERE id = 2;\nSELECT id, parentId, qty FROM PracticeChild;\n-- (5)\nINSERT INTO PracticeParent VALUES (3);\nINSERT INTO PracticeChild VALUES (102, 3, 2);\nCOMMIT;\nSTART TRANSACTION;\nUPDATE PracticeChild SET qty = 3 WHERE id = 102;\nTRUNCATE TABLE PracticeChild;\nROLLBACK;\nSELECT id, parentId, qty FROM PracticeChild;\n-- (6)\nALTER TABLE PracticeChild ADD COLUMN note VARCHAR(100) NULL;\nALTER TABLE PracticeChild MODIFY COLUMN note VARCHAR(200) NULL;\nALTER TABLE PracticeChild RENAME TO PracticeItems;\nALTER TABLE PracticeItems DROP COLUMN note;\nALTER TABLE PracticeItems DROP FOREIGN KEY pc_parent_fkey;\nALTER TABLE PracticeItems DROP CHECK pc_qty_check;\n\u003c/code>\u003c/pre>\n\u003cp>(3)子记录变为(101,2,2)，因为ON UPDATE CASCADE跟随被引用键变化。(4)子记录也被删除，因为ON DELETE CASCADE已写在这个练习的定义中；不能把该行为套给没有CASCADE的原作业表。\u003c/p>\n\u003cp>(5)TRUNCATE是DDL，有隐式提交，后面的ROLLBACK不能恢复被清空的子记录，也不能撤回它之前已经隐式提交的更新。TRUNCATE保留表定义，不能带WHERE；它与DELETE和DROP TABLE不同。不要对仍被其他表引用的父表直接照搬TRUNCATE。\u003c/p>\n\u003cp>(6)使用实际定义的constraint names。原Assignment3对DML不得修改约束的限制仍只在原题对应小题适用，不能拿本题的最后操作去规避原题限制。\u003c/p>\n"},{"id":"L05","title":"Compare the three generalization methods","topic":"Compare the three generalization methods","areas":["Logical"],"source":"lecture-logical","sourceLabel":"Logical Design","sourceNote":"Logical Design.pdf pp22–27. Class information follows the lecture; comparison instructions added.","origin":"Lecture method comparison","priority":"C","question":"Consider the lecture's generalization:\n\n```text\nSTUDENT: s# [ID], first-name, last-name, dob\nUNDERGRADUATE-STUDENT: project\nPOSTGRADUATE-STUDENT: thesis\n```\n\nAssume each student is exactly one of the two subtypes. Produce relational schemas with primary keys and foreign keys using:\n\n(1) The superset method.\n\n(2) The subset method.\n\n(3) The association method.\n\nExplain where the common attributes and subtype attributes are stored in each method. If an examination question explicitly requires the superset method, which answer mus YS = none\nFOREIGN KEYS = none\n\nPOSTGRADUATE_STUDENT(s#, first-name, last-name, dob, thesis)\nPRIMARY KEY = (s#)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"用association method处理层次","steps":["STUDENT保留所有共有属性。","每子类只保留s#与专有属性。","子类s#既是PK又是引用STUDENT的FK；父表先定义。"],"check":"三张表，公共属性只存父表一次。","pitfall":"子表FK存在不代表自动保证每人恰落一个子类。","mainType":"logical","knowledge":["keys","qualifier","association","superset"],"taskBrief":"把图中每一种特征转换成关系模式，并完整列出键和引用。","input":"英文题面和给定图／FD","output":"用association method处理层次","examTips":["三张表，公共属性只存父表一次。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["子表FK存在不代表自动保证每人恰落一个子类。"],"tables":[],"knowledgeUses":{"keys":"三张表，公共属性只存父表一次。","qualifier":"三张表，公共属性只存父表一次。","association":"三张表，公共属性只存父表一次。","superset":"三张表，公共属性只存父表一次。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先写不依赖其他schema的父关系及其完整标识。","分别处理多对多、多值、qualifier与关联属性；引用复合标识不能漏列。","按题目要求使用superset，最后检查父表先于子表及全部键。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-text\">STUDENT(s#, first-name, last-name, dob)\nPRIMARY KEY = (s#)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n\nUNDERGRADUATE_STUDENT(s#, project)\nPRIMARY KEY = (s#)\nFOREIGN KEY1 = (s#) REFERENCES STUDENT(s#)\n\nPOSTGRADUATE_STUDENT(s#, thesis)\nPRIMARY KEY = (s#)\nFOREIGN KEY1 = (s#) REFERENCES STUDENT(s#)\n\u003c/code>\u003c/pre>\n"}],"tags":["Superset method","Subset and association methods"],"legacyPriority":"method","level":"C","archived":true,"originType":"Supplementary Practice","mainType":"logical","related":[],"examRelevance":"按需参考；不进入主要练习","archiveReason":"已有核心原题覆盖方法，或超出本轮确认的操作深度；保留溯源，不参与默认练习。","coverageStatus":"reference","questionZh":"辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["keys","qualifier","association","superset"],"types":["logical"],"requiredSkills":["Primary / candidate / foreign key / 主键、候选键与外键","Qualified association / 用局部值限定的关联","Many-to-many / association attribute / 多对多与关联属性","Superset method / 超集法实现泛化"],"questionHTML":"\u003cp>Consider the lecture&#39;s generalization:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">STUDENT: s# [ID], first-name, last-name, dob\nUNDERGRADUATE-STUDENT: project\nPOSTGRADUATE-STUDENT: thesis\n\u003c/code>\u003c/pre>\n\u003cp>Assume each student is exactly one of the two subtypes. Produce relational schemas with primary keys and foreign keys using:\u003c/p>\n\u003cp>(1) The superset method.\u003c/p>\n\u003cp>(2) The subset method.\u003c/p>\n\u003cp>(3) The association method.\u003c/p>\n\u003cp>Explain where the common attributes and subtype attributes are stored in each method. If an examination question explicitly requires the superset method, which answer must you submit?\u003c/p>\n","translationHTML":"\u003cp>辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。\u003c/p>\n","answerHTML":"\u003ch3>(1) Superset method\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">STUDENT(s#, first-name, last-name, dob, student-type, project, thesis)\nPRIMARY KEY = (s#)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n\u003c/code>\u003c/pre>\n\u003cp>所有类型放一张表，student-type区分子类；不适用的专有属性为空。原题如果指定superset，必须用此方法。\u003c/p>\n\u003ch3>(2) Subset method\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">UNDERGRADUATE_STUDENT(s#, first-name, last-name, dob, project)\nPRIMARY KEY = (s#)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n\nPOSTGRADUATE_STUDENT(s#, first-name, last-name, dob, thesis)\nPRIMARY KEY = (s#)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n\u003c/code>\u003c/pre>\n\u003cp>只保留子类表，共有属性下移。若s#原本全局唯一，分别在两表定义primary key并不会单独防止跨表重复，仍需维护原类型互斥和全局标识规则。\u003c/p>\n\u003ch3>(3) Association method\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">STUDENT(s#, first-name, last-name, dob)\nPRIMARY KEY = (s#)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n\nUNDERGRADUATE_STUDENT(s#, project)\nPRIMARY KEY = (s#)\nFOREIGN KEY1 = (s#) REFERENCES STUDENT(s#)\n\nPOSTGRADUATE_STUDENT(s#, thesis)\nPRIMARY KEY = (s#)\nFOREIGN KEY1 = (s#) REFERENCES STUDENT(s#)\n\u003c/code>\u003c/pre>\n\u003cp>共有属性只在父类表，专有属性只在各自子类表。子类的s#同时是primary key和foreign key。普通foreign key本身不能保证每名学生恰好出现在一个子类表中，类型规则需另行维护。\u003c/p>\n"},{"id":"L06","title":"Role inheritance and account management","topic":"Role inheritance and account management","areas":["Access"],"source":"lecture-access","sourceLabel":"Discretionary Access Control","sourceNote":"Discretionary Access Control.pdf pp3,23–25. Role hierarchy follows the lecture; account and ADMIN OPTION tasks added explicitly. Public edition: example names, contact details and password literals anonymized.","origin":"Lecture-based supplementary practice","priority":"C","question":"Assume ROLE_USER and the tables ITEM, ORDERS and DISCOUNT already exist in database university. Use the localhost account for ROLE_USER.\n\n(1) Create role CUSTOMER. Grant it SELECT on ITEM, and INSERT, UPDATE and DELETE on ORDERS.\n\n(2) Create role FREQUENT_CUSTOMER. It must inherit CUSTOMER and additionally have INSERT, UPDATE and DELETE on DISCOUNT.\n\n(3) Grant FREQUENT_CUSTOMER to ROLE_USER WITH ADMIN OPTION. Make it ROLE_USER's default role, and show ROLE_USER's grants using this role. Explain whether ADMIN OPTION is the same as GRANT OPTION.\n\n(4) Change ROLE_USER's password to a value of your choice. Then remove this role assignment, drop ROLE_USER, and drop the two roles without dropping any tables.","context":"","canonical":null,"parts":[{"number":"1","goal":"建立CUSTOMER权限集合","steps":["CREATE ROLE。","SELECT授在ITEM，写权限三项授在ORDERS。","对象范围限定university中对应表。"],"check":"角色有两组精确权限。","pitfall":"只授UPDATE不等于包含INSERT、DELETE。","mainType":"access","knowledge":["dml","grant","grantoption","keys"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"英文题面和给定图／FD","output":"建立CUSTOMER权限集合","examTips":["角色有两组精确权限。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["只授UPDATE不等于包含INSERT、DELETE。"],"tables":[],"knowledgeUses":{"dml":"角色有两组精确权限。","grant":"角色有两组精确权限。","grantoption":"角色有两组精确权限。","keys":"角色有两组精确权限。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">CREATE ROLE &#39;CUSTOMER&#39;;\nGRANT SELECT ON university.ITEM TO &#39;CUSTOMER&#39;;\nGRANT INSERT, UPDATE, DELETE ON university.ORDERS TO &#39;CUSTOMER&#39;;\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"建立并配置继承角色","steps":["CREATE FREQUENT_CUSTOMER。","给它DISCOUNT的三项写权限。","GRANT CUSTOMER TO FREQUENT_CUSTOMER使高级角色继承普通角色。"],"check":"权限方向正确。","pitfall":"反过来授会让普通客户继承更高级能力。","mainType":"access","knowledge":["dml","grant","grantoption","keys"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"英文题面和给定图／FD","output":"建立并配置继承角色","examTips":["权限方向正确。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["反过来授会让普通客户继承更高级能力。"],"tables":[],"knowledgeUses":{"dml":"权限方向正确。","grant":"权限方向正确。","grantoption":"权限方向正确。","keys":"权限方向正确。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">CREATE ROLE &#39;FREQUENT_CUSTOMER&#39;;\nGRANT INSERT, UPDATE, DELETE ON university.DISCOUNT TO &#39;FREQUENT_CUSTOMER&#39;;\nGRANT &#39;CUSTOMER&#39; TO &#39;FREQUENT_CUSTOMER&#39;;\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"授role、启用并检查权限","steps":["授FREQUENT_CUSTOMER给PARTICIPANT_10，WITH ADMIN OPTION允许转授该role。","SET DEFAULT ROLE设为以后登录默认启用。","SHOW GRANTS FOR ... USING role查看含角色的授权，说明ADMIN OPTION不是对象GRANT OPTION。"],"check":"角色可传播与对象可传播分别理解。","pitfall":"仅查看mysql.user的全局Y/N列会漏库级/表级/角色权限。","mainType":"access","knowledge":["grant","grantoption"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"英文题面和给定图／FD","output":"授role、启用并检查权限","examTips":["角色可传播与对象可传播分别理解。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["仅查看mysql.user的全局Y/N列会漏库级/表级/角色权限。"],"tables":[],"knowledgeUses":{"grant":"角色可传播与对象可传播分别理解。","grantoption":"角色可传播与对象可传播分别理解。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">GRANT &#39;FREQUENT_CUSTOMER&#39; TO &#39;ROLE_USER&#39;@&#39;localhost&#39; WITH ADMIN OPTION;\nSET DEFAULT ROLE &#39;FREQUENT_CUSTOMER&#39; TO &#39;ROLE_USER&#39;@&#39;localhost&#39;;\nSHOW GRANTS FOR &#39;ROLE_USER&#39;@&#39;localhost&#39; USING &#39;FREQUENT_CUSTOMER&#39;;\n\u003c/code>\u003c/pre>\n"},{"number":"4","goal":"修改密码并清理账号/角色","steps":["ALTER USER修改指定账号。","REVOKE成员关系，再DROP USER。","DROP两个ROLE但不DROP业务表。"],"check":"用户与role清理，ITEM/ORDERS/DISCOUNT保留。","pitfall":"DROP ROLE不等于清空业务数据。","mainType":"access","knowledge":["grant","grantoption","definer"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"英文题面和给定图／FD","output":"修改密码并清理账号/角色","examTips":["用户与role清理，ITEM/ORDERS/DISCOUNT保留。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["DROP ROLE不等于清空业务数据。"],"tables":[],"knowledgeUses":{"grant":"用户与role清理，ITEM/ORDERS/DISCOUNT保留。","grantoption":"用户与role清理，ITEM/ORDERS/DISCOUNT保留。","definer":"用户与role清理，ITEM/ORDERS/DISCOUNT保留。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">ALTER USER &#39;ROLE_USER&#39;@&#39;localhost&#39; IDENTIFIED BY &#39;[CHOOSE_PASSWORD]&#39;;\nREVOKE &#39;FREQUENT_CUSTOMER&#39; FROM &#39;ROLE_USER&#39;@&#39;localhost&#39;;\nDROP USER &#39;ROLE_USER&#39;@&#39;localhost&#39;;\nDROP ROLE &#39;FREQUENT_CUSTOMER&#39;, &#39;CUSTOMER&#39;;\n\u003c/code>\u003c/pre>\n"}],"tags":["CREATE/ALTER/DROP USER and database management","Roles, activation, inheritance and ADMIN OPTION","REVOKE and multiple effective privilege sources"],"legacyPriority":"core","level":"C","archived":true,"originType":"Supplementary Practice","mainType":"access","related":[],"examRelevance":"按需参考；不进入主要练习","archiveReason":"已有核心原题覆盖方法，或超出本轮确认的操作深度；保留溯源，不参与默认练习。","coverageStatus":"reference","questionZh":"辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["dml","grant","grantoption","keys","definer"],"types":["access"],"requiredSkills":["INSERT / UPDATE / DELETE / 增加、修改和删除行","GRANT / privilege scope / 授予权限与对象范围","WITH GRANT OPTION / 权限转授","Primary / candidate / foreign key / 主键、候选键与外键","SQL SECURITY DEFINER / 由视图定义者权限读取底表"],"questionHTML":"\u003cp>Assume ROLE_USER and the tables ITEM, ORDERS and DISCOUNT already exist in database university. Use the localhost account for ROLE_USER.\u003c/p>\n\u003cp>(1) Create role CUSTOMER. Grant it SELECT on ITEM, and INSERT, UPDATE and DELETE on ORDERS.\u003c/p>\n\u003cp>(2) Create role FREQUENT_CUSTOMER. It must inherit CUSTOMER and additionally have INSERT, UPDATE and DELETE on DISCOUNT.\u003c/p>\n\u003cp>(3) Grant FREQUENT_CUSTOMER to ROLE_USER WITH ADMIN OPTION. Make it ROLE_USER&#39;s default role, and show ROLE_USER&#39;s grants using this role. Explain whether ADMIN OPTION is the same as GRANT OPTION.\u003c/p>\n\u003cp>(4) Change ROLE_USER&#39;s password to a value of your choice. Then remove this role assignment, drop ROLE_USER, and drop the two roles without dropping any tables.\u003c/p>\n","translationHTML":"\u003cp>辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。\u003c/p>\n","answerHTML":"\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nCREATE ROLE &#39;CUSTOMER&#39;;\nGRANT SELECT ON university.ITEM TO &#39;CUSTOMER&#39;;\nGRANT INSERT, UPDATE, DELETE ON university.ORDERS TO &#39;CUSTOMER&#39;;\n-- (2)\nCREATE ROLE &#39;FREQUENT_CUSTOMER&#39;;\nGRANT INSERT, UPDATE, DELETE ON university.DISCOUNT TO &#39;FREQUENT_CUSTOMER&#39;;\nGRANT &#39;CUSTOMER&#39; TO &#39;FREQUENT_CUSTOMER&#39;;\n-- (3)\nGRANT &#39;FREQUENT_CUSTOMER&#39; TO &#39;ROLE_USER&#39;@&#39;localhost&#39; WITH ADMIN OPTION;\nSET DEFAULT ROLE &#39;FREQUENT_CUSTOMER&#39; TO &#39;ROLE_USER&#39;@&#39;localhost&#39;;\nSHOW GRANTS FOR &#39;ROLE_USER&#39;@&#39;localhost&#39; USING &#39;FREQUENT_CUSTOMER&#39;;\n-- (4)\nALTER USER &#39;ROLE_USER&#39;@&#39;localhost&#39; IDENTIFIED BY &#39;[CHOOSE_PASSWORD]&#39;;\nREVOKE &#39;FREQUENT_CUSTOMER&#39; FROM &#39;ROLE_USER&#39;@&#39;localhost&#39;;\nDROP USER &#39;ROLE_USER&#39;@&#39;localhost&#39;;\nDROP ROLE &#39;FREQUENT_CUSTOMER&#39;, &#39;CUSTOMER&#39;;\n\u003c/code>\u003c/pre>\n\u003cp>GRANT CUSTOMER TO FREQUENT_CUSTOMER的方向是“高级角色继承普通角色”。反过来写会让普通角色取得不该有的权限。WITH ADMIN OPTION允许再授予role；WITH GRANT OPTION用于再授予对象权限，二者不是同一个授权动作。DROP USER/ROLE不删除业务表。SHOW GRANTS比只看mysql.user的全局Y/N列更适合检查实际授权层次。\u003c/p>\n"},{"id":"L07","title":"Additional normalization examples from the lecture","topic":"Additional normalization examples from the lecture","areas":["Normalization"],"source":"lecture-normalization","sourceLabel":"Functional dependencies and normalization","sourceNote":"09DatabaseNormalization_3.pdf Examples 3,8,10 (pp10,15,17). The R/F data are reproduced; full examination-style instructions are added.","origin":"Lecture examples with added examination instructions","priority":"C","question":"Assume each schema is in 1NF. For each lecture example, derive all minimal keys and determine the highest normal form, explicitly testing 2NF, 3NF and BCNF with justification.\n\n(1) $R=(A,B,C)$, $F={AB\\to C,C\\to B,C\\to A\\}$.\n\n(2) $R=(A,B,C,D)$, $F={A\\to B,B\\to D,C\\to B\\}$.\n\n(3) $R=(A,B,C,D)$, $F={AB\\to C,C\\to D,D\\to A,D\\to B\\}$.\n\nFor (2), optionally give a lossless BCNF decomposition. Do not assume that an arbitrary collection of two-attribute relations is lossless.","context":"","canonical":null,"parts":[{"number":"1","goal":"keys为{A,B}与{C}，最高BCNF","steps":["AB→C说明AB可决定全部；C→A和C→B说明C也可决定全部。","A、B单独都不够，其他包含AB或C的集合不minimal；所有attributes都是prime。","每条给定非平凡FD的左侧都是superkey，2NF、3NF、BCNF都满足。"],"check":"组合key与单属性key可以同时存在。","pitfall":"不能因存在单属性key就不再寻找组合key。","mainType":"normalization","knowledge":["fd","closure","candidate","prime","partial","third","bcnf"],"taskBrief":"根据给定FD推导全部最小键，并逐项证明最高范式。","input":"英文题面和给定图／FD","output":"keys为{A,B}与{C}，最高BCNF","examTips":["组合key与单属性key可以同时存在。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不能因存在单属性key就不再寻找组合key。"],"tables":[],"knowledgeUses":{"fd":"组合key与单属性key可以同时存在。","closure":"组合key与单属性key可以同时存在。","candidate":"组合key与单属性key可以同时存在。","prime":"组合key与单属性key可以同时存在。","partial":"组合key与单属性key可以同时存在。","third":"组合key与单属性key可以同时存在。","bcnf":"组合key与单属性key可以同时存在。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003ch3>(1) BCNF\u003c/h3>\n\u003cp>\u003cspan class=\"math\">(AB)\u003csup>+\u003c/sup>={A,B,C}\u003c/span>，\u003cspan class=\"math\">C\u003csup>+\u003c/sup>={A,B,C}\u003c/span>。候选键是\u003cspan class=\"math\">{A,B}\u003c/span>、\u003cspan class=\"math\">{C}\u003c/span>；A、B单独都不能得到全部属性，所以二者组合最小。所有属性都是prime attributes，不存在对non-prime attribute的partial dependency，满足2NF。每条非平凡functional dependency的左侧都是superkey，所以满足3NF和BCNF。\u003c/p>\n\u003ch3>(2) 1NF\u003c/h3>\n\u003cp>A、C不出现在右侧，每个key必须同时包含A和C。\u003cspan class=\"math\">(AC)\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>，\u003cspan class=\"math\">A\u003csup>+\u003c/sup>={A,B,D}\u003c/span>、\u003cspan class=\"math\">C\u003csup>+\u003c/sup>={B,C,D}\u003c/span>，所以唯一candidate key是\u003cspan class=\"math\">{A,C}\u003c/span>。B、D是non-prime attributes。\u003cspan class=\"math\">A→ B\u003c/span>和\u003cspan class=\"math\">C→ B\u003c/span>构成partial dependency，因此不满足2NF；它们和\u003cspan class=\"math\">B→ D\u003c/span>也违反3NF、BCNF。最高1NF。\u003c/p>\n\u003cp>一种lossless BCNF decomposition为\u003cspan class=\"math\">R\u003csub>1\u003c/sub>=(A,B)\u003c/span>、\u003cspan class=\"math\">R\u003csub>2\u003c/sub>=(A,C)\u003c/span>、\u003cspan class=\"math\">R\u003csub>3\u003c/sub>=(B,D)\u003c/span>：先按\u003cspan class=\"math\">B→ D\u003c/span>分出BD，再在ABC中按\u003cspan class=\"math\">A→ B\u003c/span>分出AB和AC，每一步都满足交集决定一侧的lossless条件。此三表分解不单独保持\u003cspan class=\"math\">C→ B\u003c/span>，需跨表检查；若还要求dependency preservation，可额外保留投影\u003cspan class=\"math\">R\u003csub>4\u003c/sub>=(C,B)\u003c/span>。\u003c/p>\n\u003cp>课件p15给出AB、BC、BD，但缺少保存A与C配对的关系。仅凭表都是二元关系不能保证lossless，不能直接照抄该分解。\u003c/p>\n\u003ch3>(3) BCNF\u003c/h3>\n\u003cp>\u003cspan class=\"math\">C\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>、\u003cspan class=\"math\">D\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>、\u003cspan class=\"math\">(AB)\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>。全部candidate keys是\u003cspan class=\"math\">{C}\u003c/span>、\u003cspan class=\"math\">{D}\u003c/span>、\u003cspan class=\"math\">{A,B}\u003c/span>。所有属性都是prime attributes，因此满足2NF。给定的每个非平凡functional dependency左侧都是superkey；派生出新属性的决定因素也必定包含C、D或AB，所以满足3NF和BCNF。\u003c/p>\n"},{"number":"2","goal":"唯一key是{A,C}，最高1NF","steps":["A、C不在右侧，每个key必须同时包含A和C。","A⁺=ABD、C⁺=CBD，单独都少另一必需属性；AC⁺=ABCD。","A→B和C→B是non-prime属性对key真子集的partial dependency，故2NF失败；指出3NF/BCNF也被这些FD违反。","若分解，保留A与C的配对关系；AB、BC、BD缺它，可能产生spurious tuples。"],"check":"可用AC、AB、BD给lossless BCNF分解，但C→B不单独被局部依赖保持。","pitfall":"“所有分表都有两列”不等于整个分解lossless。","mainType":"normalization","knowledge":["fd","closure","candidate","prime","partial","third","bcnf"],"taskBrief":"根据给定FD推导全部最小键，并逐项证明最高范式。","input":"英文题面和给定图／FD","output":"唯一key是{A,C}，最高1NF","examTips":["可用AC、AB、BD给lossless BCNF分解，但C→B不单独被局部依赖保持。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["“所有分表都有两列”不等于整个分解lossless。"],"tables":[],"knowledgeUses":{"fd":"可用AC、AB、BD给lossless BCNF分解，但C→B不单独被局部依赖保持。","closure":"可用AC、AB、BD给lossless BCNF分解，但C→B不单独被局部依赖保持。","candidate":"可用AC、AB、BD给lossless BCNF分解，但C→B不单独被局部依赖保持。","prime":"可用AC、AB、BD给lossless BCNF分解，但C→B不单独被局部依赖保持。","partial":"可用AC、AB、BD给lossless BCNF分解，但C→B不单独被局部依赖保持。","third":"可用AC、AB、BD给lossless BCNF分解，但C→B不单独被局部依赖保持。","bcnf":"可用AC、AB、BD给lossless BCNF分解，但C→B不单独被局部依赖保持。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零 pan class=\"math\">{D}\u003c/span>、\u003cspan class=\"math\">{A,B}\u003c/span>。所有属性都是prime attributes，因此满足2NF。给定的每个非平凡functional dependency左侧都是superkey；派生出新属性的决定因素也必定包含C、D或AB，所以满足3NF和BCNF。\u003c/p>\n"},{"number":"3","goal":"keys为{A,B}、{C}、{D}，最高BCNF","steps":["C→D→AB得到全部；D→AB→C得到全部；AB→C→D也得到全部。","A/B单独不够，因此AB最小；含C或D的更大集合都不再minimal。","每条非平凡FD左侧为superkey；所有attributes亦为prime，满足2NF、3NF、BCNF。"],"check":"共三个keys，不能漏掉AB。","pitfall":"把“存在单属性key”误当作只可能有单属性keys。","mainType":"normalization","knowledge":["fd","closure","candidate","prime","partial","third","bcnf"],"taskBrief":"根据给定FD推导全部最小键，并逐项证明最高范式。","input":"英文题面和给定图／FD","output":"keys为{A,B}、{C}、{D}，最高BCNF","examTips":["共三个keys，不能漏掉AB。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["把“存在单属性key”误当作只可能有单属性keys。"],"tables":[],"knowledgeUses":{"fd":"共三个keys，不能漏掉AB。","closure":"共三个keys，不能漏掉AB。","candidate":"共三个keys，不能漏掉AB。","prime":"共三个keys，不能漏掉AB。","partial":"共三个keys，不能漏掉AB。","third":"共三个keys，不能漏掉AB。","bcnf":"共三个keys，不能漏掉AB。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003ch3>(1) BCNF\u003c/h3>\n\u003cp>\u003cspan class=\"math\">(AB)\u003csup>+\u003c/sup>={A,B,C}\u003c/span>，\u003cspan class=\"math\">C\u003csup>+\u003c/sup>={A,B,C}\u003c/span>。候选键是\u003cspan class=\"math\">{A,B}\u003c/span>、\u003cspan class=\"math\">{C}\u003c/span>；A、B单独都不能得到全部属性，所以二者组合最小。所有属性都是prime attributes，不存在对non-prime attribute的partial dependency，满足2NF。每条非平凡functional dependency的左侧都是superkey，所以满足3NF和BCNF。\u003c/p>\n\u003ch3>(2) 1NF\u003c/h3>\n\u003cp>A、C不出现在右侧，每个key必须同时包含A和C。\u003cspan class=\"math\">(AC)\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>，\u003cspan class=\"math\">A\u003csup>+\u003c/sup>={A,B,D}\u003c/span>、\u003cspan class=\"math\">C\u003csup>+\u003c/sup>={B,C,D}\u003c/span>，所以唯一candidate key是\u003cspan class=\"math\">{A,C}\u003c/span>。B、D是non-prime attributes。\u003cspan class=\"math\">A→ B\u003c/span>和\u003cs 匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT D.name, C.title\nFROM DEPARTMENT AS D\nLEFT JOIN COURSE AS C ON D.name = C.offered_by\nUNION ALL\nSELECT D.name, C.title\nFROM DEPARTMENT AS D\nRIGHT JOIN COURSE AS C ON D.name = C.offered_by\nWHERE D.name IS NULL;\n\u003c/code>\u003c/pre>\n"}],"tags":["JOIN and LEFT/RIGHT/FULL OUTER JOIN"],"legacyPriority":"core","level":"C","archived":true,"originType":"Supplementary Practice","mainType":"fundamentals","related":[],"examRelevance":"按需参考；不进入主要练习","archiveReason":"已有核心原题覆盖方法，或超出本轮确认的操作深度；保留溯源，不参与默认练习。","coverageStatus":"reference","questionZh":"辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["projection","join","left","count","filter","null","union"],"types":["fundamentals"],"requiredSkills":["SELECT / projection / 选择输出列","JOIN / join condition / 连接及连接条件","LEFT JOIN / 保留左侧未匹配行的连接","COUNT / grain / 计数与计数单位","WHERE / predicate / 逐行筛选条件","NULL / IS NULL / 未知值及空值判断","UNION / UNION ALL / 合并结果集"],"questionHTML":"\u003cp>Use the lecture DEPARTMENT and COURSE tables.\u003c/p>\n\u003cp>(1) Find the names of departments together with the titles of all courses offered by each department and include the names of departments that offer no courses at all.\u003c/p>\n\u003cp>(2) Find the names of departments together with the titles of all courses offered by each department and include the titles of all courses not assigned to any department.\u003c/p>\n\u003cp>(3) Find the names of departments together with the titles of all courses offered by each department, include the names of departments that offer no courses, and include the titles of courses not offered by any department.\u003c/p>\n","translationHTML":"\u003cp>辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。\u003c/p>\n","answerHTML":"\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nSELECT D.name, C.title\nFROM DEPARTMENT AS D\nLEFT OUTER JOIN COURSE AS C ON D.name = C.offered_by;\n-- (2)\nSELECT D.name, C.title\nFROM DEPARTMENT AS D\nRIGHT OUTER JOIN COURSE AS C ON D.name = C.offered_by;\n-- (3) MySQL: preserve both sides without unsupported FULL OUTER JOIN syntax.\nSELECT D.name, C.title\nFROM DEPARTMENT AS D\nLEFT JOIN COURSE AS C ON D.name = C.offered_by\nUNION ALL\nSELECT D.name, C.title\nFROM DEPARTMENT AS D\nRIGHT JOIN COURSE AS C ON D.name = C.offered_by\nWHERE D.name IS NULL;\n\u003c/code>\u003c/pre>\n\u003cp>(1)保留DEPARTMENT一侧，即使Biology没有课程，也有(Biology,NULL)一行。(2)保留COURSE一侧，即使Unassigned没有所属部门，也有(NULL,Unassigned)一行。LEFT/RIGHT由FROM中的左右顺序决定；把两个表调换顺序后用LEFT JOIN，也能表达同样的保留方向。\u003c/p>\n\u003cp>若把右表必须存在的条件放进WHERE，可能重新过滤掉外连接补出的NULL行。应先确定要保留哪一边，再决定筛选条件放在ON还是WHERE。\u003c/p>\n\u003cp>(3)要同时保留两侧。MySQL没有原生FULL OUTER JOIN语法：先取完整LEFT JOIN，再只追加右边未匹配的课程。D.name是非空primary key，所以第二部分的IS NULL可靠地识别未匹配行。UNION ALL保留本来可能相同的结果行；第二部分排除已匹配行，因此不会把每个匹配关系重复添加一次。此fixture共6行，包括(Biology,NULL)与(NULL,Unassigned)。\u003c/p>\n"},{"id":"L09","title":"Self-join roles and a self-association","topic":"Self-join roles and a self-association","areas":["SELECT","Conceptual"],"source":"lecture-select","sourceLabel":"SELECT lectures","sourceNote":"SELECT Statement (3).pdf pp24,27,29–31. The two queries and sample rows come from the lecture; the modelling instruction is supplementary. Public edition: example names, contact details and password literals anonymized.","origin":"Lecture queries + supplementary modelling instruction","priority":"C","question":"Use the EMPLOYEE(enum, name, manager) example. manager is the employee number of the direct manager and may be NULL.\n\n(1) Find a name of manager of employee number 40.\n\n(2) Find the names of all employees directly managed by STAFF_50.\n\n(3) Draw a simplified UML self-association for this relationship. Show the role names and multiplicities. Assume that an employee may have at most one direct manager, and a manager may directly manage zero or more employees. Do not introduce a separate manager identifier.","context":"employee","canonical":null,"parts":[{"number":"1","goal":"查员工40的经理名字","steps":["E代表员工本人，M代表经理。","E.manager连接M.enum，不把两个人enum直接相等。","筛E.enum=40，从M取name。"],"check":"STAFF_20。","pitfall":"E.name是STAFF_40，不是经理名。","mainType":"fundamentals","knowledge":["projection","filter","join"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Lecture self-join: EMPLOYEE schema与题面条件","output":"查员工40的经理名字","examTips":["STAFF_20。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["E.name是STAFF_40，不是经理名。"],"tables":["EMPLOYEE"],"knowledgeUses":{"projection":"本小题输出：查员工40的经理名字","filter":"STAFF_20。","join":"涉及对象／命名中间结果：EMPLOYEE"},"sqlPlan":[{"label":"选表／对象","text":"EMPLOYEE"},{"label":"连接与层次","text":"使用JOIN并检查完整ON条件；先确定每行的计数单位。"},{"label":"筛选、分组与输出","text":"STAFF_20。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT M.name\nFROM EMPLOYEE AS E\nJOIN EMPLOYEE AS M ON E.manager = M.enum\nWHERE E.enum = 40;\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"查STAFF_50的直接下属","steps":["同样用员工E和经理M两个角色。","筛M.name=STAFF_50。","从E取name，得到直接下属，不递归组织树。"],"check":"STAFF_60与STAFF_70。","pitfall":"筛E.name=STAFF_50会得到STAFF_50本人或查错方向。","mainType":"fundamentals","knowledge":["projection","filter","join"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Lecture self-join: EMPLOYEE schema与题面条件","output":"查STAFF_50的直接下属","examTips":["STAFF_60与STAFF_70。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["筛E.name=STAFF_50会得到STAFF_50本人或查错方向。"],"tables":["EMPLOYEE"],"knowledgeUses":{"projection":"本小题输出：查STAFF_50的直接下属","filter":"STAFF_60与STAFF_70。","join":"涉及对象／命名中间结果：EMPLOYEE"},"sqlPlan":[{"label":"选表／对象","text":"EMPLOYEE"},{"label":"连接与层次","text":"使用JOIN并检查完整ON条件；先确定每行的计数单位。"},{"label":"筛选、分组与输出","text":"STAFF_60与STAFF_70。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT E.name\nFROM EMPLOYEE AS E\nJOIN EMPLOYEE AS M ON E.manager = M.enum\nWHERE M.name = &#39;STAFF_50&#39;;\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"画self-association及角色范围","steps":["只用一个EMPLOYEE类，enum标ID、name为attribute。","两个端点分别命名manager与subordinate，明确各自角色。","经理端0..1，下属端0..*；不另外发明manager identifier。"],"check":"同一类对象可在不同link里担当两种角色。","pitfall":"数量端点描述的是对方一个对象可关联这一端多少个。","mainType":"fundamentals","knowledge":["projection","filter"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Lecture self-join: EMPLOYEE schema与题面条件","output":"画self-association及角色范围","examTips":["同一类对象可在不同link里担当两种角色。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["数量端点描述的是对方一个对象可关联这一端多少个。"],"tables":[],"knowledgeUses":{"projection":"本小题输出：画self-association及角色范围","filter":"同一类对象可在不同link里担当两种角色。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nSELECT M.name\nFROM EMPLOYEE AS E\nJOIN EMPLOYEE AS M ON E.manager = M.enum\nWHERE E.enum = 40;\n-- (2)\nSELECT E.name\nFROM EMPLOYEE AS E\nJOIN EMPLOYEE AS M ON E.manager = M.enum\nWHERE M.name = &#39;STAFF_50&#39;;\n\u003c/code>\u003c/pre>\n\u003cfigure class=\"diagram\">\u003cdiv class=\"diagram-scroll\">\n\n\u003c!-- Generated by graphviz version 14.1.3 (20260303.0454)\n -->\n\u003c!-- Title: G Pages: 1 -->\n\u003cp>\u003csvg width=\"164pt\" height=\"185pt\"\n viewBox=\"0.00 0.00 164.00 185.00\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n\u003cg id=\"g11-graph0\" class=\"graph\" transform=\"scale(1 1) rotate(0) translate(28.8 156)\">\u003c/p>\n\u003ctitle>G\u003c/title>\n\u003c!-- EMPLOYEE -->\n\u003cg id=\"g11-node1\" class=\"node\">\n\u003ctitle>EMPLOYEE\u003c/title>\n\u003cpolygon fill=\"#e6f1ed\" stroke=\"none\" points=\"0,-46.8 0,-79.2 84.68,-79.2 84.68,-46.8 0,-46.8\"/>\n\u003cpolygon fill=\"none\" stroke=\"black\" points=\"0,-46.8 0,-79.2 84.68,-79.2 84.68,-46.8 0,-46.8\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"9\" y=\"-60.4\" font-family=\"Arial\" font-weight=\"bold\" font-size=\"12.00\">EMPLOYEE\u003c/text>\n\u003cpolygon fill=\"none\" stroke=\"black\" points=\"0,0 0,-46.8 84.68,-46.8 84.68,0 0,0\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"9\" y=\"-25.8\" font-family=\"Arial\" font-size=\"12.00\">enum &#160;ID\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"9\" y=\"-11.4\" font-family=\"Arial\" font-size=\"12.00\">name\u003c/text>\n\u003c/g>\n\u003c!-- EMPLOYEE&#45;&gt;EMPLOYEE -->\n\u003cg id=\"g11-edge1\" class=\"edge\">\n\u003ctitle>EMPLOYEE&#45;&gt;EMPLOYEE\u003c/title>\n\u003cpath fill=\"none\" stroke=\"#52695d\" d=\"M26.89,-78.89C24.87,-98.13 30.02,-115.2 42.34,-115.2 54.66,-115.2 59.81,-98.13 57.79,-78.89\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"42.34\" y=\"-118.2\" font-family=\"Arial\" font-size=\"10.00\">manages\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"71.34\" y=\"-100.39\" font-family=\"Arial\" font-size=\"10.00\">0..* subordinate\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"36.95\" y=\"-102.01\" font-family=\"Arial\" font-size=\"10.00\">0..1 manager\u003c/text>\n\u003c/g>\n\u003c/g>\n\u003c/svg>\n\u003c/div>\u003cfigcaption>同一个ID标签表示组合identifier；不同ID标签表示独立identifier。空心箭头指向父类。 [0..1]可选，[*]多值，/表示derived attribute。\u003c/figcaption>\u003cbutton class=\"zoom\" type=\"button\">放大图\u003c/button>\u003c/figure>"}],"tags":["Multiplicities and role directions","Self-association and role names","Self-join and alias roles"],"legacyPriority":"core","level":"C","archived":false,"originType":"Supplementary Practice","mainType":"fundamentals","related":[],"examRelevance":"按需参考；不进入主要练习","coverageStatus":"reference","questionZh":"辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["projection","filter","join"],"types":["fundamentals"],"requiredSkills":["SELECT / projection / 选择输出列","WHERE / predicate / 逐行筛选条件","JOIN / join condition / 连接及连接条件"],"questionHTML":"\u003cp>Use the EMPLOYEE(enum, name, manager) example. manager is the employee number of the direct manager and may be NULL.\u003c/p>\n\u003cp>(1) Find a name of manager of employee number 40.\u003c/p>\n\u003cp>(2) Find the names of all employees directly managed by STAFF_50.\u003c/p>\n\u003cp>(3) Draw a simplified UML self-association for this relationship. Show the role names and multiplicities. Assume that an employee may have at most one direct manager, and a manager may directly manage zero or more employees. Do not introduce a separate manager identifier.\u003c/p>\n","translationHTML":"\u003cp>辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。\u003c/p>\n","answerHTML":"\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nSELECT M.name\nFROM EMPLOYEE AS E\nJOIN EMPLOYEE AS M ON E.manager = M.enum\nWHERE E.enum = 40;\n-- (2)\nSELECT E.name\nFROM EMPLOYEE AS E\nJOIN EMPLOYEE AS M ON E.manager = M.enum\nWHERE M.name = &#39;STAFF_50&#39;;\n\u003c/code>\u003c/pre>\n\u003cp>E和M是同一张表的不同角色，分别表示下属和经理。不能把E.enum=M.enum作为连接条件，否则会连接成同一位员工。原数据中(1)为STAFF_20，(2)为STAFF_60、STAFF_70；这里只查直接下属，不递归查整个组织树。\u003c/p>\n\u003cfigure class=\"diagram\">\u003cdiv class=\"diagram-scroll\">\n\n\u003c!-- Generated by graphviz version 14.1.3 (20260303.0454)\n -->\n\u003c!-- Title: G Pages: 1 -->\n\u003cp>\u003csvg width=\"164pt\" height=\"185pt\"\n viewBox=\"0.00 0.00 164.00 185.00\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n\u003cg id=\"g10-graph0\" class=\"graph\" transform=\"scale(1 1) rotate(0) translate(28.8 156)\">\u003c/p>\n\u003ctitle>G\u003c/title>\n\u003c!-- EMPLOYEE -->\n\u003cg id=\"g10-node1\" class=\"node\">\n\u003ctitle>EMPLOYEE\u003c/title>\n\u003cpolygon fill=\"#e6f1ed\" stroke=\"none\" points=\"0,-46.8 0,-79.2 84.68,-79.2 84.68,-46.8 0,-46.8\"/>\n\u003cpolygon fill=\"none\" stroke=\"black\" points=\"0,-46.8 0,-79.2 84.68,-79.2 84.68,-46.8 0,-46.8\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"9\" y=\"-60.4\" font-family=\"Arial\" font-weight=\"bold\" font-size=\"12.00\">EMPLOYEE\u003c/text>\n\u003cpolygon fill=\"none\" stroke=\"black\" points=\"0,0 0,-46.8 84.68,-46.8 84.68,0 0,0\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"9\" y=\"-25.8\" font-family=\"Arial\" font-size=\"12.00\">enum &#160;ID\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"9\" y=\"-11.4\" font-family=\"Arial\" font-size=\"12.00\">name\u003c/text>\n\u003c/g>\n\u003c!-- EMPLOYEE&#45;&gt;EMPLOYEE -->\n\u003cg id=\"g10-edge1\" class=\"edge\">\n\u003ctitle>EMPLOYEE&#45;&gt;EMPLOYEE\u003c/title>\n\u003cpath fill=\"none\" stroke=\"#52695d\" d=\"M26.89,-78.89C24.87,-98.13 30.02,-115.2 42.34,-115.2 54.66,-115.2 59.81,-98.13 57.79,-78.89\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"42.34\" y=\"-118.2\" font-family=\"Arial\" font-size=\"10.00\">manages\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"71.34\" y=\"-100.39\" font-family=\"Arial\" font-size=\"10.00\">0..* subordinate\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"36.95\" y=\"-102.01\" font-family=\"Arial\" font-size=\"10.00\">0..1 manager\u003c/text>\n\u003c/g>\n\u003c/g>\n\u003c/svg>\n\u003c/div>\u003cfigcaption>同一个ID标签表示组合identifier；不同ID标签表示独立identifier。空心箭头指向父类。 [0..1]可选，[*]多值，/表示derived attribute。\u003c/figcaption>\u003cbutton class=\"zoom\" type=\"button\">放大图\u003c/button>\u003c/figure>\n\n\u003cp>EMPLOYEE的attributes是enum [ID]和name；manager这个关系在概念图中用self-association表达，不另建一套经理编号。经理端0..1表示一名下属最多一个直接经理，下属端0..*表示一名经理可以管理多人。\u003c/p>\n"},{"id":"V01","title":"Nested and correlated query transfer","topic":"Nested and correlated query transfer","areas":["SELECT"],"source":"supplement","sourceLabel":"AI-generated Variant","sourceNote":"Independently written from the specified assignment methods; not a teacher examination question.","origin":"AI-generated Variant","priority":"B","question":"Use the workshop database. Write the following queries. These are variants of Assignment 4 Task 1, not official examination questions.\n\n(1) Find participantNo and fullName for participants who completed at least one TECHNOLOGY workshop with a current fee of at least 220.00. Ignore cancelled enrolments. Use a correlated EXISTS query.\n(2) Find workshopNo, title and fee for workshops whose fee is less than the average fee of BUSINESS workshops. Use a nested query. The outer result may contain any category.\n(3) For the qualification named EXCEL, find participantNo, fullName and qlevel for every participant at the highest recorded level. Include ties. Use a correlated MAX subquery and order by participantNo.","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"筛选完成过指定类别高费用Workshop的人","steps":["从Participant出发，用EXISTS判断是否有符合报名。","用E.participantNo=P.participantNo关联外层，再把报名连接到Workshop。","同时限定COMPLETED、TECHNOLOGY及fee>=220；EXISTS避免同一人被多次输出。"],"check":"只有至少一条同时满足全部条件的报名才符合。","pitfall":"不能把状态与类别条件分别放在不相关的存在性查询中。","mainType":"correlated","knowledge":["projection","filter","join","concat","correlated","exists"],"taskBrief":"让内层查询引用当前外层对象，对每个对象单独检查条件。","input":"共享Professional training workshops schema与题面条件","output":"筛选完成过指定类别高费用Workshop的人","examTips":["只有至少一条同时满足全部条件的报名才符合。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不能把状态与类别条件分别放在不相关的存在性查询中。"],"tables":["Participant","Enrolment","Workshop"],"knowledgeUses":{"projection":"本小题输出：筛选完成过指定类别高费用Workshop的人","filter":"只有至少一条同时满足全部条件的报名才符合。","join":"涉及对象／命名中间结果：Participant, Enrolment, Workshop","concat":"只有至少一条同时满足全部条件的报名才符合。","correlated":"只有至少一条同时满足全部条件的报名才符合。","exists":"只有至少一条同时满足全部条件的报名才符合。"},"sqlPlan":[{"label":"选表／对象","text":"Participant, Enrolment, Workshop"},{"label":"连接与层次","text":"使用JOIN并检查完整ON条件；先确定每行的计数单位。"},{"label":"筛选、分组与输出","text":"只有至少一条同时满足全部条件的报名才符合。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT P.participantNo, CONCAT(P.fname, &#39; &#39;, P.lname) AS fullName\nFROM Participant AS P\nWHERE EXISTS (\n SELECT 1 FROM Enrolment AS E\n JOIN Workshop AS W ON W.workshopNo = E.workshopNo\n WHERE E.participantNo = P.participantNo\n AND E.status = &#39;COMPLETED&#39;\n AND W.category = &#39;TECHNOLOGY&#39; AND W.fee &gt;= 220.00\n);\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"与BUSINESS类别的平均费用比较","steps":["内层只取BUSINESS Workshop计算AVG。","外层仍检查全部Workshop，不把外层也误限制为BUSINESS。","严格低于使用\u003c；若BUSINESS集合为空，AVG为NULL，没有比较为TRUE的行。"],"check":"比较基准是BUSINESS平均值，输出目标不限类别。","pitfall":"不要把“低于某类平均值”误读为“只输出该类”。","mainType":"nested","knowledge":["projection","filter","aggregatefn","nested"],"taskBrief":"用内层查询的结果筛选外层；采用题目规定的嵌套形式。","input":"共享Professional training workshops schema与题面条件","output":"与BUSINESS类别的平均费用比较","examTips":["比较基准是BUSINESS平均值，输出目标不限类别。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不要把“低于某类平均值”误读为“只输出该类”。"],"tables":["Workshop"],"knowledgeUses":{"projection":"本小题输出：与BUSINESS类别的平均费用比较","filter":"比较基准是BUSINESS平均值，输出目标不限类别。","aggregatefn":"比较基准是BUSINESS平均值，输出目标不限类别。","nested":"比较基准是BUSINESS平均值，输出目标不限类别。"},"sqlPlan":[{"label":"选表／对象","text":"Workshop"},{"label":"连接与层次","text":"按题目指定形式区分内外层查询。"},{"label":"筛选、分组与输出","text":"比较基准是BUSINESS平均值，输出目标不限类别。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT workshopNo, title, fee FROM Workshop\nWHERE fee &lt; (SELECT AVG(fee) FROM Workshop WHERE category = &#39;BUSINESS&#39;);\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"保留EXCEL资格的全部并列最高者","steps":["外层筛选qname=EXCEL。","相关内层按相同qname求MAX(qlevel)。","用等号保留所有达到MAX的行，并按participantNo排序。"],"check":"新增另一位同等级EXCEL持有人时，两人都应保留。","pitfall":"不能用LIMIT 1丢掉并列者。","mainType":"correlated","knowledge":["projection","filter","join","aggregatefn","concat","ties","correlated","order"],"taskBrief":"让内层查询引用当前外层对象，对每个对象单独检查条件。","input":"共享Professional training workshops schema与题面条件","output":"保留EXCEL资格的全部并列最高者","examTips":["新增另一位同等级EXCEL持有人时，两人都应保留。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不能用LIMIT 1丢掉并列者。"],"tables":["Participant","Qualification"],"knowledgeUses":{"projection":"本小题输出：保留EXCEL资格的全部并列最高者","filter":"新增另一位同等级EXCEL持有人时，两人都应保留。","join":"涉及对象／命名中间结果：Participant, Qualification","aggregatefn":"新增另一位同等级EXCEL持有人时，两人都应保留。","concat":"新增另一位同等级EXCEL持有人时，两人都应保留。","ties":"新增另一位同等级EXCEL持有人时，两人都应保留。","correlated":"新增另一位同等级EXCEL持有人时，两人都应保留。","order":"新增另一位同等级EXCEL持有人时，两人都应保留。"},"sqlPlan":[{"label":"选表／对象","text":"Participant, Qualification"},{"label":"连接与层次","text":"使用JOIN并检查完整ON条件；先确定每行的计数单位。"},{"label":"筛选、分组与输出","text":"新增另一位同等级EXCEL持有人时，两人都应保留。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT P.participantNo, CONCAT(P.fname, &#39; &#39;, P.lname) AS fullName, Q.qlevel\nFROM Participant AS P JOIN Qualification AS Q ON Q.participantNo=P.participantNo\nWHERE Q.qname=&#39;EXCEL&#39; AND Q.qlevel=(\n SELECT MAX(Q2.qlevel) FROM Qualification AS Q2 WHERE Q2.qname=Q.qname\n) ORDER BY P.participantNo;\n\u003c/code>\u003c/pre>\n"}],"tags":[],"legacyPriority":"core","level":"B","archived":false,"originType":"AI-generated Variant","mainType":"correlated","related":["A4-T1"],"examRelevance":"直接改变核心题的条件或FD，检验迁移","coverageStatus":"covered","questionZh":"使用Workshop数据库。这些是A4-T1的变式，不是教师原题。\n\n(1) ) 只针对EXCEL资格，找出达到已记录最高qlevel的全部Participant，输出participantNo、fullName和qlevel。保留并列，使用相关MAX子查询，按participantNo排序。\u003c/p>\n"},{"id":"V02","title":"Filters, zero counts and HAVING transfer","topic":"Filters, zero counts and HAVING transfer","areas":["SELECT"],"source":"supplement","sourceLabel":"AI-generated Variant","sourceNote":"Independently written from the specified assignment methods; not a teacher examination question.","origin":"AI-generated Variant","priority":"B","question":"Use the workshop database. These are variants of Assignment 3 Tasks 2–3, not official examination questions.\n\n(1) Find workshopNo, title and fee for workshops with a fee between 180.00 and 220.00 inclusive.\n(2) List every participant's participantNo, fullName and number of COMPLETED enrolments, including zero. Use LEFT JOIN, and order by participantNo. Cancelled enrolments do not count.\n(3) Find workshopNo, title and the number of assigned trainers for workshops with at least two trainers. Use GROUP BY and HAVING. Count trainer assignments, not enrolments.","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"练习新的包含边界区间","steps":["数据来自Workshop。","输出workshopNo、title和fee。","BETWEEN包含180与220两个边界。"],"check":"边界180和220均应保留。","pitfall":"不要写成两个严格不等号。","mainType":"fundamentals","knowledge":["projection","filter","range"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Professional training workshops schema与题面条件","output":"练习新的包含边界区间","examTips":["边界180和220均应保留。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不要写成两个严格不等号。"],"tables":["Workshop"],"knowledgeUses":{"projection":"本小题输出：练习新的包含边界区间","filter":"边界180和220均应保留。","range":"边界180和220均应保留。"},"sqlPlan":[{"label":"选表／对象","text":"Workshop"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"边界180和220均应保留。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":
