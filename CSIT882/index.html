<script>const BANK={"version":"2026-11-04","title":"CSIT882 Review","questions":[{"id":"M1-Q1","title":"Mock Examination 1 — Question 1","topic":"大学概念建模","areas":["Conceptual"],"source":"mock-1","sourceLabel":"Mock Examination 1","sourceNote":"User-provided Questions 1–6 and Question 2 image","origin":"Original material","priority":"core","question":"Read and analyse the following specification of a sample database domain.\n\nA University would like to create a database to record information about some of its activities. The university offers a number of degrees to students. A degree is described by a unique name, total number of credit points required to complete a degree, and several requirements that must be satisfied by the future students. The university offers three types of degrees: undergraduate degrees, postgraduate degrees, and graduate certificate. Postgraduate degrees are available only for the students who already got an undergraduate degree. A description of a postgraduate degree includes a list of acceptable undergraduate degrees. A description of a graduate certificate includes a requirement on the total number of years of professional experience.\n\nEach degree consists of a collection of subjects. A description of a subject consists of its unique code, unique title, total number of credits points a subject is worth, and a list of subject learning objectives.\n\nThe university employs academic staff members, tutors and support staff members. A description of a university employee consists of a unique employee number, first name last name and date of birth. First name, last name and date of birth uniquely identified each employee. Additionally, academic staff members and tutors are described by an academic degree achieved. Support staff members are described by a list of qualifications acquired in the past together with a date when each qualification has been acquired.\n\nThe university assigns the academic staff members and tutors to the subjects. A subject has one or two academic members assigned and a number of tutors. An academic staff member and tutor can be assigned to many subjects. Support staff members are assigned to the degrees. Each support staff member is assigned to one degree and a degree has one or more support staff members assigned.\n\nThe university is divided into faculties and faculties are divided into schools. Academic staff members and tutors belong to one school and each school consists of many academic staff members and tutors. The faculties and schools are described by the unique names.\n\nDraw a conceptual schema for the specification of a database domain listed above.","answer":"这道题要求画概念图。先确定要描述哪些类，再把属性和关联放入图中。下面的属性表与两张关联图共同构成参考设计。\n\n### 类、属性和identifier\n\n| 类名 | 属性及标识规则 |\n| --- | --- |\n| DEGREE | 学位名称唯一；另记录所需总学分和若干入学要求 |\n| UNDERGRADUATE_DEGREE | 继承 DEGREE 的属性 |\n| POSTGRADUATE_DEGREE | 继承 DEGREE；用关联记录接受的本科学位 |\n| GRADUATE_CERTIFICATE | 继承 DEGREE；另记录所需专业工作年数 |\n| SUBJECT | 科目代码、科目名称分别唯一；另记录学分和学习目标列表 |\n| EMPLOYEE | 员工号唯一；“名、姓、出生日期”的组合也是一个独立identifier |\n| ACADEMIC_STAFF | 继承 EMPLOYEE；另记录已取得的学位 |\n| TUTOR | 继承 EMPLOYEE；另记录已取得的学位 |\n| SUPPORT_STAFF | 继承 EMPLOYEE；逐项记录资格名称及该资格的获得日期 |\n| FACULTY | 学院名称唯一 |\n| SCHOOL | 学系名称唯一 |\n\n同一员工的一项资格及其日期需要配成一组。不能把全部资格、全部日期分别存成两个互不对应的列表。\n\n### 学位和科目之间的关联\n\n```mermaid\nclassDiagram\n    direction LR\n    DEGREE \u003c|-- UNDERGRADUATE_DEGREE\n    DEGREE \u003c|-- POSTGRADUATE_DEGREE\n    DEGREE \u003c|-- GRADUATE_CERTIFICATE\n    DEGREE \"0..*\" -- \"1..*\" SUBJECT : consists_of\n    POSTGRADUATE_DEGREE \"0..*\" -- \"1..*\" UNDERGRADUATE_DEGREE : accepts\n```\n\n一个学位包含一组科目；本参考图允许一个科目用于多个学位。研究生学位与可接受的本科学位之间建立关联。\n\n### 员工、组织和工作分配之间的关联\n\n```mermaid\nclassDiagram\n    direction LR\n    EMPLOYEE \u003c|-- ACADEMIC_STAFF\n    EMPLOYEE \u003c|-- TUTOR\n    EMPLOYEE \u003c|-- SUPPORT_STAFF\n    FACULTY \"1\" -- \"1..*\" SCHOOL : contains\n    SCHOOL \"1\" -- \"1..*\" ACADEMIC_STAFF : has\n    SCHOOL \"1\" -- \"1..*\" TUTOR : has\n    ACADEMIC_STAFF \"1..2\" -- \"0..*\" SUBJECT : assigned_to\n    TUTOR \"1..*\" -- \"0..*\" SUBJECT : assigned_to\n    SUPPORT_STAFF \"1..*\" -- \"1\" DEGREE : assigned_to\n```\n\n每个学系属于一个学院；每位学术人员、辅导教师属于一个学系。每个科目分配一至两名学术人员。支持人员与学位之间，支持人员一方只能对应一个学位，学位一方至少对应一名支持人员。\n\n### 本参考图采用的假设\n\n- 将三种学位理解为互不重叠、覆盖全部学位的分类；原题没有明确员工身份能否重叠，故不额外声明员工子类互斥。\n- 对“若干辅导教师”和学系中的“多名人员”，图中采用至少一名的下限。若课程允许暂未配人，下限需相应改成 0，并写明解释。\n- 对题目没有强制下限的反方向，图中允许暂时没有分配。例如一名学术人员可以暂未负责科目。这是图中采用的解释，不是原文明确给出的最低数。\n- 员工已取得的学位、研究生项目接受的本科资格，可能来自校外。本设计不能因只记录本校开设的学位而排除这种资格。","context":"","canonical":null,"parts":[{"number":"1","goal":"从大学业务说明生成完整conceptual schema","steps":["先分对象种类：Degree、Subject、Employee、Faculty、School；再分Degree的三个子类、Employee的三个子类。不要因为文字提到学生，就新增没有描述要求的Student类。","逐项读唯一性：Subject的code与title分别唯一；Employee除employee_number外，还有(first_name,last_name,date_of_birth)这个组合identifier。把三个姓名/日期属性标成同一个ID标签。","把requirements、learning objectives表示为multivalued attributes；支持人员的qualification和acquired_date要成对，避免两个列表无法一一对应。","每条association分别向两个方向读：一门科目有1–2名academic staff；一位academic staff可负责多门。Support staff恰属于一个Degree，Degree至少对应一位Support staff。","将已确定的attributes、identifiers、multiplicities填进类框和关联线。a number of等未给精确下限的措辞，采用假设时单独标明，不把假设写成题面事实。"],"check":"图中必须既有属性，也有连接和数量；code、title两种独立identifier与员工三项组合identifier没有混淆。","pitfall":"不要用关系表的foreign keys代替conceptual association，也不要把员工已获学位限制为必须来自本校。","code":""}],"tags":["Classes, attributes and identifiers","Composite and alternative identifiers","Multiplicities and role directions","Generalization and subtype properties"],"questionHTML":"\u003cp>Read and analyse the following specification of a sample database domain.\u003c/p>\n\u003cp>A University would like to create a database to record information about some of its activities. The university offers a number of degrees to students. A degree is described by a unique name, total number of credit points required to complete a degree, and several requirements that must be satisfied by the future students. The university offers three types of degrees: undergraduate degrees, postgraduate degrees, and graduate certificate. Postgraduate degrees are available only for the students who already got an undergraduate degree. A description of a postgraduate degree includes a list of acceptable undergraduate degrees. A description of a graduate certificate includes a requirement on the total number of years of professional experience.\u003c/p>\n\u003cp>Each degree consists of a collection of subjects. A description of a subject consists of its unique code, unique title, total number of credits points a subject is worth, and a list of subject learning objectives.\u003c/p>\n\u003cp>The university employs academic staff members, tutors and support staff members. A description of a university employee consists of a unique employee number, first name last name and date of birth. First name, last name and date of birth uniquely identified each employee. Additionally, academic staff members and tutors are described by an academic degree achieved. Support staff members are described by a list of qualifications acquired in the past together with a date when each qualification has been acquired.\u003c/p>\n\u003cp>The university assigns the academic staff members and tutors to the subjects. A subject has one or two academic members assigned and a number of tutors. An academic staff member and tutor can be assigned to many subjects. Support staff members are assigned to the degrees. Each support staff member is assigned to one degree and a degree has one or more support staff members assigned.\u003c/p>\n\u003cp>The university is divided into faculties and faculties are divided into schools. Academic staff members and tutors belong to one school and each school consists of many academic staff members and tutors. The faculties and schools are described by the unique names.\u003c/p>\n\u003cp>Draw a conceptual schema for the specification of a database domain listed above.\u003c/p>\n","answerHTML":"\u003cp>这道题要求画概念图。先确定要描述哪些类，再把属性和关联放入图中。下面的属性表与两张关联图共同构成参考设计。\u003c/p>\n\u003ch3>类、属性和identifier\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>类名\u003c/th>\n\u003cth>属性及标识规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEGREE\u003c/td>\n\u003ctd>学位名称唯一；另记录所需总学分和若干入学要求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>UNDERGRADUATE_DEGREE\u003c/td>\n\u003ctd>继承 DEGREE 的属性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POSTGRADUATE_DEGREE\u003c/td>\n\u003ctd>继承 DEGREE；用关联记录接受的本科学位\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GRADUATE_CERTIFICATE\u003c/td>\n\u003ctd>继承 DEGREE；另记录所需专业工作年数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SUBJECT\u003c/td>\n\u003ctd>科目代码、科目名称分别唯一；另记录学分和学习目标列表\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EMPLOYEE\u003c/td>\n\u003ctd>员工号唯一；“名、姓、出生日期”的组合也是一个独立identifier\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ACADEMIC_STAFF\u003c/td>\n\u003ctd>继承 EMPLOYEE；另记录已取得的学位\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TUTOR\u003c/td>\n\u003ctd>继承 EMPLOYEE；另记录已取得的学位\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SUPPORT_STAFF\u003c/td>\n\u003ctd>继承 EMPLOYEE；逐项记录资格名称及该资格的获得日期\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FACULTY\u003c/td>\n\u003ctd>学院名称唯一\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SCHOOL\u003c/td>\n\u003ctd>学系名称唯一\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>同一员工的一项资格及其日期需要配成一组。不能把全部资格、全部日期分别存成两个互不对应的列表。\u003c/p>\n\u003ch3>学位和科目之间的关联\u003c/h3>\n\u003cfigure class=\"diagram\">\u003cdiv class=\"diagram-scroll\">\n\n\u003c!-- Generated by graphviz version 14.1.3 (20260303.0454)\n -->\n\u003c!-- Title: G Pages: 1 -->\n\u003cp>\u003csvg width=\"1061pt\" height=\"267pt\"\n viewBox=\"0.00 0.00 1061.00 267.00\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n\u003cg id=\"g0-graph0\" class=\"graph\" transform=\"scale(1 1) rotate(0) translate(28.8 238.6)\">\u003c/p>\n\u003ctitle>G\u003c/title>\n\u003c!-- DEGREE -->\n\u003cg id=\"g0-node1\" class=\"node\">\n\u003ctitle>DEGREE\u003c/title e=\"10.00\">1\u003c/text>\n\u003c/g>\n\u003c!-- SCHOOL&#45;&gt;ACADEMIC_STAFF -->\n\u003cg id=\"g1-edge5\" class=\"edge\">\n\u003ctitle>SCHOOL&#45;&gt;ACADEMIC_STAFF\u003c/title>\n\u003cpath fill=\"none\" stroke=\"#52695d\" d=\"M343.19,-247.56C378.45,-240.73 425.53,-231.62 465.72,-223.83\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"396.4\" y=\"-241.75\" font-family=\"Arial\" font-size=\"10.00\">has\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"443.06\" y=\"-237.28\" font-family=\"Arial\" font-size=\"10.00\">1..*\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"365.85\" y=\"-228.12\" font-family=\"Arial\" font-size=\"10.00\">1\u003c/text>\n\u003c/g>\n\u003c!-- SCHOOL&#45;&gt;TUTOR -->\n\u003cg id=\"g1-edge6\" class=\"edge\">\n\u003ctitle>SCHOOL&#45;&gt;TUTOR\u003c/title>\n\u003cpath fill=\"none\" stroke=\"#52695d\" d=\"M343.19,-268.24C378.45,-275.21 425.53,-284.51 465.72,-292.45\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"396.4\" y=\"-283.25\" font-family=\"Arial\" font-size=\"10.00\">has\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"438.53\" y=\"-296.14\" font-family=\"Arial\" font-size=\"10.00\">1..*\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"370.38\" y=\"-258.55\" font-family=\"Arial\" font-size=\"10.00\">1\u003c/text>\n\u003c/g>\n\u003c/g>\n\u003c/svg>\n\u003c/div>\u003cfigcaption>同一个ID标签表示组合identifier；不同ID标签表示独立identifier。空心箭头指向父类。 [0..1]可选，[*]多值，/表示derived attribute。\u003c/figcaption>\u003cbutton class=\"zoom\" type=\"button\">放大图\u003c/button>\u003c/figure>\n\n\u003cp>每个学系属于一个学院；每位学术人员、辅导教师属于一个学系。每个科目分配一至两名学术人员。支持人员与学位之间，支持人员一方只能对应一个学位，学位一方至少对应一名支持人员。\u003c/p>\n\u003ch3>本参考图采用的假设\u003c/h3>\n\u003cul>\n\u003cli>将三种学位理解为互不重叠、覆盖全部学位的分类；原题没有明确员工身份能否重叠，故不额外声明员工子类互斥。\u003c/li>\n\u003cli>对“若干辅导教师”和学系中的“多名人员”，图中采用至少一名的下限。若课程允许暂未配人，下限需相应改成 0，并写明解释。\u003c/li>\n\u003cli>对题目没有强制下限的反方向，图中允许暂时没有分配。例如一名学术人员可以暂未负责科目。这是图中采用的解释，不是原文明确给出的最低数。\u003c/li>\n\u003cli>员工已取得的学位、研究生项目接受的本科资格，可能来自校外。本设计不能因只记录本校开设的学位而排除这种资格。\u003c/li>\n\u003c/ul>\n"},{"id":"M1-Q2","title":"Mock Examination 1 — Question 2","topic":"运输服务逻辑设计","areas":["Logical"],"source":"mock-1","sourceLabel":"Mock Examination 1","sourceNote":"User-provided Questions 1–6 and Question 2 image","origin":"Original material","priority":"core","question":"Consider a conceptual schema given below.\n\n![Original conceptual schema](assets/mock-1-q2.jpg)\n\nYour task is to perform a step of logical database design, i.e. to transform a conceptual schema given above into a collection of relational schemas.\n\nFor each relational schema clearly list the names of attributes, primary key, candidate keys (if any), and foreign keys (if any). Assume, that a superset method must be used to implement a generalization.","answer":"下面逐表列出relational schema。PK 表示primary key；Other CK 表示未选作primary key的其他candidate key；FK 表示foreign key。primary key本身也属于candidate key。\n\nforeign key能保证被引用对象存在，但不能单独保证“每项服务至少有一位司机”。这个最低数量要求需要另外维护。\n\n### 先识别服务的复合identifier\n\nTSERVICE 的三个属性使用同一个 ID 标签，表示它们共同识别一项服务，而不是各自唯一。\n\n```text\n(departure_city, destination_city, departure_time)\n```\n\n### BUS：巴士\n\n每辆巴士由 rego 唯一识别。\n\n```text\nBUS(rego, make)\nPRIMARY KEY = (rego)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = none\n```\n\n### DRIVER：司机\n\ndlnumber 和 enumber 是两个分别唯一的identifier。本答案选择驾照号作primary key，员工号作另一个candidate key。\n\n```text\nDRIVER(dlnumber, enumber, full_name)\nPRIMARY KEY = (dlnumber)\nCANDIDATE KEY1 = (enumber)\nFOREIGN KEY1 = none\n```\n\n### TSERVICE：把父类和子类合成一张表\n\n按照 superset method，把共有属性和两个子类的专有属性放在同一表。用 service_type 记录类别。较长服务填写 total_days，较短服务填写 total_hours。这里假设每项服务只属于一种类型。每项服务使用一辆巴士，因此 rego 是非空foreign key。\n\n```text\nTSERVICE(\n    departure_city,\n    destination_city,\n    departure_time,\n    arrival_time,\n    rego,\n    service_type,\n    total_days,\n    total_hours\n)\n\nPRIMARY KEY = (departure_city, destination_city, departure_time)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (rego) REFERENCES BUS(rego)\n```\n\n### SERVICE_DRIVER：记录服务与司机的分配\n\n一项服务可有多名司机，一名司机可负责多项服务，因此每一对“服务—司机”单独记录。表中的primary key包含完整服务identifier和司机identifier。\n\n```text\nSERVICE_DRIVER(\n    departure_city,\n    destination_city,\n    departure_time,\n    dlnumber\n)\n\nPRIMARY KEY = (departure_city, destination_city, departure_time, dlnumber)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (departure_city, destination_city, departure_time)\n     REFERENCES TSERVICE(departure_city, destination_city, departure_time)\nFOREIGN KEY2 = (dlnumber) REFERENCES DRIVER(dlnumber)\n```\n\n### STOP：记录同一服务下的停靠点\n\nsnumber 是qualifier。图中的 0..1 表示：固定一项服务和一个 snumber，至多对应一个停靠点；不表示整项服务最多只能有一个停靠点。停靠点的primary key是完整服务identifier加 snumber。带 service_ 前缀的时间属于服务，不带该前缀的时间属于停靠点。\n\n```text\nSTOP(\n    service_departure_city,\n    service_destination_city,\n    service_departure_time,\n    snumber,\n    stop_city,\n    departure_time,\n    arrival_time\n)\n\nPRIMARY KEY = (\n    service_departure_city,\n    service_destination_city,\n    service_departure_time,\n    snumber\n)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (service_departure_city, service_destination_city, service_departure_time)\n    REFERENCES TSERVICE(departure_city, destination_city, departure_time)\n```\n\n### 图中标签对照\n\n**图中文字对照（仅翻译，不作转换提示）**：LONGER TSERVICE 较长运输服务；SHORTER TSERVICE 较短运输服务；TSERVICE 运输服务；BUS 巴士；DRIVER 司机；STOP 停靠点。total-days 总天数；total-hours 总小时数；rego 注册号；make 品牌；departure-city 出发城市；destination-city 目的城市；departure-time 出发时间；arrival time/arrival-time 到达时间；dlnumber 驾照号；enumber 员工号；full-name 全名；snumber 停靠序号。Assigned-to 分配给；Passes-through 途经。ID identifier；ID1、ID2 为不同identifier；1 恰好一个；* 多个（可为零）；1..* 一个或多个；0..1 零个或一个。三角空心箭头为 generalization（泛化）符号。","context":"","canonical":null,"parts":[{"number":"1","goal":"按superset method把运输服务图转换成relational schemas","steps":["TSERVICE的三个ID属性合起来才识别一项服务；先抄完整组合(departure_city,destination_city,departure_time)，后续所有引用都使用这三项。","先建立不引用其他表的BUS与DRIVER。DRIVER的dlnumber、enumber分别唯一：选其中一个为primary key，另一个保留为candidate key。","把较长与较短服务合入TSERVICE，增加service_type。total_days与total_hours是子类专有属性，在整表需要允许NULL，并按类别填写。","BUS到TSERVICE是一对多，把rego放入TSERVICE作foreign key；TSERVICE到DRIVER是many-to-many，建立SERVICE_DRIVER保存完整配对。","STOP受服务和snumber共同限定，所以primary key是服务三项标识再加snumber；STOP本身的到离时间与服务时间要区分命名。","用课堂PRIMARY KEY =、CANDIDATE KEY =、FOREIGN KEY = ... REFERENCES ...格式列出，父表先于子表。检查minimum participation不能仅靠foreign key保证的限制。"],"check":"最终有BUS、DRIVER、TSERVICE、SERVICE_DRIVER、STOP五个schemas；STOP每个key含4项。","pitfall":"0..1针对固定(service,snumber)，不是整项服务最多一个STOP。","code":""}],"tags":["Primary, candidate and composite foreign keys","Many-to-many and association attributes","Qualified association transformation","Superset method","Parent-before-child and classroom schema format"],"questionHTML":"\u003cp>Consider a conceptual schema given below.\u003c/p>\n\u003cp>\u003cimg src=\"assets/mock-1-q2.jpg\" alt=\"Original conceptual schema\">\u003c/p>\n\u003cp>Your task is to perform a step of logical database design, i.e. to transform a conceptual schema given above into a collection of relational schemas.\u003c/p>\n\u003cp>For each relational schema clearly list the names of attributes, primary key, candidate keys (if any), and foreign keys (if any). Assume, that a superset method must be used to implement a generalization.\u003c/p>\n","answerHTML":"\u003cp>下面逐表列出relational schema。PK 表示primary key；Other CK 表示未选作primary key的其他candidate key；FK 表示foreign key。primary key本身也属于candidate key。\u003c/p>\n\u003cp>foreign key能保证被引用对象存在，但不能单独保证“每项服务至少有一位司机”。这个最低数量要求需要另外维护。\u003c/p>\n\u003ch3>先识别服务的复合identifier\u003c/h3>\n\u003cp>TSERVICE 的三个属性使用同一个 ID 标签，表示它们共同识别一项服务，而不是各自唯一。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">(departure_city, destination_city, departure_time)\n\u003c/code>\u003c/pre>\n\u003ch3>BUS：巴士\u003c/h3>\n\u003cp>每辆巴士由 rego 唯一识别。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">BUS(rego, make)\nPRIMARY KEY = (rego)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = none\n\u003c/code>\u003c/pre>\n\u003ch3>DRIVER：司机\u003c/h3>\n\u003cp>dlnumber 和 enumber 是两个分别唯一的identifier。本答案选择驾照号作primary key，员工号作另一个candidate key。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">DRIVER(dlnumber, enumber, full_name)\nPRIMARY KEY = (dlnumber)\nCANDIDATE KEY1 = (enumber)\nFOREIGN KEY1 = none\n\u003c/code>\u003c/pre>\n\u003ch3>TSERVICE：把父类和子类合成一张表\u003c/h3>\n\u003cp>按照 superset method，把共有属性和两个子类的专有属性放在同一表。用 service_type 记录类别。较长服务填写 total_days，较短服务填写 total_hours。这里假设每项服务只属于一种类型。每项服务使用一辆巴士，因此 rego 是非空foreign key。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">TSERVICE(\n    departure_city,\n    destination_city,\n    departure_time,\n    arrival_time,\n    rego,\n    service_type,\n    total_days,\n    total_hours\n)\n\nPRIMARY KEY = (departure_city, destination_city, departure_time)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (rego) REFERENCES BUS(rego)\n\u003c/code>\u003c/pre>\n\u003ch3>SERVICE_DRIVER：记录服务与司机的分配\u003c/h3>\n\u003cp>一项服务可有多名司机，一名司机可负责多项服务，因此每一对“服务—司机”单独记录。表中的primary key包含完整服务identifier和司机identifier。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">SERVICE_DRIVER(\n    departure_city,\n    destination_city,\n    departure_time,\n    dlnumber\n)\n\nPRIMARY KEY = (departure_city, destination_city, departure_time, dlnumber)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (departure_city, destination_city, departure_time)\n     REFERENCES TSERVICE(departure_city, destination_city, departure_time)\nFOREIGN KEY2 = (dlnumber) REFERENCES DRIVER(dlnumber)\n\u003c/code>\u003c/pre>\n\u003ch3>STOP：记录同一服务下的停靠点\u003c/h3>\n\u003cp>snumber 是qualifier。图中的 0..1 表示：固定一项服务和一个 snumber，至多对应一个停靠点；不表示整项服务最多只能有一个停靠点。停靠点的primary key是完整服务identifier加 snumber。带 service_ 前缀的时间属于服务，不带该前缀的时间属于停靠点。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">STOP(\n    service_departure_city,\n    service_destination_city,\n    service_departure_time,\n    snumber,\n    stop_city,\n    departure_time,\n    arrival_time\n)\n\nPRIMARY KEY = (\n    service_departure_city,\n    service_destination_city,\n    service_departure_time,\n    snumber\n)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (service_departure_city, service_destination_city, service_departure_time)\n    REFERENCES TSERVICE(departure_city, destination_city, departure_time)\n\u003c/code>\u003c/pre>\n\u003ch3>图中标签对照\u003c/h3>\n\u003cp>\u003cstrong>图中文字对照（仅翻译，不作转换提示）\u003c/strong>：LONGER TSERVICE 较长运输服务；SHORTER TSERVICE 较短运输服务；TSERVICE 运输服务；BUS 巴士；DRIVER 司机；STOP 停靠点。total-days 总天数；total-hours 总小时数；rego 注册号；make 品牌；departure-city 出发城市；destination-city 目的城市；departure-time 出发时间；arrival time/arrival-time 到达时间；dlnumber 驾照号；enumber 员工号；full-name 全名；snumber 停靠序号。Assigned-to 分配给；Passes-through 途经。ID identifier；ID1、ID2 为不同identifier；1 恰好一个；* 多个（可为零）；1..* 一个或多个；0..1 零个或一个。三角空心箭头为 generalization（泛化）符号。\u003c/p>\n"},{"id":"M1-Q3","title":"Mock Examination 1 — Question 3","topic":"运输数据库：SELECT 查询","areas":["SELECT"],"source":"mock-1","sourceLabel":"Mock Examination 1","sourceNote":"User-provided Questions 1–6 and Question 2 image","origin":"Original material","priority":"core","question":"Write SELECT statements that implement the following queries.\n\n(1) Find the registration numbers of trucks, that have capacity in a range between 100 inclusive and 500 inclusive.\n\n(2) Find the first and the last names of all drivers who are on leave.\n\n(3) Find the registration numbers of all trucks that have not been used for any trips.\n\n(4) Find the registration numbers of all trucks together with total number of trips the trucks have been used for. There is no need to include the truck that have not been used for any trips.\n\n(5) Find the names of all departure cities together with the names of all destination cities.","answer":"### (1) 容量从100到500，包含两端\n\nBETWEEN 包含两个边界。原建表语句同时规定 CAPACITY 小于100；如果该 CHECK 生效，合法数据中不会有符合本查询的行。这里按查询要求写语句，并保留原题的约束冲突。\n\n```sql\nSELECT REGNUM\nFROM TRUCK\nWHERE CAPACITY BETWEEN 100 AND 500;\n```\n\n### (2) 休假司机的名和姓\n\n姓名在 EMPLOYEE，司机状态在 DRIVER。通过员工号 ENUM 连接，再筛选 ON LEAVE。不同司机可能同名，所以不能仅因姓名相同就去重。\n\n```sql\nSELECT E.FNAME, E.LNAME\nFROM EMPLOYEE AS E\nJOIN DRIVER AS D\n    ON D.ENUM = E.ENUM\nWHERE D.STATUS = 'ON LEAVE';\n```\n\n### (3) 从未用于行程的卡车\n\n对每辆卡车，检查 TRIP 中是否不存在引用它的行程记录。当前车辆状态不能代替历史行程记录。\n\n```sql\nSELECT T.REGNUM\nFROM TRUCK AS T\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM TRIP AS P\n    WHERE P.REGNUM = T.REGNUM\n);\n```\n\n### (4) 每辆已使用卡车的行程总数\n\nTRIP 每行代表一次行程。按卡车注册号分组后计数即可，未使用的卡车自然不会出现。连接 TRIPLEG 后直接计数可能会数成路段数。\n\n```sql\nSELECT REGNUM, COUNT(*) AS TOTAL_TRIPS\nFROM TRIP\nGROUP BY REGNUM;\n```\n\n### (5) 解释一：合成一列城市名单\n\n如果原句要求把出发城市和目的城市合成一个名单，用 UNION，并去除重复名称。\n\n```sql\nSELECT DEPARTURE AS CITY\nFROM TRIPLEG\nUNION\nSELECT DESTINATION AS CITY\nFROM TRIPLEG;\n```\n\n### (5) 解释二：列出出发地和目的地的配对\n\n如果老师要求的是两列“出发城市—目的城市”配对，用下面这条查询。原句没有明确结果形状；两条查询回答的含义不同，不能当成可互换的答案。\n\n```sql\nSELECT DISTINCT DEPARTURE, DESTINATION\nFROM TRIPLEG;\n```","context":"transport","canonical":null,"parts":[{"number":"1","goal":"返回容量区间内卡车的注册号","steps":["输出只有注册号REGNUM，数据来自TRUCK，不需要连接其他表。","inclusive要求100、500都包含，使用CAPACITY BETWEEN 100 AND 500。","核对CREATE TABLE中的CAPACITY CHECK；若小于100的约束生效，此查询合法但没有匹配行。"],"check":"WHERE条件包含两个边界；有空结果时先核对约束，不修改题目数值。","pitfall":"不要把CAPACITY换成WEIGHT来“修复”原题冲突。","code":"```sql\nSELECT REGNUM\nFROM TRUCK\nWHERE CAPACITY BETWEEN 100 AND 500;\n```"},{"number":"2","goal":"返回休假司机的名和姓","steps":["姓名在EMPLOYEE，状态在DRIVER，确定两表通过ENUM匹配。","JOIN后筛选D.STATUS = 'ON LEAVE'，而不是筛选员工表中不存在的状态。","SELECT只列FNAME、LNAME。不同司机可同名，题目没有要求按姓名去重。"],"check":"每个符合状态的司机贡献一行姓名。","pitfall":"只查DRIVER得不到姓名，随意DISTINCT又可能合并不同司机。","code":"```sql\nSELECT E.FNAME, E.LNAME\nFROM EMPLOYEE AS E\nJOIN DRIVER AS D\n    ON D.ENUM = E.ENUM\nWHERE D.STATUS = 'ON LEAVE';\n```"},{"number":"3","goal":"返回从未执行行程的卡车","steps":["从TRUCK开始，才能包含没有任何TRIP的卡车。","对当前卡车匹配TRIP.REGNUM = TRUCK.REGNUM。","用NOT EXISTS保留完全没有匹配行程的卡车；车辆当前状态不代表历史是否使用过。"],"check":"没有行程的卡车必须保留；有一次或更多行程的必须排除。","pitfall":"WHERE状态AVAILABLE不能回答“从未使用”。","code":"```sql\nSELECT T.REGNUM\nFROM TRUCK AS T\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM TRIP AS P\n    WHERE P.REGNUM = T.REGNUM\n);\n```"},{"number":"4","goal":"按已使用卡车统计行程次数","steps":["TRIP中的一行是一趟行程，正是要计数的对象。","按REGNUM分组，用COUNT(*)统计每组行数。","直接从TRIP出发即可自动排除没有行程的卡车，不需要额外outer join。"],"check":"同一注册号只出一行；计数是trip数而不是leg数。","pitfall":"连接TRIPLEG会把一趟多段行程放大成多行。","code":"```sql\nSELECT REGNUM, COUNT(*) AS TOTAL_TRIPS\nFROM TRIP\nGROUP BY REGNUM;\n```"},{"number":"5","goal":"明确城市查询的结果形状，再选择SQL","steps":["先区分两种可能：一列“所有城市名称”，或者两列“出发城市—目的城市配对”。原句未明确这一点。","若要求合成一列名单，分别SELECT DEPARTURE、DESTINATION，用UNION合并去重。","若要求配对，则SELECT DISTINCT DEPARTURE, DESTINATION，保留同一条路段上的配对关系。"],"check":"核对输出列数以及是否保留城市配对；两种答案不能称为含义相同。","pitfall":"不要不说明结果形状就把两条SQL当作完全可互换的写法。","code":"```sql\nSELECT DEPARTURE AS CITY\nFROM TRIPLEG\nUNION\nSELECT DESTINATION AS CITY\nFROM TRIPLEG;\n```\n\n```sql\nSELECT DISTINCT DEPARTURE, DESTINATION\nFROM TRIPLEG;\n```"}],"tags":["Projection, filters, Boolean conditions and sorting","GROUP BY and HAVING","UNION, duplicates, intersection and difference","Nested queries, EXISTS and anti-joins"],"questionHTML":"\u003cp>Write SELECT statements that implement the following queries.\u003c/p>\n\u003cp>(1) Find the registration numbers of trucks, that have capacity in a range between 100 inclusive and 500 inclusive.\u003c/p>\n\u003cp>(2) Find the first and the last names of all drivers who are on leave.\u003c/p>\n\u003cp>(3) Find the registration numbers of all trucks that have not been used for any trips.\u003c/p>\n\u003cp>(4) Find the registration numbers of all trucks together with total number of trips the trucks have been used for. There is no need to include the truck that have not been used for any trips.\u003c/p>\n\u003cp>(5) Find the names of all departure cities together with the names of all destination cities.\u003c/p>\n","answerHTML":"\u003ch3>(1) 容量从100到500，包含两端\u003c/h3>\n\u003cp>BETWEEN 包含两个边界。原建表语句同时规定 CAPACITY 小于100；如果该 CHECK 生效，合法数据中不会有符合本查询的行。这里按查询要求写语句，并保留原题的约束冲突。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">SELECT REGNUM\nFROM TRUCK\nWHERE CAPACITY BETWEEN 100 AND 500;\n\u003c/code>\u003c/pre>\n\u003ch3>(2) 休假司机的名和姓\u003c/h3>\n\u003cp>姓名在 EMPLOYEE，司机状态在 DRIVER。通过员工号 ENUM 连接，再筛选 ON LEAVE。不同司机可能同名，所以不能仅因姓名相同就去重。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">SELECT E.FNAME, E.LNAME\nFROM EMPLOYEE AS E\nJOIN DRIVER AS D\n    ON D.ENUM = E.ENUM\nWHERE D.STATUS = &#39;ON LEAVE&#39;;\n\u003c/code>\u003c/pre>\n\u003ch3>(3) 从未用于行程的卡车\u003c/h3>\n\u003cp>对每辆卡车，检查 TRIP 中是否不存在引用它的行程记录。当前车辆状态不能代替历史行程记录。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">SELECT T.REGNUM\nFROM TRUCK AS T\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM TRIP AS P\n    WHERE P.REGNUM = T.REGNUM\n);\n\u003c/code>\u003c/pre>\n\u003ch3>(4) 每辆已使用卡车的行程总数\u003c/h3>\n\u003cp>TRIP 每行代表一次行程。按卡车注册号分组后计数即可，未使用的卡车自然不会出现。连接 TRIPLEG 后直接计数可能会数成路段数。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">SELECT REGNUM, COUNT(*) AS TOTAL_TRIPS\nFROM TRIP\nGROUP BY REGNUM;\n\u003c/code>\u003c/pre>\n\u003ch3>(5) 解释一：合成一列城市名单\u003c/h3>\n\u003cp>如果原句要求把出发城市和目的城市合成一个名单，用 UNION，并去除重复名称。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">SELECT DEPARTURE AS CITY\nFROM TRIPLEG\nUNION\nSELECT DESTINATION AS CITY\nFROM TRIPLEG;\n\u003c/code>\u003c/pre>\n\u003ch3>(5) 解释二：列出出发地和目的地的配对\u003c/h3>\n\u003cp>如果老师要求的是两列“出发城市—目的城市”配对，用下面这条查询。原句没有明确结果形状；两条查询回答的含义不同，不能当成可互换的答案。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">SELECT DISTINCT DEPARTURE, DESTINATION\nFROM TRIPLEG;\n\u003c/code>\u003c/pre>\n"},{"id":"M1-Q4","title":"Mock Examination 1 — Question 4","topic":"司机技能与行程记录的修改","areas":["DDL/DML"],"source":"mock-1","sourceLabel":"Mock Examination 1","sourceNote":"User-provided Questions 1–6 and Question 2 image","origin":"Original material","priority":"core","question":"Write SQL statements that implement the following structural modifications of a database and data manipulations on the contents of a database. Note, that implementation of some of the tasks listed below may need more than one SQL statement.\n\n(1) We would like to add to a database information about the skills possessed by each driver. Assume, that a driver has many skills and a skill can be possessed by many drivers. It may happen that some skills are not possessed by any driver. The types of the new columns are up to you.\n\n(2) Delete from a database information about the second and third leg of a trip 36.\n\n(3) Change a date of trip number 26 to the next day after the present date of trip 26.\n\n(4) Assume that a trip number 25 has 3 legs. A trip number 25 started in Sydney and it ended in Perth. Add one more leg to a trip 25 such that after update the trip ends in the same city it started from.\n\n(5) Assume that a trip 20 has 2 legs and that a destination of the first leg is Sydney. Update information about a trip 20 such that after update a destination of the first leg is Perth.","answer":"以下数据修改还必须满足已有唯一性约束。例如，改变行程日期后若造成 (LNUM, REGNUM, TDATE) 重复，更新会被拒绝。\n\n### (1) 记录技能及司机拥有的技能\n\nSKILL 保存技能本身。DRIVER_SKILL 每行表示一名司机拥有一项技能。这样，没有司机具备的技能仍可保存在 SKILL 中。composite primary key防止同一配对重复；这些键不自动保证每名司机至少拥有一项技能。\n\n```sql\nCREATE TABLE SKILL (\n    SKILL_CODE VARCHAR(20) NOT NULL,\n    SKILL_NAME VARCHAR(100) NOT NULL,\n    CONSTRAINT SKILL_PKEY PRIMARY KEY (SKILL_CODE)\n);\n\nCREATE TABLE DRIVER_SKILL (\n    ENUM DECIMAL(12) NOT NULL,\n    SKILL_CODE VARCHAR(20) NOT NULL,\n    CONSTRAINT DRIVER_SKILL_PKEY PRIMARY KEY (ENUM, SKILL_CODE),\n    CONSTRAINT DRIVER_SKILL_DRIVER_FKEY\n        FOREIGN KEY (ENUM) REFERENCES DRIVER (ENUM),\n    CONSTRAINT DRIVER_SKILL_SKILL_FKEY\n        FOREIGN KEY (SKILL_CODE) REFERENCES SKILL (SKILL_CODE)\n);\n```\n\n### (2) 删除行程36的第2、3段\n\n同时限制 TNUM 和 LEGNUM，只删除这次行程的两个指定路段。\n\n```sql\nDELETE FROM TRIPLEG\nWHERE TNUM = 36\n  AND LEGNUM IN (2, 3);\n```\n\n### (3) 行程26的已存日期加一天\n\n起点是该行程当前保存在 TDATE 中的日期，而不是今天。\n\n```sql\nUPDATE TRIP\nSET TDATE = DATE_ADD(TDATE, INTERVAL 1 DAY)\nWHERE TNUM = 26;\n```\n\n### (4) 为行程25增加返回路段\n\n已有三段，因此新增第四段。从原终点 Perth 出发，回到原起点 Sydney。\n\n```sql\nINSERT INTO TRIPLEG (TNUM, LEGNUM, DEPARTURE, DESTINATION)\nVALUES (25, 4, 'Perth', 'Sydney');\n```\n\n### (5) 修改行程20第一段的目的地\n\n下面第一条 UPDATE 直接完成题面明确要求。第二条 UPDATE 采用额外的业务假设：相邻路段必须首尾相接，所以也把第二段起点改为 Perth。题目给出的表约束没有强制这条连续性；只按题面最低要求作答时，不应把第二条当成原文明确要求。\n\n```sql\nUPDATE TRIPLEG\nSET DESTINATION = 'Perth'\nWHERE TNUM = 20\n  AND LEGNUM = 1;\n\nUPDATE TRIPLEG\nSET DEPARTURE = 'Perth'\nWHERE TNUM = 20\n  AND LEGNUM = 2;\n```","context":"transport","canonical":null,"parts":[{"number":"1","goal":"用结构表达司机与技能的many-to-many关系","steps":["技能可能没有任何司机拥有，因此SKILL必须能独立存一行。","DRIVER_SKILL每行保存一个司机与技能配对，两个foreign keys分别引用DRIVER和SKILL。","把(ENUM,SKILL_CODE)作为composite primary key，防止重复拥有关系。若还要求每司机至少一项技能，说明这不是普通foreign key自动保证的。"],"check":"可以只插入SKILL而没有DRIVER_SKILL；配对的两端必须真实存在。","pitfall":"不要把多个技能用逗号塞进DRIVER的一列，也不要只建配对表而丢失无人拥有的技能。","code":"```sql\nCREATE TABLE SKILL (\n    SKILL_CODE VARCHAR(20) NOT NULL,\n    SKILL_NAME VARCHAR(100) NOT NULL,\n    CONSTRAINT SKILL_PKEY PRIMARY KEY (SKILL_CODE)\n);\n\nCREATE TABLE DRIVER_SKILL (\n    ENUM DECIMAL(12) NOT NULL,\n    SKILL_CODE VARCHAR(20) NOT NULL,\n    CONSTRAINT DRIVER_SKILL_PKEY PRIMARY KEY (ENUM, SKILL_CODE),\n    CONSTRAINT DRIVER_SKILL_DRIVER_FKEY\n        FOREIGN KEY (ENUM) REFERENCES DRIVER (ENUM),\n    CONSTRAINT DRIVER_SKILL_SKILL_FKEY\n        FOREIGN KEY (SKILL_CODE) REFERENCES SKILL (SKILL_CODE)\n);\n```"},{"number":"2","goal":"只删除行程36的第2、3段","steps":["操作对象是TRIPLEG中的行，不是TRIP整行。","TNUM = 36限定行程，LEGNUM IN (2,3)限定两个路段。","DELETE前可用相同WHERE写SELECT检查命中范围；正式答案保留必要DELETE即可。"],"check":"其他行程的第2、3段、行程36的其他路段均保留。","pitfall":"漏掉TNUM会误删所有行程的这些路段。","code":"```sql\nDELETE FROM TRIPLEG\nWHERE TNUM = 36\n  AND LEGNUM IN (2, 3);\n```"},{"number":"3","goal":"给行程26当前日期加一天","steps":["WHERE TNUM=26确定唯一要更新的行。","题目说present date of trip 26，基准是已存TDATE。","SET TDATE=DATE_ADD(TDATE,INTERVAL 1 DAY)处理跨月、跨年；检查更新后不会违反既有UNIQUE组合。"],"check":"原日期若为月末或年末，结果仍是正确下一天。","pitfall":"CURRENT_DATE()+1用今天作起点，与题意不同。","code":"```sql\nUPDATE TRIP\nSET TDATE = DATE_ADD(TDATE, INTERVAL 1 DAY)\nWHERE TNUM = 26;\n```"},{"number":"4","goal":"为行程25增加第四段返回路程","steps":["原有三段，新路段LEGNUM应为4。","原终点Perth成为新路段起点，原起点Sydney成为新路段终点。","向TRIPLEG插入(25,4,Perth,Sydney)，TRIP记录必须已存在。"],"check":"新增后最后一个目的地为Sydney，且与前一段终点接续。","pitfall":"不要把新增路段写成Sydney到Perth，或覆盖现有第三段。","code":"```sql\nINSERT INTO TRIPLEG (TNUM, LEGNUM, DEPARTURE, DESTINATION)\nVALUES (25, 4, 'Perth', 'Sydney');\n```"},{"number":"5","goal":"把行程20第一段目的地改成Perth","steps":["直接要求由TNUM=20且LEGNUM=1定位。","第一条UPDATE只修改DESTINATION，直接完成题面要求。","若额外采用“相邻路段必须首尾相接”的业务规则，再同步更新第二段DEPARTURE，并在同一transaction处理；这条规则不是原DDL强制的。"],"check":"明确区分最低题面要求与额外连续性假设；检查UNIQUE仍满足。","pitfall":"不要无说明地把修改第二段也宣称为题目明确要求。","code":"```sql\nUPDATE TRIPLEG\nSET DESTINATION = 'Perth'\nWHERE TNUM = 20\n  AND LEGNUM = 1;\n\nUPDATE TRIPLEG\nSET DEPARTURE = 'Perth'\nWHERE TNUM = 20\n  AND LEGNUM = 2;\n```"}],"tags":["CREATE TABLE and suitable types","INSERT, UPDATE, DELETE and parent/child order"],"questionHTML":"\u003cp>Write SQL statements that implement the following structural modifications of a database and data manipulations on the contents of a database. Note, that implementation of some of the tasks listed below may need more than one SQL statement.\u003c/p>\n\u003cp>(1) We would like to add to a database information about the skills possessed by each driver. Assume, that a driver has many skills and a skill can be possessed by many drivers. It may happen that some skills are not possessed by any driver. The types of the new columns are up to you.\u003c/p>\n\u003cp>(2) Delete from a database information about the second and third leg of a trip 36.\u003c/p>\n\u003cp>(3) Change a date of trip number 26 to the next day after the present date of trip 26.\u003c/p>\n\u003cp>(4) Assume that a trip number 25 has 3 legs. A trip number 25 started in Sydney and it ended in Perth. Add one more leg to a trip 25 such that after update the trip ends in the same city it started from.\u003c/p>\n\u003cp>(5) Assume that a trip 20 has 2 legs and that a destination of the first leg is Sydney. Update information about a trip 20 such that after update a destination of the first leg is Perth.\u003c/p>\n","answerHTML":"\u003cp>以下数据修改还必须满足已有唯一性约束。例如，改变行程日期后若造成 (LNUM, REGNUM, TDATE) 重复，更新会被拒绝。\u003c/p>\n\u003ch3>(1) 记录技能及司机拥有的技能\u003c/h3>\n\u003cp>SKILL 保存技能本身。DRIVER_SKILL 每行表示一名司机拥有一项技能。这样，没有司机具备的技能仍可保存在 SKILL 中。composite primary key防止同一配对重复；这些键不自动保证每名司机至少拥有一项技能。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">CREATE TABLE SKILL (\n    SKILL_CODE VARCHAR(20) NOT NULL,\n    SKILL_NAME VARCHAR(100) NOT NULL,\n    CONSTRAINT SKILL_PKEY PRIMARY KEY (SKILL_CODE)\n);\n\nCREATE TABLE DRIVER_SKILL (\n    ENUM DECIMAL(12) NOT NULL,\n    SKILL_CODE VARCHAR(20) NOT NULL,\n    CONSTRAINT DRIVER_SKILL_PKEY PRIMARY KEY (ENUM, SKILL_CODE),\n    CONSTRAINT DRIVER_SKILL_DRIVER_FKEY\n        FOREIGN KEY (ENUM) REFERENCES DRIVER (ENUM),\n    CONSTRAINT DRIVER_SKILL_SKILL_FKEY\n        FOREIGN KEY (SKILL_CODE) REFERENCES SKILL (SKILL_CODE)\n);\n\u003c/code>\u003c/pre>\n\u003ch3>(2) 删除行程36的第2、3段\u003c/h3>\n\u003cp>同时限制 TNUM 和 LEGNUM，只删除这次行程的两个指定路段。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">DELETE FROM TRIPLEG\nWHERE TNUM = 36\n  AND LEGNUM IN (2, 3);\n\u003c/code>\u003c/pre>\n\u003ch3>(3) 行程26的已存日期加一天\u003c/h3>\n\u003cp>起点是该行程当前保存在 TDATE 中的日期，而不是今天。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">UPDATE TRIP\nSET TDATE = DATE_ADD(TDATE, INTERVAL 1 DAY)\nWHERE TNUM = 26;\n\u003c/code>\u003c/pre>\n\u003ch3>(4) 为行程25增加返回路段\u003c/h3>\n\u003cp>已有三段，因此新增第四段。从原终点 Perth 出发，回到原起点 Sydney。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">INSERT INTO TRIPLEG (TNUM, LEGNUM, DEPARTURE, DESTINATION)\nVALUES (25, 4, &#39;Perth&#39;, &#39;Sydney&#39;);\n\u003c/code>\u003c/pre>\n\u003ch3>(5) 修改行程20第一段的目的地\u003c/h3>\n\u003cp>下面第一条 UPDATE 直接完成题面明确要求。第二条 UPDATE 采用额外的业务假设：相邻路段必须首尾相接，所以也把第二段起点改为 Perth。题目给出的表约束没有强制这条连续性；只按题面最低要求作答时，不应把第二条当成原文明确要求。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">UPDATE TRIPLEG\nSET DESTINATION = &#39;Perth&#39;\nWHERE TNUM = 20\n  AND LEGNUM = 1;\n\nUPDATE TRIPLEG\nSET DEPARTURE = &#39;Perth&#39;\nWHERE TNUM = 20\n  AND LEGNUM = 2;\n\u003c/code>\u003c/pre>\n"},{"id":"M1-Q5","title":"Mock Examination 1 — Question 5","topic":"USER_A / USER_B 用户与权限","areas":["Access"],"source":"mock-1","sourceLabel":"Mock Examination 1","sourceNote":"User-provided Questions 1–6 and Question 2 image Public edition: example names, contact details and password literals anonymized.","origin":"Original material","priority":"core","question":"Assume that a user root with a password '[ROOT_OR_USER_PASSWORD]' created a database called transport and the user executed CREATE TABLE statements given on page 2 of the examination paper to create the relational tables in the database transport.\n\nWrite the implementations of the operations listed below as a user root. Assume that a user root has already connected to the database. Note, that implementation of some operations may need more than one SQL statement.\n\n(1) A user root nominates a database transport as a default database and then the user creates two new users USER_A and USER_B.\n\n(2) A user root grants the read access rights to the relational tables EMPLOYEE and DRIVER to a user USER_A. The read access rights cannot be propagated to other roles or users.\n\n(3) A user root grants the rights to insert the rows into a relational tables TRIP and TRIPLEG to a user USER_B. The access rights can be propagated to other roles or users.\n\n(4) A user root grants the update privilege on all relational tables in csit115 database to a user USER_A. The privilege cannot be propagated to other roles or users.\n\n(5) A user root grants the rights to information about the total number trips performed by each driver to a user USER_B.","answer":"### (1) 选定数据库并创建用户\n\nroot 已经连接，无需再次登录。这里统一使用 localhost 账号。题目没有指定 USER_A、USER_B 的密码，因此示例没有把 root 的密码当成他们的密码。\n\n```sql\nUSE transport;\n\nCREATE USER 'USER_A'@'localhost';\nCREATE USER 'USER_B'@'localhost';\n```\n\n### (2) 授予TRAINER_01两张表的读取权限\n\n读取对应 SELECT。对于题中刚创建、没有其他授权来源的账号，不加 WITH GRANT OPTION，表示没有授予转授权能力。\n\n```sql\nGRANT SELECT ON transport.EMPLOYEE\nTO 'USER_A'@'localhost';\n\nGRANT SELECT ON transport.DRIVER\nTO 'USER_A'@'localhost';\n```\n\n### (3) 授予USER_B插入权限，并允许转授权\n\nINSERT 是插入行的权限。WITH GRANT OPTION 允许 USER_B 把相应权限再授给其他用户或角色。\n\n```sql\nGRANT INSERT ON transport.TRIP\nTO 'USER_B'@'localhost'\nWITH GRANT OPTION;\n\nGRANT INSERT ON transport.TRIPLEG\nTO 'USER_B'@'localhost'\nWITH GRANT OPTION;\n```\n\n### (4) 授予TRAINER_01更新csit115中所有表的权限\n\n原题此处写的是 csit115，不是 transport。答案保留这个数据库名；不能把怀疑的笔误直接改成另一数据库。\n\n```sql\nGRANT UPDATE ON csit115.*\nTO 'USER_A'@'localhost';\n```\n\n### (5) 让USER_B读取每位司机的行程总数\n\n先建立汇总视图，再只向 USER_B 授予该视图的 SELECT。LEFT JOIN保留没有行程的司机；COUNT(T.TNUM) 使他们得到0。视图由 root 创建，使用 SQL SECURITY DEFINER，因此无需另外授予 USER_B 底表的直接读取权限。\n\n```sql\nCREATE SQL SECURITY DEFINER VIEW transport.DRIVER_TRIP_TOTAL AS\nSELECT D.ENUM,\n       D.LNUM,\n       COUNT(T.TNUM) AS TOTAL_TRIPS\nFROM transport.DRIVER AS D\nLEFT JOIN transport.TRIP AS T\n    ON T.LNUM = D.LNUM\nGROUP BY D.ENUM, D.LNUM;\n\nGRANT SELECT ON transport.DRIVER_TRIP_TOTAL\nTO 'USER_B'@'localhost';\n```","context":"transport","canonical":null,"parts":[{"number":"1","goal":"设定默认数据库并创建两名用户","steps":["root已连接，直接USE transport，无需再次写登录命令。","统一约定TRAINER_01、USER_B为localhost账号，避免后续GRANT引用不同host。","CREATE USER各执行一次；题目只给了root密码，不把它自动分配给新用户。"],"check":"USE先于依赖默认数据库的操作；新用户名称/host前后一致。","pitfall":"数据库用户名root与操作系统root不是一回事。","code":"```sql\nUSE transport;\n\nCREATE USER 'USER_A'@'localhost';\nCREATE USER 'USER_B'@'localhost';\n```"},{"number":"2","goal":"授予TRAINER_01读取两表且不可转授","steps":["读取表的操作权限是SELECT。","分别对transport.EMPLOYEE、transport.DRIVER授权。","对于新建且没有其他权限来源的TRAINER_01，不带WITH GRANT OPTION。"],"check":"只读范围包含两表，未增加INSERT或UPDATE。","pitfall":"省略GRANT OPTION仅在没有其他传播权限来源时满足不可转授，不能普遍忽略旧授权。","code":"```sql\nGRANT SELECT ON transport.EMPLOYEE\nTO 'USER_A'@'localhost';\n\nGRANT SELECT ON transport.DRIVER\nTO 'USER_A'@'localhost';\n```"},{"number":"3","goal":"授予USER_B插入两表并允许转授","steps":["插入行使用INSERT privilege，不需要授全部权限。","分别定位transport.TRIP、transport.TRIPLEG。","每条GRANT加WITH GRANT OPTION，允许继续授予相同范围权限。"],"check":"两个目标表都有INSERT及转授权能力。","pitfall":"WITH ADMIN OPTION针对role成员资格，不替代对象的GRANT OPTION。","code":"```sql\nGRANT INSERT ON transport.TRIP\nTO 'USER_B'@'localhost'\nWITH GRANT OPTION;\n\nGRANT INSERT ON transport.TRIPLEG\nTO 'USER_B'@'localhost'\nWITH GRANT OPTION;\n```"},{"number":"4","goal":"授予TRAINER_01数据库范围的UPDATE","steps":["原文写csit115数据库，保留这个名字，不擅自换成transport。","ON csit115.*表示该数据库内所有表。","只授UPDATE，且不增加WITH GRANT OPTION。"],"check":"权限范围是数据库，不是全服务器*.*。","pitfall":"把root的密码csit115与本小题数据库名混为一个概念会读错范围。","code":"```sql\nGRANT UPDATE ON csit115.*\nTO 'USER_A'@'localhost';\n```"},{"number":"5","goal":"通过view开放司机行程总数","steps":["从DRIVER左连接TRIP，才能保留零行程司机。","按司机的ENUM、LNUM分组，COUNT(T.TNUM)让未匹配者得到0。","由root创建SQL SECURITY DEFINER view，再只授USER_B该view的SELECT。"],"check":"零次司机为0；USER_B不必取得底表直接读取权。","pitfall":"COUNT(*)会把outer join补出的行也算成1。","code":"```sql\nCREATE SQL SECURITY DEFINER VIEW transport.DRIVER_TRIP_TOTAL AS\nSELECT D.ENUM,\n       D.LNUM,\n       COUNT(T.TNUM) AS TOTAL_TRIPS\nFROM transport.DRIVER AS D\nLEFT JOIN transport.TRIP AS T\n    ON T.LNUM = D.LNUM\nGROUP BY D.ENUM, D.LNUM;\n\nGRANT SELECT ON transport.DRIVER_TRIP_TOTAL\nTO 'USER_B'@'localhost';\n```"}],"tags":["CREATE/ALTER/DROP USER and database management","Database/table/column scopes and GRANT OPTION","Views for restricted rows/columns and summaries"],"questionHTML":"\u003cp>Assume that a user root with a password &#39;[ROOT_OR_USER_PASSWORD]&#39; created a database called transport and the user executed CREATE TABLE statements given on page 2 of the examination paper to create the relational tables in the database transport.\u003c/p>\n\u003cp>Write the implementations of the operations listed below as a user root. Assume that a user root has already connected to the database. Note, that implementation of some operations may need more than one SQL statement.\u003c/p>\n\u003cp>(1) A user root nominates a database transport as a default database and then the user creates two new users USER_A and USER_B.\u003c/p>\n\u003cp>(2) A user root grants the read access rights to the relational tables EMPLOYEE and DRIVER to a user USER_A. The read access rights cannot be propagated to other roles or users.\u003c/p>\n\u003cp>(3) A user root grants the rights to insert the rows into a relational tables TRIP and TRIPLEG to a user USER_B. The access rights can be propagated to other roles or users.\u003c/p>\n\u003cp>(4) A user root grants the update privilege on all relational tables in csit115 database to a user USER_A. The privilege cannot be propagated to other roles or users.\u003c/p>\n\u003cp>(5) A user root grants the rights to information about the total number trips performed by each driver to a user USER_B.\u003c/p>\n","answerHTML":"\u003ch3>(1) 选定数据库并创建用户\u003c/h3>\n\u003cp>root 已经连接，无需再次登录。这里统一使用 localhost 账号。题目没有指定 USER_A、USER_B 的密码，因此示例没有把 root 的密码当成他们的密码。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">USE transport;\n\nCREATE USER &#39;USER_A&#39;@&#39;localhost&#39;;\nCREATE USER &#39;USER_B&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n\u003ch3>(2) 授予TRAINER_01两张表的读取权限\u003c/h3>\n\u003cp>读取对应 SELECT。对于题中刚创建、没有其他授权来源的账号，不加 WITH GRANT OPTION，表示没有授予转授权能力。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">GRANT SELECT ON transport.EMPLOYEE\nTO &#39;USER_A&#39;@&#39;localhost&#39;;\n\nGRANT SELECT ON transport.DRIVER\nTO &#39;USER_A&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n\u003ch3>(3) 授予USER_B插入权限，并允许转授权\u003c/h3>\n\u003cp>INSERT 是插入行的权限。WITH GRANT OPTION 允许 USER_B 把相应权限再授给其他用户或角色。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">GRANT INSERT ON transport.TRIP\nTO &#39;USER_B&#39;@&#39;localhost&#39;\nWITH GRANT OPTION;\n\nGRANT INSERT ON transport.TRIPLEG\nTO &#39;USER_B&#39;@&#39;localhost&#39;\nWITH GRANT OPTION;\n\u003c/code>\u003c/pre>\n\u003ch3>(4) 授予TRAINER_01更新csit115中所有表的权限\u003c/h3>\n\u003cp>原题此处写的是 csit115，不是 transport。答案保留这个数据库名；不能把怀疑的笔误直接改成另一数据库。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">GRANT UPDATE ON csit115.*\nTO &#39;USER_A&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n\u003ch3>(5) 让USER_B读取每位司机的行程总数\u003c/h3>\n\u003cp>先建立汇总视图，再只向 USER_B 授予该视图的 SELECT。LEFT JOIN保留没有行程的司机；COUNT(T.TNUM) 使他们得到0。视图由 root 创建，使用 SQL SECURITY DEFINER，因此无需另外授予 USER_B 底表的直接读取权限。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">CREATE SQL SECURITY DEFINER VIEW transport.DRIVER_TRIP_TOTAL AS\nSELECT D.ENUM,\n       D.LNUM,\n       COUNT(T.TNUM) AS TOTAL_TRIPS\nFROM transport.DRIVER AS D\nLEFT JOIN transport.TRIP AS T\n    ON T.LNUM = D.LNUM\nGROUP BY D.ENUM, D.LNUM;\n\nGRANT SELECT ON transport.DRIVER_TRIP_TOTAL\nTO &#39;USER_B&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"},{"id":"M1-Q6","title":"Mock Examination 1 — Question 6","topic":"查找行程次数超过100的卡车","areas":["DDL/DML"],"source":"mock-1","sourceLabel":"Mock Examination 1","sourceNote":"User-provided Questions 1–6 and Question 2 image","origin":"Original material","priority":"core","question":"Assume, that we would like to verify the following logical consistency constraint imposed on the contents of a sample database.\n\n\"A truck cannot be used for more that 100 trips\"\n\nWrite SQL statements that perform the following actions.\n\n(1) First, create a relational table MESSAGE with information about the contents of a sample database that violate the following consistency constraint listed above. A relational table MESSAGE must consist of two columns. The first column contains truck registration numbers and the second column contains the total number of trips for all trucks that have been used for more than 100 trips.\n\n(2) Next, list the contents of a relational table MESSAGE in the following way.\n\nTruck \u003cinsert ruck registration number here> has been used for \u003cinsert total number of trips here> trips.\n\nFor example, if a truck with registration number PKR856 has been used 120 times then the following line must be listed.\n\nTruck PKR856 has been used for 120 trips.\n\n(3) Next, make the contents of a relational table MESSAGE permanent.\n\n(4) Finally, drop a relational table MESSAGE.","answer":"### (1) 创建两列的MESSAGE表\n\n按注册号统计行程，用 HAVING 保留次数大于100的卡车。恰好100次不违反题目规则。\n\n```sql\nCREATE TABLE MESSAGE AS\nSELECT REGNUM, COUNT(*) AS TOTAL_TRIPS\nFROM TRIP\nGROUP BY REGNUM\nHAVING COUNT(*) > 100;\n```\n\n### (2) 拼出要求的英文句子\n\nCONCAT 把固定文字、注册号和次数连接成一个字符串。\n\n```sql\nSELECT CONCAT(\n           'Truck ', REGNUM,\n           ' has been used for ', TOTAL_TRIPS,\n           ' trips.'\n       ) AS MESSAGE_TEXT\nFROM MESSAGE;\n```\n\n### 输出格式示例\n\n这里展示的是题目给定的示例，不是编造数据库实际查询结果。\n\n```text\nTruck PKR856 has been used for 120 trips.\n```\n\n### (3) 提交修改\n\n题目的“永久保存”对应 COMMIT。MySQL 中普通 CREATE TABLE ... AS SELECT 已可能发生隐式提交，因此这一步不一定还有待提交内容；仍按题目步骤列出 COMMIT。\n\n```sql\nCOMMIT;\n```\n\n### (4) 删除MESSAGE表\n\nDROP TABLE 删除表及数据。先前 COMMIT 不会阻止之后删表。MESSAGE 是创建时的检查结果，不会自动随以后行程记录变化。\n\n```sql\nDROP TABLE MESSAGE;\n```","context":"transport","canonical":null,"parts":[{"number":"1","goal":"创建只包含违规卡车的两列快照表","steps":["按TRIP.REGNUM分组，对行程计数，不连接路段表。","HAVING COUNT(*)>100筛选违规组，100恰好不违规。","CREATE TABLE MESSAGE AS SELECT只选REGNUM和次数别名，保持两列。"],"check":"表结构恰好两列；满足规则的卡车不在MESSAGE中。","pitfall":"WHERE不能直接筛选分组后的COUNT，>=100又会多报边界。","code":"```sql\nCREATE TABLE MESSAGE AS\nSELECT REGNUM, COUNT(*) AS TOTAL_TRIPS\nFROM TRIP\nGROUP BY REGNUM\nHAVING COUNT(*) > 100;\n```"},{"number":"2","goal":"按要求构造一列英文消息","steps":["从已经建立的MESSAGE读REGNUM与TOTAL_TRIPS。","CONCAT拼接固定文字、注册号和次数。","保留空格和末尾句号，使输出与题目示例一致。"],"check":"示例应为Truck PKR856 has been used for 120 trips.。","pitfall":"不是SELECT三个分开的列，也不需要修改数据库里的注册号。","code":"```sql\nSELECT CONCAT(\n           'Truck ', REGNUM,\n           ' has been used for ', TOTAL_TRIPS,\n           ' trips.'\n       ) AS MESSAGE_TEXT\nFROM MESSAGE;\n```"},{"number":"3","goal":"提交未提交修改","steps":["make permanent在事务题中对应COMMIT。","按题目顺序在检查输出之后列出COMMIT。","说明MySQL普通CTAS有隐式提交，不能把此COMMIT描述成它首次永久建表的唯一条件。"],"check":"知道题面操作与MySQL implicit commit的区别。","pitfall":"把所有DDL都当成可以由后续ROLLBACK恢复会产生错误。","code":"```sql\nCOMMIT;\n```"},{"number":"4","goal":"最后删除MESSAGE表","steps":["删除整个临时报告结构用DROP TABLE MESSAGE。","这与DELETE全部行不同，后者还保留定义。","之前COMMIT不阻止之后执行DROP；MESSAGE也不会自动追踪后续TRIP改变。"],"check":"DROP完成后表不存在，而不只是表内变空。","pitfall":"把“永久保存”理解成表以后无法删除。","code":"```sql\nDROP TABLE MESSAGE;\n```"}],"tags":["CTAS and INSERT SELECT","TRUNCATE, COMMIT, ROLLBACK and implicit commit"],"questionHTML":"\u003cp>Assume, that we would like to verify the following logical consistency constraint imposed on the contents of a sample database.\u003c/p>\n\u003cp>&quot;A truck cannot be used for more that 100 trips&quot;\u003c/p>\n\u003cp>Write SQL statements that perform the following actions.\u003c/p>\n\u003cp>(1) First, create a relational table MESSAGE with information about the contents of a sample database that violate the following consistency constraint listed above. A relational table MESSAGE must consist of two columns. The first column contains truck registration numbers and the second column contains the total number of trips for all trucks that have been used for more than 100 trips.\u003c/p>\n\u003cp>(2) Next, list the contents of a relational table MESSAGE in the following way.\u003c/p>\n\u003cp>Truck &lt;insert ruck registration number here&gt; has been used for &lt;insert total number of trips here&gt; trips.\u003c/p>\n\u003cp>For example, if a truck with registration number PKR856 has been used 120 times then the following line must be listed.\u003c/p>\n\u003cp>Truck PKR856 has been used for 120 trips.\u003c/p>\n\u003cp>(3) Next, make the contents of a relational table MESSAGE permanent.\u003c/p>\n\u003cp>(4) Finally, drop a relational table MESSAGE.\u003c/p>\n","answerHTML":"\u003ch3>(1) 创建两列的MESSAGE表\u003c/h3>\n\u003cp>按注册号统计行程，用 HAVING 保留次数大于100的卡车。恰好100次不违反题目规则。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">CREATE TABLE MESSAGE AS\nSELECT REGNUM, COUNT(*) AS TOTAL_TRIPS\nFROM TRIP\nGROUP BY REGNUM\nHAVING COUNT(*) &gt; 100;\n\u003c/code>\u003c/pre>\n\u003ch3>(2) 拼出要求的英文句子\u003c/h3>\n\u003cp>CONCAT 把固定文字、注册号和次数连接成一个字符串。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">SELECT CONCAT(\n           &#39;Truck &#39;, REGNUM,\n           &#39; has been used for &#39;, TOTAL_TRIPS,\n           &#39; trips.&#39;\n       ) AS MESSAGE_TEXT\nFROM MESSAGE;\n\u003c/code>\u003c/pre>\n\u003ch3>输出格式示例\u003c/h3>\n\u003cp>这里展示的是题目给定的示例，不是编造数据库实际查询结果。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">Truck PKR856 has been used for 120 trips.\n\u003c/code>\u003c/pre>\n\u003ch3>(3) 提交修改\u003c/h3>\n\u003cp>题目的“永久保存”对应 COMMIT。MySQL 中普通 CREATE TABLE ... AS SELECT 已可能发生隐式提交，因此这一步不一定还有待提交内容；仍按题目步骤列出 COMMIT。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">COMMIT;\n\u003c/code>\u003c/pre>\n\u003ch3>(4) 删除MESSAGE表\u003c/h3>\n\u003cp>DROP TABLE 删除表及数据。先前 COMMIT 不会阻止之后删表。MESSAGE 是创建时的检查结果，不会自动随以后行程记录变化。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">DROP TABLE MESSAGE;\n\u003c/code>\u003c/pre>\n"},{"id":"M2-Q1","title":"Mock Examination 2 — Question 1","topic":"医院概念建模","areas":["Conceptual"],"source":"mock-2","sourceLabel":"Mock Examination 2","sourceNote":"User-provided Questions 1–6; Q3–Q5 text attachments","origin":"Original material","priority":"core","question":"Read and analyse the following specification of a sample database domain.\n\nA description of a hospital consists of a unique hospital name, address of a main building including city, street, and building number, phone and fax numbers, and email address. The phone number, fax number, and email address can also be used for the identification purposes. A hospital consists of a number of buildings. A building number is a local identifier of a building. Some of the buildings have the names, which are unique within a hospital.\n\nA hospital consists of wards and wards consist of decks. Each ward has a unique name and is located in one building. A ward may occupy several levels of a building. A deck is identified by a number unique within a ward and it is located at one level of a building. The database should contain the complete information about the locations of buildings and decks.\n\nA hospital employs the doctors, nurses, administration and maintenance staff members. The employees are described by an employee number unique within a hospital, first name, last name, date of birth and salary. The doctors are additional described by a status and specialization. The nurses are also described by a category. Administration and maintenance staff members are described by a position occupied. The doctors are assigned to the wards and the nurses are assigned to the decks. Additionally, a hospital contracts a number of consultants. The consultants are not assigned to the wards and are employed by a hospital for a limited time only. The consultants are described by first and last name, specialization, phone number, and amount of charge per hour, start and end of contract with a hospital. The consultants can be employed by more than one hospital at a time.\n\nA hospital admits the patients for the treatments. A patient is described by medical insurance company name and insurance policy number. Date and time are recorded on admittance to a hospital. A patient may be admitted to and discharged from a hospital many times. On arrival to a hospital a patient passes through entry physical examinations, which consists of a number of tests. The database should contain information about the names of tests applied and the results of the tests conducted just after arrival to a hospital. When, an illness a patient suffers from is identified he/she is located at a ward and at a deck of a ward.\n\nDesign a conceptual schema for the database domain described above. Use a notation of simplified UML object class diagrams explained during the lecture classes and applied for conceptual modelling in the assignments and class test. Remember to determine the multiplicities of associations, identifiers of classes of objects, multivalued, optional and derived attributes (if any).\n\nThere is NO NEED to provide a detailed analysis how a conceptual schema has been created. The final conceptual schema expressed in a notation of UML simplified classes is completely sufficient.\n\nIt is not allowed to use any artificial identifiers and any attributes that are not mentioned in a specification above.","answer":"本题禁止新增人工编号和题外属性。局部号码要结合所属对象识别，不能当作全数据库唯一号码。\n\n### 先说明原题没有交代清楚的标识问题\n\n原题没有明确指定顾问的唯一属性。本参考设计假设“每位顾问的电话唯一且不共享”，用 phone 识别顾问。若不接受这个假设，原题不足以确定顾问的可靠identifier，不能擅自添加 consultant_id。\n\n还假设：同一顾问与同一医院不会有两份开始时间相同的合同；同一病人在同一医院同一日期和时刻不会产生两次入院。这些是本答案使用现有属性确定自然标识的假设。\n\n### 类、属性和标识方式\n\n| 类 | 应记录的信息 | 标识方式 |\n| --- | --- | --- |\n| HOSPITAL | 名称、电话、传真、邮箱；主楼地址可由主楼关联取得 | 医院名称、电话、传真、邮箱分别可识别医院 |\n| BUILDING | 建筑编号、可选名称、城市、街道 | 所属医院+建筑编号；有名称时，所属医院+建筑名称也可识别 |\n| WARD | 病区名称、占用的楼层列表 | 病区名称；按原文未加局部限定的“唯一名称”理解 |\n| DECK | 分区编号、所在楼层 | 所属病区+分区编号 |\n| EMPLOYEE | 员工号、名、姓、出生日期、薪水 | 所属医院+员工号 |\n| DOCTOR | 继承员工属性；增加状态和专业方向 | 继承员工标识 |\n| NURSE | 继承员工属性；增加类别 | 继承员工标识 |\n| ADMINISTRATION_STAFF | 继承员工属性；增加职位 | 继承员工标识 |\n| MAINTENANCE_STAFF | 继承员工属性；增加职位 | 继承员工标识 |\n| CONSULTANT | 名、姓、专业方向、电话 | phone，仅在上面的电话唯一假设下成立 |\n| CONTRACT | 开始时间、结束时间、每小时收费 | 医院+顾问+合同开始时间，依赖上面的假设 |\n| PATIENT | 保险公司名称、保险单号 | 两项组合 |\n| ADMISSION | 入院日期、时间、可选的已确定疾病，以及各项入院检查和结果 | 病人+医院+入院日期+入院时间，依赖上面的假设 |\n\n检查等多值内容中的名称和对应结果要配对，不能保存为互不对应的两份列表。每小时收费在本设计中属于合同，可表达同一顾问在不同医院有不同收费。\n\n### 组织和人员关联\n\n```mermaid\nclassDiagram\n    direction LR\n    HOSPITAL \"1\" -- \"1..*\" BUILDING : contains_by_building_number\n    HOSPITAL \"0..1\" -- \"1\" BUILDING : main_building\n    BUILDING \"1\" -- \"0..*\" WARD : contains\n    WARD \"1\" -- \"1..*\" DECK : contains_by_deck_number\n    HOSPITAL \"1\" -- \"1..*\" EMPLOYEE : employs_by_employee_number\n    EMPLOYEE \u003c|-- DOCTOR\n    EMPLOYEE \u003c|-- NURSE\n    EMPLOYEE \u003c|-- ADMINISTRATION_STAFF\n    EMPLOYEE \u003c|-- MAINTENANCE_STAFF\n    DOCTOR \"0..*\" -- \"0..*\" WARD : assigned_to\n    NURSE \"0..*\" -- \"0..*\" DECK : assigned_to\n```\n\n病区属于一座建筑；分区属于一个病区。原题没有说明每位医生只能负责一个病区、每位护士只能负责一个分区，因此本图允许many-to-many，且不擅自规定最低分配数。\n\n### 合同和入院关联\n\n```mermaid\nclassDiagram\n    direction LR\n    HOSPITAL \"1\" -- \"0..*\" CONTRACT : contracts\n    CONSULTANT \"1\" -- \"0..*\" CONTRACT : signs\n    HOSPITAL \"1\" -- \"0..*\" ADMISSION : admits\n    PATIENT \"1\" -- \"0..*\" ADMISSION : has\n    ADMISSION \"0..*\" -- \"0..1\" DECK : placed_at\n```\n\n检查结果属于某一次入院，不能只放在病人名下，否则多次入院会混在一起。疾病尚未确定时，入院记录可以暂未分配分区；分配后，病区可由分区所属关系确定。\n\n### 图外还需表达的业务限制\n\n1. 医院的主楼必须属于该医院。\n2. 分区必须位于所属病区所在的建筑；分区楼层属于该病区占用的楼层。\n3. 入院所属医院必须和安置分区所属医院一致。\n4. 合同结束不能早于开始；同一顾问可以同时在不同医院有有效合同。\n5. 顾问不参加医生与病区之间的分配关联。\n\n原文提到了出院，但没有要求记录出院日期或时间。本参考图不额外添加 discharge_time。若要完整的出入院时间历史，需先明确新增业务要求。\n\n图中qualifier的数量解释：整体上，每个HOSPITAL至少有一座BUILDING和一名EMPLOYEE，每个WARD至少有一个DECK；黄色框把building_number、employee_number、deck_number作为局部identifier。固定所属对象与该局部号码后，目标端为0..1。这个0..1不会把医院整体限制为只有一座楼或一名员工。\n","context":"","canonical":null,"parts":[{"number":"1","goal":"建立医院的局部标识、合同与反复入院模型","steps":["从HOSPITAL、BUILDING、WARD、DECK、EMPLOYEE、CONSULTANT、PATIENT七类主对象开始；员工细分四种，另外用CONTRACT、ADMISSION保存具有时间边界的事件。","按作用范围处理identifier：building_number与employee_number要结合医院；deck_number结合病区。病人使用保险公司与保单号的组合。医院电话、传真、邮箱分别是可用的独立标识方式。","每次ADMISSION保存入院date/time、这次检查的名称与结果；同一病人的不同入院不能共用一份检查列表。","把顾问与医院的合同独立表示，收费和起止时间按合同记录。顾问可以同时为多家医院工作，不把它加入医生的病区分配关联。","用BUILDING地址和DECK楼层确定位置；主楼属于本医院，病人分配的分区也必须属于入院医院。疾病未确定时允许暂未安置。","顾问唯一属性、合同开始时间组合及入院时间组合在原题未充分声明唯一性。把使用phone等自然标识的假设明确列出；不新建consultant_id或admission_id。"],"check":"最终UML类框里有全部attributes/IDs，局部identifier通过qualifier表达；同一次入院的检查和位置不串到其他事件。","pitfall":"不能用人工ID掩盖题目信息不足，也不能把未记录的discharge_time当成必需属性。","code":""}],"tags":["Classes, attributes and identifiers","Composite and alternative identifiers","Multivalued, optional and derived attributes","Association attributes and repeated events","Local identifiers and qualifiers"],"questionHTML":"\u003cp>Read and analyse the following specification of a sample database domain.\u003c/p>\n\u003cp>A description of a hospital consists of a unique hospital name, address of a main building including city, street, and building number, phone and fax numbers, and email address. The phone number, fax number, and email address can also be used for the identification purposes. A hospital consists of a number of buildings. A building number is a local identifier of a building. Some of the buildings have the names, which are unique within a hospital.\u003c/p>\n\u003cp>A hospital consists of wards and wards consist of decks. Each ward has a unique name and is located in one building. A ward may occupy several levels of a building. A deck is identified by a number unique within a ward and it is located at one level of a building. The database should contain the complete information about the locations of buildings and decks.\u003c/p>\n\u003cp>A hospital employs the doctors, nurses, administration and maintenance staff members. The employees are described by an employee number unique within a hospital, first name, last name, date of birth and salary. The doctors are additional described by a status and specialization. The nurses are also described by a category. Administration and maintenance staff members are described by a position occupied. The doctors are assigned to the wards and the nurses are assigned to the decks. Additionally, a hospital contracts a number of consultants. The consultants are not assigned to the wards and are employed by a hospital for a limited time only. The consultants are described by first and last name, specialization, phone number, and amount of charge per hour, start and end of contract with a hospital. The consultants can be employed by more than one hospital at a time.\u003c/p>\n\u003cp>A hospital admits the patients for the treatments. A patient is described by medical insurance company name and insurance policy number. Date and time are recorded on admittance to a hospital. A patient may be admitted to and discharged from a hospital many times. On arrival to a hospital a patient passes through entry physical examinations, which consists of a number of tests. The database should contain information about the names of tests applied and the results of the tests conducted just after arrival to a hospital. When, an illness a patient suffers from is identified he/she is located at a ward and at a deck of a ward.\u003c/p>\n\u003cp>Design a conceptual schema for the database domain described above. Use a notation of simplified UML object class diagrams explained during the lecture classes and applied for conceptual modelling in the assignments and class test. Remember to determine the multiplicities of associations, identifiers of classes of objects, multivalued, optional and derived attributes (if any).\u003c/p>\n\u003cp>There is NO NEED to provide a detailed analysis how a conceptual schema has been created. The final conceptual schema expressed in a notation of UML simplified classes is completely sufficient.\u003c/p>\n\u003cp>It is not allowed to use any artificial identifiers and any attributes that are not mentioned in a specification above.\u003c/p>\n","answerHTML":"\u003cp>本题禁止新增人工编号和题外属性。局部号码要结合所属对象识别，不能当作全数据库唯一号码。\u003c/p>\n\u003ch3>先说明原题没有交代清楚的标识问题\u003c/h3>\n\u003cp>原题没有明确指定顾问的唯一属性。本参考设计假设“每位顾问的电话唯一且不共享”，用 phone 识别顾问。若不接受这个假设，原题不足以确定顾问的可靠identifier，不能擅自添加 consultant_id。\u003c/p>\n\u003cp>还假设：同一顾问与同一医院不会有两份开始时间相同的合同；同一病人在同一医院同一日期和时刻不会产生两次入院。这些是本答案使用现有属性确定自然标识的假设。\u003c/p>\n\u003ch3>类、属性和标识方式\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>类\u003c/th>\n\u003cth>应记录的信息\u003c/th>\n\u003cth>标识方式\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>HOSPITAL\u003c/td>\n\u003ctd>名称、电话、传真、邮箱；主楼地址可由主楼关联取得\u003c/td>\n\u003ctd>医院名称、电话、传真、邮箱分别可识别医院\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>BUILDING\u003c/td>\n\u003ctd>建筑编号、可选名称、城市、街道\u003c/td>\n\u003ctd>所属医院+建筑编号；有名称时，所属医院+建筑名称也可识别\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>WARD\u003c/td>\n\u003ctd>病区名称、占用的楼层列表\u003c/td>\n\u003ctd>病区名称；按原文未加局部限定的“唯一名称”理解\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DECK\u003c/td>\n\u003ctd>分区编号、所在楼层\u003c/td>\n\u003ctd>所属病区+分区编号\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EMPLOYEE\u003c/td>\n\u003ctd>员工号、名、姓、出生日期、薪水\u003c/td>\n\u003ctd>所属医院+员工号\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOCTOR\u003c/td>\n\u003ctd>继承员工属性；增加状态和专业方向\u003c/td>\n\u003ctd>继承员工标识\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>NURSE\u003c/td>\n\u003ctd>继承员工属性；增加类别\u003c/td>\n\u003ctd>继承员工标识\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADMINISTRATION_STAFF\u003c/td>\n\u003ctd>继承员工属性；增加职位\u003c/td>\n\u003ctd>继承员工标识\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MAINTENANCE_STAFF\u003c/td>\n\u003ctd>继承员工属性；增加职位\u003c/td>\n\u003ctd>继承员工标识\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CONSULTANT\u003c/td>\n\u003ctd>名、姓、专业方向、电话\u003c/td>\n\u003ctd>phone，仅在上面的电话唯一假设下成立\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CONTRACT\u003c/td>\n\u003ctd>开始时间、结束时间、每小时收费\u003c/td>\n\u003ctd>医院+顾问+合同开始时间，依赖上面的假设\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PATIENT\u003c/td>\n\u003ctd>保险公司名称、保险单号\u003c/td>\n\u003ctd>两项组合\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADMISSION\u003c/td>\n\u003ctd>入院日期、时间、可选的已确定疾病，以及各项入院检查和结果\u003c/td>\n\u003ctd>病人+医院+入院日期+入院时间，依赖上面的假设\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>检查等多值内容中的名称和对应结果要配对，不能保存为互不对应的两份列表。每小时收费在本设计中属于合同，可表达同一顾问在不同医院有不同收费。\u003c/p>\n\u003ch3>组织和人员关联\u003c/h3>\n\u003cfigure class=\"diagram\">\u003cdiv class=\"diagram-scroll\">\n\n\u003c!-- Generated by graphviz version 14.1.3 (20260303.0454)\n -->\n\u003c!-- Title: G Pages: 1 -->\n\u003cp>\u003csvg width=\"1572pt\" height=\"668pt\"\n viewBox=\"0.00 0.00 1572.00 668.00\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n\u003cg id=\"g2-graph0\" class=\"graph\" transform=\"scale(1 1) rotate(0) translate(28.8 639.2)\">\u003c/p>\n\u003ctitle>G\u003c/
