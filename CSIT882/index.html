ubjects. A subject has one or two academic members assigned and a number of tutors. An academic staff member and tutor can be assigned to many subjects. Support staff members are assigned to the degrees. Each support staff member is assigned to one degree and a degree has one or more support staff members assigned.\n\nThe university is divided into faculties and faculties are divided into schools. Academic staff members and tutors belong to one school and each school consists of many academic staff members and tutors. The faculties and schools are described by the unique names.\n\nDraw a conceptual schema for the specification of a database domain listed above.","context":"","canonical":null,"parts":[{"number":"1","goal":"从大学业务说明生成完整conceptual schema","steps":["先分对象种类：Degree、Subject、Employee、Faculty、School；再分Degree的三个子类、Employee的三个子类。不要因为文字提到学生，就新增没有描述要求的Student类。","逐项读唯一性：Subject的code与title分别唯一；Employee除employee_number外，还有(first_name,last_name,date_of_birth)这个组合identifier。把三个姓名/日期属性标成同一个ID标签。","把requirements、learning objectives表示为multivalued attributes；支持人员的qualification和acquired_date要成对，避免两个列表无法一一对应。","每条association分别向两个方向读：一门科目有1–2名academic staff；一位academic staff可负责多门。Support staff恰属于一个Degree，Degree至少对应一位Support staff。","将已确定的attributes、identifiers、multiplicities填进类框和关联线。a number of等未给精确下限的措辞，采用假设时单独标明，不把假设写成题面事实。"],"check":"图中必须既有属性，也有连接和数量；code、title两种独立identifier与员工三项组合identifier没有混淆。","pitfall":"不要用关系表的foreign keys代替conceptual association，也不要把员工已获学位限制为必须来自本校。","mainType":"conceptual","knowledge":["entity","identifier","multiplicity","association","generalization","multivalue"],"taskBrief":"把业务说明中的对象、属性、唯一性和数量画成完整概念图。","input":"英文题面和给定图／FD","output":"从大学业务说明生成完整conceptual schema","examTips":["图中必须既有属性，也有连接和数量；code、title两种独立identifier与员工三项组合identifier没有混淆。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不要用关系表的foreign keys代替conceptual association，也不要把员工已获学位限制为必须来自本校。"],"tables":[],"knowledgeUses":{"entity":"图中必须既有属性，也有连接和数量；code、title两种独立identifier与员工三项 ext>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"443.06\" y=\"-237.28\" font-family=\"Arial\" font-size=\"10.00\">1..*\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"365.85\" y=\"-228.12\" font-family=\"Arial\" font-size=\"10.00\">1\u003c/text>\n\u003c/g>\n\u003c!-- SCHOOL&#45;&gt;TUTOR -->\n\u003cg id=\"g1-edge6\" class=\"edge\">\n\u003ctitle>SCHOOL&#45;&gt;TUTOR\u003c/title>\n\u003cpath fill=\"none\" stroke=\"#52695d\" d=\"M343.19,-268.24C378.45,-275.21 425.53,-284.51 465.72,-292.45\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"396.4\" y=\"-283.25\" font-family=\"Arial\" font-size=\"10.00\">has\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"438.53\" y=\"-296.14\" font-family=\"Arial\" font-size=\"10.00\">1..*\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"370.38\" y=\"-258.55\" font-family=\"Arial\" font-size=\"10.00\">1\u003c/text>\n\u003c/g>\n\u003c/g>\n\u003c/svg>\n\u003c/div>\u003cfigcaption>同一个ID标签表示组合identifier；不同ID标签表示独立identifier。空心箭头指向父类。 [0..1]可选，[*]多值，/表示derived attribute。\u003c/figcaption>\u003cbutton class=\"zoom\" type=\"button\">放大图\u003c/button>\u003c/figure>"}],"tags":["Classes, attributes and identifiers","Composite and alternative identifiers","Multiplicities and role directions","Generalization and subtype properties"],"legacyPriority":"core","level":"A","archived":false,"originType":"Official Mock Exam","mainType":"conceptual","related":["M3-Q1"],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"阅读并分析以下数据库领域说明。\n\n一所大学希望建立数据库，记录它的部分活动。大学向学生开设多种Degree（学位课程）。每个Degree有唯一名称、完成该Degree所需的总学分，以及未来学生必须满足的若干入学要求。\n\n大学提供三类Degree：Undergraduate Degree（本科学位）、Postgraduate Degree（研究生学位）和Graduate Certificate（研究生证书）。只有已经取得本科学位的学生，才可以申请Postgraduate Degree。每个Postgraduate Degree的说明中列有可接受的本科学位。Graduate Certificate的说明中列有专业工作经验年数要求。\n\n每个Degree包含一组Subject（科目）。每个Subject有唯一code、唯一title、学分值，以及一组learning objectives（学习目标）。code与title分别唯一。\n\n大学雇用Academic Staff、Tutor和Support Staff。每位Employee记录唯一employee number、first name、last name和date of birth。first name、last name与date of birth的组合也能唯一识别Employee。Academic Staff与Tutor还记录已经取得的academic degree。Support Staff记录过去获得的每项qualification，以及该项qualification的取得日期。\n\n大学把Academic Staff和Tutor分配到Subject。每个Subject分配一至两位Academic Staff，以及若干Tutor。一位Academic Staff或Tutor可分配到多个Subject。Support Staff分配到Degree：每位Support Staff恰好对应一个Degree，每个Degree至少对应一位Support Staff。\n\n大学分为Faculty，Faculty再分为School。每位Academic Staff和Tutor属于一个School；每个School有多位Academic Staff和Tutor。Faculty与School都用各自唯一名称描述。\n\n为上述领域绘制conceptual schema（概念模式）。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["entity","identifier","multiplicity","association","generalization","multivalue"],"types":["conceptual"],"requiredSkills":["Class / attribute / 对象类别与属性","Identifier / 唯一标识","Multiplicity / 关联两端的数量范围","Many-to-many / association attribute / 多对多与关联属性","Generalization / inheritance / 泛化与继承","Multivalued / optional / derived / 多值、可选与可计算属性"],"questionHTML":"\u003cp>Read and analyse the following specification of a sample database domain.\u003c/p>\n\u003cp>A University would like to create a database to record information about some of its activities. The university offers a number of degrees to students. A degree is described by a unique name, total number of credit points required to complete a degree, and several requirements that must be satisfied by the future students. The university offers three types of degrees: undergraduate degrees, postgraduate degrees, and graduate certificate. Postgraduate degrees are available only for the students who already got an undergraduate degree. A description of a postgraduate degree includes a list of acceptable undergraduate degrees. A description of a graduate certificate includes a requirement on the total number of years of professional experience.\u003c/p>\n\u003cp>Each degree consists of a collection of subjects. A description of a subject consists of its unique code, unique title, total number of credits points a subject is worth, and a list of subject learning objectives.\u003c/p>\n\u003cp>The university employs academic staff members, tutors and support staff members. A description of a university employee consists of a unique employee number, first name last name and date of birth. First name, last name and date of birth uniquely identified each employee. Additionally, academic staff members and tutors are described by an academic degree achieved. Support staff members are described by a list of qualifications acquired in the past together with a date when each qualification has been acquired.\u003c/p>\n\u003cp>The university assigns the academic staff members and tutors to the subjects. A subject has one or two academic members assigned and a number of tutors. An academic staff member and tutor can be assigned to many subjects. Support staff members are assigned to the degrees. Each support staff member is assigned to one degree and a degree has one or more support staff members assigned.\u003c/p>\n\u003cp>The university is divided into faculties and faculties are divided into schools. Academic staff members and tutors belong to one school and each school consists of many academic staff members and tutors. The faculties and schools are described by the unique names.\u003c/p>\n\u003cp>Draw a conceptual schema for the specification of a database domain listed above.\u003c/p>\n","translationHTML":"\u003cp>阅读并分析以下数据库领域说明。\u003c/p>\n\u003cp>一所大学希望建立数据库，记录它的部分活动。大学向学生开设多种Degree（学位课程）。每个Degree有唯一名称、完成该Degree所需的总学分，以及未来学生必须满足的若干入学要求。\u003c/p>\n\u003cp>大学提供三类Degree：Undergraduate Degree（本科学位）、Postgraduate Degree（研究生学位）和Graduate Certificate（研究生证书）。只有已经取得本科学位的学生，才可以申请Postgraduate Degree。每个Postgraduate Degree的说明中列有可接受的本科学位。Graduate Certificate的说明中列有专业工作经验年数要求。\u003c/p>\n\u003cp>每个Degree包含一组Subject（科目）。每个Subject有唯一code、唯一title、学分值，以及一组learning objectives（学习目标）。code与title分别唯一。\u003c/p>\n\u003cp>大学雇用Academic Staff、Tutor和Support Staff。每位Employee记录唯一employee number、first name、last name和date of birth。first name、last name与date of birth的组合也能唯一识别Employee。Academic Staff与Tutor还记录已经取得的academic degree。Support Staff记录过去获得的每项qualification，以及该项qualification的取得日期。\u003c/p>\n\u003cp>大学把Academic Staff和Tutor分配到Subject。每个Subject分配一至两位Academic Staff，以及若干Tutor。一位Academic Staff或Tutor可分配到多个Subject。Support Staff分配到Degree：每位Support Staff恰好对应一个Degree，每个Degree至少对应一位Support Staff。\u003c/p>\n\u003cp>大学分为Faculty，Faculty再分为School。每位Academic Staff和Tutor属于一个School；每个School有多位Academic Staff和Tutor。Faculty与School都用各自唯一名称描述。\u003c/p>\n\u003cp>为上述领域绘制conceptual schema（概念模式）。\u003c/p>\n"},{"id":"M1-Q2","title":"Mock Examination 1 — Question 2","topic":"运输服务逻辑设计","areas":["Logical"],"source":"mock-1","sourceLabel":"Mock Examination 1","sourceNote":"User-provided Questions 1–6 and Question 2 image","origin":"Original material","priority":"A","question":"Consider a conceptual schema given below.\n\n![Original conceptual schema](assets/mock-1-q2.jpg)\n\nYour task is to perform a step of logical database design, i.e. to transform a conceptual schema given above into a collection of relational schemas.\n\nFor each relational schema clearly list the names of attributes, primary key, candidate keys (if any), and foreign keys (if any). Assume, that a superset method must be used to implement a generalization.","context":"","canonical":null,"parts":[{"number":"1","goal":"按superset method把运输服务图转换成relational schemas","steps":["TSERVICE的三个ID属性合起来才识别一项服务；先抄完整组合(departure_city,destination_city,departure_time)，后续所有引用都使用这三项。","先建立不引用其他表的BUS与DRIVER。DRIVER的dlnumber、enumber分别唯一：选其中一个为primary key，另一个保留为candidate key。","把较长与较短服务合入TSERVICE，增加service_type。total_days与total_hours是子类专有属性，在整表需要允许NULL，并按类别填写。","BUS到TSERVICE是一对多，把rego放入TSERVICE作foreign key；TSERVICE到DRIVER是many-to-many，建立SERVICE_DRIVER保存完整配对。","STOP受服务和snumber共同限定，所以primary key是服务三项标识再加snumber；STOP本身的到离时间与服务时间要区分命名。","用课堂PRIMARY KEY =、CANDIDATE KEY =、FOREIGN KEY = ... REFERENCES ...格式列出，父表先于子表。检查minimum participation不能仅靠foreign key保证的限制。"],"check":"最终有BUS、DRIVER、TSERVICE、SERVICE_DRIVER、STOP五个schemas；STOP每个key含4项。","pitfall":"0..1针对固定(service,snumber)，不是整项服务最多一个STOP。","mainType":"logical","knowledge":["keys","qualifier","association","superset"],"taskBrief":"把图中每一种特征转换成关系模式，并完整列出键和引用。","input":"英文题面和给定图／FD","output":"按superset method把运输服务图转换成relational schemas","examTips":["最终有BUS、DRIVER、TSERVICE、SERVICE_DRIVER、STOP五个schemas；STOP每个key含4项。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["0..1针对固定(service,snumber)，不是整项服务最多一个STOP。"],"tables":[],"knowledgeUses":{"keys":"最终有BUS、DRIVER、TSERVICE、SERVICE_DRIVER、STOP五个schemas；STOP每个key含4项。","qualifier":"最终有BUS、DRIVER、TSERVICE、SERVICE_DRIVER、STOP五个schemas；STOP每个key含4项。","association":"最终有BUS、DRIVER、TSERVICE、SERVICE_DRIVER、STOP五个schemas；STOP每个key含4项。","superset":"最终有BUS、DRIVER、TSERVICE、SERVICE_DRIVER、STOP五个schemas；STOP每个key含4项。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先写不依赖其他schema的父关系及其完整标识。","分别处理多对多、多值、qualifier与关联属性；引用复合标识不能漏列。","按题目要求使用superset，最后检查父表先于子表及全部键。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-text\">(departure_city, destination_city, departure_time)\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-text\">BUS(rego, make)\nPRIMARY KEY = (rego)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = none\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-text\">DRIVER(dlnumber, enumber, full_name)\nPRIMARY KEY = (dlnumber)\nCANDIDATE KEY1 = (enumber)\nFOREIGN KEY1 = none\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-text\">TSERVICE(\n    departure_city,\n    destination_city,\n    departure_time,\n    arrival_time,\n    rego,\n    service_type,\n    total_days,\n    total_hours\n)\n\nPRIMARY KEY = (departure_city, destination_city, departure_time)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (rego) REFERENCES BUS(rego)\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-text\">SERVICE_DRIVER(\n    departure_city,\n    destination_city,\n    departure_time,\n    dlnumber\n)\n\nPRIMARY KEY = (departure_city, destination_city, departure_time, dlnumber)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (departure_city, destination_city, departure_time)\n     REFERENCES TSERVICE(departure_city, destination_city, departure_time)\nFOREIGN KEY2 = (dlnumber) REFERENCES DRIVER(dlnumber)\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-text\">STOP(\n    service_departure_city,\n    service_destination_city,\n    service_departure_time,\n    snumber,\n    stop_city,\n    departure_time,\n    arrival_time\n)\n\nPRIMARY KEY = (\n    service_departure_city,\n    service_destination_city,\n    service_departure_time,\n    snumber\n)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (service_departure_city, service_destination_city, service_departure_time)\n    REFERENCES TSERVICE(departure_city, destination_city, departure_time)\n\u003c/code>\u003c/pre>\n\u003cp>Use the complete composite identifier in every reference. Minimum participation constraints are not guaranteed by foreign keys alone. In a superset table, a nullable subtype identifier is a conditional UNIQUE constraint rather than a non-null candidate key for every row.\u003c/p>\n\u003cp>Use every column of the full composite identifier in foreign keys. Minimum participation needs additional enforcement. Subtype-only nullable UNIQUE values are not candidate keys for all rows.\u003c/p>\n"}],"tags":["Primary, candidate and composite foreign keys","Many-to-many and association attributes","Qualified association transformation","Superset method","Parent-before-child and classroom schema format"],"legacyPriority":"core","level":"A","archived":false,"originType":"Official Mock Exam","mainType":"logical","related":["M3-Q2"],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"根据上面的conceptual schema进行logical database design：把图转换成一组relational schemas（关系模式）。\n\n对每个relational schema，清楚列出attributes、primary key、其他candidate keys（如有）以及foreign keys（如有）。generalization（泛化）必须使用superset method（超集法）实现。","imageGlossary":"**图中文字对照（仅翻译，不作转换提示）**：LONGER TSERVICE 较长运输服务；SHORTER TSERVICE 较短运输服务；TSERVICE 运输服务；BUS 巴士；DRIVER 司机；STOP 停靠点。total-days 总天数；total-hours 总小时数；rego 注册号；make 品牌；departure-city 出发城市；destination-city 目的城市；departure-time 出发时间；arrival time/arrival-time 到达时间；dlnumber 驾照号；enumber 员工号；full-name 全名；snumber 停靠序号。Assigned-to 分配给；Passes-through 途经。ID identifier；ID1、ID2 为不同identifier；1 恰好一个；* 多个（可为零）；1..* 一个或多个；0..1 零个或一个。三角空心箭头为 generalization（泛化）符号。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["keys","qualifier","association","superset"],"types":["logical"],"requiredSkills":["Primary / candidate / foreign key / 主键、候选键与外键","Qualified association / 用局部值限定的关联","Many-to-many / association attribute / 多对多与关联属性","Superset method / 超集法实现泛化"],"questionHTML":"\u003cp>Consider a conceptual schema given below.\u003c/p>\n\u003cp>\u003cimg src=\"assets/mock-1-q2.jpg\" alt=\"Original conceptual schema\">\u003c/p>\n\u003cp>Your task is to perform a step of logical database design, i.e. to transform a conceptual schema given above into a collection of relational schemas.\u003c/p>\n\u003cp>For each relational schema clearly list the names of attributes, primary key, candidate keys (if any), and foreign keys (if any). Assume, that a superset method must be used to implement a generalization.\u003c/p>\n","translationHTML":"\u003cp>根据上面的conceptual schema进行logical database design：把图转换成一组relational schemas（关系模式）。\u003c/p>\n\u003cp>对每个relational schema，清楚列出attributes、primary key、其他candidate keys（如有）以及foreign keys（如有）。generalization（泛化）必须使用superset method（超集法）实现。\u003c/p>\n\u003cdetails>\u003csummary>图中文字逐项对照\u003c/summary>\u003cp>\u003cstrong>图中文字对照（仅翻译，不作转换提示）\u003c/strong>：LONGER TSERVICE 较长运输服务；SHORTER TSERVICE 较短运输服务；TSERVICE 运输服务；BUS 巴士；DRIVER 司机；STOP 停靠点。total-days 总天数；total-hours 总小时数；rego 注册号；make 品牌；departure-city 出发城市；destination-city 目的城市；departure-time 出发时间；arrival time/arrival-time 到达时间；dlnumber 驾照号；enumber 员工号；full-name 全名；snumber 停靠序号。Assigned-to 分配给；Passes-through 途经。ID identifier；ID1、ID2 为不同identifier；1 恰好一个；* 多个（可为零）；1..* 一个或多个；0..1 零个或一个。三角空心箭头为 generalization（泛化）符号。\u003c/p>\n\u003c/details>"},{"id":"M1-Q3","title":"Mock Examination 1 — Question 3","topic":"运输数据库：SELECT 查询","areas":["SELECT"],"source":"mock-1","sourceLabel":"Mock Examination 1","sourceNote":"User-provided Questions 1–6 and Question 2 image","origin":"Original material","priority":"A","question":"Write SELECT statements that implement the following queries.\n\n(1) Find the registration numbers of trucks, that have capacity in a range between 100 inclusive and 500 inclusive.\n\n(2) Find the first and the last names of all drivers who are on leave.\n\n(3) Find the registration numbers of all trucks that have not been used for any trips.\n\n(4) Find the registration numbers of all trucks together with total number of trips the trucks have been used for. There is no need to include the truck that have not been used for any trips.\n\n(5) Find the names of all departure cities together with the names of all destination cities.","context":"transport","canonical":null,"parts":[{"number":"1","goal":"返回容量区间内卡车的注册号","steps":["输出只有注册号REGNUM，数据来自TRUCK，不需要连接其他表。","inclusive要求100、500都包含，使用CAPACITY BETWEEN 100 AND 500。","核对CREATE TABLE中的CAPACITY CHECK；若小于100的约束生效，此查询合法但没有匹配行。"],"check":"WHERE条件包含两个边界；有空结果时先核对约束，不修改题目数值。","pitfall":"不要把CAPACITY换成WEIGHT来“修复”原题冲突。","mainType":"fundamentals","knowledge":["projection","filter","range"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Transport schema与题面条件","output":"返回容量区间内卡车的注册号","examTips":["WHERE条件包含两个边界；有空结果时先核对约束，不修改题目数值。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不要把CAPACITY换成WEIGHT来“修复”原题冲突。"],"tables":["TRUCK"],"knowledgeUses":{"projection":"本小题输出：返回容量区间内卡车的注册号","filter":"WHERE条件包含两个边界；有空结果时先核对约束，不修改题目数值。","range":"WHERE条件包含两个边界；有空结果时先核对约束，不修改题目数值。"},"sq  REGNUM, COUNT(*) AS TOTAL_TRIPS\nFROM TRIP\nGROUP BY REGNUM;\n\u003c/code>\u003c/pre>\n"},{"number":"5","goal":"明确城市查询的结果形状，再选择SQL","steps":["先区分两种可能：一列“所有城市名称”，或者两列“出发城市—目的城市配对”。原句未明确这一点。","若要求合成一列名单，分别SELECT DEPARTURE、DESTINATION，用UNION合并去重。","若要求配对，则SELECT DISTINCT DEPARTURE, DESTINATION，保留同一条路段上的配对关系。"],"check":"核对输出列数以及是否保留城市配对；两种答案不能称为含义相同。","pitfall":"不要不说明结果形状就把两条SQL当作完全可互换的写法。","mainType":"fundamentals","knowledge":["projection","union","distinct"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Transport schema与题面条件","output":"明确城市查询的结果形状，再选择SQL","examTips":["核对输出列数以及是否保留城市配对；两种答案不能称为含义相同。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不要不说明结果形状就把两条SQL当作完全可互换的写法。"],"tables":["TRIPLEG"],"knowledgeUses":{"projection":"本小题输出：明确城市查询的结果形状，再选择SQL","union":"核对输出列数以及是否保留城市配对；两种答案不能称为含义相同。","distinct":"核对输出列数以及是否保留城市配对；两种答案不能称为含义相同。"},"sqlPlan":[{"label":"选表／对象","text":"TRIPLEG"},{"label":"连接与层次","text":"按题目指定形式区分内外层查询。"},{"label":"筛选、分组与输出","text":"核对输出列数以及是否保留城市配对；两种答案不能称为含义相同。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT DEPARTURE AS CITY\nFROM TRIPLEG\nUNION\nSELECT DESTINATION AS CITY\nFROM TRIPLEG;\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-sql\">SELECT DISTINCT DEPARTURE, DESTINATION\nFROM TRIPLEG;\n\u003c/code>\u003c/pre>\n"}],"tags":["Projection, filters, Boolean conditions and sorting","GROUP BY and HAVING","UNION, duplicates, intersection and difference","Nested queries, EXISTS and anti-joins"],"legacyPriority":"core","level":"A","archived":false,"originType":"Official Mock Exam","mainType":"fundamentals","related":["M3-Q3"],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"编写SELECT语句完成以下查询。所需CREATE TABLE语句在本题的共享schema中。\n\n(1) 找出capacity在100至500之间、包含两个边界的Truck，输出REGNUM。\n\n(2) 找出所有状态为ON LEAVE的Driver，输出first name与last name。\n\n(3) 找出从未用于任何Trip的Truck，输出REGNUM。\n\n(4) 对每辆用于过Trip的Truck，输出REGNUM及Trip总数。无需包含从未用于Trip的Truck。\n\n(5) 找出所有departure city的名称，以及所有destination city的名称。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["projection","filter","range","join","nested","exists","count","group","union","distinct"],"types":["fundamentals","joins","nested","aggregate"],"requiredSkills":["SELECT / projection / 选择输出列","WHERE / predicate / 逐行筛选条件","BETWEEN / date range / 区间筛选","JOIN / join condition / 连接及连接条件","Nested query / 嵌套查询","EXISTS / NOT EXISTS / 存在与不存在","COUNT / grain / 计数与计数单位","GROUP BY / aggregate / 分组与聚合","UNION / UNION ALL / 合并结果集","DISTINCT / 删除重复结果行"],"questionHTML":"\u003cp>Write SELECT statements that implement the following queries.\u003c/p>\n\u003cp>(1) Find the registration numbers of trucks, that have capacity in a range between 100 inclusive and 500 inclusive.\u003c/p>\n\u003cp>(2) Find the first and the last names of all drivers who are on leave.\u003c/p>\n\u003cp>(3) Find the registration numbers of all trucks that have not been used for any trips.\u003c/p>\n\u003cp>(4) Find the registration numbers of all trucks together with total number of trips the trucks have been used for. There is no need to include the truck that have not been used for any trips.\u003c/p>\n\u003cp>(5) Find the names of all departure cities together with the names of all destination cities.\u003c/p>\n","translationHTML":"\u003cp>编写SELECT语句完成以下查询。所需CREATE TABLE语句在本题的共享schema中。\u003c/p>\n\u003cp>(1) 找出capacity在100至500之间、包含两个边界的Truck，输出REGNUM。\u003c/p>\n\u003cp>(2) 找出所有状态为ON LEAVE的Driver，输出first name与last name。\u003c/p>\n\u003cp>(3) 找出从未用于任何Trip的Truck，输出REGNUM。\u003c/p>\n\u003cp>(4) 对每辆用于过Trip的Truck，输出REGNUM及Trip总数。无需包含从未用于Trip的Truck。\u003c/p>\n\u003cp>(5) 找出所有departure city的名称，以及所有destination city的名称。\u003c/p>\n"},{"id":"M1-Q4","title":"Mock Examination 1 — Question 4","topic":"司机技能与行程记录的修改","areas":["DDL/DML"],"source":"mock-1","sourceLabel":"Mock Examination 1","sourceNote":"User-provided Questions 1–6 and Question 2 image","origin":"Original material","priority":"A","question":"Write SQL statements that implement the following structural modifications of a database and data manipulations on the contents of a database. Note, that implementation of some of the tasks listed below may need more than one SQL statement.\n\n(1) We would like to add to a database information about the skills possessed by each driver. Assume, that a driver has many skills and a skill can be possessed by many drivers. It may happen that some skills are not possessed by any driver. The types of the new columns are up to you.\n\n(2) Delete from a database information about the second and third leg of a trip 36.\n\n(3) Change a date of trip number 26 to the next day after the present date of trip 26.\n\n(4) Assume that a trip number 25 has 3 legs. A trip number 25 started in Sydney and it ended in Perth. Add one more leg to a trip 25 such that after update the trip ends in the same city it started from.\n\n(5) Assume that a trip 20 has 2 legs and that a destination of the first leg is Sydney. Update information about a trip 20 such that after update a destination of the first leg is Perth.","context":"transport","canonical":null,"parts":[{"number":"1","goal":"用结构表达司机与技能的many-to-many关系","steps":["技能可能没有任何司机拥有，因此SKILL必须能独立存一行。","DRIVER_SKILL每行保存一个司机与技能配对，两个foreign keys分别引用DRIVER和SKILL。","把(ENUM,SKILL_CODE)作为composite primary key，防止重复拥有关系。若还要求每司机至少一项技能，说明这不是普通foreign key自动保证的。"],"check":"可以只插入SKILL而没有DRIVER_SKILL；配对的两端必须真实存在。","pitfall":"不要把多个技能用逗号塞进DRIVER的一列，也不要只建配对表而丢失无人拥有的技能。","mainType":"ddl-dml","knowledge":["keys","constraints","types"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"共享Transport schema与题面条件","output":"用结构表达司机与技能的many-to-many关系","examTips":["可以只插入SKILL而没有DRIVER_SKILL；配对的两端必须真实存在。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不要把多个技能用逗号塞进DRIVER的一列，也不要只建配对表而丢失无人拥有的技能。"],"tables":["SKILL" hema。\n\n(1) 增加Driver所拥有的Skill信息。一个Driver拥有多项Skill，一项Skill可由多个Driver拥有。某些Skill也可能尚未由任何Driver拥有。新增列的类型自行选择。\n\n(2) 删除Trip 36中第2段与第3段的信息。\n\n(3) 把Trip 26的日期改成它当前所存日期的后一天。\n\n(4) 已知Trip 25有3段，从Sydney出发、在Perth结束。再增加一段，使更新后的Trip回到最初出发的城市。\n\n(5) 已知Trip 20有2段，第1段目的地为Sydney。更新Trip 20，使第1段目的地变成Perth。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["keys","constraints","types","filter","dml"],"types":["ddl-dml"],"requiredSkills":["Primary / candidate / foreign key / 主键、候选键与外键","CHECK / UNIQUE / NOT NULL / 值限制、唯一与必填","DECIMAL(p,s) / 精确数值的位数","WHERE / predicate / 逐行筛选条件","INSERT / UPDATE / DELETE / 增加、修改和删除行"],"questionHTML":"\u003cp>Write SQL statements that implement the following structural modifications of a database and data manipulations on the contents of a database. Note, that implementation of some of the tasks listed below may need more than one SQL statement.\u003c/p>\n\u003cp>(1) We would like to add to a database information about the skills possessed by each driver. Assume, that a driver has many skills and a skill can be possessed by many drivers. It may happen that some skills are not possessed by any driver. The types of the new columns are up to you.\u003c/p>\n\u003cp>(2) Delete from a database information about the second and third leg of a trip 36.\u003c/p>\n\u003cp>(3) Change a date of trip number 26 to the next day after the present date of trip 26.\u003c/p>\n\u003cp>(4) Assume that a trip number 25 has 3 legs. A trip number 25 started in Sydney and it ended in Perth. Add one more leg to a trip 25 such that after update the trip ends in the same city it started from.\u003c/p>\n\u003cp>(5) Assume that a trip 20 has 2 legs and that a destination of the first leg is Sydney. Update information about a trip 20 such that after update a destination of the first leg is Perth.\u003c/p>\n","translationHTML":"\u003cp>编写SQL完成下列结构修改和数据操作。部分小题可能需要不止一条SQL语句。使用本题给出的Transport schema。\u003c/p>\n\u003cp>(1) 增加Driver所拥有的Skill信息。一个Driver拥有多项Skill，一项Skill可由多个Driver拥有。某些Skill也可能尚未由任何Driver拥有。新增列的类型自行选择。\u003c/p>\n\u003cp>(2) 删除Trip 36中第2段与第3段的信息。\u003c/p>\n\u003cp>(3) 把Trip 26的日期改成它当前所存日期的后一天。\u003c/p>\n\u003cp>(4) 已知Trip 25有3段，从Sydney出发、在Perth结束。再增加一段，使更新后的Trip回到最初出发的城市。\u003c/p>\n\u003cp>(5) 已知Trip 20有2段，第1段目的地为Sydney。更新Trip 20，使第1段目的地变成Perth。\u003c/p>\n"},{"id":"M1-Q5","title":"Mock Examination 1 — Question 5","topic":"USER_A / USER_B 用户与权限","areas":["Access"],"source":"mock-1","sourceLabel":"Mock Examination 1","sourceNote":"User-provided Questions 1–6 and Question 2 image Public edition: example names, contact details and password literals anonymized.","origin":"Original material","priority":"A","question":"Assume that a user root with a password '[ROOT_OR_USER_PASSWORD]' created a database called transport and the user executed CREATE TABLE statements given on page 2 of the examination paper to create the relational tables in the database transport.\n\nWrite the implementations of the operations listed below as a user root. Assume that a user root has already connected to the database. Note, that implementation of some operations may need more than one SQL statement.\n\n(1) A user root nominates a database transport as a default database and then the user creates two new users USER_A and USER_B.\n\n(2) A user root grants the read access rights to the relational tables EMPLOYEE and DRIVER to a user USER_A. The read access rights cannot be propagated to other roles or users.\n\n(3) A user root grants the rights to insert the rows into a relational tables TRIP and TRIPLEG to a user USER_B. The access rights can be propagated to other roles or users.\n\n(4) A user root grants the update privilege on all relational tables in csit115 database to a user USER_A. The privilege cannot be propagated to other roles or users.\n\n(5) A user root grants the rights to information about the total number trips performed by each driver to a user USER_B.","context":"transport","canonical":null,"parts":[{"number":"1","goal":"设定默认数据库并创建两名用户","steps":["root已连接，直接USE transport，无需再次写登录命令。","统一约定TRAINER_01、USER_B为localhost账号，避免后续GRANT引用不同host。","CREATE USER各执行一次；题目只给了root密码，不把它自动分配给新用户。"],"check":"USE先于依赖默认数据库的操作；新用户名称/host前后一致。","pitfall":"数据库用户名root与操作系统root不是一回事。","mainType":"access","knowledge":["user","source"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"共享Transport schema与题面条件","output":"设定默认数据库并创建两名用户","examTips":["USE先于依赖默认数据库的操作；新用户名称/host前后一致。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["数据库用户名root与操作系统root不是一回事。"],"tables":[],"knowledgeUses":{"user":"USE先于依赖默认数据库的操作；新用户名称/host前后一致。","source":"USE先于依赖默认数据库的操作；新用户名称/host前后一致。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">USE transport;\n\nCREATE USER &#39;USER_A&#39;@&#39;localhost&#39;;\nCREATE USER &#39;USER_B&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"授予TRAINER_01读取两表且不可转授","steps":["读取表的操作权限是SELECT。","分别对transport.EMPLOYEE、transport.DRIVER授权。","对于新建且没有其他权限来源的TRAINER_01，不带WITH GRANT OPTION。"],"check":"只读范围包含两表，未增加INSERT或UPDATE。","pitfall":"省略GRANT OPTION仅在没有其他传播权限来源时满足不可转授，不能普遍忽略旧授权。","mainType":"access","knowledge":["grant","grantoption"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"共享Transport schema与题面条件","output":"授予TRAINER_01读取两表且不可转授","examTips":["只读范围包含两表，未增加INSERT或UPDATE。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["省略GRANT OPTION仅在没有其他传播权限来源时满足不可转授，不能普遍忽略旧授权。"],"tables":[],"knowledgeUses":{"grant":"只读范围包含两表，未增加INSERT或UPDATE。","grantoption":"只读范围包含两表，未增加INSERT或UPDATE。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">GRANT SELECT ON transport.EMPLOYEE\nTO &#39;USER_A&#39;@&#39;localhost&#39;;\n\nGRANT SELECT ON transport.DRIVER\nTO &#39;USER_A&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"授予USER_B插入两表并允许转授","steps":["插入行使用INSERT privilege，不需要授全部权限。","分别定位transport.TRIP、transport.TRIPLEG。","每条GRANT加WITH GRANT OPTION，允许继续授予相同范围权限。"],"check":"两个目标表都有INSERT及转授权能力。","pitfall":"WITH ADMIN OPTION针对role成员资格，不替代对象的GRANT OPTION。","mainType":"access","knowledge":["dml","grant","grantoption"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"共享Transport schema与题面条件","output":"授予USER_B插入两表并允许转授","examTips":["两个目标表都有INSERT及转授权能力。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["WITH ADMIN OPTION针对role成员资格，不替代对象的GRANT OPTION。"],"tables":[],"knowledgeUses":{"dml":"两个目标表都有INSERT及转授权能力。","grant":"两个目标表都有INSERT及转授权能力。","grantoption":"两个目标表都有INSERT及转授权能力。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">GRANT INSERT ON transport.TRIP\nTO &#39;USER_B&#39;@&#39;localhost&#39;\nWITH GRANT OPTION;\n\nGRANT INSERT ON transport.TRIPLEG\nTO &#39;USER_B&#39;@&#39;localhost&#39;\nWITH GRANT OPTION;\n\u003c/code>\u003c/pre>\n"},{"number":"4","goal":"授予TRAINER_01数据库范围的UPDATE","steps":["原文写csit115数据库，保留这个名字，不擅自换成transport。","ON csit115.*表示该数据库内所有表。","只授UPDATE，且不增加WITH GRANT OPTION。"],"check":"权限范围是数据库，不是全服务器*.*。","pitfall":"把root的密码csit115与本小题数据库名混为一个概念会读错范围。","mainType":"access","knowledge":["dml","grant","grantoption"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"共享Transport schema与题面条件","output":"授予TRAINER_01数据库范围的UPDATE","examTips":["权限范围是数据库，不是全服务器*.*。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["把root的密码csit115与本小题数据库名混为一个概念会读错范围。"],"tables":["ON"],"knowledgeUses":{"dml":"涉及对象／命名中间结果：ON","grant":"权限范围是数据库，不是全服务器*.*。","grantoption":"权限范围是数据库，不是全服务器*.*。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">GRANT UPDATE ON csit115.*\nTO &#39;USER_A&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"},{"number":"5","goal":"通过view开放司机行程总数","steps":["从DRIVER左连接TRIP，才能保留零行程司机。","按司机的ENUM、LNUM分组，COUNT(T.TNUM)让未匹配者得到0。","由root创建SQL SECURITY DEFINER view，再只授USER_B该view的SELECT。"],"check":"零次司机为0；USER_B不必取得底表直接读取权。","pitfall":"COUNT(*)会把outer join补出的行也算成1。","mainType":"access","knowledge":["projection","join","count","grant","grantoption","view","definer","left","group"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"共享Transport schema与题面条件","output":"通过view开放司机行程总数","examTips":["零次司机为0；USER_B不必取得底表直接读取权。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["COUNT(*)会把outer join补出的行也算成1。"],"tables":["transport.DRIVER","transport.TRIP"],"knowledgeUses":{"projection":"本小题输出：通过view开放司机行程总数","join":"涉及对象／命名中间结果：transport.DRIVER, transport.TRIP","count":"零次司机为0；USER_B不必取得底表直接读取权。","grant":"零次司机为0；USER_B不必取得底表直接读取权。","grantoption":"零次司机为0；USER_B不必取得底表直接读取权。","view":"涉及对象／命名中间结果：transport.DRIVER, transport.TRIP","definer":"零次司机为0；USER_B不必取得底表直接读取权。","left":"零次司机为0；USER_B不必取得底表直接读取权。","group":"零次司机为0；USER_B不必取得底表直接读取权。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">CREATE SQL SECURITY DEFINER VIEW transport.DRIVER_TRIP_TOTAL AS\nSELECT D.ENUM,\n       D.LNUM,\n       COUNT(T.TNUM) AS TOTAL_TRIPS\nFROM transport.DRIVER AS D\nLEFT JOIN transport.TRIP AS T\n    ON T.LNUM = D.LNUM\nGROUP BY D.ENUM, D.LNUM;\n\nGRANT SELECT ON transport.DRIVER_TRIP_TOTAL\nTO &#39;USER_B&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"}],"tags":["CREATE/ALTER/DROP USER and database management","Database/table/column scopes and GRANT OPTION","Views for restricted rows/columns and summaries"],"legacyPriority":"core","level":"A","archived":false,"originType":"Official Mock Exam","mainType":"access","related":["M3-Q5"],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"root用户已连接数据库，并已在transport数据库建立题面给出的表。root的密码按英文题面给定。以root身份实现以下操作；部分小题可能需要多条SQL。\n\n(1) 把transport设为默认数据库，然后创建英文题面指定的两个用户。\n\n(2) 向第一个用户授予EMPLOYEE和DRIVER表的读取权限。这些权限不能再授予其他用户或role。\n\n(3) 向第二个用户授予向TRIP和TRIPLEG插入行的权限，并允许它把这些权限再授予其他用户或role。\n\n(4) 向第一个用户授予csit115数据库中所有表的UPDATE权限，不允许转授。\n\n(5) 向第二个用户开放“每位Driver完成的Trip总数”信息。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["user","source","grant","grantoption","dml","projection","join","count","view","definer","left","group"],"types":["access"],"requiredSkills":["CREATE USER / account host / 创建用户及主机范围","USE / SOURCE / client commands / 选库与处理SQL脚本","GRANT / privilege scope / 授予权限与对象范围","WITH GRANT OPTION / 权限转授","INSERT / UPDATE / DELETE / 增加、修改和删除行","SELECT / projection / 选择输出列","JOIN / join condition / 连接及连接条件","COUNT / grain / 计数与计数单位","View / dependency / 视图与依赖","SQL SECURITY DEFINER / 由视图定义者权限读取底表","LEFT JOIN / 保留左侧未匹配行的连接","GROUP BY / aggregate / 分组与聚合"],"questionHTML":"\u003cp>Assume that a user root with a password &#39;[ROOT_OR_USER_PASSWORD]&#39; created a database called transport and the user executed CREATE TABLE statements given on page 2 of the examination paper to create the relational tables in the database transport.\u003c/p>\n\u003cp>Write the implementations of the operations listed below as a user root. Assume that a user root has already connected to the database. Note, that implementation of some operations may need more than one SQL statement.\u003c/p>\n\u003cp>(1) A user root nominates a database transport as a default database and then the user creates two new users USER_A and USER_B.\u003c/p>\n\u003cp>(2) A user root grants the read access rights to the relational tables EMPLOYEE and DRIVER to a user USER_A. The read access rights cannot be propagated to other roles or users.\u003c/p>\n\u003cp>(3) A user root grants the rights to insert the rows into a relational tables TRIP and TRIPLEG to a user USER_B. The access rights can be propagated to other roles or users.\u003c/p>\n\u003cp>(4) A user root grants the update privilege on all relational tables in csit115 database to a user USER_A. The privilege cannot be propagated to other roles or users.\u003c/p>\n\u003cp>(5) A user root grants the rights to information about the total number trips performed by each driver to a user USER_B.\u003c/p>\n","translationHTML":"\u003cp>root用户已连接数据库，并已在transport数据库建立题面给出的表。root的密码按英文题面给定。以root身份实现以下操作；部分小题可能需要多条SQL。\u003c/p>\n\u003cp>(1) 把transport设为默认数据库，然后创建英文题面指定的两个用户。\u003c/p>\n\u003cp>(2) 向第一个用户授予EMPLOYEE和DRIVER表的读取权限。这些权限不能再授予其他用户或role。\u003c/p>\n\u003cp>(3) 向第二个用户授予向TRIP和TRIPLEG插入行的权限，并允许它把这些权限再授予其他用户或role。\u003c/p>\n\u003cp>(4) 向第一个用户授予csit115数据库中所有表的UPDATE权限，不允许转授。\u003c/p>\n\u003cp>(5) 向第二个用户开放“每位Driver完成的Trip总数”信息。\u003c/p>\n"},{"id":"M1-Q6","title":"Mock Examination 1 — Question 6","topic":"查找行程次数超过100的卡车","areas":["DDL/DML"],"source":"mock-1","sourceLabel":"Mock Examination 1","sourceNote":"User-provided Questions 1–6 and Question 2 image","origin":"Original material","priority":"A","question":"Assume, that we would like to verify the following logical consistency constraint imposed on the contents of a sample database.\n\n\"A truck cannot be used for more that 100 trips\"\n\nWrite SQL statements that perform the following actions.\n\n(1) First, create a relational table MESSAGE with information about the contents of a sample database that violate the following consistency constraint listed above. A relational table MESSAGE must consist of two columns. The first column contains truck registration numbers and the second column contains the total number of trips for all trucks that have been used for more than 100 trips.\n\n(2) Next, list the contents of a relational table MESSAGE in the following way.\n\nTruck \u003cinsert ruck registration number here> has been used for \u003cinsert total number of trips here> trips.\n\nFor example, if a truck with registration number PKR856 has been used 120 times then the following line must be listed.\n\nTruck PKR856 has been used for 120 trips.\n\n(3) Next, make the contents of a relational table MESSAGE permanent.\n\n(4) Finally, drop a relational table MESSAGE.","context":"transport","canonical":null,"parts":[{"number":"1","goal":"创建只包含违规卡车的两列快照表","steps":["按TRIP.REGNUM分组，对行程计数，不连接路段表。","HAVING COUNT(*)>100筛选违规组，100恰好不违规。","CREATE TABLE MESSAGE AS SELECT只选REGNUM和次数别名，保持两列。"],"check":"表结构恰好两列；满足规则的卡车不在MESSAGE中。","pitfall":"WHERE不能直接筛选分组后的COUNT，>=100又会多报边界。","mainType":"ddl-dml","knowledge":["projection","count","group","having","keys","constraints"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"共享Transport schema与题面条件","output":"创建只包含违规卡车的两列快照表","examTips":["表结构恰好两列；满足规则的卡车不在MESSAGE中。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["WHERE不能直接筛选分组后的COUNT，>=100又会多报边界。"],"tables":["MESSAGE","TRIP"],"knowledgeUses":{"projection":"本小题输出：创建只包含违规卡车的两列快照表","count":"表结构恰好两列；满足规则的卡车不在MESSAGE中。","group":"表结构恰好两列；满足规则的卡车不在MESSAGE中。","having":"表结构恰好两列；满足规则的卡车不在MESSAGE中。","keys":"涉及对象／命名中间结果：MESSAGE, TRIP","constraints":"表结构恰好两列；满足规则的卡车不在MESSAGE中。"},"sqlPlan":[{"label":"选表／对象","text":"MESSAGE, TRIP"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"表结构恰好两列；满足规则的卡车不在MESSAGE中。"}],"validation":"MESSAGE筛选、100次边界及输出句式已在SQLite内存数据核对；COMMIT及MySQL DDL语义按文档静态复核。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">CREATE TABLE MESSAGE AS\nSELECT REGNUM, COUNT(*) AS TOTAL_TRIPS\nFROM TRIP\nGROUP BY REGNUM\nHAVING COUNT(*) &gt; 100;\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"按要求构造一列英文消息","steps":["从已经建立的MESSAGE读REGNUM与TOTAL_TRIPS。","CONCAT拼接固定文字、注册号和次数。","保留空格和末尾句号，使输出与题目示例一致。"],"check":"示例应为Truck PKR856 has been used for 120 trips.。","pitfall":"不是SELECT三个分开的列，也不需要修改数据库里的注册号。","mainType":"ddl-dml","knowledge":["projection","co at we would like to verify the following logical consistency constraint imposed on the contents of a sample database.\u003c/p>\n\u003cp>&quot;A truck cannot be used for more that 100 trips&quot;\u003c/p>\n\u003cp>Write SQL statements that perform the following actions.\u003c/p>\n\u003cp>(1) First, create a relational table MESSAGE with information about the contents of a sample database that violate the following consistency constraint listed above. A relational table MESSAGE must consist of two columns. The first column contains truck registration numbers and the second column contains the total number of trips for all trucks that have been used for more than 100 trips.\u003c/p>\n\u003cp>(2) Next, list the contents of a relational table MESSAGE in the following way.\u003c/p>\n\u003cp>Truck &lt;insert ruck registration number here&gt; has been used for &lt;insert total number of trips here&gt; trips.\u003c/p>\n\u003cp>For example, if a truck with registration number PKR856 has been used 120 times then the following line must be listed.\u003c/p>\n\u003cp>Truck PKR856 has been used for 120 trips.\u003c/p>\n\u003cp>(3) Next, make the contents of a relational table MESSAGE permanent.\u003c/p>\n\u003cp>(4) Finally, drop a relational table MESSAGE.\u003c/p>\n","translationHTML":"\u003cp>希望检查以下数据库逻辑一致性限制：“一辆Truck不能用于超过100次Trip。”\u003c/p>\n\u003cp>(1) 首先创建MESSAGE表，保存违反该限制的信息。表必须只有两列：Truck的REGNUM，以及该Truck的Trip总数。只保存Trip总数大于100的Truck。\u003c/p>\n\u003cp>(2) 按指定句式显示MESSAGE内容：Truck后接注册号，再接has been used for、次数及trips.。例如Truck PKR856 has been used for 120 trips.。尖括号中的文字是待填值说明，不是要原样输出的内容。\u003c/p>\n\u003cp>(3) 使MESSAGE中的数据成为永久保存的内容，即提交当前事务。\u003c/p>\n\u003cp>(4) 最后删除MESSAGE表。\u003c/p>\n"},{"id":"M2-Q1","title":"Mock Examination 2 — Question 1","topic":"医院概念建模","areas":["Conceptual"],"source":"mock-2","sourceLabel":"Mock Examination 2","sourceNote":"User-provided Questions 1–6; Q3–Q5 text attachments","origin":"Original material","priority":"A","question":"Read and analyse the following specification of a sample database domain.\n\nA description of a hospital consists of a unique hospital name, address of a main building including city, street, and building number, phone and fax numbers, and email address. The phone number, fax number, and email address can also be used for the identification purposes. A hospital consists of a number of buildings. A building number is a local identifier of a building. Some of the buildings have the names, which are unique within a hospital.\n\nA hospital consists of wards and wards consist of decks. Each ward has a unique name and is located in one building. A ward may occupy several levels of a building. A deck is identified by a number unique within a ward and it is located at one level of a building. The database should contain the complete information about the locations of buildings and decks.\n\nA hospital employs the doctors, nurses, administration and maintenance staff members. The employees are described by an employee number unique within a hospital, first name, last name, date of birth and salary. The doctors are additional described by a status and specialization. The nurses are also described by a category. Administration and maintenance staff members are described by a position occupied. The doctors are assigned to the wards and the nurses are assigned to the decks. Additionally, a hospital contracts a number of consultants. The consultants are not assigned to the wards and are employed by a hospital for a limited time only. The consultants are described by first and last name, specialization, phone number, and amount of charge per hour, start and end of contract with a hospital. The consultants can be employed by more than one hospital at a time.\n\nA hospital admits the patients for the treatments. A patient is described by medical insurance company name and insurance policy number. Date and time are recorded on admittance to a hospital. A patient may be admitted to and discharged from a hospital many times. On arrival to a hospital a patient passes through entry physical examinations, which consists of a number of tests. The database should contain information about the names of tests applied and the results of the tests conducted just after arrival to a hospital. When, an illness a patient suffers from is identified he/she is located at a ward and at a deck of a ward.\n\nDesign a conceptual schema for the database domain described above. Use a notation of simplified UML object class diagrams explained during the lecture classes and applied for conceptual modelling in the assignments and class test. Remember to determine the multiplicities of associations, identifiers of classes of objects, multivalued, optional and derived attributes (if any).\n\nThere is NO NEED to provide a detailed analysis how a conceptual schema has been created. The final conceptual schema expressed in a notation of UML simplified classes is completely sufficient.\n\nIt is not allowed to use any artificial identifiers and any attributes that are not mentioned in a specification above.","context":"","canonical":null,"parts":[{"number":"1","goal":"建立医院的局部标识、合同与反复入院模型","steps":["从HOSPITAL、BUILDING、WARD、DECK、EMPLOYEE、CONSULTANT、PATIENT七类主对象开始；员工细分四种，另外用CONTRACT、ADMISSION保存具有时间边界的事件。","按作用范围处理identifier：building_number与employee_number要结合医院；deck_number结合病区。病人使用保险公司与保单号的组合。医院电话、传真、邮箱分别是可用的独立标识方式。","每次ADMISSION保存入院date/time、这次检查的名称与结果；同一病人的不同入院不能共用一份检查列表。","把顾问与医院的合同独立表示，收费和起止时间按合同记录。顾问可以同时为多家医院工作，不把它加入医生的病区分配关联。","用BUILDING地址和DECK楼层确定位置；主楼属于本医院，病人分配的分区也必须属于入院医院。疾病未确定时允许暂未安置。","顾问唯一属性、合同开始时间组合及入院时间组合在原题未充分声明唯一性。把使用phone等自然标识的假设明确列出；不新建consultant_id或admission_id。"],"check":"最终UML类框里有全部attributes/IDs，局部identifier通过qualifier表达；同一次入院的检查和位置不串到其他事件。","pitfall":"不能用人工ID掩盖题目信息不足，也不能把未记录的discharge_time当成必需属性。","mainType":"conceptual","knowledge":["entity","identifier","multiplicity","association","generalization","multivalue","qualifier"],"taskBrief":"把业务说明中的对象、属性、唯一性和数量画成完整概念图。","input":"英文题面和给定图／FD","output":"建立医院的局部标识、合同与反复入院模型","examTips":["最终UML类框里有全部attributes/IDs，局部identifier通过qualifier表达；同一次入院的检查和位置不串到其他事件。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不能用人工ID掩盖题目信息不足，也不能把未记录的discharge_time当成必需属性。"],"tables":[],"knowledgeUses":{"entity":"最终UML类框里有全部attributes/IDs，局部identifier通过qualifier表达；同一次入院的检查和位置不串到其他事件。","identifier":"最终UML类框里有全部attributes/IDs，局部identifier通过qualifier表达；同一次入院的检查和位置不串到其他事件。","multiplicity":"最终UML类框里有全部attributes/IDs，局部identifier通过qualifier表达；同一次入院的检查和位置不串到其他事件。","association":"最终UML类框里有全部attributes/IDs，局部identifier通过qualifier表达；同一次入院的检查和位置不串到其他事件。","generalization":"最终UML类框里有全部attributes/IDs，局部identifier通过qualifier表达；同一次入院的检查和位置不串到其他事件。","multivalue":"最终UML类框里有全部attributes/IDs，局部identifier通过qualifier表达；同一次入院的检查和位置不串到其他事件。","qualifier":"最终UML类框里有全部attributes/IDs，局部identifier通过qualifier表达；同一次入院的检查和位置不串到其他事件。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先找需要单独记录的对象类别，再把属性放回所属类别。","圈出唯一性与局部号码；是否允许新增属性要看原题，不能自行发明标识。","每条关联向两个方向读数量；检查泛化箭头是否指向父类。"],"referenceHTML":"\u003cp>Use natural and local identifiers only. Identify a building by (hospital, building_number), a deck by (ward, deck_number), and an employee by (hospital, employee_number). Patient identification is (insurance_company_name, insurance_policy_number). A phone uniquely identifying a consultant is an explicit assumption, not a stated fact. Also assume that (hospital, consultant, contract_start) and (patient, hospital, admission_date, admission_time) identify their respective events. A main building must belong to its hospital; a deck must lie in its ward&#39;s building and levels; the admission and assigned deck must belong to the same hospital. Admission tests belong to a particular admission. Consultants do not participate in ward assignments.\u003c/p>\n\u003cfigure class=\"diagram\">\u003cdiv class=\"diagram-scroll\">\n\n\u003c!-- Generated by graphviz version 14.1.3 (20260303.0454)\n -->\n\u003c!-- Title: G Pages: 1 -->\n\u003cp>\u003csvg width=\"1  PATIENT -->\n\u003cg id=\"g3-node5\" class=\"node\">\n\u003ctitle>PATIENT\u003c/title>\n\u003cpolygon fill=\"#e6f1ed\" stroke=\"none\" points=\"0,-46.8 0,-79.2 180.76,-79.2 180.76,-46.8 0,-46.8\"/>\n\u003cpolygon fill=\"none\" stroke=\"black\" points=\"0,-46.8 0,-79.2 180.76,-79.2 180.76,-46.8 0,-46.8\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"64.71\" y=\"-60.4\" font-family=\"Arial\" font-weight=\"bold\" font-size=\"12.00\">PATIENT\u003c/text>\n\u003cpolygon fill=\"none\" stroke=\"black\" points=\"0,0 0,-46.8 180.76,-46.8 180.76,0 0,0\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"9\" y=\"-25.8\" font-family=\"Arial\" font-size=\"12.00\">insurance_company_name &#160;ID\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"9\" y=\"-11.4\" font-family=\"Arial\" font-size=\"12.00\">insurance_policy_number &#160;ID\u003c/text>\n\u003c/g>\n\u003c!-- PATIENT&#45;&gt;ADMISSION -->\n\u003cg id=\"g3-edge4\" class=\"edge\">\n\u003ctitle>PATIENT&#45;&gt;ADMISSION\u003c/title>\n\u003cpath fill=\"none\" stroke=\"#52695d\" d=\"M180.38,-51.3C221.09,-56.65 269.49,-63.01 311.4,-68.52\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"246.04\" y=\"-64.86\" font-family=\"Arial\" font-size=\"10.00\">has\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"284.7\" y=\"-73.95\" font-family=\"Arial\" font-size=\"10.00\">0..*\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"207.08\" y=\"-39.87\" font-family=\"Arial\" font-size=\"10.00\">1\u003c/text>\n\u003c/g>\n\u003c/g>\n\u003c/svg>\n\u003c/div>\u003cfigcaption>黄色框是qualifier。固定所属对象和qualifier后，最多匹配一个对象；整体最低数量与自然identifier假设见正文。 [0..1]可选，[*]多值，/表示derived attribute。\u003c/figcaption>\u003cbutton class=\"zoom\" type=\"button\">放大图\u003c/button>\u003c/figure>"}],"tags":["Classes, attributes and identifiers","Composite and alternative identifiers","Multivalued, optional and derived attributes","Association attributes and repeated events","Local identifiers and qualifiers"],"legacyPriority":"core","level":"A","archived":false,"originType":"Official Mock Exam","mainType":"conceptual","related":[],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"阅读并分析以下医院数据库领域说明，并设计conceptual schema。\n\nHospital记录唯一hospital name、主楼地址（city、street和building number）、phone、fax和email。phone、fax和email也分别可用于识别Hospital。一个Hospital有多座Building。building number只在所属Hospital内唯一。部分Building有名称；名称只在该Hospital内唯一。\n\nHospital分为Ward，Ward再分为Deck。每个Ward有唯一名称，并位于一座Building中。一个Ward可以占据该Building的多个楼层。Deck使用在所属Ward内唯一的号码识别，并位于Building的某一层。数据库必须完整记录Building与Deck的位置。\n\nHospital雇用Doctor、Nurse、Administration Staff和Maintenance Staff。Employee记录在该Hospital内唯一的employee number、first name、last name、date of birth和salary。Doctor另外记录status与specialization；Nurse另外记录category；行政及维护人员另外记录position。Doctor分配到Ward，Nurse分配到Deck。\n\nHospital还会按有限期限聘用Consultant。Consultant不分配到Ward。Consultant记录first name、last name、specialization、phone、每小时收费，以及与某Hospital的合同开始／结束时间。同一Consultant可同时被多家Hospital聘用。\n\nHospital接收Patient进行治疗。Patient记录medical insurance company name和insurance policy number。每次入院记录date与time。Patient可以多次入院和出院。每次到院时进行entry physical examination，检查包含若干Test。数据库必须记录该次入院所做Test的名称及结果。确定Patient患有的illness后，将其安置到某Ward及该Ward的某Deck。\n\n使用课堂、作业和测验采用的simplified UML class diagram记法。确定association multiplicities、identifiers，以及multivalued、optional、derived attributes（如有）。只需最终图，不需要详细描述建模过程。\n\n禁止使用artificial identifiers（人工编号），也禁止加入说明中没有提到的attributes。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["entity","identifier","multiplicity","association","generalization","multivalue","qualifier"],"types":["conceptual"],"requiredSkills":["Class / attribute / 对象类别与属性","Identifier / 唯一标识","Multiplicity / 关联两端的数量范围","Many-to-many / association attribute / 多对多与关联属性","Generalization / inheritance / 泛化与继承","Multivalued / optional / derived / 多值、可选与可计算属性","Qualified association / 用局部值限定的关联"],"questionHTML":"\u003cp>Read and analyse the following specification of a sample database domain.\u003c/p>\n\u003cp>A description of a hospital consists of a unique hospital name, address of a main building including city, street, and building number, phone and fax numbers, and email address. The phone number, fax number, and email address can also be used for the identification purposes. A hospital consists of a number of buildings. A building number is a local identifier of a building. Some of the buildings have the names, which are unique within a hospital.\u003c/p>\n\u003cp>A hospital consists of wards and wards consist of decks. Each ward has a unique name and is located in one building. A ward may occupy several levels of a building. A deck is identified by a number unique within a ward and it is located at one level of a building. The database should contain the complete information about the locations of buildings and decks.\u003c/p>\n\u003cp>A hospital employs the doctors, nurses, administration and maintenance staff members. The employees are described by an employee number unique within a hospital, first name, last name, date of birth and salary. The doctors are additional described by a status and specialization. The nurses are also described by a category. Administration and maintenance staff members are described by a position occupied. The doctors are assigned to the wards and the nurses are assigned to the decks. Additionally, a hospital contracts a number of consultants. The consultants are not assigned to the wards and are employed by a hospital for a limited time only. The consultants are described by first and last name, specialization, phone number, and amount of charge per hour, start and end of contract with a hospital. The consultants can be employed by more than one hospital at a time.\u003c/p>\n\u003cp>A hospital admits the patients for the treatments. A patient is described by medical insurance company name and insurance policy number. Date and time are recorded on admittance to a hospital. A patient may be admitted to and discharged from a hospital many times. On arrival to a hospital a patient passes through entry physical examinations, which consists of a number of tests. The database should contain information about the names of tests applied and the results of the tests conducted just after arrival to a hospital. When, an illness a patient suffers from is identified he/she is located at a ward and at a deck of a ward.\u003c/p>\n\u003cp>Design a conceptual schema for the database domain described above. Use a notation of simplified UML object class diagrams explained during the lecture classes and applied for conceptual modelling in the assignments and class test. Remember to determine the multiplicities of associations, identifiers of classes of objects, multivalued, optional and derived attributes (if any).\u003c/p>\n\u003cp>There is NO NEED to provide a detailed analysis how a conceptual schema has been created. The final conceptual schema expressed in a notation of UML simplified classes is completely sufficient.\u003c/p>\n\u003cp>It is not allowed to use any artificial identifiers and any attributes that are not mentioned in a specification above.\u003c/p>\n","translationHTML":"\u003cp>阅读并分析以下医院数据库领域说明，并设计conceptual schema。\u003c/p>\n\u003cp>Hospital记录唯一hospital name、主楼地址（city、street和building number）、phone、fax和email。phone、fax和email也分别可用于识别Hospital。一个Hospital有多座Building。building number只在所属Hospital内唯一。部分Building有名称；名称只在该Hospital内唯一。\u003c/p>\n\u003cp>Hospital分为Ward，Ward再分为Deck。每个Ward有唯一名称，并位于一座Building中。一个Ward可以占据该Building的多个楼层。Deck使用在所属Ward内唯一的号码识别，并位于Building的某一层。数据库必须完整记录Building与Deck的位置。\u003c/p>\n\u003cp>Hospital雇用Doctor、Nurse、Administration Staff和Maintenance Staff。Employee记录在该Hospital内唯一的employee number、first name、last name、date of birth和salary。Doctor另外记录status与specialization；Nurse另外记录category；行政及维护人员另外记录position。Doctor分配到Ward，Nurse分配到Deck。\u003c/p>\n\u003cp>Hospital还会按有限期限聘用Consultant。Consultant不分配到Ward。Consultant记录first name、last name、specialization、phone、每小时收费，以及与某Hospital的合同开始／结束时间。同一Consultant可同时被多家Hospital聘用。\u003c/p>\n\u003cp>Hospital接收Patient进行治疗。Patient记录medical insurance company name和insurance policy number。每次入院记录date与time。Patient可以多次入院和出院。每次到院时进行entry physical examination，检查包含若干Test。数据库必须记录该次入院所做Test的名称及结果。确定Patient患有的illness后，将其安置到某Ward及该Ward的某Deck。\u003c/p>\n\u003cp>使用课堂、作业和测验采用的simplified UML class diagram记法。确定association multiplicities、identifiers，以及multivalued、optional、derived attributes（如有）。只需最终图，不需要详细描述建模过程。\u003c/p>\n\u003cp>禁止使用artificial identifiers（人工编号），也禁止加入说明中没有提到的attributes。\u003c/p>\n"},{"id":"M2-Q2","title":"Mock Examination 2 — Question 2","topic":"航班逻辑设计","areas":["Logical"],"source":"mock-2","sourceLabel":"Mock Examination 2","sourceNote":"User-provided Questions 1–6; Q3–Q5 text attachments","origin":"Original material","priority":"A","question":"Consider a conceptual schema given below.\n\n![Original conceptual schema](assets/mock-2-q2.jpg)\n\nYour task is to perform a step of logical database design, i.e. to transform a conceptual schema given above into a collection of relational schemas. For each relational schema clearly list the names of attributes, primary key, candidate keys (if any), and foreign keys (if any). Assume, that a superset method must be used to implement a generalization.","context":"","canonical":null,"parts":[{"number":"1","goal":"把航班图按superset转换成六个schemas","steps":["FLIGHT用flight_number识别；date是限定符，因此FLIGHT_INSTANCE用(flight_number,flight_date)组合识别。","AIRPLANE单独以registration作primary key；实例中保存registration foreign key。实际出发和到达时间可空，计划时间仍留在FLIGHT。","CREW的airline与employee_number共同标识人员。按superset把PILOT的licence_number放回CREW，用crew_type分类。","licence_number保留非空值唯一；课程格式可列为可选candidate key，但说明它只识别飞行员，不识别无执照号的乘务员行。","STEWARD的qualifications是multivalued，单独建STEWARD_QUALIFICATION。SERVICE_CREW处理实例与机组人员的many-to-many，role属于这次分配。","所有foreign keys都带完整组合；列出父表再列引用表。检查每实例至少一名机组、每乘务员至少一项资格等最低数量没有被普通foreign key自动实现。"],"check":"六表为FLIGHT、AIRPLANE、FLIGHT_INSTANCE、CREW、STEWARD_QUALIFICATION、SERVICE_CREW。","pitfall":"不要给FLIGHT_INSTANCE仅用date作primary key，或把role固定在CREW上。","mainType":"logical","knowledge":["keys","qualifier","association","superset","multivalue"],"taskBrief":"把图中每一种特征转换成关系模式，并完整列出键和引用。","input":"英文题面和给定图／FD","output":"把航班图按superset转换成六个schemas","examTips":["六表为FLIGHT、AIRPLANE、FLIGHT_INSTANCE、CREW、STEWARD_QUALIFICATION、SERVICE_CREW。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不要给FLIGHT_INSTANCE仅用date作primary key，或把role固定在CREW上。"],"tables":[],"knowledgeUses":{"keys":"六表为FLIGHT、AIRPLANE、FLIGHT_INSTANCE、CREW、STEWARD_QUALIFICATION、SERVICE_CREW。","qualifier":"六表为FLIGHT、AIRPLANE、FLIGHT_INSTANCE、CREW、STEWARD_QUALIFICATION、SERVICE_CREW。","association":"六表为FLIGHT、AIRPLANE、FLIGHT_INSTANCE、CREW、STEWARD_QUALIFICATION、SERVICE_CREW。","superset":"六表为FLIGHT、AIRPLANE、FLIGHT_INSTANCE、CREW、STEWARD_QUALIFICATION、SERVICE_CREW。","multivalue":"六表为FLIGHT、AIRPLANE、FLIGHT_INSTANCE、CREW、STEWARD_QUALIFICATION、SERVICE_CREW。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先写不依赖其他schema的父关系及其完整标识。","分别处理多对多、多值、qualifier与关联属性；引用复合标识不能漏列。","按题目要求使用superset，最后检查父表先于子表及全部键。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-text\">FLIGHT(\n    flight_number, origin, destination,\n    planned_departure_time, planned_arrival_time\n)\nPRIMARY KEY = (flight_number)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = none\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-text\">AIRPLANE(registration, type, total_seats)\nPRIMARY KEY = (registration)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = none\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-text\">FLIGHT_INSTANCE(\n    flight_number, flight_date, gate, boarding_time,\n    departure_time, arrival_time, registration\n)\nPRIMARY KEY = (flight_number, flight_date)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (flight_number) REFERENCES FLIGHT(flight_number)\nFOREIGN KEY2 = (registration) REFERENCES AIRPLANE(registration)\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-text\">CREW(\n    airline, employee_number, first_name, last_name,\n    crew_type, licence_number\n)\nPRIMARY KEY = (airline, employee_number)\nOTHER CANDIDATE KEYS = none\nUNIQUE = (licence_number), nullable for STEWARD rows\nFOREIGN KEY1 = none\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-text\">STEWARD_QUALIFICATION(airline, employee_number, qualification)\nPRIMARY KEY = (airline, employee_number, qualification)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (airline, employee_number)\n    REFERENCES CREW(airline, employee_number)\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-text\">SERVICE_CREW(flight_number, flight_date, airline, employee_number, role)\nPRIMARY KEY = (flight_number, flight_date, airline, employee_number)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (flight_number, flight_date)\n     REFERENCES FLIGHT_INSTANCE(flight_number, flight_date)\nFOREIGN KEY2 = (airline, employee_number)\n     REFERENCES CREW(airline, employee_number)\n\u003c/code>\u003c/pre>\n\u003cp>Use the complete composite identifier in every reference. Minimum participation constraints are not guaranteed by foreign keys alone. In a superset table, a nullable subtype identifier is a conditional UNIQUE constraint rather than a non-null candidate key for every row.\u003c/p>\n\u003cp>Use every column of the full composite identifier in foreign keys. Minimum participation needs additional enforcement. Subtype-only nullable UNIQUE values are not candidate keys for all rows.\u003c/p>\n"}],"tags":["Primary, candidate and composite foreign keys","Multivalued attribute transformation","Many-to-many and association attributes","Qualified association transformation","Superset method","Parent-before-child and classroom schema format"],"legacyPriority":"core","level":"A","archived":false,"originType":"Official Mock Exam","mainType":"logical","related":[],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"根据给定的航班conceptual schema，进行logical database design，转换成一组relational schemas。\n\n每个schema需列出attributes、primary key、candidate keys（如有）与foreign keys（如有）。generalization必须使用superset method。","imageGlossary":"**图中文字对照（仅翻译）**：FLIGHT 航班；FLIGHT-INSTANCE 某日的航班实例；AIRPLANE 飞机；CREW 机组人员；PILOT 飞行员；STEWARD 乘务员。flight-number 航班号；origin 始发地；destination 目的地；planned-departure-time 计划起飞时间；planned-arrival-tim（原图拼写）计划到达时间；date 日期；gate 登机口；boarding-time 登机时间；departure-time 实际起飞时间；arrival-time 实际到达时间；registration 注册号；type 类型；total-seats 总座位数；airline 航空公司；employee-number 员工号；first-name 名；last-name 姓；licence-number 执照号；qualifications 资格；role 此次服务的角色。Has 具有；Uses 使用；Services 提供服务。ID identifier；[0..1] 可选单值；[1..*] 至少一个值；* 零到多个；1..* 一个或多个；0..1 零个或一个。虚线框中的 role 是关联属性；空心三角表示泛化。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["keys","qualifier","association","superset","multivalue"],"types":["logical"],"requiredSkills":["Primary / candidate / foreign key / 主键、候选键与外键","Qualified association / 用局部值限定的关联","Many-to-many / association attribute / 多对多与关联属性","Superset method / 超集法实现泛化","Multivalued / optional / derived / 多值、可选与可计算属性"],"questionHTML":"\u003cp>Consider a conceptual schema given below.\u003c/p>\n\u003cp>\u003cimg src=\"assets/mock-2-q2.jpg\" alt=\"Original conceptual schema\">\u003c/p>\n\u003cp>Your task is to perform a step of logical database design, i.e. to transform a conceptual schema given above into a collection of relational schemas. For each relational schema clearly list the names of attributes, primary key, candidate keys (if any), and foreign keys (if any). Assume, that a superset method must be used to implement a generalization.\u003c/p>\n","translationHTML":"\u003cp>根据给定的航班conceptual schema，进行logical database design，转换成一组relational schemas。\u003c/p>\n\u003cp>每个schema需列出attributes、primary key、candidate keys（如有）与foreign keys（如有）。generalization必须使用superset method。\u003c/p>\n\u003cdetails>\u003csummary>图中文字逐项对照\u003c/summary>\u003cp>\u00 d any referential integrity constraints in your implementations\n\n(4) We would like to add to a database information about the total number of bank transactions performed on each bank account. Modify the structures of a sample database in the best possible way. Insert appropriate information into the new structures of a sample database.\n\n(5) Delete from a database information about all bank transactions submitted in a year 2019. Note, that you are not allowed to drop and/or suspend any referential integrity constraints in your implementation.","context":"bank","canonical":null,"parts":[{"number":"1","goal":"每家银行的分行数，含0","steps":["BANK是必须完整保留的集合，从它出发。","LEFT JOIN BRANCH，按bank_name分组。","统计右表非空bank_name，只数真正存在的分行。"],"check":"无分行的银行一行且计数0。","pitfall":"COUNT(*)会错误地把未匹配银行算成1。","mainType":"joins","knowledge":["projection","join","count","left","group"],"taskBrief":"连接相关表；题目要求包含零匹配对象时，明确保留哪一侧。","input":"共享Bank schema与题面条件","output":"每家银行的分行数，含0","examTips":["无分行的银行一行且计数0。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["COUNT(*)会错误地把未匹配银行算成1。"],"tables":["BANK","BRANCH"],"knowledgeUses":{"projection":"本小题输出：每家银行的分行数，含0","join":"涉及对象／命名中间结果：BANK, BRANCH","count":"无分行的银行一行且计数0。","left":"无分行的银行一行且计数0。","group":"无分行的银行一行且计数0。"},"sqlPlan":[{"label":"选表／对象","text":"BANK, BRANCH"},{"label":"连接与层次","text":"使用JOIN并检查完整ON条件；先确定每行的计数单位。"},{"label":"筛选、分组与输出","text":"无分行的银行一行且计数0。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT B.bank_name, COUNT(R.bank_name) AS total_branches\nFROM BANK AS B\nLEFT JOIN BRANCH AS R\n    ON R.bank_name = B.bank_name\nGROUP BY B.bank_name;\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"找2021年无交易账户","steps":["用ACCOUNT作为外层，包括从未有任何交易的账户。","交易匹配同时比较acc_num/account_num和bank_name，避免跨银行同账号串联。","NOT EXISTS内限定时间>=2021-01-01且\u003c2022-01-01，外层取账户号和余额。"],"check":"边界2022年1月1日不算2021交易；其他年份有交易不影响入选。","pitfall":"只比较账号或用tr_date_time\u003c>某一天都会改变问题。","mainType":"nested","knowledge":["projection","filter","nested","exists"],"taskBrief":"用内层查询的结果筛选外层；采用题目规定的嵌套形式。","input":"共享Bank schema与题面条件","output":"找2021年无交易账户","examTips":["边界2022年1月1日不算2021交易；其他年份有交易不影响入选。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["只比较账号或用tr_date_time\u003c>某一天都会改变问题。"],"tables":["ACCOUNT","TRANSACTION"],"knowledgeUses":{"projection":"本小题输出：找2021年无交易账户","filter":"边界2022年1月1日不算2021交易；其他年份有交易不影响入选。","nested":"边界2022年1月1日不算2021交易；其他年份有交易不影响入选。","exists":"边界2022年1月1日不算2021交易；其他年份有交易不影响入选。"},"sqlPlan":[{"label":"选表／对象","text":"ACCOUNT, TRANSACTION"},{"label":"连接与层次","text":"按题目指定形式区分内外层查询。"},{"label":"筛选、分组与输出","text":"边界2022年1月1日不算2021交易；其他年份有交易不影响入选。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT A.account_num, A.balance\nFROM ACCOUNT AS A\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM `TRANSACTION` AS T\n    WHERE T.acc_num = A.account_num\n      AND T.bank_name = A.bank_name\n      AND T.tr_date_time &gt;= &#39;2021-01-01&#39;\n      AND T.tr_date_time &lt;  &#39;2022-01-01&#39;\n);\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"找有员工数未知分行的银行","steps":["“至少一家分行”用EXISTS表达。","关联银行名，筛选BRANCH.total_emps IS NULL。","从外层BANK取银行名和邮箱，一家银行只出现一次。"],"check":"员工数0不等于未知，多家未知分行不重复输出银行。","pitfall":"total_emps = NULL不会得到普通TRUE。","mainType":"nested","knowledge":["projection","filter","nested","null","exists"],"taskBrief":"用内层查询的结果筛选外层；采用题目规定的嵌套形式。","input":"共享Bank schema与题面条件","output":"找有员工数未知分行的银行","examTips":["员工数0不等于未知，多家未知分行不重复输出银行。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["total_emps = NULL不会得到普通TRUE。"],"tables":["BANK","BRANCH"],"knowledgeUses":{"projection":"本小题输出：找有员工数未知分行的银行","filter":"员工数0不等于未知，多家未知分行不重复输出银行。","nested":"员工数0不等于未知，多家未知分行不重复输出银行。","null":"员工数0不等于未知，多家未知分行不重复输出银行。","exists":"员工数0不等于未知，多家未知分行不重复输出银行。"},"sqlPlan":[{"label":"选表／对象","text":"BANK, BRANCH"},{"label":"连接与层次","text":"按题目指定形式区分内外层查询。"},{"label":"筛选、分组与输出","text":"员工数0不等于未知，多家未知分行不重复输出银行。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT B.bank_name, B.email\nFROM BANK AS B\nWHERE EXISTS (\n    SELECT 1\n    FROM BRANCH AS R\n    WHERE R.bank_name = B.bank_name\n      AND R.total_emps IS NULL\n);\n\u003c/code>\u003c/pre>\n"},{"number":"4","goal":"保存并初始化每账户交易数","steps":["按结构修改要求在ACCOUNT加total_transactions，给合适的整数类型及默认0。","对每个账户用完整复合键关联TRANSACTION，相关COUNT(*)在无匹配时返回0。","初始化只反映此时数据；以后新增/删除交易后需重新维护该stored derived value。"],"check":"所有账户有计数，未交易者为0。","pitfall":"建立view是实时计算的另一种设计，不等于本解的新增列并填充。","mainType":"ddl-dml","knowledge":["projection","filter","count","dml","ddl","types","constraints"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"共享Bank schema与题面条件","output":"保存并初始化每账户交易数","examTips":["所有账户有计数，未交易者为0。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["建立view是实时计算的另一种设计，不等于本解的新增列并填充。"],"tables":["ACCOUNT","TRANSACTION"],"knowledgeUses":{"projection":"本小题输出：保存并初始化每账户交易数","filter":"所有账户有计数，未交易者为0。","count":"所有账户有计数，未交易者为0。","dml":"涉及对象／命名中间结果：ACCOUNT, TRANSACTION","ddl":"涉及对象／命名中间结果：ACCOUNT, TRANSACTION","types":"所有账户有计数，未交易者为0。","constraints":"所有账户有计数，未交易者为0。"},"sqlPlan":[{"label":"选表／对象","text":"ACCOUNT, TRANSACTION"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"所有账户有计数，未交易者为0。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">ALTER TABLE ACCOUNT\nADD COLUMN total_transactions BIGINT UNSIGNED NOT NULL DEFAULT 0;\n\nUPDATE ACCOUNT AS A\nSET total_transactions = (\n    SELECT COUNT(*)\n    FROM `TRANSACTION` AS T\n    WHERE T.acc_num = A.account_num\n      AND T.bank_name = A.bank_name\n);\n\u003c/code>\u003c/pre>\n"},{"number":"5","goal":"删除2019年交易","steps":["目标表是交易子表TRANSACTION，不删除其所属账户。","用>=2019-01-01且\u003c2020-01-01覆盖整年所有时间。","直接删除子记录不要求关闭foreign keys；若已保存(4)计数，随后应重算。"],"check":"边界2020年1月1日保留；其他年份不受影响。","pitfall":"删除父账户会误删业务信息，并可能先遇到foreign key限制。","mainType":"ddl-dml","knowledge":["filter","dml","keys"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"共享Bank schema与题面条件","output":"删除2019年交易","examTips":["边界2020年1月1日保留；其他年份不受影响。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["删除父账户会误删业务信息，并可能先遇到foreign key限制。"],"tables":["TRANSACTION"],"knowledgeUses":{"filter":"边界2020年1月1日保留；其他年份不受影响。","dml":"涉及对象／命名中间结果：TRANSACTION","keys":"涉及对象／命名中间结果：TRANSACTION"},"sqlPlan":[{"label":"选表／对象","text":"TRANSACTION"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"边界2020年1月1日保留；其他年份不受影响。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">DELETE FROM `TRANSACTION`\nWHERE tr_date_time &gt;= &#39;2019-01-01&#39;\n  AND tr_date_time &lt;  &#39;2020-01-01&#39;;\n\u003c/code>\u003c/pre>\n"}],"tags":["NULL, empty strings and three-valued logic","JOIN and LEFT/RIGHT/FULL OUTER JOIN","Subquery-driven UPDATE and DELETE"],"legacyPriority":"core","level":"A","archived":false,"originType":"Official Mock Exam","mainType":"joins","related":[],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"根据共享Bank schema完成以下操作。SELECT小题可使用任意实现方法。\n\n(1) 对每家Bank输出bank name及Branch总数。没有Branch的Bank也必须输出，数量为0。\n\n(2) 找出2021年没有任何Transaction的Account，输出account number和balance。\n\n(3) 找出至少有一个Branch的total_emps未知的Bank，输出bank name和email。未知对应NULL。\n\n下面进行结构修改与数据操作，可能需要多条SQL；禁止删除或停用referential integrity constraints。\n\n(4) 在数据库中增加“每个Account已进行的Transaction总数”信息。以合适方式修改结构，并根据现有数据填入正确计数。\n\n(5) 删除2019年提交的所有Transaction。禁止删除或停用referential integrity constraints。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["projection","join","count","left","group","filter","nested","exists","null","dml","ddl","types","constraints","keys"],"types":["joins","nested","ddl-dml"],"requiredSkills":["SELECT / projection / 选择输出列","JOIN / join condition / 连接及连接条件","COUNT / grain / 计数与计数单位","LEFT JOIN / 保留左侧未匹配行的连接","GROUP BY / aggregate / 分组与聚合","WHERE / predicate / 逐行筛选条件","Nested query / 嵌套查询","EXISTS / NOT EXISTS / 存在与不存在","NULL / IS NULL / 未知值及空值判断","INSERT / UPDATE / DELETE / 增加、修改和删除行","ALTER TABLE / 修改表结构","DECIMAL(p,s) / 精确数值的位数","CHECK / UNIQUE / NOT NULL / 值限制、唯一与必填","Primary / candidate / foreign key / 主键、候选键与外键"],"questionHTML":"\u003cp>This question is related to a sample database created through processing of the common CREATE TABLE statements above.\u003c/p>\n\u003cp>Write SELECT statements that implement the following queries. You can use any implementation technique for your SELECT statements.\u003c/p>\n\u003cp>(1) For each bank find the total number of branches owned by a bank. List a bank name and the total number of branches owned by a bank. Assume that some banks do not have any branches yet. In all such cases the total number of branches must be listed as zero (0).\u003c/p>\n\u003cp>(2) For all accounts that have no bank transactions in 2021, find the account numbers and balance on each account. List an account number and balance on each account.\u003c/p>\n\u003cp>(3) Find the names and emails of all banks, that have at least one branch with unknow total number of employees at a branch.\u003c/p>\n\u003cp>Write SQL statements that implement the following structural modifications of a database and data manipulations on the contents of a database. Note, that implementation of some of the tasks listed below may need more than one SQL statement. You are not allowed to drop and/or suspend any referential integrity constraints in your implementations\u003c/p>\n\u003cp>(4) We would like to add to a database information about the total number of bank transactions performed on each bank account. Modify the structures of a sample database in the best possible way. Insert appropriate information into the new structures of a sample database.\u003c/p>\n\u003cp>(5) Delete from a database information about all bank transactions submitted in a year 2019. Note, that you are not allowed to drop and/or suspend any referential integrity constraints in your implementation.\u003c/p>\n","translationHTML":"\u003cp>根据共享Bank schema完成以下操作。SELECT小题可使用任意实现方法。\u003c/p>\n\u003cp>(1) 对每家Bank输出bank name及Branch总数。没有Branch的Bank也必须输出，数量为0。\u003c/p>\n\u003cp>(2) 找出2021年没有任何Transaction的Account，输出account number和balance。\u003c/p>\n\u003cp>(3) 找出至少有一个Branch的total_emps未知的Bank，输出bank name和email。未知对应NULL。\u003c/p>\n\u003cp>下面进行结构修改与数据操作，可能需要多条SQL；禁止删除或停用referential integrity constraints。\u003c/p>\n\u003cp>(4) 在数据库中增加“每个Account已进行的Transaction总数”信息。以合适方式修改结构，并根据现有数据填入正确计数。\u003c/p>\n\u003cp>(5) 删除2019年提交的所有Transaction。禁止删除或停用referential integrity constraints。\u003c/p>\n"},{"id":"M2-Q4","title":"Mock Examination 2 — Question 4","topic":"数据库审计","areas":["扩展"],"source":"mock-2","sourceLabel":"Mock Examination 2","sourceNote":"User-provided Questions 1–6; Q3–Q5 text attachments","origin":"Original material","priority":"A","question":"This question is related to a sample database created through processing of the common CREATE TABLE statements above.\n\nAn objective of this question is to explain how to implement a simple method of auditing the database activities.\n\nAssume, that a database administrator would like to audit the data manipulation statements (INSERT, UPDATE, DELETE) processed by a selected group of users on a selected group of relational tables. Write SQL statements and in the comments provide the comprehensive explanation of a role of SQL statement plays in the implementation of a simple database auditing system.","context":"bank","canonical":null,"parts":[{"number":"1","goal":"说明简单语句日志审计的完整工作流","steps":["先界定审计对象是收到的INSERT/UPDATE/DELETE语句，而非已提交行变化；给出选定用户和表的具体示例。","管理员保存当前general_log与log_output配置，在审计起点启用TABLE输出。","让被审计用户在各自连接中处理操作，结束后记录截止时间并停止写入。不能在root连接冒充这些用户操作。","从mysql.general_log按期间、用户、语句类别、目标表筛选，保存报告并查看。","恢复原设置，说明文本筛选的限制：复杂语句、跨库同名表、prepared statements等可能漏选误选。日志不等同于提交成功证明。"],"check":"每条SQL都有解释，并保留“语句审计”和“触发器行审计”的差别。","pitfall":"触发器对零行修改不触发，回滚也影响行审计，不能宣称它记录所有收到的SQL语句。","mainType":"auditing","knowledge":["audit","grant","projection","filter","dml","keys","order","constraints"],"taskBrief":"编写带作用说明的SQL，记录指定用户对指定表的DML语句。","input":"共享Bank schema与题面条件","output":"说明简单语句日志审计的完整工作流","examTips":["每条SQL都有解释，并保留“语句审计”和“触发器行审计”的差别。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["触发器对零行修改不触发，回滚也影响行审计，不能宣称它记录所有收到的SQL语句。"],"tables":["banks.AUDIT_REPORT","mysql.general_log"],"knowledgeUses":{"audit":"每条SQL都有解释，并保留“语句审计”和“触发器行审计”的差别。","grant":"每条SQL都有解释，并保留“语句审计”和“触发器行审计”的差别。","projection":"本小题输出：说明简单语句日志审计的完整工作流","filter":"每条SQL都有解释，并保留“语句审计”和“触发器行审计”的差别。","dml":"涉及对象／命名中间结果：banks.AUDIT_REPORT, mysql.general_log","keys":"涉及对象／命名中间结果：banks.AUDIT_REPORT, mysql.general_log","order":"每条SQL都有解释，并保留“语句审计”和“触发器行审计”的差别。","constraints":"每条SQL都有解释，并保留“语句审计”和“触发器行审计”的差别。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["明确审计用户、表和时间范围。","语句被日志记录不等于执行成功或已经提交。","逐条注释说明保存设置、启动日志、筛选报告与恢复设置的作用。"],"referenceHTML":"\u003cp>Example assumptions: audit users admin and clerk, tables banks.ACCOUNT and banks.TRANSACTION, ordinary single-table DML, and access only to banks during this window. The users execute in their own connections. This simple text filter is not a general SQL parser.\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- Save the original logging switch for restoration.\n\nSET @old_general_log = @@GLOBAL.general_log;\n\n-- Save the original log output destination.\n\nSET @old_log_output = @@GLOBAL.log_output;\n\n-- Pause log collection before changing or reading the audit setup.\n\nSET GLOBAL general_log = &#39;OFF&#39;;\n\n-- Write the general query log into mysql.general_log for SQL inspection.\n\nSET GLOBAL log_output = &#39;TABLE&#39;;\n\n-- Mark the start of the audit window.\n\nSET @audit_start = NOW(6);\n\n-- Start collecting statements; selected users now execute DML in their own connections.\n\nSET GLOBAL general_log = &#39;ON&#39;;\n\n-- Pause log collection before changing or reading the audit setup.\n\nSET GLOBAL general_log = &#39;OFF&#39;;\n\n-- Mark the end of the audit window.\n\nSET @audit_end = NOW(6);\n\n-- Copy received DML for the selected users, tables and time window into a DBA report.\n\nCREATE TABLE banks.AUDIT_REPORT AS\nSELECT event_time,\n       user_host,\n       thread_id,\n       CONVERT(argument USING utf8mb4) AS statement_text\nFROM mysql.general_log\nWHERE event_time &gt;= @audit_start\n  AND event_time &lt;= @audit_end\n  AND command_type = &#39;Query&#39;\n  AND SUBSTRING_INDEX(user_host, &#39;[&#39;, 1) IN (&#39;admin&#39;, &#39;clerk&#39;)\n  AND REGEXP_LIKE(\n      CONVERT(argument USING utf8mb4),\n      &#39;^[[:space:]]*(INSERT|UPDATE|DELETE)[[:space:]]&#39;, &#39;i&#39;\n  )\n  AND REGEXP_LIKE(\n      CONVERT(argument USING utf8mb4),\n      &#39;(^|[^[:alnum:]_])(ACCOUNT|TRANSACTION)([^[:alnum:]_]|$)&#39;, &#39;i&#39;\n  );\n\n-- Read the report in event order. A logged statement is not proof of successful commit.\n\nSELECT event_time, user_host, thread_id, statement_text\nFROM banks.AUDIT_REPORT\nORDER BY event_time, thread_id;\n\n-- Restore the original logging configuration.\n\nSET GLOBAL log_output = @old_log_output;\n\n-- Restore the original logging configuration.\n\nSET GLOBAL general_log = @old_general_log;\n\u003c/code>\u003c/pre>\n"}],"tags":["Statement auditing and concurrency conditions"],"legacyPriority":"extension","level":"A","archived":false,"originType":"Official Mock Exam","mainType":"au
