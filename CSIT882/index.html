ount","concat","left","group","order","having"],"types":["fundamentals","joins","aggregate"],"requiredSkills":["SELECT / projection / 选择输出列","WHERE / predicate / 逐行筛选条件","BETWEEN / date range / 区间筛选","JOIN / join condition / 连接及连接条件","COUNT / grain / 计数与计数单位","CONCAT / column alias / 合成姓名与输出列别名","LEFT JOIN / 保留左侧未匹配行的连接","GROUP BY / aggregate / 分组与聚合","ORDER BY / 结果排序","HAVING / 聚合后的筛选"],"variantReason":"同方法只改条件／FD；不增加新考试范围。S07四题分别检验四种最高范式，其余每种具体方法仅一题。","questionHTML":"\u003cp>Use the workshop database. These are variants of Assignment 3 Tasks 2–3, not official examination questions.\u003c/p>\n\u003cp>(1) Find workshopNo, title and fee for workshops with a fee between 180.00 and 220.00 inclusive.\n(2) List every participant&#39;s participantNo, fullName and number of COMPLETED enrolments, including zero. Use LEFT JOIN, and order by participantNo. Cancelled enrolments do not count.\n(3) Find workshopNo, title and the number of assigned trainers for workshops with at least two trainers. Use GROUP BY and HAVING. Count trainer assignments, not enrolments.\u003c/p>\n","translationHTML":"\u003cp>使用Workshop数据库。这些是A3-T2／T3的变式，不是教师原题。\u003c/p>\n\u003cp>(1) 找出fee在180.00与220.00之间、包含两端的Workshop，输出workshopNo、title和fee。\u003c/p>\n\u003cp>(2) 每位Participant输出participantNo、fullName及COMPLETED报名总数，包含0。必须使用LEFT JOIN，按participantNo排序。Cancelled不计数。\u003c/p>\n\u003cp>(3) 找出至少分配两位Trainer的Workshop，输出workshopNo、title及Trainer总数。使用GROUP BY和HAVING；数的是Trainer assignments，不是Enrolment。\u003c/p>\n"}],"contexts":{"transport":{"title":"Transport","sql":"CREATE TABLE EMPLOYEE (\n    ENUM DECIMAL(12) NOT NULL,\n    FNAME VARCHAR(50) NOT NULL,\n    LNAME VARCHAR(50) NOT NULL,\n    DOB DATE NULL,\n    CONSTRAINT EMPLOYEE_PKEY PRIMARY KEY (ENUM)\n);\n\nCREATE TABLE DRIVER (\n    ENUM DECIMAL(12) NOT NULL,\n    LNUM DECIMAL(8) NOT NULL,\n    STATUS VARCHAR(10) NOT NULL,\n    CONSTRAINT DRIVER_PKEY PRIMARY KEY (ENUM),\n    CONSTRAINT DRIVER_UNIQUE UNIQUE (LNUM),\n    CONSTRAINT DRIVER_FKEY FOREIGN KEY (ENUM)\n        REFERENCES EMPLOYEE (ENUM),\n    CONSTRAINT DRIVER_STATUS CHECK (\n        STATUS IN ('AVAILABLE', 'BUSY', 'ON LEAVE')\n    )\n);\n\nCREATE TABLE TRUCK (\n    REGNUM VARCHAR(10) NOT NULL,\n    CAPACITY DECIMAL(7) NOT NULL,\n    WEIGHT DECIMAL(7) NOT NULL,\n    STATUS VARCHAR(10) NOT NULL,\n    CONSTRAINT TRUCK_PKEY PRIMARY KEY (REGNUM),\n    CONSTRAINT TRUCK_STATUS CHECK (\n        STATUS IN ('AVAILABLE', 'USED', 'MAINTAINED')\n    ),\n    CONSTRAINT TRUCK_WEIGHT CHECK (WEIGHT > 0.0 AND WEIGHT \u003c 500),\n    CONSTRAINT TRUCK_CAPACITY CHECK (CAPACITY > 0.0 AND CAPACITY \u003c 100)\n);\n\nCREATE TABLE TRIP (\n    TNUM DECIMAL(10) NOT NULL,\n    LNUM DECIMAL(8) NOT NULL,\n    REGNUM VARCHAR(10) NOT NULL,\n    TDATE DATE NOT NULL,\n    CONSTRAINT TRIP_PKEY PRIMARY KEY (TNUM),\n    CONSTRAINT TRIP_CKEY UNIQUE (LNUM, REGNUM, TDATE),\n    CONSTRAINT TRIP_FKEY1 FOREIGN KEY (LNUM)\n        REFERENCES DRIVER (LNUM),\n    CONSTRAINT TRIP_FKEY2 FOREIGN KEY (REGNUM)\n        REFERENCES TRUCK (REGNUM)\n);\n\nCREATE TABLE TRIPLEG (\n    TNUM DECIMAL(10) NOT NULL,\n    LEGNUM DECIMAL(2) NOT NULL,\n    DEPARTURE VARCHAR(30) NOT NULL,\n    DESTINATION VARCHAR(30) NOT NULL,\n    CONSTRAINT TRIPLEG_PKEY PRIMARY KEY (TNUM, LEGNUM),\n    CONSTRAINT TRIPLEG_UNIQUE UNIQUE (TNUM, DEPARTURE, DESTINATION),\n    CONSTRAINT TRIPLEG_FKEY1 FOREIGN KEY (TNUM)\n        REFERENCES TRIP (TNUM)\n);\n"},"bank":{"title":"Bank","sql":"CREATE TABLE BANK(\n bank_name     VARCHAR(50)  NOT NULL,  /* Bank name                                    */\n hq_country    VARCHAR(30)  NOT NULL,  /* Country part of headquarters address         */\n hq_city       VARCHAR(30)  NOT NULL,  /* City part of headquarters address            */\n hq_street     VARCHAR(30)  NOT NULL,  /* Street part of headquarters address          */\n hq_bldg_num   DECIMAL(4)   NOT NULL,  /* Building number part of headquarters address */\n web_site      VARCHAR(200) NOT NULL,  /* Link to Web site                             */\n email         VARCHAR(100) NOT NULL,  /* Email address                                */\n bank_type     VARCHAR(30)      NULL,  /* Bank type                                    */\n  CONSTRAINT BANK_PK PRIMARY KEY (bank_name),\n  CONSTRAINT BANK_CK1 UNIQUE (hq_country, hq_city, hq_street, hq_bldg_num),\n  CONSTRAINT BANK_CK2 UNIQUE (web_site),\n  CONSTRAINT BANK_CK3 UNIQUE (email),\n  CONSTRAINT BANK_CHECK CHECK (bank_type IN ('investment', 'commercial', 'central', 'agriculture', 'construction', 'industrial') ) );\nCREATE TABLE BRANCH(\n  bank_name     VARCHAR(50)  NOT NULL, /* Bank name                                   */\n  br_name       VARCHAR(50)  NOT NULL, /* Branch name                                 */\n  br_country    VARCHAR(30)  NOT NULL, /* Country part of branch address              */\n  br_city       VARCHAR(30)  NOT NULL, /* City part of branch address                 */\n  br_street     VARCHAR(30)  NOT NULL, /* Street part of branch address               */\n  br_bldg_num   DECIMAL(4)   NOT NULL, /* Building number part of branch address      */\n  total_emps    DECIMAL(3)        NULL, /* Total number of employees at a branch      */\n   CONSTRAINT BRANCH_PK PRIMARY KEY (bank_name, br_name, br_country, br_city),\n   CONSTRAINT BRANCH_CK1 UNIQUE (br_country, br_city, br_street, br_bldg_num),\n   CONSTRAINT BRANCH_FK1 FOREIGN KEY (bank_name) REFERENCES BANK(bank_name) );\nCREATE TABLE EMPLOYEE(\n  emp_num       DECIMAL(7)   NOT NULL,  /* Employee number                            */\n  first_name    VARCHAR(20)      NULL, /* Employee first name                         */\n  last_name     VARCHAR(20)  NOT NULL, /* Employee last name                          */\n  date_of_birth DATE         NOT NULL, /* Date of birth                               */\n  position      VARCHAR(100) NOT NULL, /* Position occupied                           */\n  bank_name     VARCHAR(50)  NOT NULL, /* Bank name                                   */\n  br_name       VARCHAR(50)      NULL, /* Branch name                                 */\n  br_country    VARCHAR(30)      NULL, /* Country location of a branch                */\n  br_city       VARCHAR(30)      NULL, /* City location of a branch                   */\n   CONSTRAINT EMPLOYEE_PK PRIMARY KEY (bank_name, emp_num),\n   CONSTRAINT EMPLOYEE_FK1 FOREIGN KEY (bank_name, br_name, br_country, br_city)\n                           REFERENCES BRANCH(bank_name, br_name, br_country, br_city) );\nCREATE TABLE ACCOUNT(\n account_num   DECIMAL(10)  NOT NULL,   /* Account number                             */\n bank_name     VARCHAR(50)  NOT NULL,   /* Bank name                                  */\n balance       DECIMAL(9,2) NOT NULL,   /* Account balance                            */\n account_type  VARCHAR(8)   NOT NULL,   /* Account type: savings, checking, loan      */\n  CONSTRAINT ACCOUNT_PK PRIMARY KEY (account_num, bank_name),\n  CONSTRAINT ACCOUNT_FK1 FOREIGN KEY (bank_name) REFERENCES BANK(bank_name),\n  CONSTRAINT ACCOUNT_CHK1 CHECK( balance >= 0 ),\n  CONSTRAINT ACCOUNT_CHK2 CHECK( account_type IN ('savings','checking','loan') ) );\nCREATE TABLE TRANSACTION(\n acc_num       DECIMAL(10)  NOT NULL,  /* Account number                             */\n bank_name     VARCHAR(50)  NOT NULL,  /* Bank name                                  */\n tr_date_time  DATETIME     NOT NULL,  /* Transaction date                           */\n amount        DECIMAL(7,2) NOT NULL,  /* Amount involved                            */\n type          VARCHAR(10)  NOT NULL,  /* Transaction type                           */\n  CONSTRAINT TRANSACTION_PK PRIMARY KEY(acc_num, bank_name, tr_date_time),\n  CONSTRAINT TRANSACTION_FK2 FOREIGN KEY(acc_num, bank_name) \n                             REFERENCES ACCOUNT(account_num, bank_name),\n  CONSTRAINT TRANSACTION_CHK1 CHECK( amount >= 0 ),\n  CONSTRAINT TRANSACTION_CHK2 CHECK( type IN ('deposit', 'withdrawal' ) ) );\n"},"workshop":{"title":"Professional training workshops","sql":"/* ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ */\n/* Professional Training Workshops - Create database                  */\n/* ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ */\n\nCREATE TABLE Participant (\n    participantNo DECIMAL(6)   NOT NULL,\n    fname         VARCHAR(20)  NOT NULL,\n    lname         VARCHAR(30)  NOT NULL,\n    city          VARCHAR(30)  NOT NULL,\n    state         VARCHAR(20)  NOT NULL,\n    phone         VARCHAR(15)  NOT NULL,\n    email         VARCHAR(80),\n    CONSTRAINT Participant_pkey PRIMARY KEY (participantNo)\n);\n\nCREATE TABLE Qualification (\n    participantNo DECIMAL(6)   NOT NULL,\n    qname         VARCHAR(50)  NOT NULL,\n    qlevel        DECIMAL(1)   NOT NULL,\n    awardYear     DECIMAL(4),\n    CONSTRAINT Qualification_pkey PRIMARY KEY (participantNo, qname),\n    CONSTRAINT Qualification_fkey1 FOREIGN KEY (participantNo)\n        REFERENCES Participant (participantNo)\n);\n\nCREATE TABLE Workshop (\n    workshopNo DECIMAL(6)    NOT NULL,\n    title      VARCHAR(100)  NOT NULL,\n    category   VARCHAR(30)   NOT NULL,\n    `date`     DATE          NOT NULL,\n    fee        DECIMAL(5,2)  NOT NULL,\n    capacity   DECIMAL(4)    NOT NULL,\n    CONSTRAINT Workshop_pkey PRIMARY KEY (workshopNo)\n);\n\nCREATE TABLE Requirement (\n    workshopNo   DECIMAL(6)   NOT NULL,\n    qname        VARCHAR(50)  NOT NULL,\n    requiredLevel DECIMAL(1)  NOT NULL,\n    mandatory    CHAR(1)      NOT NULL,\n    CONSTRAINT Requirement_pkey PRIMARY KEY (workshopNo, qname),\n    CONSTRAINT Requirement_fkey1 FOREIGN KEY (workshopNo)\n        REFERENCES Workshop (workshopNo)\n);\n\nCREATE TABLE Trainer (\n    trainerNo    DECIMAL(6)   NOT NULL,\n    fname        VARCHAR(20)  NOT NULL,\n    lname        VARCHAR(30)  NOT NULL,\n    organisation VARCHAR(80),\n    expertise    VARCHAR(60)  NOT NULL,\n    CONSTRAINT Trainer_pkey PRIMARY KEY (trainerNo)\n);\n\nCREATE TABLE Enrolment (\n    participantNo DECIMAL(6)   NOT NULL,\n    workshopNo    DECIMAL(6)   NOT NULL,\n    enroldate     DATE         NOT NULL,\n    status        VARCHAR(15)  NOT NULL,\n    CONSTRAINT Enrolment_pkey PRIMARY KEY (participantNo, workshopNo),\n    CONSTRAINT Enrolment_fkey1 FOREIGN KEY (participantNo)\n        REFERENCES Participant (participantNo),\n    CONSTRAINT Enrolment_fkey2 FOREIGN KEY (workshopNo)\n        REFERENCES Workshop (workshopNo)\n);\n\nCREATE TABLE WorkshopTrainer (\n    workshopNo DECIMAL(6)    NOT NULL,\n    trainerNo  DECIMAL(6)    NOT NULL,\n    topic      VARCHAR(100)  NOT NULL,\n    CONSTRAINT WorkshopTrainer_pkey PRIMARY KEY (workshopNo, trainerNo),\n    CONSTRAINT WorkshopTrainer_fkey1 FOREIGN KEY (workshopNo)\n        REFERENCES Workshop (workshopNo),\n    CONSTRAINT WorkshopTrainer_fkey2 FOREIGN KEY (trainerNo)\n        REFERENCES Trainer (trainerNo)\n);\n\nCOMMIT;\n/* ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ */\n/* End of script                                                       */\n/* ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ */\n","data":"/* ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ */\n/* Professional Training Workshops - Load database                    */\n/* ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ */\n\nINSERT INTO Participant VALUES\n(1, 'PARTICIPANT_01', 'SAMPLE', 'SYDNEY', 'NSW', 'PHONE_TOKEN_02', 'EMAIL_TOKEN_07'),\n(2, 'PARTICIPANT_02', 'SAMPLE', 'WOLLONGONG', 'NSW', 'PHONE_TOKEN_03', 'EMAIL_TOKEN_10'),\n(3, 'PARTICIPANT_03', 'SAMPLE', 'MELBOURNE', 'VIC', 'PHONE_TOKEN_04', 'EMAIL_TOKEN_14'),\n(4, 'PARTICIPANT_04', 'SAMPLE', 'SYDNEY', 'NSW', 'PHONE_TOKEN_05', NULL),\n(5, 'PARTICIPANT_05', 'SAMPLE', 'BRISBANE', 'QLD', 'PHONE_TOKEN_06', 'EMAIL_TOKEN_03'),\n(6, 'PARTICIPANT_06', 'SAMPLE', 'ADELAIDE', 'SA', 'PHONE_TOKEN_07', 'EMAIL_TOKEN_08'),\n(7, 'PARTICIPANT_07', 'SAMPLE', 'SYDNEY', 'NSW', 'PHONE_TOKEN_08', 'EMAIL_TOKEN_11 al ambiguity","title":"Capacity query conflicts with CHECK","questions":["M1-Q3"],"finding":"题目查询100–500容量，但TRUCK CHECK要求CAPACITY\u003c100。","resolution":"保留原题和查询；解释在CHECK生效的合法数据上结果为空，不擅自修改容量或查询WEIGHT。"},{"id":"E04","kind":"Original ambiguity","title":"Database names and city result shape","questions":["M1-Q3","M1-Q5"],"finding":"原题一处把transport改写成csit115；城市查询未明确一列名单或两列配对。","resolution":"数据库名按原文保留；城市两种解释分别给出，不能声称结果等价。"},{"id":"E05","kind":"Original underspecification","title":"Natural identifiers and minimum participation","questions":["M2-Q1","M1-Q1","A1-T2"],"finding":"顾问未明示唯一属性；合同/入院组合唯一性、若干关联下限及must/at most措辞需解释。","resolution":"保留原题，不添加人工ID；列清本参考设计采用的假设，用户可据老师要求调整。"},{"id":"E06","kind":"Source correction","title":"NOT IN with NULL can invalidate an anti-join","questions":["L03"],"finding":"SELECT (5) p10直接用NOT IN，但COURSE.offered_by允许NULL。子查询出现NULL时，未匹配部门可能变成UNKNOWN而被过滤。","resolution":"采用相关NOT EXISTS，或在NOT IN子查询排除NULL；加入含未分配课程的测试。"},{"id":"E07","kind":"Source correction","title":"Some two-table decompositions are lossy","questions":["S10","L07"],"finding":"Normalization(3) p9给CB+AB，p11给AB+BC的备选分解，p15给AB+BC+BD；在相应FD下缺少应保留的配对关系，不能仅凭分表都是二元关系判断lossless。","resolution":"S10使用CB+AC；p11正确选择AB+AC；L07(2)使用AC+AB+BD并说明C→B未局部保持，可加CB保持该FD。提供可检查的spurious-tuples反例。"},{"id":"E08","kind":"Version boundary","title":"Set operations and SQL restrictions depend on version","questions":["L02","M2-Q6"],"finding":"课件的“MySQL不支持INTERSECT”不适用于当前所有版本；原并发SQL还涉及同表子查询UPDATE与事务边界。","resolution":"保留课堂可兼容IN/NOT EXISTS方法；并发题区分MySQL、Oracle模型和字面执行失败，不给出无条件唯一余额。","link":"https://dev.mysql.com/doc/refman/8.4/en/set-operations.html"},{"id":"E09","kind":"Privilege boundary","title":"GRANT OPTION is scoped and additive","questions":["M2-Q5","S16"],"finding":"已有banks.* GRANT OPTION时，再授同库view SELECT可能仍可传播；表级REVOKE不覆盖数据库级或role来源。","resolution":"按连续小题在独立report schema开放受限view；撤权检查所有来源。没有宣称每条GRANT只影响刚列出的权限。","link":"https://dev.mysql.com/doc/refman/8.4/en/grant.html"},{"id":"E10","kind":"Validation limit","title":"Separate executed tests from static MySQL review","questions":[],"finding":"本机MySQL 26.7初始化独立临时实例时SIGSEGV，未连用户现有数据库。","resolution":"使用内存SQLite验证查询、FK/DML及反例；MySQL专属DDL、权限和并发依官方文档静态核对，不冒称全套MySQL实跑通过。"}],"publicEdition":{"anonymized":true,"note":"Public edition: sample identities, contact values and password literals are anonymized. NULL positions, keys, relationships, dates, query conditions and numeric values are retained.","questionLanguage":"English; source wording retained except anonymized example values."},"schemaVersion":2,"knowledge":{"projection":{"id":"projection","en":"SELECT / projection","zh":"选择输出列","explain":"先从题目列出需要返回的列。输出多余列可能改变DISTINCT、GROUP BY或结果形状。","rule":"SELECT column1, column2 FROM table_name;"},"filter":{"id":"filter","en":"WHERE / predicate","zh":"逐行筛选条件","explain":"WHERE检查每一行。AND要求条件同时成立，OR要求至少一个成立。","rule":"WHERE category = 'TECHNOLOGY' AND fee >= 200"},"range":{"id":"range","en":"BETWEEN / date range","zh":"区间筛选","explain":"BETWEEN包含两端。整年或整月时间常用“包含起点、排除下个区间起点”。","rule":"fee BETWEEN 150 AND 220; date >= '2026-06-01' AND date \u003c '2026-07-01'"},"null":{"id":"null","en":"NULL / IS NULL","zh":"未知值及空值判断","explain":"NULL表示没有已知值，不等于0或空字符串。用IS NULL判断；= NULL不会得到TRUE。","rule":"WHERE email IS NULL"},"join":{"id":"join","en":"JOIN / join condition","zh":"连接及连接条件","explain":"两张表通过有关联的列匹配。先判断一行代表什么，避免漏连接条件形成多余组合。","rule":"FROM Participant P JOIN Qualification Q ON Q.participantNo = P.participantNo"},"left":{"id":"left","en":"LEFT JOIN","zh":"保留左侧未匹配行的连接","explain":"需要包括“没有报名／要求／培训师”的对象时，从这些对象所在表出发。右表没有匹配时会补NULL。","rule":"FROM Participant P LEFT JOIN Enrolment E ON E.participantNo = P.participantNo"},"count":{"id":"count","en":"COUNT / grain","zh":"计数与计数单位","explain":"先确定要数的是Trip、Qualification、Enrolment还是Trainer。LEFT JOIN统计右表非空键，才能让零匹配结果为0。","rule":"COUNT(E.workshopNo); GROUP BY P.participantNo"},"group":{"id":"group","en":"GROUP BY / aggregate","zh":"分组与聚合","explain":"一组对应一个对象或一个分类，再在组内COUNT、AVG、SUM等。非聚合输出列要符合分组规则。","rule":"GROUP BY participantNo HAVING COUNT(*) > 3"},"having":{"id":"having","en":"HAVING","zh":"聚合后的筛选","explain":"“至少两次／超过三项”通常先分组计数，再用HAVING筛组。WHERE不能直接代替这种组条件。","rule":"HAVING COUNT(*) >= 2"},"order":{"id":"order","en":"ORDER BY","zh":"结果排序","explain":"多个排序列按书写顺序比较。ASC升序，DESC降序；每列可有不同方向。","rule":"ORDER BY category ASC, fee DESC"},"aggregatefn":{"id":"aggregatefn","en":"AVG / MAX / SUM","zh":"对选定行计算统计值","explain":"AVG求平均、MAX求最大值、SUM求总和。先用正确条件确定参与计算的行；不需要逐对象统计时不额外GROUP BY。","rule":"SELECT AVG(fee) FROM Workshop WHERE category = 'TECHNOLOGY';"},"concat":{"id":"concat","en":"CONCAT / column alias","zh":"合成姓名与输出列别名","explain":"Participant存的是fname和lname，不是fullName列。CONCAT把两列与空格合成结果，再用AS指定输出名称。","rule":"SELECT CONCAT(fname, ' ', lname) AS fullName FROM Participant;"},"nested":{"id":"nested","en":"Nested query","zh":"嵌套查询","explain":"内层查询先产生一个值或一组值，外层用它筛选。例如把全表AVG作为每行fee的比较基准。","rule":"WHERE fee > (SELECT AVG(fee) FROM Workshop)"},"correlated":{"id":"correlated","en":"Correlated subquery","zh":"相关子查询","explain":"内层引用当前外层行的别名，按这个对象单独检查。少写相关条件会把逐对象问题变成全局问题。","rule":"WHERE EXISTS (SELECT 1 FROM Enrolment E WHERE E.participantNo = P.participantNo)"},"exists":{"id":"exists","en":"EXISTS / NOT EXISTS","zh":"存在与不存在","explain":"EXISTS只检查是否至少有一行，不需要把每条匹配记录都复制到外层。NOT EXISTS检查完全没有匹配。","rule":"WHERE NOT EXISTS (SELECT 1 FROM TRIP T WHERE T.REGNUM = R.REGNUM)"},"ties":{"id":"ties","en":"MAX / ties","zh":"最大值与并列","explain":"最高等级按同一qname比较。用等于该组MAX可保留全部并列；LIMIT 1只取一行通常不够。","rule":"Q.qlevel = (SELECT MAX(Q2.qlevel) FROM Qualification Q2 WHERE Q2.qname = Q.qname)"},"cte":{"id":"cte","en":"WITH / CTE","zh":"命名公共表表达式","explain":"把中间查询命名，供同一条语句后续部分使用。A4-T2(1)必须有至少两个有名称的CTE。","rule":"WITH A AS (SELECT ...), B AS (SELECT ... FROM A) SELECT ... FROM B;"},"view":{"id":"view","en":"View / dependency","zh":"视图与依赖","explain":"View保存查询定义。依赖另一个View时，删除顺序先子后父。普通View不是一张独立保存统计结果的表。","rule":"CREATE VIEW V AS SELECT ...; DROP VIEW V;"},"ctas":{"id":"ctas","en":"CREATE TABLE AS SELECT","zh":"从查询结果建表","explain":"CTAS创建并填充新表，但不会自动继承所有primary/foreign keys；按题目再ALTER添加。","rule":"CREATE TABLE NewTable AS SELECT ...; ALTER TABLE NewTable ADD PRIMARY KEY (...);"},"types":{"id":"types","en":"DECIMAL(p,s)","zh":"精确数值的位数","explain":"p是总位数，s是小数位数。9999.99需要四位整数和两位小数，即DECIMAL(6,2)。","rule":"DECIMAL(6,2); CHECK (fee > 0 AND fee \u003c= 9999.99)"},"keys":{"id":"keys","en":"Primary / candidate / foreign key","zh":"主键、候选键与外键","explain":"Candidate key是最小且非空的唯一标识组合；primary key是其中选中的一个。Foreign key引用已有对象，复合标识须完整引用。Superset中的可空子类标识要另说明为条件unique。","rule":"PRIMARY KEY (hotelCode, roomNo); FOREIGN KEY (hotelCode) REFERENCES HOTEL(code)"},"constraints":{"id":"constraints","en":"CHECK / UNIQUE / NOT NULL","zh":"值限制、唯一与必填","explain":"这三种约束作用不同。CHECK限制允许的值，UNIQUE限制重复，NOT NULL要求有值。不得为使DML成功而擅自停用约束。","rule":"CHECK (qlevel > 0 AND qlevel \u003c= 10); UNIQUE (email)"},"dml":{"id":"dml","en":"INSERT / UPDATE / DELETE","zh":"增加、修改和删除行","explain":"INSERT先父后子；DELETE依赖记录先子后父。UPDATE中的新值通常从当前列计算，并用WHERE限定目标。","rule":"UPDATE Qualification SET qlevel = qlevel + 1 WHERE participantNo = 3;"},"ddl":{"id":"ddl","en":"ALTER TABLE","zh":"修改表结构","explain":"增加列、改类型或加约束属于DDL，不是修改某几行数据。先确认现有类型能否容纳目标边界。","rule":"ALTER TABLE Workshop MODIFY fee DECIMAL(6,2) NOT NULL;"},"transaction":{"id":"transaction","en":"COMMIT / ROLLBACK","zh":"提交与回滚","explain":"COMMIT使当前事务的数据修改持久化。MySQL有些DDL会隐式提交，不能把DROP、TRUNCATE当作可随意ROLLBACK的DELETE。","rule":"COMMIT; ROLLBACK;"},"grant":{"id":"grant","en":"GRANT / privilege scope","zh":"授予权限与对象范围","explain":"区分数据库、表、列权限。只需读汇总结果时，用View限制范围，避免额外开放底表。","rule":"GRANT SELECT (workshopNo, title) ON csit882.Workshop TO 'user'@'localhost';"},"grantoption":{"id":"grantoption","en":"WITH GRANT OPTION","zh":"权限转授","explain":"加上此项允许转授指定范围内已有的对象权限。权限来源会叠加；新GRANT省略此项，不会撤销旧的转授权能力。","rule":"GRANT INSERT ON transport.TRIP TO 'user'@'localhost' WITH GRANT OPTION;"},"definer":{"id":"definer","en":"SQL SECURITY DEFINER","zh":"由视图定义者权限读取底表","explain":"由root创建受限View，再只授View的SELECT，可开放汇总或特定年份数据。仍要检查用户是否从其他途径已有更大权限。","rule":"CREATE SQL SECURITY DEFINER VIEW Summary AS SELECT ...;"},"entity":{"id":"entity","en":"Class / attribute","zh":"对象类别与属性","explain":"Class描述要记录的对象类别；attribute描述该对象的信息。概念图用association连接类别，不把foreign key当作概念关联。","rule":"BOOK: ISBN [ID], Title, Edition, PublicationYear"},"identifier":{"id":"identifier","en":"Identifier","zh":"唯一标识","explain":"同一个ID标签标在多列上表示组合标识；不同ID标签表示各自独立的标识。局部号码必须结合所属对象。","rule":"EMPLOYEE: employee_number [ID1]; first_name,last_name,date_of_birth [ID2]"},"multiplicity":{"id":"multiplicity","en":"Multiplicity","zh":"关联两端的数量范围","explain":"分别向两个方向读关联。端点上的0..1、1..*等描述这一端可以对应多少个对象。at most给上限，不能当作at least。","rule":"MEMBER \"0..1\" -- \"0..*\" COPY : borrows"},"qualifier":{"id":"qualifier","en":"Qualified association","zh":"用局部值限定的关联","explain":"固定所属对象与qualifier后，至多对应一个目标；不等于该所属对象总共只能有一个目标。","rule":"ROOM的完整key是(hotelCode, roomNo)。"},"multivalue":{"id":"multivalue","en":"Multivalued / optional / derived","zh":"多值、可选与可计算属性","explain":"多值属性拆成逐项记录；可选属性可缺失；derived attribute由其他记录计算。配对内容如资格与日期不能拆成不对应的两个列表。","rule":"learningObjectives [1..*]; email [0..1]; /totalEnrolments"},"superset":{"id":"superset","en":"Superset method","zh":"超集法实现泛化","explain":"把父类共有列与子类专有列放在同一表，另记录类型。子类专有列在整表常需允许NULL，并遵守分类条件。","rule":"CREW(airline, employee_number, crew_type, licence_number, ...)"},"generalization":{"id":"generalization","en":"Generalization / inheritance","zh":"泛化与继承","explain":"子类继承父类共同属性和标识，再增加自己的属性。概念图的空心三角指向父类；画概念图时不需要先选SQL实现方法。","rule":"STUDENT \u003c|-- UNDERGRADUATE"},"union":{"id":"union","en":"UNION / UNION ALL","zh":"合并结果集","explain":"UNION把兼容的查询结果合在一起并去重；UNION ALL保留重复。合成一列城市与保留两列出发地／目的地配对不是同一种结果。","rule":"SELECT DEPARTURE AS city FROM TRIPLEG UNION SELECT DESTINATION FROM TRIPLEG;"},"distinct":{"id":"distinct","en":"DISTINCT","zh":"删除重复结果行","explain":"同一对象可能有多条符合的报名。需要每人只出现一次时，可使用EXISTS或在正确列上DISTINCT；不要用去重掩盖错误连接。","rule":"SELECT DISTINCT E.participantNo FROM Enrolment E;"},"user":{"id":"user","en":"CREATE USER / account host","zh":"创建用户及主机范围","explain":"MySQL账号由用户名和host共同区分。root数据库账号不等于操作系统用户目录。密码按题面或自行选择，公开版只提供占位文本。","rule":"CREATE USER 'sample_user'@'localhost' IDENTIFIED BY '[CHOOSE_PASSWORD]';"},"source":{"id":"source","en":"USE / SOURCE / client commands","zh":"选库与处理SQL脚本","explain":"USE选择数据库；SOURCE由mysql客户端读取脚本，不是服务器SELECT。tee与notee控制客户端报告文件，不等于COMMIT。","rule":"USE banks;\nSOURCE ~/bank/sql/dbcreate.sql;\ntee solution.rpt;\nSOURCE solution.sql;\nnotee;"},"association":{"id":"association","en":"Many-to-many / association attribute","zh":"多对多与关联属性","explain":"多对多建立配对表，完整引用两端的标识。只随某次配对变化的属性，如role或报名日期，放在配对关系中。","rule":"SERVICE_CREW(flight_number,flight_date,airline,employee_number,role)"},"fd":{"id":"fd","en":"Functional dependency","zh":"函数依赖","explain":"X→Y表示相同X值必定有相同Y值，不表示X与Y值相等。若右侧完全包含在左侧中，称trivial（平凡）FD；范式检查关注non-trivial（非平凡）FD。","rule":"若X在当前closure中，可把Y加入closure。"},"closure":{"id":"closure","en":"Attribute closure X⁺","zh":"属性闭包","explain":"从X开始，反复应用可用FD，把能确定的属性加入，直到不再增加。若包含R的全部属性，X是superkey。","rule":"A⁺: {A} → {A,B,C} → {A,B,C,D}"},"candidate":{"id":"candidate","en":"Superkey / candidate key","zh":"超键与候选键","explain":"Superkey能决定全部属性；candidate key还必须最小，删除任何一项就不再足够。最小不是只选属性数最少的组合：单属性键与复合键可以并存。找到一个key不代表找全。","rule":"检验X⁺=R，并对X中的每个属性检查删除后是否仍能推出R。"},"prime":{"id":"prime","en":"Prime / non-prime attribute","zh":"主属性与非主属性","explain":"出现在任意一个candidate key中的属性就是prime。不能只看选作primary key的那一个key。","rule":"Prime = 所有candidate keys的属性并集。"},"partial":{"id":"partial","en":"Partial dependency / 2NF","zh":"部分依赖与第二范式","explain":"已在1NF时，若non-prime attribute依赖某个candidate key的真子集，就违反2NF。判断要检查全部candidate keys。","rule":"找X→a：X是某candidate key的真子集，a是non-prime。"},"third":{"id":"third","en":"Transitive dependency / 3NF","zh":"传递依赖与第三范式","explain":"A→C且C→D，可传递推出A→D。但不能只见链式FD就判失败。3NF检查每个非平凡X→a：X是superkey，或a是prime，至少满足一个。","rule":"若X不是superkey且右侧a不是prime，则违反3NF。"},"bcnf":{"id":"bcnf","en":"BCNF","zh":"Boyce–Codd范式","explain":"每个非平凡FD的左侧都必须是superkey；没有“右侧是prime就可以”的例外。不能要求左侧必须最小key，superkey已足够。","rule":"对X→Y算X⁺；X⁺≠R时可作为BCNF失败证据。"},"audit":{"id":"audit","en":"Statement auditing","zh":"语句活动审计","explain":"选定用户、对象和时间范围，保存收到的DML语句并解释日志设置。语句被记录不代表修改成功或事务已提交。","rule":"general query log / selected users / selected tables / time window"},"isolation":{"id":"isolation","en":"Isolation level / row lock","zh":"隔离级别与行锁","explain":"并发修改同一行可能等待或发生冲突失败。先列事务顺序与提交点，再讨论所假定数据库的行为。","rule":"SERIALIZABLE; READ COMMITTED; READ UNCOMMITTED"}},"questionTypes":{"conceptual":"Conceptual modelling · 概念图","logical":"Logical design · 关系模式","fundamentals":"SQL Fundamentals · 基础查询","joins":"Joins · 连接与零匹配","aggregate":"Aggregate queries · 分组统计","nested":"Nested queries · 嵌套查询","correlated":"Correlated queries · 相关子查询","cte":"WITH / CTE · 命名中间结果","views":"Views · 视图","ddl-dml":"DDL / DML · 结构与数据操作","access":"Access control · 权限","normalization":"Normalization · 范式证明","auditing":"Auditing · 审计原题","transactions":"Transactions · 并发原题"},"examRules":{"durationMinutes":180,"submissionMinutes":15,"source":"21Review.pdf pp5,10","note":"课程Review给出3小时作答及15分钟提交。原Mock未附独立评分表；练习时长可自行修改，不提供伪精确自动分数。","mockHasNormalization":false},"papers":{"mock-1":{"title":"Mock Exam 1","ids":["M1-Q1","M1-Q2","M1-Q3","M1-Q4","M1-Q5","M1-Q6"],"official":true,"marks":null,"source":"本聊天转发的Mock 1 Q1–Q6；原始PDF未提供"},"mock-2":{"title":"Mock Exam 2","ids":["M2-Q1","M2-Q2","M2-Q3","M2-Q4","M2-Q5","M2-Q6"],"official":true,"marks":null,"source":"本聊天转发的Mock 2 Q1–Q6；原始PDF未提供"},"mock-3":{"title":"Mock Exam 3","ids":["M3-Q1","M3-Q2","M3-Q3","M3-Q4","M3-Q5","M3-Q6"],"official":true,"marks":null,"source":"本聊天转发的Mock 3 Q1–Q6；原始PDF未提供"},"custom":{"title":"Custom Mock · 六类组合","ids":["M1-Q1","M1-Q2","A3-T2","A4-T2","A4-T3","A4-T4"],"official":false,"marks":null,"source":"自选练习组合，非教师原卷；保留各题来源"}},"learningOrder":["A3-T2","A3-T3","M1-Q3","A3-T1","A1-T1","A2-T1","A2-T2","A4-T4","A4-T1","A4-T2","A4-T3","M1-Q5","M2-Q5","A1-T2","M1-Q1","M2-Q1","M1-Q2","M2-Q2","M1-Q4","M1-Q6","M2-Q3","M2-Q4","M2-Q6"],"auditStats":{"before":{"groups":54,"unique":48,"parts":158,"legacyCore":44,"original":29,"supplement":25,"archived":0,"completeTeaching":0},"after":{"groups":56,"parts":185,"A":29,"B":3,"C":24,"archived":9,"uniqueCoreOriginal":23,"mainListUnique":26,"completeCoreTeaching":32}},"materials":{"assignments":"Assignment1.pdf (6pp), Assignment2.pdf (4pp), Assignment3.pdf (10pp), Assignment 4.pdf (11pp); all task pages reviewed.","providedSolutions":"Solution.pdf (one-page A1 diagrams), Assignment2_Solution.pdf (5pp); source authorship not independently authenticated. A3/A4 solution*.sql are templates, not filled answers.","mocks":"Received messages, diagrams and Mock2 Q3–Q5 original text files. Original Mock PDFs and an independent mark scheme were not provided.","scope":"User confirmation on 2026-11-18: Assignment/Mock task forms plus Normalization. Review pp5,10 retained as supporting course rules, not a reason to add broad lecture content.","uncertain":["M1-Q3 capacity interval conflicts with the original CHECK; retain both and explain the empty result.","M1-Q3 city output shape is ambiguous; retain both interpretations.","M2-Q1 consultant uniqueness and repeated-event identifiers require stated assumptions.","M2-Q6 depends on transaction/engine assumptions and literal MySQL restrictions.","A1 supplied CopyID diagram and the text's global uniqueness need to be read together."]}};</script><script>/* Pure state rules shared by the browser and regression tests. */
(function(root){
 'use strict';
 const values=new Set(['unassessed','unmastered','partial','mastered']);
 const clone=x=>JSON.parse(JSON.stringify(x));
 const object=x=>x&&typeof x==='object'&&!Array.isArray(x);
 function safeObject(x){if(!object(x))return {};for(const k of Object.keys(x))if(['__proto__','constructor','prototype'].includes(k))throw Error('记录中含有不允许的字段');return x;}
 function fresh(){return {schemaVersion:2,course:'CSIT882',records:{},settings:{module:'exam',id:'A3-T2',part:0,level:'A',source:'all',type:'all',knowledge:'all',mastery:'all',hideDuplicates:true},mock:{active:null,runs:[]}};}
 function record(x){
  x=safeObject(x);const drafts=safeObject(x.drafts),mastery=safeObject(x.partMastery);
  for(const d of Object.values(drafts))if(!object(d)||typeof d.text!=='string')throw Error('小题草稿格式不正确');
  for(const m of Object.values(mastery))if(!object(m)||!values.has(m.value)||typeof m.at!=='string')throw Error('掌握记录格式不正确');
  return {...clone(x),answer:typeof x.answer==='string'?x.answer:'',answerUpdatedAt:x.answerUpdatedAt||x.updatedAt||'',done:x.done===true,updatedAt:typeof x.updatedAt==='string'?x.updatedAt:'',drafts:clone(drafts),partMastery:clone(mastery),attempts:Array.isArray(x.attempts)?clone(x.attempts):[],draftHistory:Array.isArray(x.draftHistory)?clone(x.draftHistory):[]};
 }
 function migrate(x){
  safeObject(x);if(!object(x))throw Error('记录必须是JSON对象');if(x.course&&x.course!=='CSIT882')throw Error('这不是CSIT882记录');
  if('records' in x&&!object(x.records))throw Error('records必须是对象');
  const out=fresh(),src=safeObject(x.records||x);
  for(const [id,r] of Object.entries(src)){if(object(r)&&!['settings','mock','publicEdition'].includes(id))out.records[id]=record(r);}
  if(x.records){out.settings={...out.settings,...safeObject(x.settings)};if(object(x.mock)){out.mock.active=object(x.mock.active)?clone(x.mock.active):null;out.mock.runs=Array.isArray(x.mock.runs)?clone(x.mock.runs):[];for(const s of [out.mock.active,...out.mock.runs].filter(Boolean)){if(!Array.isArray(s.ids)||!s.ids.length||!s.ids.every(id=>typeof id==='string')||!object(s.answers)||!object(s.reviews)||!['running','paused','finished'].includes(s.status))throw Error('模拟记录格式不正确');}}}
  return out;
 }
 function union(a,b,key){const result=new Map();for(const x of [...a,...b])if(object(x)){const id=key(x),old=result.get(id),time=v=>v?.reviewUpdatedAt||v?.updatedAt||v?.at||v?.finishedAt||'';if(!old||String(time(x))>=String(time(old)))result.set(id,clone(x));}return [...result.values()];}
 function mergeRecord(a,b){
  a=record(a);b=record(b);const newer=b.updatedAt&&(!a.updatedAt||b.updatedAt>a.updatedAt);const r={...(newer?a:b),...(newer?b:a)};
  const answerNewer=b.answerUpdatedAt&&(!a.answerUpdatedAt||b.answerUpdatedAt>a.answerUpdatedAt);r.answer=(answerNewer?b:a).answer;r.answerUpdatedAt=(answerNewer?b:a).answerUpdatedAt;
  r.attempts=union(a.attempts,b.attempts,x=>x.id||JSON.stringify(x));
  r.draftHistory=union(a.draftHistory,b.draftHistory,x=>x.id||JSON.stringify(x));
  if(a.answer&&b.answer&&a.answer!==b.answer){const old=answerNewer?a:b;r.draftHistory=union(r.draftHistory,[{id:'import:'+old.answerUpdatedAt+':'+old.answer,text:old.answer,updatedAt:old.answerUpdatedAt,source:'import-conflict'}],x=>x.id);}

</script><script>/* Vanilla-JS workbench. BANK is the shared, pre-rendered source for all modes. */
