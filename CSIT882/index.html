最高范式是2NF。\n\n### (2) 最高范式：1NF\n\n**求键**：A、B都没有出现在任何给定functional dependency的右侧，因此每个键必须同时包含A和B。$A^+={A,C}$，$B^+={B,D}$，两者单独都不足；$(AB)^+={A,B,C,D}$。唯一candidate key是${A,B}$。prime attribute为A、B；non-prime attribute为C、D。\n\n**检查2NF**：$A\to C$说明non-prime attributeC只依赖candidate key中的A；$B\to D$说明non-prime attributeD只依赖candidate key中的B。这些是partial dependency，违反2NF。\n\n**检查3NF和BCNF**：A、B都不是superkey，C、D都是non-prime attribute，所以这两条依赖也分别违反3NF和BCNF。\n\n题目只保证1NF，2NF不成立，因此最高范式是1NF。\n\n### (3) 最高范式：BCNF\n\n**求键**：$A^+=B^+=C^+={A,B,C,D}$，而$D^+={D}$。因此有三个candidate key：${A}$、${B}$、${C}$。包含其中一个的更大集合不再最小；只用D又不能决定其他属性，所以没有遗漏。prime attribute为A、B、C；non-prime attribute为D。\n\n**检查2NF**：所有candidate key都是单属性键，不存在本题中的partial dependency问题，因此满足2NF。\n\n**检查3NF和BCNF**：能通过这些依赖推出新属性的决定因素，必定包含A、B、C中的至少一个；包含其中任意一个就已经是superkey。只含D的集合没有non-trivial functional dependency。因此每个non-trivial functional dependency的左侧都是superkey，满足BCNF，也满足3NF。\n\n最高范式是BCNF。出现依赖链本身不等于违反3NF，需要检查左侧是不是superkey、右侧是不是prime attribute。\n\n### (4) 最高范式：3NF\n\n**求键**：A不能从其他属性推出，因此每个键都必须包含A。$(AB)^+={A,B,C,D}$，$(AC)^+={A,B,C,D}$，而$A^+={A}$、$(AD)^+={A,D}$。因此全部candidate key是${A,B}$和${A,C}$。prime attribute为A、B、C；non-prime attribute为D。\n\n**检查2NF**：对于键${A,B}$，A、B单独都不能推出D；对于键${A,C}$，A、C单独也不能推出D。因此non-prime attributeD不依赖任何candidate key的一部分，满足2NF。C能推出B不构成2NF违规，因为B是prime attribute。\n\n**检查3NF**：$AB\to C$和$AB\to D$的左侧是superkey。$C\to B$的左侧不是superkey，但右侧B是prime attribute，所以它仍符合3NF。要从给定依赖推出D，决定因素必须同时取得A以及B或C，从而包含一个candidate key，因此涉及D的依赖也没有另外造成3NF违规。\n\n**检查BCNF**：$C^+={B,C}$，C不是superkey，但存在non-trivial functional dependency$C\to B$，所以违反BCNF。\n\n因此最高范式是3NF。\n\n| 小题 | 全部candidate key | 最高范式 |\n| --- | --- | --- |\n| 1 | ${A}$ | 2NF |\n| 2 | ${A,B}$ | 1NF |\n| 3 | ${A}$、${B}$、${C}$ | BCNF |\n| 4 | ${A,B}$、${A,C}$ | 3NF |\n\n表格只是核对结论，作答仍需上面的推导和理由。英文理由示例：`C is not a superkey, and D is non-prime. Therefore C → D violates 3NF.`","context":"","canonical":null,"parts":[{"number":"1","goal":"唯一key是{A}，最高2NF","steps":["A不在给定FD右侧，所以key必须含A；A→B、A→C、C→D逐步得到A⁺=ABCD。","A单独足够且不能再删；prime attribute只有A，B/C/D都是non-prime。","2NF成立；C⁺=CD不是superkey，C→D右侧D又非prime，因此3NF和BCNF失败。"],"check":"指出具体违规FD C→D，而不只说有传递依赖。","pitfall":"不能把A→C也判为3NF违规，因为A是key。","code":""},{"number":"2","goal":"唯一key是{A,B}，最高1NF","steps":["A、B都无法从其他属性推出，每个key必须同时含A和B。","A⁺=AC、B⁺=BD，AB⁺=ABCD，因此AB是唯一minimal key。","A→C、B→D让non-prime attributes依赖key真子集，违反2NF，也违反3NF/BCNF。"],"check":"列出AB，并同时证明A或B单独不够。","pitfall":"“含P/Q”这类斜线写法可能读成二选一；应写同时包含。","code":""},{"number":"3","goal":"keys为{A}、{B}、{C}，最高BCNF","steps":["A→B→C→D，B→C→A并到D，C→A→B且到D，所以A/B/C单独都决定全体。","D⁺只有D，单独D不是key；包含A/B/C的更大集合不minimal，所以keys已列全。","2NF成立；能推出新属性的决定因素必含一个单属性key，所以全部非平凡FD左侧是superkey，3NF/BCNF都成立。"],"check":"区分三个单属性keys，不是一个三属性key。","pitfall":"出现依赖链不自动意味着不满足3NF。","code":""},{"number":"4","goal":"keys为{A,B}、{A,C}，最高3NF","steps":["A不能由右侧推出，因此每个key必须含A。AB由给定FD得到CD；AC由C→B再取得D。","A、B、C单独不能决定D，故non-prime D没有partial dependency，满足2NF。","C→B中C非superkey，但B属于key AB，是prime，因此3NF成立；这条FD仍违反更严格的BCNF。"],"check":"给出C⁺=BC作为非superkey证据。","pitfall":"只看选中AB而漏AC，会把C的prime属性判断错。","code":""}],"tags":["Functional dependencies and attribute closure","All minimal keys and prime attributes","Full and partial dependency; 2NF","3NF versus BCNF with justification"],"questionHTML":"\u003cp>Consider the relational schemas given below and the respective sets of functional  dependencies valid in the schemas. Assume that each schema is in 1NF.    For each one of the relational schemas, determine the highest normal form that is valid  for a schema. Justify your answer. Justification must include the derivations of minimal  keys from the functional dependencies and testing the validity of all normal forms (2NF,  3NF, BCNF) against the relational schemas, minimal keys, and functional dependencies.    A correct guess without the comprehensive justifications scores no marks!  Do not change the attributes of relational schemas in the questions. \u003c/p>\n\u003cp>(1) \u003cspan class=\"math\">R=(A,B,C,D)\u003c/span>      \u003cspan class=\"math\">F={A → B, A → C, C → D}\u003c/span> \u003c/p>\n\u003cp>(2) \u003cspan class=\"math\">R=(A,B,C,D)\u003c/span>      \u003cspan class=\"math\">F={A → C, B → D}\u003c/span> \u003c/p>\n\u003cp>(3) \u003cspan class=\"math\">R=(A,B,C,D)\u003c/span>      \u003cspan class=\"math\">F={A → B, B → C, C → A, C → D}\u003c/span> \u003c/p>\n\u003cp>(4) \u003cspan class=\"math\">R=(A,B,C,D)\u003c/span>      \u003cspan class=\"math\">F={AB → C, AB → D, C → B}\u003c/span>\u003c/p>\n","answerHTML":"\u003cp>题目已经假定四个relational schema都满足1NF。这里用AB表示属性集合\u003cspan class=\"math\">{A,B}\u003c/span>，即A和B一起使用。\u003c/p>\n\u003cp>prime attribute是至少属于一个candidate key的属性；non-prime attribute不属于任何candidate key。superkey能决定关系的全部属性；candidate key（也称minimal key）还要求不能再删除其中的属性。\u003c/p>\n\u003ch3>(1) 最高范式：2NF\u003c/h3>\n\u003cp>\u003cstrong>求键\u003c/strong>：由\u003cspan class=\"math\">A\to B\u003c/span>、\u003cspan class=\"math\">A\to C\u003c/span>和\u003cspan class=\"math\">C\to D\u003c/span>，得到\u003cspan class=\"math\">A\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>。A没有出现在给定functional dependency的右侧，不能由其他属性推出，所以任何键都必须包含A。A单独已经足够，因此只有一个candidate key：\u003cspan class=\"math\">{A}\u003c/span>。prime attribute为A；non-prime attribute为B、C、D。\u003c/p>\n\u003cp>\u003cstrong>检查2NF\u003c/strong>：candidate key只有一个属性。给定依赖中，不存在某个non-prime attribute依赖这个键的一部分，因此满足2NF。\u003c/p>\n\u003cp>\u003cstrong>检查3NF\u003c/strong>：\u003cspan class=\"math\">C\to D\u003c/span>是non-trivial functional dependency；\u003cspan class=\"math\">C\u003csup>+\u003c/sup>={C,D}\u003c/span>，所以C不是superkey；D又是non-prime attribute。这条依赖违反3NF。\u003c/p>\n\u003cp>\u003cstrong>检查BCNF\u003c/strong>：同一条\u003cspan class=\"math\">C\to D\u003c/span>的左侧不是superkey，也违反BCNF。\u003c/p>\n\u003cp>因此，最高范式是2NF。\u003c/p>\n\u003ch3>(2) 最高范式：1NF\u003c/h3>\n\u003cp>\u003cstrong>求键\u003c/strong>：A、B都没有出现在任何给定functional dependency的右侧，因此每个键必须同时包含A和B。\u003cspan class=\"math\">A\u003csup>+\u003c/sup>={A,C}\u003c/span>，\u003cspan class=\"math\">B\u003csup>+\u003c/sup>={B,D}\u003c/span>，两者单独都不足；\u003cspan class=\"math\">(AB)\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>。唯一candidate key是\u003cspan class=\"math\">{A,B}\u003c/span>。prime attribute为A、B；non-prime attribute为C、D。\u003c/p>\n\u003cp>\u003cstrong>检查2NF\u003c/strong>：\u003cspan class=\"math\">A\to C\u003c/span>说明non-prime attributeC只依赖candidate key中的A；\u003cspan class=\"math\">B\to D\u003c/span>说明non-prime attributeD只依赖candidate key中的B。这些是partial dependency，违反2NF。\u003c/p>\n\u003cp>\u003cstrong>检查3NF和BCNF\u003c/strong>：A、B都不是superkey，C、D都是non-prime attribute，所以这两条依赖也分别违反3NF和BCNF。\u003c/p>\n\u003cp>题目只保证1NF，2NF不成立，因此最高范式是1NF。\u003c/p>\n\u003ch3>(3) 最高范式：BCNF\u003c/h3>\n\u003cp>\u003cstrong>求键\u003c/strong>：\u003cspan class=\"math\">A\u003csup>+\u003c/sup>=B\u003csup>+\u003c/sup>=C\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>，而\u003cspan class=\"math\">D\u003csup>+\u003c/sup>={D}\u003c/span>。因此有三个candidate key：\u003cspan class=\"math\">{A}\u003c/span>、\u003cspan class=\"math\">{B}\u003c/span>、\u003cspan class=\"math\">{C}\u003c/span>。包含其中一个的更大集合不再最小；只用D又不能决定其他属性，所以没有遗漏。prime attribute为A、B、C；non-prime attribute为D。\u003c/p>\n\u003cp>\u003cstrong>检查2NF\u003c/strong>：所有candidate key都是单属性键，不存在本题中的partial dependency问题，因此满足2NF。\u003c/p>\n\u003cp>\u003cstrong>检查3NF和BCNF\u003c/strong>：能通过这些依赖推出新属性的决定因素，必定包含A、B、C中的至少一个；包含其中任意一个就已经是superkey。只含D的集合没有non-trivial functional dependency。因此每个non-trivial functional dependency的左侧都是superkey，满足BCNF，也满足3NF。\u003c/p>\n\u003cp>最高范式是BCNF。出现依赖链本身不等于违反3NF，需要检查左侧是不是superkey、右侧是不是prime attribute。\u003c/p>\n\u003ch3>(4) 最高范式：3NF\u003c/h3>\n\u003cp>\u003cstrong>求键\u003c/strong>：A不能从其他属性推出，因此每个键都必须包含A。\u003cspan class=\"math\">(AB)\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>，\u003cspan class=\"math\">(AC)\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>，而\u003cspan class=\"math\">A\u003csup>+\u003c/sup>={A}\u003c/span>、\u003cspan class=\"math\">(AD)\u003csup>+\u003c/sup>={A,D}\u003c/span>。因此全部candidate key是\u003cspan class=\"math\">{A,B}\u003c/span>和\u003cspan class=\"math\">{A,C}\u003c/span>。prime attribute为A、B、C；non-prime attribute为D。\u003c/p>\n\u003cp>\u003cstrong>检查2NF\u003c/strong>：对于键\u003cspan class=\"math\">{A,B}\u003c/span>，A、B单独都不能推出D；对于键\u003cspan class=\"math\">{A,C}\u003c/span>，A、C单独也不能推出D。因此non-prime attributeD不依赖任何candidate key的一部分，满足2NF。C能推出B不构成2NF违规，因为B是prime attribute。\u003c/p>\n\u003cp>\u003cstrong>检查3NF\u003c/strong>：\u003cspan class=\"math\">AB\to C\u003c/span>和\u003cspan class=\"math\">AB\to D\u003c/span>的左侧是superkey。\u003cspan class=\"math\">C\to B\u003c/span>的左侧不是superkey，但右侧B是prime attribute，所以它仍符合3NF。要从给定依赖推出D，决定因素必须同时取得A以及B或C，从而包含一个candidate key，因此涉及D的依赖也没有另外造成3NF违规。\u003c/p>\n\u003cp>\u003cstrong>检查BCNF\u003c/strong>：\u003cspan class=\"math\">C\u003csup>+\u003c/sup>={B,C}\u003c/span>，C不是superkey，但存在non-trivial functional dependency\u003cspan class=\"math\">C\to B\u003c/span>，所以违反BCNF。\u003c/p>\n\u003cp>因此最高范式是3NF。\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>小题\u003c/th>\n\u003cth>全部candidate key\u003c/th>\n\u003cth>最高范式\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>\u003cspan class=\"math\">{A}\u003c/span>\u003c/td>\n\u003ctd>2NF\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>\u003cspan class=\"math\">{A,B}\u003c/span>\u003c/td>\n\u003ctd>1NF\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>\u003cspan class=\"math\">{A}\u003c/span>、\u003cspan class=\"math\">{B}\u003c/span>、\u003cspan class=\"math\">{C}\u003c/span>\u003c/td>\n\u003ctd>BCNF\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>\u003cspan class=\"math\">{A,B}\u003c/span>、\u003cspan class=\"math\">{A,C}\u003c/span>\u003c/td>\n\u003ctd>3NF\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>表格只是核对结论，作答仍需上面的推导和理由。英文理由示例：\u003ccode>C is not a superkey, and D is non-prime. Therefore C → D violates 3NF.\u003c/code>\u003c/p>\n"},{"id":"S01","title":"Conceptual modelling: workshops","topic":"根据培训业务绘制概念图","areas":["Conceptual"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"core","question":"An organisation runs workshops. Each workshop has a unique workshop number, a title, and a set of learning objectives. A trainer has a unique trainer number and a name. A trainer may teach many workshops. Every workshop has at least one trainer. Each trainer–workshop assignment has its own topic. A participant has a unique participant number, a name, and an optional email address. Participants may enrol in many workshops, and a workshop may have no participants yet. Each enrolment records an enrolment date and a status. For each workshop, the total number of enrolments can be derived from the enrolment records.\n\nDraw a simplified UML conceptual schema. Show identifiers, multiplicities, multivalued attributes, optional attributes, derived attributes, and attributes of associations. Do not invent additional identifiers.","answer":"三个类为WORKSHOP、TRAINER、PARTICIPANT。分别用题目给出的编号识别，记录各自的属性。学习目标是工作坊的multivalued attribute，邮箱是参与者的optional attribute，报名总数可由报名记录计算得到，标为derived attribute。\n\n培训主题topic属于“某位培训师教授某个工作坊”的一次分配，不是培训师不随工作坊变化的永久属性。报名日期和状态同样属于参与者与工作坊之间的报名关联。\n\n本参考图按同一参与者与同一工作坊之间只记录一次报名理解。若需要重复报名历史，还要明确如何区分多次事件，不能直接认为原关联已经表达全部历史。\n\n\n| 类 | 属性 |\n| --- | --- |\n| WORKSHOP | workshopNo [ID]、title、learningObjectives [1..*]、/totalEnrolments |\n| TRAINER | trainerNo [ID]、name |\n| PARTICIPANT | participantNo [ID]、name、email [0..1] |\n\n```mermaid\nclassDiagram\n    TRAINER \"1..*\" -- \"0..*\" WORKSHOP : teaches\n    PARTICIPANT \"0..*\" -- \"0..*\" WORKSHOP : enrols\n```","context":"","canonical":null,"parts":[{"number":"1","goal":"分离对象属性与关联属性","steps":["建立WORKSHOP、TRAINER、PARTICIPANT，用各自编号识别。","learningObjectives是multivalued；email是optional；/totalEnrolments是derived attribute。","topic放在trainer–workshop分配上；报名日期和status放在participant–workshop关联上。","读双向multiplicities，且至少一trainer的条件放在trainer端。"],"check":"同一trainer在不同workshop可以有不同topic。","pitfall":"把topic固定在Trainer会无法表示同一人教不同主题。","code":""}],"tags":["Multivalued, optional and derived attributes","Association attributes and repeated events"],"questionHTML":"\u003cp>An organisation runs workshops. Each workshop has a unique workshop number, a title, and a set of learning objectives. A trainer has a unique trainer number and a name. A trainer may teach many workshops. Every workshop has at least one trainer. Each trainer–workshop assignment has its own topic. A participant has a unique participant number, a name, and an optional email address. Participants may enrol in many workshops, and a workshop may have no participants yet. Each enrolment records an enrolment date and a status. For each workshop, the total number of enrolments can be derived from the enrolment records.\u003c/p>\n\u003cp>Draw a simplified UML conceptual schema. Show identifiers, multiplicities, multivalued attributes, optional attributes, derived attributes, and attributes of associations. Do not invent additional identifiers.\u003c/p>\n","answerHTML":"\u003cp>三个类为WORKSHOP、TRAINER、PARTICIPANT。分别用题目给出的编号识别，记录各自的属性。学习目标是工作坊的multivalued attribute，邮箱是参与者的optional attribute，报名总数可由报名记录计算得到，标为derived attribute。\u003c/p>\n\u003cp>培训主题topic属于“某位培训师教授某个工作坊”的一次分配，不是培训师不随工作坊变化的永久属性。报名日期和状态同样属于参与者与工作坊之间的报名关联。\u003c/p>\n\u003cp>本参考图按同一参与者与同一工作坊之间只记录一次报名理解。若需要重复报名历史，还要明确如何区分多次事件，不能直接认为原关联已经表达全部历史。\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>类\u003c/th>\n\u003cth>属性\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>WORKSHOP\u003c/td>\n\u003ctd>workshopNo [ID]、title、learningObjectives [1..*]、/totalEnrolments\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TRAINER\u003c/td>\n\u003ctd>trainerNo [ID]、name\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PARTICIPANT\u003c/td>\n\u003ctd>participantNo [ID]、name、email [0..1]\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003 =\"301.88,-53.8 301.88,-129.4 446.61,-129.4 446.61,-53.8 301.88,-53.8\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"310.88\" y=\"-108.4\" font-family=\"Arial\" font-size=\"12.00\">workshopNo &#160;ID\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"310.88\" y=\"-94\" font-family=\"Arial\" font-size=\"12.00\">title\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"310.88\" y=\"-79.6\" font-family=\"Arial\" font-size=\"12.00\">learningObjectives [1..*]\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"310.88\" y=\"-65.2\" font-family=\"Arial\" font-size=\"12.00\">/totalEnrolments\u003c/text>\n\u003c/g>\n\u003c!-- TRAINER&#45;&gt;WORKSHOP -->\n\u003cg id=\"g6-edge1\" class=\"edge\">\n\u003ctitle>TRAINER&#45;&gt;WORKSHOP\u003c/title>\n\u003cpath fill=\"none\" stroke=\"#52695d\" d=\"M96.66,-160.76C148.87,-150.77 238.8,-133.54 301.91,-121.46\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"204.63\" y=\"-164.07\" font-family=\"Arial\" font-size=\"10.00\">teaches\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"204.63\" y=\"-152.07\" font-family=\"Arial\" font-size=\"10.00\">{topic}\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"279.21\" y=\"-134.86\" font-family=\"Arial\" font-size=\"10.00\">0..*\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"119.36\" y=\"-141.37\" font-family=\"Arial\" font-size=\"10.00\">1..*\u003c/text>\n\u003c/g>\n\u003c!-- PARTICIPANT -->\n\u003cg id=\"g6-node3\" class=\"node\">\n\u003ctitle>PARTICIPANT\u003c/title>\n\u003cpolygon fill=\"#e6f1ed\" stroke=\"none\" points=\"0,-61.2 0,-93.6 107.37,-93.6 107.37,-61.2 0,-61.2\"/>\n\u003cpolygon fill=\"none\" stroke=\"black\" points=\"0,-61.2 0,-93.6 107.37,-93.6 107.37,-61.2 0,-61.2\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"13.35\" y=\"-74.8\" font-family=\"Arial\" font-weight=\"bold\" font-size=\"12.00\">PARTICIPANT\u003c/text>\n\u003cpolygon fill=\"none\" stroke=\"black\" points=\"0,0 0,-61.2 107.37,-61.2 107.37,0 0,0\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"9\" y=\"-40.2\" font-family=\"Arial\" font-size=\"12.00\">participantNo &#160;ID\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"9\" y=\"-25.8\" font-family=\"Arial\" font-size=\"12.00\">name\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"9\" y=\"-11.4\" font-family=\"Arial\" font-size=\"12.00\">email [0..1]\u003c/text>\n\u003c/g>\n\u003c!-- PARTICIPANT&#45;&gt;WORKSHOP -->\n\u003cg id=\"g6-edge2\" class=\"edge\">\n\u003ctitle>PARTICIPANT&#45;&gt;WORKSHOP\u003c/title>\n\u003cpath fill=\"none\" stroke=\"#52695d\" d=\"M107.29,-56.87C160.48,-67.06 243.05,-82.87 302.07,-94.17\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"204.63\" y=\"-99.56\" font-family=\"Arial\" font-size=\"10.00\">enrols\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"204.63\" y=\"-87.56\" font-family=\"Arial\" font-size=\"10.00\">{enrolmentDate, status}\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"274.92\" y=\"-98.02\" font-family=\"Arial\" font-size=\"10.00\">0..*\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"134.44\" y=\"-47.02\" font-family=\"Arial\" font-size=\"10.00\">0..*\u003c/text>\n\u003c/g>\n\u003c/g>\n\u003c/svg>\n\u003c/div>\u003cfigcaption>同一个ID标签表示组合identifier；不同ID标签表示独立identifier。空心箭头指向父类。 [0..1]可选，[*]多值，/表示derived attribute。\u003c/figcaption>\u003cbutton class=\"zoom\" type=\"button\">放大图\u003c/button>\u003c/figure>"},{"id":"S02","title":"Local identifiers and repeated admissions","topic":"标识符的唯一范围与多次入院","areas":["Conceptual"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"core","question":"A hospital has a unique name. A building number is unique only within its hospital. A ward has a globally unique name and belongs to one building. A deck number is unique only within its ward. An employee number is unique only within a hospital. A patient is identified by the combination of insurance company name and policy number. A patient may be admitted to the same hospital many times. Each admission has a date and a time. Assume that one patient cannot have two admissions at the same hospital at exactly the same date and time.\n\n(1) List complete identifiers for BUILDING, WARD, DECK, EMPLOYEE, PATIENT and ADMISSION.\n(2) Can building number 1 occur in two hospitals? Can deck number 2 occur in two wards?\n(3) Explain why using only PATIENT's identifier for ADMISSION would lose information. Do not add artificial IDs.","answer":"(1) 完整identifier如下。括号内各项需要合起来使用。\n\n| 对象 | 完整identifier |\n| --- | --- |\n| BUILDING | 医院名称+建筑编号 |\n| WARD | 病区名称，因为本题已声明全局唯一 |\n| DECK | 病区名称+分区编号 |\n| EMPLOYEE | 医院名称+员工号 |\n| PATIENT | 保险公司名称+保险单号 |\n| ADMISSION | 保险公司名称+保险单号+医院名称+入院日期+入院时间 |\n\n(2) 两种情况都允许。号码只在各自所属医院或病区的范围内唯一，跨所属范围可以相同。\n\n(3) 病人identifier只区分“是谁”，不能区分同一人“哪一次入院”。日期、时间和医院一起区分多次入院；它们的组合唯一性依赖本补充题已经给出的不同时重复入院假设。","context":"","canonical":null,"parts":[{"number":"1","goal":"写完整identifier","steps":["先区分全局唯一的wardName与局部唯一的楼号、分区号、员工号。","局部号码加所属对象identifier；PATIENT加保险公司与保单号。","ADMISSION再加入医院及入院date/time，使用题目已声明的同刻不重复条件。"],"check":"DECK只需wardName加deckNo，因为wardName已全局唯一。","pitfall":"无必要地把所有祖先名称都加进identifier会丢失最小性。","code":""},{"number":"2","goal":"判断跨owner号码重复是否合法","steps":["固定同一医院时建筑编号不能重复。","换到另一医院，唯一性范围改变，所以同号码可再次使用。","同理，分区号在不同病区可重复。"],"check":"两问答案都可以，且给出唯一范围解释。","pitfall":"局部唯一不等于整个数据库唯一。","code":""},{"number":"3","goal":"解释多次入院为什么不能只用病人键","steps":["同一病人多次入院时，病人identifier保持相同。","若ADMISSION只用病人key，会把不同事件压成同一记录。","按题目保证的医院+日期+时间扩大事件标识，不额外发明ID。"],"check":"一个人和这个人的一次事件不是同一粒度。","pitfall":"姓名或保险单号单独唯一都未由题面保证。","code":""}],"tags":["Composite and alternative identifiers","Local identifiers and qualifiers"],"questionHTML":"\u003cp>A hospital has a unique name. A building number is unique only within its hospital. A ward has a globally unique name and belongs to one building. A deck number is unique only within its ward. An employee number is unique only within a hospital. A patient is identified by the combination of insurance company name and policy number. A patient may be admitted to the same hospital many times. Each admission has a date and a time. Assume that one patient cannot have two admissions at the same hospital at exactly the same date and time.\u003c/p>\n\u003cp>(1) List complete identifiers for BUILDING, WARD, DECK, EMPLOYEE, PATIENT and ADMISSION.\n(2) Can building number 1 occur in two hospitals? Can deck number 2 occur in two wards?\n(3) Explain why using only PATIENT&#39;s identifier for ADMISSION would lose information. Do not add artificial IDs.\u003c/p>\n","answerHTML":"\u003cp>(1) 完整identifier如下。括号内各项需要合起来使用。\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对象\u003c/th>\n\u003cth>完整identifier\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>BUILDING\u003c/td>\n\u003ctd>医院名称+建筑编号\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>WARD\u003c/td>\n\u003ctd>病区名称，因为本题已声明全局唯一\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DECK\u003c/td>\n\u003ctd>病区名称+分区编号\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EMPLOYEE\u003c/td>\n\u003ctd>医院名称+员工号\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PATIENT\u003c/td>\n\u003ctd>保险公司名称+保险单号\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADMISSION\u003c/td>\n\u003ctd>保险公司名称+保险单号+医院名称+入院日期+入院时间\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>(2) 两种情况都允许。号码只在各自所属医院或病区的范围内唯一，跨所属范围可以相同。\u003c/p>\n\u003cp>(3) 病人identifier只区分“是谁”，不能区分同一人“哪一次入院”。日期、时间和医院一起区分多次入院；它们的组合唯一性依赖本补充题已经给出的不同时重复入院假设。\u003c/p>\n"},{"id":"S03","title":"Qualified associations and association attributes","topic":"限定关联和带属性关联的逻辑设计","areas":["Logical"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"core","question":"The conceptual schema has these features:\n\n- HOTEL has code [ID] and name.\n- ROOM is identified by its HOTEL and roomNo; roomNo is unique only within a HOTEL. ROOM also has pricePerNight.\n- GUEST has passportNo [ID] and email [ID2]. Both are mandatory.\n- GUEST and ROOM have a many-to-many association. The association records checkIn and checkOut. Assume that there is at most one recorded stay for each GUEST–ROOM pair.\n- HOTEL has a multivalued attribute amenity [*].\n\nTransform the schema into relational schemas. List attributes, PK, other CK and all FKs, with parents before children. Then state what changes if repeat stays for the same guest and room must be recorded and checkIn is unique for that pair.","answer":"ROOM的完整primary key是酒店编号与房号的组合。STAY记录住客与房间的配对，并保存入住、退房日期。按第一版需求，一个配对最多一条住宿记录，所以配对本身可以作primary key。\n\n如果允许重复住宿，再把checkIn加入STAY的primary key。这个改变成立的依据是新需求明确保证同一配对中checkIn唯一，不是随意增加一个属性。\n\n设施多值可直接用HOTEL_AMENITY逐项记录。若采用课程中的目录类做法，也可先建AMENITY，再让关联表引用它。两种写法都要避免将多个设施塞进一个单值列。\n\n\n```text\nHOTEL(code, name)\nPRIMARY KEY = (code)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n\nGUEST(passportNo, email)\nPRIMARY KEY = (passportNo)\nCANDIDATE KEY1 = (email)\nFOREIGN KEYS = none\n\nROOM(hotelCode, roomNo, pricePerNight)\nPRIMARY KEY = (hotelCode, roomNo)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (hotelCode) REFERENCES HOTEL(code)\n\nHOTEL_AMENITY(hotelCode, amenity)\nPRIMARY KEY = (hotelCode, amenity)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (hotelCode) REFERENCES HOTEL(code)\n\nSTAY(passportNo, hotelCode, roomNo, checkIn, checkOut)\nPRIMARY KEY = (passportNo, hotelCode, roomNo)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (passportNo) REFERENCES GUEST(passportNo)\nFOREIGN KEY2 = (hotelCode, roomNo) REFERENCES ROOM(hotelCode, roomNo)\n```","context":"","canonical":null,"parts":[{"number":"1","goal":"转换qualified association、多值与住宿配对","steps":["ROOM需hotelCode与roomNo共同识别。","STAY保存passportNo与ROOM完整键，以及关联属性checkIn/checkOut。","第一版每配对最多一次住宿，配对本身作primary key；amenity逐项拆表。"],"check":"email是另一个必填唯一identifier，保留candidate key。","pitfall":"不能只用roomNo引用所有酒店的房间。","code":""},{"number":"2","goal":"允许重复住宿后调整key","steps":["同一住客同一房间已有键值会重复，所以旧配对key不足。","题目明确同配对checkIn唯一，把checkIn加入STAY key。","checkOut仍是普通attribute；其他foreign keys保持完整。"],"check":"同人同房间不同checkIn可保存多次。","pitfall":"没有唯一性保证就随意选日期作key，也会出错。","code":""}],"tags":["Association attributes and repeated events","Local identifiers and qualifiers","Multivalued attribute transformation"],"questionHTML":"\u003cp>The conceptual schema has these features:\u003c/p>\n\u003cul>\n\u003cli>HOTEL has code [ID] and name.\u003c/li>\n\u003cli>ROOM is identified by its HOTEL and roomNo; roomNo is unique only within a HOTEL. ROOM also has pricePerNight.\u003c/li>\n\u003cli>GUEST has passportNo [ID] and email [ID2]. Both are mandatory.\u003c/li>\n\u003cli>GUEST and ROOM have a many-to-many association. The association records checkIn and checkOut. Assume that there is at most one recorded stay for each GUEST–ROOM pair.\u003c/li>\n\u003cli>HOTEL has a multivalued attribute amenity [*].\u003c/li>\n\u003c/ul>\n\u003cp>Transform the schema into relational schemas. List attributes, PK, other CK and all FKs, with parents before children. Then state what changes if repeat stays for the same guest and room must be recorded and checkIn is unique for that pair.\u003c/p>\n","answerHTML":"\u003cp>ROOM的完整primary key是酒店编号与房号的组合。STAY记录住客与房间的配对，并保存入住、退房日期。按第一版需求，一个配对最多一条住宿记录，所以配对本身可以作primary key。\u003c/p>\n\u003cp>如果允许重复住宿，再把checkIn加入STAY的primary key。这个改变成立的依据是新需求明确保证同一配对中checkIn唯一，不是随意增加一个属性。\u003c/p>\n\u003cp>设施多值可直接用HOTEL_AMENITY逐项记录。若采用课程中的目录类做法，也可先建AMENITY，再让关联表引用它。两种写法都要避免将多个设施塞进一个单值列。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">HOTEL(code, name)\nPRIMARY KEY = (code)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n\nGUEST(passportNo, email)\nPRIMARY KEY = (passportNo)\nCANDIDATE KEY1 = (email)\nFOREIGN KEYS = none\n\nROOM(hotelCode, roomNo, pricePerNight)\nPRIMARY KEY = (hotelCode, roomNo)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (hotelCode) REFERENCES HOTEL(code)\n\nHOTEL_AMENITY(hotelCode, amenity)\nPRIMARY KEY = (hotelCode, amenity)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (hotelCode) REFERENCES HOTEL(code)\n\nSTAY(passportNo, hotelCode, roomNo, checkIn, checkOut)\nPRIMARY KEY = (passportNo, hotelCode, roomNo)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (passportNo) REFERENCES GUEST(passportNo)\nFOREIGN KEY2 = (hotelCode, roomNo) REFERENCES ROOM(hotelCode, roomNo)\n\u003c/code>\u003c/pre>\n"},{"id":"S04","title":"The superset method and subtype identifiers","topic":"超集法与子类的唯一标识","areas":["Logical"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"core","question":"EMPLOYEE is identified by employeeNo and has name. Each employee is exactly one of DRIVER and SUPPORT. DRIVER has a mandatory licenceNo that is unique among all drivers. SUPPORT has a multivalued qualification [1..*].\n\n(1) Implement the generalization with the superset method. List attributes, PK, other CK or conditional unique constraints, and FKs.\n(2) Identify nullable subtype columns and give a CHECK condition for the employee type and licenceNo.\n(3) Can a single ordinary FK guarantee that only SUPPORT employees have qualification rows, and that every SUPPORT employee has at least one such row? Explain briefly.","answer":"### (1) 超集表和资格明细表\n\nEMPLOYEE保存所有员工，并用employeeType区分类型。licenceNo对司机必填，对支持人员为空。支持人员的多项资格单独存表。非空licenceNo须唯一，但它不能识别整表中没有驾照号的支持人员行。\n\n```text\nEMPLOYEE(employeeNo, name, employeeType, licenceNo)\nPRIMARY KEY = (employeeNo)\nOTHER CANDIDATE KEYS = none for all rows\nCONDITIONAL UNIQUE = non-NULL licenceNo must be unique\nFOREIGN KEYS = none\n\nSUPPORT_QUALIFICATION(employeeNo, qualification)\nPRIMARY KEY = (employeeNo, qualification)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (employeeNo) REFERENCES EMPLOYEE(employeeNo)\n```\n\n### (2) 检查类别与驾照号是否相符\n\n员工类型列本身设为NOT NULL，再用此CHECK规定DRIVER必须有驾照号、SUPPORT必须没有驾照号。另外为licenceNo定义UNIQUE。\n\n(3) 普通foreign key只能保证资格明细所引用的员工存在，不能单独保证这位员工属于SUPPORT，也不能保证每位支持人员至少已有一条资格。\n\n```sql\nCHECK ((employeeType = 'DRIVER' AND licenceNo IS NOT NULL)\n    OR (employeeType = 'SUPPORT' AND licenceNo IS NULL))\n```","context":"","canonical":null,"parts":[{"number":"1","goal":"写superset后的schema","steps":["父类和两个子类合成EMPLOYEE，增加employeeType。","licenceNo移入合表，SUPPORT行用NULL；非空值仍唯一。","qualifications逐项放在SUPPORT_QUALIFICATION，组合key防重复。"],"check":"employeeNo识别所有行；licenceNo仅是司机子集的唯一标识。","pitfall":"可空唯一字段不能在严格理论中识别全表所有行。","code":""},{"number":"2","goal":"用CHECK限制类型和专有列","steps":["employeeType本身NOT NULL，避免UNKNOWN绕过类型条件。","DRIVER要求licenceNo IS NOT NULL；SUPPORT要求其IS NULL。","再加UNIQUE(licenceNo)，CHECK不会代替唯一性。"],"check":"两种类型各自的空值规则与唯一规则都成立。","pitfall":"仅把licenceNo列设NOT NULL会连支持人员一起排除。","code":""},{"number":"3","goal":"判断普通foreign key的表达边界","steps":["foreign key只检查employeeNo在EMPLOYEE中存在。","它不检查所引用行的employeeType是否SUPPORT。","它也不能要求每个SUPPORT父行至少有一子资格行。"],"check":"两条额外业务规则都说明需另外维护。","pitfall":"不能把“有FK”当作已实现全部multiplicity上下限。","code":""}],"tags":["Generalization and subtype properties","One-to-one merge and nullable identifiers","Superset method"],"questionHTML":"\u003cp>EMPLOYEE is identified by employeeNo and has name. Each employee is exactly one of DRIVER and SUPPORT. DRIVER has a mandatory licenceNo that is unique among all drivers. SUPPORT has a multivalued qualification [1..*].\u003c/p>\n\u003cp>(1) Implement the generalization with the superset method. List attributes, PK, other CK or conditional unique constraints, and FKs.\n(2) Identify nullable subtype columns and give a CHECK condition for the employee type and licenceNo.\n(3) Can a single ordinary FK guarantee that only SUPPORT employees have qualification rows, and that every SUPPORT employee has at least one such row? Explain briefly.\u003c/p>\n","answerHTML":"\u003ch3>(1) 超集表和资格明细表\u003c/h3>\n\u003cp>EMPLOYEE保存所有员工，并用employeeType区分类型。licenceNo对司机必填，对支持人员为空。支持人员的多项资格单独存表。非空licenceNo须唯一，但它不能识别整表中没有驾照号的支持人员行。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">EMPLOYEE(employeeNo, name, employeeType, licenceNo)\nPRIMARY KEY = (employeeNo)\nOTHER CANDIDATE KEYS = none for all rows\nCONDITIONAL UNIQUE = non-NULL licenceNo must be unique\nFOREIGN KEYS = none\n\nSUPPORT_QUALIFICATION(employeeNo, qualification)\nPRIMARY KEY = (employeeNo, qualification)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (employeeNo) REFERENCES EMPLOYEE(employeeNo)\n\u003c/code>\u003c/pre>\n\u003ch3>(2) 检查类别与驾照号是否相符\u003c/h3>\n\u003cp>员工类型列本身设为NOT NULL，再用此CHECK规定DRIVER必须有驾照号、SUPPORT必须没有驾照号。另外为licenceNo定义UNIQUE。\u003c/p>\n\u003cp>(3) 普通foreign key只能保证资格明细所引用的员工存在，不能单独保证这位员工属于SUPPORT，也不能保证每位支持人员至少已有一条资格。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">CHECK ((employeeType = &#39;DRIVER&#39; AND licenceNo IS NOT NULL)\n    OR (employeeType = &#39;SUPPORT&#39; AND licenceNo IS NULL))\n\u003c/code>\u003c/pre>\n"},{"id":"S05","title":"Attribute closure and all minimal keys","topic":"计算属性闭包并求全部最小键","areas":["Normalization"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"core","question":"Let $R=(A,B,C,D,E)$ and $F=\\{A\\to B, B\\to C, C\\to A, CD\\to E\\}$.\n\n(1) Compute $A^+$, $D^+$, and $(AD)^+$, showing the steps.\n(2) Derive all minimal keys. Prove that each is minimal and explain why no keys are missing.\n(3) Does $F$ imply $AD\\to E$? Does it imply $A\\to E$? Justify using closure or dependency rules.","answer":"### (1) 三个attribute closure\n\n从A出发，先由$A\to B$得到B，再由$B\to C$得到C。集合中没有D，不能使用$CD\to E$。所以$A^+={A,B,C}$。\n\n从D出发，没有可用的functional dependency增加新属性，所以$D^+={D}$。\n\n从AD出发，先由A取得B、C，再由C和已有D一起取得E：$(AD)^+={A,B,C,D,E}$。\n\n### (2) 全部minimal key\n\nD没有出现在给定依赖的右侧，任何键都必须包含D。只用D或DE不能得到A、B、C；还需要从A、B、C中至少取一个。A、B、C能互相推出，因此AD、BD、CD都能取得全部属性。\n\n这三组都不能再删属性：删D就无法得到D；删另一个属性就只剩D。因此全部minimal key是${A,D}$、${B,D}$、${C,D}$。\n\n### (3) 两条待判断的依赖\n\n$AD\to E$成立，因为E属于$(AD)^+$。$A\to E$不成立，因为E不属于$A^+$。从AD能决定E，不能直接删掉D后声称A仍能决定E。","context":"","canonical":null,"parts":[{"number":"1","goal":"逐步计算三个closures","steps":["A出发用A→B、B→C得到ABC；没有D，不能应用CD→E。","D没有能直接应用的FD，所以D⁺=D。","AD出发取得B/C，再由CD→E取得E，所以AD⁺=ABCDE。"],"check":"每次新增attribute都能对应一条当前左侧已满足的FD。","pitfall":"看到CD→E时必须同时已有C和D。","code":""},{"number":"2","goal":"求全部minimal keys","steps":["D不在任何右侧，因此每个key必须含D。","还需从能互相推出的A/B/C至少取一个；DE不够。","验证AD、BD、CD各自closure全集，删掉任何一项都不够。"],"check":"全部keys恰为AD、BD、CD，没有把superkey当minimal key。","pitfall":"只找到AD就停止会遗漏另外两个。","code":""},{"number":"3","goal":"用closure检验两条待推依赖","steps":["AD⁺中有E，所以AD→E成立。","A⁺中没有E，所以A→E不由F推出。","通过augmentation能加条件，不允许把决定因素D随意删除。"],"check":"结论同时有成立证据和不成立证据。","pitfall":"不能从更大左侧能决定就推出更小左侧也能决定。","code":""}],"tags":["Functional dependencies and attribute closure"],"questionHTML":"\u003cp>Let \u003cspan class=\"math\">R=(A,B,C,D,E)\u003c/span> and \u003cspan class=\"math\">F={A→ B, B→ C, C→ A, CD→ E}\u003c/span>.\u003c/p>\n\u003cp>(1) Compute \u003cspan class=\"math\">A\u003csup>+\u003c/sup>\u003c/span>, \u003cspan class=\"math\">D\u003csup>+\u003c/sup>\u003c/span>, and \u003cspan class=\"math\">(AD)\u003csup>+\u003c/sup>\u003c/span>, showing the steps.\n(2) Derive all minimal keys. Prove that each is minimal and explain why no keys are missing.\n(3) Does \u003cspan class=\"math\">F\u003c/span> imply \u003cspan class=\"math\">AD→ E\u003c/span>? Does it imply \u003cspan class=\"math\">A→ E\u003c/span>? Justify using closure or dependency rules.\u003c/p>\n","answerHTML":"\u003ch3>(1) 三个attribute closure\u003c/h3>\n\u003cp>从A出发，先由\u003cspan class=\"math\">A\to B\u003c/span>得到B，再由\u003cspan class=\"math\">B\to C\u003c/span>得到C。集合中没有D，不能使用\u003cspan class=\"math\">CD\to E\u003c/span>。所以\u003cspan class=\"math\">A\u003csup>+\u003c/sup>={A,B,C}\u003c/span>。\u003c/p>\n\u003cp>从D出发，没有可用的functional dependency增加新属性，所以\u003cspan class=\"math\">D\u003csup>+\u003c/sup>={D}\u003c/span>。\u003c/p>\n\u003cp>从AD出发，先由A取得B、C，再由C和已有D一起取得E：\u003cspan class=\"math\">(AD)\u003csup>+\u003c/sup>={A,B,C,D,E}\u003c/span>。\u003c/p>\n\u003ch3>(2) 全部minimal key\u003c/h3>\n\u003cp>D没有出现在给定依赖的右侧，任何键都必须包含D。只用D或DE不能得到A、B、C；还需要从A、B、C中至少取一个。A、B、C能互相推出，因此AD、BD、CD都能取得全部属性。\u003c/p>\n\u003cp>这三组都不能再删属性：删D就无法得到D；删另一个属性就只剩D。因此全部minimal key是\u003cspan class=\"math\">{A,D}\u003c/span>、\u003cspan class=\"math\">{B,D}\u003c/span>、\u003cspan class=\"math\">{C,D}\u003c/span>。\u003c/p>\n\u003ch3>(3) 两条待判断的依赖\u003c/h3>\n\u003cp>\u003cspan class=\"math\">AD\to E\u003c/span>成立，因为E属于\u003cspan class=\"math\">(AD)\u003csup>+\u003c/sup>\u003c/span>。\u003cspan class=\"math\">A\to E\u003c/span>不成立，因为E不属于\u003cspan class=\"math\">A\u003csup>+\u003c/sup>\u003c/span>。从AD能决定E，不能直接删掉D后声称A仍能决定E。\u003c/p>\n"},{"id":"S06","title":"Converting a repeating group to 1NF","topic":"将含爱好列表的设计改为第一范式","areas":["Normalization"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question Public edition: example names, contact details and password literals anonymized.","origin":"Supplementary practice","priority":"core","question":"A table stores Employee(employeeNo, name, hobbies). One row is (101, 'PARTICIPANT_07', {'reading', 'swimming'}), and another is (102, 'PARTICIPANT_02', {}). Assume employeeNo uniquely identifies an employee, and an employee may have no hobbies.\n\n(1) Identify the 1NF problem.\n(2) Produce a 1NF design with keys that preserves both employees and all recorded hobbies. Do not introduce artificial IDs.\n(3) Show the rows for the two employees. Do not invent a hobby value for PARTICIPANT_02.","answer":"(1) hobbies的一个位置保存了多项独立爱好，形成重复值集合，不符合这里要求的单一atomic value。\n\n(2) 员工基本信息和员工爱好分开记录，键如下。\n\n(3) EMPLOYEE有两行：(101,PARTICIPANT_07)、(102,PARTICIPANT_02)。EMPLOYEE_HOBBY只有两行：(101,reading)、(101,swimming)。PARTICIPANT_02仍保存在员工表中，但没有爱好明细行，不为他编造一个“无爱好”的普通爱好值。\n\n\n```text\nEMPLOYEE(employeeNo, name)\nPRIMARY KEY = (employeeNo)\n\nEMPLOYEE_HOBBY(employeeNo, hobby)\nPRIMARY KEY = (employeeNo, hobby)\nFOREIGN KEY = (employeeNo) REFERENCES EMPLOYEE(employeeNo)\n```","context":"","canonical":null,"parts":[{"number":"1","goal":"指出repeating group","steps":["检查hobbies某个单元格保存的是多项爱好集合。","本设计把每项爱好视为独立值，集合不符合这里的atomic value。","空集合也不能通过编造一个普通字符串替代真实爱好。"],"check":"问题定位到一个字段包含多个独立值。","pitfall":"中文名字含多个字母并不因此不atomic。","code":""},{"number":"2","goal":"给1NF表与完整键","steps":["员工信息留在EMPLOYEE(employeeNo,name)。","每条员工—爱好配对放EMPLOYEE_HOBBY(employeeNo,hobby)。","配对作primary key，employeeNo引用员工，不增加人工HobbyID。"],"check":"一个员工有多爱好可以多行，员工本人只记录一次。","pitfall":"只留员工—爱好表会让零爱好员工无处保存。","code":""},{"number":"3","goal":"写出保留全部信息的实例","steps":["EMPLOYEE中保留101/PARTICIPANT_07、102/PARTICIPANT_02两行。","EMPLOYEE_HOBBY仅两行101/reading、101/swimming。","102没有子行，而不是删除102或捏造None为一项爱好。"],"check":"员工行2条、爱好行2条。","pitfall":"把缺少爱好当成缺少员工。","code":""}],"tags":["Multivalued, optional and derived attributes","1NF and repeating groups"],"questionHTML":"\u003cp>A table stores Employee(employeeNo, name, hobbies). One row is (101, &#39;PARTICIPANT_07&#39;, {&#39;reading&#39;, &#39;swimming&#39;}), and another is (102, &#39;PARTICIPANT_02&#39;, {}). Assume employeeNo uniquely identifies an employee, and an employee may have no hobbies.\u003c/p>\n\u003cp>(1) Identify the 1NF problem.\n(2) Produce a 1NF design with keys that preserves both employees and all recorded hobbies. Do not introduce artificial IDs.\n(3) Show the rows for the two employees. Do not invent a hobby value for PARTICIPANT_02.\u003c/p>\n","answerHTML":"\u003cp>(1) hobbies的一个位置保存了多项独立爱好，形成重复值集合，不符合这里要求的单一atomic value。\u003c/p>\n\u003cp>(2) 员工基本信息和员工爱好分开记录，键如下。\u003c/p>\n\u003cp>(3) EMPLOYEE有两行：(101,PARTICIPANT_07)、(102,PARTICIPANT_02)。EMPLOYEE_HOBBY只有两行：(101,reading)、(101,swimming)。PARTICIPANT_02仍保存在员工表中，但没有爱好明细行，不为他编造一个“无爱好”的普通爱好值。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">EMPLOYEE(employeeNo, name)\nPRIMARY KEY = (employeeNo)\n\nEMPLOYEE_HOBBY(employeeNo, hobby)\nPRIMARY KEY = (employeeNo, hobby)\nFOREIGN KEY = (employeeNo) REFERENCES EMPLOYEE(employeeNo)\n\u003c/code>\u003c/pre>\n"},{"id":"S07","title":"Determining the highest normal form","topic":"四组函数依赖的范式判断","areas":["Normalization"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"core","question":"Each schema is in 1NF. For every case, derive all minimal keys, identify prime/non-prime attributes, test 2NF, 3NF and BCNF, and state the highest normal form with justification. Do not change the attributes.\n\n(1) $R=(P,Q,R,S)$; $F=\\{P\\to Q,Q\\to R,P\\to S\\}$.\n\n(2) $R=(P,Q,R,S)$; $F=\\{PQ\\to R,P\\to S\\}$.\n\n(3) $R=(P,Q,R,S)$; $F=\\{P\\to Q,Q\\to R,R\\to P,R\\to S\\}$.\n\n(4) $R=(P,Q,R,S)$; $F=\\{PQ\\to R,PQ\\to S,R\\to Q\\}$.","answer":"这四组是A4-T4改换字母后的同型练习，推导步骤相同。\n\n### (1) 最高2NF\n\nP没有出现在依赖右侧，所以键必须包含P。$P^+={P,Q,R,S}$，因此唯一candidate key为${P}$。prime attribute为P，non-prime attribute为Q、R、S。\n\n满足2NF，因为本题没有对单属性键的partial dependency。$Q\to R$中Q不是superkey、R是non-prime attribute，因此违反3NF和BCNF。最高2NF。\n\n### (2) 最高1NF\n\nP、Q都不在依赖右侧，所以每个键必须同时包含P和Q。$(PQ)^+={P,Q,R,S}$；P或Q单独都不够。唯一candidate key为${P,Q}$，prime attribute为P、Q，non-prime attribute为R、S。\n\n$P\to S$让non-prime attributeS只依赖键的一部分P，违反2NF。P不是superkey、S非主，所以也违反3NF和BCNF。最高1NF。\n\n### (3) 最高BCNF\n\n$P^+=Q^+=R^+={P,Q,R,S}$，$S^+={S}$。全部candidate key为${P}$、${Q}$、${R}$。prime attribute为P、Q、R，non-prime attribute为S。\n\n所有candidate key都是单属性，满足2NF。任何能够推出新属性的决定因素都包含P、Q、R之一，因而是superkey；只含S不能推出其他属性。因此满足BCNF和3NF，最高BCNF。\n\n### (4) 最高3NF\n\nP必须出现在每个键中。PQ、PR的closure都是全部属性；P单独或PS都不能得到Q、R。因此全部candidate key为${P,Q}$和${P,R}$。prime attribute为P、Q、R，non-prime attribute为S。\n\nP、Q、R单独都不能得到S，所以S没有对candidate key真子集的partial dependency，满足2NF。$PQ\to R$、$PQ\to S$的左侧是superkey；$R\to Q$的右侧Q是prime attribute，因此满足3NF。但R的closure只有R、Q，R不是superkey，所以$R\to Q$违反BCNF。最高3NF。","context":"","canonical":null,"parts":[{"number":"1","goal":"唯一key是{P}，最高2NF","steps":["P不在给定FD右侧，所以key必须含P；P→Q、P→R、R→S逐步得到P⁺=PQRS。","P单独足够且不能再删；prime attribute只有P，Q/R/S都是non-prime。","2NF成立；R⁺=RS不是superkey，R→S右侧S又非prime，因此3NF和BCNF失败。"],"check":"指出具体违规FD R→S，而不只说有传递依赖。","pitfall":"不能把P→R也判为3NF违规，因为P是key。","code":""},{"number":"2","goal":"唯一key是{P,Q}，最高1NF","steps":["P、Q都无法从其他属性推出，每个key必须同时含P和Q。","P⁺=PR、Q⁺=QS，PQ⁺=PQRS，因此PQ是唯一minimal key。","P→R、Q→S让non-prime attributes依赖key真子集，违反2NF，也违反3NF/BCNF。"],"check":"列出PQ，并同时证明P或Q单独不够。","pitfall":"“含P/Q”这类斜线写法可能读成二选一；应写同时包含。","code":""},{"number":"3","goal":"keys为{P}、{Q}、{R}，最高BCNF","steps":["P→Q→R→S，Q→R→P并到S，R→P→Q且到S，所以P/Q/R单独都决定全体。","S⁺只有S，单独S不是key；包含P/Q/R的更大集合不minimal，所以keys已列全。","2NF成立；能推出新属性的决定因素必含一个单属性key，所以全部非平凡FD左侧是superkey，3NF/BCNF都成立。"],"check":"区分三个单属性keys，不是一个三属性key。","pitfall":"出现依赖链不自动意味着不满足3NF。","code":""},{"number":"4","goal":"keys为{P,Q}、{P,R}，最高3NF","steps":["P不能由右侧推出，因此每个key必须含P。PQ由给定FD得到RS；PR由R→Q再取得S。","P、Q、R单独不能决定S，故non-prime S没有partial dependency，满足2NF。","R→Q中R非superkey，但Q属于key PQ，是prime，因此3NF成立；这条FD仍违反更严格的BCNF。"],"check":"给出R⁺=QR作为非superkey证据。","pitfall":"只看选中PQ而漏PR，会把R的prime属性判断错。","code":""}],"tags":["All minimal keys and prime attributes","Full and partial dependency; 2NF"],"questionHTML":"\u003cp>Each schema is in 1NF. For every case, derive all minimal keys, identify prime/non-prime attributes, test 2NF, 3NF and BCNF, and state the highest normal form with justification. Do not change the attributes.\u003c/p>\n\u003cp>(1) \u003cspan class=\"math\">R=(P,Q,R,S)\u003c/span>; \u003cspan class=\"math\">F={P→ Q,Q→ R,P→ S}\u003c/span>.\u003c/p>\n\u003cp>(2) \u003cspan class=\"math\">R=(P,Q,R,S)\u003c/span>; \u003cspan class=\"math\">F={PQ→ R,P→ S}\u003c/span>.\u003c/p>\n\u003cp>(3) \u003cspan class=\"math\">R=(P,Q,R,S)\u003c/span>; \u003cspan class=\"math\">F={P→ Q,Q→ R,R→ P,R→ S}\u003c/span>.\u003c/p>\n\u003cp>(4) \u003cspan class=\"math\">R=(P,Q,R,S)\u003c/span>; \u003cspan class=\"math\">F={PQ→ R,PQ→ S,R→ Q}\u003c/span>.\u003c/p>\n","answerHTML":"\u003cp>这四组是A4-T4改换字母后的同型练习，推导步骤相同。\u003c/p>\n\u003ch3>(1) 最高2NF\u003c/h3>\n\u003cp>P没有出现在依赖右侧，所以键必须包含P。\u003cspan class=\"math\">P\u003csup>+\u003c/sup>={P,Q,R,S}\u003c/span>，因此唯一candidate key为\u003cspan class=\"math\">{P}\u003c/span>。prime attribute为P，non-prime attribute为Q、R、S。\u003c/p>\n\u003cp>满足2NF，因为本题没有对单属性键的partial dependency。\u003cspan class=\"math\">Q\to R\u003c/span>中Q不是superkey、R是non-prime attribute，因此违反3NF和BCNF。最高2NF。\u003c/p>\n\u003ch3>(2) 最高1NF\u003c/h3>\n\u003cp>P、Q都不在依赖右侧，所以每个键必须同时包含P和Q。\u003cspan class=\"math\">(PQ)\u003csup>+\u003c/sup>={P,Q,R,S}\u003c/span>；P或Q单独都不够。唯一candidate key为\u003cspan class=\"math\">{P,Q}\u003c/span>，prime attribute为P、Q，non-prime attribute为R、S。\u003c/p>\n\u003cp>\u003cspan class=\"math\">P\to S\u003c/span>让non-prime attributeS只依赖键的一部分P，违反2NF。P不是superkey、S非主，所以也违反3NF和BCNF。最高1NF。\u003c/p>\n\u003ch3>(3) 最高BCNF\u003c/h3>\n\u003cp>\u003cspan class=\"math\">P\u003csup>+\u003c/sup>=Q\u003csup>+\u003c/sup>=R\u003csup>+\u003c/sup>={P,Q,R,S}\u003c/span>，\u003cspan class=\"math\">S\u003csup>+\u003c/sup>={S}\u003c/span>。全部candidate key为\u003cspan class=\"math\">{P}\u003c/span>、\u003cspan class=\"math\">{Q}\u003c/span>、\u003cspan class=\"math\">{R}\u003c/span>。prime attribute为P、Q、R，non-prime attribute为S。\u003c/p>\n\u003cp>所有candidate key都是单属性，满足2NF。任何能够推出新属性的决定因素都包含P、Q、R之一，因而是superkey；只含S不能推出其他属性。因此满足BCNF和3NF，最高BCNF。\u003c/p>\n\u003ch3>(4) 最高3NF\u003c/h3>\n\u003cp>P必须出现在每个键中。PQ、PR的closure都是全部属性；P单独或PS都不能得到Q、R。因此全部candidate key为\u003cspan class=\"math\">{P,Q}\u003c/span>和\u003cspan class=\"math\">{P,R}\u003c/span>。prime attribute为P、Q、R，non-prime attribute为S。\u003c/p>\n\u003cp>P、Q、R单独都不能得到S，所以S没有对candidate key真子集的partial dependency，满足2NF。\u003cspan class=\"math\">PQ\to R\u003c/span>、\u003cspan class=\"math\">PQ\to S\u003c/span>的左侧是superkey；\u003cspan class=\"math\">R\to Q\u003c/span>的右侧Q是prime attribute，因此满足3NF。但R的closure只有R、Q，R不是superkey，所以\u003cspan class=\"math\">R\to Q\u003c/span>违反BCNF。最高3NF。\u003c/p>\n"},{"id":"S08","title":"Prime attributes and 3NF","topic":"检查主属性与第三范式","areas":["Normalization"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"core","question":"Assume $R=(A,B,C)$ is in 1NF and $F=\\{AB\\to C,C\\to B\\}$.\n\n(1) Derive all minimal keys.\n(2) A student says, “C is not a superkey, so C → B violates 3NF.” Decide whether this is correct and justify your answer.\n(3) Determine the highest normal form. Test 2NF, 3NF and BCNF explicitly.","answer":"(1) A不在给定依赖的右侧，任何键都必须包含A。$(AB)^+={A,B,C}$，$(AC)^+={A,B,C}$，而$A^+={A}$。全部minimal key是${A,B}$和${A,C}$。A、B、C都属于至少一个candidate key，所以都是prime attribute。\n\n(2) 学生的判断不正确。对non-trivial functional dependency$X\to Y$，3NF允许左侧是superkey，或者右侧各属性是prime attribute。虽然C不是superkey，但$C\to B$的右侧B是prime attribute，所以这条依赖不违反3NF。\n\n(3) 没有non-prime attribute，因此不存在违反2NF的partial dependency。$AB\to C$的左侧是superkey，$C\to B$的右侧是prime attribute，所以满足3NF。C不能决定A，不是superkey；non-trivial functional dependency$C\to B$违反BCNF。因此最高范式是3NF。","context":"","canonical":null,"parts":[{"number":"1","goal":"求AB与AC两个keys","steps":["A不在右侧，任何key需含A。","AB由AB→C得到全部；AC由C→B得到全部。","A、B、C单独都不能得到全集，所以两个组合都minimal。"],"check":"A/B/C都属于某个candidate key，因此全为prime。","pitfall":"只按选中的AB看prime会漏掉C。","code":""},{"number":"2","goal":"判断学生对3NF的说法","steps":["先确认C⁺=BC，C不是superkey。","3NF还允许右侧为prime attribute；B属于key AB。","所以C→B不违反3NF，学生把BCNF条件误套给3NF。"],"check":"解释右侧属性条件，而不是只回答对/错。","pitfall":"BCNF没有“右侧prime即可”的例外。","code":""},{"number":"3","goal":"逐级给最高normal form","steps":["无non-prime attribute，2NF不存在相应partial dependency违规。","AB→C左侧superkey，C→B右侧prime，满足3NF。","C→B左侧非superkey，所以不满足BCNF，最高3NF。"],"check":"同一条C→B在3NF和BCNF下结论不同。","pitfall":"不能把一条FD不违反3NF误认为自动满足BCNF。","code":""}],"tags":["All minimal keys and prime attributes","3NF versus BCNF with justification"],"questionHTML":"\u003cp>Assume \u003cspan class=\"math\">R=(A,B,C)\u003c/span> is in 1NF and \u003cspan class=\"math\">F={AB→ C,C→ B}\u003c/span>.\u003c/p>\n\u003cp>(1) Derive all minimal keys.\n(2) A student says, “C is not a superkey, so C → B violates 3NF.” Decide whether this is correct and justify your answer.\n(3) Determine the highest normal form. Test 2NF, 3NF and BCNF explicitly.\u003c/p>\n","answerHTML":"\u003cp>(1) A不在给定依赖的右侧，任何键都必须包含A。\u003cspan class=\"math\">(AB)\u003csup>+\u003c/sup>={A,B,C}\u003c/span>，\u003cspan class=\"math\">(AC)\u003csup>+\u003c/sup>={A,B,C}\u003c/span>，而\u003cspan class=\"math\">A\u003csup>+\u003c/sup>={A}\u003c/span>。全部minimal key是\u003cspan class=\"math\">{A,B}\u003c/span>和\u003cspan class=\"math\">{A,C}\u003c/span>。A、B、C都属于至少一个candidate key，所以都是prime attribute。\u003c/p>\n\u003cp>(2) 学生的判断不正确。对non-trivial functional dependency\u003cspan class=\"math\">X\to Y\u003c/span>，3NF允许左侧是superkey，或者右侧各属性是prime attribute。虽然C不是superkey，但\u003cspan class=\"math\">C\to B\u003c/span>的右侧B是prime attribute，所以这条依赖不违反3NF。\u003c/p>\n\u003cp>(3) 没有non-prime attribute，因此不存在违反2NF的partial dependency。\u003cspan class=\"math\">AB\to C\u003c/span>的左侧是superkey，\u003cspan class=\"math\">C\to B\u003c/span>的右侧是prime attribute，所以满足3NF。C不能决定A，不是superkey；non-trivial functional dependency\u003cspan class=\"math\">C\to B\u003c/span>违反BCNF。因此最高范式是3NF。\u003c/p>\n"},{"id":"S09","title":"Single-attribute keys and 2NF","topic":"检验单属性主键与第二范式的关系","areas":["Normalization"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"core","question":"Assume $R=(A,B,C,D)$ is in 1NF and $F=\\{A\\to B,A\\to C,BC\\to A,B\\to D\\}$.\n\n(1) Derive all minimal keys and classify prime/non-prime attributes.\n(2) A student chooses A as the primary key and claims that the schema must be in 2NF because A has only one attribute. Evaluate the claim.\n(3) Determine the highest normal form and identify a violating FD for each failed higher normal form.","answer":"(1) $A^+={A,B,C,D}$，$(BC)^+={A,B,C,D}$。$B^+={B,D}$，$C^+={C}$，所以B或C单独都不是键。\n\n若不包含A，必须同时包含B、C才能使用$BC\to A$取得A。因此全部minimal key是${A}$和${B,C}$。prime attribute为A、B、C；non-prime attribute为D。\n\n(2) 只检查选中的primary keyA不够，还要检查另一个candidate key${B,C}$。$B\to D$说明non-prime attributeD只依赖这个candidate key中的一部分B，已经违反2NF。\n\n(3) 最高范式是题目已保证的1NF。$B\to D$还违反3NF，因为B不是superkey、D非主；同样违反BCNF，因为左侧B不是superkey。\n\n可以使用的结论是“所有candidate key都是单属性时，满足这里的2NF条件”。不能把它改成“只要选了一个单属性primary key，就一定满足2NF”。","context":"","canonical":null,"parts":[{"number":"1","goal":"列出单属性key A与组合key BC","steps":["A→BC，B→D，所以A⁺=ABCD。","BC→A再取得D，所以BC⁺=ABCD。","不含A时须同时取得B/C才能触发BC→A；B⁺=BD、C⁺=C都不够。"],"check":"全部keys是A、BC；D非prime。","pitfall":"存在A并不排除另一个minimal组合key。","code":""},{"number":"2","goal":"检验“选单属性PK就必在2NF”","steps":["2NF要考虑所有candidate keys，不只当前primary key。","对于key BC，B是其真子集。","B→D让non-prime D依赖该真子集，因此学生结论不成立。"],"check":"明确指出另一个key和具体FD。","pitfall":"把“所有keys均单属性”误换成“存在一个单属性key”。","code":""},{"number":"3","goal":"指出每个失败normal form的证据","steps":["B→D的partial dependency违反2NF。","B非superkey、D非prime，违反3NF。","同一非平凡FD左侧非superkey，也违反BCNF；最高是已知1NF。"],"check":"三个检验均有条件对应，不靠猜标签。","pitfall":"不要因为A→BC左侧是key，就忽略另一个违规FD。","code":""}],"tags":["All minimal keys and prime attributes","Full and partial dependency; 2NF"],"questionHTML":"\u003cp>Assume \u003cspan class=\"math\">R=(A,B,C,D)\u003c/span> is in 1NF and \u003cspan class=\"math\">F={A→ B,A→ C,BC→ A,B→ D}\u003c/span>.\u003c/p>\n\u003cp>(1) Derive all minimal keys and classify prime/non-prime attributes.\n(2) A student chooses A as the primary key and claims that the schema must be in 2NF because A has only one attribute. Evaluate the claim.\n(3) Determine the highest normal form and identify a violating FD for each failed higher normal form.\u003c/p>\n","answerHTML":"\u003cp>(1) \u003cspan class=\"math\">A\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>，\u003cspan class=\"math\">(BC)\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>。\u003cspan class=\"math\">B\u003csup>+\u003c/sup>={B,D}\u003c/span>，\u003cspan class=\"math\">C\u003csup>+\u003c/sup>={C}\u003c/span>，所以B或C单独都不是键。\u003c/p>\n\u003cp>若不包含A，必须同时包含B、C才能使用\u003cspan class=\"math\">BC\to A\u003c/span>取得A。因此全部minimal key是\u003cspan class=\"math\">{A}\u003c/span>和\u003cspan class=\"math\">{B,C}\u003c/span>。prime attribute为A、B、C；non-prime attribute为D。\u003c/p>\n\u003cp>(2) 只检查选中的primary keyA不够，还要检查另一个candidate key\u003cspan class=\"math\">{B,C}\u003c/span>。\u003cspan class=\"math\">B\to D\u003c/span>说明non-prime attributeD只依赖这个candidate key中的一部分B，已经违反2NF。\u003c/p>\n\u003cp>(3) 最高范式是题目已保证的1NF。\u003cspan class=\"math\">B\to D\u003c/span>还违反3NF，因为B不是superkey、D非主；同样违反BCNF，因为左侧B不是superkey。\u003c/p>\n\u003cp>可以使用的结论是“所有candidate key都是单属性时，满足这里的2NF条件”。不能把它改成“只要选了一个单属性primary key，就一定满足2NF”。\u003c/p>\n"},{"id":"S10","title":"BCNF decomposition: losslessness and dependency preservation","topic":"分解关系并检验无损性与依赖保持","areas":["Normalization"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"method","question":"Assume $R=(A,B,C)$ is in 1NF and $F=\\{AB\\to C,C\\to B\\}$.\n\n(1) Identify a BCNF violation and decompose R into BCNF schemas using it.\n(2) List the keys and projected nontrivial FDs of the resulting schemas.\n(3) Is the decomposition lossless? Is it dependency-preserving? Justify both answers.\n\nThis is a method-extension exercise. In a question that asks only for the highest normal form, do not replace the requested original schema with a decomposition.","answer":"(1) C的closure只有B、C，不是整个关系，所以C不是superkey。non-trivial functional dependency$C\to B$违反BCNF。按这条依赖分为$R_1=(C,B)$、$R_2=(A,C)$。\n\n(2) 在$R_1$中，投影出的non-trivial functional dependency为$C\to B$及其逻辑后果，candidate key是${C}$。在$R_2$中，没有非平凡functional dependency，candidate key是${A,C}$。两个关系都满足BCNF。\n\n(3) **无损性成立**：两个关系共同的属性是C，且C能决定$R_1$的全部属性。按二元lossless decomposition的检验条件，这次分解无损。\n\n**dependency preservation不成立**：分解后的局部依赖不能推出原来的$AB\to C$。仅凭$C\to B$，从AB出发仍得不到C。因此不能只通过分别检查两个分表的依赖来保证原来的全部依赖。\n\n无损和dependency preservation是两项分别检查的性质，不能用其中一个结论代替另一个。本补充题练习分解方法，不表示老师已经明确承诺考这两项证明。","context":"","canonical":null,"parts":[{"number":"1","goal":"按C→B进行BCNF分解","steps":["先求C⁺=BC，确认C不能决定A。","因此非平凡C→B违反BCNF。","按它分出CB，并保留余下AC；不是随意挑两个二列表。"],"check":"两表attributes合起来仍覆盖原ABC。","pitfall":"CB和AB虽覆盖ABC，却会丢失A与C的配对。","code":""},{"number":"2","goal":"检查分表projected FDs与keys","steps":["CB中保留C→B，key为C，所以BCNF。","AC中没有非平凡projected FD，key为AC。","不要把原AB→C直接写成AC中不成立的A→C。"],"check":"每个表的FD只能涉及其自身attributes。","pitfall":"projected dependencies不是删除原FD中不在表内的字母。","code":""},{"number":"3","goal":"分别检查lossless与dependency preservation","steps":["交集为C，C→CB决定第一表，因此二元分解lossless。","仅用分表局部C→B，从AB不能推出C，因此不保持AB→C。","两项性质独立；需要维护原FD时要跨表检查，不能因lossless就称全部约束保留。"],"check":"有lossless的交集判据，也有不保持依赖的反推证据。","pitfall":"“能还原信息”与“局部约束足够保证所有原FD”不是同一问题。","code":""}],"tags":["Lossless decomposition and dependency preservation"],"questionHTML":"\u003cp>Assume \u003cspan class=\"math\">R=(A,B,C)\u003c/span> is in 1NF and \u003cspan class=\"math\">F={AB→ C,C→ B}\u003c/span>.\u003c/p>\n\u003cp>(1) Identify a BCNF violation and decompose R into BCNF schemas using it.\n(2) List the keys and projected nontrivial FDs of the resulting schemas.\n(3) Is the decomposition lossless? Is it dependency-preserving? Justify both answers.\u003c/p>\n\u003cp>This is a method-extension exercise. In a question that asks only for the highest normal form, do not replace the requested original schema with a decomposition.\u003c/p>\n","answerHTML":"\u003cp>(1) C的closure只有B、C，不是整个关系，所以C不是superkey。non-trivial functional dependency\u003cspan class=\"math\">C\to B\u003c/span>违反BCNF。按这条依赖分为\u003cspan class=\"math\">R\u003csub>1\u003c/sub>=(C,B)\u003c/span>、\u003cspan class=\"math\">R\u003csub>2\u003c/sub>=(A,C)\u003c/span>。\u003c/p>\n\u003cp>(2) 在\u003cspan class=\"math\">R\u003csub>1\u003c/sub>\u003c/span>中，投影出的non-trivial functional dependency为\u003cspan class=\"math\">C\to B\u003c/span>及其逻辑后果，candidate key是\u003cspan class=\"math\">{C}\u003c/span>。在\u003cspan class=\"math\">R\u003csub>2\u003c/sub>\u003c/span>中，没有非平凡functional dependency，candidate key是\u003cspan class=\"math\">{A,C}\u003c/span>。两个关系都满足BCNF。\u003c/p>\n\u003cp>(3) \u003cstrong>无损性成立\u003c/strong>：两个关系共同的属性是C，且C能决定\u003cspan class=\"math\">R\u003csub>1\u003c/sub>\u003c/span>的全部属性。按二元lossless decomposition的检验条件，这次分解无损。\u003c/p>\n\u003cp>\u003cstrong>dependency preservation不成立\u003c/strong>：分解后的局部依赖不能推出原来的\u003cspan class=\"math\">AB\to C\u003c/span>。仅凭\u003cspan class=\"math\">C\to B\u003c/span>，从AB出发仍得不到C。因此不能只通过分别检查两个分表的依赖来保证原来的全部依赖。\u003c/p>\n\u003cp>无损和dependency preservation是两项分别检查的性质，不能用其中一个结论代替另一个。本补充题练习分解方法，不表示老师已经明确承诺考这两项证明。\u003c/p>\n"},{"id":"S11","title":"NULL, text conditions and dates","topic":"NULL、字符串与日期条件","areas":["SELECT"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"core","question":"Use the original workshop database.\n\n(1) Find participantNo and fullName for participants whose email is unknown. Do not treat an empty string as NULL.\n(2) Find workshopNo and title when the title contains the word DATABASE, regardless of letter case, and category is either TECHNOLOGY or BUSINESS.\n(3) Find workshopNo and date for workshops occurring in June 2026. Write a date range that includes all June dates and excludes 1 July.\n(4) List each participant's email, displaying 'NO EMAIL' when it is NULL. Preserve any non-NULL value, including an empty string.","answer":"(1) 用IS NULL查未知邮箱，不能用等号与NULL比较。原数据符合者为4、8、12。\n\n(2) 先用UPPER统一标题大小写，再用LIKE查包含DATABASE的文本，同时限定类别。原装载数据没有符合记录，零行结果是正常的。\n\n(3) 用“日期不早于6月1日，并且早于7月1日”的范围覆盖整个6月。原数据符合工作坊7、8。\n\n(4) COALESCE只在邮箱为NULL时替换为NO EMAIL。空字符串不是NULL，因此仍保留为空字符串。\n\n\n```sql\n-- (1)\nSELECT participantNo, CONCAT(fname, ' ', lname) AS fullName\nFROM Participant WHERE email IS NULL;\n\n-- (2)\nSELECT workshopNo, title\nFROM Workshop\nWHERE UPPER(title) LIKE '%DATABASE%'\n  AND category IN ('TECHNOLOGY', 'BUSINESS');\n\n-- (3)\nSELECT workshopNo, `date`\nFROM Workshop\nWHERE `date` >= '2026-06-01' AND `date` \u003c '2026-07-01';\n\n-- (4)\nSELECT participantNo, COALESCE(email, 'NO EMAIL') AS displayedEmail\nFROM Participant;\n```","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"查邮箱未知","steps":["从Participant取编号、拼接全名。","用email IS NULL判断缺失。","空字符串不包含在未知集合中。"],"check":"原数据4、8、12。","pitfall":"=NULL和IS NULL不能替换。","code":"```sql\nSELECT participantNo, CONCAT(fname, ' ', lname) AS fullName\nFROM Participant WHERE email IS NULL;\n```"},{"number":"2","goal":"同时处理标题文本与类别集合","steps":["UPPER(title)统一大小写，再LIKE %DATABASE%。","category IN (TECHNOLOGY,BUSINESS)限定任一目标类别。","两个条件用AND，输出编号和标题。"],"check":"原数据无匹配，空结果正常。","pitfall":"不要把AND改成OR让所有指定类别都入选。","code":"```sql\nSELECT workshopNo, title\nFROM Workshop\nWHERE UPPER(title) LIKE '%DATABASE%'\n  AND category IN ('TECHNOLOGY', 'BUSINESS');\n```"},{"number":"3","goal":"覆盖2026年6月的日期范围","steps":["下界设为2026-06-01并包含它。","上界设为2026-07-01并排除它。","不用猜月底最后一秒，也不把7月1日包含进来。"],"check":"原数据workshop7、8。","pitfall":"BETWEEN六月1日和七月1日会包含七月边界。","code":"```sql\nSELECT workshopNo, `date`\nFROM Workshop\nWHERE `date` >= '2026-06-01' AND `date` \u003c '2026-07-01';\n```"},{"number":"4","goal":"仅替换NULL的邮箱显示","steps":["SELECT参与者编号和COALESCE(email,NO EMAIL)。","COALESCE遇到非NULL原值就保留，包括空字符串。","这是结果显示，不UPDATE原邮箱。"],"check":"数据库保存的email没有被改写。","pitfall":"把空字符串也一律转换会违背“保留非NULL值”。","code":"```sql\nSELECT participantNo, COALESCE(email, 'NO EMAIL') AS displayedEmail\nFROM Participant;\n```"}],"tags":["Projection, filters, Boolean conditions and sorting","NULL, empty strings and three-valued logic","Row functions, strings, arithmetic and dates"],"questionHTML":"\u003cp>Use the original workshop database.\u003c/p>\n\u003cp>(1) Find participantNo and fullName for participants whose email is unknown. Do not treat an empty string as NULL.\n(2) Find workshopNo and title when the title contains the word DATABASE, regardless of letter case, and category is either TECHNOLOGY or BUSINESS.\n(3) Find workshopNo and date for workshops occurring in June 2026. Write a date range that includes all June dates and excludes 1 July.\n(4) List each participant&#39;s email, displaying &#39;NO EMAIL&#39; when it is NULL. Preserve any non-NULL value, including an empty string.\u003c/p>\n","answerHTML":"\u003cp>(1) 用IS NULL查未知邮箱，不能用等号与NULL比较。原数据符合者为4、8、12。\u003c/p>\n\u003cp>(2) 先用UPPER统一标题大小写，再用LIKE查包含DATABASE的文本，同时限定类别。原装载数据没有符合记录，零行结果是正常的。\u003c/p>\n\u003cp>(3) 用“日期不早于6月1日，并且早于7月1日”的范围覆盖整个6月。原数据符合工作坊7、8。\u003c/p>\n\u003cp>(4) COALESCE只在邮箱为NULL时替换为NO EMAIL。空字符串不是NULL，因此仍保留为空字符串。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nSELECT participantNo, CONCAT(fname, &#39; &#39;, lname) AS fullName\nFROM Participant WHERE email IS NULL;\n\n-- (2)\nSELECT workshopNo, title\nFROM Workshop\nWHERE UPPER(title) LIKE &#39;%DATABASE%&#39;\n  AND category IN (&#39;TECHNOLOGY&#39;, &#39;BUSINESS&#39;);\n\n-- (3)\nSELECT workshopNo, `date`\nFROM Workshop\nWHERE `date` &gt;= &#39;2026-06-01&#39; AND `date` &lt; &#39;2026-07-01&#39;;\n\n-- (4)\nSELECT participantNo, COALESCE(email, &#39;NO EMAIL&#39;) AS displayedEmail\nFROM Participant;\n\u003c/code>\u003c/pre>\n"},{"id":"S12","title":"Self-joins, UNION and UNION ALL","topic":"同城参与者配对与名称合并查询","areas":["SELECT"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"core","question":"Use the original workshop database.\n\n(1) Find every unordered pair of different participants who live in the same city. List the two participant numbers and the city. Do not return a participant paired with themselves or both (1,4) and (4,1).\n(2) Produce a one-column list of all qualification names recorded either as possessed qualifications or workshop requirements. Remove duplicates.\n(3) Rewrite (2) to preserve duplicates, and explain what one output row represents in each version.","answer":"(1) 把Participant用两个别名连接，要求同城市，且第一个编号小于第二个。这样既排除自身，也只保留一对中的一个方向。原数据有(1,4)、(1,7)、(4,7)。若只写编号不等，仍会同时得到正反两个方向。\n\n(2) UNION把两个来源的名称合并，重复名称只留一行。\n\n(3) UNION ALL保留每条来源记录贡献的行，同一个名称可能出现多次。因此(2)是一种资格名称一行，(3)是一个来源记录一行；它不表示一位参与者或一个工作坊一行。\n\n\n```sql\n-- (1)\nSELECT P1.participantNo AS participant1, P2.participantNo AS participant2,\n       P1.city\nFROM Participant AS P1\nJOIN Participant AS P2\n  ON P1.city = P2.city AND P1.participantNo \u003c P2.participantNo;\n\n-- (2)\nSELECT qname FROM Qualification\nUNION\nSELECT qname FROM Requirement;\n\n-- (3)\nSELECT qname FROM Qualification\nUNION ALL\nSELECT qname FROM Requirement;\n```","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"找同城不同人的无序配对","steps":["Participant使用P1/P2两个aliases连接同一张表。","city相等，同时P1.participantNo\u003cP2.participantNo。","小于号一次同时去掉自身与反向重复。"],"check":"原数据三对(1,4)、(1,7)、(4,7)。","pitfall":"只用\u003c>仍会有(1,4)和(4,1)。","code":"```sql\nSELECT P1.participantNo AS participant1, P2.participantNo AS participant2,\n       P1.city\nFROM Participant AS P1\nJOIN Participant AS P2\n  ON P1.city = P2.city AND P1.participantNo \u003c P2.participantNo;\n```"},{"number":"2","goal":"合并两来源的资格名称并去重","steps":["两条SELECT都只取qname，列数与类型一致。","用UNION合并，自动消除重复名称。","结果每行是一种名字，不是某个资格持有人。"],"check":"同名无论来自几人或几工作坊都只留一行。","pitfall":"JOIN两个来源是在匹配行，不是在合并两个名单。","code":"```sql\nSELECT qname FROM Qualification\nUNION\nSELECT qname FROM Requirement;\n```"},{"number":"3","goal":"保留来源中的重复行","steps":["把UNION改为UNION ALL。","每条输入记录都会贡献一行名称。","解释与去重版的行含义差别，不把重复当查询错误。"],"check":"行数等于两个来源行数之和。","pitfall":"UNION ALL不是每个名称一行。","code":"```sql\nSELECT qname FROM Qualification\nUNION ALL\nSELECT qname FROM Requirement;\n```"}],"tags":["Self-join and alias roles","UNION, duplicates, intersection and difference"],"questionHTML":"\u003cp>Use the original workshop database.\u003c/p>\n\u003cp>(1) Find every unordered pair of different participants who live in the same city. List the two participant numbers and the city. Do not return a participant paired with themselves or both (1,4) and (4,1).\n(2) Produce a one-column list of all qualification names recorded either as possessed qualifications or workshop requirements. Remove duplicates.\n(3) Rewrite (2) to preserve duplicates, and explain what one output row represents in each version.\u003c/p>\n","answerHTML":"\u003cp>(1) 把Participant用两个别名连接，要求同城市，且第一个编号小于第二个。这样既排除自身，也只保留一对中的一个方向。原数据有(1,4)、(1,7)、(4,7)。若只写编号不等，仍会同时得到正反两个方向。\u003c/p>\n\u003cp>(2) UNION把两个来源的名称合并，重复名称只留一行。\u003c/p>\n\u003cp>(3) UNION ALL保留每条来源记录贡献的行，同一个名称可能出现多次。因此(2)是一种资格名称一行，(3)是一个来源记录一行；它不表示一位参与者或一个工作坊一行。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nSELECT P1.participantNo AS participant1, P2.participantNo AS participant2,\n       P1.city\nFROM Participant AS P1\nJOIN Participant AS P2\n  ON P1.city = P2.city AND P1.participantNo &lt; P2.participantNo;\n\n-- (2)\nSELECT qname FROM Qualification\nUNION\nSELECT qname FROM Requirement;\n\n-- (3)\nSELECT qname FROM Qualification\nUNION ALL\nSELECT qname FROM Requirement;\n\u003c/code>\u003c/pre>\n"},{"id":"S13","title":"Universal conditions and avoiding duplicate counts","topic":"查询完成所有课程的人及避免重复计数","areas":["SELECT"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"core","question":"Use the original workshop database.\n\n(1) Find participantNo and fullName for participants who have completed every TECHNOLOGY workshop. Use correlated subqueries. A CANCELLED enrolment does not count as completion. If there are no TECHNOLOGY workshops, every participant qualifies.\n(2) For every workshop, report workshopNo, number of enrolments and number of assigned trainers, including zero counts. Ensure that having several enrolments and several trainers does not multiply either count.","answer":"(1) “完成每一门技术类工作坊”等价于“找不到任何一门技术类工作坊是这个人没有完成的”。外层NOT EXISTS寻找反例；内层NOT EXISTS检查该人是否缺少这门工作坊的已完成报名。没有技术类工作坊时不存在反例，所以全部人满足。原数据中没有人完成全部技术类工作坊，结果为零行。\n\n(2) 先分别统计每个工作坊的报名次数与培训师人数，再把两份每工作坊一行的结果连接回来。这样不会把多条报名与多位培训师相乘。LEFT JOIN保留没有对应明细的工作坊，COALESCE把缺失的统计值显示为0。\n\n\n```sql\n-- (1)\nSELECT P.participantNo, CONCAT(P.fname, ' ', P.lname) AS fullName\nFROM Participant AS P\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM Workshop AS W\n    WHERE W.category = 'TECHNOLOGY'\n      AND NOT EXISTS (\n          SELECT 1\n          FROM Enrolment AS E\n          WHERE E.participantNo = P.participantNo\n            AND E.workshopNo = W.workshopNo\n            AND E.status = 'COMPLETED'\n      )\n);\n\n-- (2)\nSELECT W.workshopNo,\n       COALESCE(EC.totalEnrolments, 0) AS totalEnrolments,\n       COALESCE(TC.totalTrainers, 0) AS totalTrainers\nFROM Workshop AS W\nLEFT JOIN (\n    SELECT workshopNo, COUNT(*) AS totalEnrolments\n    FROM Enrolment GROUP BY workshopNo\n) AS EC ON EC.workshopNo = W.workshopNo\nLEFT JOIN (\n    SELECT workshopNo, COUNT(*) AS totalTrainers\n    FROM WorkshopTrainer GROUP BY workshopNo\n) AS TC ON TC.workshopNo = W.workshopNo;\n```","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"查询完成每门技术工作坊的人","steps":["从每个参与者开始，寻找一个反例：某门TECHNOLOGY工作坊没有该人的已完成报名。","内层NOT EXISTS判断“缺少这门已完成报名”，外层NOT EXISTS表示“不存在这样的反例”。","status必须COMPLETED；没有技术类workshop时反例集合为空，所有人满足。"],"check":"原数据无人符合；删除所有技术工作坊后，应得到全部参与者。","pitfall":"一次TECHNOLOGY报名只说明完成过至少一门，不说明每门。","code":"```sql\nSELECT P.participantNo, CONCAT(P.fname, ' ', P.lname) AS fullName\nFROM Participant AS P\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM Workshop AS W\n    WHERE W.category = 'TECHNOLOGY'\n      AND NOT EXISTS (\n          SELECT 1\n          FROM Enrolment AS E\n          WHERE E.participantNo = P.participantNo\n            AND E.workshopNo = W.workshopNo\n            AND E.status = 'COMPLETED'\n      )\n);\n```"},{"number":"2","goal":"同时统计两种明细而不计数相乘","steps":["分别在Enrolment和WorkshopTrainer中按workshopNo聚合。","把两份每工作坊一行的统计LEFT JOIN回Workshop。","COALESCE把未匹配的统计显示成0；不直接把两张明细全连接后COUNT(*)。"],"check":"工作坊3的4条报名与2位培训师仍为4、2，不是8、8。","pitfall":"COUNT(DISTINCT)有时可补救，但先确定每种计数对象与粒度更可靠。","code":"```sql\nSELECT W.workshopNo,\n       COALESCE(EC.totalEnrolments, 0) AS totalEnrolments,\n       COALESCE(TC.totalTrainers, 0) AS totalTrainers\nFROM Workshop AS W\nLEFT JOIN (\n    SELECT workshopNo, COUNT(*) AS totalEnrolments\n    FROM Enrolment GROUP BY workshopNo\n) AS EC ON EC.workshopNo = W.workshopNo\nLEFT JOIN (\n    SELECT workshopNo, COUNT(*) AS totalTrainers\n    FROM WorkshopTrainer GROUP BY workshopNo\n) AS TC ON TC.workshopNo = W.workshopNo;\n```"}],"tags":["Correlated queries, ties and universal conditions","CTE and derived tables","Independent counts without join multiplication"],"questionHTML":"\u003cp>Use the original workshop database.\u003c/p>\n\u003cp>(1) Find participantNo and fullName for participants who have completed every TECHNOLOGY workshop. Use correlated subqueries. A CANCELLED enrolment does not count as completion. If there are no TECHNOLOGY workshops, every participant qualifies.\n(2) For every workshop, report workshopNo, number of enrolments and number of assigned trainers, including zero counts. Ensure that having several enrolments and several trainers does not multiply either count.\u003c/p>\n","answerHTML":"\u003cp>(1) “完成每一门技术类工作坊”等价于“找不到任何一门技术类工作坊是这个人没有完成的”。外层NOT EXISTS寻找反例；内层NOT EXISTS检查该人是否缺少这门工作坊的已完成报名。没有技术类工作坊时不存在反例，所以全部人满足。原数据中没有人完成全部技术类工作坊，结果为零行。\u003c/p>\n\u003cp>(2) 先分别统计每个工作坊的报名次数与培训师人数，再把两份每工作坊一行的结果连接回来。这样不会把多条报名与多位培训师相乘。LEFT JOIN保留没有对应明细的工作坊，COALESCE把缺失的统计值显示为0。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nSELECT P.participantNo, CONCAT(P.fname, &#39; &#39;, P.lname) AS fullName\nFROM Participant AS P\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM Workshop AS W\n    WHERE W.category = &#39;TECHNOLOGY&#39;\n      AND NOT EXISTS (\n          SELECT 1\n          FROM Enrolment AS E\n          WHERE E.participantNo = P.participantNo\n            AND E.workshopNo = W.workshopNo\n            AND E.status = &#39;COMPLETED&#39;\n      )\n);\n\n-- (2)\nSELECT W.workshopNo,\n       COALESCE(EC.totalEnrolments, 0) AS totalEnrolments,\n       COALESCE(TC.totalTrainers, 0) AS totalTrainers\nFROM Workshop AS W\nLEFT JOIN (\n    SELECT workshopNo, COUNT(*) AS totalEnrolments\n    FROM Enrolment GROUP BY workshopNo\n) AS EC ON EC.workshopNo = W.workshopNo\nLEFT JOIN (\n    SELECT workshopNo, COUNT(*) AS totalTrainers\n    FROM WorkshopTrainer GROUP BY workshopNo\n) AS TC ON TC.workshopNo = W.workshopNo;\n\u003c/code>\u003c/pre>\n"},{"id":"S14","title":"INSERT SELECT, CHECK and ROLLBACK","topic":"INSERT SELECT、约束失败与 ROLLBACK","areas":["DDL/DML"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"core","question":"Use the original workshop database in an isolated practice database.\n\n(1) Create an empty table WorkshopLoad(workshopNo, totalEnrolments), with a primary key and a foreign key to Workshop. Use suitable types.\n(2) Populate it using one INSERT ... SELECT statement. Include every workshop, including those with no enrolments.\n(3) Explain the difference between this two-step method and CREATE TABLE ... AS SELECT with respect to keys.\n(4) Assume Workshop is transactional and has an enforced CHECK(capacity > 0). Show an explicit transaction that increases capacity by 5 for workshop 1 and is then rolled back. State the final capacity if its original value was 40. Then state whether setting capacity = 0 can succeed under the assumed CHECK.","answer":"(1) 先创建空表，并显式定义primary key和foreign key。\n\n(2) INSERT ... SELECT把查询得到的统计行填入已建表。LEFT JOIN保留没有报名的工作坊，统计右侧参与者编号得到0。\n\n(3) 本写法在建空表时已经定义键；CREATE TABLE ... AS SELECT不会自动继承源表键，需要自己定义相应约束。不能误解为这种语句在任何情况下都不允许显式定义约束。\n\n(4) 在题目给定的事务条件下，本事务更新后暂时看到45；ROLLBACK后恢复为40。有效的CHECK(capacity > 0)会拒绝把容量改为0。这个CHECK是本补充题的假设，不是说原始Workshop表已经定义它。DDL的隐式提交也不能被最后的ROLLBACK一并撤回。\n\n\n```sql\n-- (1)\nCREATE TABLE WorkshopLoad (\n    workshopNo DECIMAL(6) NOT NULL,\n    totalEnrolments BIGINT NOT NULL,\n    CONSTRAINT wl_pkey PRIMARY KEY (workshopNo),\n    CONSTRAINT wl_fkey FOREIGN KEY (workshopNo)\n        REFERENCES Workshop(workshopNo)\n);\n\n-- (2)\nINSERT INTO WorkshopLoad (workshopNo, totalEnrolments)\nSELECT W.workshopNo, COUNT(E.participantNo)\nFROM Workshop AS W\nLEFT JOIN Enrolment AS E ON E.workshopNo = W.workshopNo\nGROUP BY W.workshopNo;\n\n-- (4)\nSTART TRANSACTION;\nUPDATE Workshop SET capacity = capacity + 5 WHERE workshopNo = 1;\nROLLBACK;\n```","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"先建带键的统计空表","steps":["workshopNo类型与源表一致，作为primary key。","定义引用Workshop的foreign key。","次数使用足够容量的整数列，不能为空。"],"check":"空表已具备约束再装载。","pitfall":"只创建普通两列而忘了键不满足题目。","code":"```sql\nCREATE TABLE WorkshopLoad (\n    workshopNo DECIMAL(6) NOT NULL,\n    totalEnrolments BIGINT NOT NULL,\n    CONSTRAINT wl_pkey PRIMARY KEY (workshopNo),\n    CONSTRAINT wl_fkey FOREIGN KEY (workshopNo)\n        REFERENCES Workshop(workshopNo)\n);\n```"},{"number":"2","goal":"一次INSERT SELECT装载全部工作坊","steps":["Workshop LEFT JOIN Enrolment保留无报名者。","按workshopNo分组，COUNT(E.participantNo)给0而非1。","INSERT目标列顺序与SELECT输出一致。"],"check":"每workshop一行，没有重复primary key。","pitfall":"目标表是已创建的WorkshopLoad，不是再做CTAS。","code":"```sql\nINSERT INTO WorkshopLoad (workshopNo, totalEnrolments)\nSELECT W.workshopNo, COUNT(E.participantNo)\nFROM Workshop AS W\nLEFT JOIN Enrolment AS E ON E.workshopNo = W.workshopNo\nGROUP BY W.workshopNo;\n```"},{"number":"3","goal":"比较约束建立时点","steps":["两步法先定义表和constraints，再插入数据。","CTAS按查询结构和数据建表，不自动继承源表PK/FK。","必须显式定义或在后续ALTER增加需要的constraints。"],"check":"不是声称所有CTAS语法都绝对不能附带任何定义。","pitfall":"只看列名相同就以为键也复制。","code":""},{"number":"4","goal":"解释显式transaction与CHECK效果","steps":["START TRANSACTION后把workshop1从40改45，本事务可看到45。","ROLLBACK撤回未提交DML，恢复40。","有效CHECK(capacity>0)拒绝改0；该CHECK是本补题假定，并非原DDL已有。"],"check":"不会把DDL也一并认定可由最后ROLLBACK撤回。","pitfall":"autocommit、显式事务和DDL implicit commit需要分别看。","code":"```sql\nSTART TRANSACTION;\nUPDATE Workshop SET capacity = capacity + 5 WHERE workshopNo = 1;\nROLLBACK;\n```"}],"tags":["CHECK, UNIQUE, NOT NULL and numeric capacity","CTAS and INSERT SELECT","TRUNCATE, COMMIT, ROLLBACK and implicit commit"],"questionHTML":"\u003cp>Use the original workshop database in an isolated practice database.\u003c/p>\n\u003cp>(1) Create an empty table WorkshopLoad(workshopNo, totalEnrolments), with a primary key and a foreign key to Workshop. Use suitable types.\n(2) Populate it using one INSERT ... SELECT statement. Include every workshop, including those with no enrolments.\n(3) Explain the difference between this two-step method and CREATE TABLE ... AS SELECT with respect to keys.\n(4) Assume Workshop is transactional and has an enforced CHECK(capacity &gt; 0). Show an explicit transaction that increases capacity by 5 for workshop 1 and is then rolled back. State the final capacity if its original value was 40. Then state whether setting capacity = 0 can succeed under the assumed CHECK.\u003c/p>\n","answerHTML":"\u003cp>(1) 先创建空表，并显式定义primary key和foreign key。\u003c/p>\n\u003cp>(2) INSERT ... SELECT把查询得到的统计行填入已建表。LEFT JOIN保留没有报名的工作坊，统计右侧参与者编号得到0。\u003c/p>\n\u003cp>(3) 本写法在建空表时已经定义键；CREATE TABLE ... AS SELECT不会自动继承源表键，需要自己定义相应约束。不能误解为这种语句在任何情况下都不允许显式定义约束。\u003c/p>\n\u003cp>(4) 在题目给定的事务条件下，本事务更新后暂时看到45；ROLLBACK后恢复为40。有效的CHECK(capacity &gt; 0)会拒绝把容量改为0。这个CHECK是本补充题的假设，不是说原始Workshop表已经定义它。DDL的隐式提交也不能被最后的ROLLBACK一并撤回。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nCREATE TABLE WorkshopLoad (\n    workshopNo DECIMAL(6) NOT NULL,\n    totalEnrolments BIGINT NOT NULL,\n    CONSTRAINT wl_pkey PRIMARY KEY (workshopNo),\n    CONSTRAINT wl_fkey FOREIGN KEY (workshopNo)\n        REFERENCES Workshop(workshopNo)\n);\n\n-- (2)\nINSERT INTO WorkshopLoad (workshopNo, totalEnrolments)\nSELECT W.workshopNo, COUNT(E.participantNo)\nFROM Workshop AS W\nLEFT JOIN Enrolment AS E ON E.workshopNo = W.workshopNo\nGROUP BY W.workshopNo;\n\n-- (4)\nSTART TRANSACTION;\nUPDATE Workshop SET capacity = capacity + 5 WHERE workshopNo = 1;\nROLLBACK;\n\u003c/code>\u003c/pre>\n"},{"id":"S15","title":"Creating, granting and activating roles","topic":"创建、授予和启用角色","areas":["Access"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"core","question":"As root, create a new localhost user practice_reader and a role workshop_reader. The role must allow SELECT on csit882.Workshop and csit882.Enrolment, with no right to propagate these object privileges.\n\n(1) Create the account and role.\n(2) Grant the required SELECT privileges to the role and assign the role to the user.\n(3) Make this role a default role for the user. Also show how the user can activate it in their current connection.\n(4) Show how root removes the role assignment from this user while preserving the role for other users. Does granting a role alone necessarily activate it in an already open connection?","answer":"以下按MySQL8编写，分清root连接和用户自己的连接。\n\n先把SELECT授给角色，再把角色授给用户，这是两个不同的授权动作。SET DEFAULT ROLE设置以后登录时默认启用的角色；用户在已打开的连接中可用SET ROLE启用。\n\n授予对象权限时没有WITH GRANT OPTION，就没有因此获得转授这些对象权限的能力。授予角色时没有WITH ADMIN OPTION，也没有因此获得再授这个角色的能力。\n\n最后用REVOKE撤销这名用户的角色成员资格，角色本身仍保留，不影响其他用户的成员资格。\n\n\n```sql\n-- root: (1)\nCREATE USER 'practice_reader'@'localhost' IDENTIFIED BY '[CHOOSE_PASSWORD]';\nCREATE ROLE 'workshop_reader';\n\n-- root: (2)\nGRANT SELECT ON csit882.Workshop TO 'workshop_reader';\nGRANT SELECT ON csit882.Enrolment TO 'workshop_reader';\nGRANT 'workshop_reader' TO 'practice_reader'@'localhost';\n\n-- root: (3), default for subsequent connections\nSET DEFAULT ROLE 'workshop_reader' TO 'practice_reader'@'localhost';\n\n-- practice_reader, in that user's current connection\nSET ROLE 'workshop_reader';\n\n-- root: (4)\nREVOKE 'workshop_reader' FROM 'practice_reader'@'localhost';\n```","context":"","canonical":null,"parts":[{"number":"1","goal":"创建账号和role","steps":["CREATE USER创建可登录的localhost账号。","CREATE ROLE创建权限集合，不拿role当用户密码。","角色名称与后续GRANT保持一致。"],"check":"user和role分别建立。","pitfall":"把两个对象混成一条GRANT来创建。","code":"```sql\nCREATE USER 'practice_reader'@'localhost' IDENTIFIED BY '[CHOOSE_PASSWORD]';\nCREATE ROLE 'workshop_reader';\n```"},{"number":"2","goal":"先赋对象权限，再赋role","steps":["把两张表SELECT授给role。","不加WITH GRANT OPTION。","再GRANT role TO user；这次语句没有ON对象子句。"],"check":"权限来源链为表→role→user。","pitfall":"授予role与授予对象权限不能混在同一GRANT语法中。","code":"```sql\nGRANT SELECT ON csit882.Workshop TO 'workshop_reader';\nGRANT SELECT ON csit882.Enrolment TO 'workshop_reader';\nGRANT 'workshop_reader' TO 'practice_reader'@'localhost';\n```"},{"number":"3","goal":"区分默认启用和当前启用","steps":["root用SET DEFAULT ROLE ... TO user设置默认角色。","用户在自己的当前连接用SET ROLE启用。","仅授予role不保证已打开连接立刻启用它。"],"check":"知道哪条语句在哪个连接运行。","pitfall":"SET DEFAULT ROLE不是“切换到另一个用户”。","code":"```sql\nSET DEFAULT ROLE 'workshop_reader' TO 'practice_reader'@'localhost';\n\n-- practice_reader, in that user's current connection\nSET ROLE 'workshop_reader';\n```"},{"number":"4","goal":"移除成员关系而保留role","steps":["root执行REVOKE role FROM user。","不DROP ROLE，因此其他用户仍可使用。","没有WITH ADMIN OPTION的成员资格也不能据此转授role。"],"check":"只影响目标成员关系，不破坏共享角色。","pitfall":"DROP ROLE会影响所有成员，不是本题要求。","code":"```sql\nREVOKE 'workshop_reader' FROM 'practice_reader'@'localhost';\n```"}],"tags":["Roles, activation, inheritance and ADMIN OPTION"],"questionHTML":"\u003cp>As root, create a new localhost user practice_reader and a role workshop_reader. The role must allow SELECT on csit882.Workshop and csit882.Enrolment, with no right to propagate these object privileges.\u003c/p>\n\u003cp>(1) Create the account and role.\n(2) Grant the required SELECT privileges to the role and assign the role to the user.\n(3) Make this role a default role for the user. Also show how the user can activate it in their current connection.\n(4) Show how root removes the role assignment from this user while preserving the role for other users. Does granting a role alone necessarily activate it in an already open connection?\u003c/p>\n","answerHTML":"\u003cp>以下按MySQL8编写，分清root连接和用户自己的连接。\u003c/p>\n\u003cp>先把SELECT授给角色，再把角色授给用户，这是两个不同的授权动作。SET DEFAULT ROLE设置以后登录时默认启用的角色；用户在已打开的连接中可用SET ROLE启用。\u003c/p>\n\u003cp>授予对象权限时没有WITH GRANT OPTION，就没有因此获得转授这些对象权限的能力。授予角色时没有WITH ADMIN OPTION，也没有因此获得再授这个角色的能力。\u003c/p>\n\u003cp>最后用REVOKE撤销这名用户的角色成员资格，角色本身仍保留，不影响其他用户的成员资格。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- root: (1)\nCREATE USER &#39;practice_reader&#39;@&#39;localhost&#39; IDENTIFIED BY &#39;[CHOOSE_PASSWORD]&#39;;\nCREATE ROLE &#39;workshop_reader&#39;;\n\n-- root: (2)\nGRANT SELECT ON csit882.Workshop TO &#39;workshop_reader&#39;;\nGRANT SELECT ON csit882.Enrolment TO &#39;workshop_reader&#39;;\nGRANT &#39;workshop_reader&#39; TO &#39;practice_reader&#39;@&#39;localhost&#39;;\n\n-- root: (3), default for subsequent connections\nSET DEFAULT ROLE &#39;workshop_reader&#39; TO &#39;practice_reader&#39;@&#39;localhost&#39;;\n\n-- practice_reader, in that user&#39;s current connection\nSET ROLE &#39;workshop_reader&#39;;\n\n-- root: (4)\nREVOKE &#39;workshop_reader&#39; FROM &#39;practice_reader&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"},{"id":"S16","title":"Revoking privileges from different sources","topic":"根据权限来源撤销读取权或转授权","areas":["Access"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Ind
