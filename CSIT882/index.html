NULL, \n    CONSTRAINT hotel_pkey PRIMARY KEY (code) \n); \nCREATE TABLE ROOM ( \n    hotelCode      CHAR(5) NOT NULL, \n    roomNo         VARCHAR(10) NOT NULL, \n    capacity       DECIMAL(2) NOT NULL, \n    bedType        VARCHAR(30) NOT NULL, \n    pricePerNight  DECIMAL(8,2) NOT NULL, \n    CONSTRAINT room_pkey PRIMARY KEY (hotelCode, roomNo), \n    CONSTRAINT room_fkey1 FOREIGN KEY (hotelCode) \n        REFERENCES HOTEL(code) \n); \nCREATE TABLE RESERVATION ( \n    reservationNo  CHAR(6) NOT NULL, \n    checkIn        DATE NOT NULL, \n    checkOut       DATE NOT NULL, \n    bookingDate    DATE NOT NULL, \n    status         VARCHAR(20) NOT NULL, \n    hotelCode      CHAR(5) NOT NULL, \n    roomNo         VARCHAR(10) NOT NULL, \n    receiptNo      VARCHAR(20) NULL, \n    amount         DECIMAL(8,2) NULL, \n    method         VARCHAR(20) NULL, \n    paidDate       DATE NULL, \n    CONSTRAINT reservation_pkey PRIMARY KEY (reservationNo), \n    CONSTRAINT reservation_ckey1 UNIQUE (receiptNo), \n    CONSTRAINT reservation_fkey1 FOREIGN KEY (hotelCode, roomNo) \n        REFERENCES ROOM(hotelCode, roomNo) \n); \nCREATE TABLE HOTEL_AMENITY ( \n    hotelCode  CHAR(5) NOT NULL, \n    amenity    VARCHAR(50) NOT NULL, \n    CONSTRAINT hotel_amenity_pkey PRIMARY KEY (hotelCode, amenity), \n    CONSTRAINT hotel_amenity_fkey1 FOREIGN KEY (hotelCode) \n        REFERENCES HOTEL(code), \n    CONSTRAINT hotel_amenity_fkey2 FOREIGN KEY (amenity) \n        REFERENCES AMENITY(amenity) \n); \n\nCREATE TABLE GUEST_RESERVATION ( \n    passportNo      VARCHAR(20) NOT NULL, \n    reservationNo   CHAR(6) NOT NULL, \n    CONSTRAINT guest_reservation_pkey PRIMARY KEY (passportNo, reservationNo), \n    CONSTRAINT guest_reservation_fkey1 FOREIGN KEY (passportNo) \n        REFERENCES GUEST(passportNo), \n    CONSTRAINT guest_reservation_fkey2 FOREIGN KEY (reservationNo) \n        REFERENCES RESERVATION(reservationNo) \n);\n```\n\n### (2) 追加邮箱唯一约束\n\nGUEST 已建好，再通过 ALTER TABLE 增加 UNIQUE(email)，防止两位住客使用相同的非空邮箱。此例中的邮箱列本身也为NOT NULL。\n\n```sql\nALTER TABLE GUEST \nADD CONSTRAINT guest_ckey1 UNIQUE (email);\n```\n\n### (3) 插入满足数量要求的数据\n\n样例包含两家酒店，每家两间房，两位住客和两条预订；另外插入必要的设施及关联记录。先有被引用记录，再插入引用它的记录。\n\n```sql\nINSERT INTO GUEST \nVALUES ('P10001', 'GUEST_01', 'SAMPLE', \n        'EMAIL_TOKEN_02', 'PHONE_TOKEN_01'); \n \nINSERT INTO GUEST \nVALUES ('P10002', 'GUEST_02', 'SAMPLE', \n        'EMAIL_TOKEN_05', 'PHONE_TOKEN_14'); \nINSERT INTO AMENITY VALUES ('WiFi'); \nINSERT INTO AMENITY VALUES ('Parking'); \nINSERT INTO AMENITY VALUES ('Gym'); \nINSERT INTO HOTEL \nVALUES ('H001', 'Ocean Resort', 4.5, 'Resort', 2, NULL); \n \nINSERT INTO HOTEL \nVALUES ('H002', 'Central Business Hotel', 4.0, 'Business', NULL, 6); \nINSERT INTO ROOM \nVALUES ('H001', '101', 2, 'Queen', 200.00); \n \nINSERT INTO ROOM \nVALUES ('H001', '102', 4, 'Twin', 260.00); \n \nINSERT INTO ROOM \nVALUES ('H002', '201', 2, 'King', 180.00); \n \nINSERT INTO ROOM \nVALUES ('H002', '202', 1, 'Single', 140.00); \nINSERT INTO RESERVATION \nVALUES ('R00001', '2026-09-10', '2026-09-13', '2026-08-20', \n        'Confirmed', 'H001', '101', \n        'RC001', 600.00, 'Card', '2026-08-20'); \n \nINSERT INTO RESERVATION \nVALUES ('R00002', '2026-10-05', '2026-10-07', '2026-08-21', \n        'Confirmed', 'H002', '201', \n        NULL, NULL, NULL, NULL); \nINSERT INTO HOTEL_AMENITY VALUES ('H001', 'WiFi'); \nINSERT INTO HOTEL_AMENITY VALUES ('H001', 'Gym'); \nINSERT INTO HOTEL_AMENITY VALUES ('H002', 'WiFi'); \nINSERT INTO HOTEL_AMENITY VALUES ('H002', 'Parking'); \n\nINSERT INTO GUEST_RESERVATION VALUES ('P10001', 'R00001'); \nINSERT INTO GUEST_RESERVATION VALUES ('P10002', 'R00002');\n```\n\n### (4) H001全部房间的价格提高10%\n\n原价乘1.10。只筛选H001，不影响另一家酒店。\n\n```sql\nUPDATE ROOM \nSET pricePerNight = pricePerNight * 1.10 \nWHERE hotelCode = 'H001';\n```\n\n### (5) 删除H001及必须先删除的关联记录\n\n先删除关联到该酒店预订的住客—预订配对，再删除预订、酒店—设施配对、客房，最后删除酒店。住客和设施可独立存在，保留它们。此写法通过酒店条件选择全部相关预订，而不只依赖样例中的一个预订号。\n\n```sql\nDELETE GR\nFROM GUEST_RESERVATION AS GR\nJOIN RESERVATION AS R ON R.reservationNo = GR.reservationNo\nWHERE R.hotelCode = 'H001';\n\nDELETE FROM RESERVATION WHERE hotelCode = 'H001';\nDELETE FROM HOTEL_AMENITY WHERE hotelCode = 'H001';\nDELETE FROM ROOM WHERE hotelCode = 'H001';\nDELETE FROM HOTEL WHERE code = 'H001';\n```","context":"","canonical":null,"parts":[{"number":"1","goal":"建立与你的logical design一致的空表","steps":["先确定各列类型和mandatory/optional条件；id、邮箱/电话等用合适字符串长度，价格用精确DECIMAL。","先建独立父表，再建ROOM和RESERVATION等引用表。复合foreign key两端列数、顺序、类型要匹配。","为关联表建立完整composite primary key，付款标识加UNIQUE；此步不装载数据。"],"check":"建表顺序不会引用尚不存在的父表，且与Task1名称一致。","pitfall":"房号不在全局唯一，不能只用roomNo作ROOM的primary key。","code":"```sql\nCREATE TABLE GUEST ( \n    passportNo VARCHAR(20) NOT NULL, \n    firstName  VARCHAR(50) NOT NULL, \n    lastName   VARCHAR(50) NOT NULL, \n    email      VARCHAR(100) NOT NULL, \n    phone      VARCHAR(20) NOT NULL, \n    CONSTRAINT guest_pkey PRIMARY KEY (passportNo) \n); \nCREATE TABLE AMENITY ( \n    amenity VARCHAR(50) NOT NULL, \n    CONSTRAINT amenity_pkey PRIMARY KEY (amenity) \n); \nCREATE TABLE HOTEL ( \n    code             CHAR(5) NOT NULL, \n    name             VARCHAR(100) NOT NULL, \n    rating           DECIMAL(2,1) NULL, \n    typeOfHotel      VARCHAR(20) NULL, \n    poolCount        DECIMAL(3) NULL, \n    conferenceRooms  DECIMAL(3) NULL, \n    CONSTRAINT hotel_pkey PRIMARY KEY (code) \n); \nCREATE TABLE ROOM ( \n    hotelCode      CHAR(5) NOT NULL, \n    roomNo         VARCHAR(10) NOT NULL, \n    capacity       DECIMAL(2) NOT NULL, \n    bedType        VARCHAR(30) NOT NULL, \n    pricePerNight  DECIMAL(8,2) NOT NULL, \n    CONSTRAINT room_pkey PRIMARY KEY (hotelCode, roomNo), \n    CONSTRAINT room_fkey1 FOREIGN KEY (hotelCode) \n        REFERENCES HOTEL(code) \n); \nCREATE TABLE RESERVATION ( \n    reservationNo  CHAR(6) NOT NULL, \n    checkIn        DATE NOT NULL, \n    checkOut       DATE NOT NULL, \n    bookingDate    DATE NOT NULL, \n    status         VARCHAR(20) NOT NULL, \n    hotelCode      CHAR(5) NOT NULL, \n    roomNo         VARCHAR(10) NOT NULL, \n    receiptNo      VARCHAR(20) NULL, \n    amount         DECIMAL(8,2) NULL, \n    method         VARCHAR(20) NULL, \n    paidDate       DATE NULL, \n    CONSTRAINT reservation_pkey PRIMARY KEY (reservationNo), \n    CONSTRAINT reservation_ckey1 UNIQUE (receiptNo), \n    CONSTRAINT reservation_fkey1 FOREIGN KEY (hotelCode, roomNo) \n        REFERENCES ROOM(hotelCode, roomNo) \n); \nCREATE TABLE HOTEL_AMENITY ( \n    hotelCode  CHAR(5) NOT NULL, \n    amenity    VARCHAR(50) NOT NULL, \n    CONSTRAINT hotel_amenity_pkey PRIMARY KEY (hotelCode, amenity), \n    CONSTRAINT hotel_amenity_fkey1 FOREIGN KEY (hotelCode) \n        REFERENCES HOTEL(code), \n    CONSTRAINT hotel_amenity_fkey2 FOREIGN KEY (amenity) \n        REFERENCES AMENITY(amenity) \n); \n\nCREATE TABLE GUEST_RESERVATION ( \n    passportNo      VARCHAR(20) NOT NULL, \n    reservationNo   CHAR(6) NOT NULL, \n    CONSTRAINT guest_reservation_pkey PRIMARY KEY (passportNo, reservationNo), \n    CONSTRAINT guest_reservation_fkey1 FOREIGN KEY (passportNo) \n        REFERENCES GUEST(passportNo), \n    CONSTRAINT guest_reservation_fkey2 FOREIGN KEY (reservationNo) \n        REFERENCES RESERVATION(reservationNo) \n);\n```"},{"number":"2","goal":"表建好后新增邮箱唯一约束","steps":["规则要求任意两位住客的email不同，目标是GUEST.email。","使用ALTER TABLE ... ADD CONSTRAINT ... UNIQUE(email)。","这是新增约束，不是重新CREATE整个GUEST；若已有重复邮件，实际加约束会失败，需要先核对数据。"],"check":"不是把email改成每行都相同的默认值，也不是只在应用界面验证。","pitfall":"UNIQUE和NOT NULL含义不同，不能互相代替。","code":"```sql\nALTER TABLE GUEST \nADD CONSTRAINT guest_ckey1 UNIQUE (email);\n```"},{"number":"3","goal":"按父子顺序装载满足数量的数据","steps":["先插至少两位住客、两酒店及设施，再给每家酒店至少两间房。","至少两条预订必须引用已存在的房间；关联住客与预订，按设计补设施关联和可选付款。","检查ISBN等无关属性不要带入酒店；所有primary/foreign/unique keys都满足，样例值自选。"],"check":"两酒店、四房间、两住客、两预订是最低数量；每个父对象都先存在。","pitfall":"只插两间房、每酒店一间，不满足“two rooms for each hotel”。","code":"```sql\nINSERT INTO GUEST \nVALUES ('P10001', 'GUEST_01', 'SAMPLE', \n        'EMAIL_TOKEN_02', 'PHONE_TOKEN_01'); \n \nINSERT INTO GUEST \nVALUES ('P10002', 'GUEST_02', 'SAMPLE', \n        'EMAIL_TOKEN_05', 'PHONE_TOKEN_14'); \nINSERT INTO AMENITY VALUES ('WiFi'); \nINSERT INTO AMENITY VALUES ('Parking'); \nINSERT INTO AMENITY VALUES ('Gym'); \nINSERT INTO HOTEL \nVALUES ('H001', 'Ocean Resort', 4.5, 'Resort', 2, NULL); \n \nINSERT INTO HOTEL \nVALUES ('H002', 'Central Business Hotel', 4.0, 'Business', NULL, 6); \nINSERT INTO ROOM \nVALUES ('H001', '101', 2, 'Queen', 200.00); \n \nINSERT INTO ROOM \nVALUES ('H001', '102', 4, 'Twin', 260.00); \n \nINSERT INTO ROOM \nVALUES ('H002', '201', 2, 'King', 180.00); \n \nINSERT INTO ROOM \nVALUES ('H002', '202', 1, 'Single', 140.00); \nINSERT INTO RESERVATION \nVALUES ('R00001', '2026-09-10', '2026-09-13', '2026-08-20', \n        'Confirmed', 'H001', '101', \n        'RC001', 600.00, 'Card', '2026-08-20'); \n \nINSERT INTO RESERVATION \nVALUES ('R00002', '2026-10-05', '2026-10-07', '2026-08-21', \n        'Confirmed', 'H002', '201', \n        NULL, NULL, NULL, NULL); \nINSERT INTO HOTEL_AMENITY VALUES ('H001', 'WiFi'); \nINSERT INTO HOTEL_AMENITY VALUES ('H001', 'Gym'); \nINSERT INTO HOTEL_AMENITY VALUES ('H002', 'WiFi'); \nINSERT INTO HOTEL_AMENITY VALUES ('H002', 'Parking'); \n\nINSERT INTO GUEST_RESERVATION VALUES ('P10001', 'R00001'); \nINSERT INTO GUEST_RESERVATION VALUES ('P10002', 'R00002');\n```"},{"number":"4","goal":"选一家酒店的全部房间提价10%","steps":["用该酒店code筛选ROOM，不按一个roomNo筛选。","新pricePerNight=原pricePerNight*1.10，保留原有精确小数类型。","用相同酒店条件检查所有房间，另一酒店价格保持不变。"],"check":"例如200变220，不是变210。","pitfall":"加10和加10%是不同操作。","code":"```sql\nUPDATE ROOM \nSET pricePerNight = pricePerNight * 1.10 \nWHERE hotelCode = 'H001';\n```"},{"number":"5","goal":"删除一家酒店及必须先清理的引用记录","steps":["先找到该酒店的全部RESERVATION，删除GUEST_RESERVATION里对它们的引用。","再删这些RESERVATION、HOTEL_AMENITY和ROOM，最后删HOTEL。","保留独立GUEST、AMENITY以及另一酒店的信息，不DROP表，不关闭foreign key检查。"],"check":"即使选定酒店有多条预订，仍能完整删除相关记录。","pitfall":"只把样例预订号R00001写死，不能保证处理该酒店的所有预订。","code":"```sql\nDELETE GR\nFROM GUEST_RESERVATION AS GR\nJOIN RESERVATION AS R ON R.reservationNo = GR.reservationNo\nWHERE R.hotelCode = 'H001';\n\nDELETE FROM RESERVATION WHERE hotelCode = 'H001';\nDELETE FROM HOTEL_AMENITY WHERE hotelCode = 'H001';\nDELETE FROM ROOM WHERE hotelCode = 'H001';\nDELETE FROM HOTEL WHERE code = 'H001';\n```"}],"tags":["CREATE TABLE and suitable types","CHECK, UNIQUE, NOT NULL and numeric capacity","INSERT, UPDATE, DELETE and parent/child order"],"questionHTML":"\u003cp>This question builds upon the relational schemas you designed in Task 1.  Write SQL  statements to answer the following queries. Since the parts  are interconnected, you must  complete them in sequential order from (1) to (5).  \u003c/p>\n\u003cp>(1) Create empty relational tables to implement the relational schemas you designed in  Task 1 for the hotel reservation database. The names of the relational tables and  columns must be consistent with your logical design. Use reasonable column types  and sizes (lengths). Enforce all appropriate primary key and referential integrity  constraints.  Note that the order of CREATE TABLE statements is important. Create the  parent table (referenced) before its child table (references to the parent table).  \u003c/p>\n\u003cp>(2) Next, assume that a new business rule is introduced requiring that no two guests  have the same email address. Add an appropriate constraint after the table has  already been created. \u003c/p>\n\u003cp>(3) Next, insert sufficient sample data into the tables to represent at least two hotels,  two rooms for each hotel, two guests, and two reservations. Insert appropriate data  into the other tables resulting from your logical design where required.  The data values are up to you, but they must satisfy all primary key and referential  integrity constraints defined in part (1) and (2).    Note that the order of INSERT statements is important. Insert data into the  parent table (referenced) before inserting data into its child table (references to  the parent table).  \u003c/p>\n\u003cp>(4) Increase the pricePerNight of all rooms belonging to one of the hotels inserted  in part (3) by 10%. The choice of hotel is up to you. \u003c/p>\n\u003cp>(5) Finally, delete one of the hotels inserted in part ( 3) and all records that must be  removed beforehand to satisfy the referential integrity constraints. Do not delete the  other hotel or its related information, and do not drop any table.    Note that the order of delete statements is important. Delete data from the child table  (references to the parent table) before deleting data from its parent table (referenced).\u003c/p>\n","answerHTML":"\u003ch3>(1) 先创建父表，再创建引用它的表\u003c/h3>\n\u003cp>以下(1)–(4)沿用随附参考解答的表名、列名和样例数据。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">CREATE TABLE GUEST ( \n    passportNo VARCHAR(20) NOT NULL, \n    firstName  VARCHAR(50) NOT NULL, \n    lastName   VARCHAR(50) NOT NULL, \n    email      VARCHAR(100) NOT NULL, \n    phone      VARCHAR(20) NOT NULL, \n    CONSTRAINT guest_pkey PRIMARY KEY (passportNo) \n); \nCREATE TABLE AMENITY ( \n    amenity VARCHAR(50) NOT NULL, \n    CONSTRAINT amenity_pkey PRIMARY KEY (amenity) \n); \nCREATE TABLE HOTEL ( \n    code             CHAR(5) NOT NULL, \n    name             VARCHAR(100) NOT NULL, \n    rating           DECIMAL(2,1) NULL, \n    typeOfHotel      VARCHAR(20) NULL, \n    poolCount        DECIMAL(3) NULL, \n    conferenceRooms  DECIMAL(3) NULL, \n    CONSTRAINT hotel_pkey PRIMARY KEY (code) \n); \nCREATE TABLE ROOM ( \n    hotelCode      CHAR(5) NOT NULL, \n    roomNo         VARCHAR(10) NOT NULL, \n    capacity       DECIMAL(2) NOT NULL, \n    bedType        VARCHAR(30) NOT NULL, \n    pricePerNight  DECIMAL(8,2) NOT NULL, \n    CONSTRAINT room_pkey PRIMARY KEY (hotelCode, roomNo), \n    CONSTRAINT room_fkey1 FOREIGN KEY (hotelCode) \n        REFERENCES HOTEL(code) \n); \nCREATE TABLE RESERVATION ( \n    reservationNo  CHAR(6) NOT NULL, \n    checkIn        DATE NOT NULL, \n    checkOut       DATE NOT NULL, \n    bookingDate    DATE NOT NULL, \n    status         VARCHAR(20) NOT NULL, \n    hotelCode      CHAR(5) NOT NULL, \n    roomNo         VARCHAR(10) NOT NULL, \n    receiptNo      VARCHAR(20) NULL, \n    amount         DECIMAL(8,2) NULL, \n    method         VARCHAR(20) NULL, \n    paidDate       DATE NULL, \n    CONSTRAINT reservation_pkey PRIMARY KEY (reservationNo), \n    CONSTRAINT reservation_ckey1 UNIQUE (receiptNo), \n    CONSTRAINT reservation_fkey1 FOREIGN KEY (hotelCode, roomNo) \n        REFERENCES ROOM(hotelCode, roomNo) \n); \nCREATE TABLE HOTEL_AMENITY ( \n    hotelCode  CHAR(5) NOT NULL, \n    amenity    VARCHAR(50) NOT NULL, \n    CONSTRAINT hotel_amenity_pkey PRIMARY KEY (hotelCode, amenity), \n    CONSTRAINT hotel_amenity_fkey1 FOREIGN KEY (hotelCode) \n        REFERENCES HOTEL(code), \n    CONSTRAINT hotel_amenity_fkey2 FOREIGN KEY (amenity) \n        REFERENCES AMENITY(amenity) \n); \n\nCREATE TABLE GUEST_RESERVATION ( \n    passportNo      VARCHAR(20) NOT NULL, \n    reservationNo   CHAR(6) NOT NULL, \n    CONSTRAINT guest_reservation_pkey PRIMARY KEY (passportNo, reservationNo), \n    CONSTRAINT guest_reservation_fkey1 FOREIGN KEY (passportNo) \n        REFERENCES GUEST(passportNo), \n    CONSTRAINT guest_reservation_fkey2 FOREIGN KEY (reservationNo) \n        REFERENCES RESERVATION(reservationNo) \n);\n\u003c/code>\u003c/pre>\n\u003ch3>(2) 追加邮箱唯一约束\u003c/h3>\n\u003cp>GUEST 已建好，再通过 ALTER TABLE 增加 UNIQUE(email)，防止两位住客使用相同的非空邮箱。此例中的邮箱列本身也为NOT NULL。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">ALTER TABLE GUEST \nADD CONSTRAINT guest_ckey1 UNIQUE (email);\n\u003c/code>\u003c/pre>\n\u003ch3>(3) 插入满足数量要求的数据\u003c/h3>\n\u003cp>样例包含两家酒店，每家两间房，两位住客和两条预订；另外插入必要的设施及关联记录。先有被引用记录，再插入引用它的记录。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">INSERT INTO GUEST \nVALUES (&#39;P10001&#39;, &#39;GUEST_01&#39;, &#39;SAMPLE&#39;, \n        &#39;EMAIL_TOKEN_02&#39;, &#39;PHONE_TOKEN_01&#39;); \n \nINSERT INTO GUEST \nVALUES (&#39;P10002&#39;, &#39;GUEST_02&#39;, &#39;SAMPLE&#39;, \n        &#39;EMAIL_TOKEN_05&#39;, &#39;PHONE_TOKEN_14&#39;); \nINSERT INTO AMENITY VALUES (&#39;WiFi&#39;); \nINSERT INTO AMENITY VALUES (&#39;Parking&#39;); \nINSERT INTO AMENITY VALUES (&#39;Gym&#39;); \nINSERT INTO HOTEL \nVALUES (&#39;H001&#39;, &#39;Ocean Resort&#39;, 4.5, &#39;Resort&#39;, 2, NULL); \n \nINSERT INTO HOTEL \nVALUES (&#39;H002&#39;, &#39;Central Business Hotel&#39;, 4.0, &#39;Business&#39;, NULL, 6); \nINSERT INTO ROOM \nVALUES (&#39;H001&#39;, &#39;101&#39;, 2, &#39;Queen&#39;, 200.00); \n \nINSERT INTO ROOM \nVALUES (&#39;H001&#39;, &#39;102&#39;, 4, &#39;Twin&#39;, 260.00); \n \nINSERT INTO ROOM \nVALUES (&#39;H002&#39;, &#39;201&#39;, 2, &#39;King&#39;, 180.00); \n \nINSERT INTO ROOM \nVALUES (&#39;H002&#39;, &#39;202&#39;, 1, &#39;Single&#39;, 140.00); \nINSERT INTO RESERVATION \nVALUES (&#39;R00001&#39;, &#39;2026-09-10&#39;, &#39;2026-09-13&#39;, &#39;2026-08-20&#39;, \n        &#39;Confirmed&#39;, &#39;H001&#39;, &#39;101&#39;, \n        &#39;RC001&#39;, 600.00, &#39;Card&#39;, &#39;2026-08-20&#39;); \n \nINSERT INTO RESERVATION \nVALUES (&#39;R00002&#39;, &#39;2026-10-05&#39;, &#39;2026-10-07&#39;, &#39;2026-08-21&#39;, \n        &#39;Confirmed&#39;, &#39;H002&#39;, &#39;201&#39;, \n        NULL, NULL, NULL, NULL); \nINSERT INTO HOTEL_AMENITY VALUES (&#39;H001&#39;, &#39;WiFi&#39;); \nINSERT INTO HOTEL_AMENITY VALUES (&#39;H001&#39;, &#39;Gym&#39;); \nINSERT INTO HOTEL_AMENITY VALUES (&#39;H002&#39;, &#39;WiFi&#39;); \nINSERT INTO HOTEL_AMENITY VALUES (&#39;H002&#39;, &#39;Parking&#39;); \n\nINSERT INTO GUEST_RESERVATION VALUES (&#39;P10001&#39;, &#39;R00001&#39;); \nINSERT INTO GUEST_RESERVATION VALUES (&#39;P10002&#39;, &#39;R00002&#39;);\n\u003c/code>\u003c/pre>\n\u003ch3>(4) H001全部房间的价格提高10%\u003c/h3>\n\u003cp>原价乘1.10。只筛选H001，不影响另一家酒店。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">UPDATE ROOM \nSET pricePerNight = pricePerNight * 1.10 \nWHERE hotelCode = &#39;H001&#39;;\n\u003c/code>\u003c/pre>\n\u003ch3>(5) 删除H001及必须先删除的关联记录\u003c/h3>\n\u003cp>先删除关联到该酒店预订的住客—预订配对，再删除预订、酒店—设施配对、客房，最后删除酒店。住客和设施可独立存在，保留它们。此写法通过酒店条件选择全部相关预订，而不只依赖样例中的一个预订号。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">DELETE GR\nFROM GUEST_RESERVATION AS GR\nJOIN RESERVATION AS R ON R.reservationNo = GR.reservationNo\nWHERE R.hotelCode = &#39;H001&#39;;\n\nDELETE FROM RESERVATION WHERE hotelCode = &#39;H001&#39;;\nDELETE FROM HOTEL_AMENITY WHERE hotelCode = &#39;H001&#39;;\nDELETE FROM ROOM WHERE hotelCode = &#39;H001&#39;;\nDELETE FROM HOTEL WHERE code = &#39;H001&#39;;\n\u003c/code>\u003c/pre>\n"},{"id":"A3-T1","title":"Assignment 3 — Task 1","topic":"培训数据库：修改结构和数据","areas":["DDL/DML"],"source":"assignment-3","sourceLabel":"Assignment 3","sourceNote":"Assignment3.pdf pp3–4,6,8; original dbcreate.sql and dbload.sql","origin":"Original material","priority":"core","question":"Note that you may need more than one SQL statement to implement a single subtask  listed below.    Your implementation must directly follow a comment with the specifications of a  subtask.  Implement SQL DDL (Data Definition Language) statements for questions (1) and (2)  below. \n\n(1)  Modify the structure and consistency constraint of the sample database such that the  fee of each workshop must be a positive value not larger than 9999.99. \n\n(2)  Modify the structure and consistency constraints of the sample database such that a  qualification level possessed by a participant and a qualification level required by a  workshop must be positive values no more than 10.  Implement SQL DML (Data Manipulation Language) statements for questions (3), (4)  and (5) below.  Note that you are not allowed to modify and/or drop any consistency constraints. We  assume that safe update has been disabled so that SQL can execute DML statements  anywhere. \n\n(3)  Add a new workshop (workshopNo=9) to the sample database. The values of the  new Workshop columns are up to you. Add two qualification requirements for the new  workshop. The qualification names, required levels and mandatory values are up to you. \n\n(4)  Modify the qualification levels possessed by participant (participantNo=3) such  that all qualification levels possessed by the participant increase by 1. \n\n(5)  Remove participant (participantNo=10) and all information related to this  participant from the sample database.","answer":"以原始dbcreate.sql为起点。原文件没有对应的费用或等级CHECK，所以直接添加；如果练习库已经改过，应先核对实际约束，避免留下互相冲突的旧条件。\n\n### (1) 同时修改费用类型和取值约束\n\n原 fee 为DECIMAL(5,2)，只有三位整数位置，存不下9999.99。改为DECIMAL(6,2)，再增加费用大于0且不超过9999.99的CHECK。\n\n```sql\nALTER TABLE Workshop\n    MODIFY COLUMN fee DECIMAL(6,2) NOT NULL,\n    ADD CONSTRAINT workshop_fee_check CHECK (fee > 0 AND fee \u003c= 9999.99);\n```\n\n### (2) 两个资格等级列都要修改\n\n原qlevel与requiredLevel都是DECIMAL(1)，存不下10。把两列都扩大为DECIMAL(2,0)，分别加上大于0且不超过10的检查。\n\n```sql\nALTER TABLE Qualification\n    MODIFY COLUMN qlevel DECIMAL(2,0) NOT NULL,\n    ADD CONSTRAINT qualification_level_check CHECK (qlevel > 0 AND qlevel \u003c= 10);\n\nALTER TABLE Requirement\n    MODIFY COLUMN requiredLevel DECIMAL(2,0) NOT NULL,\n    ADD CONSTRAINT requirement_level_check\n        CHECK (requiredLevel > 0 AND requiredLevel \u003c= 10);\n```\n\n### (3) 先增加工作坊，再增加两条资格要求\n\n工作坊编号为9。其他值由题目允许自行选择。Requirement的qname没有引用Qualification.qname的foreign key，因此不必先给某位参与者增加同名资格。\n\n```sql\nINSERT INTO Workshop\n    (workshopNo, title, category, `date`, fee, capacity)\nVALUES (9, 'DATABASE PRACTICE', 'TECHNOLOGY', '2026-11-06', 200.00, 30);\n\nINSERT INTO Requirement (workshopNo, qname, requiredLevel, mandatory)\nVALUES (9, 'PYTHON PROGRAMMING', 3, 'Y'),\n       (9, 'DATA ANALYSIS', 2, 'N');\n```\n\n### (4) 把参与者3的每项资格等级加1\n\n更新Qualification中participantNo为3的所有行。原装载数据的4和3变为5和4，没有超过上限。若一般数据已有10，不能为了让更新成功就删除CHECK。\n\n```sql\nUPDATE Qualification\nSET qlevel = qlevel + 1\nWHERE participantNo = 3;\n```\n\n### (5) 先删子记录，再删参与者10\n\n引用Participant的相关记录在Enrolment和Qualification中。先删这两处，再删Participant；不应删除与该人报名有关但能独立存在的工作坊或培训师。\n\n```sql\nDELETE FROM Enrolment WHERE participantNo = 10;\nDELETE FROM Qualification WHERE participantNo = 10;\nDELETE FROM Participant WHERE participantNo = 10;\n```","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"让费用能存下且只允许合法范围","steps":["原fee DECIMAL(5,2)总共5位，小数2位，整数仅3位；9999.99需要4位整数。","MODIFY为DECIMAL(6,2) NOT NULL，保留必填条件。","再加CHECK(fee>0 AND fee\u003c=9999.99)，类型容量与业务范围两者缺一不可。"],"check":"9999.99合法，0及10000都不合法。","pitfall":"只加CHECK而不扩DECIMAL无法存10以内之外所需的四位费用。","code":"```sql\nALTER TABLE Workshop\n    MODIFY COLUMN fee DECIMAL(6,2) NOT NULL,\n    ADD CONSTRAINT workshop_fee_check CHECK (fee > 0 AND fee \u003c= 9999.99);\n```"},{"number":"2","goal":"同时修改两种资格等级","steps":["已具备等级在Qualification.qlevel，所需等级在Requirement.requiredLevel，不是同一列。","原DECIMAL(1)只能容纳一位数字，先把两列都扩成DECIMAL(2,0) NOT NULL。","分别增加>0且\u003c=10的CHECK，整数类型保证等级不会出现小数。"],"check":"10可存，0、负值和11受限制。","pitfall":"只改其中一表，或写\u003c10排除合法边界10。","code":"```sql\nALTER TABLE Qualification\n    MODIFY COLUMN qlevel DECIMAL(2,0) NOT NULL,\n    ADD CONSTRAINT qualification_level_check CHECK (qlevel > 0 AND qlevel \u003c= 10);\n\nALTER TABLE Requirement\n    MODIFY COLUMN requiredLevel DECIMAL(2,0) NOT NULL,\n    ADD CONSTRAINT requirement_level_check\n        CHECK (requiredLevel > 0 AND requiredLevel \u003c= 10);\n```"},{"number":"3","goal":"新增工作坊9并添加两条要求","steps":["先INSERT Workshop，给定9及自行选择但合法的title/category/date/fee/capacity。","再INSERT Requirement两行，引用workshopNo=9，并使两qname不同以满足composite primary key。","requiredLevel、mandatory选择有效业务值；qname没有引用资格目录的foreign key，不先给其他参与者添加资格。"],"check":"新工作坊有恰好本次增加的两条要求，父记录先存在。","pitfall":"先插Requirement会引用不存在的workshop。","code":"```sql\nINSERT INTO Workshop\n    (workshopNo, title, category, `date`, fee, capacity)\nVALUES (9, 'DATABASE PRACTICE', 'TECHNOLOGY', '2026-11-06', 200.00, 30);\n\nINSERT INTO Requirement (workshopNo, qname, requiredLevel, mandatory)\nVALUES (9, 'PYTHON PROGRAMMING', 3, 'Y'),\n       (9, 'DATA ANALYSIS', 2, 'N');\n```"},{"number":"4","goal":"参与者3的所有资格等级增加1","steps":["UPDATE目标是Qualification，而不是Participant。","WHERE participantNo=3，SET qlevel=qlevel+1使每条资格各自在原值上增加。","原数据4、3变成5、4。更新仍要通过新增等级CHECK，不能为DML解除约束。"],"check":"只影响该参与者的资格，其他人不变。","pitfall":"把全部qlevel设为1会覆盖而不是增加。","code":"```sql\nUPDATE Qualification\nSET qlevel = qlevel + 1\nWHERE participantNo = 3;\n```"},{"number":"5","goal":"删除参与者10与其相关信息","steps":["检查哪些表引用Participant：Qualification和Enrolment。","先删这两表中participantNo=10的行，再删Participant本行。","工作坊、培训师等独立对象保留，所有foreign keys保持生效。"],"check":"不存在该人的资格、报名或参与者行，其他业务对象仍在。","pitfall":"不能为绕过父表删除限制而DROP FOREIGN KEY。","code":"```sql\nDELETE FROM Enrolment WHERE participantNo = 10;\nDELETE FROM Qualification WHERE participantNo = 10;\nDELETE FROM Participant WHERE participantNo = 10;\n```"}],"tags":["CREATE TABLE and suitable types","CHECK, UNIQUE, NOT NULL and numeric capacity","ALTER add/drop/modify/rename and constraints","INSERT, UPDATE, DELETE and parent/child order"],"questionHTML":"\u003cp>Note that you may need more than one SQL statement to implement a single subtask  listed below.    Your implementation must directly follow a comment with the specifications of a  subtask.  Implement SQL DDL (Data Definition Language) statements for questions (1) and (2)  below. \u003c/p>\n\u003cp>(1)  Modify the structure and consistency constraint of the sample database such that the  fee of each workshop must be a positive value not larger than 9999.99. \u003c/p>\n\u003cp>(2)  Modify the structure and consistency constraints of the sample database such that a  qualification level possessed by a participant and a qualification level required by a  workshop must be positive values no more than 10.  Implement SQL DML (Data Manipulation Language) statements for questions (3), (4)  and (5) below.  Note that you are not allowed to modify and/or drop any consistency constraints. We  assume that safe update has been disabled so that SQL can execute DML statements  anywhere. \u003c/p>\n\u003cp>(3)  Add a new workshop (workshopNo=9) to the sample database. The values of the  new Workshop columns are up to you. Add two qualification requirements for the new  workshop. The qualification names, required levels and mandatory values are up to you. \u003c/p>\n\u003cp>(4)  Modify the qualification levels possessed by participant (participantNo=3) such  that all qualification levels possessed by the participant increase by 1. \u003c/p>\n\u003cp>(5)  Remove participant (participantNo=10) and all information related to this  participant from the sample database.\u003c/p>\n","answerHTML":"\u003cp>以原始dbcreate.sql为起点。原文件没有对应的费用或等级CHECK，所以直接添加；如果练习库已经改过，应先核对实际约束，避免留下互相冲突的旧条件。\u003c/p>\n\u003ch3>(1) 同时修改费用类型和取值约束\u003c/h3>\n\u003cp>原 fee 为DECIMAL(5,2)，只有三位整数位置，存不下9999.99。改为DECIMAL(6,2)，再增加费用大于0且不超过9999.99的CHECK。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">ALTER TABLE Workshop\n    MODIFY COLUMN fee DECIMAL(6,2) NOT NULL,\n    ADD CONSTRAINT workshop_fee_check CHECK (fee &gt; 0 AND fee &lt;= 9999.99);\n\u003c/code>\u003c/pre>\n\u003ch3>(2) 两个资格等级列都要修改\u003c/h3>\n\u003cp>原qlevel与requiredLevel都是DECIMAL(1)，存不下10。把两列都扩大为DECIMAL(2,0)，分别加上大于0且不超过10的检查。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">ALTER TABLE Qualification\n    MODIFY COLUMN qlevel DECIMAL(2,0) NOT NULL,\n    ADD CONSTRAINT qualification_level_check CHECK (qlevel &gt; 0 AND qlevel &lt;= 10);\n\nALTER TABLE Requirement\n    MODIFY COLUMN requiredLevel DECIMAL(2,0) NOT NULL,\n    ADD CONSTRAINT requirement_level_check\n        CHECK (requiredLevel &gt; 0 AND requiredLevel &lt;= 10);\n\u003c/code>\u003c/pre>\n\u003ch3>(3) 先增加工作坊，再增加两条资格要求\u003c/h3>\n\u003cp>工作坊编号为9。其他值由题目允许自行选择。Requirement的qname没有引用Qualification.qname的foreign key，因此不必先给某位参与者增加同名资格。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">INSERT INTO Workshop\n    (workshopNo, title, category, `date`, fee, capacity)\nVALUES (9, &#39;DATABASE PRACTICE&#39;, &#39;TECHNOLOGY&#39;, &#39;2026-11-06&#39;, 200.00, 30);\n\nINSERT INTO Requirement (workshopNo, qname, requiredLevel, mandatory)\nVALUES (9, &#39;PYTHON PROGRAMMING&#39;, 3, &#39;Y&#39;),\n       (9, &#39;DATA ANALYSIS&#39;, 2, &#39;N&#39;);\n\u003c/code>\u003c/pre>\n\u003ch3>(4) 把参与者3的每项资格等级加1\u003c/h3>\n\u003cp>更新Qualification中participantNo为3的所有行。原装载数据的4和3变为5和4，没有超过上限。若一般数据已有10，不能为了让更新成功就删除CHECK。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">UPDATE Qualification\nSET qlevel = qlevel + 1\nWHERE participantNo = 3;\n\u003c/code>\u003c/pre>\n\u003ch3>(5) 先删子记录，再删参与者10\u003c/h3>\n\u003cp>引用Participant的相关记录在Enrolment和Qualification中。先删这两处，再删Participant；不应删除与该人报名有关但能独立存在的工作坊或培训师。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">DELETE FROM Enrolment WHERE participantNo = 10;\nDELETE FROM Qualification WHERE participantNo = 10;\nDELETE FROM Participant WHERE participantNo = 10;\n\u003c/code>\u003c/pre>\n"},{"id":"A3-T2","title":"Assignment 3 — Task 2","topic":"培训数据库：基本查询","areas":["SELECT"],"source":"assignment-3","sourceLabel":"Assignment 3","sourceNote":"Assignment3.pdf pp3–4,6,8; original dbcreate.sql and dbload.sql","origin":"Original material","priority":"core","question":"(1)  Find the workshop number, title, category and fee of all workshops whose fees are  between 150.00 and 220.00. \n\n(2)  Find the participant number and full name of all participants who live in Sydney. \n\n(3)  Find the participant number for all participants who possess more than 3  qualifications. \n\n(4)  Display the workshop number, title, fee and category of all workshops in ascending  order of category, then in descending order of fee. \n\n(5)  Find the average fee of workshops in the TECHNOLOGY category.","answer":"按五小题顺序编写：\n\n1. WHERE筛选150.00到220.00，包含两端，并列出题目指定的四列。\n2. 在Participant中筛选Sydney；用CONCAT把名和姓合成fullName。\n3. 在Qualification中按参与者分组，用HAVING保留资格条数大于3的人。\n4. ORDER BY先指定category升序，再指定fee降序。\n5. 先筛选TECHNOLOGY，再计算AVG(fee)。\n\n原装载数据中：(1)工作坊编号1、2、3、5；(2)参与者编号1、4、7；(3)只有参与者7；(5)平均费用为650/3，约216.6667。没有ORDER BY的小题，不依赖结果的显示顺序。\n\n\n```sql\n-- (1)\nSELECT workshopNo, title, category, fee\nFROM Workshop\nWHERE fee BETWEEN 150.00 AND 220.00;\n\n-- (2)\nSELECT participantNo, CONCAT(fname, ' ', lname) AS fullName\nFROM Participant\nWHERE UPPER(city) = 'SYDNEY';\n\n-- (3)\nSELECT participantNo\nFROM Qualification\nGROUP BY participantNo\nHAVING COUNT(*) > 3;\n\n-- (4)\nSELECT workshopNo, title, fee, category\nFROM Workshop\nORDER BY category ASC, fee DESC;\n\n-- (5)\nSELECT AVG(fee) AS averageFee\nFROM Workshop\nWHERE category = 'TECHNOLOGY';\n```","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"筛选150到220费用并取四列","steps":["四列来自Workshop，无需JOIN。","WHERE fee BETWEEN 150.00 AND 220.00包含两端。","SELECT按题目列workshopNo,title,category,fee。"],"check":"原数据编号1、2、3、5符合。","pitfall":"筛选费用不要用capacity，且不要把220排除。","code":"```sql\nSELECT workshopNo, title, category, fee\nFROM Workshop\nWHERE fee BETWEEN 150.00 AND 220.00;\n```"},{"number":"2","goal":"查Sydney参与者全名","steps":["目标表Participant，城市列city。","用UPPER(city)=SYDNEY消除大小写比较环境差异。","CONCAT(fname,空格,lname)生成fullName，另取participantNo。"],"check":"原数据1、4、7符合，姓名中间有空格。","pitfall":"不是只输出fname而遗漏姓。","code":"```sql\nSELECT participantNo, CONCAT(fname, ' ', lname) AS fullName\nFROM Participant\nWHERE UPPER(city) = 'SYDNEY';\n```"},{"number":"3","goal":"资格条数超过3的参与者编号","steps":["Qualification每行是一人一种资格，其组合键防止重复资格行。","GROUP BY participantNo，然后HAVING COUNT(*)>3。","输出只需编号，原数据只有参与者7。"],"check":"恰好3项不符合。","pitfall":"不能在WHERE里写COUNT(*)>3。","code":"```sql\nSELECT participantNo\nFROM Qualification\nGROUP BY participantNo\nHAVING COUNT(*) > 3;\n```"},{"number":"4","goal":"按类别升序、费用降序排列","steps":["从Workshop取四个指定列。","ORDER BY category ASC先比较类别。","再fee DESC只在相同类别内比较费用，不反转主次。"],"check":"BUSINESS内部160、140、120按从高到低。","pitfall":"ORDER BY fee DESC,category ASC会得到不同排序优先级。","code":"```sql\nSELECT workshopNo, title, fee, category\nFROM Workshop\nORDER BY category ASC, fee DESC;\n```"},{"number":"5","goal":"计算技术类平均费用","steps":["WHERE category=TECHNOLOGY先确定参与计算的行。","AVG(fee)对180、220、250取平均，不是对全部工作坊。","返回单个聚合值650/3；不要人为取整，除非题面另要求。"],"check":"约216.6667，具体小数显示位数由类型决定。","pitfall":"把SUM(fee)当作平均值，或在没有GROUP BY时同时随意选title。","code":"```sql\nSELECT AVG(fee) AS averageFee\nFROM Workshop\nWHERE category = 'TECHNOLOGY';\n```"}],"tags":["Projection, filters, Boolean conditions and sorting","COUNT, SUM, AVG and MAX","GROUP BY and HAVING"],"questionHTML":"\u003cp>(1)  Find the workshop number, title, category and fee of all workshops whose fees are  between 150.00 and 220.00. \u003c/p>\n\u003cp>(2)  Find the participant number and full name of all participants who live in Sydney. \u003c/p>\n\u003cp>(3)  Find the participant number for all participants who possess more than 3  qualifications. \u003c/p>\n\u003cp>(4)  Display the workshop number, title, fee and category of all workshops in ascending  order of category, then in descending order of fee. \u003c/p>\n\u003cp>(5)  Find the average fee of workshops in the TECHNOLOGY category.\u003c/p>\n","answerHTML":"\u003cp>按五小题顺序编写：\u003c/p>\n\u003col>\n\u003cli>WHERE筛选150.00到220.00，包含两端，并列出题目指定的四列。\u003c/li>\n\u003cli>在Participant中筛选Sydney；用CONCAT把名和姓合成fullName。\u003c/li>\n\u003cli>在Qualification中按参与者分组，用HAVING保留资格条数大于3的人。\u003c/li>\n\u003cli>ORDER BY先指定category升序，再指定fee降序。\u003c/li>\n\u003cli>先筛选TECHNOLOGY，再计算AVG(fee)。\u003c/li>\n\u003c/ol>\n\u003cp>原装载数据中：(1)工作坊编号1、2、3、5；(2)参与者编号1、4、7；(3)只有参与者7；(5)平均费用为650/3，约216.6667。没有ORDER BY的小题，不依赖结果的显示顺序。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nSELECT workshopNo, title, category, fee\nFROM Workshop\nWHERE fee BETWEEN 150.00 AND 220.00;\n\n-- (2)\nSELECT participantNo, CONCAT(fname, &#39; &#39;, lname) AS fullName\nFROM Participant\nWHERE UPPER(city) = &#39;SYDNEY&#39;;\n\n-- (3)\nSELECT participantNo\nFROM Qualification\nGROUP BY participantNo\nHAVING COUNT(*) &gt; 3;\n\n-- (4)\nSELECT workshopNo, title, fee, category\nFROM Workshop\nORDER BY category ASC, fee DESC;\n\n-- (5)\nSELECT AVG(fee) AS averageFee\nFROM Workshop\nWHERE category = &#39;TECHNOLOGY&#39;;\n\u003c/code>\u003c/pre>\n"},{"id":"A3-T3","title":"Assignment 3 — Task 3","topic":"培训数据库：连接与外连接查询","areas":["SELECT"],"source":"assignment-3","sourceLabel":"Assignment 3","sourceNote":"Assignment3.pdf pp3–4,6,8; original dbcreate.sql and dbload.sql","origin":"Original material","priority":"core","question":"You must implement SQL statements for the questions below by using JOIN / OUTER  JOIN.    Your implementation must directly follow a comment with a specification of a subtask. \n\n(1)  Find the full name and phone number of all participants who possess more than 2  qualifications and display the results in ascending order of last name and first name. \n\n(2)  Find the workshop number, title and category of all workshops that have no  qualification requirements. \n\n(3)  Find the participant number, full name and total number of workshop enrolments for  each participant and display the results in ascending order of the total number of  enrolments. Participants who have not enrolled in a workshop must also be included. \n\n(4)  Find the workshop number, title and total number of trainers assigned to each  workshop and display the results in ascending order of the total number of trainers.  Workshops that have no trainer assigned must also be included. \n\n(5)  Find the trainer number and full name of all trainers who have not been assigned to  any workshop.","answer":"本题限定使用连接或外连接。五小题的处理分别是：\n\n1. 连接参与者与资格，按参与者分组，筛选资格数大于2，再按姓、名排序。原数据对应PARTICIPANT_02 SAMPLE和PARTICIPANT_07 SAMPLE。\n2. 从工作坊出发LEFT JOIN资格要求，保留右侧没有匹配记录的工作坊。原数据对应工作坊6。\n3. 从参与者出发LEFT JOIN报名记录，保留未报名的人。统计右侧实际存在的workshopNo，不用COUNT(*)。原数据中参与者11的次数是0。题目没有排除取消报名，这里也不排除。\n4. 从工作坊出发LEFT JOIN培训师分配，统计右侧trainerNo。没有培训师的工作坊8得到0。\n5. 从培训师出发LEFT JOIN分配表，保留未匹配者。原数据对应培训师8。\n\n\n```sql\n-- (1)\nSELECT CONCAT(P.fname, ' ', P.lname) AS fullName, P.phone\nFROM Participant AS P\nJOIN Qualification AS Q ON Q.participantNo = P.participantNo\nGROUP BY P.participantNo, P.fname, P.lname, P.phone\nHAVING COUNT(Q.qname) > 2\nORDER BY P.lname ASC, P.fname ASC;\n\n-- (2)\nSELECT W.workshopNo, W.title, W.category\nFROM Workshop AS W\nLEFT JOIN Requirement AS R ON R.workshopNo = W.workshopNo\nWHERE R.workshopNo IS NULL;\n\n-- (3)\nSELECT P.participantNo, CONCAT(P.fname, ' ', P.lname) AS fullName,\n       COUNT(E.workshopNo) AS totalEnrolments\nFROM Participant AS P\nLEFT JOIN Enrolment AS E ON E.participantNo = P.participantNo\nGROUP BY P.participantNo, P.fname, P.lname\nORDER BY totalEnrolments ASC;\n\n-- (4)\nSELECT W.workshopNo, W.title, COUNT(WT.trainerNo) AS totalTrainers\nFROM Workshop AS W\nLEFT JOIN WorkshopTrainer AS WT ON WT.workshopNo = W.workshopNo\nGROUP BY W.workshopNo, W.title\nORDER BY totalTrainers ASC;\n\n-- (5)\nSELECT T.trainerNo, CONCAT(T.fname, ' ', T.lname) AS fullName\nFROM Trainer AS T\nLEFT JOIN WorkshopTrainer AS WT ON WT.trainerNo = T.trainerNo\nWHERE WT.trainerNo IS NULL;\n```","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"用JOIN查询超过2项资格者的姓名和电话","steps":["Participant JOIN Qualification使用participantNo。","按参与者编号及输出姓名电话字段分组，再HAVING COUNT(Q.qname)>2。","ORDER BY lname,fname，确保同名不同参与者不被错误合并。"],"check":"原数据PARTICIPANT_02和PARTICIPANT_07符合。","pitfall":"本题指定JOIN/OUTER JOIN，不能只改用IN虽结果相同却不满足形式要求。","code":"```sql\nSELECT CONCAT(P.fname, ' ', P.lname) AS fullName, P.phone\nFROM Participant AS P\nJOIN Qualification AS Q ON Q.participantNo = P.participantNo\nGROUP BY P.participantNo, P.fname, P.lname, P.phone\nHAVING COUNT(Q.qname) > 2\nORDER BY P.lname ASC, P.fname ASC;\n```"},{"number":"2","goal":"用outer join找没有资格要求的工作坊","steps":["以Workshop为左表LEFT JOIN Requirement。","连接条件workshopNo相等。","WHERE R.workshopNo IS NULL表示整条右侧不存在；选择W的编号、标题、类别。"],"check":"原数据工作坊6符合。","pitfall":"不要检查一个本来允许NULL的非键字段来判断右侧是否存在。","code":"```sql\nSELECT W.workshopNo, W.title, W.category\nFROM Workshop AS W\nLEFT JOIN Requirement AS R ON R.workshopNo = W.workshopNo\nWHERE R.workshopNo IS NULL;\n```"},{"number":"3","goal":"统计所有参与者报名数，包括0","steps":["Participant LEFT JOIN Enrolment，保留完整参与者集合。","按参与者分组，COUNT(E.workshopNo)只计实际匹配的报名。","ORDER BY totalEnrolments ASC。题面没有要求排除CANCELLED，因此计入这些报名记录。"],"check":"参与者11得到0，其余次数与Enrolment行数一致。","pitfall":"COUNT(*)会让未报名者变成1。","code":"```sql\nSELECT P.participantNo, CONCAT(P.fname, ' ', P.lname) AS fullName,\n       COUNT(E.workshopNo) AS totalEnrolments\nFROM Participant AS P\nLEFT JOIN Enrolment AS E ON E.participantNo = P.participantNo\nGROUP BY P.participantNo, P.fname, P.lname\nORDER BY totalEnrolments ASC;\n```"},{"number":"4","goal":"统计所有工作坊的培训师人数，包括0","steps":["Workshop LEFT JOIN WorkshopTrainer，不连接Enrolment。","按工作坊分组，COUNT(WT.trainerNo)计真实分配行。","按总数升序排列，未分配培训师的工作坊8为0。"],"check":"工作坊3、7各2位，8为0。","pitfall":"加入报名表会使培训师被每条报名重复计数。","code":"```sql\nSELECT W.workshopNo, W.title, COUNT(WT.trainerNo) AS totalTrainers\nFROM Workshop AS W\nLEFT JOIN WorkshopTrainer AS WT ON WT.workshopNo = W.workshopNo\nGROUP BY W.workshopNo, W.title\nORDER BY totalTrainers ASC;\n```"},{"number":"5","goal":"找完全未获分配的培训师","steps":["从Trainer出发LEFT JOIN WorkshopTrainer。","用WT.trainerNo IS NULL筛出没有任何匹配的培训师。","从Trainer取编号和组合全名，不只取右表的空值。"],"check":"原数据为培训师8。","pitfall":"检查organisation IS NULL是在问机构未知，不是在问没有授课分配。","code":"```sql\nSELECT T.trainerNo, CONCAT(T.fname, ' ', T.lname) AS fullName\nFROM Trainer AS T\nLEFT JOIN WorkshopTrainer AS WT ON WT.trainerNo = T.trainerNo\nWHERE WT.trainerNo IS NULL;\n```"}],"tags":["COUNT, SUM, AVG and MAX","GROUP BY and HAVING","JOIN and LEFT/RIGHT/FULL OUTER JOIN","Independent counts without join multiplication"],"questionHTML":"\u003cp>You must implement SQL statements for the questions below by using JOIN / OUTER  JOIN.    Your implementation must directly follow a comment with a specification of a subtask. \u003c/p>\n\u003cp>(1)  Find the full name and phone number of all participants who possess more than 2  qualifications and display the results in ascending order of last name and first name. \u003c/p>\n\u003cp>(2)  Find the workshop number, title and category of all workshops that have no  qualification requirements. \u003c/p>\n\u003cp>(3)  Find the participant number, full name and total number of workshop enrolments for  each participant and display the results in ascending order of the total number of  enrolments. Participants who have not enrolled in a workshop must also be included. \u003c/p>\n\u003cp>(4)  Find the workshop number, title and total number of trainers assigned to each  workshop and display the results in ascending order of the total number of trainers.  Workshops that have no trainer assigned must also be included. \u003c/p>\n\u003cp>(5)  Find the trainer number and full name of all trainers who have not been assigned to  any workshop.\u003c/p>\n","answerHTML":"\u003cp>本题限定使用连接或外连接。五小题的处理分别是：\u003c/p>\n\u003col>\n\u003cli>连接参与者与资格，按参与者分组，筛选资格数大于2，再按姓、名排序。原数据对应PARTICIPANT_02 SAMPLE和PARTICIPANT_07 SAMPLE。\u003c/li>\n\u003cli>从工作坊出发LEFT JOIN资格要求，保留右侧没有匹配记录的工作坊。原数据对应工作坊6。\u003c/li>\n\u003cli>从参与者出发LEFT JOIN报名记录，保留未报名的人。统计右侧实际存在的workshopNo，不用COUNT(*)。原数据中参与者11的次数是0。题目没有排除取消报名，这里也不排除。\u003c/li>\n\u003cli>从工作坊出发LEFT JOIN培训师分配，统计右侧trainerNo。没有培训师的工作坊8得到0。\u003c/li>\n\u003cli>从培训师出发LEFT JOIN分配表，保留未匹配者。原数据对应培训师8。\u003c/li>\n\u003c/ol>\n\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nSELECT CONCAT(P.fname, &#39; &#39;, P.lname) AS fullName, P.phone\nFROM Participant AS P\nJOIN Qualification AS Q ON Q.participantNo = P.participantNo\nGROUP BY P.participantNo, P.fname, P.lname, P.phone\nHAVING COUNT(Q.qname) &gt; 2\nORDER BY P.lname ASC, P.fname ASC;\n\n-- (2)\nSELECT W.workshopNo, W.title, W.category\nFROM Workshop AS W\nLEFT JOIN Requirement AS R ON R.workshopNo = W.workshopNo\nWHERE R.workshopNo IS NULL;\n\n-- (3)\nSELECT P.participantNo, CONCAT(P.fname, &#39; &#39;, P.lname) AS fullName,\n       COUNT(E.workshopNo) AS totalEnrolments\nFROM Participant AS P\nLEFT JOIN Enrolment AS E ON E.participantNo = P.participantNo\nGROUP BY P.participantNo, P.fname, P.lname\nORDER BY totalEnrolments ASC;\n\n-- (4)\nSELECT W.workshopNo, W.title, COUNT(WT.trainerNo) AS totalTrainers\nFROM Workshop AS W\nLEFT JOIN WorkshopTrainer AS WT ON WT.workshopNo = W.workshopNo\nGROUP BY W.workshopNo, W.title\nORDER BY totalTrainers ASC;\n\n-- (5)\nSELECT T.trainerNo, CONCAT(T.fname, &#39; &#39;, T.lname) AS fullName\nFROM Trainer AS T\nLEFT JOIN WorkshopTrainer AS WT ON WT.trainerNo = T.trainerNo\nWHERE WT.trainerNo IS NULL;\n\u003c/code>\u003c/pre>\n"},{"id":"A4-T1","title":"Assignment 4 — Task 1","topic":"嵌套查询与关联嵌套查询","areas":["SELECT"],"source":"assignment-4","sourceLabel":"Assignment 4","sourceNote":"Assignment 4.pdf pp3,5–6,8,10; original dbcreate.sql and dbload.sql","origin":"Original material","priority":"core","question":"Implement SQL nested query statements for questions (1), (2) and (3). \n\n(1) Find the workshop number, title and fee of every workshop whose fee is higher than  the average fee of all workshops. \n\n(2) Find the participant number and full name of participants who have completed at least  one TECHNOLOGY workshop and at least one BUSINESS workshop. Cancelled  enrolments must not contribute to either condition. \n\n(3) Find the trainer number and full name of trainers assigned to at least two workshops.  Count workshop assignments, not enrolments.    Implement SQL correlated nested query statements for questions (4) and \n\n(5). \n\n(4) Find the participant number, full name, qualification name and qualification level of  participants whose level is the highest recorded for that qualification name. Order by  qualification name, then participant number. \n\n(5) Find the participant number and full name of participants who have completed at least  one workshop with a current fee of 200.00 or more. Ignore cancelled enrolments.","answer":"(1) 先用子查询算全部工作坊的平均费用，外层筛选费用高于该平均值的工作坊。原数据对应1、2、5、7。\n\n(2) 两个条件必须同时满足：至少完成一门技术类工作坊，并至少完成一门商务类工作坊。因此分别找出满足两类条件的参与者，再同时用IN判断。两部分都只计COMPLETED。原数据对应参与者1、4、9。\n\n(3) 统计WorkshopTrainer中的培训师分配次数，保留至少两次者。不能改数Enrolment的报名人数。原数据对应培训师1、7。\n\n(4) 对当前Qualification行，用相同qname的最大qlevel作比较。子查询引用外层qname，属于correlated subquery。达到相同最高等级的多个人都保留；不是找整张表的一个最高值。\n\n(5) 对当前参与者，检查是否存在一条已完成的报名，其工作坊现在的费用至少200。这里使用当前Workshop.fee，不假设保存了历史支付费用。原数据对应参与者1、4、7、9。\n\n前一代码块对应(1)–(3)，后一代码块对应(4)–(5)。\n\n\n```sql\n-- (1)\nSELECT workshopNo, title, fee\nFROM Workshop\nWHERE fee > (SELECT AVG(fee) FROM Workshop);\n\n-- (2)\nSELECT P.participantNo, CONCAT(P.fname, ' ', P.lname) AS fullName\nFROM Participant AS P\nWHERE P.participantNo IN (\n    SELECT E.participantNo\n    FROM Enrolment AS E\n    WHERE E.status = 'COMPLETED'\n      AND E.workshopNo IN (\n          SELECT workshopNo FROM Workshop WHERE category = 'TECHNOLOGY'\n      )\n)\nAND P.participantNo IN (\n    SELECT E.participantNo\n    FROM Enrolment AS E\n    WHERE E.status = 'COMPLETED'\n      AND E.workshopNo IN (\n          SELECT workshopNo FROM Workshop WHERE category = 'BUSINESS'\n      )\n);\n\n-- (3)\nSELECT T.trainerNo, CONCAT(T.fname, ' ', T.lname) AS fullName\nFROM Trainer AS T\nWHERE T.trainerNo IN (\n    SELECT WT.trainerNo\n    FROM WorkshopTrainer AS WT\n    GROUP BY WT.trainerNo\n    HAVING COUNT(*) >= 2\n);\n```\n\n```sql\n-- (4)\nSELECT P.participantNo, CONCAT(P.fname, ' ', P.lname) AS fullName,\n       Q.qname, Q.qlevel\nFROM Participant AS P\nJOIN Qualification AS Q ON Q.participantNo = P.participantNo\nWHERE Q.qlevel = (\n    SELECT MAX(Q2.qlevel)\n    FROM Qualification AS Q2\n    WHERE Q2.qname = Q.qname\n)\nORDER BY Q.qname, P.participantNo;\n\n-- (5)\nSELECT P.participantNo, CONCAT(P.fname, ' ', P.lname) AS fullName\nFROM Participant AS P\nWHERE EXISTS (\n    SELECT 1\n    FROM Enrolment AS E\n    JOIN Workshop AS W ON W.workshopNo = E.workshopNo\n    WHERE E.participantNo = P.participantNo\n      AND E.status = 'COMPLETED'\n      AND W.fee >= 200.00\n);\n```","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"用nested query比较全体平均费用","steps":["内层SELECT AVG(fee) FROM Workshop只产生一个数。","外层逐工作坊比较fee>这个平均值；大于不是大于等于。","取workshopNo,title,fee；原数据平均168.75，符合1、2、5、7。"],"check":"使用了题目指定的nested query。","pitfall":"把平均按category分组会改变比较基准。","code":"```sql\nSELECT workshopNo, title, fee\nFROM Workshop\nWHERE fee > (SELECT AVG(fee) FROM Workshop);\n```"},{"number":"2","goal":"同时满足技术类和商务类已完成条件","steps":["内层先各找TECHNOLOGY、BUSINESS工作坊集合。","在Enrolment中分别找这些课程且status=COMPLETED的参与者集合。","外层对同一参与者同时满足两个IN，用AND连接，不只满足其一。"],"check":"原数据为1、4、9；取消记录不满足任一完成条件。","pitfall":"OR只要求完成某一种类别，不是both。","code":"```sql\nSELECT P.participantNo, CONCAT(P.fname, ' ', P.lname) AS fullName\nFROM Participant AS P\nWHERE P.participantNo IN (\n    SELECT E.participantNo\n    FROM Enrolment AS E\n    WHERE E.status = 'COMPLETED'\n      AND E.workshopNo IN (\n          SELECT workshopNo FROM Workshop WHERE category = 'TECHNOLOGY'\n      )\n)\nAND P.participantNo IN (\n    SELECT E.participantNo\n    FROM Enrolment AS E\n    WHERE E.status = 'COMPLETED'\n      AND E.workshopNo IN (\n          SELECT workshopNo FROM Workshop WHERE category = 'BUSINESS'\n      )\n);\n```"},{"number":"3","goal":"按工作分配次数选培训师","steps":["在WorkshopTrainer按trainerNo分组。","HAVING COUNT(*)>=2保留至少两项分配。","用nested IN在Trainer取编号和全名，原数据1、7。"],"check":"数的是不同工作坊分配，不是学生报名。","pitfall":"用Enrolment计人数与题目要的trainer assignments无关。","code":"```sql\nSELECT T.trainerNo, CONCAT(T.fname, ' ', T.lname) AS fullName\nFROM Trainer AS T\nWHERE T.trainerNo IN (\n    SELECT WT.trainerNo\n    FROM WorkshopTrainer AS WT\n    GROUP BY WT.trainerNo\n    HAVING COUNT(*) >= 2\n);\n```"},{"number":"4","goal":"用correlated query保留每项资格的最高等级","steps":["外层Participant连接Qualification，当前行已有qname与qlevel。","内层仅在Q2.qname=外层Q.qname的同一种资格里取MAX(qlevel)。","当前qlevel等于最大值就保留，因此并列最高全部保留。","ORDER BY qname,participantNo，输出指定四项。"],"check":"新增一个同等级并列者，结果应多出该人而不是替换旧人。","pitfall":"全表MAX会把不同资格混在一起；LIMIT 1也会漏并列。","code":"```sql\nSELECT P.participantNo, CONCAT(P.fname, ' ', P.lname) AS fullName,\n       Q.qname, Q.qlevel\nFROM Participant AS P\nJOIN Qualification AS Q ON Q.participantNo = P.participantNo\nWHERE Q.qlevel = (\n    SELECT MAX(Q2.qlevel)\n    FROM Qualification AS Q2\n    WHERE Q2.qname = Q.qname\n)\nORDER BY Q.qname, P.participantNo;\n```"},{"number":"5","goal":"用correlated EXISTS检查高费用已完成课程","steps":["对当前参与者，内层Enrolment用participantNo关联。","连接Workshop获得当前fee，限定COMPLETED且fee>=200。","EXISTS满足一次就足够，外层每人只一行。"],"check":"原数据1、4、7、9，200边界包含。","pitfall":"不能用历史付款假设替代原表中的当前fee。","code":"```sql\nSELECT P.participantNo, CONCAT(P.fname, ' ', P.lname) AS fullName\nFROM Participant AS P\nWHERE EXISTS (\n    SELECT 1\n    FROM Enrolment AS E\n    JOIN Workshop AS W ON W.workshopNo = E.workshopNo\n    WHERE E.participantNo = P.participantNo\n      AND E.status = 'COMPLETED'\n      AND W.fee >= 200.00\n);\n```"}],"tags":["COUNT, SUM, AVG and MAX","Nested queries, EXISTS and anti-joins","Correlated queries, ties and universal conditions"],"questionHTML":"\u003cp>Implement SQL nested query statements for questions (1), (2) and (3). \u003c/p>\n\u003cp>(1) Find the workshop number, title and fee of every workshop whose fee is higher than  the average fee of all workshops. \u003c/p>\n\u003cp>(2) Find the participant number and full name of participants who have completed at least  one TECHNOLOGY workshop and at least one BUSINESS workshop. Cancelled  enrolments must not contribute to either condition. \u003c/p>\n\u003cp>(3) Find the trainer number and full name of trainers assigned to at least two workshops.  Count workshop assignments, not enrolments.    Implement SQL correlated nested query statements for questions (4) and \u003c/p>\n\u003cp>(5). \u003c/p>\n\u003cp>(4) Find the participant number, full name, qualification name and qualification level of  participants whose level is the highest recorded for that qualification name. Order by  qualification name, then participant number. \u003c/p>\n\u003cp>(5) Find the participant number and full name of participants who have completed at least  one workshop with a current fee of 200.00 or more. Ignore cancelled enrolments.\u003c/p>\n","answerHTML":"\u003cp>(1) 先用子查询算全部工作坊的平均费用，外层筛选费用高于该平均值的工作坊。原数据对应1、2、5、7。\u003c/p>\n\u003cp>(2) 两个条件必须同时满足：至少完成一门技术类工作坊，并至少完成一门商务类工作坊。因此分别找出满足两类条件的参与者，再同时用IN判断。两部分都只计COMPLETED。原数据对应参与者1、4、9。\u003c/p>\n\u003cp>(3) 统计WorkshopTrainer中的培训师分配次数，保留至少两次者。不能改数Enrolment的报名人数。原数据对应培训师1、7。\u003c/p>\n\u003cp>(4) 对当前Qualification行，用相同qname的最大qlevel作比较。子查询引用外层qname，属于correlated subquery。达到相同最高等级的多个人都保留；不是找整张表的一个最高值。\u003c/p>\n\u003cp>(5) 对当前参与者，检查是否存在一条已完成的报名，其工作坊现在的费用至少200。这里使用当前Workshop.fee，不假设保存了历史支付费用。原数据对应参与者1、4、7、9。\u003c/p>\n\u003cp>前一代码块对应(1)–(3)，后一代码块对应(4)–(5)。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nSELECT workshopNo, title, fee\nFROM Workshop\nWHERE fee &gt; (SELECT AVG(fee) FROM Workshop);\n\n-- (2)\nSELECT P.participantNo, CONCAT(P.fname, &#39; &#39;, P.lname) AS fullName\nFROM Participant AS P\nWHERE P.participantNo IN (\n    SELECT E.participantNo\n    FROM Enrolment AS E\n    WHERE E.status = &#39;COMPLETED&#39;\n      AND E.workshopNo IN (\n          SELECT workshopNo FROM Workshop WHERE category = &#39;TECHNOLOGY&#39;\n      )\n)\nAND P.participantNo IN (\n    SELECT E.participantNo\n    FROM Enrolment AS E\n    WHERE E.status = &#39;COMPLETED&#39;\n      AND E.workshopNo IN (\n          SELECT workshopNo FROM Workshop WHERE category = &#39;BUSINESS&#39;\n      )\n);\n\n-- (3)\nSELECT T.trainerNo, CONCAT(T.fname, &#39; &#39;, T.lname) AS fullName\nFROM Trainer AS T\nWHERE T.trainerNo IN (\n    SELECT WT.trainerNo\n    FROM WorkshopTrainer AS WT\n    GROUP BY WT.trainerNo\n    HAVING COUNT(*) &gt;= 2\n);\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-sql\">-- (4)\nSELECT P.participantNo, CONCAT(P.fname, &#39; &#39;, P.lname) AS fullName,\n       Q.qname, Q.qlevel\nFROM Participant AS P\nJOIN Qualification AS Q ON Q.participantNo = P.participantNo\nWHERE Q.qlevel = (\n    SELECT MAX(Q2.qlevel)\n    FROM Qualification AS Q2\n    WHERE Q2.qname = Q.qname\n)\nORDER BY Q.qname, P.participantNo;\n\n-- (5)\nSELECT P.participantNo, CONCAT(P.fname, &#39; &#39;, P.lname) AS fullName\nFROM Participant AS P\nWHERE EXISTS (\n    SELECT 1\n    FROM Enrolment AS E\n    JOIN Workshop AS W ON W.workshopNo = E.workshopNo\n    WHERE E.participantNo = P.participantNo\n      AND E.status = &#39;COMPLETED&#39;\n      AND W.fee &gt;= 200.00\n);\n\u003c/code>\u003c/pre>\n"},{"id":"A4-T2","title":"Assignment 4 — Task 2","topic":"公用表表达式、视图与高级数据操作","areas":["SELECT","DDL/DML"],"source":"assignment-4","sourceLabel":"Assignment 4","sourceNote":"Assignment 4.pdf pp3,5–6,8,10; original dbcreate.sql and dbload.sql Public edition: example names, contact details and password literals anonymized.","origin":"Original material","priority":"core","question":"(1) Implement SELECT statements in a WITH clause for the query below.    Find the participant number, full name and email of all  participants who have enrolled in a workshop taught by at  least one trainer whose organisation is 'UOW'. Include  enrolments regardless of their status. Use at least two named  common table expressions.    You must implement at least 2 subqueries in the WITH clause for this question. \n\n(2) Use relational views to implement the questions below.    Find the workshop number, title and category of all workshops  in which PARTICIPANT_02 SAMPLE has enrolled. Display the result, then  drop the views in dependency order.    You must create at least 2 views to implement the query above. \n\n(3) Implement the questions below by using the advanced DDL and other required  statements.    Use one CREATE TABLE ... AS SELECT statement to create and  populate ParticipantQualifications with the participant  number, full name, email and total number of qualifications  possessed by each participant, including participants with no  qualifications. Name the columns participantNo, fullName,  email and totalQualifications. Then define participantNo as  both the primary key and a foreign key referencing  Participant(participantNo). Display all rows and finally drop \n\nParticipantQualifications. \n\n(4) Implement the questions below by using the advanced DML statements.    Increase capacity by 10 places for each workshop assigned to  at least two trainers. Use WorkshopTrainer to identify the  workshops rather than hard-coded numbers. Display the workshop  number, title and new capacity of the affected workshops. \n\n(5) Implement the questions below by using the advanced DML statements.  Remove BUSINESS workshops whose current fee is less than \n150.00.   Note that you must remove the information from the child tables (which contain  foreign key references to the parent table), then remove the information from the  parent table (which is referenced by the child tables).","answer":"### (1) 两个有名称的common table expression (CTE)\n\n第一个CTE找出至少有一位UOW培训师的工作坊；第二个CTE找出报名过这些工作坊的参与者。最后读取这些人的编号、全名和邮箱。按题目要求，报名状态不限，包含取消报名。原数据对应1、2、4、7、8、12。\n\n```sql\nWITH UOWWorkshops AS (\n    SELECT DISTINCT WT.workshopNo\n    FROM WorkshopTrainer AS WT\n    JOIN Trainer AS T ON T.trainerNo = WT.trainerNo\n    WHERE T.organisation = 'UOW'\n),\nEligibleParticipants AS (\n    SELECT DISTINCT E.participantNo\n    FROM Enrolment AS E\n    JOIN UOWWorkshops AS U ON U.workshopNo = E.workshopNo\n)\nSELECT P.participantNo, CONCAT(P.fname, ' ', P.lname) AS fullName, P.email\nFROM Participant AS P\nJOIN EligibleParticipants AS EP ON EP.participantNo = P.participantNo;\n```\n\n### (2) 两个视图以及删除顺序\n\n第一个视图找出PARTICIPANT_02 SAMPLE报名的工作坊编号；第二个视图引用第一个，读取工作坊详情。显示结果后，先删依赖别人的TargetWorkshops，再删被依赖的TargetEnrolments。原数据为工作坊1和6。\n\n```sql\nCREATE VIEW TargetEnrolments AS\nSELECT E.workshopNo\nFROM Enrolment AS E\nJOIN Participant AS P ON P.participantNo = E.participantNo\nWHERE P.fname = 'PARTICIPANT_02' AND P.lname = 'SAMPLE';\n\nCREATE VIEW TargetWorkshops AS\nSELECT DISTINCT W.workshopNo, W.title, W.category\nFROM Workshop AS W\nJOIN TargetEnrolments AS L ON L.workshopNo = W.workshopNo;\n\nSELECT workshopNo, title, category FROM TargetWorkshops;\n\nDROP VIEW TargetWorkshops;\nDROP VIEW TargetEnrolments;\n```\n\n### (3) 创建统计表，再追加键约束\n\nLEFT JOIN保留没有资格的参与者，用COUNT(Q.qname)得到0。CREATE TABLE ... AS SELECT不会自动复制源表的primary key和foreign key，所以再用ALTER TABLE定义。按题面列出全部行后删除表。\n\n```sql\nCREATE TABLE ParticipantQualifications AS\nSELECT P.participantNo,\n       CONCAT(P.fname, ' ', P.lname) AS fullName,\n       P.email,\n       COUNT(Q.qname) AS totalQualifications\nFROM Participant AS P\nLEFT JOIN Qualification AS Q ON Q.participantNo = P.participantNo\nGROUP BY P.participantNo, P.fname, P.lname, P.email;\n\nALTER TABLE ParticipantQualifications\n    ADD CONSTRAINT pq_pkey PRIMARY KEY (participantNo),\n    ADD CONSTRAINT pq_fkey FOREIGN KEY (participantNo)\n        REFERENCES Participant(participantNo);\n\nSELECT participantNo, fullName, email, totalQualifications\nFROM ParticipantQualifications;\n\nDROP TABLE ParticipantQualifications;\n```\n\n### (4) 按培训师人数增加容量\n\n先从WorkshopTrainer中按工作坊分组，找出分配至少两位培训师的工作坊；以此更新capacity，再用同一条件显示结果。原数据中工作坊3从50变60，工作坊7从35变45。题目是加10个名额，不是提高10%，也不是修改费用。\n\n```sql\nUPDATE Workshop\nSET capacity = capacity + 10\nWHERE workshopNo IN (\n    SELECT workshopNo\n    FROM WorkshopTrainer\n    GROUP BY workshopNo\n    HAVING COUNT(*) >= 2\n);\n\nSELECT W.workshopNo, W.title, W.capacity\nFROM Workshop AS W\nWHERE W.workshopNo IN (\n    SELECT workshopNo\n    FROM WorkshopTrainer\n    GROUP BY workshopNo\n    HAVING COUNT(*) >= 2\n);\n```\n\n### (5) 删除符合条件的商务类工作坊\n\n删除条件必须同时满足category为BUSINESS、fee小于150。先删Enrolment、Requirement、WorkshopTrainer中的相关行，再删Workshop。原数据目标为工作坊4和8。保留参与者和培训师本身，也不关闭foreign key。\n\n```sql\nDELETE FROM Enrolment\nWHERE workshopNo IN (\n    SELECT workshopNo FROM Workshop\n    WHERE category = 'BUSINESS' AND fee \u003c 150.00\n);\n\nDELETE FROM Requirement\nWHERE workshopNo IN (\n    SELECT workshopNo FROM Workshop\n    WHERE category = 'BUSINESS' AND fee \u003c 150.00\n);\n\nDELETE FROM WorkshopTrainer\nWHERE workshopNo IN (\n    SELECT workshopNo FROM Workshop\n    WHERE category = 'BUSINESS' AND fee \u003c 150.00\n);\n\nDELETE FROM Workshop\nWHERE category = 'BUSINESS' AND fee \u003c 150.00;\n```","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"用至少两个CTE分阶段查UOW培训参与者","steps":["CTE一把Trainer与WorkshopTrainer连接，筛organisation=UOW，再对workshopNo去重。","CTE二连接Enrolment，得到报名过这些workshops的participantNo并去重。","最终连接Participant取编号、全名、邮箱；不筛status，保留取消报名。"],"check":"有两个named CTE，原数据参与者1、2、4、7、8、12。","pitfall":"只定义一个CTE或者悄悄加COMPLETED都不符合题面。","code":"```sql\nWITH UOWWorkshops AS (\n    SELECT DISTINCT WT.workshopNo\n    FROM WorkshopTrainer AS WT\n    JOIN Trainer AS T ON T.trainerNo = WT.trainerNo\n    WHERE T.organisation = 'UOW'\n),\nEligibleParticipants AS (\n    SELECT DISTINCT E.participantNo\n    FROM Enrolment AS E\n    JOIN UOWWorkshops AS U ON U.workshopNo = E.workshopNo\n)\nSELECT P.participantNo, CONCAT(P.fname, ' ', P.lname) AS fullName, P.email\nFROM Participant AS P\nJOIN EligibleParticipants AS EP ON EP.participantNo = P.participantNo;\n```"},{"number":"2","goal":"用至少两个相互依赖的views查PARTICIPANT_02报名","steps":["第一个view根据Participant姓名连接Enrolment，只保留所报workshopNo。","第二个view引用第一个并连接Workshop，得到编号、标题、类别，避免重复。","SELECT显示结果后，先DROP第二个依赖view，再DROP第一个。"],"check":"原数据workshops1、6，最后两个views均删除。","pitfall":"同时创建两个互不使用的views并不能说明它们共同实现了题目。","code":"```sql\nCREATE VIEW TargetEnrolments AS\nSELECT E.workshopNo\nFROM Enrolment AS E\nJOIN Participant AS P ON P.participantNo = E.participantNo\nWHERE P.fname = 'PARTICIPANT_02' AND P.lname = 'SAMPLE';\n\nCREATE VIEW TargetWorkshops AS\nSELECT DISTINCT W.workshopNo, W.title, W.category\nFROM Workshop AS W\nJOIN TargetEnrolments AS L ON L.workshopNo = W.workshopNo;\n\nSELECT workshopNo, title, category FROM TargetWorkshops;\n\nDROP VIEW TargetWorkshops;\nDROP VIEW TargetEnrolments;\n```"},{"number":"3","goal":"一条CTAS建资格统计快照，再加PK/FK","steps":["Participant LEFT JOIN Qualification，按参与者分组；COUNT(Q.qname)给无资格者0。","给四个SELECT表达式准确命名participantNo/fullName/email/totalQualifications。","CREATE TABLE ... AS SELECT一次完成建表与装载；再ALTER添加participantNo primary key和指向Participant的foreign key。","SELECT全部行，再DROP表。原表约束不会自动从CTAS复制。"],"check":"恰好四列；参与者11有一行且总数0。","pitfall":"先建空表再INSERT虽然能实现统计，却不满足本题“一条CTAS”的指定形式。","code":"```sql\nCREATE TABLE ParticipantQualifications AS\nSELECT P.participantNo,\n       CONCAT(P.fname, ' ', P.lname) AS fullName,\n       P.email,\n       COUNT(Q.qname) AS totalQualifications\nFROM Participant AS P\nLEFT JOIN Qualification AS Q ON Q.participantNo = P.participantNo\nGROUP BY P.participantNo, P.fname, P.lname, P.email;\n\nALTER TABLE ParticipantQualifications\n    ADD CONSTRAINT pq_pkey PRIMARY KEY (participantNo),\n    ADD CONSTRAINT pq_fkey FOREIGN KEY (participantNo)\n        REFERENCES Participant(participantNo);\n\nSELECT participantNo, fullName, email, totalQualifications\nFROM ParticipantQualifications;\n\nDROP TABLE ParticipantQualifications;\n```"},{"number":"4","goal":"对至少两培训师的工作坊容量加10","steps":["WorkshopTrainer按workshopNo GROUP BY，HAVING COUNT(*)>=2。","在UPDATE Workshop的WHERE使用这个子查询集合，不硬编码3或7。","SET capacity=capacity+10；再按相同分配条件SELECT展示更新后的容量。"],"check":"3号50→60，7号35→45，其他不变；重复执行会再次增加。","pitfall":"不能改fee，也不是容量增加10%。","code":"```sql\nUPDATE Workshop\nSET capacity = capacity + 10\nWHERE workshopNo IN (\n    SELECT workshopNo\n    FROM WorkshopTrainer\n    GROUP BY workshopNo\n    HAVING COUNT(*) >= 2\n);\n\nSELECT W.workshopNo, W.title, W.capacity\nFROM Workshop AS W\nWHERE W.workshopNo IN (\n    SELECT workshopNo\n    FROM WorkshopTrainer\n    GROUP BY workshopNo\n    HAVING COUNT(*) >= 2\n);\n```"},{"number":"5","goal":"先删引用，再删低费用BUSINESS工作坊","steps":["目标条件category=BUSINESS AND fee\u003c150，边界150不删。","对Enrolment、Requirement、WorkshopTrainer分别删除引用目标工作坊的行。","最后DELETE Workshop本身；不要删除Participant或Trainer目录对象。"],"check":"原数据仅workshops4、8被移除，foreign keys始终生效。","pitfall":"先删父表、使用OR、或关闭foreign key检查都会有问题。","code":"```sql\nDELETE FROM Enrolment\nWHERE workshopNo IN (\n    SELECT workshopNo FROM Workshop\n    WHERE category = 'BUSINESS' AND fee \u003c 150.00\n);\n\nDELETE FROM Requirement\nWHERE workshopNo IN (\n    SELECT workshopNo FROM Workshop\n    WHERE category = 'BUSINESS' AND fee \u003c 150.00\n);\n\nDELETE FROM WorkshopTrainer\nWHERE workshopNo IN (\n    SELECT workshopNo FROM Workshop\n    WHERE category = 'BUSINESS' AND fee \u003c 150.00\n);\n\nDELETE FROM Workshop\nWHERE category = 'BUSINESS' AND fee \u003c 150.00;\n```"}],"tags":["CTE and derived tables","View dependencies and drop order","CTAS and INSERT SELECT","Subquery-driven UPDATE and DELETE"],"questionHTML":"\u003cp>(1) Implement SELECT statements in a WITH clause for the query below.    Find the participant number, full name and email of all  participants who have enrolled in a workshop taught by at  least one trainer whose organisation is &#39;UOW&#39;. Include  enrolments regardless of their status. Use at least two named  common table expressions.    You must implement at least 2 subqueries in the WITH clause for this question. \u003c/p>\n\u003cp>(2) Use relational views to implement the questions below.    Find the workshop number, title and category of all workshops  in which PARTICIPANT_02 SAMPLE has enrolled. Display the result, then  drop the views in dependency order.    You must create at least 2 views to implement the query above. \u003c/p>\n\u003cp>(3) Implement the questions below by using the advanced DDL and other required  statements.    Use one CREATE TABLE ... AS SELECT statement to create and  populate ParticipantQualifications with the participant  number, full name, email and total number of qualifications  possessed by each participant, including participants with no  qualifications. Name the columns participantNo, fullName,  email and totalQualifications. Then define participantNo as  both the primary key and a foreign key referencing  Participant(participantNo). Display all rows and finally drop \u003c/p>\n\u003cp>ParticipantQualifications. \u003c/p>\n\u003cp>(4) Implement the questions below by using the advanced DML statements.    Increase capacity by 10 places for each workshop assigned to  at least two trainers. Use WorkshopTrainer to identify the  workshops rather than hard-coded numbers. Display the workshop  number, title and new capacity of the affected workshops. \u003c/p>\n\u003cp>(5) Implement the questions below by using the advanced DML statements.  Remove BUSINESS workshops whose current fee is less than \n150.00.   Note that you must remove the information from the child tables (which contain  foreign key references to the parent table), then remove the information from the  parent table (which is referenced by the child tables).\u003c/p>\n","answerHTML":"\u003ch3>(1) 两个有名称的common table expression (CTE)\u003c/h3>\n\u003cp>第一个CTE找出至少有一位UOW培训师的工作坊；第二个CTE找出报名过这些工作坊的参与者。最后读取这些人的编号、全名和邮箱。按题目要求，报名状态不限，包含取消报名。原数据对应1、2、4、7、8、12。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">WITH UOWWorkshops AS (\n    SELECT DISTINCT WT.workshopNo\n    FROM WorkshopTrainer AS WT\n    JOIN Trainer AS T ON T.trainerNo = WT.trainerNo\n    WHERE T.organisation = &#39;UOW&#39;\n),\nEligibleParticipants AS (\n    SELECT DISTINCT E.participantNo\n    FROM Enrolment AS E\n    JOIN UOWWorkshops AS U ON U.workshopNo = E.workshopNo\n)\nSELECT P.participantNo, CONCAT(P.fname, &#39; &#39;, P.lname) AS fullName, P.email\nFROM Participant AS P\nJOIN EligibleParticipants AS EP ON EP.participantNo = P.participantNo;\n\u003c/code>\u003c/pre>\n\u003ch3>(2) 两个视图以及删除顺序\u003c/h3>\n\u003cp>第一个视图找出PARTICIPANT_02 SAMPLE报名的工作坊编号；第二个视图引用第一个，读取工作坊详情。显示结果后，先删依赖别人的TargetWorkshops，再删被依赖的TargetEnrolments。原数据为工作坊1和6。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">CREATE VIEW TargetEnrolments AS\nSELECT E.workshopNo\nFROM Enrolment AS E\nJOIN Participant AS P ON P.participantNo = E.participantNo\nWHERE P.fname = &#39;PARTICIPANT_02&#39; AND P.lname = &#39;SAMPLE&#39;;\n\nCREATE VIEW TargetWorkshops AS\nSELECT DISTINCT W.workshopNo, W.title, W.category\nFROM Workshop AS W\nJOIN TargetEnrolments AS L ON L.workshopNo = W.workshopNo;\n\nSELECT workshopNo, title, category FROM TargetWorkshops;\n\nDROP VIEW TargetWorkshops;\nDROP VIEW TargetEnrolments;\n\u003c/code>\u003c/pre>\n\u003ch3>(3) 创建统计表，再追加键约束\u003c/h3>\n\u003cp>LEFT JOIN保留没有资格的参与者，用COUNT(Q.qname)得到0。CREATE TABLE ... AS SELECT不会自动复制源表的primary key和foreign key，所以再用ALTER TABLE定义。按题面列出全部行后删除表。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">CREATE TABLE ParticipantQualifications AS\nSELECT P.participantNo,\n       CONCAT(P.fname, &#39; &#39;, P.lname) AS fullName,\n       P.email,\n       COUNT(Q.qname) AS totalQualifications\nFROM Participant AS P\nLEFT JOIN Qualification AS Q ON Q.participantNo = P.participantNo\nGROUP BY P.participantNo, P.fname, P.lname, P.email;\n\nALTER TABLE ParticipantQualifications\n    ADD CONSTRAINT pq_pkey PRIMARY KEY (participantNo),\n    ADD CONSTRAINT pq_fkey FOREIGN KEY (participantNo)\n        REFERENCES Participant(participantNo);\n\nSELECT participantNo, fullName, email, totalQualifications\nFROM ParticipantQualifications;\n\nDROP TABLE ParticipantQualifications;\n\u003c/code>\u003c/pre>\n\u003ch3>(4) 按培训师人数增加容量\u003c/h3>\n\u003cp>先从WorkshopTrainer中按工作坊分组，找出分配至少两位培训师的工作坊；以此更新capacity，再用同一条件显示结果。原数据中工作坊3从50变60，工作坊7从35变45。题目是加10个名额，不是提高10%，也不是修改费用。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">UPDATE Workshop\nSET capacity = capacity + 10\nWHERE workshopNo IN (\n    SELECT workshopNo\n    FROM WorkshopTrainer\n    GROUP BY workshopNo\n    HAVING COUNT(*) &gt;= 2\n);\n\nSELECT W.workshopNo, W.title, W.capacity\nFROM Workshop AS W\nWHERE W.workshopNo IN (\n    SELECT workshopNo\n    FROM WorkshopTrainer\n    GROUP BY workshopNo\n    HAVING COUNT(*) &gt;= 2\n);\n\u003c/code>\u003c/pre>\n\u003ch3>(5) 删除符合条件的商务类工作坊\u003c/h3>\n\u003cp>删除条件必须同时满足category为BUSINESS、fee小于150。先删Enrolment、Requirement、WorkshopTrainer中的相关行，再删Workshop。原数据目标为工作坊4和8。保留参与者和培训师本身，也不关闭foreign key。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">DELETE FROM Enrolment\nWHERE workshopNo IN (\n    SELECT workshopNo FROM Workshop\n    WHERE category = &#39;BUSINESS&#39; AND fee &lt; 150.00\n);\n\nDELETE FROM Requirement\nWHERE workshopNo IN (\n    SELECT workshopNo FROM Workshop\n    WHERE category = &#39;BUSINESS&#39; AND fee &lt; 150.00\n);\n\nDELETE FROM WorkshopTrainer\nWHERE workshopNo IN (\n    SELECT workshopNo FROM Workshop\n    WHERE category = &#39;BUSINESS&#39; AND fee &lt; 150.00\n);\n\nDELETE FROM Workshop\nWHERE category = &#39;BUSINESS&#39; AND fee &lt; 150.00;\n\u003c/code>\u003c/pre>\n"},{"id":"A4-T3","title":"Assignment 4 — Task 3","topic":"用户、指定列的读取权限与汇总视图","areas":["Access"],"source":"assignment-4","sourceLabel":"Assignment 4","sourceNote":"Assignment 4.pdf pp3,5–6,8,10; original dbcreate.sql and dbload.sql Public edition: example names, contact details and password literals anonymized.","origin":"Original material","priority":"core","question":"Note that a user csit882 does not have the privileges required to process the steps listed  below. You must connect as the user root with the password [ROOT_PASSWORD].    Assume that the user root with a password '[ROOT_OR_USER_PASSWORD]' created a database called csit882.  The user root has created the sample database by executing dbcreate.sql and dbload.sql in  the database csit882. The user root nominates the database csit882 as the default  database.    Implement the SQL statements for the questions below. \n\n(1) Create two new users named \u003cemail-prefix>_1 and \u003cemail-prefix>_2. Use the part  of your UOW email address before @ as \u003cemail-prefix>.   For example, the anonymized prefix STUDENT_CODE gives STUDENT_CODE_1 and STUDENT_CODE_2. The passwords are  up to you \n\n(2) Grant read privileges on all relational tables in the database csit882 to the first user  created in subtask 1. The first user must not be allowed to propagate these privileges to  other users or roles. \n\n(3) Grant write privileges (INSERT, UPDATE and DELETE) on the relational table  Enrolment in the database csit882 to the first user created in subtask 1. The first user  must not be allowed to propagate these privileges to other users or roles. \n\n(4) Grant read privileges on only the workshop number, title, category and fee in the  relational table Workshop in the database csit882 to the second user created in  subtask 1. The second user must be allowed to grant the same privileges to other  users or roles. \n\n(5) Grant read privileges on the participant number, full name and total number of  qualifications possessed by each participant, including participants with no  qualifications, to the second user created in subtask 1. Create a view named  ParticipantQualificationSummary to provide this information. The second user must  not be allowed to propagate the privileges on this view to other users or roles.","answer":"账号主机按localhost处理。STUDENT_CODE是题面示例邮箱前缀，实际作答换成自己的前缀；密码自行选择。\n\n1. 创建两个账号。\n2. 对第一个账号授予数据库范围的SELECT，不加WITH GRANT OPTION。\n3. 对第一个账号另外授予Enrolment的INSERT、UPDATE、DELETE，同样不授转授权能力。\n4. 第二个账号只获得Workshop中题目列出的四列读取权，不包括date和capacity；WITH GRANT OPTION允许它把这些读取权再授给别人。\n5. 由root创建汇总视图。LEFT JOIN保留没有资格的人，统计右侧qname得到0。只把该视图的SELECT授给第二个账号，不加WITH GRANT OPTION。(4)已有的表级转授权范围只在Workshop，不会自动覆盖这个不同的视图。\n\n视图使用SQL SECURITY DEFINER，由创建者权限访问底表，不必额外开放参与者和资格两张底表。\n\n\n```sql\nUSE csit882;\n\n-- (1)\nCREATE USER 'STUDENT_CODE_1'@'localhost' IDENTIFIED BY '[CHOOSE_PASSWORD]';\nCREATE USER 'STUDENT_CODE_2'@'localhost' IDENTIFIED BY '[CHOOSE_PASSWORD]';\n\n-- (2)\nGRANT SELECT ON csit882.* TO 'STUDENT_CODE_1'@'localhost';\n\n-- (3)\nGRANT INSERT, UPDATE, DELETE ON csit882.Enrolment\nTO 'STUDENT_CODE_1'@'localhost';\n\n-- (4)\nGRANT SELECT (workshopNo, title, category, fee)\nON csit882.Workshop\nTO 'STUDENT_CODE_2'@'localhost'\nWITH GRANT OPTION;\n\n-- (5)\nCREATE SQL SECURITY DEFINER VIEW csit882.ParticipantQualificationSummary AS\nSELECT P.participantNo,\n       CONCAT(P.fname, ' ', P.lname) AS fullName,\n       COUNT(Q.qname) AS totalQualifications\nFROM csit882.Participant AS P\nLEFT JOIN csit882.Qualification AS Q ON Q.participantNo = P.participantNo\nGROUP BY P.participantNo, P.fname, P.lname;\n\nGRANT SELECT ON csit882.ParticipantQualificationSummary\nTO 'STUDENT_CODE_2'@'localhost';\n```","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"用邮箱前缀创建两用户","steps":["root权限执行；用户名按本人的email-prefix加_1、_2。","保持host为localhost，密码自行选择，不能把示例邮箱当成本人的固定用户名。","两条CREATE USER先于后续GRANT，默认数据库为csit882。"],"check":"两个用户名不同，后续引用完全一致。","pitfall":"直接按csit882普通用户运行可能没有创建账号或授权权限。","code":"```sql\nCREATE USER 'STUDENT_CODE_1'@'localhost' IDENTIFIED BY '[CHOOSE_PASSWORD]';\nCREATE USER 'STUDENT_CODE_2'@'localhost' IDENTIFIED BY '[CHOOSE_PASSWORD]';\n```"},{"number":"2","goal":"给第一用户所有表的读取权","steps":["使用GRANT SELECT ON csit882.*。","目标为第一个新账号。","不加WITH GRANT OPTION，并按新用户没有其他权限来源理解。"],"check":"范围是当前数据库，不是整个服务器。","pitfall":"USAGE不是读取权限。","code":"```sql\nGRANT SELECT ON csit882.* TO 'STUDENT_CODE_1'@'localhost';\n```"},{"number":"3","goal":"给第一用户Enrolment写权限","steps":["write具体展开为INSERT、UPDATE、DELETE。","ON csit882.Enrolment限定表。","不附WITH GRANT OPTION，不扩到其他表。"],"check":"三个写权限齐全，已有读取权仍保留。","pitfall":"GRANT ALL会给出题目之外的其他权限。","code":"```sql\nGRANT INSERT, UPDATE, DELETE ON csit882.Enrolment\nTO 'STUDENT_CODE_1'@'localhost';\n```"},{"number":"4","goal":"给第二用户指定四列读取及转授","steps":["GRANT SELECT后在括号中列workshopNo,title,category,fee。","ON csit882.Workshop，不授整表SELECT。","WITH GRANT OPTION允许转授这项列级权限。"],"check":"date和capacity不在授权列中。","pitfall":"在ON后写四列不是正确column privilege位置。","code":"```sql\nGRANT SELECT (workshopNo, title, category, fee)\nON csit882.Workshop\nTO 'STUDENT_CODE_2'@'localhost'\nWITH GRANT OPTION;\n```"},{"number":"5","goal":"通过指定汇总view开放参与者资格总数","steps":["root创建ParticipantQualificationSummary，Participant LEFT JOIN Qualification。","COUNT(Q.qname)且按参与者分组，完整保留零资格者。","只授第二用户view的SELECT，不加GRANT OPTION；Workshop上的table-level传播范围不会自动覆盖这张view。"],"check":"输出编号、全名、资格总数，且无资格者为0。","pitfall":"不要为了能读view而额外开放所有底表。","code":"```sql\nCREATE SQL SECURITY DEFINER VIEW csit882.ParticipantQualificationSummary AS\nSELECT P.participantNo,\n       CONCAT(P.fname, ' ', P.lname) AS fullName,\n       COUNT(Q.qname) AS totalQualifications\nFROM csit882.Participant AS P\nLEFT JOIN csit882.Qualification AS Q ON Q.participantNo = P.participantNo\nGROUP BY P.participantNo, P.fname, P.lname;\n\nGRANT SELECT ON csit882.ParticipantQualificationSummary\nTO 'STUDENT_CODE_2'@'localhost';\n```"}],"tags":["Database/table/column scopes and GRANT OPTION","Views for restricted rows/columns and summaries"],"questionHTML":"\u003cp>Note that a user csit882 does not have the privileges required to process the steps listed  below. You must connect as the user root with the password [ROOT_PASSWORD].    Assume that the user root with a password &#39;[ROOT_OR_USER_PASSWORD]&#39; created a database called csit882.  The user root has created the sample database by executing dbcreate.sql and dbload.sql in  the database csit882. The user root nominates the database csit882 as the default  database.    Implement the SQL statements for the questions below. \u003c/p>\n\u003cp>(1) Create two new users named &lt;email-prefix&gt;_1 and &lt;email-prefix&gt;_2. Use the part  of your UOW email address before @ as &lt;email-prefix&gt;.   For example, the anonymized prefix STUDENT_CODE gives STUDENT_CODE_1 and STUDENT_CODE_2. The passwords are  up to you \u003c/p>\n\u003cp>(2) Grant read privileges on all relational tables in the database csit882 to the first user  created in subtask 1. The first user must not be allowed to propagate these privileges to  other users or roles. \u003c/p>\n\u003cp>(3) Grant write privileges (INSERT, UPDATE and DELETE) on the relational table  Enrolment in the database csit882 to the first user created in subtask 1. The first user  must not be allowed to propagate these privileges to other users or roles. \u003c/p>\n\u003cp>(4) Grant read privileges on only the workshop number, title, category and fee in the  relational table Workshop in the database csit882 to the second user created in  subtask 1. The second user must be allowed to grant the same privileges to other  users or roles. \u003c/p>\n\u003cp>(5) Grant read privileges on the participant number, full name and total number of  qualifications possessed by each participant, including participants with no  qualifications, to the second user created in subtask 1. Create a view named  ParticipantQualificationSummary to provide this information. The second user must  not be allowed to propagate the privileges on this view to other users or roles.\u003c/p>\n","answerHTML":"\u003cp>账号主机按localhost处理。STUDENT_CODE是题面示例邮箱前缀，实际作答换成自己的前缀；密码自行选择。\u003c/p>\n\u003col>\n\u003cli>创建两个账号。\u003c/li>\n\u003cli>对第一个账号授予数据库范围的SELECT，不加WITH GRANT OPTION。\u003c/li>\n\u003cli>对第一个账号另外授予Enrolment的INSERT、UPDATE、DELETE，同样不授转授权能力。\u003c/li>\n\u003cli>第二个账号只获得Workshop中题目列出的四列读取权，不包括date和capacity；WITH GRANT OPTION允许它把这些读取权再授给别人。\u003c/li>\n\u003cli>由root创建汇总视图。LEFT JOIN保留没有资格的人，统计右侧qname得到0。只把该视图的SELECT授给第二个账号，不加WITH GRANT OPTION。(4)已有的表级转授权范围只在Workshop，不会自动覆盖这个不同的视图。\u003c/li>\n\u003c/ol>\n\u003cp>视图使用SQL SECURITY DEFINER，由创建者权限访问底表，不必额外开放参与者和资格两张底表。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">USE csit882;\n\n-- (1)\nCREATE USER &#39;STUDENT_CODE_1&#39;@&#39;localhost&#39; IDENTIFIED BY &#39;[CHOOSE_PASSWORD]&#39;;\nCREATE USER &#39;STUDENT_CODE_2&#39;@&#39;localhost&#39; IDENTIFIED BY &#39;[CHOOSE_PASSWORD]&#39;;\n\n-- (2)\nGRANT SELECT ON csit882.* TO &#39;STUDENT_CODE_1&#39;@&#39;localhost&#39;;\n\n-- (3)\nGRANT INSERT, UPDATE, DELETE ON csit882.Enrolment\nTO &#39;STUDENT_CODE_1&#39;@&#39;localhost&#39;;\n\n-- (4)\nGRANT SELECT (workshopNo, title, category, fee)\nON csit882.Workshop\nTO &#39;STUDENT_CODE_2&#39;@&#39;localhost&#39;\nWITH GRANT OPTION;\n\n-- (5)\nCREATE SQL SECURITY DEFINER VIEW csit882.ParticipantQualificationSummary AS\nSELECT P.participantNo,\n       CONCAT(P.fname, &#39; &#39;, P.lname) AS fullName,\n       COUNT(Q.qname) AS totalQualifications\nFROM csit882.Participant AS P\nLEFT JOIN csit882.Qualification AS Q ON Q.participantNo = P.participantNo\nGROUP BY P.participantNo, P.fname, P.lname;\n\nGRANT SELECT ON csit882.ParticipantQualificationSummary\nTO &#39;STUDENT_CODE_2&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"},{"id":"A4-T4","title":"Assignment 4 — Task 4","topic":"根据函数依赖求最小键和最高范式","areas":["Normalization"],"source":"assignment-4","sourceLabel":"Assignment 4","sourceNote":"Assignment 4.pdf pp3,5–6,8,10; original dbcreate.sql and dbload.sql","origin":"Original material","priority":"core","question":"Consider the relational schemas given below and the respective sets of functional  dependencies valid in the schemas. Assume that each schema is in 1NF.    For each one of the relational schemas, determine the highest normal form that is valid  for a schema. Justify your answer. Justification must include the derivations of minimal  keys from the functional dependencies and testing the validity of all normal forms (2NF,  3NF, BCNF) against the relational schemas, minimal keys, and functional dependencies.    A correct guess without the comprehensive justifications scores no marks!  Do not change the attributes of relational schemas in the questions. \n\n(1) $R=(A,B,C,D)$      $F=\\{A \\to B, A \\to C, C \\to D\\}$ \n\n(2) $R=(A,B,C,D)$      $F=\\{A \\to C, B \\to D\\}$ \n\n(3) $R=(A,B,C,D)$      $F=\\{A \\to B, B \\to C, C \\to A, C \\to D\\}$ \n\n(4) $R=(A,B,C,D)$      $F=\\{AB \\to C, AB \\to D, C \\to B\\}$","answer":"题目已经假定四个relational schema都满足1NF。这里用AB表示属性集合${A,B}$，即A和B一起使用。\n\nprime attribute是至少属于一个candidate key的属性；non-prime attribute不属于任何candidate key。superkey能决定关系的全部属性；candidate key（也称minimal key）还要求不能再删除其中的属性。\n\n### (1) 最高范式：2NF\n\n**求键**：由$A\to B$、$A\to C$和$C\to D$，得到$A^+={A,B,C,D}$。A没有出现在给定functional dependency的右侧，不能由其他属性推出，所以任何键都必须包含A。A单独已经足够，因此只有一个candidate key：${A}$。prime attribute为A；non-prime attribute为B、C、D。\n\n**检查2NF**：candidate key只有一个属性。给定依赖中，不存在某个non-prime attribute依赖这个键的一部分，因此满足2NF。\n\n**检查3NF**：$C\to D$是non-trivial functional dependency；$C^+={C,D}$，所以C不是superkey；D又是non-prime attribute。这条依赖违反3NF。\n\n**检查BCNF**：同一条$C\to D$的左侧不是superkey，也违反BCNF。\n\n因此，
