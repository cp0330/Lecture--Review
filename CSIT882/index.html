学分；DepartmentName 系名；StudentID 学号；ThesisTitle 论文题目；Building 建筑；Capacity 容量。teaches 教授；enrols 选修；held in 在某处上课。ID1 identifier；4 四个；0..2 零至两个；1 一个；* 多个。原图就是待修正对象，不能将其中数量和箭头当作正确业务规则。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"providedAnswer":{"label":"课程目录随附Solution.pdf，Task 2图；本版依此采用0..2","image":"assets/provided-a1-task2.png","note":"DepartmentName以及(RoomNumber,Building)的标识方式来自随附图。图中的DepartmentName对应文字规则的Name，不是另增第二个名称属性。"},"knowledge":["entity","identifier","multiplicity","association","generalization"],"types":["conceptual"],"requiredSkills":["Class / attribute / 对象类别与属性","Identifier / 唯一标识","Multiplicity / 关联两端的数量范围","Many-to-many / association attribute / 多对多与关联属性","Generalization / inheritance / 泛化与继承"],"questionHTML":"\u003cp>The university has the following business rules. \u003c/p>\n\u003col>\n\u003cli>Each lecturer has a Staff ID, First Name, Last Name and Email.  \u003c/li>\n\u003cli>Each student has a Student ID, First Name, Last Name and Email and every student is either  an Undergraduate student or a Postgraduate student. An undergraduate student has an  additional attribute GPA and a postgraduate student has an additional attribute Thesis Title. \u003c/li>\n\u003cli>Each subject has a Code, Title and Credits.  \u003c/li>\n\u003cli>Each subject is offered by one department with an attribute Name. \u003c/li>\n\u003cli>Each classroom has a Room Number, Building and Capacity.  \u003c/li>\n\u003cli>A lecturer may teach up to four subjects in a semester.  \u003c/li>\n\u003cli>Each subject must be taught by at most two lecturers and is held in one classroom. \u003c/li>\n\u003cli>A student may enrol in zero or more subjects.  \u003c/li>\n\u003cli>A classroom may be used for zero or more subjects.    Correct the conceptual schema by fixing all errors in entity representation, inheritance notation,  and multiplicities so that it accurately represents the business rules above.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"assets/assignment-1-task-2.png\" alt=\"Original conceptual schema\">\u003c/p>\n","translationHTML":"\u003cp>根据以下大学业务规则纠正给定conceptual schema。\u003c/p>\n\u003col>\n\u003cli>Lecturer有Staff ID、First Name、Last Name和Email。\u003c/li>\n\u003cli>Student有Student ID、First Name、Last Name和Email；每位Student属于Undergraduate或Postgraduate。Undergraduate另外有GPA；Postgraduate另外有Thesis Title。\u003c/li>\n\u003cli>Subject有Code、Title和Credits。\u003c/li>\n\u003cli>每个Subject由一个Department开设；Department有Name。\u003c/li>\n\u003cli>Classroom有Room Number、Building和Capacity。\u003c/li>\n\u003cli>每位Lecturer在一个学期最多教4门Subject。\u003c/li>\n\u003cli>每个Subject最多由2位Lecturer教授，并在一间Classroom上课。\u003c/li>\n\u003cli>Student可选修零门或多门Subject。\u003c/li>\n\u003cli>Classroom可用于零门或多门Subject。\u003c/li>\n\u003c/ol>\n\u003cp>纠正对象表示、generalization记法与multiplicities的全部错误，使图符合这些业务规则。\u003c/p>\n\u003cdetails>\u003csummary>图中文字逐项对照\u003c/summary>\u003cp>\u003cstrong>待纠错图中文字对照\u003c/strong>：Lecturer 讲师；Subject 科目；Student 学生；Postgraduate 研究生；Classroom 教室。StaffID 员工号；FirstName 名；LastName 姓；Email 邮箱；Code 科目代码；Title 标题；Credits 学分；DepartmentName 系名；StudentID 学号；ThesisTitle 论文题目；Building 建筑；Capacity 容量。teaches 教授；enrols 选修；held in 在某处上课。ID1 identifier；4 四个；0..2 零至两个；1 一个；* 多个。原图就是待修正对象，不能将其中数量和箭头当作正确业务规则。\u003c/p>\n\u003c/details>"},{"id":"A2-T1","title":"Assignment 2 — Task 1","topic":"酒店数据库：逻辑设计","areas":["Logical"],"source":"assignment-2","sourceLabel":"Assignment 2","sourceNote":"Assignment2.pdf pp2–3; accompanying Assignment2_Solution.pdf","origin":"Original material","priority":"A","question":"Given the conceptual schema below, perform logical database design by transforming it  into a collection of relational schemas. \n\n(1) Identify each feature of the conceptual schema that requires a transformation and state  the transformation applied to that feature. \n\n(2) For each relational schema created , clearly list the names of attributes, primary keys ,  candidate keys (if any), and foreign keys (if any). Assume that the superset  method must be used to implement a generalization (if any). A way how a conceptual  schema can be transformed into a collection of relational schemas is explained in a  presentation 06 Logical Design.      The relational schemas must be listed in a format presented in slides 42 and 43 in  presentation 06 Logical Design. Listing of the relational schemas in the other format scores  no marks.   \n\nNote that the order of the definitions on the relation schemas is important. You must  define a parent relation schema (referenced) before its  child relational schema  (references to the parent relational schema).\n\n![Original conceptual schema](assets/assignment-2-task-1.png)","context":"","canonical":null,"parts":[{"number":"1","goal":"说明每一种概念特征如何转换","steps":["先列多值amenity、GUEST到RESERVATION的many-to-many、HOTEL到ROOM的qualification。","再列ROOM到RESERVATION的one-to-many、RESERVATION到PAYMENT的可选one-to-one，以及HOTEL的generalization。","逐项写采用的转换：多值表/关联表、复制完整owner key、复制foreign key、按课程示例合并可选付款、按superset合并酒店子类。"],"check":"每个需要转换的特征都有对应方法，不只给最终表名。","pitfall":"不要把图中[*]直接变成一列逗号分隔的文本。","mainType":"logical","knowledge":["keys","qualifier","association","superset","multivalue"],"taskBrief":"把图中每一种特征转换成关系模式，并完整列出键和引用。","input":"英文题面和给定图／FD","output":"说明每一种概念特征如何转换","examTips":["每个需要转换的特征都有对应方法，不只给最终表名。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不要把图中[*]直接变成一列逗号分隔的文本。"],"tables":[],"knowledgeUses":{"keys":"每个需要转换的特征都有对应方法，不只给最终表名。","qualifier":"每个需要转换的特征都有对应方法，不只给最终表名。","association":"每个需要转换的特征都有对应方法，不只给最终表名。","superset":"每个需要转换的特征都有对应方法，不只给最终表名。","multivalue":"每个需要转换的特征都有对应方法，不只给最终表名。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先写不依赖其他schema的父关系及其完整标识。","分别处理多对多、多值、qualifier与关联属性；引用复合标识不能漏列。","按题目要求使用superset，最后检查父表先于子表及全部键。"],"referenceHTML":"\u003cp>Transform: (1) multivalued amenity to AMENITY and HOTEL_AMENITY; (2) Guest–Reservation to GUEST_RESERVATION; (3) room qualifier to composite ROOM key; (4) copy the full ROOM key into RESERVATION; (5) merge optional Payment into Reservation; (6) apply the superset method to Hotel subtypes.\u003c/p>\n"},{"number":"2","goal":"写全部relational schemas及键","steps":["先列GUEST、AMENITY、HOTEL；再列ROOM、RESERVATION、HOTEL_AMENITY、GUEST_RESERVATION。","ROOM primary key为(hotelCode,roomNo)；RESERVATION同时引用这两项，不只引用房号。","PAYMENT合并后用可空receiptNo保存付款唯一标识；课程把它列作CK，解析单独说明可空标识与严格candidate key定义差异。","按课件格式写PRIMARY KEY、CANDIDATE KEY、FOREIGN KEY REFERENCES；父表在前。"],"check":"七张表、两个关联表的组合键、每条foreign key与其目标完整一致。","pitfall":"email的唯一性是下一Task新增规则，不要把Task2(2)提前当成原图已有identifier。","mainType":"logical","knowledge":["keys","qualifier","association","superset","multivalue"],"taskBrief":"把图中每一种特征转换成关系模式，并完整列出键和引用。","input":"英文题面和给定图／FD","output":"写全部relational schemas及键","examTips":["七张表、两个关联表的组合键、每条foreign key与其目标完整一致。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["email的唯一性是下一Task新增规则，不要把Task2(2)提前当成原图已有identifier。"],"tables":[],"knowledgeUses":{"keys":"七张表、两个关联表的组合键、每条foreign key与其目标完整一致。","qualifier":"七张表、两个关联表的组合键、每条foreign key与其目标完整一致。","association":"七张表、两个关联表的组合键、每条foreign key与其目标完整一致。","superset":"七张表、两个关联表的组合键、每条foreign key与其目标完整一致。","multivalue":"七张表、两个关联表的组合键、每条foreign key与其目标完整一致。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先写不依赖其他schema的父关系及其完整标识。","分别处理多对多、多值、qualifier与关联属性；引用复合标识不能漏列。","按题目要求使用superset，最后检查父表先于子表及全部键。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-text\">GUEST(passportNo, firstName, lastName, email, phone) \nPRIMARY KEY = (passportNo) \nAMENITY(amenity) \nPRIMARY KEY = (amenity) \nHOTEL(code, name, rating, typeOfHotel, poolCount, conferenceRooms) \nPRIMARY KEY = (code) \nROOM(hotelCode, roomNo, capacity, bedType, pricePerNight) \nPRIMARY KEY = (hotelCode, roomNo) \nFOREIGN KEY1 = (hotelCode) REFERENCES HOTEL(code) \n\nRESERVATION(reservationNo, checkIn, checkOut, bookingDate, status, \n            hotelCode, roomNo, receiptNo, amount, method, paidDate) \nPRIMARY KEY = (reservationNo) \nCANDIDATE KEY1 = (receiptNo) \nFOREIGN KEY1 = (hotelCode, roomNo) REFERENCES ROOM(hotelCode, roomNo) \nHOTEL_AMENITY(hotelCode, amenity) \nPRIMARY KEY = (hotelCode, amenity) \nFOREIGN KEY1 = (hotelCode) REFERENCES HOTEL(code) \nFOREIGN KEY2 = (amenity) REFERENCES AMENITY(amenity) \nGUEST_RESERVATION (passportNo, reservationNo) \nPRIMARY KEY = (passportNo, reservationNo) \nFOREIGN KEY1 = (passportNo) REFERENCES GUEST(passportNo) \nFOREIGN KEY2 = (reservationNo) REFERENCES RESERVATION(reservationNo)\n\u003c/code>\u003c/pre>\n\u003cp>Use the complete composite identifier in every reference. Minimum participation constraints are not guaranteed by foreign keys alone. In a superset table, a nullable subtype identifier is a conditional UNIQUE constraint rather than a non-null candidate key for every row.\u003c/p>\n\u003cp>The supplied course solution calls receiptNo a candidate key. With unpaid reservations, it is nullable: strictly, use UNIQUE(receiptNo) for non-null receipt values, rather than a non-null identifier of every reservation.\u003c/p>\n"}],"tags":["Primary, candidate and composite foreign keys","Multivalued attribute transformation","Many-to-many and association attributes","Qualified association transformation","One-to-one merge and nullable identifiers","Superset method","Parent-before-child and classroom schema format"],"legacyPriority":"core","level":"A","archived":false,"originType":"Official Assignment","mainType":"logical","related":[],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"把给定酒店conceptual schema转换成一组relational schemas。\n\n(1) 识别每一种需要转换的特征，逐项说明采用了哪一种转换。\n\n(2) 每个schema清楚列出attributes、primary key、其他candidate keys及foreign keys。generalization必须使用superset method。必须使用Logical Design课件第42–43页规定的格式；使用其他格式不计分。\n\nschema定义顺序也有要求：先定义被引用的parent schema，再定义引用它的child schema。","imageGlossary":"**图中文字对照**：GUEST 住客；RESERVATION 预订；PAYMENT 付款；ROOM 房间；HOTEL 酒店；RESORT_HOTEL 度假酒店；BUSINESS_HOTEL 商务酒店。passportNo 护照号；firstName 名；lastName 姓；email 邮箱；phone 电话；reservationNo 预订号；checkIn 入住日期；checkOut 退房日期；bookingDate 预订日期；status 状态；receipt# 收据号；amount 金额；method 付款方式；paidDate 付款日期；capacity 容量；bedType 床型；pricePerNight 每晚价格；room# 房号；code 酒店代码；name 名称；amenity 配套设施；rating 评分；poolCount 泳池数量；conferenceRooms 会议室数量。Includes 包含；Has 具有；Related to 与之相关。ID1 identifier；[*] 多值；[0..1] 可选；* 零到多个；1..* 至少一个；0..1 零个或一个；空心三角表示泛化。","answerOrigin":{"kind":"supplied-reference-adapted","label":"依据随附Assignment2_Solution整理；匿名版示例值已替换，并保留技术注释"},"providedAnswer":{"label":"课程目录随附Assignment2_Solution.pdf pp1–2；原文保留","note":"随附解将可空receiptNo称为candidate key。课堂格式保留该写法；严格关系理论中应解释为有值时唯一的条件unique。","html":"\u003cp>--- PAGE 1 ---\nTask 1 (8 Marks) \n(1) Features requiring transformation \u003c/p>\n\u003col>\n\u003cli>Multivalued attribute AMENITY[*] in HOTEL \nThe multivalued attribute amenity is reified into a new class AMENITY. Because the same amenity may be \noffered by many hotels and a hotel may offer many amenities, the resulting association between HOTEL and \nAMENITY is many-to-many. The many-to-many association is then transformed into an associative class \nHOTEL_AMENITY. \u003c/li>\n\u003cli>Many-to-many association Includes between Guest and RESERVATION \nThe multiplicities 1..* at both ends make Includes a many-to-many association. A new associative class \nGUEST_RESERVATION is created. The identifiers of GUEST and RESERVATION are copied to \nGUEST_RESERVATION and together form its composite identifier (passportNo, reservationNo). \u003c/li>\n\u003cli>Qualified association Has between HOTEL and ROOM \nThe qualification by room# is replaced with a one-to-many association. The identifier code of HOTEL and the \nqualifier room# are copied to ROOM. Together they form the composite identifier (hotelCode, roomNo). \nhotelCode also becomes a foreign key referencing HOTEL(code). \u003c/li>\n\u003cli>Association Has between ROOM and RESERVATION \nOne room can be associated with many reservations, while each reservation is associated with one room. \nTherefore, the identifier of ROOM, (hotelCode, roomNo), is copied to RESERVATION and becomes a \ncomposite foreign key referencing ROOM(hotelCode, roomNo). \u003c/li>\n\u003cli>One-to-one association Related to between RESERVATION and PAYMENT \nThe one-to-one association is removed by merging the two classes. Because PAYMENT is on the optional \n0..1 side, its attributes receiptNo, amount, method and paidDate are copied to RESERVATION as optional \nattributes. The former identifier receiptNo becomes a candidate key in RESERVATION and may contain \nNULL. \u003c/li>\n\u003cli>Generalisation HOTEL → RESORT_HOTEL and BUSINESS_HOTEL \nThe required superset method is applied. The subtype attributes poolCount and conferenceRooms are copied \nto HOTEL and become optional attributes. A discriminator attribute typeOfHotel is added to HOTEL. The \nclasses RESORT_HOTEL and BUSINESS_HOTEL are then removed. \n(2) Final relational schemas\u003c/li>\n\u003c/ol>\n\u003cp>GUEST(passportNo, firstName, lastName, email, phone) \nPRIMARY KEY = (passportNo) \nAMENITY(amenity) \nPRIMARY KEY = (amenity) \nHOTEL(code, name, rating, typeOfHotel, poolCount, conferenceRooms) \nPRIMARY KEY = (code) \nROOM(hotelCode, roomNo, capacity, bedType, pricePerNight) \nPRIMARY KEY = (hotelCode, roomNo) \nFOREIGN KEY1 = (hotelCode) REFERENCES HOTEL(code) \u003c/p>\n\u003cp>--- PAGE 2 ---\nRESERVATION(reservationNo, checkIn, checkOut, bookingDate, status, \n            hotelCode, roomNo, receiptNo, amount, method, paidDate) \nPRIMARY KEY = (reservationNo) \nCANDIDATE KEY1 = (receiptNo) \nFOREIGN KEY1 = (hotelCode, roomNo) REFERENCES ROOM(hotelCode, roomNo) \nHOTEL_AMENITY(hotelCode, amenity) \nPRIMARY KEY = (hotelCode, amenity) \nFOREIGN KEY1 = (hotelCode) REFERENCES HOTEL(code) \nFOREIGN KEY2 = (amenity) REFERENCES AMENITY(amenity) \nGUEST_RESERVATION (passportNo, reservationNo) \nPRIMARY KEY = (passportNo, reservationNo) \nFOREIGN KEY1 = (passportNo) REFERENCES GUEST(passportNo) \nFOREIGN KEY2 = (reservationNo) REFERENCES RESERVATION(reservationNo) \u003c/p>\n"},"knowledge":["keys","qualifier","association","superset","multivalue"],"types":["logical"],"requiredSkills":["Primary / candidate / foreign key / 主键、候选键与外键","Qualified association / 用局部值限定的关联","Many-to-many / association attribute / 多对多与关联属性","Superset method / 超集法实现泛化","Multivalued / optional / derived / 多值、可选与可计算属性"],"questionHTML":"\u003cp>Given the conceptual schema below, perform logical database design by transforming it  into a collection of relational schemas. \u003c/p>\n\u003cp>(1) Identify each feature of the conceptual schema that requires a transformation and state  the transformation applied to that feature. \u003c/p>\n\u003cp>(2) For each relational schema created , clearly list the names of attributes, primary keys ,  candidate keys (if any), and foreign keys (if any). Assume that the superset  method must be used to implement a generalization (if any). A way how a conceptual  schema can be transformed into a collection of relational schemas is explained in a  presentation 06 Logical Design.      The relational schemas must be listed in a format presented in slides 42 and 43 in  presentation 06 Logical Design. Listing of the relational schemas in the other format scores  no marks.   \u003c/p>\n\u003cp>Note that the order of the definitions on the relation schemas is important. You must  define a parent relation schema (referenced) before its  child relational schema  (references to the parent relational schema).\u003c/p>\n\u003cp>\u003cimg src=\"assets/assignment-2-task-1.png\" alt=\"Original conceptual schema\">\u003c/p>\n","translationHTML":"\u003cp>把给定酒店conceptual schema转换成一组relational schemas。\u003c/p>\n\u003cp>(1) 识别每一种需要转换的特征，逐项说明采用了哪一种转换。\u003c/p>\n\u003cp>(2) 每个schema清楚列出attributes、primary key、其他candidate keys及foreign keys。generalization必须使用superset method。必须使用Logical Design课件第42–43页规定的格式；使用其他格式不计分。\u003c/p>\n\u003cp>schema定义顺序也有要求：先定义被引用的parent schema，再定义引用它的child schema。\u003c/p>\n\u003cdetails>\u003csummary>图中文字逐项对照\u003c/summary>\u003cp>\u003cstrong>图中文字对照\u003c/strong>：GUEST 住客；RESERVATION 预订；PAYMENT 付款；ROOM 房间；HOTEL 酒店；RESORT_HOTEL 度假酒店；BUSINESS_HOTEL 商务酒店。passportNo 护照号；firstName 名；lastName 姓；email 邮箱；phone 电话；reservationNo 预订号；checkIn 入住日期；checkOut 退房日期；bookingDate 预订日期；status 状态；receipt# 收据号；amount 金额；method 付款方式；paidDate 付款日期；capacity 容量；bedType 床型；pricePerNight 每晚价格；room# 房号；code 酒店代码；name 名称；amenity 配套设施；rating 评分；poolCount 泳池数量；conferenceRooms 会议室数量。Includes 包含；Has 具有；Related to 与之相关。ID1 identifier；[\u003cem>] 多值；[0..1] 可选；\u003c/em> 零到多个；1..* 至少一个；0..1 零个或一个；空心三角表示泛化。\u003c/p>\n\u003c/details>"},{"id":"A2-T2","title":"Assignment 2 — Task 2","topic":"酒店建表、约束、样例数据与删除","areas":["DDL/DML"],"source":"assignment-2","sourceLabel":"Assignment 2","sourceNote":"Assignment2.pdf pp2–3; accompanying Assignment2_Solution.pdf","origin":"Original material","priority":"A","question":"This question builds upon the relational schemas you designed in Task 1.  Write SQL  statements to answer the following queries. Since the parts  are interconnected, you must  complete them in sequential order from (1) to (5).  \n\n(1) Create empty relational tables to implement the relational schemas you designed in  Task 1 for the hotel reservation database. The names of the relational tables and  columns must be consistent with your logical design. Use reasonable column types  and sizes (lengths). Enforce all appropriate primary key and referential integrity  constraints.  Note that the order of CREATE TABLE statements is important. Create the  parent table (referenced) before its child table (references to the parent table).  \n\n(2) Next, assume that a new business rule is introduced requiring that no two guests  have the same email address. Add an appropriate constraint after the table has  already been created. \n\n(3) Next, insert sufficient sample data into the tables to represent at least two hotels,  two rooms for each hotel, two guests, and two reservations. Insert appropriate data  into the other tables resulting from your logical design where required.  The data values are up to you, but they must satisfy all primary key and referential  integrity constraints defined in part (1) and (2).    Note that the order of INSERT statements is important. Insert data into the  parent table (referenced) before inserting data into its child table (references to  the parent table).  \n\n(4) Increase the pricePerNight of all rooms belonging to one of the hotels inserted  in part (3) by 10%. The choice of hotel is up to you. \n\n(5) Finally, delete one of the hotels inserted in part ( 3) and all records that must be  removed beforehand to satisfy the referential integrity constraints. Do not delete the  other hotel or its related information, and do not drop any table.    Note that the order of delete statements is important. Delete data from the child table  (references to the parent table) before deleting data from its parent table (referenced).","context":"","canonical":null,"parts":[{"number":"1","goal":"建立与你的logical design一致的空表","steps":["先确定各列类型和mandatory/optional条件；id、邮箱/电话等用合适字符串长度，价格用精确DECIMAL。","先建独立父表，再建ROOM和RESERVATION等引用表。复合foreign key两端列数、顺序、类型要匹配。","为关联表建立完整composite primary key，付款标识加UNIQUE；此步不装载数据。"],"check":"建表顺序不会引用尚不存在的父表，且与Task1名称一致。","pitfall":"房号不在全局唯一，不能只用roomNo作ROOM的primary key。","mainType":"ddl-dml","knowledge":["keys","constraints","types"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"英文题面和给定图／FD","output":"建立与你的logical design一致的空表","examTips":["建表顺序不会引用尚不存在的父表，且与Task1名称一致。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["房号不在全局唯一，不能只用roomNo作ROOM的primary key。"],"tables":["GUEST","AMENITY","HOTEL","ROOM","RESERVATION","HOTEL_AMENITY","GUEST_RESERVATION"],"knowledgeUses":{"keys":"涉及对象／命名中间结果：GUEST, AMENITY, HOTEL, ROOM, RESERVATION, HOTEL_AMENITY, GUEST_RESERVATION","constraints":"建表顺序不会引用尚不存在的父表，且与Task1名称一致。","types":"建表顺序不会引用尚不存在的父表，且与Task1名称一致。"},"sqlPlan":[{"label":"选表／对象","text":"GUEST, AMENITY, HOTEL, ROOM, RESERVATION, HOTEL_AMENITY, GUEST_RESERVATION"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"建表顺序不会引用尚不存在的父表，且与Task1名称一致。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">CREATE TABLE GUEST ( \n    passportNo VARCHAR(20) NOT NULL, \n    firstName  VARCHAR(50) NOT NULL, \n    lastName   VARCHAR(50) NOT NULL, \n    email      VARCHAR(100) NOT NULL, \n    phone      VARCHAR(20) NOT NULL, \n    CONSTRAINT guest_pkey PRIMARY KEY (passportNo) \n); \nCREATE TABLE AMENITY ( \n    amenity VARCHAR(50) NOT NULL, \n    CONSTRAINT amenity_pkey PRIMARY KEY (amenity) \n); \nCREATE TABLE HOTEL ( \n    code             CHAR(5) NOT NULL, \n    name             VARCHAR(100) NOT NULL, \n    rating           DECIMAL(2,1) NULL, \n    typeOfHotel      VARCHAR(20) NULL, \n    poolCount        DECIMAL(3) NULL, \n    conferenceRooms  DECIMAL(3) NULL, \n    CONSTRAINT hotel_pkey PRIMARY KEY (code) \n); \nCREATE TABLE ROOM ( \n    hotelCode      CHAR(5) NOT NULL, \n    roomNo         VARCHAR(10) NOT NULL, \n    capacity       DECIMAL(2) NOT NULL, \n    bedType        VARCHAR(30) NOT NULL, \n    pricePerNight  DECIMAL(8,2) NOT NULL, \n    CONSTRAINT room_pkey PRIMARY KEY (hotelCode, roomNo), \n    CONSTRAINT room_fkey1 FOREIGN KEY (hotelCode) \n        REFERENCES HOTEL(code) \n); \nCREATE TABLE RESERVATION ( \n    reservationNo  CHAR(6) NOT NULL, \n    checkIn        DATE NOT NULL, \n    checkOut       DATE NOT NULL, \n    bookingDate    DATE NOT NULL, \n    status         VARCHAR(20) NOT NULL, \n    hotelCode      CHAR(5) NOT NULL, \n    roomNo         VARCHAR(10) NOT NULL, \n    receiptNo      VARCHAR(20) NULL, \n    amount         DECIMAL(8,2) NULL, \n    method         VARCHAR(20) NULL, \n    paidDate       DATE NULL, \n    CONSTRAINT reservation_pkey PRIMARY KEY (reservationNo), \n    CONSTRAINT reservation_ckey1 UNIQUE (receiptNo), \n    CONSTRAINT reservation_fkey1 FOREIGN KEY (hotelCode, roomNo) \n        REFERENCES ROOM(hotelCode, roomNo) \n); \nCREATE TABLE HOTEL_AMENITY ( \n    hotelCode  CHAR(5) NOT NULL, \n    amenity    VARCHAR(50) NOT NULL, \n    CONSTRAINT hotel_amenity_pkey PRIMARY KEY (hotelCode, amenity), \n    CONSTRAINT hotel_amenity_fkey1 FOREIGN KEY (hotelCode) \n        REFERENCES HOTEL(code), \n    CONSTRAINT hotel_amenity_fkey2 FOREIGN KEY (amenity) \n        REFERENCES AMENITY(amenity) \n); \n\nCREATE TABLE GUEST_RESERVATION ( \n    passportNo      VARCHAR(20) NOT NULL, \n    reservationNo   CHAR(6) NOT NULL, \n    CONSTRAINT guest_reservation_pkey PRIMARY KEY (passportNo, reservationNo), \n    CONSTRAINT guest_reservation_fkey1 FOREIGN KEY (passportNo) \n        REFERENCES GUEST(passportNo), \n    CONSTRAINT guest_reservation_fkey2 FOREIGN KEY (reservationNo) \n        REFERENCES RESERVATION(reservationNo) \n);\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"表建好后新增邮箱唯一约束","steps":["规则要求任意两位住客的email不同，目标是GUEST.email。","使用ALTER TABLE ... ADD CONSTRAINT ... UNIQUE(email)。","这是新增约束，不是重新CREATE整个GUEST；若已有重复邮件，实际加约束会失败，需要先核对数据。"],"check":"不是把email改成每行都相同的默认值，也不是只在应用界面验证。","pitfall":"UNIQUE和NOT NULL含义不同，不能互相代替。","mainType":"ddl-dml","knowledge":["ddl","types","constraints"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"英文题面和给定图／FD","output":"表建好后新增邮箱唯一约束","examTips":["不是把email改成每行都相同的默认值，也不是只在应用界面验证。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["UNIQUE和NOT NULL含义不同，不能互相代替。"],"tables":["GUEST"],"knowledgeUses":{"ddl":"涉及对象／命名中间结果：GUEST","types":"不是把email改成每行都相同的默认值，也不是只在应用界面验证。","constraints":"不是把email改成每行都相同的默认值，也不是只在应用界面验证。"},"sqlPlan":[{"label":"选表／对象","text":"GUEST"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"不是把email改成每行都相同的默认值，也不是只在应用界面验证。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">ALTER TABLE GUEST \nADD CONSTRAINT guest_ckey1 UNIQUE (email);\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"按父子顺序装载满足数量的数据","steps":["先插至少两位住客、两酒店及设施，再给每家酒店至少两间房。","至少两条预订必须引用已存在的房间；关联住客与预订，按设计补设施关联和可选付款。","检查ISBN等无关属性不要带入酒店；所有primary/foreign/unique keys都满足，样例值自选。"],"check":"两酒店、四房间、两住客、两预订是最低数量；每个父对象都先存在。","pitfall":"只插两间房、每酒店一间，不满足“two rooms for each hotel”。","mainType":"ddl-dml","knowledge":["dml"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"英文题面和给定图／FD","output":"按父子顺序装载满足数量的数据","examTips":["两酒店、四房间、两住客、两预订是最低数量；每个父对象都先存在。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["只插两间房、每酒店一间，不满足“two rooms for each hotel”。"],"tables":["GUEST","AMENITY","HOTEL","ROOM","RESERVATION","HOTEL_AMENITY","GUEST_RESERVATION"],"knowledgeUses":{"dml":"涉及对象／命名中间结果：GUEST, AMENITY, HOTEL, ROOM, RESERVATION, HOTEL_AMENITY, GUEST_RESERVATION"},"sqlPlan":[{"label":"选表／对象","text":"GUEST, AMENITY, HOTEL, ROOM, RESERVATION, HOTEL_AMENITY, GUEST_RESERVATION"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"两酒店、四房间、两住客、两预订是最低数量；每个父对象都先存在。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">INSERT INTO GUEST \nVALUES (&#39;P10001&#39;, &#39;GUEST_01&#39;, &#39;SAMPLE&#39;, \n        &#39;EMAIL_TOKEN_02&#39;, &#39;PHONE_TOKEN_01&#39;); \n \nINSERT INTO GUEST \nVALUES (&#39;P10002&#39;, &#39;GUEST_02&#39;, &#39;SAMPLE&#39;, \n        &#39;EMAIL_TOKEN_05&#39;, &#39;PHONE_TOKEN_14&#39;); \nINSERT INTO AMENITY VALUES (&#39;WiFi&#39;); \nINSERT INTO AMENITY VALUES (&#39;Parking&#39;); \nINSERT INTO AMENITY VALUES (&#39;Gym&#39;); \nINSERT INTO HOTEL \nVALUES (&#39;H001&#39;, &#39;Ocean Resort&#39;, 4.5, &#39;Resort&#39;, 2, NULL); \n \nINSERT INTO HOTEL \nVALUES (&#39;H002&#39;, &#39;Central Business Hotel&#39;, 4.0, &#39;Business&#39;, NULL, 6); \nINSERT INTO ROOM \nVALUES (&#39;H001&#39;, &#39;101&#39;, 2, &#39;Queen&#39;, 200.00); \n \nINSERT INTO ROOM \nVALUES (&#39;H001&#39;, &#39;102&#39;, 4, &#39;Twin&#39;, 260.00); \n \nINSERT INTO ROOM \nVALUES (&#39;H002&#39;, &#39;201&#39;, 2, &#39;King&#39;, 180.00); \n \nINSERT INTO ROOM \nVALUES (&#39;H002&#39;, &#39;202&#39;, 1, &#39;Single&#39;, 140.00); \nINSERT INTO RESERVATION \nVALUES (&#39;R00001&#39;, &#39;2026-09-10&#39;, &#39;2026-09-13&#39;, &#39;2026-08-20&#39;, \n        &#39;Confirmed&#39;, &#39;H001&#39;, &#39;101&#39;, \n        &#39;RC001&#39;, 600.00, &#39;Card&#39;, &#39;2026-08-20&#39;); \n \nINSERT INTO RESERVATION \nVALUES (&#39;R00002&#39;, &#39;2026-10-05&#39;, &#39;2026-10-07&#39;, &#39;2026-08-21&#39;, \n        &#39;Confirmed&#39;, &#39;H002&#39;, &#39;201&#39;, \n        NULL, NULL, NULL, NULL); \nINSERT INTO HOTEL_AMENITY VALUES (&#39;H001&#39;, &#39;WiFi&#39;); \nINSERT INTO HOTEL_AMENITY VALUES (&#39;H001&#39;, &#39;Gym&#39;); \nINSERT INTO HOTEL_AMENITY VALUES (&#39;H002&#39;, &#39;WiFi&#39;); \nINSERT INTO HOTEL_AMENITY VALUES (&#39;H002&#39;, &#39;Parking&#39;); \n\nINSERT INTO GUEST_RESERVATION VALUES (&#39;P10001&#39;, &#39;R00001&#39;); \nINSERT INTO GUEST_RESERVATION VALUES (&#39;P10002&#39;, &#39;R00002&#39;);\n\u003c/code>\u003c/pre>\n"},{"number":"4","goal":"选一家酒店的全部房间提价10%","steps":["用该酒店code筛选ROOM，不按一个roomNo筛选。","新pricePerNight=原pricePerNight*1.10，保留原有精确小数类型。","用相同酒店条件检查所有房间，另一酒店价格保持不变。"],"check":"例如200变220，不是变210。","pitfall":"加10和加10%是不同操作。","mainType":"ddl-dml","knowledge":["filter","dml"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"英文题面和给定图／FD","output":"选一家酒店的全部房间提价10%","examTips":["例如200变220，不是变210。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["加10和加10%是不同操作。"],"tables":["ROOM"],"knowledgeUses":{"filter":"例如200变220，不是变210。","dml":"涉及对象／命名中间结果：ROOM"},"sqlPlan":[{"label":"选表／对象","text":"ROOM"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"例如200变220，不是变210。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">UPDATE ROOM \nSET pricePerNight = pricePerNight * 1.10 \nWHERE hotelCode = &#39;H001&#39;;\n\u003c/code>\u003c/pre>\n"},{"number":"5","goal":"删除一家酒店及必须先清理的引用记录","steps":["先找到该酒店的全部RESERVATION，删除GUEST_RESERVATION里对它们的引用。","再删这些RESERVATION、HOTEL_AMENITY和ROOM，最后删HOTEL。","保留独立GUEST、AMENITY以及另一酒店的信息，不DROP表，不关闭foreign key检查。"],"check":"即使选定酒店有多条预订，仍能完整删除相关记录。","pitfall":"只把样例预订号R00001写死，不能保证处理该酒店的所有预订。","mainType":"ddl-dml","knowledge":["filter","join","dml","keys"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"英文题面和给定图／FD","output":"删除一家酒店及必须先清理的引用记录","examTips":["即使选定酒店有多条预订，仍能完整删除相关记录。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["只把样例预订号R00001写死，不能保证处理该酒店的所有预订。"],"tables":["GUEST_RESERVATION","RESERVATION","HOTEL_AMENITY","ROOM","HOTEL"],"knowledgeUses":{"filter":"即使选定酒店有多条预订，仍能完整删除相关记录。","join":"涉及对象／命名中间结果：GUEST_RESERVATION, RESERVATION, HOTEL_AMENITY, ROOM, HOTEL","dml":"涉及对象／命名中间结果：GUEST_RESERVATION, RESERVATION, HOTEL_AMENITY, ROOM, HOTEL","keys":"涉及对象／命名中间结果：GUEST_RESERVATION, RESERVATION, HOTEL_AMENITY, ROOM, HOTEL"},"sqlPlan":[{"label":"选表／对象","text":"GUEST_RESERVATION, RESERVATION, HOTEL_AMENITY, ROOM, HOTEL"},{"label":"连接与层次","text":"使用JOIN并检查完整ON条件；先确定每行的计数单位。"},{"label":"筛选、分组与输出","text":"即使选定酒店有多条预订，仍能完整删除相关记录。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">DELETE GR\nFROM GUEST_RESERVATION AS GR\nJOIN RESERVATION AS R ON R.reservationNo = GR.reservationNo\nWHERE R.hotelCode = &#39;H001&#39;;\n\nDELETE FROM RESERVATION WHERE hotelCode = &#39;H001&#39;;\nDELETE FROM HOTEL_AMENITY WHERE hotelCode = &#39;H001&#39;;\nDELETE FROM ROOM WHERE hotelCode = &#39;H001&#39;;\nDELETE FROM HOTEL WHERE code = &#39;H001&#39;;\n\u003c/code>\u003c/pre>\n"}],"tags":["CREATE TABLE and suitable types","CHECK, UNIQUE, NOT NULL and numeric capacity","INSERT, UPDATE, DELETE and parent/child order"],"legacyPriority":"core","level":"A","archived":false,"originType":"Official Assignment","mainType":"ddl-dml","related":[],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"在Task 1设计的酒店relational schemas基础上编写SQL。(1)至(5)互相关联，必须顺序完成。\n\n(1) 建立空表实现Task 1的设计。表名与列名必须一致。选择合理类型和长度，设置所有适当的primary keys及referential integrity constraints。先建parent tables，再建child tables。\n\n(2) 表创建完成后，新增业务规则：两个Guest不能有相同email。用适当constraint实现。\n\n(3) 插入足够数据：至少2家Hotel、每家至少2间Room、2位Guest和2个Reservation。其他关系表也要在需要时插入合适记录。数据值自行选择，但必须满足(1)(2)的keys及foreign keys。先插parent rows，再插child rows。\n\n(4) 任选(3)中的一家Hotel，把它全部Room的pricePerNight增加10%。\n\n(5) 删除(3)中的一家Hotel，以及为满足foreign keys必须事先删除的依赖记录。保留另一家Hotel及其相关信息；不得DROP任何表。先删child rows，再删parent rows。","answerOrigin":{"kind":"supplied-reference-adapted","label":"依据随附Assignment2_Solution整理；匿名版示例值已替换，并保留技术注释"},"knowledge":["keys","constraints","types","ddl","dml","filter","join"],"types":["ddl-dml"],"requiredSkills":["Primary / candidate / foreign key / 主键、候选键与外键","CHECK / UNIQUE / NOT NULL / 值限制、唯一与必填","DECIMAL(p,s) / 精确数值的位数","ALTER TABLE / 修改表结构","INSERT / UPDATE / DELETE / 增加、修改和删除行","WHERE / predicate / 逐行筛选条件","JOIN / join condition / 连接及连接条件"],"questionHTML":"\u003cp>This question builds upon the relational schemas you designed in Task 1.  Write SQL  statements to answer the following queries. Since the parts  are interconnected, you must  complete them in sequential order from (1) to (5).  \u003c/p>\n\u003cp>(1) Create empty relational tables to implement the relational schemas you designed in  Task 1 for the hotel reservation database. The names of the relational tables and  columns must be consistent with your logical design. Use reasonable column types  and sizes (lengths). Enforce all appropriate primary key and referential integrity  constraints.  Note that the order of CREATE TABLE statements is important. Create the  parent table (referenced) before its child table (references to the parent table).  \u003c/p>\n\u003cp>(2) Next, assume that a new business rule is introduced requiring that no two guests  have the same email address. Add an appropriate constraint after the table has  already been created. \u003c/p>\n\u003cp>(3) Next, insert sufficient sample data into the tables to represent at least two hotels,  two rooms for each hotel, two guests, and two reservations. Insert appropriate data  into the other tables resulting from your logical design where required.  The data values are up to you, but they must satisfy all primary key and referential  integrity constraints defined in part (1) and (2).    Note that the order of INSERT statements is important. Insert data into the  parent table (referenced) before inserting data into its child table (references to  the parent table).  \u003c/p>\n\u003cp>(4) Increase the pricePerNight of all rooms belonging to one of the hotels inserted  in part (3) by 10%. The choice of hotel is up to you. \u003c/p>\n\u003cp>(5) Finally, delete one of the hotels inserted in part ( 3) and all records that must be  removed beforehand to satisfy the referential integrity constraints. Do not delete the  other hotel or its related information, and do not drop any table.    Note that the order of delete statements is important. Delete data from the child table  (references to the parent table) before deleting data from its parent table (referenced).\u003c/p>\n","translationHTML":"\u003cp>在Task 1设计的酒店relational schemas基础上编写SQL。(1)至(5)互相关联，必须顺序完成。\u003c/p>\n\u003cp>(1) 建立空表实现Task 1的设计。表名与列名必须一致。选择合理类型和长度，设置所有适当的primary keys及referential integrity constraints。先建parent tables，再建child tables。\u003c/p>\n\u003cp>(2) 表创建完成后，新增业务规则：两个Guest不能有相同email。用适当constraint实现。\u003c/p>\n\u003cp>(3) 插入足够数据：至少2家Hotel、每家至少2间Room、2位Guest和2个Reservation。其他关系表也要在需要时插入合适记录。数据值自行选择，但必须满足(1)(2)的keys及foreign keys。先插parent rows，再插child rows。\u003c/p>\n\u003cp>(4) 任选(3)中的一家Hotel，把它全部Room的pricePerNight增加10%。\u003c/p>\n\u003cp>(5) 删除(3)中的一家Hotel，以及为满足foreign keys必须事先删除的依赖记录。保留另一家Hotel及其相关信息；不得DROP任何表。先删child rows，再删parent rows。\u003c/p>\n"},{"id":"A3-T1","title":"Assignment 3 — Task 1","topic":"培训数据库：修改结构和数据","areas":["DDL/DML"],"source":"assignment-3","sourceLabel":"Assignment 3","sourceNote":"Assignment3.pdf pp3–4,6,8; original dbcreate.sql and dbload.sql","origin":"Original material","priority":"A","question":"Note that you may need more than one SQL statement to implement a single subtask  listed below.    Your implementation must directly follow a comment with the specifications of a  subtask.  Implement SQL DDL (Data Definition Language) statements for questions (1) and (2)  below. \n\n(1)  Modify the structure and consistency constraint of the sample database such that the  fee of each workshop must be a positive value not larger than 9999.99. \n\n(2)  Modify the structure and consistency constraints of the sample database such that a  qualification level possessed by a participant and a qualification level required by a  workshop must be positive values no more than 10.  Implement SQL DML (Data Manipulation Language) statements for questions (3), (4)  and (5) below.  Note that you are not allowed to modify and/or drop any consistency constraints. We  assume that safe update has been disabled so that SQL can execute DML statements  anywhere. \n\n(3)  Add a new workshop (workshopNo=9) to the sample database. The values of the  new Workshop columns are up to you. Add two qualification requirements for the new  workshop. The qualification names, required levels and mandatory values are up to you. \n\n(4)  Modify the qualification levels possessed by participant (participantNo=3) such  that all qualification levels possessed by the participant increase by 1. \n\n(5)  Remove participant (participantNo=10) and all information related to this  participant from the sample database.","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"让费用能存下且只允许合法范围","steps":["原fee DECIMAL(5,2)总共5位，小数2位，整数仅3位；9999.99需要4位整数。","MODIFY为DECIMAL(6,2) NOT NULL，保留必填条件。","再加CHECK(fee>0 AND fee\u003c=9999.99)，类型容量与业务范围两者缺一不可。"],"check":"9999.99合法，0及10000都不合法。","pitfall":"只加CHECK而不扩DECIMAL无法存10以内之外所需的四位费用。","mainType":"ddl-dml","knowledge":["ddl","types","constraints"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"共享Professional training workshops schema与题面条件","output":"让费用能存下且只允许合法范围","examTips":["9999.99合法，0及10000都不合法。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["只加CHECK而不扩DECIMAL无法存10以内之外所需的四位费用。"],"tables":["Workshop"],"knowledgeUses":{"ddl":"涉及对象／命名中间结果：Workshop","types":"9999.99合法，0及10000都不合法。","constraints":"9999.99合法，0及10000都不合法。"},"sqlPlan":[{"label":"选表／对象","text":"Workshop"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"9999.99合法，0及10000都不合法。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">ALTER TABLE Workshop\n    MODIFY COLUMN fee DECIMAL(6,2) NOT NULL,\n    ADD CONSTRAINT workshop_fee_check CHECK (fee &gt; 0 AND fee &lt;= 9999.99);\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"同时修改两种资格等级","steps":["已具备等级在Qualification.qlevel，所需等级在Requirement.requiredLevel，不是同一列。","原DECIMAL(1)只能容纳一位数字，先把两列都扩成DECIMAL(2,0) NOT NULL。","分别增加>0且\u003c=10的CHECK，整数类型保证等级不会出现小数。"],"check":"10可存，0、负值和11受限制。","pitfall":"只改其中一表，或写\u003c10排除合法边界10。","mainType":"ddl-dml","knowledge":["ddl","types","constraints"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"共享Professional training workshops schema与题面条件","output":"同时修改两种资格等级","examTips":["10可存，0、负值和11受限制。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["只改其中一表，或写\u003c10排除合法边界10。"],"tables":["Qualification","Requirement"],"knowledgeUses":{"ddl":"涉及对象／命名中间结果：Qualification, Requirement","types":"10可存，0、负值和11受限制。","constraints":"10可存，0、负值和11受限制。"},"sqlPlan":[{"label":"选表／对象","text":"Qualification, Requirement"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"10可存，0、负值和11受限制。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">ALTER TABLE Qualification\n    MODIFY COLUMN qlevel DECIMAL(2,0) NOT NULL,\n    ADD CONSTRAINT qualification_level_check CHECK (qlevel &gt; 0 AND qlevel &lt;= 10);\n\nALTER TABLE Requirement\n    MODIFY COLUMN requiredLevel DECIMAL(2,0) NOT NULL,\n    ADD CONSTRAINT requirement_level_check\n        CHECK (requiredLevel &gt; 0 AND requiredLevel &lt;= 10);\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"新增工作坊9并添加两条要求","steps":["先INSERT Workshop，给定9及自行选择但合法的title/category/date/fee/capacity。","再INSERT Requirement两行，引用workshopNo=9，并使两qname不同以满足composite primary key。","requiredLevel、mandatory选择有效业务值；qname没有引用资格目录的foreign key，不先给其他参与者添加资格。"],"check":"新工作坊有恰好本次增加的两条要求，父记录先存在。","pitfall":"先插Requirement会引用不存在的workshop。","mainType":"ddl-dml","knowledge":["dml"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"共享Professional training workshops schema与题面条件","output":"新增工作坊9并添加两条要求","examTips":["新工作坊有恰好本次增加的两条要求，父记录先存在。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["先插Requirement会引用不存在的workshop。"],"tables":["Workshop","Requirement"],"knowledgeUses":{"dml":"涉及对象／命名中间结果：Workshop, Requirement"},"sqlPlan":[{"label":"选表／对象","text":"Workshop, Requirement"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"新工作坊有恰好本次增加的两条要求，父记录先存在。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">INSERT INTO Workshop\n    (workshopNo, title, category, `date`, fee, capacity)\nVALUES (9, &#39;DATABASE PRACTICE&#39;, &#39;TECHNOLOGY&#39;, &#39;2026-11-06&#39;, 200.00, 30);\n\nINSERT INTO Requirement (workshopNo, qname, requiredLevel, mandatory)\nVALUES (9, &#39;PYTHON PROGRAMMING&#39;, 3, &#39;Y&#39;),\n       (9, &#39;DATA ANALYSIS&#39;, 2, &#39;N&#39;);\n\u003c/code>\u003c/pre>\n"},{"number":"4","goal":"参与者3的所有资格等级增加1","steps":["UPDATE目标是Qualification，而不是Participant。","WHERE participantNo=3，SET qlevel=qlevel+1使每条资格各自在原值上增加。","原数据4、3变成5、4。更新仍要通过新增等级CHECK，不能为DML解除约束。"],"check":"只影响该参与者的资格，其他人不变。","pitfall":"把全部qlevel设为1会覆盖而不是增加。","mainType":"ddl-dml","knowledge":["filter","dml"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"共享Professional training workshops schema与题面条件","output":"参与者3的所有资格等级增加1","examTips":["只影响该参与者的资格，其他人不变。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["把全部qlevel设为1会覆盖而不是增加。"],"tables":["Qualification"],"knowledgeUses":{"filter":"只影响该参与者的资格，其他人不变。","dml":"涉及对象／命名中间结果：Qualification"},"sqlPlan":[{"label":"选表／对象","text":"Qualification"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"只影响该参与者的资格，其他人不变。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">UPDATE Qualification\nSET qlevel = qlevel + 1\nWHERE participantNo = 3;\n\u003c/code>\u003c/pre>\n"},{"number":"5","goal":"删除参与者10与其相关信息","steps":["检查哪些表引用Participant：Qualification和Enrolment。","先删这两表中participantNo=10的行，再删Participant本行。","工作坊、培训师等独立对象保留，所有foreign keys保持生效。"],"check":"不存在该人的资格、报名或参与者行，其他业务对象仍在。","pitfall":"不能为绕过父表删除限制而DROP FOREIGN KEY。","mainType":"ddl-dml","knowledge":["filter","dml","keys"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"共享Professional training workshops schema与题面条件","output":"删除参与者10与其相关信息","examTips":["不存在该人的资格、报名或参与者行，其他业务对象仍在。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不能为绕过父表删除限制而DROP FOREIGN KEY。"],"tables":["Enrolment","Qualification","Participant"],"knowledgeUses":{"filter":"不存在该人的资格、报名或参与者行，其他业务对象仍在。","dml":"涉及对象／命名中间结果：Enrolment, Qualification, Participant","keys":"涉及对象／命名中间结果：Enrolment, Qualification, Participant"},"sqlPlan":[{"label":"选表／对象","text":"Enrolment, Qualification, Participant"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"不存在该人的资格、报名或参与者行，其他业务对象仍在。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">DELETE FROM Enrolment WHERE participantNo = 10;\nDELETE FROM Qualification WHERE participantNo = 10;\nDELETE FROM Participant WHERE participantNo = 10;\n\u003c/code>\u003c/pre>\n"}],"tags":["CREATE TABLE and suitable types","CHECK, UNIQUE, NOT NULL and numeric capacity","ALTER add/drop/modify/rename and constraints","INSERT, UPDATE, DELETE and parent/child order"],"legacyPriority":"core","level":"A","archived":false,"originType":"Official Assignment","mainType":"ddl-dml","related":[],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"部分小题可能需要多条SQL。每项实现应紧接相应题目注释。(1)(2)使用DDL。\n\n(1) 修改结构和一致性约束，使Workshop.fee大于0且不超过9999.99。\n\n(2) 修改结构和约束，使Participant拥有的Qualification.qlevel以及Workshop要求的Requirement.requiredLevel都大于0且不超过10。\n\n(3)(4)(5)使用DML，禁止为完成这些数据操作而修改或删除约束。题目假设safe update已经停用。\n\n(3) 增加workshopNo=9的Workshop，其他属性自行选择。再给它增加2项qualification requirements；名称、等级及mandatory值自行选择。\n\n(4) 把participantNo=3拥有的每一项Qualification.qlevel都增加1。\n\n(5) 删除participantNo=10的Participant及与此人有关的全部信息。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["ddl","types","constraints","dml","filter","keys"],"types":["ddl-dml"],"requiredSkills":["ALTER TABLE / 修改表结构","DECIMAL(p,s) / 精确数值的位数","CHECK / UNIQUE / NOT NULL / 值限制、唯一与必填","INSERT / UPDATE / DELETE / 增加、修改和删除行","WHERE / predicate / 逐行筛选条件","Primary / candidate / foreign key / 主键、候选键与外键"],"questionHTML":"\u003cp>Note that you may need more than one SQL statement to implement a single subtask  listed below.    Your implementation must directly follow a comment with the specifications of a  subtask.  Implement SQL DDL (Data Definition Language) statements for questions (1) and (2)  below. \u003c/p>\n\u003cp>(1)  Modify the structure and consistency constraint of the sample database such that the  fee of each workshop must be a positive value not larger than 9999.99. \u003c/p>\n\u003cp>(2)  Modify the structure and consistency constraints of the sample database such that a  qualification level possessed by a participant and a qualification level required by a  workshop must be positive values no more than 10.  Implement SQL DML (Data Manipulation Language) statements for questions (3), (4)  and (5) below.  Note that you are not allowed to modify and/or drop any consistency constraints. We  assume that safe update has been disabled so that SQL can execute DML statements  anywhere. \u003c/p>\n\u003cp>(3)  Add a new workshop (workshopNo=9) to the sample database. The values of the  new Workshop columns are up to you. Add two qualification requirements for the new  workshop. The qualification names, required levels and mandatory values are up to you. \u003c/p>\n\u003cp>(4)  Modify the qualification levels possessed by participant (participantNo=3) such  that all qualification levels possessed by the participant increase by 1. \u003c/p>\n\u003cp>(5)  Remove participant (participantNo=10) and all information related to this  participant from the sample database.\u003c/p>\n","translationHTML":"\u003cp>部分小题可能需要多条SQL。每项实现应紧接相应题目注释。(1)(2)使用DDL。\u003c/p>\n\u003cp>(1) 修改结构和一致性约束，使Workshop.fee大于0且不超过9999.99。\u003c/p>\n\u003cp>(2) 修改结构和约束，使Participant拥有的Qualification.qlevel以及Workshop要求的Requirement.requiredLevel都大于0且不超过10。\u003c/p>\n\u003cp>(3)(4)(5)使用DML，禁止为完成这些数据操作而修改或删除约束。题目假设safe update已经停用。\u003c/p>\n\u003cp>(3) 增加workshopNo=9的Workshop，其他属性自行选择。再给它增加2项qualification requirements；名称、等级及mandatory值自行选择。\u003c/p>\n\u003cp>(4) 把participantNo=3拥有的每一项Qualification.qlevel都增加1。\u003c/p>\n\u003cp>(5) 删除participantNo=10的Participant及与此人有关的全部信息。\u003c/p>\n"},{"id":"A3-T2","title":"Assignment 3 — Task
