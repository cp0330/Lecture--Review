ore","level":"A","archived":false,"originType":"Official Assignment","mainType":"joins","related":[],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"以下查询必须使用JOIN／OUTER JOIN。每项实现紧接相应题目注释。\n\n(1) 找出拥有超过2项Qualification的Participant，输出full name和phone；先按last name升序，再按first name升序。\n\n(2) 找出没有任何qualification requirement的Workshop，输出workshopNo、title和category。\n\n(3) 每位Participant输出participantNo、full name及Workshop enrolment总数，按报名总数升序。没有报名的Participant也必须包含。\n\n(4) 每个Workshop输出workshopNo、title及已分配Trainer总数，按Trainer总数升序。没有Trainer的Workshop也必须包含。\n\n(5) 找出没有分配到任何Workshop的Trainer，输出trainerNo和full name。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["projection","join","count","concat","group","having","order","filter","left","null"],"types":["joins","aggregate"],"requiredSkills":["SELECT / projection / 选择输出列","JOIN / join condition / 连接及连接条件","COUNT / grain / 计数与计数单位","CONCAT / column alias / 合成姓名与输出列别名","GROUP BY / aggregate / 分组与聚合","HAVING / 聚合后的筛选","ORDER BY / 结果排序","WHERE / predicate / 逐行筛选条件","LEFT JOIN / 保留左侧未匹配行的连接","NULL / IS NULL / 未知值及空值判断"],"questionHTML":"\u003cp>You must implement SQL statements for the questions below by using JOIN / OUTER  JOIN.    Your implementation must directly follow a comment with a specification of a subtask. \u003c/p>\n\u003cp>(1)  Find the full name and phone number of all participants who possess more than 2  qualifications and display the results in ascending order of last name and first name. \u003c/p>\n\u003cp>(2)  Find the workshop number, title and category of all workshops that have no  qualification requirements. \u003c/p>\n\u003cp>(3)  Find the participant number, full name and total number of workshop enrolments for  each participant and display the results in ascending order of the total number of  enrolments. Participants who have not enrolled in a workshop must also be included. \u003c/p>\n\u003cp>(4)  Find the workshop number, title and total number of trainers assigned to each  workshop and display the results in ascending order of the total number of trainers.  Workshops that have no trainer assigned must also be included. \u003c/p>\n\u003cp>(5)  Find the trainer number and full name of all trainers who have not been assigned to  any workshop.\u003c/p>\n","translationHTML":"\u003cp>以下查询必须使用JOIN／OUTER JOIN。每项实现紧接相应题目注释。\u003c/p>\n\u003cp>(1) 找出拥有超过2项Qualification的Participant，输出full name和phone；先按last name升序，再按first name升序。\u003c/p>\n\u003cp>(2) 找出没有任何qualification requirement的Workshop，输出workshopNo、title和category。\u003c/p>\n\u003cp>(3) 每位Participant输出participantNo、full name及Workshop enrolment总数，按报名总数升序。没有报名的Participant也必须包含。\u003c/p>\n\u003cp>(4) 每个Workshop输出workshopNo、title及已分配Trainer总数，按Trainer总数升序。没有Trainer的Workshop也必须包含。\u003c/p>\n\u003cp>(5) 找出没有分配到任何Workshop的Trainer，输出trainerNo和full name。\u003c/p>\n"},{"id":"A4-T1","title":"Assignment 4 — Task 1","topic":"嵌套查询与关联嵌套查询","areas":["SELECT"],"source":"assignment-4","sourceLabel":"Assignment 4","sourceNote":"Assignment 4.pdf pp3,5–6,8,10; original dbcreate.sql and dbload.sql","origin":"Original material","priority":"A","question":"Implement SQL nested query statements for questions (1), (2) and (3). \n\n(1) Find the workshop number, title and fee of every workshop whose fee is higher than  the average fee of all workshops. \n\n(2) Find the participant number and full name of participants who have completed at least  one TECHNOLOGY workshop and at least one BUSINESS workshop. Cancelled  enrolments must not contribute to either condition. \n\n(3) Find the trainer number and full name of trainers assigned to at least two workshops.  Count workshop assignments, not enrolments.    Implement SQL correlated nested query statements for questions (4) and \n\n(5). \n\n(4) Find the participant number, full name, qualification name and qualification level of  participants whose level is the highest recorded for that qualification name. Order by  qualification name, then participant number. \n\n(5) Find the participant number and full name of participants who have completed at least  one workshop with a current fee of 200.00 or more. Ignore cancelled enrolments.","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"用nested query比较全体平均费用","steps":["内层SELECT AVG(fee) FROM Workshop只产生一个数。","外层逐工作坊比较fee>这个平均值；大于不是大于等于。","取workshopNo,title,fee；原数据平均168.75，符合1、2、5、7。"],"check":"使用了题目指定的nested query。","pitfall":"把平均按category分组会改变比较基准。","mainType":"nested","knowledge":["projection","filter","aggregatefn","nested"],"taskBrief":"用内层查询的结果筛选外层；采用题目规定的嵌套形式。","input":"共享Professional training workshops schema与题面条件","output":"用nested query比较全体平均费用","examTips":["使用了题目指定的nested query。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["把平均按category分组会改变比较基准。"],"tables":["Workshop"],"knowledgeUses":{"projection":"本小题输出：用nested query比较全体平均费用","filter":"使用了题目指定的nested query。","aggregatefn":"使用了题目指定的nested query。","nested":"使用了题目指定的nested query。"},"sqlPlan":[{"label":"选表／对象","text":"Workshop"},{"label":"连接与层次","text":"按题目指定形式区分内外层查询。"},{"label":"筛选、分组与输出","text":"使用了题目指定的nested query。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT workshopNo, title, fee\nFROM Workshop\nWHERE fee &gt; (SELECT AVG(fee) FROM Workshop);\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"同时满足技术类和商务类已完成条件","steps":["内层先各找TECHNOLOGY、BUSINESS工作坊集合。","在Enrolment中分别找这些课程且status=COMPLETED的参与者集合。","外层对同一参与者同时满足两个IN，用AND连接，不只满足其一。"],"check":"原数据为1、4、9；取消记录不满足任一完成条件。","pitfall":"OR只要求完成某一种类别，不是both。","mainType":"nested","knowledge":["projection","filter","concat","nested"],"taskBrief":"用内层查询的结果筛选外层；采用题目规定的嵌套形式。","input":"共享Professional training workshops schema与题面条件","output":"同时满足技术类和商务类已完成条件","examTips":["原数据为1、4、9；取消记录不满足任一完成条件。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["OR只要求完成某一种类别，不是both。"],"tables":["Participant","Enrolment","Workshop"],"knowledgeUses":{"projection":"本小题输出：同时满足技术类和商务类已完成条件","filter":"原数据为1、4、9；取消记录不满足任一完成条件。","concat":"原数据为1、4、9；取消记录不满足任一完成条件。","nested":"原数据为1、4、9；取消记录不满足任一完成条件。"},"sqlPlan":[{"label":"选表／对象","text":"Participant, Enrolment, Workshop"},{"label":"连接与层次","text":"按题目指定形式区分内外层查询。"},{"label":"筛选、分组与输出","text":"原数据为1、4、9；取消记录不满足任一完成条件。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT P.participantNo, CONCAT(P.fname, &#39; &#39;, P.lname) AS fullName\nFROM Participant AS P\nWHERE P.participantNo IN (\n    SELECT E.participantNo\n    FROM Enrolment AS E\n    WHERE E.status = &#39;COMPLETED&#39;\n      AND E.workshopNo IN (\n          SELECT workshopNo FROM Workshop WHERE category = &#39;TECHNOLOGY&#39;\n      )\n)\nAND P.participantNo IN (\n    SELECT E.participantNo\n    FROM Enrolment AS E\n    WHERE E.status = &#39;COMPLETED&#39;\n      AND E.workshopNo IN (\n          SELECT workshopNo FROM Workshop WHERE category = &#39;BUSINESS&#39;\n      )\n);\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"按工作分配次数选培训师","steps":["在WorkshopTrainer按trainerNo分组。","HAVING COUNT(*)>=2保留至少两项分配。","用nested IN在Trainer取编号和全名，原数据1、7。"],"check":"数的是不同工作坊分配，不是学生报名。","pitfall":"用Enrolment计人数与题目要的trainer assignments无关。","mainType":"nested","knowledge":["projection","filter","count","concat","nested","group","having"],"taskBrief":"用内层查询的结果筛选外层；采用题目规定的嵌套形式。","input":"共享Professional training workshops schema与题面条件","output":"按工作分配次数选培训师","examTips":["数的是不同工作坊分配，不是学生报名。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["用Enrolment计人数与题目要的trainer assignments无关。"],"tables":["Trainer","WorkshopTrainer"],"knowledgeUses":{"projection":"本小题输出：按工作分配次数选培训师","filter":"数的是不同工作坊分配，不是学生报名。","count":"数的是不同工作坊分配，不是学生报名。","concat":"数的是不同工作坊分配，不是学生报名。","nested":"数的是不同工作坊分配，不是学生报名。","group":"数的是不同工作坊分配，不是学生报名。","having":"数的是不同工作坊分配，不是学生报名。"},"sqlPlan":[{"label":"选表／对象","text":"Trainer, WorkshopTrainer"},{"label":"连接与层次","text":"按题目指定形式区分内外层查询。"},{"label":"筛选、分组与输出","text":"数的是不同工作坊分配，不是学生报名。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT T.trainerNo, CONCAT(T.fname, &#39; &#39;, T.lname) AS fullName\nFROM Trainer AS T\nWHERE T.trainerNo IN (\n    SELECT WT.trainerNo\n    FROM WorkshopTrainer AS WT\n    GROUP BY WT.trainerNo\n    HAVING COUNT(*) &gt;= 2\n);\n\u003c/code>\u003c/pre>\n"},{"number":"4","goal":"用correlated query保留每项资格的最高等级","steps":["外层Participant连接Qualification，当前行已有qname与qlevel。","内层仅在Q2.qname=外层Q.qname的同一种资格里取MAX(qlevel)。","当前qlevel等于最大值就保留，因此并列最高全部保留。","ORDER BY qname,participantNo，输出指定四项。"],"check":"新增一个同等级并列者，结果应多出该人而不是替换旧人。","pitfall":"全表MAX会把不同资格混在一起；LIMIT 1也会漏并列。","mainType":"correlated","knowledge":["projection","filter","join","aggregatefn","concat","ties","correlated","order"],"taskBrief":"让内层查询引用当前外层对象，对每个对象单独检查条件。","input":"共享Professional training workshops schema与题面条件","output":"用correlated query保留每项资格的最高等级","examTips":["新增一个同等级并列者，结果应多出该人而不是替换旧人。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["全表MAX会把不同资格混在一起；LIMIT 1也会漏并列。"],"tables":["Participant","Qualification"],"knowledgeUses":{"projection":"本小题输出：用correlated query保留每项资格的最高等级","filter":"新增一个同等级并列者，结果应多出该人而不是替换旧人。","join":"涉及对象／命名中间结果：Participant, Qualification","aggregatefn":"新增一个同等级并列者，结果应多出该人而不是替换旧人。","concat":"新增一个同等级并列者，结果应多出该人而不是替换旧人。","ties":"新增一个同等级并列者，结果应多出该人而不是替换旧人。","correlated":"新增一个同等级并列者，结果应多出该人而不是替换旧人。","order":"新增一个同等级并列者，结果应多出该人而不是替换旧人。"},"sqlPlan":[{"label":"选表／对象","text":"Participant, Qualification"},{"label":"连接与层次","text":"使用JOIN并检查完整ON条件；先确定每行的计数单位。"},{"label":"筛选、分组与输出","text":"新增一个同等级并列者，结果应多出该人而不是替换旧人。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT P.participantNo, CONCAT(P.fname, &#39; &#39;, P.lname) AS fullName,\n       Q.qname, Q.qlevel\nFROM Participant AS P\nJOIN Qualification AS Q ON Q.participantNo = P.participantNo\nWHERE Q.qlevel = (\n    SELECT MAX(Q2.qlevel)\n    FROM Qualification AS Q2\n    WHERE Q2.qname = Q.qname\n)\nORDER BY Q.qname, P.participantNo;\n\u003c/code>\u003c/pre>\n"},{"number":"5","goal":"用correlated EXISTS检查高费用已完成课程","steps":["对当前参与者，内层Enrolment用participantNo关联。","连接Workshop获得当前fee，限定COMPLETED且fee>=200。","EXISTS满足一次就足够，外层每人只一行。"],"check":"原数据1、4、7、9，200边界包含。","pitfall":"不能用历史付款假设替代原表中的当前fee。","mainType":"correlated","knowledge":["projection","filter","join","concat","correlated","exists"],"taskBrief":"让内层查询引用当前外层对象，对每个对象单独检查条件。","input":"共享Professional training workshops schema与题面条件","output":"用correlated EXISTS检查高费用已完成课程","examTips":["原数据1、4、7、9，200边界包含。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不能用历史付款假设替代原表中的当前fee。"],"tables":["Participant","Enrolment","Workshop"],"knowledgeUses":{"projection":"本小题输出：用correlated EXISTS检查高费用已完成课程","filter":"原数据1、4、7、9，200边界包含。","join":"涉及对象／命名中间结果：Participant, Enrolment, Workshop","concat":"原数据1、4、7、9，200边界包含。","correlated":"原数据1、4、7、9，200边界包含。","exists":"原数据1、4、7、9，200边界包含。"},"sqlPlan":[{"label":"选表／对象","text":"Participant, Enrolment, Workshop"},{"label":"连接与层次","text":"使用JOIN并检查完整ON条件；先确定每行的计数单位。"},{"label":"筛选、分组与输出","text":"原数据1、4、7、9，200边界包含。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT P.participantNo, CONCAT(P.fname, &#39; &#39;, P.lname) AS fullName\nFROM Participant AS P\nWHERE EXISTS (\n    SELECT 1\n    FROM Enrolment AS E\n    JOIN Workshop AS W ON W.workshopNo = E.workshopNo\n    WHERE E.participantNo = P.participantNo\n      AND E.status = &#39;COMPLETED&#39;\n      AND W.fee &gt;= 200.00\n);\n\u003c/code>\u003c/pre>\n"}],"tags":["COUNT, SUM, AVG and MAX","Nested queries, EXISTS and anti-joins","Correlated queries, ties and universal conditions"],"legacyPriority":"core","level":"A","archived":false,"originType":"Official Assignment","mainType":"nested","related":[],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"(1)(2)(3)必须用nested queries（嵌套查询）；(4)(5)必须用correlated nested queries（相关子查询）。\n\n(1) 找出fee高于所有Workshop平均fee的Workshop，输出workshopNo、title和fee。\n\n(2) 找出至少完成过一门TECHNOLOGY Workshop、并且至少完成过一门BUSINESS Workshop的Participant，输出participantNo和full name。Cancelled报名不能计入任一条件。\n\n(3) 找出分配到至少2个Workshop的Trainer，输出trainerNo和full name。数的是Workshop assignments，不是Participant报名记录。\n\n(4) 对每个qualification name，找出达到该资格已记录最高qlevel的Participant。输出participantNo、full name、qname和qlevel；先按qname，再按participantNo排列。并列最高者都符合。\n\n(5) 找出至少完成过一门当前fee不低于200.00的Workshop的Participant，输出participantNo与full name。忽略Cancelled报名。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["projection","filter","aggregatefn","nested","concat","count","group","having","join","ties","correlated","order","exists"],"types":["nested","correlated"],"requiredSkills":["SELECT / projection / 选择输出列","WHERE / predicate / 逐行筛选条件","AVG / MAX / SUM / 对选定行计算统计值","Nested query / 嵌套查询","CONCAT / column alias / 合成姓名与输出列别名","COUNT / grain / 计数与计数单位","GROUP BY / aggregate / 分组与聚合","HAVING / 聚合后的筛选","JOIN / join condition / 连接及连接条件","MAX / ties / 最大值与并列","Correlated subquery / 相关子查询","ORDER BY / 结果排序","EXISTS / NOT EXISTS / 存在与不存在"],"questionHTML":"\u003cp>Implement SQL nested query statements for questions (1), (2) and (3). \u003c/p>\n\u003cp>(1) Find the workshop number, title and fee of every workshop whose fee is higher than  the average fee of all workshops. \u003c/p>\n\u003cp>(2) Find the participant number and full name of participants who have completed at least  one TECHNOLOGY workshop and at least one BUSINESS workshop. Cancelled  enrolments must not contribute to either condition. \u003c/p>\n\u003cp>(3) Find the trainer number and full name of trainers assigned to at least two workshops.  Count workshop assignments, not enrolments.    Implement SQL correlated nested query statements for questions (4) and \u003c/p>\n\u003cp>(5). \u003c/p>\n\u003cp>(4) Find the participant number, full name, qualification name and qualification level of  participants whose level is the highest recorded for that qualification name. Order by  qualification name, then participant number. \u003c/p>\n\u003cp>(5) Find the participant number and full name of participants who have completed at least  one workshop with a current fee of 200.00 or more. Ignore cancelled enrolments.\u003c/p>\n","translationHTML":"\u003cp>(1)(2)(3)必须用nested queries（嵌套查询）；(4)(5)必须用correlated nested queries（相关子查询）。\u003c/p>\n\u003cp>(1) 找出fee高于所有Workshop平均fee的Workshop，输出workshopNo、title和fee。\u003c/p>\n\u003cp>(2) 找出至少完成过一门TECHNOLOGY Workshop、并且至少完成过一门BUSINESS Workshop的Participant，输出participantNo和full name。Cancelled报名不能计入任一条件。\u003c/p>\n\u003cp>(3) 找出分配到至少2个Workshop的Trainer，输出trainerNo和full name。数的是Workshop assignments，不是Participant报名记录。\u003c/p>\n\u003cp>(4) 对每个qualification name，找出达到该资格已记录最高qlevel的Participant。输出participantNo、full name、qname和qlevel；先按qname，再按participantNo排列。并列最高者都符合。\u003c/p>\n\u003cp>(5) 找出至少完成过一门当前fee不低于200.00的Workshop的Participant，输出participantNo与full name。忽略Cancelled报名。\u003c/p>\n"},{"id":"A4-T2","title":"Assignment 4 — Task 2","topic":"公用表表达式、视图与高级数据操作","areas":["SELECT","DDL/DML"],"source":"assignment-4","sourceLabel":"Assignment 4","sourceNote":"Assignment 4.pdf pp3,5–6,8,10; original dbcreate.sql and dbload.sql Public edition: example names, contact details and password literals anonymized.","origin":"Original material","priority":"A","question":"(1) Implement SELECT statements in a WITH clause for the query below.    Find the participant number, full name and email of all  participants who have enrolled in a workshop taught by at  least one trainer whose organisation is 'UOW'. Include  enrolments regardless of their status. Use at least two named  common table expressions.    You must implement at least 2 subqueries in the WITH clause for this question. \n\n(2) Use relational views to implement the questions below.    Find the workshop number, title and category of all workshops  in which PARTICIPANT_02 SAMPLE has enrolled. Display the result, then  drop the views in dependency order.    You must create at least 2 views to implement the query above. \n\n(3) Implement the questions below by using the advanced DDL and other required  statements.    Use one CREATE TABLE ... AS SELECT statement to create and  populate ParticipantQualifications with the participant  number, full name, email and total number of qualifications  possessed by each participant, including participants with no  qualifications. Name the columns participantNo, fullName,  email and totalQualifications. Then define participantNo as  both the primary key and a foreign key referencing  Participant(participantNo). Display all rows and finally drop \n\nParticipantQualifications. \n\n(4) Implement the questions below by using the advanced DML statements.    Increase capacity by 10 places for each workshop assigned to  at least two trainers. Use WorkshopTrainer to identify the  workshops rather than hard-coded numbers. Display the workshop  number, title and new capacity of the affected workshops. \n\n(5) Implement the questions below by using the advanced DML statements.  Remove BUSINESS workshops whose current fee is less than \n150.00.   Note that you must remove the information from the child tables (which contain  foreign key references to the parent table), then remove the information from the  parent table (which is referenced by the child tables).","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"用至少两个CTE分阶段查UOW培训参与者","steps":["CTE一把Trainer与WorkshopTrainer连接，筛organisation=UOW，再对workshopNo去重。","CTE二连接Enrolment，得到报名过这些workshops的participantNo并去重。","最终连接Participant取编号、全名、邮箱；不筛status，保留取消报名。"],"check":"有两个named CTE，原数据参与者1、2、4、7、8、12。","pitfall":"只定义一个CTE或者悄悄加COMPLETED都不符合题面。","mainType":"cte","knowledge":["projection","filter","join","concat","cte","distinct"],"taskBrief":"按原题建立有名称的中间结果；同时满足WITH和CTE数量要求。","input":"共享Professional training workshops schema与题面条件","output":"用至少两个CTE分阶段查UOW培训参与者","examTips":["有两个named CTE，原数据参与者1、2、4、7、8、12。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["只定义一个CTE或者悄悄加COMPLETED都不符合题面。"],"tables":["WorkshopTrainer","Trainer","Enrolment","UOWWorkshops","Participant","EligibleParticipants"],"knowledgeUses":{"projection":"本小题输出：用至少两个CTE分阶段查UOW培训参与者","filter":"有两个named CTE，原数据参与者1、2、4、7、8、12。","join":"涉及对象／命名中间结果：WorkshopTrainer, Trainer, Enrolment, UOWWorkshops, Participant, EligibleParticipants","concat":"有两个named CTE，原数据参与者1、2、4、7、8、12。","cte":"涉及对象／命名中间结果：WorkshopTrainer, Trainer, Enrolment, UOWWorkshops, Participant, EligibleParticipants","distinct":"有两个named CTE，原数据参与者1、2、4、7、8、12。"},"sqlPlan":[{"label":"选表／对象","text":"WorkshopTrainer, Trainer, Enrolment, UOWWorkshops, Participant, EligibleParticipants"},{"label":"连接与层次","text":"使用JOIN并检查完整ON条件；先确定每行的计数单位。"},{"label":"筛选、分组与输出","text":"有两个named CTE，原数据参与者1、2、4、7、8、12。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">WITH UOWWorkshops AS (\n    SELECT DISTINCT WT.workshopNo\n    FROM WorkshopTrainer AS WT\n    JOIN Trainer AS T ON T.trainerNo = WT.trainerNo\n    WHERE T.organisation = &#39;UOW&#39;\n),\nEligibleParticipants AS (\n    SELECT DISTINCT E.participantNo\n    FROM Enrolment AS E\n    JOIN UOWWorkshops AS U ON U.workshopNo = E.workshopNo\n)\nSELECT P.participantNo, CONCAT(P.fname, &#39; &#39;, P.lname) AS fullName, P.email\nFROM Participant AS P\nJOIN EligibleParticipants AS EP ON EP.participantNo = P.participantNo;\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"用至少两个相互依赖的views查PARTICIPANT_02报名","steps":["第一个view根据Participant姓名连接Enrolment，只保留所报workshopNo。","第二个view引用第一个并连接Workshop，得到编号、标题、类别，避免重复。","SELECT显示结果后，先DROP第二个依赖view，再DROP第一个。"],"check":"原数据workshops1、6，最后两个views均删除。","pitfall":"同时创建两个互不使用的views并不能说明它们共同实现了题目。","mainType":"views","knowledge":["projection","filter","join","view","definer","distinct"],"taskBrief":"建立并使用视图，显示结果，再按依赖顺序处理视图。","input":"共享Professional training workshops schema与题面条件","output":"用至少两个相互依赖的views查PARTICIPANT_02报名","examTips":["原数据workshops1、6，最后两个views均删除。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["同时创建两个互不使用的views并不能说明它们共同实现了题目。"],"tables":["Enrolment","Participant","Workshop","TargetEnrolments","TargetWorkshops"],"knowledgeUses":{"projection":"本小题输出：用至少两个相互依赖的views查PARTICIPANT_02报名","filter":"原数据workshops1、6，最后两个views均删除。","join":"涉及对象／命名中间结果：Enrolment, Participant, Workshop, TargetEnrolments, TargetWorkshops","view":"涉及对象／命名中间结果：Enrolment, Participant, Workshop, TargetEnrolments, TargetWorkshops","definer":"原数据workshops1、6，最后两个views均删除。","distinct":"原数据workshops1、6，最后两个views均删除。"},"sqlPlan":[{"label":"选表／对象","text":"Enrolment, Participant, Workshop, TargetEnrolments, TargetWorkshops"},{"label":"连接与层次","text":"使用JOIN并检查完整ON条件；先确定每行的计数单位。"},{"label":"筛选、分组与输出","text":"原数据workshops1、6，最后两个views均删除。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">CREATE VIEW TargetEnrolments AS\nSELECT E.workshopNo\nFROM Enrolment AS E\nJOIN Participant AS P ON P.participantNo = E.participantNo\nWHERE P.fname = &#39;PARTICIPANT_02&#39; AND P.lname = &#39;SAMPLE&#39;;\n\nCREATE VIEW TargetWorkshops AS\nSELECT DISTINCT W.workshopNo, W.title, W.category\nFROM Workshop AS W\nJOIN TargetEnrolments AS L ON L.workshopNo = W.workshopNo;\n\nSELECT workshopNo, title, category FROM TargetWorkshops;\n\nDROP VIEW TargetWorkshops;\nDROP VIEW TargetEnrolments;\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"一条CTAS建资格统计快照，再加PK/FK","steps":["Participant LEFT JOIN Qualification，按参与者分组；COUNT(Q.qname)给无资格者0。","给四个SELECT表达式准确命名participantNo/fullName/email/totalQualifications。","CREATE TABLE ... AS SELECT一次完成建表与装载；再ALTER添加participantNo primary key和指向Participant的foreign key。","SELECT全部行，再DROP表。原表约束不会自动从CTAS复制。"],"check":"恰好四列；参与者11有一行且总数0。","pitfall":"先建空表再INSERT虽然能实现统计，却不满足本题“一条CTAS”的指定形式。","mainType":"ddl-dml","knowledge":["projection","join","count","concat","left","group","keys","constraints","ddl","types"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"共享Professional training workshops schema与题面条件","output":"一条CTAS建资格统计快照，再加PK/FK","examTips":["恰好四列；参与者11有一行且总数0。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["先建空表再INSERT虽然能实现统计，却不满足本题“一条CTAS”的指定形式。"],"tables":["ParticipantQualifications","Participant","Qualification"],"knowledgeUses":{"projection":"本小题输出：一条CTAS建资格统计快照，再加PK/FK","join":"涉及对象／命名中间结果：ParticipantQualifications, Participant, Qualification","count":"恰好四列；参与者11有一行且总数0。","concat":"恰好四列；参与者11有一行且总数0。","left":"恰好四列；参与者11有一行且总数0。","group":"恰好四列；参与者11有一行且总数0。","keys":"涉及对象／命名中间结果：ParticipantQualifications, Participant, Qualification","constraints":"恰好四列；参与者11有一行且总数0。","ddl":"涉及对象／命名中间结果：ParticipantQualifications, Participant, Qualification","types":"恰好四列；参与者11有一行且总数0。"},"sqlPlan":[{"label":"选表／对象","text":"ParticipantQualifications, Participant, Qualification"},{"label":"连接与层次","text":"使用JOIN并检查完整ON条件；先确定每行的计数单位。"},{"label":"筛选、分组与输出","text":"恰好四列；参与者11有一行且总数0。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">CREATE TABLE ParticipantQualifications AS\nSELECT P.participantNo,\n       CONCAT(P.fname, &#39; &#39;, P.lname) AS fullName,\n       P.email,\n       COUNT(Q.qname) AS totalQualifications\nFROM Participant AS P\nLEFT JOIN Qualification AS Q ON Q.participantNo = P.participantNo\nGROUP BY P.participantNo, P.fname, P.lname, P.email;\n\nALTER TABLE ParticipantQualifications\n    ADD CONSTRAINT pq_pkey PRIMARY KEY (participantNo),\n    ADD CONSTRAINT pq_fkey FOREIGN KEY (participantNo)\n        REFERENCES Participant(participantNo);\n\nSELECT participantNo, fullName, email, totalQualifications\nFROM ParticipantQualifications;\n\nDROP TABLE ParticipantQualifications;\n\u003c/code>\u003c/pre>\n"},{"number":"4","goal":"对至少两培训师的工作坊容量加10","steps":["WorkshopTrainer按workshopNo GROUP BY，HAVING COUNT(*)>=2。","在UPDATE Workshop的WHERE使用这个子查询集合，不硬编码3或7。","SET capacity=capacity+10；再按相同分配条件SELECT展示更新后的容量。"],"check":"3号50→60，7号35→45，其他不变；重复执行会再次增加。","pitfall":"不能改fee，也不是容量增加10%。","mainType":"ddl-dml","knowledge":["projection","filter","count","dml","group","having"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"共享Professional training workshops schema与题面条件","output":"对至少两培训师的工作坊容量加10","examTips":["3号50→60，7号35→45，其他不变；重复执行会再次增加。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不能改fee，也不是容量增加10%。"],"tables":["Workshop","WorkshopTrainer"],"knowledgeUses":{"projection":"本小题输出：对至少两培训师的工作坊容量加10","filter":"3号50→60，7号35→45，其他不变；重复执行会再次增加。","count":"3号50→60，7号35→45，其他不变；重复执行会再次增加。","dml":"涉及对象／命名中间结果：Workshop, WorkshopTrainer","group":"3号50→60，7号35→45，其他不变；重复执行会再次增加。","having":"3号50→60，7号35→45，其他不变；重复执行会再次增加。"},"sqlPlan":[{"label":"选表／对象","text":"Workshop, WorkshopTrainer"},{"label":"连接与层次","text":"按题目指定形式区分内外层查询。"},{"label":"筛选、分组与输出","text":"3号50→60，7号35→45，其他不变；重复执行会再次增加。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">UPDATE Workshop\nSET capacity = capacity + 10\nWHERE workshopNo IN (\n    SELECT workshopNo\n    FROM WorkshopTrainer\n    GROUP BY workshopNo\n    HAVING COUNT(*) &gt;= 2\n);\n\nSELECT W.workshopNo, W.title, W.capacity\nFROM Workshop AS W\nWHERE W.workshopNo IN (\n    SELECT workshopNo\n    FROM WorkshopTrainer\n    GROUP BY workshopNo\n    HAVING COUNT(*) &gt;= 2\n);\n\u003c/code>\u003c/pre>\n"},{"number":"5","goal":"先删引用，再删低费用BUSINESS工作坊","steps":["目标条件category=BUSINESS AND fee\u003c150，边界150不删。","对Enrolment、Requirement、WorkshopTrainer分别删除引用目标工作坊的行。","最后DELETE Workshop本身；不要删除Participant或Trainer目录对象。"],"check":"原数据仅workshops4、8被移除，foreign keys始终生效。","pitfall":"先删父表、使用OR、或关闭foreign key检查都会有问题。","mainType":"ddl-dml","knowledge":["projection","filter","dml","keys"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"共享Professional training workshops schema与题面条件","output":"先删引用，再删低费用BUSINESS工作坊","examTips":["原数据仅workshops4、8被移除，foreign keys始终生效。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["先删父表、使用OR、或关闭foreign key检查都会有问题。"],"tables":["Enrolment","Workshop","Requirement","WorkshopTrainer"],"knowledgeUses":{"projection":"本小题输出：先删引用，再删低费用BUSINESS工作坊","filter":"原数据仅workshops4、8被移除，foreign keys始终生效。","dml":"涉及对象／命名中间结果：Enrolment, Workshop, Requirement, WorkshopTrainer","keys":"涉及对象／命名中间结果：Enrolment, Workshop, Requirement, WorkshopTrainer"},"sqlPlan":[{"label":"选表／对象","text":"Enrolment, Workshop, Requirement, WorkshopTrainer"},{"label":"连接与层次","text":"按题目指定形式区分内外层查询。"},{"label":"筛选、分组与输出","text":"原数据仅workshops4、8被移除，foreign keys始终生效。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">DELETE FROM Enrolment\nWHERE workshopNo IN (\n    SELECT workshopNo FROM Workshop\n    WHERE category = &#39;BUSINESS&#39; AND fee &lt; 150.00\n);\n\nDELETE FROM Requirement\nWHERE workshopNo IN (\n    SELECT workshopNo FROM Workshop\n    WHERE category = &#39;BUSINESS&#39; AND fee &lt; 150.00\n);\n\nDELETE FROM WorkshopTrainer\nWHERE workshopNo IN (\n    SELECT workshopNo FROM Workshop\n    WHERE category = &#39;BUSINESS&#39; AND fee &lt; 150.00\n);\n\nDELETE FROM Workshop\nWHERE category = &#39;BUSINESS&#39; AND fee &lt; 150.00;\n\u003c/code>\u003c/pre>\n"}],"tags":["CTE and derived tables","View dependencies and drop order","CTAS and INSERT SELECT","Subquery-driven UPDATE and DELETE"],"legacyPriority":"core","level":"A","archived":false,"originType":"Official Assignment","mainType":"cte","related":[],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"使用原始schema和数据处理以下任务，各子题的实现方式有明确要求。\n\n(1) 使用WITH中的SELECT实现查询：找出报名过至少由一位organisation为UOW的Trainer教授的Workshop的Participant，输出participantNo、full name和email。所有报名状态都计入。WITH中至少要有2个有名称的CTE，不能只写一个。\n\n(2) 使用至少2个View，找出英文题面指定Participant报名的全部Workshop，输出workshopNo、title、category。先显示结果，再按依赖顺序删除Views。\n\n(3) 用一条CREATE TABLE ... AS SELECT创建并填充ParticipantQualifications，包含每位Participant的participantNo、fullName、email和totalQualifications。没有Qualification的人也要包含。随后把participantNo设为primary key及引用Participant(participantNo)的foreign key。显示所有行，最后DROP这个新表。\n\n(4) 给分配了至少2位Trainer的Workshop增加10个capacity名额。必须从WorkshopTrainer识别目标，不能硬编码Workshop号码。显示受影响Workshop的workshopNo、title和新capacity。\n\n(5) 删除当前fee小于150.00的BUSINESS Workshop。必须先删除引用它们的child rows，再删被引用的Workshop rows。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["projection","filter","join","concat","cte","distinct","view","definer","count","left","group","keys","constraints","ddl","types","dml","having"],"types":["cte","views","ddl-dml"],"requiredSkills":["SELECT / projection / 选择输出列","WHERE / predicate / 逐行筛选条件","JOIN / join condition / 连接及连接条件","CONCAT / column alias / 合成姓名与输出列别名","WITH / CTE / 命名公共表表达式","DISTINCT / 删除重复结果行","View / dependency / 视图与依赖","SQL SECURITY DEFINER / 由视图定义者权限读取底表","COUNT / grain / 计数与计数单位","LEFT JOIN / 保留左侧未匹配行的连接","GROUP BY / aggregate / 分组与聚合","Primary / candidate / foreign key / 主键、候选键与外键","CHECK / UNIQUE / NOT NULL / 值限制、唯一与必填","ALTER TABLE / 修改表结构","DECIMAL(p,s) / 精确数值的位数","INSERT / UPDATE / DELETE / 增加、修改和删除行","HAVING / 聚合后的筛选"],"questionHTML":"\u003cp>(1) Implement SELECT statements in a WITH clause for the query below.    Find the participant number, full name and email of all  participants who have enrolled in a workshop taught by at  least one trainer whose organisation is &#39;UOW&#39;. Include  enrolments regardless of their status. Use at least two named  common table expressions.    You must implement at least 2 subqueries in the WITH clause for this question. \u003c/p>\n\u003cp>(2) Use relational views to implement the questions below.    Find the workshop number, title and category of all workshops  in which PARTICIPANT_02 SAMPLE has enrolled. Display the result, then  drop the views in dependency order.    You must create at least 2 views to implement the query above. \u003c/p>\n\u003cp>(3) Implement the questions below by using the advanced DDL and other required  statements.    Use one CREATE TABLE ... AS SELECT statement to create and  populate ParticipantQualifications with the participant  number, full name, email and total number of qualifications  possessed by each participant, including participants with no  qualifications. Name the columns participantNo, fullName,  email and totalQualifications. Then define participantNo as  both the primary key and a foreign key referencing  Participant(participantNo). Display all rows and finally drop \u003c/p>\n\u003cp>ParticipantQualifications. \u003c/p>\n\u003cp>(4) Implement the questions below by using the advanced DML statements.    Increase capacity by 10 places for each workshop assigned to  at least two trainers. Use WorkshopTrainer to identify the  workshops rather than hard-coded numbers. Display the workshop  number, title and new capacity of the affected workshops. \u003c/p>\n\u003cp>(5) Implement the questions below by using the advanced DML statements.  Remove BUSINESS workshops whose current fee is less than \n150.00.   Note that you must remove the information from the child tables (which contain  foreign key references to the parent table), then remove the information from the  parent table (which is referenced by the child tables).\u003c/p>\n","translationHTML":"\u003cp>使用原始schema和数据处理以下任务，各子题的实现方式有明确要求。\u003c/p>\n\u003cp>(1) 使用WITH中的SELECT实现查询：找出报名过至少由一位organisation为UOW的Trainer教授的Workshop的Participant，输出participantNo、full name和email。所有报名状态都计入。WITH中至少要有2个有名称的CTE，不能只写一个。\u003c/p>\n\u003cp>(2) 使用至少2个View，找出英文题面指定Participant报名的全部Workshop，输出workshopNo、title、category。先显示结果，再按依赖顺序删除Views。\u003c/p>\n\u003cp>(3) 用一条CREATE TABLE ... AS SELECT创建并填充ParticipantQualifications，包含每位Participant的participantNo、fullName、email和totalQualifications。没有Qualification的人也要包含。随后把participantNo设为primary key及引用Participant(participantNo)的foreign key。显示所有行，最后DROP这个新表。\u003c/p>\n\u003cp>(4) 给分配了至少2位Trainer的Workshop增加10个capacity名额。必须从WorkshopTrainer识别目标，不能硬编码Workshop号码。显示受影响Workshop的workshopNo、title和新capacity。\u003c/p>\n\u003cp>(5) 删除当前fee小于150.00的BUSINESS Workshop。必须先删除引用它们的child rows，再删被引用的Workshop rows。\u003c/p>\n"},{"id":"A4-T3","title":"Assignment 4 — Task 3","topic":"用户、指定列的读取权限与汇总视图","areas":["Access"],"source":"assignment-4","sourceLabel":"Assignment 4","sourceNote":"Assignment 4.pdf pp3,5–6,8,10; original dbcreate.sql and dbload.sql Public edition: example names, contact details and password literals anonymized.","origin":"Original material","priority":"A","question":"Note that a user csit882 does not have the privileges required to process the steps listed  below. You must connect as the user root with the password [ROOT_PASSWORD].    Assume that the user root with a password '[ROOT_OR_USER_PASSWORD]' created a database called csit882.  The user root has created the sample database by executing dbcreate.sql and dbload.sql in  the database csit882. The user root nominates the database csit882 as the default  database.    Implement the SQL statements for the questions below. \n\n(1) Create two new users named \u003cemail-prefix>_1 and \u003cemail-prefix>_2. Use the part  of your UOW email address before @ as \u003cemail-prefix>.   For example, the anonymized prefix STUDENT_CODE gives STUDENT_CODE_1 and STUDENT_CODE_2. The passwords are  up to you \n\n(2) Grant read privileges on all relational tables in the database csit882 to the first user  created in subtask 1. The first user must not be allowed to propagate these privileges to  other users or roles. \n\n(3) Grant write privileges (INSERT, UPDATE and DELETE) on the relational table  Enrolment in the database csit882 to the first user created in subtask 1. The first user  must not be allowed to propagate these privileges to other users or roles. \n\n(4) Grant read privileges on only the workshop number, title, category and fee in the  relational table Workshop in the database csit882 to the second user created in  subtask 1. The second user must be allowed to grant the same privileges to other  users or roles. \n\n(5) Grant read privileges on the participant number, full name and total number of  qualifications possessed by each participant, including participants with no  qualifications, to the second user created in subtask 1. Create a view named  ParticipantQualificationSummary to provide this information. The second user must  not be allowed to propagate the privileges on this view to other users or roles.","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"用邮箱前缀创建两用户","steps":["root权限执行；用户名按本人的email-prefix加_1、_2。","保持host为localhost，密码自行选择，不能把示例邮箱当成本人的固定用户名。","两条CREATE USER先于后续GRANT，默认数据库为csit882。"],"check":"两个用户名不同，后续引用完全一致。","pitfall":"直接按csit882普通用户运行可能没有创建账号或授权权限。","mainType":"access","knowledge":["user"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。 :"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"共享Professional training workshops schema与题面条件","output":"通过指定汇总view开放参与者资格总数","examTips":["输出编号、全名、资格总数，且无资格者为0。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不要为了能读view而额外开放所有底表。"],"tables":["csit882.Participant","csit882.Qualification"],"knowledgeUses":{"projection":"本小题输出：通过指定汇总view开放参与者资格总数","join":"涉及对象／命名中间结果：csit882.Participant, csit882.Qualification","count":"输出编号、全名、资格总数，且无资格者为0。","concat":"输出编号、全名、资格总数，且无资格者为0。","grant":"输出编号、全名、资格总数，且无资格者为0。","grantoption":"输出编号、全名、资格总数，且无资格者为0。","view":"涉及对象／命名中间结果：csit882.Participant, csit882.Qualification","definer":"输出编号、全名、资格总数，且无资格者为0。","left":"输出编号、全名、资格总数，且无资格者为0。","group":"输出编号、全名、资格总数，且无资格者为0。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">CREATE SQL SECURITY DEFINER VIEW csit882.ParticipantQualificationSummary AS\nSELECT P.participantNo,\n       CONCAT(P.fname, &#39; &#39;, P.lname) AS fullName,\n       COUNT(Q.qname) AS totalQualifications\nFROM csit882.Participant AS P\nLEFT JOIN csit882.Qualification AS Q ON Q.participantNo = P.participantNo\nGROUP BY P.participantNo, P.fname, P.lname;\n\nGRANT SELECT ON csit882.ParticipantQualificationSummary\nTO &#39;STUDENT_CODE_2&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"}],"tags":["Database/table/column scopes and GRANT OPTION","Views for restricted rows/columns and summaries"],"legacyPriority":"core","level":"A","archived":false,"originType":"Official Assignment","mainType":"access","related":[],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"csit882普通用户没有完成以下操作的权限，必须以root身份执行。root密码按英文题面给定。root已通过dbcreate.sql和dbload.sql在csit882中建立样例数据库，并已将它设为默认数据库。\n\n(1) 创建两个用户，名称为\u003cemail-prefix>_1与\u003cemail-prefix>_2；\u003cemail-prefix>取自己的UOW邮箱在@前的部分。公开版使用STUDENT_CODE作为匿名示例。密码自行选择。\n\n(2) 向第一个用户授予csit882所有表的读取权，不允许转授其他用户或role。\n\n(3) 向第一个用户授予Enrolment的INSERT、UPDATE、DELETE权限，不允许转授。\n\n(4) 向第二个用户只授予Workshop的workshopNo、title、category、fee这4列的读取权，并允许转授这些读取权限。\n\n(5) 建立名为ParticipantQualificationSummary的View，提供participantNo、full name及该人Qualification总数，包含没有Qualification的人。向第二个用户授予该View的读取权，不允许转授这项View权限。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["user","grant","grantoption","dml","keys","projection","join","count","concat","view","definer","left","group"],"types":["access"],"requiredSkills":["CREATE USER / account host / 创建用户及主机范围","GRANT / privilege scope / 授予权限与对象范围","WITH GRANT OPTION / 权限转授","INSERT / UPDATE / DELETE / 增加、修改和删除行","Primary / candidate / foreign key / 主键、候选键与外键","SELECT / projection / 选择输出列","JOIN / join condition / 连接及连接条件","COUNT / grain / 计数与计数单位","CONCAT / column alias / 合成姓名与输出列别名","View / dependency / 视图与依赖","SQL SECURITY DEFINER / 由视图定义者权限读取底表","LEFT JOIN / 保留左侧未匹配行的连接","GROUP BY / aggregate / 分组与聚合"],"questionHTML":"\u003cp>Note that a user csit882 does not have the privileges required to process the steps listed  below. You must connect as the user root with the password [ROOT_PASSWORD].    Assume that the user root with a password &#39;[ROOT_OR_USER_PASSWORD]&#39; created a database called csit882.  The user root has created the sample database by executing dbcreate.sql and dbload.sql in  the database csit882. The user root nominates the database csit882 as the default  database.    Implement the SQL statements for the questions below. \u003c/p>\n\u003cp>(1) Create two new users named &lt;email-prefix&gt;_1 and &lt;email-prefix&gt;_2. Use the part  of your UOW email address before @ as &lt;email-prefix&gt;.   For example, the anonymized prefix STUDENT_CODE gives STUDENT_CODE_1 and STUDENT_CODE_2. The passwords are  up to you \u003c/p>\n\u003cp>(2) Grant read privileges on all relational tables in the database csit882 to the first user  created in subtask 1. The first user must not be allowed to propagate these privileges to  other users or roles. \u003c/p>\n\u003cp>(3) Grant write privileges (INSERT, UPDATE and DELETE) on the relational table  Enrolment in the database csit882 to the first user created in subtask 1. The first user  must not be allowed to propagate these privileges to other users or roles. \u003c/p>\n\u003cp>(4) Grant read privileges on only the workshop number, title, category and fee in the  relational table Workshop in the database csit882 to the second user created in  subtask 1. The second user must be allowed to grant the same privileges to other  users or roles. \u003c/p>\n\u003cp>(5) Grant read privileges on the participant number, full name and total number of  qualifications possessed by each participant, including participants with no  qualifications, to the second user created in subtask 1. Create a view named  ParticipantQualificationSummary to provide this information. The second user must  not be allowed to propagate the privileges on this view to other users or roles.\u003c/p>\n","translationHTML":"\u003cp>csit882普通用户没有完成以下操作的权限，必须以root身份执行。root密码按英文题面给定。root已通过dbcreate.sql和dbload.sql在csit882中建立样例数据库，并已将它设为默认数据库。\u003c/p>\n\u003cp>(1) 创建两个用户，名称为&lt;email-prefix&gt;_1与&lt;email-prefix&gt;_2；&lt;email-prefix&gt;取自己的UOW邮箱在@前的部分。公开版使用STUDENT_CODE作为匿名示例。密码自行选择。\u003c/p>\n\u003cp>(2) 向第一个用户授予csit882所有表的读取权，不允许转授其他用户或role。\u003c/p>\n\u003cp>(3) 向第一个用户授予Enrolment的INSERT、UPDATE、DELETE权限，不允许转授。\u003c/p>\n\u003cp>(4) 向第二个用户只授予Workshop的workshopNo、title、category、fee这4列的读取权，并允许转授这些读取权限。\u003c/p>\n\u003cp>(5) 建立名为ParticipantQualificationSummary的View，提供participantNo、full name及该人Qualification总数，包含没有Qualification的人。向第二个用户授予该View的读取权，不允许转授这项View权限。\u003c/p>\n"},{"id":"A4-T4","title":"Assignment 4 — Task 4","topic":"根据函数依赖求最小键和最高范式","areas":["Normalization"],"source":"assignment-4","sourceLabel":"Assignment 4","sourceNote":"Assignment 4.pdf pp3,5–6,8,10; original dbcreate.sql and dbload.sql","origin":"Original material","priority":"A","question":"Consider the relational schemas given below and the respective sets of functional  dependencies valid in the schemas. Assume that each schema is in 1NF.    For each one of the relational schemas, determine the highest normal form that is valid  for a schema. Justify your answer. Justification must include the derivations of minimal  keys from the functional dependencies and testing the validity of all normal forms (2NF,  3NF, BCNF) against the relational schemas, minimal keys, and functional dependencies.    A correct guess without the comprehensive justifications scores no marks!  Do not change the attributes of relational schemas in the questions. \n\n(1) $R=(A,B,C,D)$      $F=\\{A \\to B, A \\to C, C \\to D\\}$ \n\n(2) $R=(A,B,C,D)$      $F=\\{A \\to C, B \\to D\\}$ \n\n(3) $R=(A,B,C,D)$      $F=\\{A \\to B, B \\to C, C \\to A, C \\to D\\}$ \n\n(4) $R=(A,B,C,D)$      $F=\\{AB \\to C, AB \\to D, C \\to B\\}$","context":"","canonical":null,"parts":[{"number":"1","goal":"唯一key是{A}，最高2NF","steps":["A不在给定FD右侧，所以key必须含A；A→B、A→C、C→D逐步得到A⁺=ABCD。","A单独足够且不能再删；prime attribute只有A，B/C/D都是non-prime。","2NF成立；C⁺=CD不是superkey，C→D右侧D又非prime，因此3NF和BCNF失败。"],"check":"指出具体违规FD C→D，而不只说有传递依赖。","pitfall":"不能把A→C也判为3NF违规，因为A是key。","mainType":"normalization","knowledge":["fd","closure","candidate","prime","partial","third","bcnf"],"taskBrief":"根据给定FD推导全部最小键，并逐项证明最高范式。","input":"英文题面和给定图／FD","output":"全部candidate keys、prime／non-prime、逐项NF检查与最高范式证明","examTips":["指出具体违规FD C→D，而不只说有传递依赖。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不能把A→C也判为3NF违规，因为A是key。"],"tables":[],"knowledgeUses":{"fd":"R={A, B, C, D}；F={A→B, A→C, C→D}。已知1NF；保持原属性不变。","closure":"候选键为{A}。按属性数从小到大检查全部子集，并剔除包含更小key的superkey。","candidate":"候选键为{A}。按属性数从小到大检查全部子集，并剔除包含更小key的superkey。","prime":"Prime={A}；Non-prime={B, C, D}。取所有candidate keys的并集，不只取一个选定key。","partial":"成立：检查全部candidate keys的真子集，没有发现其能决定non-prime attribute的partial dependency。 真子集闭包：{}⁺={}。","third":"不成立：C → D，左侧闭包为{C, D}，不是superkey；右侧不是prime，因此两个3NF条件都不成立。","bcnf":"不成立：C → D，左侧闭包为{C, D}，不是superkey。BCNF不允许用右侧prime作为例外。"},"sqlPlan":[],"validation":"已穷举全部属性子集复核closure、所有最小candidate keys及F⁺中的范式条件。","hints":["先找不在FD右侧的属性；它们必须包含在每个key中。","计算候选组合的closure，并逐项删除检查最小性。不要只找一个key就停止。","先列全部prime attributes，再检查2NF、3NF和BCNF。3NF右侧为prime的例外不能用于BCNF。"],"referenceHTML":"\u003cp>Candidate keys: {A}.\u003c/p>\n\u003cp>A+ = {A, B, C, D}. Every proper subset fails to determine R, so the key is minimal.\u003c/p>\n\u003cp>Prime attributes: {A}. Non-prime attributes: {B, C, D}.\u003c/p>\n\u003cp>2NF holds: no non-prime attribute depends on a proper subset of any candidate key.\u003c/p>\n\u003cp>3NF fails: C → D, where {C} is not a superkey ({C, D} != R) and D is non-prime.\u003c/p>\n\u003cp>BCNF fails: C → D has a determinant that is not a superkey.\u003c/p>\n\u003cp>The highest normal form is 2NF.\u003c/p>\n"},{"number":"2","goal":"唯一key是{A,B}，最高1NF","steps":["A、B都无法从其他属性推出，每个key必须同时含A和B。","A⁺=AC、B⁺=BD，AB⁺=ABCD，因此AB是唯一minimal key。","A→C、B→D让non-prime attributes依赖key真子集，违反2NF，也违反3NF/BCNF。"],"check":"列出AB，并同时证明A或B单独不够。","pitfall":"“含P/Q”这类斜线写法可能读成二选一；应写同时包含。","mainType":"normalization","knowledge":["fd","closure","candidate","prime","partial","third","bcnf"],"taskBrief":"根据给定FD推导全部最小键，并逐项证明最高范式。","input":"英文题面和给定图／FD","output":"全部candidate keys、prime／non-prime、逐项NF检查与最高范式证明","examTips":["列出AB，并同时证明A或B单独不够。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["“含P/Q”这类斜线写法可能读成二选一；应写同时包含。"],"tables":[],"knowledgeUses":{"fd":"R={A, B, C, D}；F={A→C, B→D}。已知1NF；保持原属性不变。","closure":"候选键为{A, B}。按属性数从小到大检查全部子集，并剔除包含更小key的superkey。","candidate":"候选键为{A, B}。按属性数从小到大检查全部子集，并剔除包含更小key的superkey。","prime":"Prime={A, B}；Non-prime={C, D}。取所有candidate keys的并集，不只取一个选定key。","partial":"不成立：A → C，左侧闭包为{A, C}；右侧是non-prime，左侧是某candidate key的真子集。","third":"不成立：A → C，左侧闭包为{A, C}，不是superkey；右侧不是prime，因此两个3NF条件都不成立。","bcnf":"不成立：A → C，左侧闭包为{A, C}，不是superkey。BCNF不允许用右侧prime作为例外。"},"sqlPlan":[],"validation":"已穷举全部属性子集复核closure、所有最小candidate keys及F⁺中的范式条件。","hints":["先找不在FD右侧的属性；它们必须包含在每个ke given below and the respective sets of functional  dependencies valid in the schemas. Assume that each schema is in 1NF.    For each one of the relational schemas, determine the highest normal form that is valid  for a schema. Justify your answer. Justification must include the derivations of minimal  keys from the functional dependencies and testing the validity of all normal forms (2NF,  3NF, BCNF) against the relational schemas, minimal keys, and functional dependencies.    A correct guess without the comprehensive justifications scores no marks!  Do not change the attributes of relational schemas in the questions. \u003c/p>\n\u003cp>(1) \u003cspan class=\"math\">R=(A,B,C,D)\u003c/span>      \u003cspan class=\"math\">F={A → B, A → C, C → D}\u003c/span> \u003c/p>\n\u003cp>(2) \u003cspan class=\"math\">R=(A,B,C,D)\u003c/span>      \u003cspan class=\"math\">F={A → C, B → D}\u003c/span> \u003c/p>\n\u003cp>(3) \u003cspan class=\"math\">R=(A,B,C,D)\u003c/span>      \u003cspan class=\"math\">F={A → B, B → C, C → A, C → D}\u003c/span> \u003c/p>\n\u003cp>(4) \u003cspan class=\"math\">R=(A,B,C,D)\u003c/span>      \u003cspan class=\"math\">F={AB → C, AB → D, C → B}\u003c/span>\u003c/p>\n","translationHTML":"\u003cp>考虑给定的relational schemas以及其中成立的Functional Dependencies。已知每个schema都满足1NF。\u003c/p>\n\u003cp>对每个schema，确定成立的最高Normal Form，并证明理由。证明必须包括：从FD推导全部minimal keys；根据schema、keys与FD，逐一检查2NF、3NF及BCNF。\u003c/p>\n\u003cp>只猜对最高范式、却不给完整证明，不满足原题要求。不得修改题目的attributes。\u003c/p>\n\u003cp>(1) R=(A,B,C,D)，F={A→B, A→C, C→D}。\u003c/p>\n\u003cp>(2) R=(A,B,C,D)，F={A→C, B→D}。\u003c/p>\n\u003cp>(3) R=(A,B,C,D)，F={A→B, B→C, C→A, C→D}。\u003c/p>\n\u003cp>(4) R=(A,B,C,D)，F={AB→C, AB→D, C→B}。\u003c/p>\n"},{"id":"S01","title":"Conceptual modelling: workshops","topic":"根据培训业务绘制概念图","areas":["Conceptual"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practic l":"独立推导参考答案；不是教师官方评分表"},"knowledge":["entity","identifier","multiplicity","association"],"types":["conceptual"],"requiredSkills":["Class / attribute / 对象类别与属性","Identifier / 唯一标识","Multiplicity / 关联两端的数量范围","Many-to-many / association attribute / 多对多与关联属性"],"questionHTML":"\u003cp>An organisation runs workshops. Each workshop has a unique workshop number, a title, and a set of learning objectives. A trainer has a unique trainer number and a name. A trainer may teach many workshops. Every workshop has at least one trainer. Each trainer–workshop assignment has its own topic. A participant has a unique participant number, a name, and an optional email address. Participants may enrol in many workshops, and a workshop may have no participants yet. Each enrolment records an enrolment date and a status. For each workshop, the total number of enrolments can be derived from the enrolment records.\u003c/p>\n\u003cp>Draw a simplified UML conceptual schema. Show identifiers, multiplicities, multivalued attributes, optional attributes, derived attributes, and attributes of associations. Do not invent additional identifiers.\u003c/p>\n","translationHTML":"\u003cp>辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。\u003c/p>\n","answerHTML":"\u003cp>三个类为WORKSHOP、TRAINER、PARTICIPANT。分别用题目给出的编号识别，记录各自的属性。学习目标是工作坊的multivalued attribute，邮箱是参与者的optional attribute，报名总数可由报名记录计算得到，标为derived attribute。\u003c/p>\n\u003cp>培训主题topic属于“某位培训师教授某个工作坊”的一次分配，不是培训师不随工作坊变化的永久属性。报名日期和状态同样属于参与者与工作坊之间的报名关联。\u003c/p>\n\u003cp>本参考图按同一参与者与同一工作坊之间只记录一次报名理解。若需要重复报名历史，还要明确如何区分多次事件，不能直接认为原关联已经表达全部历史。\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>类\u003c/th>\n\u003cth>属性\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>WORKSHOP\u003c/td>\n\u003ctd>workshopNo [ID]、title、learningObjectives [1..*]、/totalEnrolments\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TRAINER\u003c/td>\n\u003ctd>trainerNo [ID]、name\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PARTICIPANT\u003c an original examination question","origin":"Supplementary practice","priority":"C","question":"A hospital has a unique name. A building number is unique only within its hospital. A ward has a globally unique name and belongs to one building. A deck number is unique only within its ward. An employee number is unique only within a hospital. A patient is identified by the combination of insurance company name and policy number. A patient may be admitted to the same hospital many times. Each admission has a date and a time. Assume that one patient cannot have two admissions at the same hospital at exactly the same date and time.\n\n(1) List complete identifiers for BUILDING, WARD, DECK, EMPLOYEE, PATIENT and ADMISSION.\n(2) Can building number 1 occur in two hospitals? Can deck number 2 occur in two wards?\n(3) Explain why using only PATIENT's identifier for ADMISSION would lose information. Do not add artificial IDs.","context":"","canonical":null,"parts":[{"number":"1","goal":"写完整identifier","steps":["先区分全局唯一的wardName与局部唯一的楼号、分区号、员工号。","局部号码加所属对象identifier；PATIENT加保险公司与保单号。","ADMISSION再加入医院及入院date/time，使用题目已声明的同刻不重复条件。"],"check":"DECK只需wardName加deckNo，因为wardName已全局唯一。","pitfall":"无必要地把所有祖先名称都加进identifier会丢失最小性。","mainType":"conceptual","knowledge":["entity","identifier","multiplicity","association"],"taskBrief":"把业务说明中的对象、属性、唯一性和数量画成完整概念图。","input":"英文题面和给定图／FD","output":"写完整identifier","examTips":["DECK只需wardName加deckNo，因为wardName已全局唯一。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["无必要地把所有祖先名称都加进identifier会丢失最小性。"],"tables":[],"knowledgeUses":{"entity":"DECK只需wardName加deckNo，因为wardName已全局唯一。","identifier":"DECK只需wardName加deckNo，因为wardName已全局唯一。","multiplicity":"DECK只需wardName加deckNo，因为wardName已全局唯一。","association":"DECK只需wardName加deckNo，因为wardName已全局唯一。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先找需要单独记录的对象类别，再把属性放回所属类别。","圈出唯一性与局部号码；是否允许新增属性要看原题，不能自行发明标识。","每条关联向两个方向读数量；检查泛化箭头是否指向父类。"],"referenceHTML":"\u003cp>(1) 完整identifier如下。括号内各项需要合起来使 TML":"\u003cp>(1) 完整identifier如下。括号内各项需要合起来使用。\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对象\u003c/th>\n\u003cth>完整identifier\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>BUILDING\u003c/td>\n\u003ctd>医院名称+建筑编号\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>WARD\u003c/td>\n\u003ctd>病区名称，因为本题已声明全局唯一\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DECK\u003c/td>\n\u003ctd>病区名称+分区编号\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EMPLOYEE\u003c/td>\n\u003ctd>医院名称+员工号\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PATIENT\u003c/td>\n\u003ctd>保险公司名称+保险单号\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADMISSION\u003c/td>\n\u003ctd>保险公司名称+保险单号+医院名称+入院日期+入院时间\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>(2) 两种情况都允许。号码只在各自所属医院或病区的范围内唯一，跨所属范围可以相同。\u003c/p>\n\u003cp>(3) 病人identifier只区分“是谁”，不能区分同一人“哪一次入院”。日期、时间和医院一起区分多次入院；它们的组合唯一性依赖本补充题已经给出的不同时重复入院假设。\u003c/p>\n"},{"id":"S03","title":"Qualified associations and association attributes","topic":"限定关联和带属性关联的逻辑设计","areas":["Logical"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"C","question":"The conceptual schema has these features:\n\n- HOTEL has code [ID] and name.\n- ROOM is identified by its HOTEL and roomNo; roomNo is unique only within a HOTEL. ROOM also has pricePerNight.\n- GUEST has passportNo [ID] and email [ID2]. Both are mandatory.\n- GUEST and ROOM have a many-to-many association. The association records checkIn and checkOut. Assume that there is at most one recorded stay for each GUEST–ROOM pair.\n- HOTEL has a multivalued attribute amenity [*].\n\nTransform the schema into relational schemas. List attributes, PK, other CK and all FKs, with parents before children. Then state what changes if repeat stays for the same guest and room must be recorded and checkIn is unique for that pair.","context":"","canonical":null,"parts":[{"number":"1","goal":"转换qualified association、多值与住宿配对","steps":["ROOM需hotelCode与roomNo共同识别。","STAY保存passportNo与ROOM完整键，以及关联属性checkIn/checkOut。","第一版每配对最多一次住宿，配对本身作primary key；amenity逐项拆表。"],"check":"email是另一个必填唯一identifier，保留candidate key。","pitfall":"不能只用roomNo引用所有酒店的房间。","mainType":"logical","knowledge":["keys","qualifier","association","superset"],"taskBrief":"把图中每一种特征转换成关系模式，并完整列出键和引用。","input":"英文题面和给定图／FD","output":"转换qualified association、多值与住宿配对","examTips":["email是另一个必填唯一identifier，保留candidate key。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不能只用roomNo引用所有酒店的房间。"],"tables":[],"knowledgeUses":{"keys":"email是另一个必填唯一identifier，保留candidate key。","qualifier":"email是另一个必填唯一identifier，保留candidate key。","association":"email是另一个必填唯一identifier，保留candidate key。","superset":"email是另一个必填唯一identifier，保留candidate key。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先写不依赖其他schema的父关系及其完整标识。","分别处理多对多、多值、qualifier与关联属性；引用复合标识不能漏列。","按题目要求使用superset，最后检查父表先于子表及全部键。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-text\">HOTEL(code, name)\nPRIMARY KEY = (code)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n\nGUEST(passportNo, email)\nPRIMARY KEY = (passportNo)\nCANDIDATE KEY1 = (email)\nFOREIGN KEYS = none\n\nROOM(hotelCode, roomNo, pricePerNight)\nPRIMARY KEY = (hotelCode, roomNo)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (hotelCode) REFERENCES HOTEL(code)\n\nHOTEL_AMENITY(hotelCode, amenity)\nPRIMARY KEY = (hotelCode, amenity)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (hotelCode) REFERENCES HOTEL(code)\n\nSTAY(passportNo, hotelCode, roomNo, checkIn, checkOut)\nPRIMARY KEY = (passportNo, hotelCode, roomNo)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (passportNo) REFERENCES GUEST(passportNo)\nFOREIGN KEY2 = (hotelCode, roomNo) REFERENCES ROOM(hotelCode, roomNo)\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"允许重复住宿后调整key","steps":["同一住客同一房间已有键值会重复，所以旧配对key不足。","题目明确同配对checkIn唯一，把checkIn加入STAY key。","checkOut仍是普通attribute；其他foreign keys保持完整。"],"check":"同人同房间不同checkIn可保存多次。","pitfall":"没有唯一性保证就随意选日期作key，也会出错。","mainType":"logical","knowledge":["keys","qualifier","association","superset"],"taskBrief":"把图中每一种特征转换成关系模式，并完整列出键和引用。","input":"英文题面和给定图／FD","output":"允许重复住宿后调整key","examTips":["同人同房间不同checkIn可保存多次。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["没有唯一性保证就随意选日期作key，也会出错。"],"tables":[],"knowledgeUses":{"keys":"同人同房间不同checkIn可保存多次。","qualifier":"同人同房间不同checkIn可保存多次。","association":"同人同房间不同checkIn可保存多次。","superset":"同人同房间不同checkIn可保存多次。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先写不依赖其他schema的父关系及其完整标识。","分别处理多对多、多值、qualifier与关联属性；引用复合标识不能漏列。","按题目要求使用superset，最后检查父表先于子表及全部键。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-text\">HOTEL(code, name)\nPRIMARY KEY = (code)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n\nGUEST(passportNo, email)\nPRIMARY KEY = (passportNo)\nCANDIDATE KEY1 = (email)\nFOREIGN KEYS = none\n\nROOM(hotelCode, roomNo, pricePerNight)\nPRIMARY KEY = (hotelCode, roomNo)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (hotelCode) REFERENCES HOTEL(code)\n\nHOTEL_AMENITY(hotelCode, amenity)\nPRIMARY KEY = (hotelCode, amenity)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (hotelCode) REFERENCES HOTEL(code)\n\nSTAY(passportNo, hotelCode, roomNo, checkIn, checkOut)\nPRIMARY KEY = (passportNo, hotelCode, roomNo)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (passportNo) REFERENCES GUEST(passportNo)\nFOREIGN KEY2 = (hotelCode, roomNo) REFERENCES ROOM(hotelCode, roomNo)\n\u003c/code>\u003c/pre>\n"}],"tags":["Association attributes and repeated events","Local identifiers and qualifiers","Multivalued attribute transformation"],"legacyPriority":"core","level":"C","archived":false,"originType":"Supplementary Practice","mainType":"logical","related":[],"examRelevance":"按需参考；不进入主要练习","coverageStatus":"reference","questionZh":"辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["keys","qualifier","association","superset"],"types":["logical"],"requiredSkills":["Primary / candidate / foreign key / 主键、候选键与外键","Qualified association / 用局部值限定的关联","Many-to-many / association attribute / 多对多与关联属性","Superset method / 超集法实现泛化"],"questionHTML":"\u003cp>The conceptual schema has these features:\u003c/p>\n\u003cul>\n\u003cli>HOTEL has code [ID] and name.\u003c/li>\n\u003cli>ROOM is identified by its HOTEL and roomNo; roomNo is unique only within a HOTEL. ROOM also has pricePerNight.\u003c/li>\n\u003cli>GUEST has passportNo [ID] and email [ID2]. Both are mandatory.\u003c/li>\n\u003cli>GUEST and ROOM have a many-to-many association. The association records checkIn and checkOut. Assume that there is at most one recorded stay for each GUEST–ROOM pair.\u003c/li>\n\u003cli>HOTEL has a multivalued attribute amenity [*].\u003c/li>\n\u003c/ul>\n\u003cp>Transform the schema into relational schemas. List attributes, PK, other CK and all FKs, with parents before children. Then state what changes if repeat stays for the same guest and room must be recorded and checkIn is unique for that pair.\u003c/p>\n","translationHTML":"\u003cp>辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。\u003c/p>\n","answerHTML":"\u003cp>ROOM的完整primary key是酒店编号与房号的组合。STAY记录住客与房间的配对，并保存入住、退房日期。按第一版需求，一个配对最多一条住宿记录，所以配对本身可以作primary key。\u003c/p>\n\u003cp>如果允许重复住宿，再把checkIn加入STAY的primary key。这个改变成立的依据是新需求明确保证同一配对中checkIn唯一，不是随意增加一个属性。\u003c/p>\n\u003cp>设施多值可直接用HOTEL_AMENITY逐项记录。若采用课程中的目录类做法，也可先建AMENITY，再让关联表引用它。两种写法都要避免将多个设施塞进一个单值列。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">HOTEL(code, name)\nPRIMARY KEY = (code)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEYS = none\n\nGUEST(passportNo, email)\nPRIMARY KEY = (passportNo)\nCANDIDATE KEY1 = (email)\nFOREIGN KEYS = none\n\nROOM(hotelCode, roomNo, pricePerNight)\nPRIMARY KEY = (hotelCode, roomNo)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (hotelCode) REFERENCES HOTEL(code)\n\nHOTEL_AMENITY(hotelCode, amenity)\nPRIMARY KEY = (hotelCode, amenity)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (hotelCode) REFERENCES HOTEL(code)\n\nSTAY(passportNo, hotelCode, roomNo, checkIn, checkOut)\nPRIMARY KEY = (passportNo, hotelCode, roomNo)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (passportNo) REFERENCES GUEST(passportNo)\nFOREIGN KEY2 = (hotelCode, roomNo) REFERENCES ROOM(hotelCode, roomNo)\n\u003c/code>\u003c/pre>\n"},{"id":"S04","title":"The superset method and subtype identifiers","topic":"超集法与子类的唯一标识","areas":["Logical"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"C","question":"EMPLOYEE is identified by employeeNo and has name. Each employee is exactly one of DRIVER and SUPPORT. DRIVER has a mandatory licenceNo that is unique among all drivers. SUPPORT has a multivalued qualification [1..*].\n\n(1) Implement the generalization with the superset method. List attributes, PK, other CK or conditional unique constraints, and FKs.\n(2) Identify nullable subtype columns and give a CHECK condition for the employee type and licenceNo.\n(3) Can a single ordinary FK guarantee that only SUPPORT employees have qualification rows, and that every SUPPORT employee has at least one such row? Explain briefly.","context":"","canonical":null,"parts":[{"number":"1","goal":"写superset后的schema","steps":["父类和两个子类合成EMPLOYEE，增加employeeType。","licenceNo移入合表，SUPPORT行用NULL；非空值仍唯一。","qualifications逐项放在SUPPORT_QUALIFICATION，组合key防重复。"],"check":"employeeNo识别所有行；licenceNo仅是司机子集的唯一标识。","pitfall":"可空唯一字段不能在严格理论中识别全表所有行。","mainType":"logical","knowledge":["keys","qualifier","association","superset"],"taskBrief":"把图中每一种特征转换成关系模式，并完整列出键和引用。","input":"英文题面和给定图／FD","output":"写superset后的schema","examTips":["employeeNo识别所有行；licenceNo仅是司机子集的唯一标识。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["可空唯一字段不能在严格理论中识别全表所有行。"],"tables":[],"knowledgeUses":{"keys":"employeeNo识别所有行；licenceNo仅是司机子集的唯一标识。","qualifier":"employeeNo识别所有行；licenceNo仅是司机子集的唯一标识。","association":"employeeNo识别所有行；licenceNo仅是司机子集的唯一标识。","superset":"employeeNo识别所有行；licenceNo仅是司机子集的唯一标识。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先写不依赖其他schema的父关系及其完整标识。","分别处理多对多、多值、qualifier与关联属性；引用复合标识不能漏列。","按题目要求使用superset，最后检查父表先于子表及全部键。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-text\">EMPLOYEE(employeeNo, name, employeeType, licenceNo)\nPRIMARY KEY = (employeeNo)\nOTHER CANDIDATE KEYS = none for all rows\nCONDITIONAL UNIQUE = non-NULL licenceNo must be unique\nFOREIGN KEYS = none\n\nSUPPORT_QUALIFICATION(employeeNo, qualification)\nPRIMARY KEY = (employeeNo, qualification)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (employeeNo) REFERENCES EMPLOYEE(employeeNo)\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-sql\">CHECK ((employeeType = &#39;DRIVER&#39; AND licenceNo IS NOT NULL)\n    OR (employeeType = &#39;SUPPORT&#39; AND licenceNo IS NULL))\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"用CHECK限制类型和专有列","steps":["employeeType本身NOT NULL，避免UNKNOWN绕过类型条件。","DRIVER要求licenceNo IS NOT NULL；SUPPORT要求其IS NULL。","再加UNIQUE(licenceNo)，CHECK不会代替唯一性。"],"check":"两种类型各自的空值规则与唯一规则都成立。","pitfall":"仅把licenceNo列设NOT NULL会连支持人员一起排除。","mainType":"logical","knowledge":["keys","qualifier","association","superset"],"taskBrief":"把图中每一种特征转换成关系模式，并完整列出键和引用。","input":"英文题面和给定图／FD","output":"用CHECK限制类型和专有列","examTips":["两种类型各自的空值规则与唯一规则都成立。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["仅把licenceNo列设NOT NULL会连支持人员一起排除。"],"tables":[],"knowledgeUses":{"keys":"两种类型各自的空值规则与唯一规则都成立。","qualifier":"两种类型各自的空值规则与唯一规则都成立。","association":"两种类型各自的空值规则与唯一规则都成立。","superset":"两种类型各自的空值规则与唯一规则都成立。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先写不依赖其他schema的父关系及其完整标识。","分别处理多对多、多值、qualifier与关联属性；引用复合标识不能漏列。","按题目要求使用superset，最后检查父表先于子表及全部键。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-text\">EMPLOYEE(employeeNo, name, employeeType, licenceNo)\nPRIMARY KEY = (employeeNo)\nOTHER CANDIDATE KEYS = none for all rows\nCONDITIONAL UNIQUE = non-NULL licenceNo must be unique\nFOREIGN KEYS = none\n\nSUPPORT_QUALIFICATION(employeeNo, qualification)\nPRIMARY KEY = (employeeNo, qualification)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (employeeNo) REFERENCES EMPLOYEE(employeeNo)\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-sql\">CHECK ((employeeType = &#39;DRIVER&#39; AND licenceNo IS NOT NULL)\n    OR (employeeType = &#39;SUPPORT&#39; AND licenceNo IS NULL))\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"判断普通foreign key的表达边界","steps":["foreign key只检查employeeNo在EMPLOYEE中存在。","它不检查所引用行的employeeType是否SUPPORT。","它也不能要求每个SUPPORT父行至少有一子资格行。"],"check":"两条额外业务规则都说明需另外维护。","pitfall":"不能把“有FK”当作已实现全部multiplicity上下限。","mainType":"logical","knowledge":["keys","qualifier","association","superset"],"taskBrief":"把图中每一种特征转换成关系模式，并完整列出键和引用。","input":"英文题面和给定图／FD","output":"判断普通foreign key的表达边界","examTips":["两条额外业务规则都说明需另外维护。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不能把“有FK”当作已实现全部multiplicity上下限。"],"tables":[],"knowledgeUses":{"keys":"两条额外业务规则都说明需另外维护。","qualifier":"两条额外业务规则都说明需另外维护。","association":"两条额外业务规则都说明需另外维护。","superset":"两条额外业务规则都说明需另外维护。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先写不依赖其他schema的父关系及其完整标识。","分别处理多对多、多值、qualifier与关联属性；引用复合标识不能漏列。","按题目要求使用superset，最后检查父表先于子表及全部键。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-text\">EMPLOYEE(employeeNo, name, employeeType, licenceNo)\nPRIMARY KEY = (employeeNo)\nOTHER CANDIDATE KEYS = none for all rows\nCONDITIONAL UNIQUE = non-NULL licenceNo must be unique\nFOREIGN KEYS = none\n\nSUPPORT_QUALIFICATION(employeeNo, qualification)\nPRIMARY KEY = (employeeNo, qualification)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (employeeNo) REFERENCES EMPLOYEE(employeeNo)\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-sql\">CHECK ((employeeType = &#39;DRIVER&#39; AND licenceNo IS NOT NULL)\n    OR (employeeType = &#39;SUPPORT&#39; AND licenceNo IS NULL))\n\u003c/code>\u003c/pre>\n"}],"tags":["Generalization and subtype properties","One-to-one merge and nullable identifiers","Superset method"],"legacyPriority":"core","level":"C","archived":false,"originType":"Supplementary Practice","mainType":"logical","related":[],"examRelevance":"按需参考；不进入主要练习","coverageStatus":"reference","questionZh":"辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["keys","qualifier","association","superset"],"types":["logical"],"requiredSkills":["Primary / candidate / foreign key / 主键、候选键与外键","Qualified association / 用局部值限定的关联","Many-to-many / association attribute / 多对多与关联属性","Superset method / 超集法实现泛化"],"questionHTML":"\u003cp>EMPLOYEE is identified by employeeNo and has name. Each employee is exactly one of DRIVER and SUPPORT. DRIVER has a mandatory licenceNo that is unique among all drivers. SUPPORT has a multivalued qualification [1..*].\u003c/p>\n\u003cp>(1) Implement the generalization with the superset method. List attributes, PK, other CK or conditional unique constraints, and FKs.\n(2) Identify nullable subtype columns and give a CHECK condition for the employee type and licenceNo.\n(3) Can a single ordinary FK guarantee that only SUPPORT employees have qualification rows, and that every SUPPORT employee has at least one such row? Explain briefly.\u003c/p>\n","translationHTML":"\u003cp>辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。\u003c/p>\n","answerHTML":"\u003ch3>(1) 超集表和资格明细表\u003c/h3>\n\u003cp>EMPLOYEE保存所有员工，并用employeeType区分类型。licenceNo对司机必填，对支持人员为空。支持人员的多项资格单独存表。非空licenceNo须唯一，但它不能识别整表中没有驾照号的支持人员行。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">EMPLOYEE(employeeNo, name, employeeType, licenceNo)\nPRIMARY KEY = (employeeNo)\nOTHER CANDIDATE KEYS = none for all rows\nCONDITIONAL UNIQUE = non-NULL licenceNo must be unique\nFOREIGN KEYS = none\n\nSUPPORT_QUALIFICATION(employeeNo, qualification)\nPRIMARY KEY = (employeeNo, qualification)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (employeeNo) REFERENCES EMPLOYEE(employeeNo)\n\u003c/code>\u003c/pre>\n\u003ch3>(2) 检查类别与驾照号是否相符\u003c/h3>\n\u003cp>员工类型列本身设为NOT NULL，再用此CHECK规定DRIVER必须有驾照号、SUPPORT必须没有驾照号。另外为licenceNo定义UNIQUE。\u003c/p>\n\u003cp>(3) 普通foreign key只能保证资格明细所引用的员工存在，不能单独保证这位员工属于SUPPORT，也不能保证每位支持人员至少已有一条资格。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">CHECK ((employeeType = &#39;DRIVER&#39; AND licenceNo IS NOT NULL)\n    OR (employeeType = &#39;SUPPORT&#39; AND licenceNo IS NULL))\n\u003c/code>\u003c/pre>\n"},{"id":"S05","title":"Attribute closure and all minimal keys","topic":"计算属性闭包并求全部最小键","areas":["Normalization"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"C","question":"Let $R=(A,B,C,D,E)$ and $F=\\{A\\to B, B\\to C, C\\to A, CD\\to E\\}$.\n\n(1) Compute $A^+$, $D^+$, and $(AD)^+$, showing the steps.\n(2) Derive all minimal keys. Prove that each is minimal and explain why no keys are missing.\n(3) Does $F$ imply $AD\\to E$? Does it imply $A\\to E$? Justify using closure or dependency rules.","context":"","canonical":null,"parts":[{"number":"1","goal":"逐步计算三个closures","steps":["A出发用A→B、B→C得到ABC；没有D，不能应用CD→E。","D没有能直接应用的FD，所以D⁺=D。","AD出发取得B/C，再由CD→E取得E，所以AD⁺=ABCDE。"],"check":"每次新增attribute都能对应一条当前左侧已满足的FD。","pitfall":"看到CD→E时必须同时已有C和D。","mainType":"normalization","knowledge":["fd","closure","candidate","prime","partial","third","bcnf"],"taskBrief":"根据给定FD推导全部最小键，并逐项证明最高范式。","input":"英文题面和给定图／FD","output":"逐步计算三个closures","examTips":["每次新增attribute都能对应一条当前左侧已满足的FD。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["看到CD→E时必须同时已有C和D。"],"tables":[],"knowledgeUses":{"fd":"每次新增attribute都能对应一条当前左侧已满足的FD。","closure":"每次新增attribute都能对应一条当前左侧已满足的FD。","candidate":"每次新增attribute都能对应一条当前左侧已满足的FD。","prime":"每次新增attribute都能对应一条当前左侧已满足的FD。","partial":"每次新增attribute都能对应一条当前左侧已满足的FD。","third":"每次新增attribute都能对应一条当前左侧已满足的FD。","bcnf":"每次新增attribute都能对应一条当前左侧已满足的FD。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003ch3>(1) 三个attribute closure\u003c/h3>\n\u003cp>从A出发，先由\u003cspan class=\"math\">A\to B\u003c/span>得到B，再由\u003cspan class=\"math\">B\to C\u003c/span>得到C。集合中没有D，不能使用\u003cspan class=\"math\">CD\to E\u003c/span>。所以\u003cspan class=\"math\">A\u003csup>+\u003c/sup>={A,B,C}\u003c/span>。\u003c/p>\n\u003cp>从D出发，没有可用的functional dependency增加新属性，所以\u003cspan class=\"math\">D\u003csup>+\u003c/sup>={D}\u003c/span>。\u003c/p>\n\u003cp>从AD出发，先由A取得B、C，再由C和已有D一起取得E：\u003cspan class=\"math\">(AD)\u003csup>+\u003c/sup>={A,B,C,D,E}\u003c/span>。\u003c/p>\n\u003ch3>(2) 全部minimal key\u003c/h3>\n\u003cp>D没有出现在给定依赖的右侧，任何键都必须包含D。只用D或DE不能得到A、B、C；还需要从A、B、C中至少取一个。A、B、C能互相推出，因此AD、BD、CD都能取得全部属性。\u003c/p>\n\u003cp>这三组都不能再删属性：删D就无法得到D；删另一个属性就只剩D。因此全部minimal key是\u003cspan class=\"math\">{A,D}\u003c/span>、\u003cspan class=\"math\">{B,D}\u003c/span>、\u003cspan class=\"math\">{C,D}\u003c/span>。\u003c/p>\n\u003ch3>(3) 两条待判断的依赖\u003c/h3>\n\u003cp>\u003cspan class=\"math\">AD\to E\u003c/span>成立，因为E属于\u003cspan class=\"math\">(AD)\u003csup>+\u003c/sup>\u003c/span>。\u003cspan class=\"math\">A\to E\u003c/span>不成立，因为E不属于\u003cspan class=\"math\">A\u003csup>+\u003c/sup>\u003c/span>。从AD能决定E，不能直接删掉D后声称A仍能决定E。\u003c/p>\n"},{"number":"2","goal":"求全部minimal keys","steps":["D不在任何右侧，因此每个key必须含D。","还需从能互相推出的A/B/C至少取一个；DE不够。","验证AD、BD、CD各自closure全集，删掉任何一项都不够。"],"check":"全部keys恰为AD、BD、CD，没有把superkey当minimal key。","pitfall":"只找到AD就停止会遗漏另外两个。","mainType":"normalization","knowledge":["fd","closure","candidate","prime","partial","third","bcnf"],"taskBrief":"根据给定FD推导全部最小键，并逐项证明最高范式。","input":"英文题面和给定图／FD","output":"求全部minimal keys","examTips":["全部keys恰为AD、BD、CD，没有把superkey当minimal key。","按原题指定的实现形式作
