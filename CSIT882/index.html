侧能决定就推出更小左侧也能决定。","mainType":"normalization","knowledge":["fd","closure","candidate","prime","partial","third","bcnf"],"taskBrief":"根据给定FD推导全部最小键，并逐项证明最高范式。","input":"英文题面和给定图／FD","output":"用closure检验两条待推依赖","examTips":["结论同时有成立证据和不成立证据。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不能从更大左侧能决定就推出更小左侧也能决定。"],"tables":[],"knowledgeUses":{"fd":"结论同时有成立证据和不成立证据。","closure":"结论同时有成立证据和不成立证据。","candidate":"结论同时有成立证据和不成立证据。","prime":"结论同时有成立证据和不成立证据。","partial":"结论同时有成立证据和不成立证据。","third":"结论同时有成立证据和不成立证据。","bcnf":"结论同时有成立证据和不成立证据。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003ch3>(1) 三个attribute closure\u003c/h3>\n\u003cp>从A出发，先由\u003cspan class=\"math\">A\to B\u003c/span>得到B，再由\u003cspan class=\"math\">B\to C\u003c/span>得到C。集合中没有D，不能使用\u003cspan class=\"math\">CD\to E\u003c/span>。所以\u003cspan class=\"math\">A\u003csup>+\u003c/sup>={A,B,C}\u003c/span>。\u003c/p>\n\u003cp>从D出发，没有可用的functional dependency增加新属性，所以\u003cspan class=\"math\">D\u003csup>+\u003c/sup>={D}\u003c/span>。\u003c/p>\n\u003cp>从AD出发，先由A取得B、C，再由C和已有D一起取得E：\u003cspan class=\"math\">(AD)\u003csup>+\u003c/sup>={A,B,C,D,E}\u003c/span>。\u003c/p>\n\u003ch3>(2) 全部minimal key\u003c/h3>\n\u003cp>D没有出现在给定依赖的右侧，任何键都必须包含D。只用D或DE不能得到A、B、C；还需要从A、B、C中至少取一个。A、B、C能互相推出，因此AD、BD、CD都能取得全部属性。\u003c/p>\n\u003cp>这三组都不能再删属性：删D就无法得到D；删另一个属性就只剩D。因此全部minimal key是\u003cspan class=\"math\">{A,D}\u003c/span>、\u003cspan class=\"math\">{B,D}\u003c/span>、\u003cspan class=\"math\">{C,D}\u003c/span>。\u003c/p>\n\u003ch3>(3) 两条待判断的依赖\u003c/h3>\n\u003cp>\u003cspan class=\"math\">AD\to E\u003c/span>成立，因为E属于\u003cspan class=\"math\">(AD)\u003csup>+\u003c/sup>\u003c/span>。\u003cspan class=\"math\">A\to E\u003c/span>不成立，因为E不属于\u003cspan class=\"math\">A\u003csup>+\u003c/sup>\u003c/span>。从AD能决定E，不能直接删掉D后声称A仍能决定E。\u003c/p>\n"}],"tags":["Functional dependencies and attribute closure"],"legacyPriority":"core","level":"C","archived":false,"originType":"Supplementary Practice","mainType":"normalization","related":[],"examRelevance":"按需参考；不进入主要练习","coverageStatus":"reference","questionZh":"辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["fd","closure","candidate","prime","partial","third","bcnf"],"types":["normalization"],"requiredSkills":["Functional dependency / 函数依赖","Attribute closure X⁺ / 属性闭包","Superkey / candidate key / 超键与候选键","Prime / non-prime attribute / 主属性与非主属性","Partial dependency / 2NF / 部分依赖与第二范式","Transitive dependency / 3NF / 传递依赖与第三范式","BCNF / Boyce–Codd范式"],"questionHTML":"\u003cp>Let \u003cspan class=\"math\">R=(A,B,C,D,E)\u003c/span> and \u003cspan class=\"math\">F={A→ B, B→ C, C→ A, CD→ E}\u003c/span>.\u003c/p>\n\u003cp>(1) Compute \u003cspan class=\"math\">A\u003csup>+\u003c/sup>\u003c/span>, \u003cspan class=\"math\">D\u003csup>+\u003c/sup>\u003c/span>, and \u003cspan class=\"math\">(AD)\u003csup>+\u003c/sup>\u003c/span>, showing the steps.\n(2) Derive all minimal keys. Prove that each is minimal and explain why no keys are missing.\n(3) Does \u003cspan class=\"math\">F\u003c/span> imply \u003cspan class=\"math\">AD→ E\u003c/span>? Does it imply \u003cspan class=\"math\">A→ E\u003c/span>? Justify using closure or dependency rules.\u003c/p>\n","translationHTML":"\u003cp>辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。\u003c/p>\n","answerHTML":"\u003ch3>(1) 三个attribute closure\u003c/h3>\n\u003cp>从A出发，先由\u003cspan class=\"math\">A\to B\u003c/span>得到B，再由\u003cspan class=\"math\">B\to C\u003c/span>得到C。集合中没有D，不能使用\u003cspan class=\"math\">CD\to E\u003c/span>。所以\u003cspan class=\"math\">A\u003csup>+\u003c/sup>={A,B,C}\u003c/span>。\u003c/p>\n\u003cp>从D出发，没有可用的functional dependency增加新属性，所以\u003cspan class=\"math\">D\u003csup>+\u003c/sup>={D}\u003c/span>。\u003c/p>\n\u003cp>从AD出发，先由A取得B、C，再由C和已有D一起取得E：\u003cspan class=\"math\">(AD)\u003csup>+\u003c/sup>={A,B,C,D,E}\u003c/span>。\u003c/p>\n\u003ch3>(2) 全部minimal key\u003c/h3>\n\u003cp>D没有出现在给定依赖的右侧，任何键都必须包含D。只用D或DE不能得到A、B、C；还需要从A、B、C中至少取一个。A、B、C能互相推出，因此AD、BD、CD都能取得全部属性。\u003c/p>\n\u003cp>这三组都不能再删属性：删D就无法得到D；删另一个属性就只剩D。因此全部minimal key是\u003cspan class=\"math\">{A,D}\u003c/span>、\u003cspan class=\"math\">{B,D}\u003c/span>、\u003cspan class=\"math\">{C,D}\u003c/span>。\u003c/p>\n\u003ch3>(3) 两条待判断的依赖\u003c/h3>\n\u003cp>\u003cspan class=\"math\">AD\to E\u003c/span>成立，因为E属于\u003cspan class=\"math\">(AD)\u003csup>+\u003c/sup>\u003c/span>。\u003cspan class=\"math\">A\to E\u003c/span>不成立，因为E不属于\u003cspan class=\"math\">A\u003csup>+\u003c/sup>\u003c/span>。从AD能决定E，不能直接删掉D后声称A仍能决定E。\u003c/p>\n"},{"id":"S06","title":"Converting a repeating group to 1NF","topic":"将含爱好列表的设计改为第一范式","areas":["Normalization"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question Public edition: example names, contact details and password literals anonymized.","origin":"Supplementary practice","priority":"C","question":"A table stores Employee(employeeNo, name, hobbies). One row is (101, 'PARTICIPANT_07', {'reading', 'swimming'}), and another is (102, 'PARTICIPANT_02', {}). Assume employeeNo uniquely identifies an employee, and an employee may have no hobbies.\n\n(1) Identify the 1NF problem.\n(2) Produce a 1NF design with keys that preserves both employees and all recorded hobbies. Do not introduce artificial IDs.\n(3) Show the rows for the two employees. Do not invent a hobby value for PARTICIPANT_02.","context":"","canonical":null,"parts":[{"number":"1","goal":"指出repeating group","steps":["检查hobbies某个单元格保存的是多项爱好集合。","本设计把每项爱好视为独立值，集合不符合这里的atomic value。","空集合也不能通过编造一个普通字符串替代真实爱好。"],"check":"问题定位到一个字段包含多个独立值。","pitfall":"中文名字含多个字母并不因此不atomic。","mainType":"normalization","knowledge":["fd","closure","candidate","prime","partial","third","bcnf"],"taskBrief":"根据给定FD推导全部最小键，并逐项证明最高范式。","input":"英文题面和给定图／FD","output":"指出repeating group","examTips":["问题定位到一个字段包含多个独立值。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["中文名字含多个字母并不因此不atomic。"],"tables":[],"knowledgeUses":{"fd":"问题定位到一个字段包含多个独立值。","closure":"问题定位到一个字段包含多个独立值。","candidate":"问题定位到一个字段包含多个独立值。","prime":"问题定位到一个字段包含多个独立值。","partial":"问题定位到一个字段包含多个独立值。","third":"问题定位到一个字段包含多个独立值。","bcnf":"问题定位到一个字段包含多个独立值。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-text\">EMPLOYEE(employeeNo, name)\nPRIMARY KEY = (employeeNo)\n\nEMPLOYEE_HOBBY(employeeNo, hobby)\nPRIMARY KEY = (employeeNo, hobby)\nFOREIGN KEY = (employeeNo) REFERENCES EMPLOYEE(employeeNo)\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"给1NF表与完整键","steps":["员工信息留在EMPLOYEE(employeeNo,name)。","每条员工—爱好配对放EMPLOYEE_HOBBY(employeeNo,hobby)。","配对作primary key，employeeNo引用员工，不增加人工HobbyID。"],"check":"一个员工有多爱好可以多行，员工本人只记录一次。","pitfall":"只留员工—爱好表会让零爱好员工无处保存。","mainType":"normalization","knowledge":["fd","closure","candidate","prime","partial","third","bcnf"],"taskBrief":"根据给定FD推导全部最小键，并逐项证明最高范式。","input":"英文题面和给定图／FD","output":"给1NF表与完整键","examTips":["一个员工有多爱好可以多行，员工本人只记录一次。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["只留员工—爱好表会让零爱好员工无处保存。"],"tables":[],"knowledgeUses":{"fd":"一个员工有多爱好可以多行，员工本人只记录一次。","closure":"一个员工有多爱好可以多行，员工本人只记录一次。","candidate":"一个员工有多爱好可以多行，员工本人只记录一次。","prime":"一个员工有多爱好可以多行，员工本人只记录一次。","partial":"一个员工有多爱好可以多行，员工本人只记录一次。","third":"一个员工有多爱好可以多行，员工本人只记录一次。","bcnf":"一个员工有多爱好可以多行，员工本人只记录一次。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-text\">EMPLOYEE(employeeNo, name)\nPRIMARY KEY = (employeeNo)\n\nEMPLOYEE_HOBBY(employeeNo, hobby)\nPRIMARY KEY = (employeeNo, hobby)\nFOREIGN KEY = (employeeNo) REFERENCES EMPLOYEE(employeeNo)\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"写出保留全部信息的实例","steps":["EMPLOYEE中保留101/PARTICIPANT_07、102/PARTICIPANT_02两行。","EMPLOYEE_HOBBY仅两行101/reading、101/swimming。","102没有子行，而不是删除102或捏造None为一项爱好。"],"check":"员工行2条、爱好行2条。","pitfall":"把缺少爱好当成缺少员工。","mainType":"normalization","knowledge":["fd","closure","candidate","prime","partial","third","bcnf"],"taskBrief":"根据给定FD推导全部最小键，并逐项证明最高范式。","input":"英文题面和给定图／FD","output":"写出保留全部信息的实例","examTips":["员工行2条、爱好行2条。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["把缺少爱好当成缺少员工。"],"tables":[],"knowledgeUses":{"fd":"员工行2条、爱好行2条。","closure":"员工行2条、爱好行2条。","candidate":"员工行2条、爱好行2条。","prime":"员工行2条、爱好行2条。","partial":"员工行2条、爱好行2条。","third":"员工行2条、爱好行2条。","bcnf":"员工行2条、爱好行2条。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-text\">EMPLOYEE(employeeNo, name)\nPRIMARY KEY = (employeeNo)\n\nEMPLOYEE_HOBBY(employeeNo, hobby)\nPRIMARY KEY = (employeeNo, hobby)\nFOREIGN KEY = (employeeNo) REFERENCES EMPLOYEE(employeeNo)\n\u003c/code>\u003c/pre>\n"}],"tags":["Multivalued, optional and derived attributes","1NF and repeating groups"],"legacyPriority":"core","level":"C","archived":false,"originType":"Supplementary Practice","mainType":"normalization","related":[],"examRelevance":"按需参考；不进入主要练习","coverageStatus":"reference","questionZh":"辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["fd","closure","candidate","prime","partial","third","bcnf"],"types":["normalization"],"requiredSkills":["Functional dependency / 函数依赖","Attribute closure X⁺ / 属性闭包","Superkey / candidate key / 超键与候选键","Prime / non-prime attribute / 主属性与非主属性","Partial dependency / 2NF / 部分依赖与第二范式","Transitive dependency / 3NF / 传递依赖与第三范式","BCNF / Boyce–Codd范式"],"questionHTML":"\u003cp>A table stores Employee(employeeNo, name, hobbies). One row is (101, &#39;PARTICIPANT_07&#39;, {&#39;reading&#39;, &#39;swimming&#39;}), and another is (102, &#39;PARTICIPANT_02&#39;, {}). Assume employeeNo uniquely identifies an employee, and an employee may have no hobbies.\u003c/p>\n\u003cp>(1) Identify the 1NF problem.\n(2) Produce a 1NF design with keys that preserves both employees and all recorded hobbies. Do not introduce artificial IDs.\n(3) Show the rows for the two employees. Do not invent a hobby value for PARTICIPANT_02.\u003c/p>\n","translationHTML":"\u003cp>辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。\u003c/p>\n","answerHTML":"\u003cp>(1) hobbies的一个位置保存了多项独立爱好，形成重复值集合，不符合这里要求的单一atomic value。\u003c/p>\n\u003cp>(2) 员工基本信息和员工爱好分开记录，键如下。\u003c/p>\n\u003cp>(3) EMPLOYEE有两行：(101,PARTICIPANT_07)、(102,PARTICIPANT_02)。EMPLOYEE_HOBBY只有两行：(101,reading)、(101,swimming)。PARTICIPANT_02仍保存在员工表中，但没有爱好明细行，不为他编造一个“无爱好”的普通爱好值。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">EMPLOYEE(employeeNo, name)\nPRIMARY KEY = (employeeNo)\n\nEMPLOYEE_HOBBY(employeeNo, hobby)\nPRIMARY KEY = (employeeNo, hobby)\nFOREIGN KEY = (employeeNo) REFERENCES EMPLOYEE(employeeNo)\n\u003c/code>\u003c/pre>\n"},{"id":"S07","title":"Determining the highest normal form","topic":"四组函数依赖的范式判断","areas":["Normalization"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"B","question":"Each schema is in 1NF. For every case, derive all minimal keys, identify prime/non-prime attributes, test 2NF, 3NF and BCNF, and state the highest normal form with justification. Do not change the attributes.\n\n(1) $R=(P,Q,R,S)$; $F=\\{P\\to Q,Q\\to R,P\\to S\\}$.\n\n(2) $R=(P,Q,R,S)$; $F=\\{PQ\\to R,P\\to S\\}$.\n\n(3) $R=(P,Q,R,S)$; $F=\\{P\\to Q,Q\\to R,R\\to P,R\\to S\\}$.\n\n(4) $R=(P,Q,R,S)$; $F=\\{PQ\\to R,PQ\\to S,R\\to Q\\}$.","context":"","canonical":null,"parts":[{"number":"1","goal":"唯一key是{P}，最高2NF","steps":["P不在给定FD右侧，所以key必须含P；P→Q、P→R、R→S逐步得到P⁺=PQRS。","P单独足够且不能再删；prime attribute只有P，Q/R/S都是non-prime。","2NF成立；R⁺=RS不是superkey，R→S右侧S又非prime，因此3NF和BCNF失败。"],"check":"指出具体违规FD R→S，而不只说有传递依赖。","pitfall":"不能把P→R也判为3NF违规，因为P是key。","mainType":"normalization","knowledge":["fd","closure","candidate","prime","partial","third","bcnf"],"taskBrief":"根据给定FD推导全部最小键，并逐项证明最高范式。","input":"英文题面和给定图／FD","output":"全部candidate keys、prime／non-prime、逐项NF检查与最高范式证明","examTips":["指出具体违规FD R→S，而不只说有传递依赖。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不能把P→R也判为3NF违规，因为P是key。"],"tables":[],"knowledgeUses":{"fd":"R={P, Q, R, S}；F={P→Q, Q→R, P→S}。已知1NF；保持原属性不变。","closure":"候选键为{P}。按属性数从小到大检查全部子集，并剔除包含更小key的superkey。","candidate":"候选键为{P}。按属性数从小到大检查全部子集，并剔除包含更小key的superkey。","prime":"Prime={P}；Non-prime={Q, R, S}。取所有candidate keys的并集，不只取一个选定key。","partial":"成立：检查全部candidate keys的真子集，没有发现其能决定non-prime attribute的partial dependency。 真子集闭包：{}⁺={}。","third":"不成立：Q → R，左侧闭包为{Q, R}，不是superkey；右侧不是prime，因此两个3NF条件都不成立。","bcnf":"不成立：Q → R，左侧闭包为{Q, R}，不是superkey。BCNF不允许用右侧prime作为例外。"},"sqlPlan":[],"validation":"已穷举全部属性子集复核closure、所有最小candidate keys及F⁺中的范式条件。","hints":["先找不在FD右侧的属性；它们必须包含在每个key中。","计算候选组合的closure，并逐项删除检查最小性。不要只找一个key就停止。","先列全部prime attributes，再检查2NF、3NF和BCNF。3NF右侧为prime的例外不能用于BCNF。"],"referenceHTML":"\u003cp>Candidate keys: {P}.\u003c/p>\n\u003cp>P+ = {P, Q, R, S}. Every proper subset fails to determine R, so the key is minimal.\u003c/p>\n\u003cp>Prime attributes: {P}. Non-prime attributes: {Q, R, S}.\u003c/p>\n\u003cp>2NF holds: no non-prime attribute depends on a proper subset of any candidate key.\u003c/p>\n\u003cp>3NF fails: Q → R, where {Q} is not a superkey ({Q, R} != R) and R is non-prime.\u003c/p>\n\u003cp>BCNF fails: Q → R has a determinant that is not a superkey.\u003c/p>\n\u003cp>The highest normal form is 2NF.\u003c/p>\n"},{"number":"2","goal":"唯一key是{P,Q}，最高1NF","steps":["P、Q都无法从其他属性推出，每个key必须同时含P和Q。","P⁺=PR、Q⁺=QS，PQ⁺=PQRS，因此PQ是唯一minimal key。","P→R、Q→S让non-prime attributes依赖key真子集，违反2NF，也违反 ，但\u003cspan class=\"math\">C\to B\u003c/span>的右侧B是prime attribute，所以这条依赖不违反3NF。\u003c/p>\n\u003cp>(3) 没有non-prime attribute，因此不存在违反2NF的partial dependency。\u003cspan class=\"math\">AB\to C\u003c/span>的左侧是superkey，\u003cspan class=\"math\">C\to B\u003c/span>的右侧是prime attribute，所以满足3NF。C不能决定A，不是superkey；non-trivial functional dependency\u003cspan class=\"math\">C\to B\u003c/span>违反BCNF。因此最高范式是3NF。\u003c/p>\n"}],"tags":["All minimal keys and prime attributes","3NF versus BCNF with justification"],"legacyPriority":"core","level":"C","archived":false,"originType":"Supplementary Practice","mainType":"normalization","related":[],"examRelevance":"按需参考；不进入主要练习","coverageStatus":"reference","questionZh":"辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["fd","closure","candidate","prime","partial","third","bcnf"],"types":["normalization"],"requiredSkills":["Functional dependency / 函数依赖","Attribute closure X⁺ / 属性闭包","Superkey / candidate key / 超键与候选键","Prime / non-prime attribute / 主属性与非主属性","Partial dependency / 2NF / 部分依赖与第二范式","Transitive dependency / 3NF / 传递依赖与第三范式","BCNF / Boyce–Codd范式"],"questionHTML":"\u003cp>Assume \u003cspan class=\"math\">R=(A,B,C)\u003c/span> is in 1NF and \u003cspan class=\"math\">F={AB→ C,C→ B}\u003c/span>.\u003c/p>\n\u003cp>(1) Derive all minimal keys.\n(2) A student says, “C is not a superkey, so C → B violates 3NF.” Decide whether this is correct and justify your answer.\n(3) Determine the highest normal form. Test 2NF, 3NF and BCNF explicitly.\u003c/p>\n","translationHTML":"\u003cp>辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。\u003c/p>\n","answerHTML":"\u003cp>(1) A不在给定依赖的右侧，任何键都必须包含A。\u003cspan class=\"math\">(AB)\u003csup>+\u003c/sup>={A,B,C}\u003c/span>，\u003cspan class=\"math\">(AC)\u003csup>+\u003c/sup>={A,B,C}\u003c/span>，而\u003cspan class=\"math\">A\u003csup>+\u003c/sup>={A}\u003c/span>。全部minimal key是\u003cspan class=\"math\">{A,B}\u003c/span>和\u003cspan class=\"math\">{A,C}\u003c/span>。A、B、C都属于至少一个candidate key，所以都是prime attribute。\u003c/p>\n\u003cp>(2) 学生的判断不正确。对non-trivial functional dependency\u003cspan class=\"math\">X\to Y\u003c/span>，3NF允许左侧是superkey，或者右侧各属性是prime attribute。虽然C不是superkey，但\u003cspan class=\"math\">C\to B\u003c/span>的右侧B是prime attribute，所以这条依赖不违反3NF。\u003c/p>\n\u003cp>(3) 没有non-prime attribute，因此不存在违反2NF的partial dependency。\u003cspan class=\"math\">AB\to C\u003c/span>的左侧是superkey，\u003cspan class=\"math\">C\to B\u003c/span>的右侧是prime attribute，所以满足3NF。C不能决定A，不是superkey；non-trivial functional dependency\u003cspan class=\"math\">C\to B\u003c/span>违反BCNF。因此最高范式是3NF。\u003c/p>\n"},{"id":"S09","title":"Single-attribute keys and 2NF","topic":"检验单属性主键与第二范式的关系","areas":["Normalization"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"C","question":"Assume $R=(A,B,C,D)$ is in 1NF and $F=\\{A\\to B,A\\to C,BC\\to A,B\\to D\\}$.\n\n(1) Derive all minimal keys and classify prime/non-prime attributes.\n(2) A student chooses A as the primary key and claims that the schema must be in 2NF because A has only one attribute. Evaluate the claim.\n(3) Determine the highest normal form and identify a violating FD for each failed higher normal form.","context":"","canonical":null,"parts":[{"number":"1","goal":"列出单属性key A与组合key BC","steps":["A→BC，B→D，所以A⁺=ABCD。","BC→A再取得D，所以BC⁺=ABCD。","不含A时须同时取得B/C才能触发BC→A；B⁺=BD、C⁺=C都不够。"],"check":"全部keys是A、BC；D非prime。","pitfall":"存在A并不排除另一个minimal组合key。","mainType":"normalization","knowledge":["fd","closure","candidate","prime","partial","third","bcnf"],"taskBrief":"根据给定FD推导全部最小键，并逐项证明最高范式。","input":"英文题面和给定图／FD","output":"列出单属性key A与组合key BC","examTips":["全部keys是A、BC；D非prime。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["存在A并不排除另一个minimal组合key。"],"tables":[],"knowledgeUses":{"fd":"全部keys是A、BC；D非prime。","closure":"全部keys是A、BC；D非prime。","candidate":"全部keys是A、BC；D非prime。","prime":"全部keys是A、BC；D非prime。","partial":"全部keys是A、BC；D非prime。","third":"全部keys是A、BC；D非prime。","bcnf":"全部keys是A、BC；D非prime。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cp>(1) \u003cspan class=\"math\">A\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>，\u003cspan class=\"math\">(BC)\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>。\u003cspan class=\"math\">B\u003csup>+\u003c/sup>={B,D}\u003c/span>，\u003cspan class=\"math\">C\u003csup>+\u003c/sup>={C}\u003c/span>，所以B或C单独都不是键。\u003c/p>\n\u003cp>若不包含A，必须同时包含B、C才能使用\u003cspan class=\"math\">BC\to A\u003c/span>取得A。因此全部minimal key是\u003cspan class=\"math\">{A}\u003c/span>和\u003cspan class=\"math\">{B,C}\u003c/span>。prime attribute为A、B、C；non-prime attribute为D。\u003c/p>\n\u003cp>(2) 只检查选中的primary keyA不够，还要检查另一个candidate key\u003cspan class=\"math\">{B,C}\u003c/span>。\u003cspan class=\"math\">B\to D\u003c/span>说明non-prime attributeD只依赖这个candidate key中的一部分B，已经违反2NF。\u003c/p>\n\u003cp>(3) 最高范式是题目已保证的1NF。\u003cspan class=\"math\">B\to D\u003c/span>还违反3NF，因为B不是superkey、D非主；同样违反BCNF，因为左侧B不是superkey。\u003c/p>\n\u003cp>可以使用的结论是“所有candidate key都是单属性时，满足这里的2NF条件”。不能把它改成“只要选了一个单属性primary key，就一定满足2NF”。\u003c/p>\n"},{"number":"2","goal":"检验“选单属性PK就必在2NF”","steps":["2NF要考虑所有candidate keys，不只当前primary key。","对于key BC，B是其真子集。","B→D让non-prime D依赖该真子集，因此学生结论不成立。"],"check":"明确指出另一个key和具体FD。","pitfall":"把“所有keys均单属性”误换成“存在一个单属性key”。","mainType":"normalization","knowledge":["fd","closure","candidate","prime","partial","third","bcnf"],"taskBrief":"根据给定FD推导全部最小键，并逐项证明最高范式。","input":"英文题面和给定图／FD","output":"检验“选单属性PK就必在2NF”","examTips":["明确指出另一个key和具体FD。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["把“所有keys均单属性”误换成“存在一个单属性key”。"],"tables":[],"knowledgeUses":{"fd":"明确指出另一个key和具体FD。","closure":"明确指出另一个key和具体FD。","candidate":"明确指出另一个key和具体FD。","prime":"明确指出另一个key和具体FD。","p c/span> is in 1NF and \u003cspan class=\"math\">F={A→ B,A→ C,BC→ A,B→ D}\u003c/span>.\u003c/p>\n\u003cp>(1) Derive all minimal keys and classify prime/non-prime attributes.\n(2) A student chooses A as the primary key and claims that the schema must be in 2NF because A has only one attribute. Evaluate the claim.\n(3) Determine the highest normal form and identify a violating FD for each failed higher normal form.\u003c/p>\n","translationHTML":"\u003cp>辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。\u003c/p>\n","answerHTML":"\u003cp>(1) \u003cspan class=\"math\">A\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>，\u003cspan class=\"math\">(BC)\u003csup>+\u003c/sup>={A,B,C,D}\u003c/span>。\u003cspan class=\"math\">B\u003csup>+\u003c/sup>={B,D}\u003c/span>，\u003cspan class=\"math\">C\u003csup>+\u003c/sup>={C}\u003c/span>，所以B或C单独都不是键。\u003c/p>\n\u003cp>若不包含A，必须同时包含B、C才能使用\u003cspan class=\"math\">BC\to A\u003c/span>取得A。因此全部minimal key是\u003cspan class=\"math\">{A}\u003c/span>和\u003cspan class=\"math\">{B,C}\u003c/span>。prime attribute为A、B、C；non-prime attribute为D。\u003c/p>\n\u003cp>(2) 只检查选中的primary keyA不够，还要检查另一个candidate key\u003cspan class=\"math\">{B,C}\u003c/span>。\u003cspan class=\"math\">B\to D\u003c/span>说明non-prime attributeD只依赖这个candidate key中的一部分B，已经违反2NF。\u003c/p>\n\u003cp>(3) 最高范式是题目已保证的1NF。\u003cspan class=\"math\">B\to D\u003c/span>还违反3NF，因为B不是superkey、D非主；同样违反BCNF，因为左侧B不是superkey。\u003c/p>\n\u003cp>可以使用的结论是“所有candidate key都是单属性时，满足这里的2NF条件”。不能把它改成“只要选了一个单属性primary key，就一定满足2NF”。\u003c/p>\n"},{"id":"S10","title":"BCNF decomposition: losslessness and dependency preservation","topic":"分解关系并检验无损性与依赖保持","areas":["Normalization"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"C","question":"Assume $R=(A,B,C)$ is in 1NF and $F=\\{AB\\to C,C\\to B\\}$.\n\n(1) Identify a BCNF violation and decompose R into BCNF schemas using it.\n(2) List the keys and projected nontrivial FDs of the resulting schemas.\n(3) Is the decomposition lossless? Is it dependency-preserving? Justify both answers.\n\nThis is a method-extension exercise. In a question that asks only for the highest normal form, do not replace the requested original schema with a decomposition.","context":"","canonical":null,"parts":[{"number":"1","goal":"按C→B进行BCNF分解","steps":["先求C⁺=BC，确认C不能决定A。","因此非平凡C→B违反BCNF。","按它分出CB，并保留余下AC；不是随意挑两个二列表。"],"check":"两表attributes合起来仍覆盖原ABC。","pitfall":"CB和AB虽覆盖ABC，却会丢失A与C的配对。","mainType":"normalization","knowledge":["fd","closure","candidate","prime","partial","third","bcnf"],"taskBrief":"根据给定FD推导全部最小键，并逐项证明最高范式。","input":"英文题面和给定图／FD","output":"按C→B进行BCNF分解","examTips":["两表attributes合起来仍覆盖原ABC。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["CB和AB虽覆盖ABC，却会丢失A与C的配对。"],"tables":[],"knowledgeUses":{"fd":"两表attributes合起来仍覆盖原ABC。","closure":"两表attributes合起来仍覆盖原ABC。","candidate":"两表attributes合起来仍覆盖原ABC。","prime":"两表attributes合起来仍覆盖原ABC。","partial":"两表attributes合起来仍覆盖原ABC。","third":"两表attributes合起来仍覆盖原ABC。","bcnf":"两表attributes合起来仍覆盖原ABC。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cp>(1) C的closure只有B、C，不是整个关系，所以C不是superkey。non-trivial functional dependency\u003cspan class=\"math\">C\to B\u003c/span>违反BCNF。按这条依赖分为\u003cspan class=\"math\">R\u003csub>1\u003c/sub>=(C,B)\u003c/span>、\u003cspan class=\"math\">R\u003csub>2\u003c/sub>=(A,C)\u003c/span>。\u003c/p>\n\u003cp>(2) 在\u003cspan class=\"math\">R\u003csub>1\u003c/sub>\u003c/span>中，投影出的non-trivial functional dependency为\u003cspan class=\"math\">C\to B\u003c/span>及其逻辑后果，candidate key是\u003cspan class=\"math\">{C}\u003c/span>。在\u003cspan class=\"math\">R\u003csub>2\u003c/sub>\u003c/span>中，没有非平凡functional dependency，candidate key是\u003cspan class=\"math\">{A,C}\u003c/span>。两个关系都满足BCNF。\u003c/p>\n\u003cp>(3) \u003cstrong>无损性成立\u003c/strong>：两个关系共同的属性是C，且C能决定\u003cspan class=\"math\">R\u003csub>1\u003c/sub>\u003c/span>的全部属性。按二元lossless decomposition的检验条件，这次分解无损。\u003c/p>\n\u003cp>\u003cstrong>dependency preservation不成立\u003c/strong>：分解后的局部依赖不能推出原来的\u003cspan class=\"math\">AB\to C\u003c/span>。仅凭\u003cspan class=\"math\">C\to B\u003c/span>，从AB出发仍得不到C。因此不能只通过分别检查两个分表的依赖来保证原来的全部依赖。\u003c/p>\n\u003cp>无损和dependency preservation是两项分别检查的性质，不能用其中一个结论代替另一个。本补充题练习分解方法，不表示老师已经明确承诺考这两项证明。\u003c/p>\n"},{"number":"2","goal":"检查分表projected FDs与keys","steps":["CB中保留C→B，key为C，所以BCNF。","AC中没有非平凡projected FD，key为AC。","不要把原AB→C直接写成AC中不成立的A→C。"],"check":"每个表的FD只能涉及其自身attributes。","pitfall":"projected dependencies不是删除原FD中不在表内的字母。","mainType":"normalization","knowledge":["fd","closure","candidate","prime","partial","third","bcnf"],"taskBrief":"根据给定FD推导全部最小键，并逐项证明最高范式。","input":"英文题面和给定图／FD","output":"检查分表projected FDs与keys","examTips":["每个表的FD只能涉及其自身attributes。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["projected dependencies不是删除原FD中不在表内的字母。"],"tables":[],"knowledgeUses":{"fd":"每个表的FD只能涉及其自身attributes。","closure":"每个表的FD只能涉及其自身attributes。","candidate":"每个表的FD只能涉及其自身attributes。","prime":"每个表的FD只能涉及其自身attributes。","partial":"每个表的FD只能涉及其自身attributes。","third":"每个表的FD只能涉及其自身attributes。","bcnf":"每个表的FD只能涉及其自身attributes。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cp>(1) C的closure只有B、C，不是整个关系，所以C不是superkey。non-trivial functional dependency\u003cspan class=\"math\">C\to B\u003c/span>违反BCNF。按这条依赖分为\u003cspan class=\"math\">R\u003csub>1\u003c/sub>=(C,B)\u003c/span>、\u003cspan class=\"math\">R\u003csub>2\u003c/sub>=(A,C)\u003c/span>。\u003c/p>\n\u003cp>(2) 在\u003cspan class=\"math\">R\u003csub>1\u003c/sub>\u003c/span>中，投影出的non-trivial functional dependency为\u003cspan class=\"math\">C\to B\u003c/span>及其逻辑后果，candidate key是\u003cspan class=\"math\">{C}\u003c/span>。在  participants whose email is unknown. Do not treat an empty string as NULL.\n(2) Find workshopNo and title when the title contains the word DATABASE, regardless of letter case, and category is either TECHNOLOGY or BUSINESS.\n(3) Find workshopNo and date for workshops occurring in June 2026. Write a date range that includes all June dates and excludes 1 July.\n(4) List each participant's email, displaying 'NO EMAIL' when it is NULL. Preserve any non-NULL value, including an empty string.","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"查邮箱未知","steps":["从Participant取编号、拼接全名。","用email IS NULL判断缺失。","空字符串不包含在未知集合中。"],"check":"原数据4、8、12。","pitfall":"=NULL和IS NULL不能替换。","mainType":"fundamentals","knowledge":["projection","filter","concat","null"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Professional training workshops schema与题面条件","output":"查邮箱未知","examTips":["原数据4、8、12。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["=NULL和IS NULL不能替换。"],"tables":["Participant"],"knowledgeUses":{"projection":"本小题输出：查邮箱未知","filter":"原数据4、8、12。","concat":"原数据4、8、12。","null":"原数据4、8、12。"},"sqlPlan":[{"label":"选表／对象","text":"Participant"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"原数据4、8、12。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT participantNo, CONCAT(fname, &#39; &#39;, lname) AS fullName\nFROM Participant WHERE email IS NULL;\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"同时处理标题文本与类别集合","steps":["UPPER(title)统一大小写，再LIKE %DATABASE%。","category IN (TECHNOLOGY,BUSINESS)限定任一目标类别。","两个条件用AND，输出编号和标题。"],"check":"原数据无匹配，空结果正常。","pitfall":"不要把AND改成OR让所有指定类别都入选。","mainType":"fundamentals","knowledge":["projection","filter"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Professional training workshops schema与题面条件","output":"同时处理标题文本与类别集合","examTips":["原数据无匹配，空结果正常。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不要把AND改成OR让所有指定类别都入选。"],"tables":["Workshop"],"knowledgeUses":{"projection":"本小题输出：同时处理标题文本与类别集合","filter":"原数据无匹配，空结果正常。"},"sqlPlan":[{"label":"选表／对象","text":"Workshop"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"原数据无匹配，空结果正常。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT workshopNo, title\nFROM Workshop\nWHERE UPPER(title) LIKE &#39;%DATABASE%&#39;\n  AND category IN (&#39;TECHNOLOGY&#39;, &#39;BUSINESS&#39;);\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"覆盖2026年6月的日期范围","steps":["下界设为2026-06-01并包含它。","上界设为2026-07-01并排除它。","不用猜月底最后一秒，也不把7月1日包含进来。"],"check":"原数据workshop7、8。","pitfall":"BETWEEN六月1日和七月1日会包含七月边界。","mainType":"fundamentals","knowledge":["projection","filter"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Professional training workshops schema与题面条件","output":"覆盖2026年6月的日期范围","examTips":["原数据workshop7、8。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["BETWEEN六月1日和七月1日会包含七月边界。"],"tables":["Workshop"],"knowledgeUses":{"projection":"本小题输出：覆盖2026年6月的日期范围","filter":"原数据workshop7、8。"},"sqlPlan":[{"label":"选表／对象","text":"Workshop"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"原数据workshop7、8。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT workshopNo, `date`\nFROM Workshop\nWHERE `date` &gt;= &#39;2026-06-01&#39; AND `date` &lt; &#39;2026-07-01&#39;;\n\u003c/code>\u003c/pre>\n"},{"number":"4","goal":"仅替换NULL的邮箱显示","steps":["SELECT参与者编号和COALESCE(email,NO EMAIL)。","COALESCE遇到非NULL原值就保留，包括空字符串。","这是结果显示，不UPDATE原邮箱。"],"check":"数据库保存的email没有被改写。","pitfall":"把空字符串也一律转换会违背“保留非NULL值”。","mainType":"fundamentals","knowledge":["projection"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Professional training workshops schema与题面条件","output":"仅替换NULL的邮箱显示","examTips":["数据库保存的email没有被改写。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["把空字符串也一律转换会违背“保留非NULL值”。"],"tables":["Participant"],"knowledgeUses":{"projection":"本小题输出：仅替换NULL的邮箱显示"},"sqlPlan":[{"label":"选表／对象","text":"Participant"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"数据库保存的email没有被改写。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT participantNo, COALESCE(email, &#39;NO EMAIL&#39;) AS displayedEmail\nFROM Participant;\n\u003c/code>\u003c/pre>\n"}],"tags":["Projection, filters, Boolean conditions and sorting","NULL, empty strings and three-valued logic","Row functions, strings, arithmetic and dates"],"legacyPriority":"core","level":"C","archived":false,"originType":"Supplementary Practice","mainType":"fundamentals","related":[],"examRelevance":"按需参考；不进入主要练习","coverageStatus":"reference","questionZh":"以下是基于Workshop schema的必要变式，不是教师原题。\n\n(1) 找出email未知的Participant，输出participantNo和full name。不能把空字符串当成NULL。\n\n(2) 找出title包含DATABASE且category为TECHNOLOGY或BUSINESS的Workshop，输出workshopNo与title。不区分标题字母大小写。\n\n(3) 找出日期在2026年6月的Workshop，输出workshopNo与date。日期范围须包含6月的全部日期，并排除7月1日。\n\n(4) 显示每位Participant的email。只有NULL时才显示NO EMAIL；保留任何非NULL值，包括空字符串。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["projection","filter","concat","null"],"types":["fundamentals"],"requiredSkills":["SELECT / projection / 选择输出列","WHERE / predicate / 逐行筛选条件","CONCAT / column alias / 合成姓名与输出列别名","NULL / IS NULL / 未知值及空值判断"],"questionHTML":"\u003cp>Use the original workshop database.\u003c/p>\n\u003cp>(1) Find participantNo and fullName for participants whose email is unknown. Do not treat an empty string as NULL.\n(2) Find workshopNo and title when the title contains the word DATABASE, regardless of letter case, and category is either TECHNOLOGY or BUSINESS.\n(3) Find workshopNo and date for workshops occurring in June 2026. Write a date range that includes all June dates and excludes 1 July.\n(4) List each participant&#39;s email, displaying &#39;NO EMAIL&#39; when it is NULL. Preserve any non-NULL value, including an empty string.\u003c/p>\n","translationHTML":"\u003cp>以下是基于Workshop schema的必要变式，不是教师原题。\u003c/p>\n\u003cp>(1) 找出email未知的Participant，输出participantNo和full name。不能把空字符串当成NULL。\u003c/p>\n\u003cp>(2) 找出title包含DATABASE且category为TECHNOLOGY或BUSINESS的Workshop，输出workshopNo与title。不区分标题字母大小写。\u003c/p>\n\u003cp>(3) 找出日期在2026年6月的Workshop，输出workshopNo与date。日期范围须包含6月的全部日期，并排除7月1日。\u003c/p>\n\u003cp>(4) 显示每位Participant的email。只有NULL时才显示NO EMAIL；保留任何非NULL值，包括空字符串。\u003c/p>\n","answerHTML":"\u003cp>(1) 用IS NULL查未知邮箱，不能用等号与NULL比较。原数据符合者为4、8、12。\u003c/p>\n\u003cp>(2) 先用UPPER统一标题大小写，再用LIKE查包含DATABASE的文本，同时限定类别。原装载数据没有符合记录，零行结果是正常的。\u003c/p>\n\u003cp>(3) 用“日期不早于6月1日，并且早于7月1日”的范围覆盖整个6月。原数据符合工作坊7、8。\u003c/p>\n\u003cp>(4) COALESCE只在邮箱为NULL时替换为NO EMAIL。空字符串不是NULL，因此仍保留为空字符串。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nSELECT participantNo, CONCAT(fname, &#39; &#39;, lname) AS fullName\nFROM Participant WHERE email IS NULL;\n\n-- (2)\nSELECT workshopNo, title\nFROM Workshop\nWHERE UPPER(title) LIKE &#39;%DATABASE%&#39;\n  AND category IN (&#39;TECHNOLOGY&#39;, &#39;BUSINESS&#39;);\n\n-- (3)\nSELECT workshopNo, `date`\nFROM Workshop\nWHERE `date` &gt;= &#39;2026-06-01&#39; AND `date` &lt; &#39;2026-07-01&#39;;\n\n-- (4)\nSELECT participantNo, COALESCE(email, &#39;NO EMAIL&#39;) AS displayedEmail\nFROM Participant;\n\u003c/code>\u003c/pre>\n"},{"id":"S12","title":"Self-joins, UNION and UNION ALL","topic":"同城参与者配对与名称合并查询","areas":["SELECT"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"C","question":"Use the original workshop database.\n\n(1) Find every unordered pair of different participants who live in the same city. List the two participant numbers and the city. Do not return a participant paired with themselves or both (1,4) and (4,1).\n(2) Produce a one-column list of all qualification names recorded either as possessed qualifications or workshop requirements. Remove duplicates.\n(3) Rewrite (2) to preserve duplicates, and explain what one output row represents in each version.","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"找同城不同人的无序配对","steps":["Participant使用P1/P2两个aliases连接同一张表。","city相等，同时P1.participantNo\u003cP2.participantNo。","小于号一次同时去掉自身与反向重复。"],"check":"原数据三对(1,4)、(1,7)、(4,7)。","pitfall":"只用\u003c>仍会有(1,4)和(4,1)。","mainType":"fundamentals","knowledge":["projection","join"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Professional training workshops schema与题面条件","output":"找同城不同人的无序配对","examTips":["原数据三对(1,4)、(1,7)、(4,7)。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["只用\u003c>仍会有(1,4)和(4,1)。"],"tables":["Participant"],"knowledgeUses":{"projection":"本小题输出：找同城不同人的无序配对","join":"涉及对象／命名中间结果：Participant"},"sqlPlan":[{"label":"选表／对象","text":"Participant"},{"label":"连接与层次","text":"使用JOIN并检查完整ON条件；先确定每行的计数单位。"},{"label":"筛选、分组与输出","text":"原数据三对(1,4)、(1,7)、(4,7)。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT P1.participantNo AS participant1, P2.participantNo AS participant2,\n       P1.city\nFROM Participant AS P1\nJOIN Participant AS P2\n  ON P1.city = P2.city AND P1.participantNo &lt; P2.participantNo;\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"合并两来源的资格名称并去重","steps":["两条SELECT都只取qname，列数与类型一致。","用UNION合并，自动消除重复名称。","结果每行是一种名字，不是某个资格持有人。"],"check":"同名无论来自几人或几工作坊都只留一行。","pitfall":"JOIN两个来源是在匹配行，不是在合并两个名单。","mainType":"fundamentals","knowledge":["projection","union"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Professional training workshops schema与题面条件","output":"合并两来源的资格名称并去重","examTips":["同名无论来自几人或几工作坊都只留一行。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["JOIN两个来源是在匹配行，不是在合并两个名单。"],"tables":["Qualification","Requirement"],"knowledgeUses":{"projection":"本小题输出：合并两来源的资格名称并去重","union":"同名无论来自几人或几工作坊都只留一行。"},"sqlPlan":[{"label":"选表／对象","text":"Qualification, Requirement"},{"label":"连接与层次","text":"按题目指定形式区分内外层查询。"},{"label":"筛选、分组与输出","text":"同名无论来自几人或几工作坊都只留一行。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT qname FROM Qualification\nUNION\nSELECT qname FROM Requirement;\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"保留来源中的重复行","steps":["把UNION改为UNION ALL。","每条输入记录都会贡献一行名称。","解释与去重版的行含义差别，不把重复当查询错误。"],"check":"行数等于两个来源行数之和。","pitfall":"UNION ALL不是每个名称一行。","mainType":"fundamentals","knowledge":["projection","union"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Professional training workshops schema与题面条件","output":"保留来源中的重复行","examTips":["行数等于两个来源行数之和。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["UNION ALL不是每个名称一行。"],"tables":["Qualification","Requirement"],"knowledgeUses":{"projection":"本小题输出：保留来源中的重复行","union":"行数等于两个来源行数之和。"},"sqlPlan":[{"label":"选表／对象","text":"Qualification, Requirement"},{"label":"连接与层次","text":"按题目指定形式区分内外层查询。"},{"label":"筛选、分组与输出","text":"行数等于两个来源行数之和。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT qname FROM Qualification\nUNION ALL\nSELECT qname FROM Requirement;\n\u003c/code>\u003c/pre>\n"}],"tags":["Self-join and alias roles","UNION, duplicates, intersection and difference"],"legacyPriority":"core","level":"C","archived":false,"originType":"Supplementary Practice","mainType":"fundamentals","related":[],"examRelevance":"按需参考；不进入主要练习","coverageStatus":"reference","questionZh":"辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["projection","join","union"],"types":["fundamentals"],"requiredSkills":["SELECT / projection / 选择输出列","JOIN / join condition / 连接及连接条件","UNION / UNION ALL / 合并结果集"],"questionHTML":"\u003cp>Use the original workshop database.\u003c/p>\n\u003cp>(1) Find every unordered pair of different participants who live in the same city. List the two participant numbers and the city. Do not return a participant paired with themselves or both (1,4) and (4,1).\n(2) Produce a one-column list of all qualification names recorded either as possessed qualifications or workshop requirements. Remove duplicates.\n(3) Rewrite (2) to preserve duplicates, and explain what one output row represents in each version.\u003c/p>\n","translationHTML":"\u003cp>辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。\u003c/p>\n","answerHTML":"\u003cp>(1) 把Participant用两个别名连接，要求同城市，且第一个编号小于第二个。这样既排除自身，也只保留一对中的一个方向。原数据有(1,4)、(1,7)、(4,7)。若只写编号不等，仍会同时得到正反两个方向。\u003c/p>\n\u003cp>(2) UNION把两个来源的名称合并，重复名称只留一行。\u003c/p>\n\u003cp>(3) UNION ALL保留每条来源记录贡献的行，同一个名称可能出现多次。因此(2)是一种资格名称一行，(3)是一个来源记录一行；它不表示一位参与者或一个工作坊一行。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nSELECT P1.participantNo AS participant1, P2.participantNo AS participant2,\n       P1.city\nFROM Participant AS P1\nJOIN Participant AS P2\n  ON P1.city = P2.city AND P1.participantNo &lt; P2.participantNo;\n\n-- (2)\nSELECT qname FROM Qualification\nUNION\nSELECT qname FROM Requirement;\n\n-- (3)\nSELECT qname FROM Qualification\nUNION ALL\nSELECT qname FROM Requirement;\n\u003c/code>\u003c/pre>\n"},{"id":"S13","title":"Universal conditions and avoiding duplicate counts","topic":"查询完成所有课程的人及避免重复计数","areas":["SELECT"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"C","question":"Use the original workshop database.\n\n(1) Find participantNo and fullName for participants who have completed every TECHNOLOGY workshop. Use correlated subqueries. A CANCELLED enrolment does not count as completion. If there are no TECHNOLOGY workshops, every participant qualifies.\n(2) For every workshop, report workshopNo, number of enrolments and number of assigned trainers, including zero counts. Ensure that having several enrolments and several trainers does not multiply either count.","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"查询完成每门技术工作坊的人","steps":["从每个参与者开始，寻找一个反例：某门TECHNOLOGY工作坊没有该人的已完成报名。","内层NOT EXISTS判断“缺少这门已完成报名”，外层NOT EXISTS表示“不存在这样的反例”。","status必须COMPLETED；没有技术类workshop时反例集合为空，所有人满足。"],"check":"原数据无人符合；删除所有技术工作坊后，应得到全部参与者。","pitfall":"一次TECHNOLOGY报名只说明完成过至少一门，不说明每门。","mainType":"fundamentals","knowledge":["projection","filter","concat","exists"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Professional training workshops schema与题面条件","output":"查询完成每门技术工作坊的人","examTips":["原数据无人符合；删除所有技术工作坊后，应得到全部参与者。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["一次TECHNOLOGY报名只说明完成过至少一门，不说明每门。"],"tables":["Participant","Workshop","Enrolment"],"knowledgeUses":{"projection":"本小题输出：查询完成每门技术工作坊的人","filter":"原数据无人符合；删除所有技术工作坊后，应得到全部参与者。","concat":"原数据无人符合；删除所有技术工作坊后，应得到全部参与者。","exists":"原数据无人符合；删除所有技术工作坊后，应得到全部参与者。"},"sqlPlan":[{"label":"选表／对象","text":"Participant, Workshop, Enrolment"},{"label":"连接与层次","text":"按题目指定形式区分内外层查询。"},{"label":"筛选、分组与输出","text":"原数据无人符合；删除所有技术工作坊后，应得到全部参与者。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT P.participantNo, CONCAT(P.fname, &#39; &#39;, P.lname) AS fullName\nFROM Participant AS P\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM Workshop AS W\n    WHERE W.category = &#39;TECHNOLOGY&#39;\n      AND NOT EXISTS (\n          SELECT 1\n          FROM Enrolment AS E\n          WHERE E.participantNo = P.participantNo\n            AND E.workshopNo = W.workshopNo\n            AND E.status = &#39;COMPLETED&#39;\n      )\n);\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"同时统计两种明细而不计数相乘","steps":["分别在Enrolment和WorkshopTrainer中按workshopNo聚合。","把两份每工作坊一行的统计LEFT JOIN回Workshop。","COALESCE把未匹配的统计显示成0；不直接把两张明细全连接后COUNT(*)。"],"check":"工作坊3的4条报名与2位培训师仍为4、2，不是8、8。","pitfall":"COUNT(DISTINCT)有时可补救，但先确定每种计数对象与粒度更可靠。","mainType":"fundamentals","knowledge":["projection","join","count","left","group"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Professional training workshops schema与题面条件","output":"同时统计两种明细而不计数相乘","examTips":["工作坊3的4条报名与2位培训师仍为4、2，不是8、8。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["COUNT(DISTINCT)有时可补救，但先确定每种计数对象与粒度更可靠。"],"tables":["Workshop","Enrolment","WorkshopTrainer"],"knowledgeUses":{"projection":"本小题输出：同时统计两种明细而不计数相乘","join":"涉及对象／命名中间结果：Workshop, Enrolment, WorkshopTrainer","count":"工作坊3的4条报名与2位培训师仍为4、2，不是8、8。","left":"工作坊3的4条报名与2位培训师仍为4、2，不是8、8。","group":"工作坊3的4条报名与2位培训师仍为4、2，不是8、8。"},"sqlPlan":[{"label":"选表／对象","text":"Workshop, Enrolment, WorkshopTrainer"},{"label":"连接与层次","text":"使用JOIN并检查完整ON条件；先确定每行的计数单位。"},{"label":"筛选、分组与输出","text":"工作坊3的4条报名与2位培训师仍为4、2，不是8、8。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT W.workshopNo,\n       COALESCE(EC.totalEnrolments, 0) AS totalEnrolments,\n       COALESCE(TC.totalTrainers, 0) AS totalTrainers\nFROM Workshop AS W\nLEFT JOIN (\n    SELECT workshopNo, COUNT(*) AS totalEnrolments\n    FROM Enrolment GROUP BY workshopNo\n) AS EC ON EC.workshopNo = W.workshopNo\nLEFT JOIN (\n    SELECT workshopNo, COUNT(*) AS totalTrainers\n    FROM WorkshopTrainer GROUP BY workshopNo\n) AS TC ON TC.workshopNo = W.workshopNo;\n\u003c/code>\u003c/pre>\n"}],"tags":["Correlated queries, ties and universal conditions","CTE and derived tables","Independent counts without join multiplication"],"legacyPriority":"core","level":"C","archived":true,"originType":"Supplementary Practice","mainType":"fundamentals","related":[],"examRelevance":"按需参考；不进入主要练习","archiveReason":"已有核心原题覆盖方法，或超出本轮确认的操作深度；保留溯源，不参与默认练习。","coverageStatus":"reference","questionZh":"以下是嵌套查询及计数的必要变式，不是教师原题。\n\n(1) 找出完成了每一门TECHNOLOGY Workshop的Participant，输出participantNo与full name。必须使用correlated subqueries。CANCELLED不算完成。如果没有TECHNOLOGY Workshop，每位Participant都符合。\n\n(2) 每个Workshop输出workshopNo、enrolment总数和已分配Trainer总数，包括0。多条报名和多位Trainer不能使任一计数被相乘放大。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["projection","filter","concat","exists","join","count","left","group"],"types":["fundamentals"],"requiredSkills":["SELECT / projection / 选择输出列","WHERE / predicate / 逐行筛选条件","CONCAT / column alias / 合成姓名与输出列别名","EXISTS / NOT EXISTS / 存在与不存在","JOIN / join condition / 连接及连接条件","COUNT / grain / 计数与计数单位","LEFT JOIN / 保留左侧未匹配行的连接","GROUP BY / aggregate / 分组与聚合"],"questionHTML":"\u003cp>Use the original workshop database.\u003c/p>\n\u003cp>(1) Find participantNo and fullName for participants who have completed every TECHNOLOGY workshop. Use correlated subqueries. A CANCELLED enrolment does not count as completion. If there are no TECHNOLOGY workshops, every participant qualifies.\n(2) For every workshop, report workshopNo, number of enrolments and number of assigned trainers, including zero counts. Ensure that having several enrolments and several trainers does not multiply either count.\u003c/p>\n","translationHTML":"\u003cp>以下是嵌套查询及计数的必要变式，不是教师原题。\u003c/p>\n\u003cp>(1) 找出完成了每一门TECHNOLOGY Workshop的Participant，输出participantNo与full name。必须使用correlated subqueries。CANCELLED不算完成。如果没有TECHNOLOGY Workshop，每位Participant都符合。\u003c/p>\n\u003cp>(2) 每个Workshop输出workshopNo、enrolment总数和已分配Trainer总数，包括0。多条报名和多位Trainer不能使任一计数被相乘放大。\u003c/p>\n","answerHTML":"\u003cp>(1) “完成每一门技术类工作坊”等价于“找不到任何一门技术类工作坊是这个人没有完成的”。外层NOT EXISTS寻找反例；内层NOT EXISTS检查该人是否缺少这门工作坊的已完成报名。没有技术类工作坊时不存在反例，所以全部人满足。原数据中没有人完成全部技术类工作坊，结果为零行。\u003c/p>\n\u003cp>(2) 先分别统计每个工作坊的报名次数与培训师人数，再把两份每工作坊一行的结果连接回来。这样不会把多条报名与多位培训师相乘。LEFT JOIN保留没有对应明细的工作坊，COALESCE把缺失的统计值显示为0。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nSELECT P.participantNo, CONCAT(P.fname, &#39; &#39;, P.lname) AS fullName\nFROM Participant AS P\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM Workshop AS W\n    WHERE W.category = &#39;TECHNOLOGY&#39;\n      AND NOT EXISTS (\n          SELECT 1\n          FROM Enrolment AS E\n          WHERE E.participantNo = P.participantNo\n            AND E.workshopNo = W.workshopNo\n            AND E.status = &#39;COMPLETED&#39;\n      )\n);\n\n-- (2)\nSELECT W.workshopNo,\n       COALESCE(EC.totalEnrolments, 0) AS totalEnrolments,\n       COALESCE(TC.totalTrainers, 0) AS totalTrainers\nFROM Workshop AS W\nLEFT JOIN (\n    SELECT workshopNo, COUNT(*) AS totalEnrolments\n    FROM Enrolment GROUP BY workshopNo\n) AS EC ON EC.workshopNo = W.workshopNo\nLEFT JOIN (\n    SELECT workshopNo, COUNT(*) AS totalTrainers\n    FROM WorkshopTrainer GROUP BY workshopNo\n) AS TC ON TC.workshopNo = W.workshopNo;\n\u003c/code>\u003c/pre>\n"},{"id":"S14","title":"INSERT SELECT, CHECK and ROLLBACK","topic":"INSERT SELECT、约束失败与 ROLLBACK","areas":["DDL/DML"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"C","question":"Use the original workshop database in an isolated practice database.\n\n(1) Create an empty table WorkshopLoad(workshopNo, totalEnrolments), with a primary key and a foreign key to Workshop. Use suitable types.\n(2) Populate it using one INSERT ... SELECT statement. Include every workshop, including those with no enrolments.\n(3) Explain the difference between this two-step method and CREATE TABLE ... AS SELECT with respect to keys.\n(4) Assume Workshop is transactional and has an enforced CHECK(capacity > 0). Show an explicit transaction that increases capacity by 5 for workshop 1 and is then rolled back. State the final capacity if its original value was 40. Then state whether setting capacity = 0 can succeed under the assumed CHECK.","context":"workshop","canonical":null,"parts":[{"number":"1","goal":"先建带键的统计空表","steps":["workshopNo类型与源表一致，作为primary key。","定义引用Workshop的foreign key。","次数使用足够容量的整数列，不能为空。"],"check":"空表已具备约束再装载。","pitfall":"只创建普通两列而忘了键不满足题目。","mainType":"ddl-dml","knowledge":["keys","constraints","types"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"共享Professional training workshops schema与题面条件","output":"先建带键的统计空表","examTips":["空表已具备约束再装载。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["只创建普通两列而忘了键不满足题目。"],"tables":["WorkshopLoad"],"knowledgeUses":{"keys":"涉及对象／命名中间结果：WorkshopLoad","constraints":"空表已具备约束再装载。","types":"空表已具备约束再装载。"},"sqlPlan":[{"label":"选表／对象","text":"WorkshopLoad"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"空表已具备约束再装载。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">CREATE TABLE WorkshopLoad (\n    workshopNo DECIMAL(6) NOT NULL,\n    totalEnrolments BIGINT NOT NULL,\n    CONSTRAINT wl_pkey PRIMARY KEY (workshopNo),\n    CONSTRAINT wl_fkey FOREIGN KEY (workshopNo)\n        REFERENCES Workshop(workshopNo)\n);\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"一次INSERT SELECT装载全部工作坊","steps":["Workshop LEFT JOIN Enrolment保留无报名者。","按workshopNo分组，COUNT(E.participantNo)给0而非1。","INSERT目标列顺序与SELECT输出一致。"],"check":"每workshop一行，没有重复primary key。 "sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nCREATE TABLE WorkshopLoad (\n    workshopNo DECIMAL(6) NOT NULL,\n    totalEnrolments BIGINT NOT NULL,\n    CONSTRAINT wl_pkey PRIMARY KEY (workshopNo),\n    CONSTRAINT wl_fkey FOREIGN KEY (workshopNo)\n        REFERENCES Workshop(workshopNo)\n);\n\n-- (2)\nINSERT INTO WorkshopLoad (workshopNo, totalEnrolments)\nSELECT W.workshopNo, COUNT(E.participantNo)\nFROM Workshop AS W\nLEFT JOIN Enrolment AS E ON E.workshopNo = W.workshopNo\nGROUP BY W.workshopNo;\n\n-- (4)\nSTART TRANSACTION;\nUPDATE Workshop SET capacity = capacity + 5 WHERE workshopNo = 1;\nROLLBACK;\n\u003c/code>\u003c/pre>\n"},{"number":"4","goal":"解释显式transaction与CHECK效果","steps":["START TRANSACTION后把workshop1从40改45，本事务可看到45。","ROLLBACK撤回未提交DML，恢复40。","有效CHECK(capacity>0)拒绝改0；该CHECK是本补题假定，并非原DDL已有。"],"check":"不会把DDL也一并认定可由最后ROLLBACK撤回。","pitfall":"autocommit、显式事务和DDL implicit commit需要分别看。","mainType":"ddl-dml","knowledge":["filter","dml"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"共享Professional training workshops schema与题面条件","output":"解释显式transaction与CHECK效果","examTips":["不会把DDL也一并认定可由最后ROLLBACK撤回。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["autocommit、显式事务和DDL implicit commit需要分别看。"],"tables":["Workshop"],"knowledgeUses":{"filter":"不会把DDL也一并认定可由最后ROLLBACK撤回。","dml":"涉及对象／命名中间结果：Workshop"},"sqlPlan":[{"label":"选表／对象","text":"Workshop"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"不会把DDL也一并认定可由最后ROLLBACK撤回。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">START TRANSACTION;\nUPDATE Workshop SET capacity = capacity + 5 WHERE workshopNo = 1;\nROLLBACK;\n\u003c/code>\u003c/pre>\n"}],"tags":["CHECK, UNIQUE, NOT NULL and numeric capacity","CTAS and INSERT SELECT","TRUNCATE, COMMIT, ROLLBACK and implicit commit"],"legacyPriority":"core","level":"C","archived":false,"originType":"Supplementary Practice","mainType":"ddl-dml","related":[],"examRelevance":"按需参考；不进入主要练习","coverageStatus":"reference","questionZh":"辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["keys","constraints","types","projection","join","count","dml","left","group","ddl","filter"],"types":["ddl-dml"],"requiredSkills":["Primary / candidate / foreign key / 主键、候选键与外键","CHECK / UNIQUE / NOT NULL / 值限制、唯一与必填","DECIMAL(p,s) / 精确数值的位数","SELECT / projection / 选择输出列","JOIN / join condition / 连接及连接条件","COUNT / grain / 计数与计数单位","INSERT / UPDATE / DELETE / 增加、修改和删除行","LEFT JOIN / 保留左侧未匹配行的连接","GROUP BY / aggregate / 分组与聚合","ALTER TABLE / 修改表结构","WHERE / predicate / 逐行筛选条件"],"questionHTML":"\u003cp>Use the original workshop database in an isolated practice database.\u003c/p>\n\u003cp>(1) Create an empty table WorkshopLoad(workshopNo, totalEnrolments), with a primary key and a foreign key to Workshop. Use suitable types.\n(2) Populate it using one INSERT ... SELECT statement. Include every workshop, including those with no enrolments.\n(3) Explain the difference between this two-step method and CREATE TABLE ... AS SELECT with respect to keys.\n(4) Assume Workshop is transactional and has an enforced CHECK(capacity &gt; 0). Show an explicit transaction that increases capacity by 5 for workshop 1 and is then rolled back. State the final capacity if its original value was 40. Then state whether setting capacity = 0 can succeed under the assumed CHECK.\u003c/p>\n","translationHTML":"\u003cp>辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。\u003c/p>\n","answerHTML":"\u003cp>(1) 先创建空表，并显式定义primary key和foreign key。\u003c/p>\n\u003cp>(2) INSERT ... SELECT把查询得到的统计行填入已建表。LEFT JOIN保留没有报名的工作坊，统计右侧参与者编号得到0。\u003c/p>\n\u003cp>(3) 本写法在建空表时已经定义键；CREATE TABLE ... AS SELECT不会自动继承源表键，需要自己定义相应约束。不能误解为这种语句在任何情况下都不允许显式定义约束。\u003c/p>\n\u003cp>(4) 在题目给定的事务条件下，本事务更新后暂时看到45；ROLLBACK后恢复为40。有效的CHECK(capacity &gt; 0)会拒绝把容量改为0。这个CHECK是本补充题的假设，不是说原始Workshop表已经定义它。DDL的隐式提交也不能被最后的ROLLBACK一并撤回。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- (1)\nCREATE TABLE WorkshopLoad (\n    workshopNo DECIMAL(6) NOT NULL,\n    totalEnrolments BIGINT NOT NULL,\n    CONSTRAINT wl_pkey PRIMARY KEY (workshopNo),\n    CONSTRAINT wl_fkey FOREIGN KEY (workshopNo)\n        REFERENCES Workshop(workshopNo)\n);\n\n-- (2)\nINSERT INTO WorkshopLoad (workshopNo, totalEnrolments)\nSELECT W.workshopNo, COUNT(E.participantNo)\nFROM Workshop AS W\nLEFT JOIN Enrolment AS E ON E.workshopNo = W.workshopNo\nGROUP BY W.workshopNo;\n\n-- (4)\nSTART TRANSACTION;\nUPDATE Workshop SET capacity = capacity + 5 WHERE workshopNo = 1;\nROLLBACK;\n\u003c/code>\u003c/pre>\n"},{"id":"S15","title":"Creating, granting and activating roles","topic":"创建、授予和启用角色","areas":["Access"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question","origin":"Supplementary practice","priority":"C","question":"As root, create a new localhost user practice_reader and a role workshop_reader. The role must allow SELECT on csit882.Workshop and csit882.Enrolment, with no right to propagate these object privileges.\n\n(1) Create the account and role.\n(2) Grant the required SELECT privileges to the role and assign the role to the user.\n(3) Make this role a default role for the user. Also show how the user can activate it in their current connection.\n(4) Show how root removes the role assignment from this user while preserving the role for other users. Does granting a role alone necessarily activate it in an already open connection?","context":"","canonical":null,"parts":[{"number":"1","goal":"创建账号和role","steps":["CREATE USER创建可登录的localhost账号。","CREATE ROLE创建权限集合，不拿role当用户密码。","角色名称与后续GRANT保持一致。"],"check":"u 能否转授，逐项实现权限。","input":"英文题面和给定图／FD","output":"区分默认启用和当前启用","examTips":["知道哪条语句在哪个连接运行。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["SET DEFAULT ROLE不是“切换到另一个用户”。"],"tables":[],"knowledgeUses":{"grant":"知道哪条语句在哪个连接运行。","grantoption":"知道哪条语句在哪个连接运行。","definer":"知道哪条语句在哪个连接运行。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SET DEFAULT ROLE &#39;workshop_reader&#39; TO &#39;practice_reader&#39;@&#39;localhost&#39;;\n\n-- practice_reader, in that user&#39;s current connection\nSET ROLE &#39;workshop_reader&#39;;\n\u003c/code>\u003c/pre>\n"},{"number":"4","goal":"移除成员关系而保留role","steps":["root执行REVOKE role FROM user。","不DROP ROLE，因此其他用户仍可使用。","没有WITH ADMIN OPTION的成员资格也不能据此转授role。"],"check":"只影响目标成员关系，不破坏共享角色。","pitfall":"DROP ROLE会影响所有成员，不是本题要求。","mainType":"access","knowledge":["grant","grantoption","definer"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"英文题面和给定图／FD","output":"移除成员关系而保留role","examTips":["只影响目标成员关系，不破坏共享角色。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["DROP ROLE会影响所有成员，不是本题要求。"],"tables":[],"knowledgeUses":{"grant":"只影响目标成员关系，不破坏共享角色。","grantoption":"只影响目标成员关系，不破坏共享角色。","definer":"只影响目标成员关系，不破坏共享角色。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">REVOKE &#39;workshop_reader&#39; FROM &#39;practice_reader&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"}],"tags":["Roles, activation, inheritance and ADMIN OPTION"],"legacyPriority":"core","level":"C","archived":false,"originType":"Supplementary Practice","mainType":"access","related":[],"examRelevance":"按需参考；不进入主要练习","coverageStatus":"reference","questionZh":"辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["user","grant","grantoption","definer"],"types":["access"],"requiredSkills":["CREATE USER / account host / 创建用户及主机范围","GRANT / privilege scope / 授予权限与对象范围","WITH GRANT OPTION / 权限转授","SQL SECURITY DEFINER / 由视图定义者权限读取底表"],"questionHTML":"\u003cp>As root, create a new localhost user practice_reader and a role workshop_reader. The role must allow SELECT on csit882.Workshop and csit882.Enrolment, with no right to propagate these object privileges.\u003c/p>\n\u003cp>(1) Create the account and role.\n(2) Grant the required SELECT privileges to the role and assign the role to the user.\n(3) Make this role a default role for the user. Also show how the user can activate it in their current connection.\n(4) Show how root removes the role assignment from this user while preserving the role for other users. Does granting a role alone necessarily activate it in an already open connection?\u003c/p>\n","translationHTML":"\u003cp>辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。\u003c/p>\n","answerHTML":"\u003cp>以下按MySQL8编写，分清root连接和用户自己的连接。\u003c/p>\n\u003cp>先把SELECT授给角色，再把角色授给用户，这是两个不同的授权动作。SET DEFAULT ROLE设置以后登录时默认启用的角色；用户在已打开的连接中可用SET ROLE启用。\u003c/p>\n\u003cp>授予对象权限时没有WITH GRANT OPTION，就没有因此获得转授这些对象权限的能力。授予角色时没有WITH ADMIN OPTION，也没有因此获得再授这个角色的能力。\u003c/p>\n\u003cp>最后用REVOKE撤销这名用户的角色成员资格，角色本身仍保留，不影响其他用户的成员资格。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- root: (1)\nCREATE USER &#39;practice_reader&#39;@&#39;localhost&#39; IDENTIFIED BY &#39;[CHOOSE_PASSWORD]&#39;;\nCREATE ROLE &#39;workshop_reader&#39;;\n\n-- root: (2)\nGRANT SELECT ON csit882.Workshop TO &#39;workshop_reader&#39;;\nGRANT SELECT ON csit882.Enrolment TO &#39;workshop_reader&#39;;\nGRANT &#39;workshop_reader&#39; TO &#39;practice_reader&#39;@&#39;localhost&#39;;\n\n-- root: (3), default for subsequent connections\nSET DEFAULT ROLE &#39;workshop_reader&#39; TO &#39;practice_reader&#39;@&#39;localhost&#39;;\n\n-- practice_reader, in that user&#39;s current connection\nSET ROLE &#39;workshop_reader&#39;;\n\n-- root: (4)\nREVOKE &#39;workshop_reader&#39; FROM &#39;practice_reader&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"},{"id":"S16","title":"Revoking privileges from different sources","topic":"根据权限来源撤销读取权或转授权","areas":["Access"],"source":"supplement","sourceLabel":"Supplementary practice","sourceNote":"Independently written from the reviewed course topics; not an original examination question Public edition: example names, contact details and password literals anonymized.","origin":"Supplementary practice","priority":"C","question":"User user u at localhost has SELECT on csit882.* directly. The user also has an active role r that grants SELECT on csit882.Workshop. There are no other privilege sources. The database contains exactly the seven workshop tables shown in the shared definition.\n\n(1) Someone attempts REVOKE SELECT ON csit882.Workshop FROM 'u'@'localhost'. Can this make Workshop unreadable? Explain the relevant privilege sources.\n(2) Write statements as root to make Workshop unreadable to u while preserving read access to the other six tables. Preserve role r and its privileges for other users.\n(3) In a separate scenario, a newly created user v has only SELECT WITH GRANT OPTION on csit882.Workshop. Revoke only v's right to propagate SELECT while preserving v's own SELECT privilege.","context":"","canonical":null,"parts":[{"number":"1","goal":"追踪有效权限的所有来源","steps":["u直接拥有数据库级SELECT。","活跃role r还给Workshop SELECT。","表级REVOKE既不撤上层数据库权限，也不撤role，甚至会因不存在表级直接grant而失败。"],"check":"不能把普通REVOKE当覆盖其他来源的DENY。","pitfall":"“这张表没直接grant”不等于“用户无权限”。","mainType":"access","knowledge":["grant","grantoption","definer"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"英文题面和给定图／FD","output":"追踪有效权限的所有来源","examTips":["不能把普通REVOKE当覆盖其他来源的DENY。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["“这张表没直接grant”不等于“用户无权限”。"],"tables":[],"knowledgeUses":{"grant":"不能把普通REVOKE当覆盖其他来源的DENY。","grantoption":"不能把普通REVOKE当覆盖其他来源的DENY。","definer":"不能把普通REVOKE当覆盖其他来源的DENY。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">-- (2) remove the two SELECT sources for u\nREVOKE SELECT ON csit882.* FROM &#39;u&#39;@&#39;localhost&#39;;\nREVOKE &#39;r&#39; FROM &#39;u&#39;@&#39;localhost&#39;;\n\n-- grant back only the other six tables\nGRANT SELECT ON csit882.Participant TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.Qualification TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.Requirement TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.Trainer TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.Enrolment TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.WorkshopTrainer TO &#39;u&#39;@&#39;localhost&#39;;\n\n-- (3) keep SELECT, remove GRANT OPTION\nREVOKE GRANT OPTION ON csit882.Workshop FROM &#39;v&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"只对u禁读Workshop且保留其他六表","steps":["撤销u的csit882.* SELECT。","撤销u的role r成员资格，不修改r本身。","对其他六张表逐一授回SELECT，不对Workshop授回。"],"check":"其他role成员不受影响，u仍能读六表。","pitfall":"去改role r的SELECT会影响其他用户。","mainType":"access","knowledge":["projection","grant","grantoption"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"英文题面和给定图／FD","output":"只对u禁读Workshop且保留其他六表","examTips":["其他role成员不受影响，u仍能读六表。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["去改role r的SELECT会影响其他用户。"],"tables":[],"knowledgeUses":{"projection":"本小题输出：只对u禁读Workshop且保留其他六表","grant":"其他role成员不受影响，u仍能读六表。","grantoption":"其他role成员不受影响，u仍能读六表。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">REVOKE SELECT ON csit882.* FROM &#39;u&#39;@&#39;localhost&#39;;\nREVOKE &#39;r&#39; FROM &#39;u&#39;@&#39;localhost&#39;;\n\n-- grant back only the other six tables\nGRANT SELECT ON csit882.Participant TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.Qualification TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.Requirement TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.Trainer TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.Enrolment TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.WorkshopTrainer TO &#39;u&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"只撤传播权，保留自身读取权","steps":["本小题是独立新用户v场景。","使用REVOKE GRANT OPTION ON csit882.Workshop FROM v。","不要连SELECT一起REVOKE，后者会剥夺自身读取。"],"check":"v可以SELECT，但不能再授予同项privilege。","pitfall":"对象GRANT OPTION不等同role的ADMIN OPTION。","mainType":"access","knowledge":["grant","grantoption"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"英文题面和给定图／FD","output":"只撤传播权，保留自身读取权","examTips":["v可以SELECT，但不能再授予同项privilege。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["对象GRANT OPTION不等同role的ADMIN OPTION。"],"tables":[],"knowledgeUses":{"grant":"v可以SELECT，但不能再授予同项privilege。","grantoption":"v可以SELECT，但不能再授予同项privilege。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">REVOKE GRANT OPTION ON csit882.Workshop FROM &#39;v&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"}],"tags":["REVOKE and multiple effective privilege sources"],"legacyPriority":"core","level":"C","archived":true,"originType":"Supplementary Practice","mainType":"access","related":[],"examRelevance":"按需参考；不进入主要练习","archiveReason":"已有核心原题覆盖方法，或超出本轮确认的操作深度；保留溯源，不参与默认练习。","coverageStatus":"reference","questionZh":"辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["grant","grantoption","definer","projection"],"types":["access"],"requiredSkills":["GRANT / privilege scope / 授予权限与对象范围","WITH GRANT OPTION / 权限转授","SQL SECURITY DEFINER / 由视图定义者权限读取底表","SELECT / projection / 选择输出列"],"questionHTML":"\u003cp>User user u at localhost has SELECT on csit882.* directly. The user also has an active role r that grants SELECT on csit882.Workshop. There are no other privilege sources. The database contains exactly the seven workshop tables shown in the shared definition.\u003c/p>\n\u003cp>(1) Someone attempts REVOKE SELECT ON csit882.Workshop FROM &#39;u&#39;@&#39;localhost&#39;. Can this make Workshop unreadable? Explain the relevant privilege sources.\n(2) Write statements as root to make Workshop unreadable to u while preserving read access to the other six tables. Preserve role r and its privileges for other users.\n(3) In a separate scenario, a newly created user v has only SELECT WITH GRANT OPTION on csit882.Workshop. Revoke only v&#39;s right to propagate SELECT while preserving v&#39;s own SELECT privilege.\u003c/p>\n","translationHTML":"\u003cp>辅助资料：英文题面保留。该题不进入核心训练；相关概念按当前原题需要查阅。\u003c/p>\n","answerHTML":"\u003cp>(1) 不能。u的直接读取权限来自整个数据库csit882.*，不是某一张表的直接授权；角色r还提供另一条读取来源。表级REVOKE可能因不存在对应直接授权而失败。即使有表级授权可撤，数据库级权限和角色权限仍不会因此消失。普通REVOKE不是优先覆盖所有授权的“禁止”规则。\u003c/p>\n\u003cp>(2) 撤销u的数据库级SELECT，并只撤销u与r的成员关系，再分别授回其他六张表的SELECT。这样保留r和它对其他用户的作用。\u003c/p>\n\u003cp>(3) 对独立场景中的v，只撤销GRANT OPTION，保留SELECT。\u003c/p>\n\u003cp>以上按题目给定的普通权限模型处理，不额外假设启用了partial_revokes等功能，也不将表级REVOKE当作通用的拒绝规则。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- (2) remove the two SELECT sources for u\nREVOKE SELECT ON csit882.* FROM &#39;u&#39;@&#39;localhost&#39;;\nREVOKE &#39;r&#39; FROM &#39;u&#39;@&#39;localhost&#39;;\n\n-- grant back only the other six tables\nGRANT SELECT ON csit882.Participant TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.Qualification TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.Requirement TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.Trainer TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.Enrolment TO &#39;u&#39;@&#39;localhost&#39;;\nGRANT SELECT ON csit882.WorkshopTrainer TO &#39;u&#39;@&#39;localhost&#39;;\n\n-- (3) keep SELECT, remove GRANT OPTION\nREVOKE GRANT OPTION ON csit882.Workshop FROM &#39;v&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"},{"id":"L01","title":"Row functions and group functions","topic":"Row functions and group functions","areas":["SELECT"],"source":"lecture-select","sourceLabel":"SELECT lectures","sourceNote":"SELECT statement (1).pdf pp19,21,24. English tasks reproduced with line breaks normalized.","origin":"Lecture questions","priority":"C","question":"Using the lecture DEPARTMENT and COURSE tables, write SELECT statements for these lecture questions.\n\n(1) List the names of departments in uppercase format.\n\n(2) Find the first three characters from all course codes and full titles of all courses.\n\n(3) Display the name of departments and budgets increased by 10%.\n\n(4) Find the total number of all staff members in all departments.\n\n(5) Find the total number of staff members in the largest department.\n\n(6) How many days have passed since 1 January 2001?","context":"lecture","canonical":null,"parts":[{"number":"1","goal":"对每行部门名使用UPPER","steps":["row function按每行调用，不需要GROUP BY。","SELECT UPPER(name)改变结果显示大小写。","没有UPDATE，底表名字不改变。"],"check":"返回所有部门的变换后名称。","pitfall":"不要把每个部门名改写回数据库。","mainType":"fundamentals","knowledge":["projection"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Lecture example: DEPARTMENT and COURSE schema与题面条件","output":"对每行部门名使用UPPER","examTips":["返回所有部门的变换后名称。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不要把每个部门名改写回数据库。"],"tables":["DEPARTMENT"],"knowledgeUses":{"projection":"本小题输出：对每行部门名使用UPPER"},"sqlPlan":[{"label":"选表／对象","text":"DEPARTMENT"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"返回所有部门的变换后名称。"}],"validation":"静态／人工复核；未在MySQL执行。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003cco
