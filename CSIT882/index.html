6.8 0,-79.2 180.76,-79.2 180.76,-46.8 0,-46.8\"/>\n\u003cpolygon fill=\"none\" stroke=\"black\" points=\"0,-46.8 0,-79.2 180.76,-79.2 180.76,-46.8 0,-46.8\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"64.71\" y=\"-60.4\" font-family=\"Arial\" font-weight=\"bold\" font-size=\"12.00\">PATIENT\u003c/text>\n\u003cpolygon fill=\"none\" stroke=\"black\" points=\"0,0 0,-46.8 180.76,-46.8 180.76,0 0,0\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"9\" y=\"-25.8\" font-family=\"Arial\" font-size=\"12.00\">insurance_company_name &#160;ID\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"9\" y=\"-11.4\" font-family=\"Arial\" font-size=\"12.00\">insurance_policy_number &#160;ID\u003c/text>\n\u003c/g>\n\u003c!-- PATIENT&#45;&gt;ADMISSION -->\n\u003cg id=\"g3-edge4\" class=\"edge\">\n\u003ctitle>PATIENT&#45;&gt;ADMISSION\u003c/title>\n\u003cpath fill=\"none\" stroke=\"#52695d\" d=\"M180.38,-51.3C221.09,-56.65 269.49,-63.01 311.4,-68.52\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"246.04\" y=\"-64.86\" font-family=\"Arial\" font-size=\"10.00\">has\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"284.7\" y=\"-73.95\" font-family=\"Arial\" font-size=\"10.00\">0..*\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"207.08\" y=\"-39.87\" font-family=\"Arial\" font-size=\"10.00\">1\u003c/text>\n\u003c/g>\n\u003c/g>\n\u003c/svg>\n\u003c/div>\u003cfigcaption>黄色框是qualifier。固定所属对象和qualifier后，最多匹配一个对象；整体最低数量与自然identifier假设见正文。 [0..1]可选，[*]多值，/表示derived attribute。\u003c/figcaption>\u003cbutton class=\"zoom\" type=\"button\">放大图\u003c/button>\u003c/figure>\n\n\u003cp>检查结果属于某一次入院，不能只放在病人名下，否则多次入院会混在一起。疾病尚未确定时，入院记录可以暂未分配分区；分配后，病区可由分区所属关系确定。\u003c/p>\n\u003ch3>图外还需表达的业务限制\u003c/h3>\n\u003col>\n\u003cli>医院的主楼必须属于该医院。\u003c/li>\n\u003cli>分区必须位于所属病区所在的建筑；分区楼层属于该病区占用的楼层。\u003c/li>\n\u003cli>入院所属医院必须和安置分区所属医院一致。\u003c/li>\n\u003cli>合同结束不能早于开始；同一顾问可以同时在不同医院有有效合同。\u003c/li>\n\u003cli>顾问不参加医生与病区之间的分配关联。\u003c/li>\n\u003c/ol>\n\u003cp>原文提到了出院，但没有要求记录出院日期或时间。本参考图不额外添加 discharge_time。若要完整的出入院时间历史，需先明确新增业务要求。\u003c/p>\n\u003cp>图中qualifier的数量解释：整体上，每个HOSPITAL至少有一座BUILDING和一名EMPLOYEE，每个WARD至少有一个DECK；黄色框把building_number、employee_number、deck_number作为局部identifier。固定所属对象与该局部号码后，目标端为0..1。这个0..1不会把医院整体限制为只有一座楼或一名员工。\u003c/p>\n"},{"id":"M2-Q2","title":"Mock Examination 2 — Question 2","topic":"航班逻辑设计","areas":["Logical"],"source":"mock-2","sourceLabel":"Mock Examination 2","sourceNote":"User-provided Questions 1–6; Q3–Q5 text attachments","origin":"Original material","priority":"core","question":"Consider a conceptual schema given below.\n\n![Original conceptual schema](assets/mock-2-q2.jpg)\n\nYour task is to perform a step of logical database design, i.e. to transform a conceptual schema given above into a collection of relational schemas. For each relational schema clearly list the names of attributes, primary key, candidate keys (if any), and foreign keys (if any). Assume, that a superset method must be used to implement a generalization.","answer":"### FLIGHT：航班定义\n\nflight_number 是航班identifier。计划时间属于航班定义。\n\n```text\nFLIGHT(\n    flight_number, origin, destination,\n    planned_departure_time, planned_arrival_time\n)\nPRIMARY KEY = (flight_number)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = none\n```\n\n### AIRPLANE：飞机\n\nregistration 是飞机identifier。\n\n```text\nAIRPLANE(registration, type, total_seats)\nPRIMARY KEY = (registration)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = none\n```\n\n### FLIGHT_INSTANCE：某日的航班实例\n\ndate 是航班与实例之间的qualifier，因此实例的primary key由 flight_number 和 flight_date 组合构成。实际起飞、到达时间在图中可选，允许 NULL。飞机一端未画数量，本答案按 UML 默认1理解为每次实例使用一架飞机。\n\n```text\nFLIGHT_INSTANCE(\n    flight_number, flight_date, gate, boarding_time,\n    departure_time, arrival_time, registration\n)\nPRIMARY KEY = (flight_number, flight_date)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (flight_number) REFERENCES FLIGHT(flight_number)\nFOREIGN KEY2 = (registration) REFERENCES AIRPLANE(registration)\n```\n\n### CREW：用超集法合并机组人员子类\n\nairline 与 employee_number 共同识别人员。用 crew_type 区分类别；飞行员填写 licence_number，乘务员此列为空。本答案假设两类互斥且覆盖记录的全部人员；若允许兼任，需要能表达多重身份的分类方式。licence_number 只在飞行员中识别人，在整张合并表中是可空唯一标识，不是识别所有人员行的非空candidate key。\n\n```text\nCREW(\n    airline, employee_number, first_name, last_name,\n    crew_type, licence_number\n)\nPRIMARY KEY = (airline, employee_number)\nCANDIDATE KEY1 = (licence_number)\nFOREIGN KEY1 = none\n```\n\n### STEWARD_QUALIFICATION：乘务员的资格\n\n一个乘务员可有多项资格，每项单独记录。foreign key只保证人员存在，不自动保证该人一定是乘务员，也不保证每位乘务员至少有一项资格。\n\n```text\nSTEWARD_QUALIFICATION(airline, employee_number, qualification)\nPRIMARY KEY = (airline, employee_number, qualification)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (airline, employee_number)\n    REFERENCES CREW(airline, employee_number)\n```\n\n### SERVICE_CREW：某次航班的人员分配\n\nrole 表示某位机组人员在某次航班实例中的服务角色，所以放在分配表，而不是人员的永久属性中。primary key包含实例的完整键和人员的完整键。本答案按每一配对记录一个角色理解。foreign key不能单独保证每次实例至少有一位服务人员。\n\n```text\nSERVICE_CREW(flight_number, flight_date, airline, employee_number, role)\nPRIMARY KEY = (flight_number, flight_date, airline, employee_number)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (flight_number, flight_date)\n     REFERENCES FLIGHT_INSTANCE(flight_number, flight_date)\nFOREIGN KEY2 = (airline, employee_number)\n     REFERENCES CREW(airline, employee_number)\n```\n\n### 图中标签对照\n\n**图中文字对照（仅翻译）**：FLIGHT 航班；FLIGHT-INSTANCE 某日的航班实例；AIRPLANE 飞机；CREW 机组人员；PILOT 飞行员；STEWARD 乘务员。flight-number 航班号；origin 始发地；destination 目的地；planned-departure-time 计划起飞时间；planned-arrival-tim（原图拼写）计划到达时间；date 日期；gate 登机口；boarding-time 登机时间；departure-time 实际起飞时间；arrival-time 实际到达时间；registration 注册号；type 类型；total-seats 总座位数；airline 航空公司；employee-number 员工号；first-name 名；last-name 姓；licence-number 执照号；qualifications 资格；role 此次服务的角色。Has 具有；Uses 使用；Services 提供服务。ID identifier；[0..1] 可选单值；[1..*] 至少一个值；* 零到多个；1..* 一个或多个；0..1 零个或一个。虚线框中的 role 是关联属性；空心三角表示泛化。","context":"","canonical":null,"parts":[{"number":"1","goal":"把航班图按superset转换成六个schemas","steps":["FLIGHT用flight_number识别；date是限定符，因此FLIGHT_INSTANCE用(flight_number,flight_date)组合识别。","AIRPLANE单独以registration作primary key；实例中保存registration foreign key。实际出发和到达时间可空，计划时间仍留在FLIGHT。","CREW的airline与employee_number共同标识人员。按superset把PILOT的licence_number放回CREW，用crew_type分类。","licence_number保留非空值唯一；课程格式可列为可选candidate key，但说明它只识别飞行员，不识别无执照号的乘务员行。","STEWARD的qualifications是multivalued，单独建STEWARD_QUALIFICATION。SERVICE_CREW处理实例与机组人员的many-to-many，role属于这次分配。","所有foreign keys都带完整组合；列出父表再列引用表。检查每实例至少一名机组、每乘务员至少一项资格等最低数量没有被普通foreign key自动实现。"],"check":"六表为FLIGHT、AIRPLANE、FLIGHT_INSTANCE、CREW、STEWARD_QUALIFICATION、SERVICE_CREW。","pitfall":"不要给FLIGHT_INSTANCE仅用date作primary key，或把role固定在CREW上。","code":""}],"tags":["Primary, candidate and composite foreign keys","Multivalued attribute transformation","Many-to-many and association attributes","Qualified association transformation","Superset method","Parent-before-child and classroom schema format"],"questionHTML":"\u003cp>Consider a conceptual schema given below.\u003c/p>\n\u003cp>\u003cimg src=\"assets/mock-2-q2.jpg\" alt=\"Original conceptual schema\">\u003c/p>\n\u003cp>Your task is to perform a step of logical database design, i.e. to transform a conceptual schema given above into a collection of relational schemas. For each relational schema clearly list the names of attributes, primary key, candidate keys (if any), and foreign keys (if any). Assume, that a superset method must be used to implement a generalization.\u003c/p>\n","answerHTML":"\u003ch3>FLIGHT：航班定义\u003c/h3>\n\u003cp>flight_number 是航班identifier。计划时间属于航班定义。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">FLIGHT(\n    flight_number, origin, destination,\n    planned_departure_time, planned_arrival_time\n)\nPRIMARY KEY = (flight_number)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = none\n\u003c/code>\u003c/pre>\n\u003ch3>AIRPLANE：飞机\u003c/h3>\n\u003cp>registration 是飞机identifier。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">AIRPLANE(registration, type, total_seats)\nPRIMARY KEY = (registration)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = none\n\u003c/code>\u003c/pre>\n\u003ch3>FLIGHT_INSTANCE：某日的航班实例\u003c/h3>\n\u003cp>date 是航班与实例之间的qualifier，因此实例的primary key由 flight_number 和 flight_date 组合构成。实际起飞、到达时间在图中可选，允许 NULL。飞机一端未画数量，本答案按 UML 默认1理解为每次实例使用一架飞机。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">FLIGHT_INSTANCE(\n    flight_number, flight_date, gate, boarding_time,\n    departure_time, arrival_time, registration\n)\nPRIMARY KEY = (flight_number, flight_date)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (flight_number) REFERENCES FLIGHT(flight_number)\nFOREIGN KEY2 = (registration) REFERENCES AIRPLANE(registration)\n\u003c/code>\u003c/pre>\n\u003ch3>CREW：用超集法合并机组人员子类\u003c/h3>\n\u003cp>airline 与 employee_number 共同识别人员。用 crew_type 区分类别；飞行员填写 licence_number，乘务员此列为空。本答案假设两类互斥且覆盖记录的全部人员；若允许兼任，需要能表达多重身份的分类方式。licence_number 只在飞行员中识别人，在整张合并表中是可空唯一标识，不是识别所有人员行的非空candidate key。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">CREW(\n    airline, employee_number, first_name, last_name,\n    crew_type, licence_number\n)\nPRIMARY KEY = (airline, employee_number)\nCANDIDATE KEY1 = (licence_number)\nFOREIGN KEY1 = none\n\u003c/code>\u003c/pre>\n\u003ch3>STEWARD_QUALIFICATION：乘务员的资格\u003c/h3>\n\u003cp>一个乘务员可有多项资格，每项单独记录。foreign key只保证人员存在，不自动保证该人一定是乘务员，也不保证每位乘务员至少有一项资格。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">STEWARD_QUALIFICATION(airline, employee_number, qualification)\nPRIMARY KEY = (airline, employee_number, qualification)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (airline, employee_number)\n    REFERENCES CREW(airline, employee_number)\n\u003c/code>\u003c/pre>\n\u003ch3>SERVICE_CREW：某次航班的人员分配\u003c/h3>\n\u003cp>role 表示某位机组人员在某次航班实例中的服务角色，所以放在分配表，而不是人员的永久属性中。primary key包含实例的完整键和人员的完整键。本答案按每一配对记录一个角色理解。foreign key不能单独保证每次实例至少有一位服务人员。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">SERVICE_CREW(flight_number, flight_date, airline, employee_number, role)\nPRIMARY KEY = (flight_number, flight_date, airline, employee_number)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (flight_number, flight_date)\n     REFERENCES FLIGHT_INSTANCE(flight_number, flight_date)\nFOREIGN KEY2 = (airline, employee_number)\n     REFERENCES CREW(airline, employee_number)\n\u003c/code>\u003c/pre>\n\u003ch3>图中标签对照\u003c/h3>\n\u003cp>\u003cstrong>图中文字对照（仅翻译）\u003c/strong>：FLIGHT 航班；FLIGHT-INSTANCE 某日的航班实例；AIRPLANE 飞机；CREW 机组人员；PILOT 飞行员；STEWARD 乘务员。flight-number 航班号；origin 始发地；destination 目的地；planned-departure-time 计划起飞时间；planned-arrival-tim（原图拼写）计划到达时间；date 日期；gate 登机口；boarding-time 登机时间；departure-time 实际起飞时间；arrival-time 实际到达时间；registration 注册号；type 类型；total-seats 总座位数；airline 航空公司；employee-number 员工号；first-name 名；last-name 姓；licence-number 执照号；qualifications 资格；role 此次服务的角色。Has 具有；Uses 使用；Services 提供服务。ID identifier；[0..1] 可选单值；[1..\u003cem>] 至少一个值；\u003c/em> 零到多个；1..* 一个或多个；0..1 零个或一个。虚线框中的 role 是关联属性；空心三角表示泛化。\u003c/p>\n"},{"id":"M2-Q3","title":"Mock Examination 2 — Question 3","topic":"银行查询与数据修改","areas":["SELECT","DDL/DML"],"source":"mock-2","sourceLabel":"Mock Examination 2","sourceNote":"User-provided Questions 1–6; Q3–Q5 text attachments","origin":"Original material","priority":"core","question":"This question is related to a sample database created through processing of the common CREATE TABLE statements above.\n\nWrite SELECT statements that implement the following queries. You can use any implementation technique for your SELECT statements.\n\n(1) For each bank find the total number of branches owned by a bank. List a bank name and the total number of branches owned by a bank. Assume that some banks do not have any branches yet. In all such cases the total number of branches must be listed as zero (0).\n\n(2) For all accounts that have no bank transactions in 2021, find the account numbers and balance on each account. List an account number and balance on each account.\n\n(3) Find the names and emails of all banks, that have at least one branch with unknow total number of employees at a branch.\n\nWrite SQL statements that implement the following structural modifications of a database and data manipulations on the contents of a database. Note, that implementation of some of the tasks listed below may need more than one SQL statement. You are not allowed to drop and/or suspend any referential integrity constraints in your implementations\n\n(4) We would like to add to a database information about the total number of bank transactions performed on each bank account. Modify the structures of a sample database in the best possible way. Insert appropriate information into the new structures of a sample database.\n\n(5) Delete from a database information about all bank transactions submitted in a year 2019. Note, that you are not allowed to drop and/or suspend any referential integrity constraints in your implementation.","answer":"### (1) 每家银行的分行数，包括0\n\n从 BANK 出发LEFT JOIN BRANCH，保留没有分行的银行。COUNT(R.bank_name) 只数匹配的分行；COUNT(*) 会把外连接保留的空匹配行也计为1。\n\n```sql\nSELECT B.bank_name, COUNT(R.bank_name) AS total_branches\nFROM BANK AS B\nLEFT JOIN BRANCH AS R\n    ON R.bank_name = B.bank_name\nGROUP BY B.bank_name;\n```\n\n### (2) 2021年没有交易的账户\n\n账户由账号与银行名共同识别，子查询必须同时匹配这两项。日期范围包含2021年1月1日，排除2022年1月1日。只有其他年份交易、或从未交易的账户，都满足题意。\n\n```sql\nSELECT A.account_num, A.balance\nFROM ACCOUNT AS A\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM `TRANSACTION` AS T\n    WHERE T.acc_num = A.account_num\n      AND T.bank_name = A.bank_name\n      AND T.tr_date_time >= '2021-01-01'\n      AND T.tr_date_time \u003c  '2022-01-01'\n);\n```\n\n### (3) 有分行员工数未知的银行\n\n未知对应 NULL，用 IS NULL 检查，不用 = NULL，也不把未知当作0。EXISTS 使一家银行即使有多个符合分行也只出现一次。\n\n```sql\nSELECT B.bank_name, B.email\nFROM BANK AS B\nWHERE EXISTS (\n    SELECT 1\n    FROM BRANCH AS R\n    WHERE R.bank_name = B.bank_name\n      AND R.total_emps IS NULL\n);\n```\n\n### (4) 增加交易总数并初始化\n\n在 ACCOUNT 中增加 total_transactions 列，再根据现有 TRANSACTION 行逐账户计数，没有交易的账户为0。这是保存的派生统计值：以后交易增删后还需要维护或重算；本次 UPDATE 只完成初始化。若用实时视图，能避免保存冗余统计，但不等于本解的“新增列并填充”。\n\n```sql\nALTER TABLE ACCOUNT\nADD COLUMN total_transactions BIGINT UNSIGNED NOT NULL DEFAULT 0;\n\nUPDATE ACCOUNT AS A\nSET total_transactions = (\n    SELECT COUNT(*)\n    FROM `TRANSACTION` AS T\n    WHERE T.acc_num = A.account_num\n      AND T.bank_name = A.bank_name\n);\n```\n\n### (5) 删除2019年交易\n\n只删除交易子表中的目标记录，无需删除账户，也无需暂停foreign key。如果本小题接在(4)之后执行，已保存的交易总数也需要重新计算。\n\n```sql\nDELETE FROM `TRANSACTION`\nWHERE tr_date_time >= '2019-01-01'\n  AND tr_date_time \u003c  '2020-01-01';\n```","context":"bank","canonical":null,"parts":[{"number":"1","goal":"每家银行的分行数，含0","steps":["BANK是必须完整保留的集合，从它出发。","LEFT JOIN BRANCH，按bank_name分组。","统计右表非空bank_name，只数真正存在的分行。"],"check":"无分行的银行一行且计数0。","pitfall":"COUNT(*)会错误地把未匹配银行算成1。","code":"```sql\nSELECT B.bank_name, COUNT(R.bank_name) AS total_branches\nFROM BANK AS B\nLEFT JOIN BRANCH AS R\n    ON R.bank_name = B.bank_name\nGROUP BY B.bank_name;\n```"},{"number":"2","goal":"找2021年无交易账户","steps":["用ACCOUNT作为外层，包括从未有任何交易的账户。","交易匹配同时比较acc_num/account_num和bank_name，避免跨银行同账号串联。","NOT EXISTS内限定时间>=2021-01-01且\u003c2022-01-01，外层取账户号和余额。"],"check":"边界2022年1月1日不算2021交易；其他年份有交易不影响入选。","pitfall":"只比较账号或用tr_date_time\u003c>某一天都会改变问题。","code":"```sql\nSELECT A.account_num, A.balance\nFROM ACCOUNT AS A\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM `TRANSACTION` AS T\n    WHERE T.acc_num = A.account_num\n      AND T.bank_name = A.bank_name\n      AND T.tr_date_time >= '2021-01-01'\n      AND T.tr_date_time \u003c  '2022-01-01'\n);\n```"},{"number":"3","goal":"找有员工数未知分行的银行","steps":["“至少一家分行”用EXISTS表达。","关联银行名，筛选BRANCH.total_emps IS NULL。","从外层BANK取银行名和邮箱，一家银行只出现一次。"],"check":"员工数0不等于未知，多家未知分行不重复输出银行。","pitfall":"total_emps = NULL不会得到普通TRUE。","code":"```sql\nSELECT B.bank_name, B.email\nFROM BANK AS B\nWHERE EXISTS (\n    SELECT 1\n    FROM BRANCH AS R\n    WHERE R.bank_name = B.bank_name\n      AND R.total_emps IS NULL\n);\n```"},{"number":"4","goal":"保存并初始化每账户交易数","steps":["按结构修改要求在ACCOUNT加total_transactions，给合适的整数类型及默认0。","对每个账户用完整复合键关联TRANSACTION，相关COUNT(*)在无匹配时返回0。","初始化只反映此时数据；以后新增/删除交易后需重新维护该stored derived value。"],"check":"所有账户有计数，未交易者为0。","pitfall":"建立view是实时计算的另一种设计，不等于本解的新增列并填充。","code":"```sql\nALTER TABLE ACCOUNT\nADD COLUMN total_transactions BIGINT UNSIGNED NOT NULL DEFAULT 0;\n\nUPDATE ACCOUNT AS A\nSET total_transactions = (\n    SELECT COUNT(*)\n    FROM `TRANSACTION` AS T\n    WHERE T.acc_num = A.account_num\n      AND T.bank_name = A.bank_name\n);\n```"},{"number":"5","goal":"删除2019年交易","steps":["目标表是交易子表TRANSACTION，不删除其所属账户。","用>=2019-01-01且\u003c2020-01-01覆盖整年所有时间。","直接删除子记录不要求关闭foreign keys；若已保存(4)计数，随后应重算。"],"check":"边界2020年1月1日保留；其他年份不受影响。","pitfall":"删除父账户会误删业务信息，并可能先遇到foreign key限制。","code":"```sql\nDELETE FROM `TRANSACTION`\nWHERE tr_date_time >= '2019-01-01'\n  AND tr_date_time \u003c  '2020-01-01';\n```"}],"tags":["NULL, empty strings and three-valued logic","JOIN and LEFT/RIGHT/FULL OUTER JOIN","Subquery-driven UPDATE and DELETE"],"questionHTML":"\u003cp>This question is related to a sample database created through processing of the common CREATE TABLE statements above.\u003c/p>\n\u003cp>Write SELECT statements that implement the following queries. You can use any implementation technique for your SELECT statements.\u003c/p>\n\u003cp>(1) For each bank find the total number of branches owned by a bank. List a bank name and the total number of branches owned by a bank. Assume that some banks do not have any branches yet. In all such cases the total number of branches must be listed as zero (0).\u003c/p>\n\u003cp>(2) For all accounts that have no bank transactions in 2021, find the account numbers and balance on each account. List an account number and balance on each account.\u003c/p>\n\u003cp>(3) Find the names and emails of all banks, that have at least one branch with unknow total number of employees at a branch.\u003c/p>\n\u003cp>Write SQL statements that implement the following structural modifications of a database and data manipulations on the contents of a database. Note, that implementation of some of the tasks listed below may need more than one SQL statement. You are not allowed to drop and/or suspend any referential integrity constraints in your implementations\u003c/p>\n\u003cp>(4) We would like to add to a database information about the total number of bank transactions performed on each bank account. Modify the structures of a sample database in the best possible way. Insert appropriate information into the new structures of a sample database.\u003c/p>\n\u003cp>(5) Delete from a database information about all bank transactions submitted in a year 2019. Note, that you are not allowed to drop and/or suspend any referential integrity constraints in your implementation.\u003c/p>\n","answerHTML":"\u003ch3>(1) 每家银行的分行数，包括0\u003c/h3>\n\u003cp>从 BANK 出发LEFT JOIN BRANCH，保留没有分行的银行。COUNT(R.bank_name) 只数匹配的分行；COUNT(*) 会把外连接保留的空匹配行也计为1。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">SELECT B.bank_name, COUNT(R.bank_name) AS total_branches\nFROM BANK AS B\nLEFT JOIN BRANCH AS R\n    ON R.bank_name = B.bank_name\nGROUP BY B.bank_name;\n\u003c/code>\u003c/pre>\n\u003ch3>(2) 2021年没有交易的账户\u003c/h3>\n\u003cp>账户由账号与银行名共同识别，子查询必须同时匹配这两项。日期范围包含2021年1月1日，排除2022年1月1日。只有其他年份交易、或从未交易的账户，都满足题意。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">SELECT A.account_num, A.balance\nFROM ACCOUNT AS A\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM `TRANSACTION` AS T\n    WHERE T.acc_num = A.account_num\n      AND T.bank_name = A.bank_name\n      AND T.tr_date_time &gt;= &#39;2021-01-01&#39;\n      AND T.tr_date_time &lt;  &#39;2022-01-01&#39;\n);\n\u003c/code>\u003c/pre>\n\u003ch3>(3) 有分行员工数未知的银行\u003c/h3>\n\u003cp>未知对应 NULL，用 IS NULL 检查，不用 = NULL，也不把未知当作0。EXISTS 使一家银行即使有多个符合分行也只出现一次。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">SELECT B.bank_name, B.email\nFROM BANK AS B\nWHERE EXISTS (\n    SELECT 1\n    FROM BRANCH AS R\n    WHERE R.bank_name = B.bank_name\n      AND R.total_emps IS NULL\n);\n\u003c/code>\u003c/pre>\n\u003ch3>(4) 增加交易总数并初始化\u003c/h3>\n\u003cp>在 ACCOUNT 中增加 total_transactions 列，再根据现有 TRANSACTION 行逐账户计数，没有交易的账户为0。这是保存的派生统计值：以后交易增删后还需要维护或重算；本次 UPDATE 只完成初始化。若用实时视图，能避免保存冗余统计，但不等于本解的“新增列并填充”。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">ALTER TABLE ACCOUNT\nADD COLUMN total_transactions BIGINT UNSIGNED NOT NULL DEFAULT 0;\n\nUPDATE ACCOUNT AS A\nSET total_transactions = (\n    SELECT COUNT(*)\n    FROM `TRANSACTION` AS T\n    WHERE T.acc_num = A.account_num\n      AND T.bank_name = A.bank_name\n);\n\u003c/code>\u003c/pre>\n\u003ch3>(5) 删除2019年交易\u003c/h3>\n\u003cp>只删除交易子表中的目标记录，无需删除账户，也无需暂停foreign key。如果本小题接在(4)之后执行，已保存的交易总数也需要重新计算。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">DELETE FROM `TRANSACTION`\nWHERE tr_date_time &gt;= &#39;2019-01-01&#39;\n  AND tr_date_time &lt;  &#39;2020-01-01&#39;;\n\u003c/code>\u003c/pre>\n"},{"id":"M2-Q4","title":"Mock Examination 2 — Question 4","topic":"数据库审计","areas":["扩展"],"source":"mock-2","sourceLabel":"Mock Examination 2","sourceNote":"User-provided Questions 1–6; Q3–Q5 text attachments","origin":"Original material","priority":"extension","question":"This question is related to a sample database created through processing of the common CREATE TABLE statements above.\n\nAn objective of this question is to explain how to implement a simple method of auditing the database activities.\n\nAssume, that a database administrator would like to audit the data manipulation statements (INSERT, UPDATE, DELETE) processed by a selected group of users on a selected group of relational tables. Write SQL statements and in the comments provide the comprehensive explanation of a role of SQL statement plays in the implementation of a simple database auditing system.","answer":"这是原模拟保留的扩展题。此方法记录收到的语句，不证明语句执行成功或已经提交。\n\n简单文本筛选可能漏掉或误选复杂语句；它不是通用 SQL 解析器。按行记录的触发器审计也不同于语句日志：一条语句可能改多行、零行，且事务回滚会影响行审计记录。\n\n### 简单审计示例\n\n本例由管理员开启 MySQL general query log，保存收到的语句，再从中筛选指定用户和表。假定目标用户为 admin、clerk，目标表为 banks.ACCOUNT 和 banks.TRANSACTION；并假定他们在审计期间只访问 banks，使用普通单表 INSERT、UPDATE、DELETE。SQL 注释逐步说明作用。\n\n```sql\n-- 1. 由 DBA 保存现有日志设置，以便审计后恢复。\nSET @old_general_log = @@GLOBAL.general_log;\nSET @old_log_output = @@GLOBAL.log_output;\n\n-- 2. 暂停日志写入，设置 TABLE 输出，再启用日志。\n-- TABLE 让后续 SQL 可以从 mysql.general_log 查询日志。\nSET GLOBAL general_log = 'OFF';\nSET GLOBAL log_output = 'TABLE';\nSET @audit_start = NOW(6);\nSET GLOBAL general_log = 'ON';\n\n-- 3. 现在由被审计用户在各自连接中执行待审计操作。\n-- DBA 保留当前连接，等待指定的审计期间结束。\n-- 不能把审计用户的操作改在 root 连接中执行，否则用户身份不对。\n\n-- 4. 审计期间结束后停止写入，记录结束时间。\nSET GLOBAL general_log = 'OFF';\nSET @audit_end = NOW(6);\n\n-- 5. 将期间内指定用户的 DML 日志筛选并保存为普通报告表。\n-- user_host 包含用户名及连接来源；这里取左方的用户名。\n-- argument 是语句内容，先转成字符文本再进行正则匹配。\n-- 第一项正则选 INSERT、UPDATE、DELETE；第二项选目标表名。\nCREATE TABLE banks.AUDIT_REPORT AS\nSELECT event_time,\n       user_host,\n       thread_id,\n       CONVERT(argument USING utf8mb4) AS statement_text\nFROM mysql.general_log\nWHERE event_time >= @audit_start\n  AND event_time \u003c= @audit_end\n  AND command_type = 'Query'\n  AND SUBSTRING_INDEX(user_host, '[', 1) IN ('admin', 'clerk')\n  AND REGEXP_LIKE(\n      CONVERT(argument USING utf8mb4),\n      '^[[:space:]]*(INSERT|UPDATE|DELETE)[[:space:]]', 'i'\n  )\n  AND REGEXP_LIKE(\n      CONVERT(argument USING utf8mb4),\n      '(^|[^[:alnum:]_])(ACCOUNT|TRANSACTION)([^[:alnum:]_]|$)', 'i'\n  );\n\n-- 6. 查看谁、何时、在哪个连接提交了什么语句。\nSELECT event_time, user_host, thread_id, statement_text\nFROM banks.AUDIT_REPORT\nORDER BY event_time, thread_id;\n\n-- 7. 报告表由 DBA 管理；不给被审计用户修改报告的权限。\n-- 恢复审计前的日志输出方式与开关状态。\nSET GLOBAL log_output = @old_log_output;\nSET GLOBAL general_log = @old_general_log;\n```","context":"bank","canonical":null,"parts":[{"number":"1","goal":"说明简单语句日志审计的完整工作流","steps":["先界定审计对象是收到的INSERT/UPDATE/DELETE语句，而非已提交行变化；给出选定用户和表的具体示例。","管理员保存当前general_log与log_output配置，在审计起点启用TABLE输出。","让被审计用户在各自连接中处理操作，结束后记录截止时间并停止写入。不能在root连接冒充这些用户操作。","从mysql.general_log按期间、用户、语句类别、目标表筛选，保存报告并查看。","恢复原设置，说明文本筛选的限制：复杂语句、跨库同名表、prepared statements等可能漏选误选。日志不等同于提交成功证明。"],"check":"每条SQL都有解释，并保留“语句审计”和“触发器行审计”的差别。","pitfall":"触发器对零行修改不触发，回滚也影响行审计，不能宣称它记录所有收到的SQL语句。","code":"```sql\n-- 1. 由 DBA 保存现有日志设置，以便审计后恢复。\nSET @old_general_log = @@GLOBAL.general_log;\nSET @old_log_output = @@GLOBAL.log_output;\n\n-- 2. 暂停日志写入，设置 TABLE 输出，再启用日志。\n-- TABLE 让后续 SQL 可以从 mysql.general_log 查询日志。\nSET GLOBAL general_log = 'OFF';\nSET GLOBAL log_output = 'TABLE';\nSET @audit_start = NOW(6);\nSET GLOBAL general_log = 'ON';\n\n-- 3. 现在由被审计用户在各自连接中执行待审计操作。\n-- DBA 保留当前连接，等待指定的审计期间结束。\n-- 不能把审计用户的操作改在 root 连接中执行，否则用户身份不对。\n\n-- 4. 审计期间结束后停止写入，记录结束时间。\nSET GLOBAL general_log = 'OFF';\nSET @audit_end = NOW(6);\n\n-- 5. 将期间内指定用户的 DML 日志筛选并保存为普通报告表。\n-- user_host 包含用户名及连接来源；这里取左方的用户名。\n-- argument 是语句内容，先转成字符文本再进行正则匹配。\n-- 第一项正则选 INSERT、UPDATE、DELETE；第二项选目标表名。\nCREATE TABLE banks.AUDIT_REPORT AS\nSELECT event_time,\n       user_host,\n       thread_id,\n       CONVERT(argument USING utf8mb4) AS statement_text\nFROM mysql.general_log\nWHERE event_time >= @audit_start\n  AND event_time \u003c= @audit_end\n  AND command_type = 'Query'\n  AND SUBSTRING_INDEX(user_host, '[', 1) IN ('admin', 'clerk')\n  AND REGEXP_LIKE(\n      CONVERT(argument USING utf8mb4),\n      '^[[:space:]]*(INSERT|UPDATE|DELETE)[[:space:]]', 'i'\n  )\n  AND REGEXP_LIKE(\n      CONVERT(argument USING utf8mb4),\n      '(^|[^[:alnum:]_])(ACCOUNT|TRANSACTION)([^[:alnum:]_]|$)', 'i'\n  );\n\n-- 6. 查看谁、何时、在哪个连接提交了什么语句。\nSELECT event_time, user_host, thread_id, statement_text\nFROM banks.AUDIT_REPORT\nORDER BY event_time, thread_id;\n\n-- 7. 报告表由 DBA 管理；不给被审计用户修改报告的权限。\n-- 恢复审计前的日志输出方式与开关状态。\nSET GLOBAL log_output = @old_log_output;\nSET GLOBAL general_log = @old_general_log;\n```"}],"tags":["Statement auditing and concurrency conditions"],"questionHTML":"\u003cp>This question is related to a sample database created through processing of the common CREATE TABLE statements above.\u003c/p>\n\u003cp>An objective of this question is to explain how to implement a simple method of auditing the database activities.\u003c/p>\n\u003cp>Assume, that a database administrator would like to audit the data manipulation statements (INSERT, UPDATE, DELETE) processed by a selected group of users on a selected group of relational tables. Write SQL statements and in the comments provide the comprehensive explanation of a role of SQL statement plays in the implementation of a simple database auditing system.\u003c/p>\n","answerHTML":"\u003cp>这是原模拟保留的扩展题。此方法记录收到的语句，不证明语句执行成功或已经提交。\u003c/p>\n\u003cp>简单文本筛选可能漏掉或误选复杂语句；它不是通用 SQL 解析器。按行记录的触发器审计也不同于语句日志：一条语句可能改多行、零行，且事务回滚会影响行审计记录。\u003c/p>\n\u003ch3>简单审计示例\u003c/h3>\n\u003cp>本例由管理员开启 MySQL general query log，保存收到的语句，再从中筛选指定用户和表。假定目标用户为 admin、clerk，目标表为 banks.ACCOUNT 和 banks.TRANSACTION；并假定他们在审计期间只访问 banks，使用普通单表 INSERT、UPDATE、DELETE。SQL 注释逐步说明作用。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- 1. 由 DBA 保存现有日志设置，以便审计后恢复。\nSET @old_general_log = @@GLOBAL.general_log;\nSET @old_log_output = @@GLOBAL.log_output;\n\n-- 2. 暂停日志写入，设置 TABLE 输出，再启用日志。\n-- TABLE 让后续 SQL 可以从 mysql.general_log 查询日志。\nSET GLOBAL general_log = &#39;OFF&#39;;\nSET GLOBAL log_output = &#39;TABLE&#39;;\nSET @audit_start = NOW(6);\nSET GLOBAL general_log = &#39;ON&#39;;\n\n-- 3. 现在由被审计用户在各自连接中执行待审计操作。\n-- DBA 保留当前连接，等待指定的审计期间结束。\n-- 不能把审计用户的操作改在 root 连接中执行，否则用户身份不对。\n\n-- 4. 审计期间结束后停止写入，记录结束时间。\nSET GLOBAL general_log = &#39;OFF&#39;;\nSET @audit_end = NOW(6);\n\n-- 5. 将期间内指定用户的 DML 日志筛选并保存为普通报告表。\n-- user_host 包含用户名及连接来源；这里取左方的用户名。\n-- argument 是语句内容，先转成字符文本再进行正则匹配。\n-- 第一项正则选 INSERT、UPDATE、DELETE；第二项选目标表名。\nCREATE TABLE banks.AUDIT_REPORT AS\nSELECT event_time,\n       user_host,\n       thread_id,\n       CONVERT(argument USING utf8mb4) AS statement_text\nFROM mysql.general_log\nWHERE event_time &gt;= @audit_start\n  AND event_time &lt;= @audit_end\n  AND command_type = &#39;Query&#39;\n  AND SUBSTRING_INDEX(user_host, &#39;[&#39;, 1) IN (&#39;admin&#39;, &#39;clerk&#39;)\n  AND REGEXP_LIKE(\n      CONVERT(argument USING utf8mb4),\n      &#39;^[[:space:]]*(INSERT|UPDATE|DELETE)[[:space:]]&#39;, &#39;i&#39;\n  )\n  AND REGEXP_LIKE(\n      CONVERT(argument USING utf8mb4),\n      &#39;(^|[^[:alnum:]_])(ACCOUNT|TRANSACTION)([^[:alnum:]_]|$)&#39;, &#39;i&#39;\n  );\n\n-- 6. 查看谁、何时、在哪个连接提交了什么语句。\nSELECT event_time, user_host, thread_id, statement_text\nFROM banks.AUDIT_REPORT\nORDER BY event_time, thread_id;\n\n-- 7. 报告表由 DBA 管理；不给被审计用户修改报告的权限。\n-- 恢复审计前的日志输出方式与开关状态。\nSET GLOBAL log_output = @old_log_output;\nSET GLOBAL general_log = @old_general_log;\n\u003c/code>\u003c/pre>\n"},{"id":"M2-Q5","title":"Mock Examination 2 — Question 5","topic":"banks 数据库与 admin 权限","areas":["Access"],"source":"mock-2","sourceLabel":"Mock Examination 2","sourceNote":"User-provided Questions 1–6; Q3–Q5 text attachments Public edition: example names, contact details and password literals anonymized.","origin":"Original material","priority":"core","question":"This question is related to a sample database created through processing of the common CREATE TABLE statements above.\n\nAssume that CREATE TABLE statements listed above are included in SQL script dbcreate.sql. The script is located at a folder $HOME/bank/sql. Write the implementations of the operations listed below as a user root. Assume that a user root has already connected to the database. Assume, that user root has access to SQL script dbcreate.sql. Note, that implementation of some operations may need more than one SQL statement.\n\n(1) A user root with a password '[ROOT_OR_USER_PASSWORD]' would like to create a database called banks and nominate the database as its default database.\n\n(2) A user root would like to create within a database banks, the relational tables given on page 3 of the examination paper.\n\n(3) Then, a user root would like to create a new user account called admin with a password '[ROOT_OR_USER_PASSWORD]'.\n\n(4) A user admin must have the rights to execute CREATE TABLE and CREATE VIEW statements with the rights to propagate the privilege to the other users.\n\n(5) A user admin must have the rights to read information about all bank transactions submitted in 2021 with no rights to propagate the privilege to the other users.","answer":"### (1) 创建并选定banks数据库\n\nroot 已连接，不用重新登录，也不用把登录密码写进 CREATE DATABASE。\n\n```sql\nCREATE DATABASE banks;\nUSE banks;\n```\n\n### (2) 在mysql客户端处理建表脚本\n\nSOURCE 是 mysql 客户端命令。这里用 ~ 表示运行客户端的操作系统用户主目录；如果环境不展开它，换成实际绝对路径。不能把数据库 root 身份当成操作系统 /root，也不能假定客户端会像 shell 一样展开字面量 $HOME。\n\n```text\nSOURCE ~/bank/sql/dbcreate.sql;\n```\n\n### (3) 创建admin账号\n\n账号主机按 localhost 处理；公开版密码使用[CHOOSE_PASSWORD]占位，练习时自行选择。\n\n```sql\nCREATE USER 'admin'@'localhost' IDENTIFIED BY '[CHOOSE_PASSWORD]';\n```\n\n### (4) 授予建表和建视图权限，并允许转授\n\nCREATE 用于建表；CREATE VIEW 是独立权限。WITH GRANT OPTION 允许转授对应范围的对象权限。\n\n```sql\nGRANT CREATE, CREATE VIEW ON banks.*\nTO 'admin'@'localhost'\nWITH GRANT OPTION;\n```\n\n### (5) 只开放2021年交易的读取\n\n视图限定行范围，使用包含2021年起点、排除2022年起点的条件。为同时满足(4)和(5)，本解把只读视图放在单独的 bank_reports 数据库：admin 在 banks.* 已有数据库级 GRANT OPTION，若视图也放在 banks 中，单纯在新 GRANT 中省略这个选项，不一定能阻止转授新获得的读取权。root 创建定义者权限视图后，只开放该视图，不开放底表。\n\n```sql\nCREATE DATABASE bank_reports;\n\nCREATE SQL SECURITY DEFINER VIEW bank_reports.TRANSACTIONS_2021 AS\nSELECT acc_num, bank_name, tr_date_time, amount, type\nFROM banks.`TRANSACTION`\nWHERE tr_date_time >= '2021-01-01'\n  AND tr_date_time \u003c  '2022-01-01';\n\nGRANT SELECT ON bank_reports.TRANSACTIONS_2021\nTO 'admin'@'localhost';\n```","context":"bank","canonical":null,"parts":[{"number":"1","goal":"创建banks并设为默认","steps":["root已连接，CREATE DATABASE banks即可创建。","再USE banks，把后续无数据库前缀的操作指向它。","root密码用于连接验证，不是CREATE DATABASE的参数。"],"check":"两条语句顺序正确。","pitfall":"不要把操作系统文件夹创建命令当作建数据库。","code":"```sql\nCREATE DATABASE banks;\nUSE banks;\n```"},{"number":"2","goal":"处理dbcreate.sql脚本","steps":["操作在mysql命令行客户端中，不是普通SELECT语句。","SOURCE指向运行客户端的操作系统用户主目录下bank/sql/dbcreate.sql。","客户端不支持路径展开时，用真实绝对路径替换~；不要假定数据库root意味着/root。"],"check":"脚本中的表创建在已选定banks中。","pitfall":"$HOME字面量不保证像shell变量一样被mysql客户端展开。","code":"```text\nSOURCE ~/bank/sql/dbcreate.sql;\n```"},{"number":"3","goal":"创建admin账号","steps":["使用CREATE USER，而不是往mysql.user手工插入。","统一账号host为localhost。","IDENTIFIED BY填写题目指定admin；环境密码策略是另外的运行条件。"],"check":"后续GRANT使用相同用户名和host。","pitfall":"题面root密码与新用户密码不能相互替代。","code":"```sql\nCREATE USER 'admin'@'localhost' IDENTIFIED BY '[CHOOSE_PASSWORD]';\n```"},{"number":"4","goal":"授予建表/建view及转授权","steps":["CREATE与CREATE VIEW是两个privileges，分别列出。","目标范围banks.*，不需要把权限扩大到*.*。","WITH GRANT OPTION使admin可以转授该层级所拥有的权限。"],"check":"既可CREATE TABLE，又可CREATE VIEW。","pitfall":"GRANT OPTION的已有范围会影响下一个小题，不能把各GRANT永远孤立看待。","code":"```sql\nGRANT CREATE, CREATE VIEW ON banks.*\nTO 'admin'@'localhost'\nWITH GRANT OPTION;\n```"},{"number":"5","goal":"开放2021交易且不可再转授","steps":["先用view的WHERE限定2021时间范围，不开放整张TRANSACTION。","考虑admin在banks.*已有GRANT OPTION；仅省略新语句的WITH GRANT OPTION未必能禁止传播。","本解由root在独立bank_reports建立SQL SECURITY DEFINER view，只授该view的SELECT，不授bank_reports的GRANT OPTION。"],"check":"按连续执行的小题理解，同时满足可转授DDL和不可转授这份报告。","pitfall":"把报告view也放在已获数据库级GRANT OPTION的banks中，容易造成意外可转授。","code":"```sql\nCREATE DATABASE bank_reports;\n\nCREATE SQL SECURITY DEFINER VIEW bank_reports.TRANSACTIONS_2021 AS\nSELECT acc_num, bank_name, tr_date_time, amount, type\nFROM banks.`TRANSACTION`\nWHERE tr_date_time >= '2021-01-01'\n  AND tr_date_time \u003c  '2022-01-01';\n\nGRANT SELECT ON bank_reports.TRANSACTIONS_2021\nTO 'admin'@'localhost';\n```"}],"tags":["CREATE/ALTER/DROP USER and database management","Database/table/column scopes and GRANT OPTION","Views for restricted rows/columns and summaries"],"questionHTML":"\u003cp>This question is related to a sample database created through processing of the common CREATE TABLE statements above.\u003c/p>\n\u003cp>Assume that CREATE TABLE statements listed above are included in SQL script dbcreate.sql. The script is located at a folder $HOME/bank/sql. Write the implementations of the operations listed below as a user root. Assume that a user root has already connected to the database. Assume, that user root has access to SQL script dbcreate.sql. Note, that implementation of some operations may need more than one SQL statement.\u003c/p>\n\u003cp>(1) A user root with a password &#39;[ROOT_OR_USER_PASSWORD]&#39; would like to create a database called banks and nominate the database as its default database.\u003c/p>\n\u003cp>(2) A user root would like to create within a database banks, the relational tables given on page 3 of the examination paper.\u003c/p>\n\u003cp>(3) Then, a user root would like to create a new user account called admin with a password &#39;[ROOT_OR_USER_PASSWORD]&#39;.\u003c/p>\n\u003cp>(4) A user admin must have the rights to execute CREATE TABLE and CREATE VIEW statements with the rights to propagate the privilege to the other users.\u003c/p>\n\u003cp>(5) A user admin must have the rights to read information about all bank transactions submitted in 2021 with no rights to propagate the privilege to the other users.\u003c/p>\n","answerHTML":"\u003ch3>(1) 创建并选定banks数据库\u003c/h3>\n\u003cp>root 已连接，不用重新登录，也不用把登录密码写进 CREATE DATABASE。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">CREATE DATABASE banks;\nUSE banks;\n\u003c/code>\u003c/pre>\n\u003ch3>(2) 在mysql客户端处理建表脚本\u003c/h3>\n\u003cp>SOURCE 是 mysql 客户端命令。这里用 ~ 表示运行客户端的操作系统用户主目录；如果环境不展开它，换成实际绝对路径。不能把数据库 root 身份当成操作系统 /root，也不能假定客户端会像 shell 一样展开字面量 $HOME。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">SOURCE ~/bank/sql/dbcreate.sql;\n\u003c/code>\u003c/pre>\n\u003ch3>(3) 创建admin账号\u003c/h3>\n\u003cp>账号主机按 localhost 处理；公开版密码使用[CHOOSE_PASSWORD]占位，练习时自行选择。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">CREATE USER &#39;admin&#39;@&#39;localhost&#39; IDENTIFIED BY &#39;[CHOOSE_PASSWORD]&#39;;\n\u003c/code>\u003c/pre>\n\u003ch3>(4) 授予建表和建视图权限，并允许转授\u003c/h3>\n\u003cp>CREATE 用于建表；CREATE VIEW 是独立权限。WITH GRANT OPTION 允许转授对应范围的对象权限。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">GRANT CREATE, CREATE VIEW ON banks.*\nTO &#39;admin&#39;@&#39;localhost&#39;\nWITH GRANT OPTION;\n\u003c/code>\u003c/pre>\n\u003ch3>(5) 只开放2021年交易的读取\u003c/h3>\n\u003cp>视图限定行范围，使用包含2021年起点、排除2022年起点的条件。为同时满足(4)和(5)，本解把只读视图放在单独的 bank_reports 数据库：admin 在 banks.* 已有数据库级 GRANT OPTION，若视图也放在 banks 中，单纯在新 GRANT 中省略这个选项，不一定能阻止转授新获得的读取权。root 创建定义者权限视图后，只开放该视图，不开放底表。\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">CREATE DATABASE bank_reports;\n\nCREATE SQL SECURITY DEFINER VIEW bank_reports.TRANSACTIONS_2021 AS\nSELECT acc_num, bank_name, tr_date_time, amount, type\nFROM banks.`TRANSACTION`\nWHERE tr_date_time &gt;= &#39;2021-01-01&#39;\n  AND tr_date_time &lt;  &#39;2022-01-01&#39;;\n\nGRANT SELECT ON bank_reports.TRANSACTIONS_2021\nTO &#39;admin&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"},{"id":"M2-Q6","title":"Mock Examination 2 — Question 6","topic":"两组并发事务","areas":["扩展"],"source":"mock-2","sourceLabel":"Mock Examination 2","sourceNote":"User-provided Questions 1–6; Q3–Q5 text attachments","origin":"Original material","priority":"extension","question":"This question is related to a sample database created through processing of the common CREATE TABLE statements above.\n\n(1) Consider a bank that has a name NAB. Assume, that at the moment, the balance on account number 1 is equal to 100. Assume, that at the moment, the balance on account number 2 is equal to 200.\n\nAssume, that concurrently processed database transactions T1 and T2 interleaved their operations in a way listed below.\n\n```text\nT1                                           T2\nSET TRANSACTION ISOLATION LEVEL SERIALIZABLE;\n                                             SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;\nUPDATE ACCOUNT\nSET balance = balance + 10\nWHERE account_num = 1 AND\n      bank_name = 'NAB';\n                                             UPDATE ACCOUNT\n                                             SET balance = balance + 20\n                                             WHERE account_num = 1 AND\n                                                   bank_name = 'NAB';\n\nUPDATE ACCOUNT\nSET balance = (SELECT balance + 10\n               FROM ACCOUNT\n               WHERE account_num = 1 AND\n                     bank_name = 'NAB')\nWHERE account_num = 1 AND\n      bank_name = 'NAB';\n\nCOMMIT;\n                                             COMMIT;\n```\n\n(1) Explain how the values of an attribute balance in the rows where account_num = 1 and account_num = 2 in NAB bank change after each UPDATE statement.\n\n(2) Consider a bank that has a name NAB. Assume, that at the moment, the balance on account number 1 is equal to 100. Assume, that at the moment, the balance on account number 2 is equal to 200.\n\nAssume, that concurrently processed database transactions T1 and T2 interleaved their operations in a way listed below.\n\n```text\nT1                                              T2\nSET TRANSACTION ISOLATION LEVEL READ COMMITTED;\n                                                SET TRANSACTION ISOLATION LEVEL READ UNCOMMITTED;\nUPDATE ACCOUNT\nSET balance = balance + 10\nWHERE account_num = 1 AND\n      bank_name = 'NAB';\n                                                UPDATE ACCOUNT\n                                                SET balance = balance + 20\n                                                WHERE account_num = 2 AND\n                                                      bank_name = 'NAB';\n                                                COMMIT;\nUPDATE ACCOUNT\nSET balance = (SELECT balance + 10\n               FROM ACCOUNT\n               WHERE account_num = 2 AND\n                     bank_name = 'NAB')\nWHERE account_num = 1 AND\n      bank_name = 'NAB';\nCOMMIT;\n```\n\nExplain how the values of an attribute balance in the rows where account_num = 1 and account_num = 2 change after processing of each UPDATE statement.\n\nAnswer text Question 6","answer":"本题要区分“题目想说明的账户变化”和“把原 SQL 直接放到某一数据库中能否运行”。以下先假设两个事务已经开始，并以等价、可执行的语句完成题目描述的操作。\n\n### (1) 两个事务都为SERIALIZABLE\n\n1. T1 先把账户1从100改到110；账户2仍为200。\n2. T2 也要修改账户1，在 T1 持锁期间等待，此时尚未成功增加20。\n3. T1 能读到自己的110，再增加10，把账户1改到120；账户2仍为200。\n4. T1 提交之后，T2 怎样继续取决于具体数据库的冲突处理规则。\n\n| 采用的环境 | T2后续处理 | 最终余额：账户1、账户2 |\n| --- | --- | --- |\n| MySQL InnoDB，显式事务，等待未超时，使用等价合法SQL | 等待结束后读取当前120，再加20并提交 | 140、200 |\n| lecture B第13份事务讲义第16–17页的Oracle示例规则，且不重试 | 冲突的修改发生serialization error，未成功加20 | 120、200 |\n\n不能只凭 SERIALIZABLE 这个级别名称，认定所有数据库的等待或失败行为完全相同。\n\n在 MySQL 中，T1 第二次“给同一账户再加10”可等价写为：\n\n```sql\nUPDATE ACCOUNT\nSET balance = balance + 10\nWHERE account_num = 1\n  AND bank_name = 'NAB';\n```\n\n### (2) T1为READ COMMITTED，T2为READ UNCOMMITTED\n\n本小题重新从100、200开始。\n\n| 操作 | 账户1 | 账户2 |\n| --- | ---: | ---: |\n| T1给账户1加10 | 110，未提交 | 200 |\n| T2给账户2加20 | 110，未提交 | 220，未提交 |\n| T2提交 | 110，未提交 | 220，已提交 |\n| T1读取账户2的220，加10后赋给账户1 | 230，未提交 | 220 |\n| T1提交 | 230，已提交 | 220 |\n\n这里是把“账户2余额+10”整个结果写入账户1，不是在账户1的110上继续加10。T2已在读取前提交，所以这个顺序没有脏读。隔离级别允许某类现象，不表示本次一定出现该现象。\n\nMySQL中的等价self-join写法如下：\n\n```sql\nUPDATE ACCOUNT AS A1\nJOIN ACCOUNT AS A2\n    ON A2.account_num = 2\n   AND A2.bank_name = 'NAB'\nSET A1.balance = A2.balance + 10\nWHERE A1.account_num = 1\n  AND A1.bank_name = 'NAB';\n```\n\n### 字面执行原SQL时还缺少的条件\n\n原题没有列 START TRANSACTION；SET TRANSACTION 本身不会开启跨多条语句的显式事务。原题直接在 UPDATE ACCOUNT 的子查询中读取 ACCOUNT，还涉及 MySQL 的 Error 1093 限制，失败的更新不能算成已经改好余额。\n\n若保留 MySQL 默认自动提交、字面执行原题，且出错后继续运行，(1)余额会是130、200，(2)会是110、220；两小题的第二次 T1 UPDATE 都未成功。因此上面的不同结果属于不同执行条件，不是同一条件下有多个随意答案。参考资料不把其中一种冒充学校官方判分结论。","context":"bank","canonical":null,"parts":[{"number":"1","goal":"追踪同账户写冲突，并写明数据库模型","steps":["分别记录两个事务的操作，不把等待的UPDATE算作已经成功。T1先将账户1从100变110。","T2请求同一行，在T1持锁时等待；T1第二次能读自己的110，再写120并提交。","MySQL InnoDB合法等价SQL下，等待未超时则T2随后在120上加20得到140；课件Oracle SERIALIZABLE模型可能发生serialization error，未重试则保持120。","账户2未被任何语句修改，始终200。最后区分题意事务与字面MySQL SQL：原文缺START TRANSACTION，且同表子查询UPDATE可能Error1093。"],"check":"对140或120写明条件；原SQL失败不能当成功更新。","pitfall":"SERIALIZABLE规定可串行化语义，不承诺每种DBMS用完全相同的等待/重试机制。","code":"```sql\nUPDATE ACCOUNT\nSET balance = balance + 10\nWHERE account_num = 1\n  AND bank_name = 'NAB';\n```"},{"number":"2","goal":"追踪跨账户赋值","steps":["本小题重新从100、200开始，不沿用上一题余额。","T1把账户1加到110，T2把账户2加到220并提交。","T1再读取账户2的220，把220+10整个结果赋给账户1，所以得到230，而非120。","T1提交后余额为230、220；读取发生在T2提交后，这条顺序没有dirty read。实际MySQL示范使用合法self-join并显式开事务。"],"check":"READ UNCOMMITTED允许某些现象，不代表本次一定读取到未提交数据。","pitfall":"把SET balance=(账户2+10)误算成“账户1再加10”。","code":"```sql\nUPDATE ACCOUNT AS A1\nJOIN ACCOUNT AS A2\n    ON A2.account_num = 2\n   AND A2.bank_name = 'NAB'\nSET A1.balance = A2.balance + 10\nWHERE A1.account_num = 1\n  AND A1.bank_name = 'NAB';\n```"}],"tags":["Statement auditing and concurrency conditions"],"questionHTML":"\u003cp>This question is related to a sample database created through processing of the common CREATE TABLE statements above.\u003c/p>\n\u003cp>(1) Consider a bank that has a name NAB. Assume, that at the moment, the balance on account number 1 is equal to 100. Assume, that at the moment, the balance on account number 2 is equal to 200.\u003c/p>\n\u003cp>Assume, that concurrently processed database transactions T1 and T2 interleaved their operations in a way listed below.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">T1                                           T2\nSET TRANSACTION ISOLATION LEVEL SERIALIZABLE;\n                                             SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;\nUPDATE ACCOUNT\nSET balance = balance + 10\nWHERE account_num = 1 AND\n      bank_name = &#39;NAB&#39;;\n                                             UPDATE ACCOUNT\n                                             SET balance = balance + 20\n                                             WHERE account_num = 1 AND\n                                                   bank_name = &#39;NAB&#39;;\n\nUPDATE ACCOUNT\nSET balance = (SELECT balance + 10\n               FROM ACCOUNT\n               WHERE account_num = 1 AND\n                     bank_name = &#39;NAB&#39;)\nWHERE account_num = 1 AND\n      bank_name = &#39;NAB&#39;;\n\nCOMMIT;\n                                             COMMIT;\n\u003c/code>\u003c/pre>\n\u003cp>(1) Explain how the values of an attribute balance in the rows where account_num = 1 and account_num = 2 in NAB bank change after each UPDATE statement.\u003c/p>\n\u003cp>(2) Consider a bank that has a name NAB. Assume, that at the moment, the balance on account number 1 is equal to 100. Assume, that at the moment, the balance on account number 2 is equal to 200.\u003c/p>\n\u003cp>Assume, that concurrently processed database transactions T1 and T2 interleaved their operations in a way listed below.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">T1                                              T2\nSET TRANSACTION ISOLATION LEVEL READ COMMITTED;\n                                                SET TRANSACTION ISOLATION LEVEL READ UNCOMMITTED;\nUPDATE ACCOUNT\nSET balance = balance + 10\nWHERE account_num = 1 AND\n      bank_name = &#39;NAB&#39;;\n                                                UPDATE ACCOUNT\n                                                SET balance = balance + 20\n                                                WHERE account_num = 2 AND\n                                                      bank_name = &#39;NAB&#39;;\n                                                COMMIT;\nUPDATE ACCOUNT\nSET balance = (SELECT balance + 10\n               FROM ACCOUNT\n               WHERE account_num = 2 AND\n                     bank_name = &#39;NAB&#39;)\nWHERE account_num = 1 AND\n      bank_name = &#39;NAB&#39;;\nCOMMIT;\n\u003c/code>\u003c/pre>\n\u003cp>Explain how the values of an attribute balance in the rows where account_num = 1 and account_num = 2 change after processing of each UPDATE statement.\u003c/p>\n\u003cp>Answer text Question 6\u003c/p>\n","answerHTML":"\u003cp>本题要区分“题目想说明的账户变化”和“把原 SQL 直接放到某一数据库中能否运行”。以下先假设两个事务已经开始，并以等价、可执行的语句完成题目描述的操作。\u003c/p>\n\u003ch3>(1) 两个事务都为SERIALIZABLE\u003c/h3>\n\u003col>\n\u003cli>T1 先把账户1从100改到110；账户2仍为200。\u003c/li>\n\u003cli>T2 也要修改账户1，在 T1 持锁期间等待，此时尚未成功增加20。\u003c/li>\n\u003cli>T1 能读到自己的110，再增加10，把账户1改到120；账户2仍为200。\u003c/li>\n\u003cli>T1 提交之后，T2 怎样继续取决于具体数据库的冲突处理规则。\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>采用的环境\u003c/th>\n\u003cth>T2后续处理\u003c/th>\n\u003cth>最终余额：账户1、账户2\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>MySQL InnoDB，显式事务，等待未超时，使用等价合法SQL\u003c/td>\n\u003ctd>等待结束后读取当前120，再加20并提交\u003c/td>\n\u003ctd>140、200\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>lecture B第13份事务讲义第16–17页的Oracle示例规则，且不重试\u003c/td>\n\u003ctd>冲突的修改发生serialization error，未成功加20\u003c/td>\n\u003ctd>120、200\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>不能只凭 SERIALIZABLE 这个级别名称，认定所有数据库的等待或失败行为完全相同。\u003c/p>\n\u003cp>在 MySQL 中，T1 第二次“给同一账户再加10”可等价写为：\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">UPDATE ACCOUNT\nSET balance = balance + 10\nWHERE account_num = 1\n  AND bank_name = &#39;NAB&#39;;\n\u003c/code>\u003c/pre>\n\u003ch3>(2) T1为READ COMMITTED，T2为READ UNCOMMITTED\u003c/h3>\n\u003cp>本小题重新从100、200开始。\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth align=\"right\">账户1\u003c/th>\n\u003cth align=\"right\">账户2\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>T1给账户1加10\u003c/td>\n\u003ctd align=\"right\">110，未提交\u003c/td>\n\u003ctd align=\"right\">200\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T2给账户2加20\u003c/td>\n\u003ctd align=\"right\">110，未提交\u003c/td>\n\u003ctd align=\"right\">220，未提交\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T2提交\u003c/td>\n\u003ctd align=\"right\">110，未提交\u003c/td>\n\u003ctd align=\"right\">220，已提交\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T1读取账户2的220，加10后赋给账户1\u003c/td>\n\u003ctd align=\"right\">230，未提交\u003c/td>\n\u003ctd align=\"right\">220\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T1提交\u003c/td>\n\u003ctd align=\"right\">230，已提交\u003c/td>\n\u003ctd align=\"right\">220\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这里是把“账户2余额+10”整个结果写入账户1，不是在账户1的110上继续加10。T2已在读取前提交，所以这个顺序没有脏读。隔离级别允许某类现象，不表示本次一定出现该现象。\u003c/p>\n\u003cp>MySQL中的等价self-join写法如下：\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">UPDATE ACCOUNT AS A1\nJOIN ACCOUNT AS A2\n    ON A2.account_num = 2\n   AND A2.bank_name = &#39;NAB&#39;\nSET A1.balance = A2.balance + 10\nWHERE A1.account_num = 1\n  AND A1.bank_name = &#39;NAB&#39;;\n\u003c/code>\u003c/pre>\n\u003ch3>字面执行原SQL时还缺少的条件\u003c/h3>\n\u003cp>原题没有列 START TRANSACTION；SET TRANSACTION 本身不会开启跨多条语句的显式事务。原题直接在 UPDATE ACCOUNT 的子查询中读取 ACCOUNT，还涉及 MySQL 的 Error 1093 限制，失败的更新不能算成已经改好余额。\u003c/p>\n\u003cp>若保留 MySQL 默认自动提交、字面执行原题，且出错后继续运行，(1)余额会是130、200，(2)会是110、220；两小题的第二次 T1 UPDATE 都未成功。因此上面的不同结果属于不同执行条件，不是同一条件下有多个随意答案。参考资料不把其中一种冒充学校官方判分结论。\u003c/p>\n"},{"id":"M3-Q1","title":"Mock Examination 3 — Question 1","topic":"大学概念建模","areas":["Conceptual"],"source":"mock-3","sourceLabel":"Mock Examination 3","sourceNote":"Received Q1–Q6 duplicate Mock Examination 1","origin":"Duplicate source","priority":"duplicate","question":"This question is identical to [Mock Examination 1, Question 1](#m1-q1). The original wording and diagram are provided there.","answer":"参考答案与 [M1-Q1](#m1-q1) 相同。","context":"","canonical":"M1-Q1","parts":[],"tags":[],"questionHTML":"\u003cp>This question is identical to \u003ca href=\"#m1-q1\">Mock Examination 1, Question 1\u003c/a>. The original wording and diagram are provided there.\u003c/p>\n","answerHTML":"\u003cp>参考答案与 \u003ca href=\"#m1-q1\">M1-Q1\u003c/a> 相同。\u003c/p>\n"},{"id":"M3-Q2","title":"Mock Examination 3 — Question 2","topic":"运输服务逻辑设计","areas":["Logical"],"source":"mock-3","sourceLabel":"Mock Examination 3","sourceNote":"Received Q1–Q6 duplicate Mock Examination 1","origin":"Duplicate source","priority":"duplicate","question":"This question is identical to [Mock Examination 1, Question 2](#m1-q2). The original wording and diagram are provided there.","answer":"参考答案与 [M el":"Mock Examination 3","sourceNote":"Received Q1–Q6 duplicate Mock Examination 1","origin":"Duplicate source","priority":"duplicate","question":"This question is identical to [Mock Examination 1, Question 5](#m1-q5). The original wording and diagram are provided there.","answer":"参考答案与 [M1-Q5](#m1-q5) 相同。","context":"","canonical":"M1-Q5","parts":[],"tags":[],"questionHTML":"\u003cp>This question is identical to \u003ca href=\"#m1-q5\">Mock Examination 1, Question 5\u003c/a>. The original wording and diagram are provided there.\u003c/p>\n","answerHTML":"\u003cp>参考答案与 \u003ca href=\"#m1-q5\">M1-Q5\u003c/a> 相同。\u003c/p>\n"},{"id":"M3-Q6","title":"Mock Examination 3 — Question 6","topic":"查找行程次数超过100的卡车","areas":["DDL/DML"],"source":"mock-3","sourceLabel":"Mock Examination 3","sourceNote":"Received Q1–Q6 duplicate Mock Examination 1","origin":"Duplicate source","priority":"duplicate","question":"This question is identical to [Mock Examination 1, Question 6](#m1-q6). The original wording and diagram are provided there.","answer":"参考答案与 [M1-Q6](#m1-q6) 相同。","context":"","canonical":"M1-Q6","parts":[],"tags":[],"questionHTML":"\u003cp>This question is identical to \u003ca href=\"#m1-q6\">Mock Examination 1, Question 6\u003c/a>. The original wording and diagram are provided there.\u003c/p>\n","answerHTML":"\u003cp>参考答案与 \u003ca href=\"#m1-q6\">M1-Q6\u003c/a> 相同。\u003c/p>\n"},{"id":"A1-T1","title":"Assignment 1 — Task 1","topic":"图书馆概念建模","areas":["Conceptual"],"source":"assignment-1","sourceLabel":"Assignment 1","sourceNote":"Assignment1.pdf pp3–4","origin":"Original material","priority":"core","question":"Consider a local library that wants to maintain information about its books and authors. The  following business rules apply: \n• Each Book has ISBN, Title, Edition, and Publication Year. ISBN uniquely identifies a  book. \n• Each Author has AuthorID, FirstName, and LastName. AuthorID uniquely identifies an  author. \n• A book is written by one or more authors. \n• An author may write zero or more books. \n• The library may own multiple copies of the same book. \n• Each Copy has CopyID, and Status (e.g., Available or On Loan). CopyID uniquely  identifies a copy.  \n• Each Copy represents exactly one Book. \n• Each Member has MemberID, FirstName, LastName, and Email. MemberID uniquely  identifies a member. \n• A Member may borrow zero or more Copies. A Copy may be borrowed by at most one  Member at a time.  Using the CSIT115 Palette in UMLet, create a conceptual schema that satisfies the requirements  above. Your diagram must include all required entities with their specified attributes and correct  multiplicity (cardinality).  Finally, add one meaningful attribute to one of the classes that is not listed above. The attribute  should be appropriate for the scenario and the custom attribute you create must end with your  Student ID (e.g., `Genre_1234567`).","answer":"用 BOOK 表示书目，COPY 表示图书馆持有的一本实体书。一本书目可以有多个副本，两个概念要分开。\n\n| 类 | 属性与标识 |\n| --- | --- |\n| BOOK | ISBN为identifier；另有Title、Edition、PublicationYear，以及原题要求的一项自选属性，例如Genre_example_StudentID（作答时换成自己的学号） |\n| AUTHOR | AuthorID为identifier；另有FirstName、LastName |\n| COPY | CopyID为identifier；另有Status |\n| MEMBER | MemberID为identifier；另有FirstName、LastName、Email |\n\n```mermaid\nclassDiagram\n    AUTHOR \"1..*\" -- \"0..*\" BOOK : writes\n    BOOK \"1\" -- \"0..*\" COPY : has\n    MEMBER \"0..1\" -- \"0..*\" COPY : borrows\n```\n\n一项书目至少有一位作者；一位作者可以暂时没有书目。每个副本对应一个书目；此图没有额外要求每个书目至少有一个副本。一个会员可以借多个副本，一个副本同一时刻至多有一名借阅者。\n\n原题明确 CopyID 唯一，因此它本身必须能识别副本。随附参考图若把它画成依赖书目的局部编号，仍不能因此丢掉题面声明的全局唯一条件。题目没有要求借阅历史，本设计没有额外添加借阅日期或人工借阅编号。","context":"","canonical":null,"parts":[{"number":"1","goal":"把书目、实体副本、作者与会员分开建模","steps":["同一种书的ISBN、Title、Edition、PublicationYear属于BOOK；图书馆实际持有的某一本属于COPY，有CopyID和Status。","AUTHOR用AuthorID、MEMBER用MemberID识别；COPY的CopyID按文字是全局唯一。","BOOK到AUTHOR：每书目至少一作者，作者可暂未有书目。BOOK到COPY：每副本只对应一书目，一书目可有多副本。","MEMBER到COPY：会员可借零到多本；同一副本同一时刻至多借给一人。原题只表达当前借阅，不擅加历史LoanID。","最后按这道作业特有要求，增加一项有意义且带本人学号后缀的attribute。不能把这个要求套进禁止额外属性的医院题。"],"check":"图中有四类、全部原属性、identifiers与双向multiplicities。","pitfall":"随附参考图若把CopyID当局部编号，仍须保留文字声明的唯一性。","code":""}],"tags":["Classes, attributes and identifiers"],"questionHTML":"\u003cp>Consider a local library that wants to maintain information about its books and authors. The  following business rules apply: \n• Each Book has ISBN, Title, Edition, and Publication Year. ISBN uniquely identifies a  book. \n• Each Author has AuthorID, FirstName, and LastName. AuthorID uniquely identifies an  author. \n• A book is written by one or more authors. \n• An author may write zero or more books. \n• The library may own multiple copies of the same book. \n• Each Copy has CopyID, and Status (e.g., Available or On Loan). CopyID uniquely  identifies a copy.\u003cbr>• Each Copy represents exactly one Book. \n• Each Member has MemberID, FirstName, LastName, and Email. MemberID uniquely  identifies a member. \n• A Member may borrow zero or more Copies. A Copy may be borrowed by at most one  Member at a time.  Using the CSIT115 Palette in UMLet, create a conceptual schema that satisfies the requirements  above. Your diagram must include all required entities with their specified attributes and correct  multiplicity (cardinality).  Finally, add one meaningful attribute to one of the classes that is not listed above. The attribute  should be appropriate for the scenario and the custom attribute you create must end with your  Student ID (e.g., \u003ccode>Genre_1234567\u003c/code>).\u003c/p>\n","answerHTML":"\u003cp>用 BOOK 表示书目，COPY 表示图书馆持有的一本实体书。一本书目可以有多个副本，两个概念要分开。\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>类\u003c/th>\n\u003cth>属性与标识\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>BOOK\u003c/td>\n\u003ctd>ISBN为identifier；另有Title、Edition、PublicationYear，以及原题要求的一项自选属性，例如Genre_example_StudentID（作答时换成自己的学号）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AUTHOR\u003c/td>\n\u003ctd>AuthorID为identifier；另有FirstName、LastName\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>COPY\u003c/td>\n\u003ctd>CopyID为identifier；另有Status\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MEMBER\u003c/td>\n\u003ctd>MemberID为identifier；另有FirstName、LastName、Email\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"diagram\">\u003cdiv class=\"diagram-scroll\">\n\n\u003c!-- Generated by graphviz version 14.1.3 (20260303.0454)\n -->\n\u003c!-- Title: G Pages: 1 -->\n\u003cp>\u003csvg width=\"722pt\" height=\"324pt\"\n viewBox=\"0.00 0.00 722.00 324.00\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n\u003cg id=\"g4-graph0\" class=\"graph\" transform=\"scale(1 1) rotate(0) translate(28.8 295)\">\u003c/p>\n\u003ctitle>G\u003c/title>\n\u003c!-- AUTHOR -->\n\u003cg id=\"g4-node1\" class=\"node\">\n\u003ctitle>AUTHOR\u003c/title>\n\u003cpolygon fill=\"#e6f1ed\" stroke=\"none\" points=\"0,-219.4 0,-251.8 84.02,-251.8 84.02,-219.4 0,-219.4\"/>\n\u003cpolygon fill=\"none\" stroke=\"black\" points=\"0,-219.4 0,-251.8 84.02,-251.8 84.02,-219.4 0,-219.4\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"16.35\" y=\"-233\" font-family=\"Arial\" font-weight=\"bold\" font-size=\"12.00\">AUTHOR\u003c/text>\n\u003cpolygon fill=\"none\" stroke=\"black\" points=\"0,-158.2 0,-219.4 84.02,-219.4 84.02,-158.2 0,-158.2\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"9\" y=\"-198.4\" font-family=\"Arial\" font-size=\"12.00\">AuthorID &#160;ID\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"9\" y=\"-184\" font-family=\"Arial\" font-size=\"12.00\">FirstName\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"9\" y=\"-169.6\" font-family=\"Arial\" font-size=\"12.00\">LastName\u003c/text>\n\u003c/g>\n\u003c!-- BOOK -->\n\u003cg id=\"g4-node2\" class=\"node\">\n\u003ctitle>BOOK\u003c/title>\n\u003cpolygon fill=\"#e6f1ed\" stroke=\"none\" points=\"200.14,-233.8 200.14,-266.2 MEMBER\u003c/text>\n\u003cpolygon fill=\"none\" stroke=\"black\" points=\"284.86,0 284.86,-75.6 377.54,-75.6 377.54,0 284.86,0\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"293.86\" y=\"-54.6\" font-family=\"Arial\" font-size=\"12.00\">MemberID &#160;ID\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"293.86\" y=\"-40.2\" font-family=\"Arial\" font-size=\"12.00\">FirstName\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"293.86\" y=\"-25.8\" font-family=\"Arial\" font-size=\"12.00\">LastName\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"start\" x=\"293.86\" y=\"-11.4\" font-family=\"Arial\" font-size=\"12.00\">Email\u003c/text>\n\u003c/g>\n\u003c!-- MEMBER&#45;&gt;COPY -->\n\u003cg id=\"g4-edge3\" class=\"edge\">\n\u003ctitle>MEMBER&#45;&gt;COPY\u003c/title>\n\u003cpath fill=\"none\" stroke=\"#52695d\" d=\"M377.33,-58.01C435.11,-63.13 534.16,-71.92 587.88,-76.69\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"525.04\" y=\"-75.32\" font-family=\"Arial\" font-size=\"10.00\">borrows\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"561.56\" y=\"-83.24\" font-family=\"Arial\" font-size=\"10.00\">0..*\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"403.65\" y=\"-45.46\" font-family=\"Arial\" font-size=\"10.00\">0..1\u003c/text>\n\u003c/g>\n\u003c/g>\n\u003c/svg>\n\u003c/div>\u003cfigcaption>同一个ID标签表示组合identifier；不同ID标签表示独立identifier。空心箭头指向父类。 [0..1]可选，[*]多值，/表示derived attribute。\u003c/figcaption>\u003cbutton class=\"zoom\" type=\"button\">放大图\u003c/button>\u003c/figure>\n\n\u003cp>一项书目至少有一位作者；一位作者可以暂时没有书目。每个副本对应一个书目；此图没有额外要求每个书目至少有一个副本。一个会员可以借多个副本，一个副本同一时刻至多有一名借阅者。\u003c/p>\n\u003cp>原题明确 CopyID 唯一，因此它本身必须能识别副本。随附参考图若把它画成依赖书目的局部编号，仍不能因此丢掉题面声明的全局唯一条件。题目没有要求借阅历史，本设计没有额外添加借阅日期或人工借阅编号。\u003c/p>\n"},{"id":"A1-T2","title":"Assignment 1 — Task 2","topic":"修正大学概念模型","areas":["Conceptual"],"source":"assignment-1","sourceLabel":"Assignment 1","sourceNote":"Assignment1.pdf pp3–4","origin":"Original material","priority":"core","question":"The university has the following business rules. \n \n1. Each lecturer has a Staff ID, First Name, Last Name and Email.  \n2. Each student has a Student ID, First Name, Last Name and Email and every student is either  an Undergraduate student or a Postgraduate student. An undergraduate student has an  additional attribute GPA and a postgraduate student has an additional attribute Thesis Title. \n3. Each subject has a Code, Title and Credits.  \n4. Each subject is offered by one department with an attribute Name. \n5. Each classroom has a Room Number, Building and Capacity.  \n6. A lecturer may teach up to four subjects in a semester.  \n7. Each subject must be taught by at most two lecturers and is held in one classroom. \n8. A student may enrol in zero or more subjects.  \n9. A classroom may be used for zero or more subjects.    Correct the conceptual schema by fixing all errors in entity representation, inheritance notation,  and multiplicities so that it accurately represents the business rules above.\n\n![Original conceptual schema](assets/assignment-1-task-2.png)","answer":"按照文字业务规则修正，不按照待纠错图继续推断。最终类如下：\n\n| 类 | 应有属性 |\n| --- | --- |\n| LECTURER | StaffID、FirstName、LastName、Email |\n| STUDENT | StudentID、FirstName、LastName、Email |\n| UNDERGRADUATE | 继承STUDENT，增加GPA |\n| POSTGRADUATE | 继承STUDENT，增加ThesisTitle |\n| SUBJECT | Code、Title、Credits |\n| DEPARTMENT | Name |\n| CLASSROOM | RoomNumber、Building、Capacity |\n\n```mermaid\nclassDiagram\n    STUDENT \u003c|-- UNDERGRADUATE\n    STUDENT \u003c|-- POSTGRADUATE\n    LECTURER \"1..2\" -- \"0..4\" SUBJECT : teaches\n    DEPARTMENT \"1\" -- \"0..*\" SUBJECT : offers\n    CLASSROOM \"1\" -- \"0..*\" SUBJECT : holds\n    STUDENT \"0..*\" -- \"0..*\" SUBJECT : enrols\n```\n\n修正点：\n\n1. 增加本科生子类；本科生、研究生的泛化箭头都指向 STUDENT。每位学生恰好属于二者之一。\n2. 单独表示 DEPARTMENT，用关联说明哪个系开设科目；不只在 SUBJECT 中留一个 DepartmentName 代替系这个类。\n3. 为 CLASSROOM 补上 RoomNumber。每个科目对应一间教室；一间教室可用于零门或多门科目。\n4. 一位讲师对应零至四门科目，0..4 写在科目端。每门科目最多两名讲师，对应的数量写在讲师端。\n5. 学生可以零门或多门选课；原题没有强制每门科目至少有学生。\n\n本图将“must be taught by at most two lecturers”理解为至少有一名、最多两名讲师。原文若只按上限处理，则可用0..2；应说明采用哪种理解。系名唯一、建筑与房号组合唯一，也属于本设计明确采用的标识假设。\n\n### 图中标签对照\n\n**待纠错图中文字对照**：Lecturer 讲师；Subject 科目；Student 学生；Postgraduate 研究生；Classroom 教室。StaffID 员工号；FirstName 名；LastName 姓；Email 邮箱；Code 科目代码；Title 标题；Credits 学分；DepartmentName 系名；StudentID 学号；ThesisTitle 论文题目；Building 建筑；Capacity 容量。teaches 教授；enrols 选修；held in 在某处上课。ID1 identifier；4 四个；0..2 零至两个；1 一个；* 多个。原图就是待修正对象，不能将其中数量和箭头当作正确业务规则。","context":"","canonical":null,"parts":[{"number":"1","goal":"按业务文字逐项纠正错误图","steps":["以文字为标准，而不是把错误图上的端点数量当作事实；补齐UNDERGRADUATE、DEPARTMENT和CLASSROOM.RoomNumber。","本科生和研究生继承STUDENT；空心三角指向父类，GPA与ThesisTitle留在各自子类。","一讲师每学期可教0–4科，数量写在SUBJECT端；每科最多2名讲师，数量写在LECTURER端。对must be taught是否要求下限1说明解释。","每科恰在一教室，教室可用于0到多科；每科由一系开设，系独立用Name描述。","学生选课为0到多；检查StaffID、StudentID、Code及教室标识假设。保留所有原属性，不把图中错误DepartmentName当作唯一修复方式。"],"check":"方向、上下限、缺失类与缺失属性都得到修正。","pitfall":"“最多四门”不是恰好四门，关联端点也不能按句子主语位置直接填。","code":""}],"tags":["Classes, attributes and identifiers","Multiplicities and role directions","Generalization and subtype properties"],"questionHTML":"\u003cp>The university has the following business rules. \u003c/p>\n\u003col>\n\u003cli>Each lecturer has a Staff ID, First Name, Last Name and Email.  \u003c/li>\n\u003cli>Each student has a Student ID, First Name, Last Name and Email and every student is either  an Undergraduate student or a Postgraduate student. An undergraduate student has an  additional attribute GPA and a postgraduate student has an additional attribute Thesis Title. \u003c/li>\n\u003cli>Each subject has a Code, Title and Credits.  \u003c/li>\n\u003cli>Each subject is offered by one department with an attribute Name. \u003c/li>\n\u003cli>Each classroom has a Room Number, Building and Capacity.  \u003c/li>\n\u003cli>A lecturer may teach up to four subjects in a semester.  \u003c/li>\n\u003cli>Each subject must be taught by at most two lecturers and is held in one classroom. \u003c/li>\n\u003cli>A student may enrol in zero or more subjects.  \u003c/li>\n\u003cli>A classroom may be used for zero or more subjects.    Correct the conceptual schema by fixing all errors in entity representation, inheritance notation,  and multiplicities so that it accurately represents the business rules above.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"assets/assignment-1-task-2.png\" alt=\"Original conceptual schema\">\u003c/p>\n","answerHTML":"\u003cp>按照文字业务规则修正，不按照待纠错图继续推断。最终类如下：\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>类\u003c/th>\n\u003cth>应有属性\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>LECTURER\u003c/td>\n\u003ctd>StaffID、FirstName、LastName、Email\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>STUDENT\u003c/td>\n\u003ctd>StudentID、FirstName、LastName、Email\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>UNDERGRADUATE\u003c/td>\n\u003ctd>继承STUDENT，增加GPA\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POSTGRADUATE\u003c/td>\n\u003ctd>继承STUDENT，增加ThesisTitle\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SUBJECT\u003c/td>\n\u003ctd>Code、Title、Credits\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEPARTMENT\u003c/td>\n\u003ctd>Name\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CLASSROOM\u003c/td>\n\u003ctd>RoomNumber、Building、Capacity\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"diagram\">\u003cdiv class=\"diagram-scroll\">\n\n\u003c!-- Generated by graphviz version 14.1.3 (20260303.0454)\n -->\n\u003c!-- Title: G Pages: 1 -->\n\u003cp>\u003csvg width=\"660pt\" height=\"568pt\"\n viewBox=\"0.00 0.00 660.00 568.00\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n\u003cg id=\"g5-graph0\" class=\"graph\" transform=\"scale(1 1) rotate(0) translate(28.8 539.2)\">\u003c/p>\n\u003ctitle>G\u003c/title>\n\u003c!-- STUDENT -->\n\u003cg id=\"g e\" stroke=\"#52695d\" d=\"M403.69,-239.98C446.98,-249.77 496.26,-260.91 528.78,-268.27\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"466.23\" y=\"-260.96\" font-family=\"Arial\" font-size=\"10.00\">holds\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"501.42\" y=\"-271.21\" font-family=\"Arial\" font-size=\"10.00\">0..*\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"431.05\" y=\"-231.03\" font-family=\"Arial\" font-size=\"10.00\">1\u003c/text>\n\u003c/g>\n\u003c/g>\n\u003c/svg>\n\u003c/div>\u003cfigcaption>同一个ID标签表示组合identifier；不同ID标签表示独立identifier。空心箭头指向父类。 [0..1]可选，[*]多值，/表示derived attribute。\u003c/figcaption>\u003cbutton class=\"zoom\" type=\"button\">放大图\u003c/button>\u003c/figure>\n\n\u003cp>修正点：\u003c/p>\n\u003col>\n\u003cli>增加本科生子类；本科生、研究生的泛化箭头都指向 STUDENT。每位学生恰好属于二者之一。\u003c/li>\n\u003cli>单独表示 DEPARTMENT，用关联说明哪个系开设科目；不只在 SUBJECT 中留一个 DepartmentName 代替系这个类。\u003c/li>\n\u003cli>为 CLASSROOM 补上 RoomNumber。每个科目对应一间教室；一间教室可用于零门或多门科目。\u003c/li>\n\u003cli>一位讲师对应零至四门科目，0..4 写在科目端。每门科目最多两名讲师，对应的数量写在讲师端。\u003c/li>\n\u003cli>学生可以零门或多门选课；原题没有强制每门科目至少有学生。\u003c/li>\n\u003c/ol>\n\u003cp>本图将“must be taught by at most two lecturers”理解为至少有一名、最多两名讲师。原文若只按上限处理，则可用0..2；应说明采用哪种理解。系名唯一、建筑与房号组合唯一，也属于本设计明确采用的标识假设。\u003c/p>\n\u003ch3>图中标签对照\u003c/h3>\n\u003cp>\u003cstrong>待纠错图中文字对照\u003c/strong>：Lecturer 讲师；Subject 科目；Student 学生；Postgraduate 研究生；Classroom 教室。StaffID 员工号；FirstName 名；LastName 姓；Email 邮箱；Code 科目代码；Title 标题；Credits 学分；DepartmentName 系名；StudentID 学号；ThesisTitle 论文题目；Building 建筑；Capacity 容量。teaches 教授；enrols 选修；held in 在某处上课。ID1 identifier；4 四个；0..2 零至两个；1 一个；* 多个。原图就是待修正对象，不能将其中数量和箭头当作正确业务规则。\u003c/p>\n"},{"id":"A2-T1","title":"Assignment 2 — Task 1","topic":"酒店数据库：逻辑设计","areas":["Logical"],"source":"assignment-2","sourceLabel":"Assignment 2","sourceNote":"Assignment2.pdf pp2–3; accompanying Assignment2_Solution.pdf","origin":"Original material","priority":"core","question":"Given the conceptual schema below, perform logical database design by transforming it  into a collection of relational schemas. \n\n(1) Identify each feature of the conceptual schema that requires a transformation and state  the transformation applied to that feature. \n\n(2) For each relational schema created , clearly list the names of attributes, primary keys ,  candidate keys (if any), and foreign keys (if any). Assume that the superset  method must be used to implement a generalization (if any). A way how a conceptual  schema can be transformed into a collection of relational schemas is explained in a  presentation 06 Logical Design.      The relational schemas must be listed in a format presented in slides 42 and 43 in  presentation 06 Logical Design. Listing of the relational schemas in the other format scores  no marks.   \n\nNote that the order of the definitions on the relation schemas is important. You must  define a parent relation schema (referenced) before its  child relational schema  (references to the parent relational schema).\n\n![Original conceptual schema](assets/assignment-2-task-1.png)","answer":"以下根据随附 Assignment2_Solution.pdf 整理转换方法。按同一顺序理解每项特征：原图表达什么，需要怎样落到关系结构中。\n\n1. **酒店的多值设施属性**：先建立 AMENITY，再用 HOTEL_AMENITY 记录酒店与设施的配对。一家酒店可以有多种设施，同种设施也可以用于多家酒店。\n2. **住客与预订的many-to-many关联**：建立 GUEST_RESERVATION，以住客标识与预订标识的组合作primary key。\n3. **酒店与客房的限定关联**：roomNo只在所属酒店内识别客房，因此 ROOM 的primary key为 hotelCode 与 roomNo 的组合，hotelCode同时引用 HOTEL。\n4. **客房与预订的one-to-many关联**：把 ROOM 的完整primary key复制到 RESERVATION，形成引用客房的composite foreign key。\n5. **预订与付款的可选one-to-one关联**：按随附解答，将 PAYMENT 合并到 RESERVATION。没有付款时，receiptNo、amount、method、paidDate为空；有付款时保存付款信息。\n6. **酒店的generalization**：用 superset method，把两类酒店的专有属性放回 HOTEL，再增加 typeOfHotel 区分类型。\n\n最终relational schema如下，父关系先于子关系：\n\n```text\nGUEST(passportNo, firstName, lastName, email, phone) \nPRIMARY KEY = (passportNo) \nAMENITY(amenity) \nPRIMARY KEY = (amenity) \nHOTEL(code, name, rating, typeOfHotel, poolCount, conferenceRooms) \nPRIMARY KEY = (code) \nROOM(hotelCode, roomNo, capacity, bedType, pricePerNight) \nPRIMARY KEY = (hotelCode, roomNo) \nFOREIGN KEY1 = (hotelCode) REFERENCES HOTEL(code) \n\nRESERVATION(reservationNo, checkIn, checkOut, bookingDate, status, \n            hotelCode, roomNo, receiptNo, amount, method, paidDate) \nPRIMARY KEY = (reservationNo) \nCANDIDATE KEY1 = (receiptNo) \nFOREIGN KEY1 = (hotelCode, roomNo) REFERENCES ROOM(hotelCode, roomNo) \nHOTEL_AMENITY(hotelCode, amenity) \nPRIMARY KEY = (hotelCode, amenity) \nFOREIGN KEY1 = (hotelCode) REFERENCES HOTEL(code) \nFOREIGN KEY2 = (amenity) REFERENCES AMENITY(amenity) \nGUEST_RESERVATION (passportNo, reservationNo) \nPRIMARY KEY = (passportNo, reservationNo) \nFOREIGN KEY1 = (passportNo) REFERENCES GUEST(passportNo) \nFOREIGN KEY2 = (reservationNo) REFERENCES RESERVATION(reservationNo)\n```\n\n这里 receiptNo 的用语要特别区分：随附课程解答把它列作 CK，但没有付款的预订中它为空。因此严格说它不是标识所有预订行的非空candidate key，而是“有付款时唯一的收据号”。用 UNIQUE(receiptNo) 保留非空值唯一的条件。\n\nforeign key不会单独强制many-to-many关联两端“至少有一条”的最低数量。合并子类后，还要根据采用的类型规则保证专有属性填写相符。\n\n### 图中标签对照\n\n**图中文字对照**：GUEST 住客；RESERVATION 预订；PAYMENT 付款；ROOM 房间；HOTEL 酒店；RESORT_HOTEL 度假酒店；BUSINESS_HOTEL 商务酒店。passportNo 护照号；firstName 名；lastName 姓；email 邮箱；phone 电话；reservationNo 预订号；checkIn 入住日期；checkOut 退房日期；bookingDate 预订日期；status 状态；receipt# 收据号；amount 金额；method 付款方式；paidDate 付款日期；capacity 容量；bedType 床型；pricePerNight 每晚价格；room# 房号；code 酒店代码；name 名称；amenity 配套设施；rating 评分；poolCount 泳池数量；conferenceRooms 会议室数量。Includes 包含；Has 具有；Related to 与之相关。ID1 identifier；[*] 多值；[0..1] 可选；* 零到多个；1..* 至少一个；0..1 零个或一个；空心三角表示泛化。","context":"","canonical":null,"parts":[{"number":"1","goal":"说明每一种概念特征如何转换","steps":["先列多值amenity、GUEST到RESERVATION的many-to-many、HOTEL到ROOM的qualification。","再列ROOM到RESERVATION的one-to-many、RESERVATION到PAYMENT的可选one-to-one，以及HOTEL的generalization。","逐项写采用的转换：多值表/关联表、复制完整owner key、复制foreign key、按课程示例合并可选付款、按superset合并酒店子类。"],"check":"每个需要转换的特征都有对应方法，不只给最终表名。","pitfall":"不要把图中[*]直接变成一列逗号分隔的文本。","code":""},{"number":"2","goal":"写全部relational schemas及键","steps":["先列GUEST、AMENITY、HOTEL；再列ROOM、RESERVATION、HOTEL_AMENITY、GUEST_RESERVATION。","ROOM primary key为(hotelCode,roomNo)；RESERVATION同时引用这两项，不只引用房号。","PAYMENT合并后用可空receiptNo保存付款唯一标识；课程把它列作CK，解析单独说明可空标识与严格candidate key定义差异。","按课件格式写PRIMARY KEY、CANDIDATE KEY、FOREIGN KEY REFERENCES；父表在前。"],"check":"七张表、两个关联表的组合键、每条foreign key与其目标完整一致。","pitfall":"email的唯一性是下一Task新增规则，不要把Task2(2)提前当成原图已有identifier。","code":""}],"tags":["Primary, candidate and composite foreign keys","Multivalued attribute transformation","Many-to-many and association attributes","Qualified association transformation","One-to-one merge and nullable identifiers","Superset method","Parent-before-child and classroom schema format"],"questionHTML":"\u003cp>Given the conceptual schema below, perform logical database design by transforming it  into a collection of relational schemas. \u003c/p>\n\u003cp>(1) Identify each feature of the conceptual schema that requires a transformation and state  the transformation applied to that feature. \u003c/p>\n\u003cp>(2) For each relational schema created , clearly list the names of attributes, primary keys ,  candidate keys (if any), and foreign keys (if any). Assume that the superset  method must be used to implement a generalization (if any). A way how a conceptual  schema can be transformed into a collection of relational schemas is explained in a  presentation 06 Logical Design.      The relational schemas must be listed in a format presented in slides 42 and 43 in  presentation 06 Logical Design. Listing of the relational schemas in the other format scores  no marks.   \u003c/p>\n\u003cp>Note that the order of the definitions on the relation schemas is important. You must  define a parent relation schema (referenced) before its  child relational schema  (references to the parent relational schema).\u003c/p>\n\u003cp>\u003cimg src=\"assets/assignment-2-task-1.png\" alt=\"Original conceptual schema\">\u003c/p>\n","answerHTML":"\u003cp>以下根据随附 Assignment2_Solution.pdf 整理转换方法。按同一顺序理解每项特征：原图表达什么，需要怎样落到关系结构中。\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>酒店的多值设施属性\u003c/strong>：先建立 AMENITY，再用 HOTEL_AMENITY 记录酒店与设施的配对。一家酒店可以有多种设施，同种设施也可以用于多家酒店。\u003c/li>\n\u003cli>\u003cstrong>住客与预订的many-to-many关联\u003c/strong>：建立 GUEST_RESERVATION，以住客标识与预订标识的组合作primary key。\u003c/li>\n\u003cli>\u003cstrong>酒店与客房的限定关联\u003c/strong>：roomNo只在所属酒店内识别客房，因此 ROOM 的primary key为 hotelCode 与 roomNo 的组合，hotelCode同时引用 HOTEL。\u003c/li>\n\u003cli>\u003cstrong>客房与预订的one-to-many关联\u003c/strong>：把 ROOM 的完整primary key复制到 RESERVATION，形成引用客房的composite foreign key。\u003c/li>\n\u003cli>\u003cstrong>预订与付款的可选one-to-one关联\u003c/strong>：按随附解答，将 PAYMENT 合并到 RESERVATION。没有付款时，receiptNo、amount、method、paidDate为空；有付款时保存付款信息。\u003c/li>\n\u003cli>\u003cstrong>酒店的generalization\u003c/strong>：用 superset method，把两类酒店的专有属性放回 HOTEL，再增加 typeOfHotel 区分类型。\u003c/li>\n\u003c/ol>\n\u003cp>最终relational schema如下，父关系先于子关系：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">GUEST(passportNo, firstName, lastName, email, phone) \nPRIMARY KEY = (passportNo) \nAMENITY(amenity) \nPRIMARY KEY = (amenity) \nHOTEL(code, name, rating, typeOfHotel, poolCount, conferenceRooms) \nPRIMARY KEY = (code) \nROOM(hotelCode, roomNo, capacity, bedType, pricePerNight) \nPRIMARY KEY = (hotelCode, roomNo) \nFOREIGN KEY1 = (hotelCode) REFERENCES HOTEL(code) \n\nRESERVATION(reservationNo, checkIn, checkOut, bookingDate, status, \n            hotelCode, roomNo, receiptNo, amount, method, paidDate) \nPRIMARY KEY = (reservationNo) \nCANDIDATE KEY1 = (receiptNo) \nFOREIGN KEY1 = (hotelCode, roomNo) REFERENCES ROOM(hotelCode, roomNo) \nHOTEL_AMENITY(hotelCode, amenity) \nPRIMARY KEY = (hotelCode, amenity) \nFOREIGN KEY1 = (hotelCode) REFERENCES HOTEL(code) \nFOREIGN KEY2 = (amenity) REFERENCES AMENITY(amenity) \nGUEST_RESERVATION (passportNo, reservationNo) \nPRIMARY KEY = (passportNo, reservationNo) \nFOREIGN KEY1 = (passportNo) REFERENCES GUEST(passportNo) \nFOREIGN KEY2 = (reservationNo) REFERENCES RESERVATION(reservationNo)\n\u003c/code>\u003c/pre>\n\u003cp>这里 receiptNo 的用语要特别区分：随附课程解答把它列作 CK，但没有付款的预订中它为空。因此严格说它不是标识所有预订行的非空candidate key，而是“有付款时唯一的收据号”。用 UNIQUE(receiptNo) 保留非空值唯一的条件。\u003c/p>\n\u003cp>foreign key不会单独强制many-to-many关联两端“至少有一条”的最低数量。合并子类后，还要根据采用的类型规则保证专有属性填写相符。\u003c/p>\n\u003ch3>图中标签对照\u003c/h3>\n\u003cp>\u003cstrong>图中文字对照\u003c/strong>：GUEST 住客；RESERVATION 预订；PAYMENT 付款；ROOM 房间；HOTEL 酒店；RESORT_HOTEL 度假酒店；BUSINESS_HOTEL 商务酒店。passportNo 护照号；firstName 名；lastName 姓；email 邮箱；phone 电话；reservationNo 预订号；checkIn 入住日期；checkOut 退房日期；bookingDate 预订日期；status 状态；receipt# 收据号；amount 金额；method 付款方式；paidDate 付款日期；capacity 容量；bedType 床型；pricePerNight 每晚价格；room# 房号；code 酒店代码；name 名称；amenity 配套设施；rating 评分；poolCount 泳池数量；conferenceRooms 会议室数量。Includes 包含；Has 具有；Related to 与之相关。ID1 identifier；[\u003cem>] 多值；[0..1] 可选；\u003c/em> 零到多个；1..* 至少一个；0..1 零个或一个；空心三角表示泛化。\u003c/p>\n"},{"id":"A2-T2","title":"Assignment 2 — Task 2","topic":"酒店建表、约束、样例数据与删除","areas":["DDL/DML"],"source":"assignment-2","sourceLabel":"Assignment 2","sourceNote":"Assignment2.pdf pp2–3; accompanying Assignment2_Solution.pdf","origin":"Original material","priority":"core","question":"This question builds upon the relational schemas you designed in Task 1.  Write SQL  statements to answer the following queries. Since the parts  are interconnected, you must  complete them in sequential order from (1) to (5).  \n\n(1) Create empty relational tables to implement the relational schemas you designed in  Task 1 for the hotel reservation database. The names of the relational tables and  columns must be consistent with your logical design. Use reasonable column types  and sizes (lengths). Enforce all appropriate primary key and referential integrity  constraints.  Note that the order of CREATE TABLE statements is important. Create the  parent table (referenced) before its child table (references to the parent table).  \n\n(2) Next, assume that a new business rule is introduced requiring that no two guests  have the same email address. Add an appropriate constraint after the table has  already been created. \n\n(3) Next, insert sufficient sample data into the tables to represent at least two hotels,  two rooms for each hotel, two guests, and two reservations. Insert appropriate data  into the other tables resulting from your logical design where required.  The data values are up to you, but they must satisfy all primary key and referential  integrity constraints defined in part (1) and (2).    Note that the order of INSERT statements is important. Insert data into the  parent table (referenced) before inserting data into its child table (references to  the parent table).  \n\n(4) Increase the pricePerNight of all rooms belonging to one of the hotels inserted  in part (3) by 10%. The choice of hotel is up to you. \n\n(5) Finally, delete one of the hotels inserted in part ( 3) and all records that must be  removed beforehand to satisfy the referential integrity constraints. Do not delete the  other hotel or its related information, and do not drop any table.    Note that the order of delete statements is important. Delete data from the child table  (references to the parent table) before deleting data from its parent table (referenced).","answer":"### (1) 先创建父表，再创建引用它的表\n\n以下(1)–(4)沿用随附参考解答的表名、列名和样例数据。\n\n```sql\nCREATE TABLE GUEST ( \n    passportNo VARCHAR(20) NOT NULL, \n    firstName  VARCHAR(50) NOT NULL, \n    lastName   VARCHAR(50) NOT NULL, \n    email      VARCHAR(100) NOT NULL, \n    phone      VARCHAR(20) NOT NULL, \n    CONSTRAINT guest_pkey PRIMARY KEY (passportNo) \n); \nCREATE TABLE AMENITY ( \n    amenity VARCHAR(50) NOT NULL, \n    CONSTRAINT amenity_pkey PRIMARY KEY (amenity) \n); \nCREATE TABLE HOTEL ( \n    code             CHAR(5) NOT NULL, \n    name             VARCHAR(100) NOT NULL, \n    rating           DECIMAL(2,1) NULL, \n    typeOfHotel      VARCHAR(20) NULL, \n    poolCount        DECIMAL(3) NULL, \n    conferenceRooms  DECIMAL(3)
