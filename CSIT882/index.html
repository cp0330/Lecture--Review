dge":["grant","grantoption","view","definer"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"共享Bank schema与题面条件","output":"授予建表/建view及转授权","examTips":["既可CREATE TABLE，又可CREATE VIEW。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["GRANT OPTION的已有范围会影响下一个小题，不能把各GRANT永远孤立看待。"],"tables":[],"knowledgeUses":{"grant":"既可CREATE TABLE，又可CREATE VIEW。","grantoption":"既可CREATE TABLE，又可CREATE VIEW。","view":"既可CREATE TABLE，又可CREATE VIEW。","definer":"既可CREATE TABLE，又可CREATE VIEW。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">GRANT CREATE, CREATE VIEW ON banks.*\nTO &#39;admin&#39;@&#39;localhost&#39;\nWITH GRANT OPTION;\n\u003c/code>\u003c/pre>\n"},{"number":"5","goal":"开放2021交易且不可再转授","steps":["先用view的WHERE限定2021时间范围，不开放整张TRANSACTION。","考虑admin在banks.*已有GRANT OPTION；仅省略新语句的WITH GRANT OPTION未必能禁止传播。","本解由root在独立bank_reports建立SQL SECURITY DEFINER view，只授该view的SELECT，不授bank_reports的GRANT OPTION。"],"check":"按连续执行的小题理解，同时满足可转授DDL和不可转授这份报告。","pitfall":"把报告view也放在已获数据库级GRANT OPTION的banks中，容易造成意外可转授。","mainType":"access","knowledge":["projection","filter","grant","grantoption","view","definer"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"共享Bank schema与题面条件","output":"开放2021交易且不可再转授","examTips":["按连续执行的小题理解，同时满足可转授DDL和不可转授这份报告。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["把报告view也放在已获数据库级GRANT OPTION的banks中，容易造成意外可转授。"],"tables":["banks"],"knowledgeUses":{"projection":"本小题输出：开放2021交易且不可再转授","filter":"按连续执行的小题理解，同时满足可转授DDL和不可转授这份报告。","grant":"按连续执行的小题理解，同时满足可转授DDL和不可转授这份报告。","grantoption":"按连续执行的小题理解，同时满足可转授DDL和不可转授这份报告。","view":"涉及对象／命名中间结果：banks","definer":"按连续执行的小题理解，同时满足可转授DDL和不可转授这份报告。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">CREATE DATABASE bank_reports;\n\nCREATE SQL SECURITY DEFINER VIEW bank_reports.TRANSACTIONS_2021 AS\nSELECT acc_num, bank_name, tr_date_time, amount, type\nFROM banks.`TRANSACTION`\nWHERE tr_date_time &gt;= &#39;2021-01-01&#39;\n  AND tr_date_time &lt;  &#39;2022-01-01&#39;;\n\nGRANT SELECT ON bank_reports.TRANSACTIONS_2021\nTO &#39;admin&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"}],"tags":["CREATE/ALTER/DROP USER and database management","Database/table/column scopes and GRANT OPTION","Views for restricted rows/columns and summaries"],"legacyPriority":"core","level":"A","archived":false,"originType":"Official Mock Exam","mainType":"access","related":[],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"假设共享schema中的CREATE TABLE语句保存在dbcreate.sql，脚本位于操作系统用户的$HOME/bank/sql目录。root已连接数据库并能访问脚本。以root身份实现下列操作；部分小题可能需要多条SQL。\n\n(1) root按题面给出的密码创建banks数据库，并把它设为默认数据库。\n\n(2) 在banks中创建题面给出的表，即处理dbcreate.sql脚本。\n\n(3) 创建名为admin的新用户，密码按英文题面给定。\n\n(4) admin必须能执行CREATE TABLE和CREATE VIEW，并能把相应权限转授其他用户。\n\n(5) admin必须能读取2021年提交的Transaction信息，但不能转授这项读取权限。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["source","user","grant","grantoption","view","definer","projection","filter"],"types":["access"],"requiredSkills":["USE / SOURCE / client commands / 选库与处理SQL脚本","CREATE USER / account host / 创建用户及主机范围","GRANT / privilege scope / 授予权限与对象范围","WITH GRANT OPTION / 权限转授","View / dependency / 视图与依赖","SQL SECURITY DEFINER / 由视图定义者权限读取底表","SELECT / projection / 选择输出列","WHERE / predicate / 逐行筛选条件"],"questionHTML":"\u003cp>This question is related to a sample database created through processing of the common CREATE TABLE statements above.\u003c/p>\n\u003cp>Assume that CREATE TABLE statements listed above are included in SQL script dbcreate.sql. The script is located at a folder $HOME/bank/sql. Write the implementations of the operations listed below as a user root. Assume that a user root has already connected to the database. Assume, that user root has access to SQL script dbcreate.sql. Note, that implementation of some operations may need more than one SQL statement.\u003c/p>\n\u003cp>(1) A user root with a password &#39;[ROOT_OR_USER_PASSWORD]&#39; would like to create a database called banks and nominate the database as its default database.\u003c/p>\n\u003cp>(2) A user root would like to create within a database banks, the relational tables given on page 3 of the examination paper.\u003c/p>\n\u003cp>(3) Then, a user root would like to create a new user account called admin with a password &#39;[ROOT_OR_USER_PASSWORD]&#39;.\u003c/p>\n\u003cp>(4) A user admin must have the rights to execute CREATE TABLE and CREATE VIEW statements with the rights to propagate the privilege to the other users.\u003c/p>\n\u003cp>(5) A user admin must have the rights to read information about all bank transactions submitted in 2021 with no rights to propagate the privilege to the other users.\u003c/p>\n","translationHTML":"\u003cp>假设共享schema中的CREATE TABLE语句保存在dbcreate.sql，脚本位于操作系统用户的$HOME/bank/sql目录。root已连接数据库并能访问脚本。以root身份实现下列操作；部分小题可能需要多条SQL。\u003c/p>\n\u003cp>(1) root按题面给出的密码创建banks数据库，并把它设为默认数据库。\u003c/p>\n\u003cp>(2) 在banks中创建题面给出的表，即处理dbcreate.sql脚本。\u003c/p>\n\u003cp>(3) 创建名为admin的新用户，密码按英文题面给定。\u003c/p>\n\u003cp>(4) admin必须能执行CREATE TABLE和CREATE VIEW，并能把相应权限转授其他用户。\u003c/p>\n\u003cp>(5) admin必须能读取2021年提交的Transaction信息，但不能转授这项读取权限。\u003c/p>\n"},{"id":"M2-Q6","title":"Mock Examination 2 — Question 6","topic":"两组并发事务","areas":["扩展"],"source":"mock-2","sourceLabel":"Mock Examination 2","sourceNote":"User-provided Questions 1–6; Q3–Q5 text attachments","origin":"Original material","priority":"A","question":"This question is related to a sample database created through processing of the common CREATE TABLE statements above.\n\n(1) Consider a bank that has a name NAB. Assume, that at the moment, the balance on account number 1 is equal to 100. Assume, that at the moment, the balance on account number 2 is equal to 200.\n\nAssume, that concurrently processed database transactions T1 and T2 interleaved their operations in a way listed below.\n\n```text\nT1                                           T2\nSET TRANSACTION ISOLATION LEVEL SERIALIZABLE;\n                                             SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;\nUPDATE ACCOUNT\nSET balance = balance + 10\nWHERE account_num = 1 AND\n      bank_name = 'NAB';\n                                             UPDATE ACCOUNT\n                                             SET balance = balance + 20\n                                             WHERE account_num = 1 AND\n                                                   bank_name = 'NAB';\n\nUPDATE ACCOUNT\nSET balance = (SELECT balance + 10\n               FROM ACCOUNT\n               WHERE account_num = 1 AND\n                     bank_name = 'NAB')\nWHERE account_num = 1 AND\n      bank_name = 'NAB';\n\nCOMMIT;\n                                             COMMIT;\n```\n\n(1) Explain how the values of an attribute balance in the rows where account_num = 1 and account_num = 2 in NAB bank change after each UPDATE statement.\n\n(2) Consider a bank that has a name NAB. Assume, that at the moment, the balance on account number 1 is equal to 100. Assume, that at the moment, the balance on account number 2 is equal to 200.\n\nAssume, that concurrently processed database transactions T1 and T2 interleaved their operations in a way listed below.\n\n```text\nT1                                              T2\nSET TRANSACTION ISOLATION LEVEL READ COMMITTED;\n                                                SET TRANSACTION ISOLATION LEVEL READ UNCOMMITTED;\nUPDATE ACCOUNT\nSET balance = balance + 10\nWHERE account_num = 1 AND\n      bank_name = 'NAB';\n                                                UPDATE ACCOUNT\n                                                SET balance = balance + 20\n                                                WHERE account_num = 2 AND\n                                                      bank_name = 'NAB';\n                                                COMMIT;\nUPDATE ACCOUNT\nSET balance = (SELECT balance + 10\n               FROM ACCOUNT\n               WHERE account_num = 2 AND\n                     bank_name = 'NAB')\nWHERE account_num = 1 AND\n      bank_name = 'NAB';\nCOMMIT;\n```\n\nExplain how the values of an attribute balance in the rows where account_num = 1 and account_num = 2 change after processing of each UPDATE statement.\n\nAnswer text Question 6","context":"bank","canonical":null,"parts":[{"number":"1","goal":"追踪同账户写冲突，并写明数据库模型","steps":["分别记录两个事务的操作，不把等待的UPDATE算作已经成功。T1先将账户1从100变110。","T2请求同一行，在T1持锁时等待；T1第二次能读自己的110，再写120并提交。","MySQL InnoDB合法等价SQL下，等待未超时则T2随后在120上加20得到140；课件Oracle SERIALIZABLE模型可能发生serialization error，未重试则保持120。","账户2未被任何语句修改，始终200。最后区分题意事务与字面MySQL SQL：原文缺START TRANSACTION，且同表子查询UPDATE可能Error1093。"],"check":"对140或120写明条件；原SQL失败不能当成功更新。","pitfall":"SERIALIZABLE规定可串行化语义，不承诺每种DBMS用完全相同的等待/重试机制。","mainType":"transactions","knowledge":["isolation","transaction","filter","dml"],"taskBrief":"按给定交错顺序记录账户余额，并说明锁、提交和引擎假设。","input":"共享Bank schema与题面条件","output":"追踪同账户写冲突，并写明数据库模型","examTips":["对140或120写明条件；原SQL失败不能当成功更新。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["SERIALIZABLE规定可串行化语义，不承诺每种DBMS用完全相同的等待/重试机制。"],"tables":["ACCOUNT"],"knowledgeUses":{"isolation":"对140或120写明条件；原SQL失败不能当成功更新。","transaction":"对140或120写明条件；原SQL失败不能当成功更新。","filter":"对140或120写明条件；原SQL失败不能当成功更新。","dml":"涉及对象／命名中间结果：ACCOUNT"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先列两个账户的初始值，并标出每条UPDATE属于哪个事务。","标记COMMIT及未提交值，检查是否修改同一行。","区分在原余额上累加与从另一个账户赋值；明确数据库和事务开始假设。"],"referenceHTML":"\u003cp>Assume explicit transactions and equivalent executable MySQL InnoDB updates. After T1&#39;s first UPDATE: account 1 = 110, account 2 = 200. T2 waits for account 1. After T1&#39;s next successful UPDATE: 120, 200. T1 commits; T2 can then add 20, giving 140, 200. Under the lecture&#39;s Oracle serializable-conflict model without retry, T2 can fail, leaving 120, 200. The original same-table subquery UPDATE has a MySQL restriction, and SET TRANSACTION does not itself start an explicit transaction. State these execution assumptions; do not present a single unconditional result.\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">UPDATE ACCOUNT\nSET balance = balance + 10\nWHERE account_num = 1\n  AND bank_name = &#39;NAB&#39;;\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"追踪跨账户赋值","steps":["本小题重新从100、200开始，不沿用上一题余额。","T1把账户1加到110，T2把账户2加到220并提交。","T1再读取账户2的220，把220+10整个结果赋给账户1，所以得到230，而非120。","T1提交后余额为230、220；读取发生在T2提交后，这条顺序没有dirty read。实际MySQL示范使用合法self-join并显式开事务。"],"check":"READ UNCOMMITTED允许某些现象，不代表本次一定读取到未提交数据。","pitfall":"把SET balance=(账户2+10)误算成“账户1再加10”。","mainType":"transactions","knowledge":["isolation","transaction","filter","join","dml"],"taskBrief":"按给定交错顺序记录账户余额，并说明锁、提交和引擎假设。","input":"共享Bank schema与题面条件","output":"追踪跨账户赋值","examTips":["READ UNCOMMITTED允许某些现象，不代表本次一定读取到未提交数据。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["把SET balance=(账户2+10)误算成“账户1再加10”。"],"tables":["ACCOUNT"],"knowledgeUses":{"isolation":"READ UNCOMMITTED允许某些现象，不代表本次一定读取到未提交数据。","transaction":"READ UNCOMMITTED允许某些现象，不代表本次一定读取到未提交数据。","filter":"READ UNCOMMITTED允许某些现象，不代表本次一定读取到未提交数据。","join":"涉及对象／命名中间结果：ACCOUNT","dml":"涉及对象／命名中间结果：ACCOUNT"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先列两个账户的初始值，并标出每条UPDATE属于哪个事务。","标记COMMIT及未提交值，检查是否修改同一行。","区分在原余额上累加与从另一个账户赋值；明确数据库和事务开始假设。"],"referenceHTML":"\u003cp>After T1 updates account 1: 110, 200. After T2 updates account 2: 110, 220. T2 commits. T1 reads the committed 220 and assigns 220+10 to account 1: 230, 220. T1 commits. This is assignment from account 2, not addition to account 1. There is no dirty read in this schedule. These values assume explicit transactions and an equivalent executable statement; the original direct same-table subquery is subject to MySQL&#39;s restriction.\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">UPDATE ACCOUNT AS A1\nJOIN ACCOUNT AS A2\n    ON A2.account_num = 2\n   AND A2.bank_name = &#39;NAB&#39;\nSET A1.balance = A2.balance + 10\nWHERE A1.account_num = 1\n  AND A1.bank_name = &#39;NAB&#39;;\n\u003c/code>\u003c/pre>\n"}],"tags":["Statement auditing and concurrency conditions"],"legacyPriority":"extension","level":"A","archived":false,"originType":"Official Mock Exam","mainType":"transactions","related":[],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"两组情景均重新从NAB的Account 1余额100、Account 2余额200开始。T1与T2按英文题面给出的交错顺序处理。必须逐条UPDATE说明余额变化。\n\n(1) 两个事务都采用SERIALIZABLE。T1先把Account 1增加10；T2尝试把同一Account 1增加20；随后T1把Account 1读取到的余额再增加10并赋回Account 1；最后按题面顺序COMMIT。需要解释T2在冲突期间是等待、成功还是失败。Account 2没有被更新。\n\n(2) T1采用READ COMMITTED，T2采用READ UNCOMMITTED。T1先把Account 1增加10。T2把Account 2增加20并COMMIT。T1再读取Account 2的余额，把“该值加10”的结果赋给Account 1，最后COMMIT。\n\n原题要求说明每条UPDATE处理后，这两个Account的balance分别如何变化。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["isolation","transaction","filter","dml","join"],"types":["transactions"],"requiredSkills":["Isolation level / row lock / 隔离级别与行锁","COMMIT / ROLLBACK / 提交与回滚","WHERE / predicate / 逐行筛选条件","INSERT / UPDATE / DELETE / 增加、修改和删除行","JOIN / join condition / 连接及连接条件"],"questionHTML":"\u003cp>This question is related to a sample database created through processing of the common CREATE TABLE statements above.\u003c/p>\n\u003cp>(1) Consider a bank that has a name NAB. Assume, that at the moment, the balance on account number 1 is equal to 100. Assume, that at the moment, the balance on account number 2 is equal to 200.\u003c/p>\n\u003cp>Assume, that concurrently processed database transactions T1 and T2 interleaved their operations in a way listed below.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">T1                                           T2\nSET TRANSACTION ISOLATION LEVEL SERIALIZABLE;\n                                             SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;\nUPDATE ACCOUNT\nSET balance = balance + 10\nWHERE account_num = 1 AND\n      bank_name = &#39;NAB&#39;;\n                                             UPDATE ACCOUNT\n                                             SET balance = balance + 20\n                                             WHERE account_num = 1 AND\n                                                   bank_name = &#39;NAB&#39;;\n\nUPDATE ACCOUNT\nSET balance = (SELECT balance + 10\n               FROM ACCOUNT\n               WHERE account_num = 1 AND\n                     bank_name = &#39;NAB&#39;)\nWHERE account_num = 1 AND\n      bank_name = &#39;NAB&#39;;\n\nCOMMIT;\n                                             COMMIT;\n\u003c/code>\u003c/pre>\n\u003cp>(1) Explain how the values of an attribute balance in the rows where account_num = 1 and account_num = 2 in NAB bank change after each UPDATE statement.\u003c/p>\n\u003cp>(2) Consider a bank that has a name NAB. Assume, that at the moment, the balance on account number 1 is equal to 100. Assume, that at the moment, the balance on account number 2 is equal to 200.\u003c/p>\n\u003cp>Assume, that concurrently processed database transactions T1 and T2 interleaved their operations in a way listed below.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">T1                                              T2\nSET TRANSACTION ISOLATION LEVEL READ COMMITTED;\n                                                SET TRANSACTION ISOLATION LEVEL READ UNCOMMITTED;\nUPDATE ACCOUNT\nSET balance = balance + 10\nWHERE account_num = 1 AND\n      bank_name = &#39;NAB&#39;;\n                                                UPDATE ACCOUNT\n                                                SET balance = balance + 20\n                                                WHERE account_num = 2 AND\n                                                      bank_name = &#39;NAB&#39;;\n                                                COMMIT;\nUPDATE ACCOUNT\nSET balance = (SELECT balance + 10\n               FROM ACCOUNT\n               WHERE account_num = 2 AND\n                     bank_name = &#39;NAB&#39;)\nWHERE account_num = 1 AND\n      bank_name = &#39;NAB&#39;;\nCOMMIT;\n\u003c/code>\u003c/pre>\n\u003cp>Explain how the values of an attribute balance in the rows where account_num = 1 and account_num = 2 change after processing of each UPDATE statement.\u003c/p>\n\u003cp>Answer text Question 6\u003c/p>\n","translationHTML":"\u003cp>两组情景均重新从NAB的Account 1余额100、Account 2余额200开始。T1与T2按英文题面给出的交错顺序处理。必须逐条UPDATE说明余额变化。\u003c/p>\n\u003cp>(1) 两个事务都采用SERIALIZABLE。T1先把Account 1增加10；T2尝试把同一Account 1增加20；随后T1把Account 1读取到的余额再增加10并赋回Account 1；最后按题面顺序COMMIT。需要解释T2在冲突期间是等待、成功还是失败。Account 2没有被更新。\u003c/p>\n\u003cp>(2) T1采用READ COMMITTED，T2采用READ UNCOMMITTED。T1先把Account 1增加10。T2把Account 2增加20并COMMIT。T1再读取Account 2的余额，把“该值加10”的结果赋给Account 1，最后COMMIT。\u003c/p>\n\u003cp>原题要求说明每条UPDATE处理后，这两个Account的balance分别如何变化。\u003c/p>\n"},{"id":"M3-Q1","title":"Mock Examination 3 — Question 1","topic":"大学概念建模","areas":["Conceptual"],"source":"mock-3","sourceLabel":"Mock Examination 3","sourceNote":"Received Mock Examination 3, Questions 1–6. Wording matches Mock Examination 1; each original question is displayed in full.","origin":"Duplicate source","priority":"A","question":"Read and analyse the following specification of a sample database domain.\n\nA University would like to create a database to record information about some of its activities. The university offers a number of degrees to students. A degree is described by a unique name, total number of credit points required to complete a degree, and several requirements that must be satisfied by the future students. The university offers three types of degrees: undergraduate degrees, postgraduate degrees, and graduate certificate. Postgraduate degrees are available only for the students who already got an undergraduate degree. A description of a postgraduate degree includes a list of acceptable undergraduate degrees. A description of a graduate certificate includes a requirement on the total number of years of professional experience.\n\nEach degree consists of a collection of subjects. A description of a subject consists of its unique code, unique title, total number of credits points a subject is worth, and a list of subject learning objectives.\n\nThe university employs academic staff members, tutors and support staff members. A description of a university employee consists of a unique employee number, first name last name and date of birth. First name, last name and date of birth uniquely identified each employee. Additionally, academic staff members and tutors are described by an academic degree achieved. Support staff members are described by a list of qualifications acquired in the past together with a date when each qualification has been acquired.\n\nThe university assigns the academic staff members and tutors to the subjects. A subject has one or two academic members assigned and a number of tutors. An academic staff member and tutor can be assigned to many subjects. Support staff members are assigned to the degrees. Each support staff member is assigned to one degree and a degree has one or more support staff members assigned.\n\nThe university is divided into faculties and faculties are divided into schools. Academic staff members and tutors belong to one school and each school consists of many academic staff members and tutors. The faculties and schools are described by the unique names.\n\nDraw a conceptual schema for the specification of a database domain listed above.","context":"","canonical":"M1-Q1","parts":[{"number":"1","goal":"从大学业务说明生成完整conceptual schema","steps":["先分对象种类：Degree、Subject、Employee、Faculty、School；再分Degree的三个子类、Employee的三个子类。不要因为文字提到学生，就新增没有描述要求的Student类。","逐项读唯一性：Subject的code与title分别唯一；Employee除employee_number外，还有(first_name,last_name,date_of_birth)这个组合identifier。把三个姓名/日期属性标成同一个ID标签。","把requirements、learning objectives表示为multivalued attributes；支持人员的qualification和acquired_date要成对，避免两个列表无法一一对应。","每条association分别向两个方向读：一门科目有1–2名academic staff；一位academic staff可负责多门。Support staff恰属于一个Degree，Degree至少对应一位Support staff。","将已确定的attributes、identifiers、multiplicities填进类框和关联线。a number of等未给精确下限的措辞，采用假设时单独标明，不把假设写成题面事实。"],"check":"图中必须既有属性，也有连接和数量；code、title两种独立identifier与员工三项组合identifier没有混淆。","pitfall":"不要用关系表的foreign keys代替conceptual association，也不要把员工已获学位限制为必须来自本校。","mainType":"conceptual","knowledge":["entity","identifier","multiplicity","association","generalization","multivalue"],"taskBrief":"把业务说明中的对象、属性、唯一性和数量画成完整概念图。","input":"英文题面和给定图／FD","output":"从大学业务说明生成完整conceptual schema","examTips":["图中必须既有属性，也有连接和数量；code、title两种独立identifier与员工三项组合identifier没有混淆。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不要用关系表的foreign keys代替conceptual association，也不要把员工已获学位限制为必须来自本校。"],"tables":[],"knowledgeUses":{"entity":"图中必须既有属性，也有连接和数量；code、title两种独立identifier与员工三项组合identifier没有混淆。","identifier":"图中必须既有属性，也有连接和数量；code、title两种独立identifier与员工三项组合identifier没有混淆。","multiplicity":"图中必须既有属性，也有连接和数量；code、title两种独立identifier与员工三项组合identifier没有混淆。","association":"图中必须既有属性，也有连接和数量；code、title两种独立identifier与员工三项组合identifier没有混淆。","generalization":"图中必须既有属性，也有连接和数量；code、title两种独立identifier与员工三项组合identifier没有混淆。","multivalue":"图中必须既有属性，也有连接和数量；code、title两种独立identifier与员工三项组合identifier没有混淆。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先找需要单独记录的对象类别，再把属性放回所属类别。","圈出唯一性与局部号码；是否允许新增属性要看原题，不能自行发明标识。","每条关联向两个方向读数量；检查泛化箭头是否指向父类。"],"referenceHTML":"\u003cp>Use the classes and associations below. Subject code and subject title are separate identifiers. Employee number is one identifier; (first_name, last_name, date_of_birth) is another. Keep each qualification paired with its acquisition date. Each subject has 1–2 academic staff. Each support staff member belongs to exactly one degree; each degree has at least one support staff member. Interpret unspecified lower bounds explicitly. Achieved deg dentifier；不同ID标签表示独立identifier。空心箭头指向父类。 [0..1]可选，[*]多值，/表示derived attribute。\u003c/figcaption>\u003cbutton class=\"zoom\" type=\"button\">放大图\u003c/button>\u003c/figure>"}],"tags":[],"legacyPriority":"duplicate","level":"A","archived":false,"originType":"Official Mock Exam","mainType":"conceptual","related":["M1-Q1"],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"阅读并分析以下数据库领域说明。\n\n一所大学希望建立数据库，记录它的部分活动。大学向学生开设多种Degree（学位课程）。每个Degree有唯一名称、完成该Degree所需的总学分，以及未来学生必须满足的若干入学要求。\n\n大学提供三类Degree：Undergraduate Degree（本科学位）、Postgraduate Degree（研究生学位）和Graduate Certificate（研究生证书）。只有已经取得本科学位的学生，才可以申请Postgraduate Degree。每个Postgraduate Degree的说明中列有可接受的本科学位。Graduate Certificate的说明中列有专业工作经验年数要求。\n\n每个Degree包含一组Subject（科目）。每个Subject有唯一code、唯一title、学分值，以及一组learning objectives（学习目标）。code与title分别唯一。\n\n大学雇用Academic Staff、Tutor和Support Staff。每位Employee记录唯一employee number、first name、last name和date of birth。first name、last name与date of birth的组合也能唯一识别Employee。Academic Staff与Tutor还记录已经取得的academic degree。Support Staff记录过去获得的每项qualification，以及该项qualification的取得日期。\n\n大学把Academic Staff和Tutor分配到Subject。每个Subject分配一至两位Academic Staff，以及若干Tutor。一位Academic Staff或Tutor可分配到多个Subject。Support Staff分配到Degree：每位Support Staff恰好对应一个Degree，每个Degree至少对应一位Support Staff。\n\n大学分为Faculty，Faculty再分为School。每位Academic Staff和Tutor属于一个School；每个School有多位Academic Staff和Tutor。Faculty与School都用各自唯一名称描述。\n\n为上述领域绘制conceptual schema（概念模式）。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["entity","identifier","multiplicity","association","generalization","multivalue"],"types":["conceptual"],"requiredSkills":["Class / attribute / 对象类别与属性","Identifier / 唯一标识","Multiplicity / 关联两端的数量范围","Many-to-many / association attribute / 多对多与关联属性","Generalization / inheritance / 泛化与继承","Multivalued / optional / derived / 多值、可选与可计算属性"],"questionHTML":"\u003cp>Read and analyse the following specification of a sample database domain.\u003c/p>\n\u003cp>A University would like to create a database to record information about some of its activities. The university offers a number of degrees to students. A degree is described by a unique name, total number of credit points required to complete a degree, and several requirements that must be satisfied by the future students. The university offers three types of degrees: undergraduate degrees, postgraduate degrees, and graduate certificate. Postgraduate degrees are available only for the students who already got an undergraduate degree. A description of a postgraduate degree includes a list of acceptable undergraduate degrees. A description of a graduate certificate includes a requirement on the total number of years of professional experience.\u003c/p>\n\u003cp>Each degree consists of a collection of subjects. A description of a subject consists of its unique code, unique title, total number of credits points a subject is worth, and a list of subject learning objectives.\u003c/p>\n\u003cp>The university employs academic staff members, tutors and support staff members. A description of a university employee consists of a unique employee number, first name last name and date of birth. First name, last name and date of birth uniquely identified each employee. Additionally, academic staff members and tutors are described by an academic degree achieved. Support staff members are described by a list of qualifications acquired in the past together with a date when each qualification has been acquired.\u003c/p>\n\u003cp>The university assigns the academic staff members and tutors to the subjects. A subject has one or two academic members assigned and a number of tutors. An academic staff member and tutor can be assigned to many subjects. Support staff members are assigned to the degrees. Each support staff member is assigned to one degree and a degree has one or more support staff members assigned.\u003c/p>\n\u003cp>The university is divided into faculties and faculties are divided into schools. Academic staff members and tutors belong to one school and each school consists of many academic staff members and tutors. The faculties and schools are described by the unique names.\u003c/p>\n\u003cp>Draw a conceptual schema for the specification of a database domain listed above.\u003c/p>\n","translationHTML":"\u003cp>阅读并分析以下数据库领域说明。\u003c/p>\n\u003cp>一所大学希望建立数据库，记录它的部分活动。大学向学生开设多种Degree（学位课程）。每个Degree有唯一名称、完成该Degree所需的总学分，以及未来学生必须满足的若干入学要求。\u003c/p>\n\u003cp>大学提供三类Degree：Undergraduate Degree（本科学位）、Postgraduate Degree（研究生学位）和Graduate Certificate（研究生证书）。只有已经取得本科学位的学生，才可以申请Postgraduate Degree。每个Postgraduate Degree的说明中列有可接受的本科学位。Graduate Certificate的说明中列有专业工作经验年数要求。\u003c/p>\n\u003cp>每个Degree包含一组Subject（科目）。每个Subject有唯一code、唯一title、学分值，以及一组learning objectives（学习目标）。code与title分别唯一。\u003c/p>\n\u003cp>大学雇用Academic Staff、Tutor和Support Staff。每位Employee记录唯一employee number、first name、last name和date of birth。first name、last name与date of birth的组合也能唯一识别Employee。Academic Staff与Tutor还记录已经取得的academic degree。Support Staff记录过去获得的每项qualification，以及该项qualification的取得日期。\u003c/p>\n\u003cp>大学把Academic Staff和Tutor分配到Subject。每个Subject分配一至两位Academic Staff，以及若干Tutor。一位Academic Staff或Tutor可分配到多个Subject。Support Staff分配到Degree：每位Support Staff恰好对应一个Degree，每个Degree至少对应一位Support Staff。\u003c/p>\n\u003cp>大学分为Faculty，Faculty再分为School。每位Academic Staff和Tutor属于一个School；每个School有多位Academic Staff和Tutor。Faculty与School都用各自唯一名称描述。\u003c/p>\n\u003cp>为上述领域绘制conceptual schema（概念模式）。\u003c/p>\n"},{"id":"M3-Q2","title":"Mock Examination 3 — Question 2","topic":"运输服务逻辑设计","areas":["Logical"],"source":"mock-3","sourceLabel":"Mock Examination 3","sourceNote":"Received Mock Examination 3, Questions 1–6. Wording matches Mock Examination 1; each original question is displayed in full.","origin":"Duplicate source","priority":"A","question":"Consider a conceptual schema given below.\n\n![Original conceptual schema](assets/mock-3-q2.jpg)\n\nYour task is to perform a step of logical database design, i.e. to transform a conceptual schema given above into a collection of relational schemas.\n\nFor each relational schema clearly list the names of attributes, primary key, candidate keys (if any), and foreign keys (if any). Assume, that a superset method must be used to implement a generalization.","context":"","canonical":"M1-Q2","parts":[{"number":"1","goal":"按superset method把运输服务图转换成relational schemas","steps":["TSERVICE的三个ID属性合起来才识别一项服务；先抄完整组合(departure_city,destination_city,departure_time)，后续所有引用都使用这三项。","先建立不引用其他表的BUS与DRIVER。DRIVER的dlnumber、enumber分别唯一：选其中一个为primary key，另一个保留为candidate key。","把较长与较短服务合入TSERVICE，增加service_type。total_days与total_hours是子类专有属性，在整表需要允许NULL，并按类别填写。","BUS到TSERVICE是一对多，把rego放入TSERVICE作foreign key；TSERVICE到DRIVER是many-to-many，建立SERVICE_DRIVER保存完整配对。","STOP受服务和snumber共同限定，所以primary key是服务三项标识再加snumber；STOP本身的到离时间与服务时间要区分命名。","用课堂PRIMARY KEY =、CANDIDATE KEY =、FOREIGN KEY = ... REFERENCES ...格式列出，父表先于子表。检查minimum participation不能仅靠foreign key保证的限制。"],"check":"最终有BUS、DRIVER、TSERVICE、SERVICE_DRIVER、STOP五个schemas；STOP每个key含4项。","pitfall":"0..1针对固定(service,snumber)，不是整项服务最多一个STOP。","mainType":"logical","knowledge":["keys","qualifier","association","superset"],"taskBrief":"把图中每一种特征转换成关系模式，并完整列出键和引用。","input":"英文题面和给定图／FD","output":"按superset method把运输服务图转换成relational schemas","examTips":["最终有BUS、DRIVER、TSERVICE、SERVICE_DRIVER、STOP五个schemas；STOP每个key含4项。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["0..1针对固定(service,snumber)，不是整项服务最多一个STOP。"],"tables":[],"knowledgeUses":{"keys":"最终有BUS、DRIVER、TSERVICE、SERVICE_DRIVER、STOP五个schemas；STOP每个key含4项。","qualifier":"最终有BUS、DRIVER、TSERVICE、SERVICE_DRIVER、STOP五个schemas；STOP每个key含4项。","association":"最终有BUS、DRIVER、TSERVICE、SERVICE_DRIVER、STOP五个schemas；STOP每个key含4项。","superset":"最终有BUS、DRIVER、TSERVICE、SERVICE_DRIVER、STOP五个schemas；STOP每个key含4项。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先写不依赖其他schema的父关系及其完整标识。","分别处理多对多、多值、qualifier与关联属性；引用复合标识不能漏列。","按题目要求使用superset，最后检查父表先于子表及全部键。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-text\">(departure_city, destination_city, departure_time)\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-text\">BUS(rego, make)\nPRIMARY KEY = (rego)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = none\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-text\">DRIVER(dlnumber, enumber, full_name)\nPRIMARY KEY = (dlnumber)\nCANDIDATE KEY1 = (enumber)\nFOREIGN KEY1 = none\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-text\">TSERVICE(\n    departure_city,\n    destination_city,\n    departure_time,\n    arrival_time,\n    rego,\n    service_type,\n    total_days,\n    total_hours\n)\n\nPRIMARY KEY = (departure_city, destination_city, departure_time)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (rego) REFERENCES BUS(rego)\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-text\">SERVICE_DRIVER(\n    departure_city,\n    destination_city,\n    departure_time,\n    dlnumber\n)\n\nPRIMARY KEY = (departure_city, destination_city, departure_time, dlnumber)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (departure_city, destination_city, departure_time)\n     REFERENCES TSERVICE(departure_city, destination_city, departure_time)\nFOREIGN KEY2 = (dlnumber) REFERENCES DRIVER(dlnumber)\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-text\">STOP(\n    service_departure_city,\n    service_destination_city,\n    service_departure_time,\n    snumber,\n    stop_city,\n    departure_time,\n    arrival_time\n)\n\nPRIMARY KEY = (\n    service_departure_city,\n    service_destination_city,\n    service_departure_time,\n    snumber\n)\nOTHER CANDIDATE KEYS = none\nFOREIGN KEY1 = (service_departure_city, service_destination_city, service_departure_time)\n    REFERENCES TSERVICE(departure_city, destination_city, departure_time)\n\u003c/code>\u003c/pre>\n\u003cp>Use the complete composite identifier in every reference. Minimum participation constraints are not guaranteed by foreign keys alone. In a superset table, a nullable subtype identifier is a conditional UNIQUE constraint rather than a non-null candidate key for every row.\u003c/p>\n\u003cp>Use every column of the full composite identifier in foreign keys. Minimum participation needs additional enforcement. Subtype-only nullable UNIQUE values are not candidate keys for all rows.\u003c/p>\n"}],"tags":[],"legacyPriority":"duplicate","level":"A","archived":false,"originType":"Official Mock Exam","mainType":"logical","related":["M1-Q2"],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"根据上面的conceptual schema进行logical database design：把图转换成一组relational schemas（关系模式）。\n\n对每个relational schema，清楚列出attributes、primary key、其他candidate keys（如有）以及foreign keys（如有）。generalization（泛化）必须使用superset method（超集法）实现。","imageGlossary":"**图中文字对照（仅翻译，不作转换提示）**：LONGER TSERVICE 较长运输服务；SHORTER TSERVICE 较短运输服务；TSERVICE 运输服务；BUS 巴士；DRIVER 司机；STOP 停靠点。total-days 总天数；total-hours 总小时数；rego 注册号；make 品牌；departure-city 出发城市；destination-city 目的城市；departure-time 出发时间；arrival time/arrival-time 到达时间；dlnumber 驾照号；enumber 员工号；full-name 全名；snumber 停靠序号。Assigned-to 分配给；Passes-through 途经。ID identifier；ID1、ID2 为不同identifier；1 恰好一个；* 多个（可为零）；1..* 一个或多个；0..1 零个或一个。三角空心箭头为 generalization（泛化）符号。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["keys","qualifier","association","superset"],"types":["logical"],"requiredSkills":["Primary / candidate / foreign key / 主键、候选键与外键","Qualified association / 用局部值限定的关联","Many-to-many / association attribute / 多对多与关联属性","Superset method / 超集法实现泛化"],"questionHTML":"\u003cp>Consider a conceptual schema given below.\u003c/p>\n\u003cp>\u003cimg src=\"assets/mock-3-q2.jpg\" alt=\"Original conceptual schema\">\u003c/p>\n\u003cp>Your task is to perform a step of logical database design, i.e. to transform a conceptual schema given above into a collection of relational schemas.\u003c/p>\n\u003cp>For each relational schema clearly list the names of attributes, primary key, candidate keys (if any), and foreign keys (if any). Assume, that a superset method must be used to implement a generalization.\u003c/p>\n","translationHTML":"\u003cp>根据上面的conceptual schema进行logical database design：把图转换成一组relational schemas（关系模式）。\u003c/p>\n\u003cp>对每个relational schema，清楚列出attributes、primary key、其他candidate keys（如有）以及foreign keys（如有）。generalization（泛化）必须使用superset method（超集法）实现。\u003c/p>\n\u003cdetails>\u003csummary>图中文字逐项对照\u003c/summary>\u003cp>\u003cstrong>图中文字对照（仅翻译，不作转换提示）\u003c/strong>：LONGER TSERVICE 较长运输服务；SHORTER TSERVICE 较短运输服务；TSERVICE 运输服务；BUS 巴士；DRIVER 司机；STOP 停靠点。total-days 总天数；total-hours 总小时数；rego 注册号；make 品牌；departure-city 出发城市；destination-city 目的城市；departure-time 出发时间；arrival time/arrival-time 到达时间；dlnumber 驾照号；enumber 员工号；full-name 全名；snumber 停靠序号。Assigned-to 分配给；Passes-through 途经。ID identifier；ID1、ID2 为不同identifier；1 恰好一个；* 多个（可为零）；1..* 一个或多个；0..1 零个或一个。三角空心箭头为 generalization（泛化）符号。\u003c/p>\n\u003c/details>"},{"id":"M3-Q3","title":"Mock Examination 3 — Question 3","topic":"运输数据库：SELECT 查询","areas":["SELECT"],"source":"mock-3","sourceLabel":"Mock Examination 3","sourceNote":"Received Mock Examination 3, Questions 1–6. Wording matches Mock Examination 1; each original question is displayed in full.","origin":"Duplicate source","priority":"A","question":"Write SELECT statements that implement the following queries.\n\n(1) Find the registration numbers of trucks, that have capacity in a range between 100 inclusive and 500 inclusive.\n\n(2) Find the first and the last names of all drivers who are on leave.\n\n(3) Find the registration numbers of all trucks that have not been used for any trips.\n\n(4) Find the registration numbers of all trucks together with total number of trips the trucks have been used for. There is no need to include the truck that have not been used for any trips.\n\n(5) Find the names of all departure cities together with the names of all destination cities.","context":"transport","canonical":"M1-Q3","parts":[{"number":"1","goal":"返回容量区间内卡车的注册号","steps":["输出只有注册号REGNUM，数据来自TRUCK，不需要连接其他表。","inclusive要求100、500都包含，使用CAPACITY BETWEEN 100 AND 500。","核对CREATE TABLE中的CAPACITY CHECK；若小于100的约束生效，此查询合法但没有匹配行。"],"check":"WHERE条件包含两个边界；有空结果时先核对约束，不修改题目数值。","pitfall":"不要把CAPACITY换成WEIGHT来“修复”原题冲突。","mainType":"fundamentals","knowledge":["projection","filter","range"],"taskBrief":"根据指定条件找行，只输出题目要求的列，并按需要排序。","input":"共享Transport schema与题面条件","output":"返回容量区间内卡车的注册号","examTips":["WHERE条件包含两个边界；有空结果时先核对约束，不修改题目数值。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不要把CAPACITY换成WEIGHT来“修复”原题冲突。"],"tables":["TRUCK"],"knowledgeUses":{"projection":"本小题输出：返回容量区间内卡车的注册号","filter":"WHERE条件包含两个边界；有空结果时先核对约束，不修改题目数值。","range":"WHERE条件包含两个边界；有空结果时先核对约束，不修改题目数值。"},"sqlPlan":[{"label":"选表／对象","text":"TRUCK"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"WHERE条件包含两个边界；有空结果时先核对约束，不修改题目数值。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT REGNUM\nFROM TRUCK\nWHERE CAPACITY BETWEEN 100 AND 500;\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"返回休假司机的名和姓","steps":["姓名在EMPLOYEE，状态在DRIVER，确定两表通过ENUM匹配。","JOIN后筛选D.STATUS = 'ON LEAVE'，而不是筛选员工表中不存在的状态。","SELECT只列FNAME、LNAME。不同司机可同名，题目没有要求按姓名去重。"],"check":"每个符合状态的司机贡献一行姓名。","pitfall":"只查DRIVER得不到姓名，随意DISTINCT又可能合并不同司机。","mainType":"joins","knowledge":["projection","filter","join"],"taskBrief":"连接相关表；题目要求包含零匹配对象时，明确保留哪一侧。","input":"共享Transport schema与题面条件","output":"返回休假司机的名和姓","examTips":["每个符合状态的司机贡献一行姓名。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["只查DRIVER得不到姓名，随意DISTINCT又可能合并不同司机。"],"tables":["EMPLOYEE","DRIVER"],"knowledgeUses":{"projection":"本小题输出：返回休假司机的名和姓","filter":"每个符合状态的司机贡献一行姓名。","join":"涉及对象／命名中间结果：EMPLOYEE, DRIVER"},"sqlPlan":[{"label":"选表／对象","text":"EMPLOYEE, DRIVER"},{"label":"连接与层次","text":"使用JOIN并检查完整ON条件；先确定每行的计数单位。"},{"label":"筛选、分组与输出","text":"每个符合状态的司机贡献一行姓名。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT E.FNAME, E.LNAME\nFROM EMPLOYEE AS E\nJOIN DRIVER AS D\n    ON D.ENUM = E.ENUM\nWHERE D.STATUS = &#39;ON LEAVE&#39;;\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"返回从未执行行程的卡车","steps":["从TRUCK开始，才能包含没有任何TRIP的卡车。","对当前卡车匹配TRIP.REGNUM = TRUCK.REGNUM。","用NOT EXISTS保留完全没有匹配行程的卡车；车辆当前状态不代表历史是否使用过。"],"check":"没有行程的卡车必须保留；有一次或更多行程的必须排除。","pitfall":"WHERE状态AVAILABLE不能回答“从未使用”。","mainType":"nested","knowledge":["projection","filter","nested","exists"],"taskBrief":"用内层查询的结果筛选外层；采用题目规定的嵌套形式。","input":"共享Transport schema与题面条件","output":"返回从未执行行程的卡车","examTips":["没有行程的卡车必须保留；有一次或更多行程的必须排除。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["WHERE状态AVAILABLE不能回答“从未使用”。"],"tables":["TRUCK","TRIP"],"knowledgeUses":{"projection":"本小题输出：返回从未执行行程的卡车","filter":"没有行程的卡车必须保留；有一次或更多行程的必须排除。","nested":"没有行程的卡车必须保留；有一次或更多行程的必须排除。","exists":"没有行程的卡车必须保留；有一次或更多行程的必须排除。"},"sqlPlan":[{"label":"选表／对象","text":"TRUCK, TRIP"},{"label":"连接与层次","text":"按题目指定形式区分内外层查询。"},{"label":"筛选、分组与输出","text":"没有行程的卡车必须保留；有一次或更多行程的必须排除。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先确定输入对象、输出列及每一行代表什么。","检查题面中的数量、边界、状态、是否包含零匹配，以及指定的SQL形式。","按“选表→关联→筛选→分组／嵌套→输出”完成；再对照条件逐项自查。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT T.REGNUM\nFROM TRUCK AS T\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM TRIP AS P\n    WHERE P.REGNUM = T.REGNUM\n);\n\u003c/code>\u003c/pre>\n"},{"number":"4","goal":"按已使用卡车统计行程次数","steps":["TRIP中的一行是一趟行程，正是要计数的对象。","按REGNUM分组，用COUNT(*)统计每组行数。","直接从TRIP出发即可自动排除没有行程的卡车，不需要额外outer join。"],"check":"同一注册号只出一行；计数是trip数而不是leg数。","pitfall":"连接TRIPLEG会把一趟多段行程放大成多行。","mainType":"aggregate","knowledge":["proj ode class=\"language-sql\">SELECT DEPARTURE AS CITY\nFROM TRIPLEG\nUNION\nSELECT DESTINATION AS CITY\nFROM TRIPLEG;\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-sql\">SELECT DISTINCT DEPARTURE, DESTINATION\nFROM TRIPLEG;\n\u003c/code>\u003c/pre>\n"}],"tags":[],"legacyPriority":"duplicate","level":"A","archived":false,"originType":"Official Mock Exam","mainType":"fundamentals","related":["M1-Q3"],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"编写SELECT语句完成以下查询。所需CREATE TABLE语句在本题的共享schema中。\n\n(1) 找出capacity在100至500之间、包含两个边界的Truck，输出REGNUM。\n\n(2) 找出所有状态为ON LEAVE的Driver，输出first name与last name。\n\n(3) 找出从未用于任何Trip的Truck，输出REGNUM。\n\n(4) 对每辆用于过Trip的Truck，输出REGNUM及Trip总数。无需包含从未用于Trip的Truck。\n\n(5) 找出所有departure city的名称，以及所有destination city的名称。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["projection","filter","range","join","nested","exists","count","group","union","distinct"],"types":["fundamentals","joins","nested","aggregate"],"requiredSkills":["SELECT / projection / 选择输出列","WHERE / predicate / 逐行筛选条件","BETWEEN / date range / 区间筛选","JOIN / join condition / 连接及连接条件","Nested query / 嵌套查询","EXISTS / NOT EXISTS / 存在与不存在","COUNT / grain / 计数与计数单位","GROUP BY / aggregate / 分组与聚合","UNION / UNION ALL / 合并结果集","DISTINCT / 删除重复结果行"],"questionHTML":"\u003cp>Write SELECT statements that implement the following queries.\u003c/p>\n\u003cp>(1) Find the registration numbers of trucks, that have capacity in a range between 100 inclusive and 500 inclusive.\u003c/p>\n\u003cp>(2) Find the first and the last names of all drivers who are on leave.\u003c/p>\n\u003cp>(3) Find the registration numbers of all trucks that have not been used for any trips.\u003c/p>\n\u003cp>(4) Find the registration numbers of all trucks together with total number of trips the trucks have been used for. There is no need to include the truck that have not been used for any trips.\u003c/p>\n\u003cp>(5) Find the names of all departure cities together with the names of all destination cities.\u003c/p>\n","translationHTML":"\u003cp>编写SELECT语句完成以下查询。所需CREATE TABLE语句在本题的共享schema中。\u003c/p>\n\u003cp>(1) 找出capacity在100至500之间、包含两个边界的Truck，输出REGNUM。\u003c/p>\n\u003cp>(2) 找出所有状态为ON LEAVE的Driver，输出first name与last name。\u003c/p>\n\u003cp>(3) 找出从未用于任何Trip的Truck，输出REGNUM。\u003c/p>\n\u003cp>(4) 对每辆用于过Trip的Truck，输出REGNUM及Trip总数。无需包含从未用于Trip的Truck。\u003c/p>\n\u003cp>(5) 找出所有departure city的名称，以及所有destination city的名称。\u003c/p>\n"},{"id":"M3-Q4","title":"Mock Examination 3 — Question 4","topic":"司机技能与行程记录的修改","areas":["DDL/DML"],"source":"mock-3","sourceLabel":"Mock Examination 3","sourceNote":"Received Mock Examination 3, Questions 1–6. Wording matches Mock Examination 1; each original question is displayed in full.","origin":"Duplicate source","priority":"A","question":"Write SQL statements that implement the following structural modifications of a database and data manipulations on the contents of a database. Note, that implementation of some of the tasks listed below may need more than one SQL statement.\n\n(1) We would like to add to a database information about the skills possessed by each driver. Assume, that a driver has many skills and a skill can be possessed by many drivers. It may happen that some skills are not possessed by any driver. The types of the new columns are up to you.\n\n(2) Delete from a database information about the second and third leg of a trip 36.\n\n(3) Change a date of trip number 26 to the next day after the present date of trip 26.\n\n(4) Assume that a trip number 25 has 3 legs. A trip number 25 started in Sydney and it ended in Perth. Add one more leg to a trip 25 such that after update the trip ends in the same city it started from.\n\n(5) Assume that a trip 20 has 2 legs and that a destination of the first leg is Sydney. Update information about a trip 20 such that after update a destination of the first leg is Perth.","context":"transport","canonical":"M1-Q4","parts": 第2、3段、行程36的其他路段均保留。","pitfall":"漏掉TNUM会误删所有行程的这些路段。","mainType":"ddl-dml","knowledge":["filter","dml","keys"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"共享Transport schema与题面条件","output":"只删除行程36的第2、3段","examTips":["其他行程的第2、3段、行程36的其他路段均保留。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["漏掉TNUM会误删所有行程的这些路段。"],"tables":["TRIPLEG"],"knowledgeUses":{"filter":"其他行程的第2、3段、行程36的其他路段均保留。","dml":"涉及对象／命名中间结果：TRIPLEG","keys":"涉及对象／命名中间结果：TRIPLEG"},"sqlPlan":[{"label":"选表／对象","text":"TRIPLEG"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"其他行程的第2、3段、行程36的其他路段均保留。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">DELETE FROM TRIPLEG\nWHERE TNUM = 36\n  AND LEGNUM IN (2, 3);\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"给行程26当前日期加一天","steps":["WHERE TNUM=26确定唯一要更新的行。","题目说present date of trip 26，基准是已存TDATE。","SET TDATE=DATE_ADD(TDATE,INTERVAL 1 DAY)处理跨月、跨年；检查更新后不会违反既有UNIQUE组合。"],"check":"原日期若为月末或年末，结果仍是正确下一天。","pitfall":"CURRENT_DATE()+1用今天作起点，与题意不同。","mainType":"ddl-dml","knowledge":["filter","dml"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"共享Transport schema与题面条件","output":"给行程26当前日期加一天","examTips":["原日期若为月末或年末，结果仍是正确下一天。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["CURRENT_DATE()+1用今天作起点，与题意不同。"],"tables":["TRIP"],"knowledgeUses":{"filter":"原日期若为月末或年末，结果仍是正确下一天。","dml":"涉及对象／命名中间结果：TRIP"},"sqlPlan":[{"label":"选表／对象","text":"TRIP"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"原日期若为月末或年末，结果仍是正确下一天。"}],"validation":"已在隔离的SQLite内存数据中核对相关查询／数据变化；涉及MySQL方言时有明确适配，不等同MySQL执行验证。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">UPDATE TRIP\nSET TDATE = DATE_ADD(TDATE, INTERVAL 1 DAY)\nWHERE TNUM = 26;\n\u003c/code>\u0 每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">UPDATE TRIPLEG\nSET DESTINATION = &#39;Perth&#39;\nWHERE TNUM = 20\n  AND LEGNUM = 1;\n\nUPDATE TRIPLEG\nSET DEPARTURE = &#39;Perth&#39;\nWHERE TNUM = 20\n  AND LEGNUM = 2;\n\u003c/code>\u003c/pre>\n"}],"tags":[],"legacyPriority":"duplicate","level":"A","archived":false,"originType":"Official Mock Exam","mainType":"ddl-dml","related":["M1-Q4"],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"编写SQL完成下列结构修改和数据操作。部分小题可能需要不止一条SQL语句。使用本题给出的Transport schema。\n\n(1) 增加Driver所拥有的Skill信息。一个Driver拥有多项Skill，一项Skill可由多个Driver拥有。某些Skill也可能尚未由任何Driver拥有。新增列的类型自行选择。\n\n(2) 删除Trip 36中第2段与第3段的信息。\n\n(3) 把Trip 26的日期改成它当前所存日期的后一天。\n\n(4) 已知Trip 25有3段，从Sydney出发、在Perth结束。再增加一段，使更新后的Trip回到最初出发的城市。\n\n(5) 已知Trip 20有2段，第1段目的地为Sydney。更新Trip 20，使第1段目的地变成Perth。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["keys","constraints","types","filter","dml"],"types":["ddl-dml"],"requiredSkills":["Primary / candidate / foreign key / 主键、候选键与外键","CHECK / UNIQUE / NOT NULL / 值限制、唯一与必填","DECIMAL(p,s) / 精确数值的位数","WHERE / predicate / 逐行筛选条件","INSERT / UPDATE / DELETE / 增加、修改和删除行"],"questionHTML":"\u003cp>Write SQL statements that implement the following structural modifications of a database and data manipulations on the contents of a database. Note, that implementation of some of the tasks listed below may need more than one SQL statement.\u003c/p>\n\u003cp>(1) We would like to add to a database information about the skills possessed by each driver. Assume, that a driver has many skills and a skill can be possessed by many drivers. It may happen that some skills are not possessed by any driver. The types of the new columns are up to you.\u003c/p>\n\u003cp>(2) Delete from a database information about the second and third leg of a trip 36.\u003c/p>\n\u003cp>(3) Change a date of trip number 26 to the next day after the present date of trip 26.\u003c/p>\n\u003cp>(4) Assume that a trip number 25 has 3 legs. A trip number 25 started in Sydney and it ended in Perth. Add one more leg to a trip 25 such that after update the trip ends in the same city it started from.\u003c/p>\n\u003cp>(5) Assume that a trip 20 has 2 legs and that a destination of the first leg is Sydney. Update information about a trip 20 such that after update a destination of the first leg is Perth.\u003c/p>\n","translationHTML":"\u003cp>编写SQL完成下列结构修改和数据操作。部分小题可能需要不止一条SQL语句。使用本题给出的Transport schema。\u003c/p>\n\u003cp>(1) 增加Driver所拥有的Skill信息。一个Driver拥有多项Skill，一项Skill可由多个Driver拥有。某些Skill也可能尚未由任何Driver拥有。新增列的类型自行选择。\u003c/p>\n\u003cp>(2) 删除Trip 36中第2段与第3段的信息。\u003c/p>\n\u003cp>(3) 把Trip 26的日期改成它当前所存日期的后一天。\u003c/p>\n\u003cp>(4) 已知Trip 25有3段，从Sydney出发、在Perth结束。再增加一段，使更新后的Trip回到最初出发的城市。\u003c/p>\n\u003cp>(5) 已知Trip 20有2段，第1段目的地为Sydney。更新Trip 20，使第1段目的地变成Perth。\u003c/p>\n"},{"id":"M3-Q5","title":"Mock Examination 3 — Question 5","topic":"TRAINER_01 / USER_B 用户与权限","areas":["Access"],"source":"mock-3","sourceLabel":"Mock Examination 3","sourceNote":"Received Mock Examination 3, Questions 1–6. Wording matches Mock Examination 1; each original question is displayed in full.","origin":"Duplicate source","priority":"A","question":"Assume that a user root with a password '[ROOT_OR_USER_PASSWORD]' created a database called transport and the user executed CREATE TABLE statements given on page 2 of the examination paper to create the relational tables in the database transport.\n\nWrite the implementations of the operations listed below as a user root. Assume that a user root has already connected to the database. Note, that implementation of some operations may need more than one SQL statement.\n\n(1) A user root nominates a database transport as a default database and then the user creates two new users USER_A and USER_B.\n\n(2) A user root grants the read access rights to the relational tables EMPLOYEE and DRIVER to a user USER_A. The read access rights cannot be propagated to other roles or users.\n\n(3) A user root grants the rights to insert the rows into a relational tables TRIP and TRIPLEG to a user USER_B. The access rights can be propagated to other roles or users.\n\n(4) A user root grants the update privilege on all relational tables in csit115 database to a user USER_A. The privilege cannot be propagated to other roles or users.\n\n(5) A user root grants the rights to information about the total number trips performed by each driver to a user USER_B.","context":"transport","canonical":"M1-Q5","parts":[{"number":"1","goal":"设定默认数据库并创建两名用户","steps":["root已连接，直接USE transport，无需再次写登录命令。","统一约定TRAINER_01、USER_B为localhost账号，避免后续GRANT引用不同host。","CREATE USER各执行一次；题目只给了root密码，不把它自动分配给新用户。"],"check":"USE先于依赖默认数据库的操作；新用户名称/host前后一致。","pitfall":"数据库用户名root与操作系统root不是一回事。","mainType":"access","knowledge":["user","source"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"共享Transport schema与题面条件","output":"设定默认数据库并创建两名用户","examTips":["USE先于依赖默认数据库的操作；新用户名称/host前后一致。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["数据库用户名root与操作系统root不是一回事。"],"tables":[],"knowledgeUses":{"user":"USE先于依赖默认数据库的操作；新用户名称/host前后一致。","source":"USE先于依赖默认数据库的操作；新用户名称/host前后一致。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">USE transport;\n\nCREATE USER &#39;USER_A&#39;@&#39;localhost&#39;;\nCREATE USER &#39;USER_B&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"授予TRAINER_01读取两表且不可转授","steps":["读取表的操作权限是SELECT。","分别对transport.EMPLOYEE、transport.DRIVER授权。","对于新建且没有其他权限来源的TRAINER_01，不带WITH GRANT OPTION。"],"check":"只读范围包含两表，未增加INSERT或UPDATE。","pitfall":"省略GRANT OPTION仅在没有其他传播权限来源时满足不可转授，不能普遍忽略旧授权。","mainType":"access","knowledge":["grant","grantoption"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"共享Transport schema与题面条件","output":"授予TRAINER_01读取两表且不可转授","examTips":["只读范围包含两表，未增加INSERT或UPDATE。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["省略GRANT OPTION仅在没有其他传播权限来源时满足不可转授，不能普遍忽略旧授权。"],"tables":[],"knowledgeUses":{"grant":"只读范围包含两表，未增加INSERT或UPDATE。","grantoption":"只读范围包含两表，未增加INSERT或UPDATE。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">GRANT SELECT ON transport.EMPLOYEE\nTO &#39;USER_A&#39;@&#39;localhost&#39;;\n\nGRANT SELECT ON transport.DRIVER\nTO &#39;USER_A&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"授予USER_B插入两表并允许转授","steps":["插入行使用INSERT privilege，不需要授全部权限。","分别定位transport.TRIP、transport.TRIPLEG。","每条GRANT加WITH GRANT OPTION，允许继续授予相同范围权限。"],"check":"两个目标表都有INSERT及转授权能力。","pitfall":"WITH ADMIN OPTION针对role成员资格，不替代对象的GRANT OPTION。","mainType":"access","knowledge":["dml","grant","grantoption"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"共享Transport schema与题面条件","output":"授予USER_B插入两表并允许转授","examTips":["两个目标表都有INSERT及转授权能力。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["WITH ADMIN OPTION针对role成员资格，不替代对象的GRANT OPTION。"],"tables":[],"knowledgeUses":{"dml":"两个目标表都有INSERT及转授权能力。","grant":"两个目标表都有INSERT及转授权能力。","grantoption":"两个目标表都有INSERT及转授权能力。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">GRANT INSERT ON transport.TRIP\nTO &#39;USER_B&#39;@&#39;localhost&#39;\nWITH GRANT OPTION;\n\nGRANT INSERT ON transport.TRIPLEG\nTO &#39;USER_B&#39;@&#39;localhost&#39;\nWITH GRANT OPTION;\n\u003c/code>\u003c/pre>\n"},{"number":"4","goal":"授予TRAINER_01数据库范围的UPDATE","steps":["原文写csit115数据库，保留这个名字，不擅自换成transport。","ON csit115.*表示该数据库内所有表。","只授UPDATE，且不增加WITH GRANT OPTION。"],"check":"权限范围是数据库，不是全服务器*.*。","pitfall":"把root的密码csit115与本小题数据库名混为一个概念会读错范围。","mainType":"access","knowledge":["dml","grant","grantoption"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"共享Transport schema与题面条件","output":"授予TRAINER_01数据库范围的UPDATE","examTips":["权限范围是数据库，不是全服务器*.*。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["把root的密码csit115与本小题数据库名混为一个概念会读错范围。"],"tables":["ON"],"knowledgeUses":{"dml":"涉及对象／命名中间结果：ON","grant":"权限范围是数据库，不是全服务器*.*。","grantoption":"权限范围是数据库，不是全服务器*.*。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">GRANT UPDATE ON csit115.*\nTO &#39;USER_A&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"},{"number":"5","goal":"通过view开放司机行程总数","steps":["从DRIVER左连接TRIP，才能保留零行程司机。","按司机的ENUM、LNUM分组，COUNT(T.TNUM)让未匹配者得到0。","由root创建SQL SECURITY DEFINER view，再只授USER_B该view的SELECT。"],"check":"零次司机为0；USER_B不必取得底表直接读取权。","pitfall":"COUNT(*)会把outer join补出的行也算成1。","mainType":"access","knowledge":["projection","join","count","grant","grantoption","view","definer","left","group"],"taskBrief":"按用户、操作、对象范围和能否转授，逐项实现权限。","input":"共享Transport schema与题面条件","output":"通过view开放司机行程总数","examTips":["零次司机为0；USER_B不必取得底表直接读取权。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["COUNT(*)会把outer join补出的行也算成1。"],"tables":["transport.DRIVER","transport.TRIP"],"knowledgeUses":{"projection":"本小题输出：通过view开放司机行程总数","join":"涉及对象／命名中间结果：transport.DRIVER, transport.TRIP","count":"零次司机为0；USER_B不必取得底表直接读取权。","grant":"零次司机为0；USER_B不必取得底表直接读取权。","grantoption":"零次司机为0；USER_B不必取得底表直接读取权。","view":"涉及对象／命名中间结果：transport.DRIVER, transport.TRIP","definer":"零次司机为0；USER_B不必取得底表直接读取权。","left":"零次司机为0；USER_B不必取得底表直接读取权。","group":"零次司机为0；USER_B不必取得底表直接读取权。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["列出用户、操作、对象范围、能否转授四项。","区分database.*、单张table与指定columns。","只开放汇总／部分行时考虑View；检查已有权限来源是否叠加。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">CREATE SQL SECURITY DEFINER VIEW transport.DRIVER_TRIP_TOTAL AS\nSELECT D.ENUM,\n       D.LNUM,\n       COUNT(T.TNUM) AS TOTAL_TRIPS\nFROM transport.DRIVER AS D\nLEFT JOIN transport.TRIP AS T\n    ON T.LNUM = D.LNUM\nGROUP BY D.ENUM, D.LNUM;\n\nGRANT SELECT ON transport.DRIVER_TRIP_TOTAL\nTO &#39;USER_B&#39;@&#39;localhost&#39;;\n\u003c/code>\u003c/pre>\n"}],"tags":[],"legacyPriority":"duplicate","level":"A","archived":false,"originType":"Official Mock Exam","mainType":"access","related":["M1-Q5"],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"root用户已连接数据库，并已在transport数据库建立题面给出的表。root的密码按英文题面给定。以root身份实现以下操作；部分小题可能需要多条SQL。\n\n(1) 把transport设为默认数据库，然后创建英文题面指定的两个用户。\n\n(2) 向第一个用户授予EMPLOYEE和DRIVER表的读取权限。这些权限不能再授予其他用户或role。\n\n(3) 向第二个用户授予向TRIP和TRIPLEG插入行的权限，并允许它把这些权限再授予其他用户或role。\n\n(4) 向第一个用户授予csit115数据库中所有表的UPDATE权限，不允许转授。\n\n(5) 向第二个用户开放“每位Driver完成的Trip总数”信息。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"knowledge":["user","source","grant","grantoption","dml","projection","join","count","view","definer","left","group"],"types":["access"],"requiredSkills":["CREATE USER / account host / 创建用户及主机范围","USE / SOURCE / client commands / 选库与处理SQL脚本","GRANT / privilege scope / 授予权限与对象范围","WITH GRANT OPTION / 权限转授","INSERT / UPDATE / DELETE / 增加、修改和删除行","SELECT / projection / 选择输出列","JOIN / join condition / 连接及连接条件","COUNT / grain / 计数与计数单位","View / dependency / 视图与依赖","SQL SECURITY DEFINER / 由视图定义者权限读取底表","LEFT JOIN / 保留左侧未匹配行的连接","GROUP BY / aggregate / 分组与聚合"],"questionHTML":"\u003cp>Assume that a user root with a password &#39;[ROOT_OR_USER_PASSWORD]&#39; created a database called transport and the user executed CREATE TABLE statements given on page 2 of the examination paper to create the relational tables in the database transport.\u003c/p>\n\u003cp>Write the implementations of the operations listed below as a user root. Assume that a user root has already connected to the database. Note, that implementation of some operations may need more than one SQL statement.\u003c/p>\n\u003cp>(1) A user root nominates a database transport as a default database and then the user creates two new users USER_A and USER_B.\u003c/p>\n\u003cp>(2) A user root grants the read access rights to the relational tables EMPLOYEE and DRIVER to a user USER_A. The read access rights cannot be propagated to other roles or users.\u003c/p>\n\u003cp>(3) A user root grants the rights to insert the rows into a relational tables TRIP and TRIPLEG to a user USER_B. The access rights can be propagated to other roles or users.\u003c/p>\n\u003cp>(4) A user root grants the update privilege on all relational tables in csit115 database to a user USER_A. The privilege cannot be propagated to other roles or users.\u003c/p>\n\u003cp>(5) A user root grants the rights to information about the total number trips performed by each driver to a user USER_B.\u003c/p>\n","translationHTML":"\u003cp>root用户已连接数据库，并已在transport数据库建立题面给出的表。root的密码按英文题面给定。以root身份实现以下操作；部分小题可能需要多条SQL。\u003c/p>\n\u003cp>(1) 把transport设为默认数据库，然后创建英文题面指定的两个用户。\u003c/p>\n\u003cp>(2) 向第一个用户授予EMPLOYEE和DRIVER表的读取权限。这些权限不能再授予其他用户或role。\u003c/p>\n\u003cp>(3) 向第二个用户授予向TRIP和TRIPLEG插入行的权限，并允许它把这些权限再授予其他用户或role。\u003c/p>\n\u003cp>(4) 向第一个用户授予csit115数据库中所有表的UPDATE权限，不允许转授。\u003c/p>\n\u003cp>(5) 向第二个用户开放“每位Driver完成的Trip总数”信息。\u003c/p>\n"},{"id":"M3-Q6","title":"Mock Examination 3 — Question 6","topic":"查找行程次数超过100的卡车","areas":["DDL/DML"],"source":"mock-3","sourceLabel":"Mock Examination 3","sourceNote":"Received Mock Examination 3, Questions 1–6. Wording matches Mock Examination 1; each original question is displayed in full.","origin":"Duplicate source","priority":"A","question":"Assume, that we would like to verify the following logical consistency constraint imposed on the contents of a sample database.\n\n\"A truck cannot be used for more that 100 trips\"\n\nWrite SQL statements that perform the following actions.\n\n(1) First, create a relational table MESSAGE with information about the contents of a sample database that violate the following consistency constraint listed above. A relational table MESSAGE must consist of two columns. The first column contains truck registration numbers and the second column contains the total number of trips for all trucks that have been used for more than 100 trips.\n\n(2) Next, list the contents of a relational table MESSAGE in the following way.\n\nTruck \u003cinsert ruck registration number here> has been used for \u003cinsert total number of trips here> trips.\n\nFor example, if a truck with registration number PKR856 has been used 120 times then the following line must be listed.\n\nTruck PKR856 has been used for 120 trips.\n\n(3) Next, make the contents of a relational table MESSAGE permanent.\n\n(4) Finally, drop a relational table MESSAGE.","context":"transport","canonical":"M1-Q6","parts":[{"number":"1","goal":"创建只包含违规卡车的两列快照表","steps":["按TRIP.REGNUM分组，对行程计数，不连接路段表。","HAVING COUNT(*)>100筛选违规组，100恰好不违规。","CREATE TABLE MESSAGE AS SELECT只选REGNUM和次数别名，保持两列。"],"check":"表结构恰好两列；满足规则的卡车不在MESSAGE中。","pitfall":"WHERE不能直接筛选分组后的COUNT，>=100又会多报边界。","mainType":"ddl-dml","knowledge":["projection","count","group","having","keys","constraints"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"共享Transport schema与题面条件","output":"创建只包含违规卡车的两列快照表","examTips":["表结构恰好两列；满足规则的卡车不在MESSAGE中。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["WHERE不能直接筛选分组后的COUNT，>=100又会多报边界。"],"tables":["MESSAGE","TRIP"],"knowledgeUses":{"projection":"本小题输出：创建只包含违规卡车的两列快照表","count":"表结构恰好两列；满足规则的卡车不在MESSAGE中。","group":"表结构恰好两列；满足规则的卡车不在MESSAGE中。","having":"表结构恰好两列；满足规则的卡车不在MESSAGE中。","keys":"涉及对象／命名中间结果：MESSAGE, TRIP","constraints":"表结构恰好两列；满足规则的卡车不在MESSAGE中。"},"sqlPlan":[{"label":"选表／对象","text":"MESSAGE, TRIP"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"表结构恰好两列；满足规则的卡车不在MESSAGE中。"}],"validation":"MESSAGE筛选、100次边界及输出句式已在SQLite内存数据核对；COMMIT及MySQL DDL语义按文档静态复核。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">CREATE TABLE MESSAGE AS\nSELECT REGNUM, COUNT(*) AS TOTAL_TRIPS\nFROM TRIP\nGROUP BY REGNUM\nHAVING COUNT(*) &gt; 100;\n\u003c/code>\u003c/pre>\n"},{"number":"2","goal":"按要求构造一列英文消息","steps":["从已经建立的MESSAGE读REGNUM与TOTAL_TRIPS。","CONCAT拼接固定文字、注册号和次数。","保留空格和末尾句号，使输出与题目示例一致。"],"check":"示例应为Truck PKR856 has been used for 120 trips.。","pitfall":"不是SELECT三个分开的列，也不需要修改数据库里的注册号。","mainType":"ddl-dml","knowledge":["projection","concat"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"共享Transport schema与题面条件","output":"按要求构造一列英文消息","examTips":["示例应为Truck PKR856 has been used for 120 trips.。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["不是SELECT三个分开的列，也不需要修改数据库里的注册号。"],"tables":["MESSAGE"],"knowledgeUses":{"projection":"本小题输出：按要求构造一列英文消息","concat":"示例应为Truck PKR856 has been used for 120 trips.。"},"sqlPlan":[{"label":"选表／对象","text":"MESSAGE"},{"label":"连接与层次","text":"没有必要时不增加JOIN。"},{"label":"筛选、分组与输出","text":"示例应为Truck PKR856 has been used for 120 trips.。"}],"validation":"MESSAGE筛选、100次边界及输出句式已在SQLite内存数据核对；COMMIT及MySQL DDL语义按文档静态复核。","hints":["先判断每小题是在改结构还是改数据行。","核对类型容量、值范围、键与外键依赖。","建表／插入先父后子，删除先子后父；UPDATE检查WHERE范围和计算起点。"],"referenceHTML":"\u003cpre>\u003ccode class=\"language-sql\">SELECT CONCAT(\n           &#39;Truck &#39;, REGNUM,\n           &#39; has been used for &#39;, TOTAL_TRIPS,\n           &#39; trips.&#39;\n       ) AS MESSAGE_TEXT\nFROM MESSAGE;\n\u003c/code>\u003c/pre>\n"},{"number":"3","goal":"提交未提交修改","steps":["make permanent在事务题中对应COMMIT。","按题目顺序在检查输出之后列出COMMIT。","说明MySQL普通CTAS有隐式提交，不能把此COMMIT描述成它首次永久建表的唯一条件。"],"check":"知道题面操作与MySQL implicit commit的区别。","pitfall":"把所有DDL都当成可以由后续ROLLBACK恢复会产生错误。","mainType":"ddl-dml","knowledge":["transaction"],"taskBrief":"区分修改表结构与修改行；遵守数值边界、外键和执行次序。","input":"共享Transport schema与题面条件","output":"提交未提交修改","examTips":["知道题面操作与MySQL implicit commit的区别。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。 "projection","count","group","having","keys","constraints","concat","transaction","ddl","dml"],"types":["ddl-dml"],"requiredSkills":["SELECT / projection / 选择输出列","COUNT / grain / 计数与计数单位","GROUP BY / aggregate / 分组与聚合","HAVING / 聚合后的筛选","Primary / candidate / foreign key / 主键、候选键与外键","CHECK / UNIQUE / NOT NULL / 值限制、唯一与必填","CONCAT / column alias / 合成姓名与输出列别名","COMMIT / ROLLBACK / 提交与回滚","ALTER TABLE / 修改表结构","INSERT / UPDATE / DELETE / 增加、修改和删除行"],"questionHTML":"\u003cp>Assume, that we would like to verify the following logical consistency constraint imposed on the contents of a sample database.\u003c/p>\n\u003cp>&quot;A truck cannot be used for more that 100 trips&quot;\u003c/p>\n\u003cp>Write SQL statements that perform the following actions.\u003c/p>\n\u003cp>(1) First, create a relational table MESSAGE with information about the contents of a sample database that violate the following consistency constraint listed above. A relational table MESSAGE must consist of two columns. The first column contains truck registration numbers and the second column contains the total number of trips for all trucks that have been used for more than 100 trips.\u003c/p>\n\u003cp>(2) Next, list the contents of a relational table MESSAGE in the following way.\u003c/p>\n\u003cp>Truck &lt;insert ruck registration number here&gt; has been used for &lt;insert total number of trips here&gt; trips.\u003c/p>\n\u003cp>For example, if a truck with registration number PKR856 has been used 120 times then the following line must be listed.\u003c/p>\n\u003cp>Truck PKR856 has been used for 120 trips.\u003c/p>\n\u003cp>(3) Next, make the contents of a relational table MESSAGE permanent.\u003c/p>\n\u003cp>(4) Finally, drop a relational table MESSAGE.\u003c/p>\n","translationHTML":"\u003cp>希望检查以下数据库逻辑一致性限制：“一辆Truck不能用于超过100次Trip。”\u003c/p>\n\u003cp>(1) 首先创建MESSAGE表，保存违反该限制的信息。表必须只有两列：Truck的REGNUM，以及该Truck的Trip总数。只保存Trip总数大于100的Truck。\u003c/p>\n\u003cp>(2) 按指定句式显示MESSAGE内容：Truck后接注册号，再接has been used for、次数及trips.。例如Truck PKR856 has been used for 120 trips.。尖括号中的文字是待填值说明，不是要原样输出的内容。\u003c/p>\n\u003cp>(3) 使MESSAGE中的数据成为永久保存的内容，即提交当前事务。\u003c/p>\n\u003cp>(4) 最后删除MESSAGE表。\u003c/p>\n"},{"id":"A1-T1","title":"Assignment 1 — Task 1","topic":"图书馆概念建模","areas":["Conceptual"],"source":"assignment-1","sourceLabel":"Assignment 1","sourceNote":"Assignment1.pdf pp3–4","origin":"Original material","priority":"A","question":"Consider a local library that wants to maintain information about its books and authors. The  following business rules apply: \n• Each Book has ISBN, Title, Edition, and Publication Year. ISBN uniquely identifies a  book. \n• Each Author has AuthorID, FirstName, and LastName. AuthorID uniquely identifies an  author. \n• A book is written by one or more authors. \n• An author may write zero or more books. \n• The library may own multiple copies of the same book. \n• Each Copy has CopyID, and Status (e.g., Available or On Loan). CopyID uniquely  identifies a copy.  \n• Each Copy represents exactly one Book. \n• Each Member has MemberID, FirstName, LastName, and Email. MemberID uniquely  identifies a member. \n• A Member may borrow zero or more Copies. A Copy may be borrowed by at most one  Member at a time.  Using the CSIT115 Palette in UMLet, create a conceptual schema that satisfies the requirements  above. Your diagram must include all required entities with their specified attributes and correct  multiplicity (cardinality).  Finally, add one meaningful attribute to one of the classes that is not listed above. The attribute  should be appropriate for the scenario and the custom attribute you create must end with your  Student ID (e.g., `Genre_1234567`).","context":"","canonical":null,"parts":[{"number":"1","goal":"把书目、实体副本、作者与会员分开建模","steps":["同一种书的ISBN、Title、Edition、PublicationYear属于BOOK；图书馆实际持有的某一本属于COPY，有CopyID和Status。","AUTHOR用AuthorID、MEMBER用MemberID识别；COPY的CopyID按文字是全局唯一。","BOOK到AUTHOR：每书目至少一作者，作者可暂未有书目。BOOK到COPY：每副本只对应一书目，一书目可有多副本。","MEMBER到COPY：会员可借零到多本；同一副本同一时刻至多借给一人。原题只表达当前借阅，不擅加历史LoanID。","最后按这道作业特有要求，增加一项有意义且带本人学号后缀的attribute。不能把这个要求套进禁止额外属性的医院题。"],"check":"图中有四类、全部原属性、identifiers与双向multiplicities。","pitfall":"随附参考图若把CopyID当局部编号，仍须保留文字声明的唯一性。","mainType":"conceptual","knowledge":["entity","identifier","multiplicity","association"],"taskBrief":"把业务说明中的对象、属性、唯一性和数量画成完整概念图。","input":"英文题面和给定图／FD","output":"把书目、实体副本、作者与会员分开建模","examTips":["图中有四类、全部原属性、identifiers与双向multiplicities。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["随附参考图若把CopyID当局部编号，仍须保留文字声明的唯一性。"],"tables":[],"knowledgeUses":{"entity":"图中有四类、全部原属性、identifiers与双向multiplicities。","identifier":"图中有四类、全部原属性、identifiers与双向multiplicities。","multiplicity":"图中有四类、全部原属性、identifiers与双向multiplicities。","association":"图中有四类、全部原属性、identifiers与双向multiplicities。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先找需要单独记录的对象类别，再把属性放回所属类别。","圈出唯一性与局部号码；是否允许新增属性要看原题，不能自行发明标识。","每条关联向两个方向读数量；检查泛化箭头是否指向父类。"],"referenceHTML":"\u003cp>ISBN, AuthorID, CopyID and MemberID are identifiers. CopyID is globally unique as stated in the specification. Each book has at least one author. Each copy refers to one book. A member may borrow many copies, and a copy has at most one current borrower. Add one meaningful attribute with the required student-ID suffix. The supplied solution uses a qualified CopyID; preserve the stated global uniqueness explicitly when using that notation.\u003c/p>\n\u003cfigure class=\"diagram\">\u003cdiv class=\"diagram-scroll\">\n\n\u003c!-- Generated by graphviz version 14.1.3 (20260303.0454)\n -->\n\u003c!-- Title: G Pages: 1 -->\n\u003cp>\u003csvg width=\"722pt\" height=\"324pt\"\n viewBox=\"0.00 0.00 722.00 324.00\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n\u003cg id=\"g6-graph0\" class=\"graph\" transform=\"scale(1 1) rotate(0) translate(28.8 295)\">\u003c/p>\n\u003ctitle>G\u003c/title>\n\u003c!-- AUTHOR -->\n\u003cg id=\"g6-node1\" class=\"node\">\n\u003ctitle>AUTHOR\u003c/title>\n\u "#52695d\" d=\"M377.33,-58.01C435.11,-63.13 534.16,-71.92 587.88,-76.69\"/>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"525.04\" y=\"-75.32\" font-family=\"Arial\" font-size=\"10.00\">borrows\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"561.56\" y=\"-83.24\" font-family=\"Arial\" font-size=\"10.00\">0..*\u003c/text>\n\u003ctext xml:space=\"preserve\" text-anchor=\"middle\" x=\"403.65\" y=\"-45.46\" font-family=\"Arial\" font-size=\"10.00\">0..1\u003c/text>\n\u003c/g>\n\u003c/g>\n\u003c/svg>\n\u003c/div>\u003cfigcaption>同一个ID标签表示组合identifier；不同ID标签表示独立identifier。空心箭头指向父类。 [0..1]可选，[*]多值，/表示derived attribute。\u003c/figcaption>\u003cbutton class=\"zoom\" type=\"button\">放大图\u003c/button>\u003c/figure>"}],"tags":["Classes, attributes and identifiers"],"legacyPriority":"core","level":"A","archived":false,"originType":"Official Assignment","mainType":"conceptual","related":[],"examRelevance":"教师作业／模拟原题：完整保留","coverageStatus":"covered","questionZh":"为本地图书馆设计conceptual schema。以下业务规则均需保留。\n\n每个Book有ISBN、Title、Edition和Publication Year；ISBN唯一识别Book。每个Author有AuthorID、FirstName和LastName；AuthorID唯一识别Author。一本Book由至少一位Author撰写；一位Author可撰写零本或多本Book。\n\n图书馆可持有同一Book的多份Copy。每份Copy有CopyID和Status（例如Available或On Loan）；CopyID唯一识别Copy。每份Copy恰好代表一本Book。\n\n每位Member有MemberID、FirstName、LastName和Email；MemberID唯一识别Member。一位Member可借零份或多份Copy；一份Copy在同一时刻至多由一位Member借阅。\n\n使用UMLet的CSIT115 Palette绘图。图中必须包含全部指定对象、attributes及正确multiplicities。最后给某个类增加一个题面未列出的、有实际意义的attribute；其名称必须以自己的Student ID结尾，例如Genre_1234567。这个自选要求属于原作业，不能漏掉。","imageGlossary":"Book 书目；Author 作者；Copy 实体副本；Member 会员。ISBN 国际标准书号；AuthorID 作者标识；CopyID 副本标识；MemberID 会员标识。Title 书名；Edition 版次；PublicationYear 出版年份；FirstName 名；LastName 姓；Status 当前状态；Email 邮箱属性。writes 撰写；has 拥有；borrows 借阅。ID1 标识；0..1 零个或一个；0..* 零个或多个；1..* 至少一个。随附图中的Email_1234567是带学号后缀的自定义属性名示例，不是邮箱地址。","answerOrigin":{"kind":"independently-derived","label":"独立推导参考答案；不是教师官方评分表"},"providedAnswer":{"label":"课程目录随附Solution.pdf，Task 1图；作者未独立核实","image":"assets/provided-a1-task1.png","note":"附图把CopyID画为qualifier；题面同时声明CopyID唯一。本版显式保留全局唯一条件，不能因临摹图而丢掉该限制。"},"knowledge":["entity","identifier","multiplicity","association"],"types":["conceptual"],"requiredSkills":["Class / attribute / 对象类别与属性","Identifier / 唯一标识","Multiplicity / 关联两端的数量范围","Many-to-many / association attribute / 多对多与关联属性"],"questionHTML":"\u003cp>Consider a local library that wants to maintain information about its books and authors. The  following business rules apply: \n• Each Book has ISBN, Title, Edition, and Publication Year. ISBN uniquely identifies a  book. \n• Each Author has AuthorID, FirstName, and LastName. AuthorID uniquely identifies an  author. \n• A book is written by one or more authors. \n• An author may write zero or more books. \n• The library may own multiple copies of the same book. \n• Each Copy has CopyID, and Status (e.g., Available or On Loan). CopyID uniquely  identifies a copy.\u003cbr>• Each Copy represents exactly one Book. \n• Each Member has MemberID, FirstName, LastName, and Email. MemberID uniquely  identifies a member. \n• A Member may borrow zero or more Copies. A Copy may be borrowed by at most one  Member at a time.  Using the CSIT115 Palette in UMLet, create a conceptual schema that satisfies the requirements  above. Your diagram must include all required entities with their specified attributes and correct  multiplicity (cardinality).  Finally, add one meaningful attribute to one of the classes that is not listed above. The attribute  should be appropriate for the scenario and the custom attribute you create must end with your  Student ID (e.g., \u003ccode>Genre_1234567\u003c/code>).\u003c/p>\n","translationHTML":"\u003cp>为本地图书馆设计conceptual schema。以下业务规则均需保留。\u003c/p>\n\u003cp>每个Book有ISBN、Title、Edition和Publication Year；ISBN唯一识别Book。每个Author有AuthorID、FirstName和LastName；AuthorID唯一识别Author。一本Book由至少一位Author撰写；一位Author可撰写零本或多本Book。\u003c/p>\n\u003cp>图书馆可持有同一Book的多份Copy。每份Copy有CopyID和Status（例如Available或On Loan）；CopyID唯一识别Copy。每份Copy恰好代表一本Book。\u003c/p>\n\u003cp>每位Member有MemberID、FirstName、LastName和Email；MemberID唯一识别Member。一位Member可借零份或多份Copy；一份Copy在同一时刻至多由一位Member借阅。\u003c/p>\n\u003cp>使用UMLet的CSIT115 Palette绘图。图中必须包含全部指定对象、attributes及正确multiplicities。最后给某个类增加一个题面未列出的、有实际意义的attribute；其名称必须以自己的Student ID结尾，例如Genre_1234567。这个自选要求属于原作业，不能漏掉。\u003c/p>\n\u003cdetails>\u003csummary>图中文字逐项对照\u003c/summary>\u003cp>Book 书目；Author 作者；Copy 实体副本；Member 会员。ISBN 国际标准书号；AuthorID 作者标识；CopyID 副本标识；MemberID 会员标识。Title 书名；Edition 版次；PublicationYear 出版年份；FirstName 名；LastName 姓；Status 当前状态；Email 邮箱属性。writes 撰写；has 拥有；borrows 借阅。ID1 标识；0..1 零个或一个；0..* 零个或多个；1..* 至少一个。随附图中的Email_1234567是带学号后缀的自定义属性名示例，不是邮箱地址。\u003c/p>\n\u003c/details>"},{"id":"A1-T2","title":"Assignment 1 — Task 2","topic":"修正大学概念模型","areas":["Conceptual"],"source":"assignment-1","sourceLabel":"Assignment 1","sourceNote":"Assignment1.pdf pp3–4","origin":"Original material","priority":"A","question":"The university has the following business rules. \n \n1. Each lecturer has a Staff ID, First Name, Last Name and Email.  \n2. Each student has a Student ID, First Name, Last Name and Email and every student is either  an Undergraduate student or a Postgraduate student. An undergraduate student has an  additional attribute GPA and a postgraduate student has an additional attribute Thesis Title. \n3. Each subject has a Code, Title and Credits.  \n4. Each subject is offered by one department with an attribute Name. \n5. Each classroom has a Room Number, Building and Capacity.  \n6. A lecturer may teach up to four subjects in a semester.  \n7. Each subject must be taught by at most two lecturers and is held in one classroom. \n8. A student may enrol in zero or more subjects.  \n9. A classroom may be used for zero or more subjects.    Correct the conceptual schema by fixing all errors in entity representation, inheritance notation,  and multiplicities so that it accurately represents the business rules above.\n\n![Original conceptual schema](assets/assignment-1-task-2.png)","context":"","canonical":null,"parts":[{"number":"1","goal":"按业务文字逐项纠正错误图","steps":["以文字为标准，而不是把错误图上的端点数量当作事实；补齐UNDERGRADUATE、DEPARTMENT和CLASSROOM.RoomNumber。","本科生和研究生继承STUDENT；空心三角指向父类，GPA与ThesisTitle留在各自子类。","一讲师每学期可教0–4科，数量写在SUBJECT端；每科最多2名讲师，数量写在LECTURER端。随附参考图采用0..2，本版依此展示，不自行增加下限1。","每科恰在一教室，教室可用于0到多科；每科由一系开设，系独立用Name描述。","学生选课为0到多；检查StaffID、StudentID、Code及教室标识假设。保留所有原属性，不把图中错误DepartmentName当作唯一修复方式。"],"check":"方向、上下限、缺失类与缺失属性都得到修正。","pitfall":"“最多四门”不是恰好四门，关联端点也不能按句子主语位置直接填。","mainType":"conceptual","knowledge":["entity","identifier","multiplicity","association","generalization"],"taskBrief":"把业务说明中的对象、属性、唯一性和数量画成完整概念图。","input":"英文题面和给定图／FD","output":"按业务文字逐项纠正错误图","examTips":["方向、上下限、缺失类与缺失属性都得到修正。","按原题指定的实现形式作答；不以另一种结果相同的写法代替明确要求。"],"commonMistakes":["“最多四门”不是恰好四门，关联端点也不能按句子主语位置直接填。"],"tables":[],"knowledgeUses":{"entity":"方向、上下限、缺失类与缺失属性都得到修正。","identifier":"方向、上下限、缺失类与缺失属性都得到修正。","multiplicity":"方向、上下限、缺失类与缺失属性都得到修正。","association":"方向、上下限、缺失类与缺失属性都得到修正。","generalization":"方向、上下限、缺失类与缺失属性都得到修正。"},"sqlPlan":[],"validation":"静态／人工复核；未在MySQL执行。","hints":["先找需要单独记录的对象类别，再把属性放回所属类别。","圈出唯一性与局部号码；是否允许新增属性要看原题，不能自行发明标识。","每条关联向两个方向读数量；检查泛化箭头是否指向父类。"],"referenceHTML":"\u003cp>Use the corrected classes and attributes below. Undergraduate and Postgraduate specialize Student. Follow the supplied solution&#39;s 0..2 at the Lecturer end and 0..4 at the Subject end. Each subject belongs to one Department and one Classroom. Student–Subject is many-to-many. The supplied solution identifies a classroom by (RoomNumber, Building); uniqueness of department name is an explicit modelling assumption.\u003c/p>\n\u003cfigure class=\"diagram\">\u003cdiv class=\"diagram-scroll\">\n\n\u003c!-- Generated by graphviz version 14.1.3 (20260303.0454)\n -->\n\u003c!-- Title: G Pages: 1 -->\n\u003cp>\u003csvg width=\"660pt\" height=\"568pt\"\n viewBox=\"0.00 0.00 660.00 568.00\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www
