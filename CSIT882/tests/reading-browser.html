<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSIT882 · 浏览器验收</title>
<style>body{font:16px/1.6 system-ui;margin:1rem;color:#18342c}iframe{width:390px;height:844px;border:1px solid #ccc;max-width:100%}pre{white-space:pre-wrap}</style>
<h1>读题工作台浏览器验收</h1><p>使用本次验收专属的临时记录，打开实际发布的构建，检查手机宽度下的作答流程。</p>
<output id="status">正在载入…</output><pre id="report"></pre><iframe id="phone" title="手机尺寸测试窗口"></iframe>
<script type="module">
const params=new URLSearchParams(location.search);
const fixture=params.get('fixture');
const keys=['csit882-workbench-v2','csit882-question-bank-20261103','csit882-workbench-legacy-backup'];
if(fixture && /^[a-z0-9-]+$/.test(fixture)){
  let html=await (await fetch('../index.html',{cache:'no-store'})).text();
  for(const key of keys)html=html.replaceAll(key,'qa-'+fixture+'-'+key);
  // The fixture lives one directory below the application, including its image paths.
  html=html.replaceAll('assets/','../assets/');
  document.open();document.write(html);document.close();
}else{
  const id=crypto.randomUUID(),storageKey=key=>'qa-'+id+'-'+key;
  const phone=document.querySelector('#phone'),status=document.querySelector('#status'),report=document.querySelector('#report');
  const doc=()=>phone.contentDocument;
  const el=selector=>{const node=doc().querySelector(selector);if(!node)throw Error('找不到 '+selector);return node};
  const click=s=>el(s).click();
  const type=(s,text)=>{const field=el(s);field.value=text;field.dispatchEvent(new Event('input',{bubbles:true}));};
  const verify=(label,result)=>{if(!result)throw Error(label);report.textContent+='通过　'+label+'\n';};
  async function waitFor(test){const end=Date.now()+12000;while(Date.now()<end){if(test())return;await new Promise(resolve=>setTimeout(resolve,40));}throw Error('等待超时');}
  async function load(hash=''){
    const query='?fixture='+id+'&test='+Math.random();
    phone.src='reading-browser.html'+query+hash;
    await waitFor(()=>phone.contentWindow.location.search===query&&!!phone.contentWindow.CSIT882);
  }
  async function run(){
    await load();click('#start-basics');
    verify('首次进入 A3-T2(1)，英文可见、译文折叠',el('#panel-reading').innerText.includes('between 150.00 and 220.00')&&!el('#panel-reading').innerText.includes('150.00与220.00'));
    type('[data-read-input="0"]','编号、标题、类别、费用');
    click('#check-reading');
    verify('能先核对原文，独立答案仍隐藏',el('#panel-reading').innerText.includes('SELECT 对应')&&!el('#panel-reading').innerText.includes('SELECT workshopNo, title, category, fee'));
    await load('#a3-t2');
    verify('刷新恢复读题阶段、核对状态与中文草稿',el('#tab-reading').getAttribute('aria-selected')==='true'&&el('[data-read-input="0"]').value.includes('标题')&&!!el('.read-check'));
    click('#read-independent');verify('独立编辑器空白',el('#draft').value==='');
    click('#panel-practice [data-study="M1-Q3:1"]');click('#check-reading');click('#read-independent');
    verify('同类题 M1-Q3(1) 可独立作答',el('#question-heading').innerText.includes('M1-Q3')&&el('#draft').value==='');
    type('#draft','SELECT REGNUM FROM TRUCK WHERE CAPACITY BETWEEN 100 AND 500;');click('#save-attempt');
    click('[data-module="exam"]');click('#continue');
    verify('继续学习回到上次独立作答',el('#tab-practice').getAttribute('aria-selected')==='true'&&el('#draft').value.includes('BETWEEN'));
    click('[data-module="exam"]');click('#dashboard [data-study="A1-T1:1:copy"]');
    verify('单句练习未展示整图',el('.read-stem').innerText.trim()==='Each Copy represents exactly one Book.'&&!doc().querySelector('#panel-reading img'));
    click('#check-reading');click('#panel-reading [data-study="A1-T1:1:book"]');click('#check-reading');
    const image=el('#panel-reading img');await waitFor(()=>image.complete&&image.naturalWidth>0);
    verify('手机宽度可见课程图局部，草稿框在窗口内',image.getBoundingClientRect().width>0&&el('[data-read-input]').getBoundingClientRect().right<=phone.clientWidth+1&&doc().documentElement.scrollWidth<=phone.clientWidth+1);
    click('#panel-reading [data-study="A1-T1:1"]');
    verify('局部返回完整 A1-T1',el('#panel-reading .read-stem').innerText.includes('must end with your'));
    click('[data-module="normalization"]');click('#part-list [data-part="3"]');
    verify('范式自测(4)没有显示具体键或最高范式',el('#tab-practice').getAttribute('aria-selected')==='true'&&!/keys为|最高3NF|The highest normal form is|Candidate keys:/.test(doc().body.innerText));
    click('#tab-reading');click('#check-reading');
    verify('范式读题核对仍不显示推导结论',!el('#panel-reading').innerText.includes('最高3NF')&&!el('#panel-reading').innerText.includes('AB、AC'));
    // Run the production export/import handlers. Capture the download locally for re-import.
    const win=phone.contentWindow;let exported;
    const make=win.URL.createObjectURL.bind(win.URL);win.URL.createObjectURL=blob=>{exported=blob;return make(blob)};
    const anchor=win.HTMLAnchorElement.prototype.click;
    win.HTMLAnchorElement.prototype.click=function(){if(!this.download)anchor.call(this)};
    click('#backup');click('#export');
    const backup=JSON.parse(await exported.text());
    verify('JSON 导出包含读题和独立作答',backup.records['A3-T2'].readings['1'].text0.includes('标题')&&backup.records['M1-Q3'].attempts[0].independent);
    const legacy={'A1-T1':{answer:'legacy diagram',done:true}};
    localStorage.removeItem(storageKey(keys[0]));localStorage.setItem(storageKey(keys[1]),JSON.stringify(legacy));
    await load();click('#backup');
    const data=new DataTransfer();data.items.add(new File([exported],'backup.json',{type:'application/json'}));
    el('#import').files=data.files;el('#import').dispatchEvent(new Event('change',{bubbles:true}));
    await waitFor(()=>!el('#dialog').open);
    verify('旧整题稿、旧勾选和导入的新读题稿共存',phone.contentWindow.CSIT882.records['A1-T1'].answer==='legacy diagram'&&phone.contentWindow.CSIT882.records['A3-T2'].readings['1'].text0.includes('标题')&&localStorage.getItem(storageKey(keys[1]))===JSON.stringify(legacy));
    for(const number of [1,2,3]){
      click('[data-module="mock"]');el('#paper').value='mock-'+number;el('#minutes').value='3';click('#start-exam');
      await waitFor(()=>el('#clock').innerText!=='00:03:00');
      click('[data-exam-index="1"]');type('#exam-answer','schema draft');click('#pause-exam');click('#pause-exam');
      const figure=el('.mock-question img');await waitFor(()=>figure.complete&&figure.naturalWidth>0);
      click('#finish-exam');verify('Mock '+number+' 计时、原图、导航、提交及复盘',el('#mock-view').innerText.includes('集中复盘')&&el('#mock-view').textContent.includes('schema draft'));
      click('#mock-back');
    }
  }
  try{await run();status.textContent='全部通过';}
  catch(error){status.textContent='未通过';report.textContent+=String(error);}
  finally{for(const key of keys)localStorage.removeItem(storageKey(key));}
}
</script></html>
