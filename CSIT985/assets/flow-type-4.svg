-width="3" /><polygon points="946.0,520.0 932.0,526.0 932.0,514.0" fill="#ad6a0a"/><path d="M600 603 C915 603 915 335 955 285" fill="none" stroke="#ad6a0a" stroke-width="3" /><polygon points="949.3777445720102,292.0278192849873 945.3172267629064,306.70815290251625 935.9468010495901,299.2118123318632" fill="#ad6a0a"/><polygon points="609.0,603.0 623.0,597.0 623.0,609.0" fill="#ad6a0a"/><path d="M955 125 C910 125 910 350 855 350" fill="none" stroke="#ad6a0a" stroke-width="3" /><polygon points="864.0,350.0 878.0,344.0 878.0,356.0" fill="#ad6a0a"/><polygon points="946.0,125.0 932.0,131.0 932.0,119.0" fill="#ad6a0a"/><rect x="655" y="533" width="204" height="26" rx="4" fill="#f6f8f3" fill-opacity=".96"/><text x="660" y="552" font-size="16" style="fill:#ad6a0a">4a 归档到O（跨Internet）</text><rect x="927" y="174" width="100" height="26" rx="4" fill="#f6f8f3" fill-opacity=".96"/><text x="932" y="193" font-size="16" style="fill:#ad6a0a">4b 外部访问</text><rect x="765" y="600" width="164" height="26" rx="4" fill="#f6f8f3" fill-opacity=".96"/><text x="770" y="619" font-size="16" style="fill:#ad6a0a">4b 校园Internet访问</text><rect x="300" y="578" width="300" height="57" rx="12" fill="white" stroke="#76988d"/><text x="450.0" y="606" text-anchor="middle" font-size="20" font-weight="600">校园参与终端组</text><text x="450.0" y="630" text-anchor="middle" font-size="15" fill="#527065">A / B / C / M；是分组，不是新设备</text><rect x="70" y="160" width="170" height="70" rx="12" fill="white" stroke="#76988d"/><text x="155.0" y="188" text-anchor="middle" font-size="20" font-weight="600">A楼：A</text><text x="155.0" y="212" text-anchor="middle" font-size="15" fill="#527065">计算服务器</text><rect x="70" y="295" width="170" height="70" rx="12" fill="white" stroke="#76988d"/><text x="155.0" y="323" text-anchor="middle" font-size="20" font-weight="600">B楼：B</text><text x="155.0" y="347" text-anchor="middle" font-size="15" fill="#527065">计算服务器</text><rect x="70" y="430" width="170" height="70" rx="12" fill="white" stroke="#76988d"/><text x="155.0" y="458" text-anchor="middle" font-size="20" font-weight="600">C楼：C</text><text x="155.0" y="482" text-anchor="middle" font-size="15" fill="#527065">计算服务器</text><rect x="370" y="190" width="220" height="75" rx="12" fill="white" stroke="#76988d"/><text x="480.0" y="218" text-anchor="middle" font-size="20" font-weight="600">主工程楼：M</text><text x="480.0" y="242" text-anchor="middle" font-size="15" fill="#527065">计算服务器 × 5</text><rect x="370" y="450" width="220" height="75" rx="12" fill="white" stroke="#76988d"/><text x="480.0" y="478" text-anchor="middle" font-size="20" font-weight="600">主工程楼：S</text><text x="480.0" y="502" text-anchor="middle" font-size="15" fill="#527065">存储服务器 × 2</text><rect x="680" y="310" width="175" height="85" rx="12" fill="white" stroke="#76988d"/><text x="767.5" y="338" text-anchor="middle" font-size="20" font-weight="600">外部访问：X</text><text x="767.5" y="362" text-anchor="middle" font-size="15" fill="#527065">服务器在校园内</text><rect x="955" y="90" width="205" height="70" rx="12" fill="white" stroke="#76988d"/><text x="1057.5" y="118" text-anchor="middle" font-size="20" font-weight="600">外部用户：U</text><text x="1057.5" y="142" text-anchor="middle" font-size="15" fill="#527065">校园边界外</text><rect x="955" y="250" width="205" height="70" rx="12" fill="white" stroke="#76988d"/><text x="1057.5" y="278" text-anchor="middle" font-size="20" font-weight="600">Internet</text><text x="1057.5" y="302" text-anchor="middle" font-size="15" fill="#527065">网络传输环境</text><rect x="955" y="480" width="205" height="80" rx="12" fill="white" stroke="#76988d"/><text x="1057.5" y="508" text-anchor="middle" font-size="20" font-weight="600">异地归档：O</text><text x="1057.5" y="532" text-anchor="middle" font-size="15" fill="#527065">校园边界外的存储</text><text x="30" y="692" font-size="16">假设：类型1为可能互通；类型3以X为目的；类型4以S为归档源。实际端点需按任务确认。</text><text x="30" y="720" font-size="16">X是应用服务器，不是所有业务的网关；没有给定速率、协议和物理路径，不据图猜测。</text><line x1="30" y1="751" x2="65" y2="751" stroke="#ad6a0a" stroke-width="4"/><text x="75" y="757" font-size="16">类型4</text></svg>